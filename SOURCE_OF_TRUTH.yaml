rules:
  - Nexora is the company and repository-level framework owner.
  - Nexora final vision and strategic handoff define company-level intent and must remain agent agnostic.
  - Agents must start framework loading from nexora-framework/00-start-here/FRAMEWORK_EXECUTION_SEQUENCE.yaml.
  - Every solution lives under projects/<project-slug>/.
  - Each project owns human-readable Markdown and machine-readable YAML for agent-executable project artifacts.
  - Project-specific artifacts must not be added directly at repository root.
  - Agents must load the Nexora framework first, then the target project source of truth.
  - Agents and users must use NEXORA_FRAMEWORK_USAGE_GUIDE.md as the human-facing operating guide for analysis and development handoff.
  - Agents must scan projects/ and validate project analysis status before implementation.
  - Agents must use nexora-framework/05-prompts/prompts/generic-project-lifecycle-prompts.yaml when a user requests generic analysis, validation or MVP development for a project folder.
  - Auxiliary prompts must support, not override, the generic lifecycle prompts and project source artifacts.
  - Agents must stop analysis when BUSINESS_REQUIREMENT.md is missing because it is requester-supplied source material.
  - HOP BUSINESS_REQUIREMENT.md is the reference business intake template for subsequent Nexora projects.
  - BUSINESS_REQUIREMENT.yaml must be derived from BUSINESS_REQUIREMENT.md using a documented transformation prompt.
  - Agents must resolve the latest BUSINESS_REQUIREMENT version before analysis, validation, planning or development.
  - Business requirement changes must produce impact, effort, timeline and cost assessment before changing derived artifacts or implementation.
  - Agent-executable project artifacts must prefer YAML machine-readable files; Markdown remains the human-readable companion.
  - Agents must not require agent-specific files, prompts, runtime features or vendor configuration.
  - HOP commercial product development must follow projects/healthcare-operations-platform/06-delivery/commercial-product/HOP_COMMERCIAL_PRODUCT_BACKLOG.yaml after MVP-MOD-001.
  - Nexora follows Model Driven Product Engineering; editable models are the durable source of truth.
  - HOP development must deliver Business Capability Packages as the primary development unit.
  - Modules are roadmap groupings and must not replace capability packages as source of truth.
  - Nexora projects that require migration must apply the Open Data Ingestion Standard.
  - HOP migration must support simple open ingestion formats that incumbent providers can reasonably export.
  - Nexora products that require commercial extensibility must apply the Product Marketplace Standard.
  - HOP optional commercial capabilities must use marketplace packages, tenant entitlements and package installation models.
  - Nexora projects must apply open-source-first technology selection before introducing new mandatory technologies.
  - Requester-proposed or existing project stacks must be validated against current stable or LTS open source market practice before implementation and during iterative quality gates.
  - Projects must define a stack-specific open source quality toolchain baseline and revisit it during backlog work, module closeout and release readiness.
  - Code-changing backlog items must produce security quality evidence with applicable open source tests, SAST/static analysis, dependency vulnerability checks, secrets scan, coverage and DAST when runnable surfaces exist.
  - Projects with runnable implementation must maintain an integrated local solution runbook under 09-operations/runbooks/ for human startup, validation and shutdown review.
  - Agents must update or explicitly confirm the integrated local solution runbook whenever runtime components, ports, environment variables, startup order or validation commands change.
  - Technology, framework, dependency and quality reviews must not be permanently constrained by the initial project stack; agents must register non-blocking modernization findings as technical debt and remediate gradually when affected components are touched.
  - Agents must capture reusable framework feedback under project 08-qa/framework-feedback/ and may propose central framework improvement backlog items without implementing them.
  - Nexora owns triage, priority and implementation of central framework improvement backlog items.
  - Generated artifacts must not be edited manually.
