artifact:
  id: NEXORA-SOT-001
  type: repository-source-of-truth-registry
  version: 0.44.0
  status: approved
sources:
  repository_readme: README.md
  repository_state: PROJECT_STATE.yaml
  agent_bootstrap: AGENT_BOOTSTRAP.md
  agent_agnostic_standard: nexora-framework/standards/agent-agnostic-standard.yaml
  company_profile: nexora-framework/01-enterprise/company/company-profile.yaml
  framework_readme: nexora-framework/README.md
  project_folder_standard: nexora-framework/standards/project-folder-standard.yaml
  documentation_standard: nexora-framework/standards/documentation-standard.yaml
  agent_to_mvp_recipe: nexora-framework/recipes/agent-to-mvp-recipe.yaml
  multi_project_structure_adr: nexora-framework/adr/ADR-024-multi-project-repository-structure.md
  project_template: nexora-framework/templates/project-template/
  projects_index: projects/README.md
  healthcare_operations_platform: projects/healthcare-operations-platform/
  hop_project_brief: projects/healthcare-operations-platform/PROJECT_BRIEF.md
  hop_ordered_development_guide: projects/healthcare-operations-platform/ORDERED_DEVELOPMENT_GUIDE.md
  hop_project_state: projects/healthcare-operations-platform/PROJECT_STATE.yaml
  hop_source_of_truth: projects/healthcare-operations-platform/SOURCE_OF_TRUTH.yaml
rules:
  - Nexora is the company and repository-level framework owner.
  - Every solution lives under projects/<project-slug>/.
  - Each project owns its PROJECT_BRIEF.md, PROJECT_STATE.yaml and SOURCE_OF_TRUTH.yaml.
  - Project-specific artifacts must not be added directly at repository root.
  - Agents must load the Nexora framework first, then the target project source of truth.
  - Agents must not require agent-specific files, prompts, runtime features or vendor configuration.
  - Generated artifacts must not be edited manually.
