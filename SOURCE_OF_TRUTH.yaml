rules:
  - Nexora is the company and repository-level framework owner.
  - Nexora final vision and strategic handoff define company-level intent and must remain agent agnostic.
  - Every solution lives under projects/<project-slug>/.
  - Each project owns human-readable Markdown and machine-readable YAML for agent-executable project artifacts.
  - Project-specific artifacts must not be added directly at repository root.
  - Agents must load the Nexora framework first, then the target project source of truth.
  - Agents and users must use NEXORA_FRAMEWORK_USAGE_GUIDE.md as the human-facing operating guide for analysis and development handoff.
  - Agents must scan projects/ and validate project analysis status before implementation.
  - Agents must use nexora-framework/prompts/generic-project-lifecycle-prompts.yaml when a user requests generic analysis, validation or MVP development for a project folder.
  - Auxiliary prompts must support, not override, the generic lifecycle prompts and project source artifacts.
  - Agents must stop analysis when BUSINESS_REQUIREMENT.md is missing because it is requester-supplied source material.
  - Agent-executable project artifacts must prefer YAML machine-readable files; Markdown remains the human-readable companion.
  - Agents must not require agent-specific files, prompts, runtime features or vendor configuration.
  - Generated artifacts must not be edited manually.
