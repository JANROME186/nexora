id: ARTIFACT-INVENTORY-001
type: artifact-inventory
owner: Knowledge Governance
status: draft
version: 0.34.0
policy: Baseline inventory. Full automated inventory will be generated by the Knowledge
  Compiler.
artifact_classes:
- SOURCE
- GENERATED
- DERIVED
- DEPRECATED
- ARCHIVED
known_source_roots:
- 01-enterprise
- 02-platform-definition
- 03-engineering
known_generated_roots:
- 04-generated
cleanup_required:
- path: legacy prompt files referencing GitHub Copilot only
  action: replace_with_agent_playbook_or_archive
- path: docs referencing Serverless First as mandatory
  action: replace_with_compute_agnostic
- path: docs referencing AWS services as architecture source
  action: replace_with_provider_adapter_terms
- path: generated markdown mixed with source docs
  action: move_to_04-generated_or_mark_source
