spring:
  application:
    name: hop-platform-foundation
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

hop:
  platform-foundation:
    version: 0.1.0-SNAPSHOT
  security:
    enforce-request-authorization: true
    local-fixture-enabled: true
    local-fixture-token: ${HOP_LOCAL_FIXTURE_TOKEN:local-dev-token}
    local-fixture-tenant-id: ${HOP_LOCAL_FIXTURE_TENANT_ID:tenant-local}
    local-fixture-branch-id: ${HOP_LOCAL_FIXTURE_BRANCH_ID:branch-local}
    local-fixture-user-id: ${HOP_LOCAL_FIXTURE_USER_ID:local-dev-fixture-user}
    local-fixture-role-code: ${HOP_LOCAL_FIXTURE_ROLE_CODE:ADMIN}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8080

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [tenantId=%X{tenantId:-}, userId=%X{userId:-}, traceId=%X{traceId:-}] %logger{36} - %msg%n"
