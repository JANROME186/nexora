spring:
  application:
    name: hop-platform-foundation
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

hop:
  platform-foundation:
    version: 0.1.0-SNAPSHOT

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
