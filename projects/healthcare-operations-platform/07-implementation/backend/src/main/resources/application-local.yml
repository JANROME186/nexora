spring:
  autoconfigure:
    exclude: []
  datasource:
    url: ${HOP_DB_URL:jdbc:postgresql://localhost:5432/hop}
    username: ${HOP_DB_USERNAME:hop}
    password: ${HOP_DB_PASSWORD:hop}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/platform-foundation/schema.sql

management:
  endpoint:
    health:
      show-details: when_authorized
