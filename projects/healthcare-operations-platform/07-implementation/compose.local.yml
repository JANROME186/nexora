services:
  postgres:
    image: postgres:16-alpine
    container_name: hop-local-postgres
    environment:
      POSTGRES_DB: ${HOP_POSTGRES_DB:-hop}
      POSTGRES_USER: ${HOP_POSTGRES_USER:-hop}
      POSTGRES_PASSWORD: ${HOP_POSTGRES_PASSWORD:-hop}
    ports:
      - "${HOP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - hop_postgres_data:/var/lib/postgresql/data
      - ./runtime/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HOP_POSTGRES_USER:-hop} -d ${HOP_POSTGRES_DB:-hop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hop-local-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${HOP_REDIS_PORT:-6379}:6379"
    volumes:
      - hop_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: hop-local-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${HOP_OTEL_GRPC_PORT:-4317}:4317"
      - "${HOP_OTEL_HTTP_PORT:-4318}:4318"
      - "${HOP_OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./runtime/local/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hop_postgres_data:
  hop_redis_data:
