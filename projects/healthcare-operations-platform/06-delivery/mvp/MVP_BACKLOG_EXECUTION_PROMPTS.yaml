artifact:
  id: HOP-MVP-BEP-001
  type: mvp-backlog-execution-playbook
  name: Healthcare Operations Platform MVP Backlog Execution Prompts
  version: 1.0.0
  status: approved
  human_readable: MVP_BACKLOG_EXECUTION_PROMPTS.md
  machine_readable: MVP_BACKLOG_EXECUTION_PROMPTS.yaml
  module: MVP-MOD-001

purpose: Enables any capable development agent to implement the MVP incrementally from a generic instruction.

prompt_hierarchy:
  primary_prompt: ../../../../nexora-framework/prompts/generic-project-lifecycle-prompts.yaml#prompts.mvp_development
  auxiliary_prompt: ../../../../nexora-framework/prompts/auxiliary-development-prompts.yaml
  role: This project-specific playbook defines HOP backlog order and completion criteria for MVP-MOD-001.
  conflict_rule: If this playbook conflicts with BUSINESS_REQUIREMENT.md, SOURCE_OF_TRUTH.yaml, PROJECT_STATE.yaml or the module package, stop and report the conflict.

generic_agent_instruction: >-
  Implement Healthcare Operations Platform MVP-MOD-001 using the project backlog execution playbook.
  Read projects/healthcare-operations-platform/06-delivery/mvp/MVP_BACKLOG_EXECUTION_PROMPTS.yaml
  and execute the first pending backlog item in the documented order.

non_negotiable_rules:
  - Work only from the definitions already present in the project.
  - Use the generic MVP development prompt as the primary instruction.
  - Do not modify BUSINESS_REQUIREMENT.md.
  - Do not create unnumbered folders at the project root.
  - Place implementation code under 07-implementation/.
  - Implement one backlog item at a time.
  - Do not skip backlog items unless PROJECT_STATE.yaml proves they are already complete.
  - If a required source file is missing, stop and report the exact missing file.
  - If definitions contradict each other, stop and report the contradiction before coding.
  - Update PROJECT_STATE.yaml only with real, verified progress.
  - Keep tests, QA notes or validation evidence aligned with 08-qa/.
  - Keep runtime or operational changes aligned with 09-operations/.

required_loading_order:
  - BUSINESS_REQUIREMENT.md
  - PROJECT_BRIEF.yaml
  - SOURCE_OF_TRUTH.yaml
  - PROJECT_STATE.yaml
  - ORDERED_DEVELOPMENT_GUIDE.yaml
  - 06-delivery/mvp/healthcare-operations-platform-mvp-framework.yaml
  - 06-delivery/mvp/modules/MVP-MOD-001-platform-foundation/module-definition.yaml
  - 06-delivery/mvp/modules/MVP-MOD-001-platform-foundation/domain-model.yaml
  - 06-delivery/mvp/modules/MVP-MOD-001-platform-foundation/api-contract.openapi.yaml
  - 06-delivery/mvp/modules/MVP-MOD-001-platform-foundation/database-migration-plan.yaml
  - 06-delivery/mvp/modules/MVP-MOD-001-platform-foundation/ui-screen-map.yaml
  - 06-delivery/mvp/modules/MVP-MOD-001-platform-foundation/security-and-audit-rules.yaml
  - 06-delivery/mvp/modules/MVP-MOD-001-platform-foundation/test-plan.yaml
  - 06-delivery/mvp/modules/MVP-MOD-001-platform-foundation/traceability.yaml

execution_order:
  - id: PF-BE-001
    title: Create backend project skeleton
  - id: PF-OPS-001
    title: Create local development compose profile
  - id: PF-BE-002
    title: Implement tenant, laboratory and branch commands
  - id: PF-BE-003
    title: Implement user account and role assignment baseline
  - id: PF-BE-004
    title: Implement append-only audit event recording
  - id: PF-FE-001
    title: Create employee portal administration screens
  - id: PF-APP-001
    title: Create mobile app foundation
  - id: PF-QA-001
    title: Add smoke and contract tests
  - id: MVP-MOD-001-CLOSEOUT
    title: Validate and close the module

base_prompt:
  role: Act as a senior development agent for Healthcare Operations Platform.
  instruction: Work inside the local repository and strictly respect the existing project definitions.
  rules:
    - Implement only the requested backlog item.
    - Place code in projects/healthcare-operations-platform/07-implementation/.
    - Do not modify projects/healthcare-operations-platform/BUSINESS_REQUIREMENT.md.
    - Do not add unnumbered folders at the project root.
    - If a required file is missing or definitions contradict each other, stop and report the issue.
    - Update implementation README files, tests and PROJECT_STATE.yaml only when the real implementation justifies it.

backlog_items:
  - id: PF-BE-001
    title: Create backend project skeleton
    objective: Create the backend skeleton for MVP-MOD-001 Platform Foundation.
    required_scope:
      - Java 21
      - Spring Boot 3.x
      - Spring Modulith
      - Hexagonal architecture
      - organization-management module
      - identity-access module
      - audit-compliance module
      - observability module
      - Base PostgreSQL configuration
      - Health check endpoint
      - Clear package structure per module
      - Minimum smoke test proving that the application starts
      - Backend README with run and test commands
    completion_criteria: The backend compiles, the smoke test passes, and the structure is ready for commands, APIs and persistence.
  - id: PF-OPS-001
    title: Create local development compose profile
    objective: Create the local development runtime.
    required_scope:
      - Docker Compose under 07-implementation/
      - PostgreSQL
      - Redis
      - Documented environment variables
      - Backend configuration for local PostgreSQL
      - Clear instructions to start and stop the local runtime
      - Minimal seed data if applicable
      - Updated implementation README with local execution steps
    completion_criteria: The local runtime starts, PostgreSQL and Redis are available, and the backend can connect using local configuration.
  - id: PF-BE-002
    title: Implement tenant, laboratory and branch commands
    objective: Implement the organization-management functional baseline for tenant, laboratory and branch.
    required_scope:
      - Entities or aggregates defined in domain-model.yaml
      - Use cases and commands to create and query tenant, laboratory and branch
      - Hexagonal repository ports
      - PostgreSQL persistence adapters
      - Database migrations aligned with database-migration-plan.yaml
      - REST endpoints aligned with api-contract.openapi.yaml
      - Applicable business validations
      - Domain events if defined
      - Minimum unit and integration tests
    completion_criteria: Tenant, laboratory and branch can be created and queried through the API with real persistence and passing tests.
  - id: PF-BE-003
    title: Implement user account and role assignment baseline
    objective: Implement the identity-access baseline for users, roles and initial authorization.
    required_scope:
      - UserAccount and role model according to domain-model.yaml
      - Local development authentication mode
      - Role assignment to users
      - Authorization policies according to security-and-audit-rules.yaml
      - REST endpoints aligned with api-contract.openapi.yaml
      - PostgreSQL persistence
      - Scope and role validations
      - Minimum authorization tests for allowed and denied access
    completion_criteria: Local authentication works, users have roles, protected endpoints enforce authorization, and tests validate permitted and denied access.
  - id: PF-BE-004
    title: Implement append-only audit event recording
    objective: Implement append-only audit recording for relevant Platform Foundation actions.
    required_scope:
      - AuditEvent model
      - Append-only persistence
      - Automatic audit events for tenant creation, laboratory creation, branch creation, user creation or role changes
      - Audit query API if defined
      - Audit security rules according to security-and-audit-rules.yaml
      - Tests proving audit events are recorded and cannot be modified
    completion_criteria: Critical actions generate persisted audit events that are queryable according to authorization and protected against modification.
  - id: PF-FE-001
    title: Create employee portal administration screens
    objective: Create the administrative web portal for Platform Foundation.
    required_scope:
      - React + TypeScript
      - Web implementation under 07-implementation/
      - Screens according to ui-screen-map.yaml
      - API client connected to backend endpoints
      - Loading, error and success states
      - Base navigation
      - Form validation
      - Minimum component or primary-flow tests
      - Updated README with run commands
    completion_criteria: The web portal can operate the base module functions against the local backend or a clearly documented mock.
  - id: PF-APP-001
    title: Create mobile app foundation
    objective: Create the base mobile app for Healthcare Operations Platform aligned with MVP-MOD-001.
    required_scope:
      - Mobile app under 07-implementation/
      - React Native, Expo or the simplest maintainable option compatible with the repository
      - Initial navigation
      - Local or baseline login screen
      - Local session handling
      - API client prepared to connect to the backend
      - Initial authenticated home screen
      - Structure prepared for future clinical and operational modules
      - README with run commands
    restriction: Do not implement functionality outside Platform Foundation scope.
    completion_criteria: The mobile app runs, supports a basic authentication flow, and is prepared to consume backend APIs.
  - id: PF-QA-001
    title: Add smoke and contract tests
    objective: Add the minimum quality suite for MVP-MOD-001.
    required_scope:
      - Backend smoke tests
      - Contract tests against api-contract.openapi.yaml
      - Endpoint tests for tenant, laboratory, branch, user, role and audit
      - Minimum web tests
      - Minimum mobile tests if the mobile app exists
      - Documentation for running tests
      - QA evidence or result summary under 08-qa/ when applicable
    completion_criteria: A minimum test suite validates that backend, contracts, web and mobile foundation work for the MVP-MOD-001 scope.

closeout:
  id: MVP-MOD-001-CLOSEOUT
  review:
    - PROJECT_STATE.yaml
    - SOURCE_OF_TRUTH.yaml
    - 06-delivery/mvp/modules/MVP-MOD-001-platform-foundation/traceability.yaml
    - 06-delivery/mvp/modules/MVP-MOD-001-platform-foundation/test-plan.yaml
    - 07-implementation/
    - 08-qa/
  confirmations:
    - Backend runs locally.
    - Web runs locally.
    - Mobile app runs locally.
    - Docker Compose starts local dependencies.
    - Minimum tests pass.
    - BUSINESS_REQUIREMENT.md was not modified.
    - No unnumbered folders were created at the project root.
    - The implementation respects MVP-MOD-001 definitions.
  success_action: Update PROJECT_STATE.yaml to indicate that MVP-MOD-001 is implemented and ready for functional validation.
  failure_action: Produce a concrete blocker list and do not mark the module complete.

progress_tracking_fields:
  - backlog_item_id
  - implementation_status
  - files_or_modules_created
  - validation_commands_executed
  - known_gaps_or_blockers
  - next_backlog_item_to_execute
