artifact:
  id: MVP-MOD-001-DB-001
  type: database-migration-plan
  name: MVP-MOD-001 Platform Foundation Database Migration Plan
  version: 1.0.0
  status: approved
  human_readable: database-migration-plan.md
  machine_readable: database-migration-plan.yaml
  module: MVP-MOD-001

schemas:
  - organization
  - identity
  - audit

initial_tables:
  - name: organization.tenants
    columns:
      - tenant_id
      - name
      - status
      - created_at
      - updated_at
  - name: organization.laboratories
    columns:
      - laboratory_id
      - tenant_id
      - name
      - status
      - created_at
      - updated_at
  - name: organization.branches
    columns:
      - branch_id
      - tenant_id
      - laboratory_id
      - name
      - status
      - created_at
      - updated_at
  - name: identity.user_accounts
    columns:
      - user_id
      - tenant_id
      - display_name
      - email
      - status
      - created_at
      - updated_at
  - name: identity.role_assignments
    columns:
      - role_assignment_id
      - user_id
      - role_code
      - scope_type
      - scope_id
      - created_at
      - created_by
  - name: audit.audit_events
    columns:
      - audit_event_id
      - occurred_at
      - tenant_id
      - actor_id
      - actor_type
      - action
      - subject_type
      - subject_id
      - metadata_json

rules:
  - Use UUID or ULID identifiers consistently.
  - Enforce foreign keys inside the same schema where possible.
  - Audit events are append-only.
  - Do not store secrets in application tables.
