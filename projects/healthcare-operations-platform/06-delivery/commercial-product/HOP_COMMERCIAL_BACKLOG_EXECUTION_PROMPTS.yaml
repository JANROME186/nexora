artifact:
  id: HOP-COM-PROMPTS-001
  type: backlog-execution-prompts
  name: HOP Commercial Backlog Execution Prompts
  version: 1.0.0
  status: approved
  human_readable: HOP_COMMERCIAL_BACKLOG_EXECUTION_PROMPTS.md
  machine_readable: HOP_COMMERCIAL_BACKLOG_EXECUTION_PROMPTS.yaml
  created_date: 2026-07-08
  owner: Nexora Product Architecture Team

rules:
  - These prompts are operational instructions only; source artifacts remain authoritative.
  - Agents must load YAML files before Markdown when both exist.
  - Agents must not continue if BUSINESS_REQUIREMENT.md is missing.
  - Agents must not require a vendor-specific agent, runtime, prompt extension or configuration.
  - Agents must prefer open source, self-hostable and standards-based technologies unless an ADR approves an exception.
  - Agents must produce security quality evidence for every code-changing backlog item.
  - Before feature implementation in any code-changing backlog item, agents must review 08-qa/technical-debt/technical-debt-index.yaml and resolve or materially reduce at least one open technical-debt item, unless no open debt exists.
  - As HOP advances, agents must increase technical-debt burn-down intensity; late module, release and commercial-readiness iterations must reduce multiple relevant debt items when open debt remains.
  - HOP cannot be marked commercially complete, GA-ready or finally closed while any technical debt item remains open.
  - Agents must run stack-appropriate checks for best practices, coding standards, duplicate code, complexity, OWASP or equivalent secure coding, dependency vulnerabilities across all severities, secrets, coverage and message externalization/i18n.
  - Agents must target at least 80 percent line coverage for every applicable delivered stack. If a stack is below 80 percent during an intermediate iteration, the previous measured coverage is the hard lower bound and coverage must never decrease.
  - If a changed stack remains below 80 percent line coverage, agents must target a 3 to 5 percentage point improvement in that iteration; smaller improvements require explicit justification, maximum meaningful in-scope tests and immediate coverage debt.
  - Agents must enforce enterprise product foundations before continuing customer-facing portal/app work: es-MX/en-US localization, language switching, IAM permission mapping, dynamic menus/actions, login/session context, product database deliverables, UX/UI design baseline, code documentation, persistence architecture and OpenAPI/contract-first generation review.
  - Agents must externalize new or changed user-facing text, validation copy, error prose, status labels, error codes and repeated magic values through message catalogs, constants, configuration or policy providers.
  - Agents must not close or advance a backlog item with passed_with_execution_limitation,
    closed_with_execution_limitation, not_executed mandatory gates, blocked toolchains,
    unsupported runtimes or blocked dependency/audit endpoints. Manual source review is only a
    compensating control and cannot replace executable tests, build, coverage, audit or required
    backend validation gates.
  - Agents must not claim done, finished, closed or ready for the next backlog until the
    verifiable HOP backlog closure audit passes and is recorded in evidence or handoff.
  - A valid HOP closure requires YAML parse, stale-pointer sweep, evidence-state sweep,
    git diff --check, synchronized PROJECT_STATE.yaml/SOURCE_OF_TRUTH.yaml/prompt/runbook/
    traceability pointers, matching command-output metrics, commit hash and clean git status.
  - Agents must execute capability packages in dependency order unless an explicit mock strategy is documented.
  - Agents must not manually create repetitive CRUD, DTO, controller, repository, SDK, Swagger, documentation or test artifacts when they can be generated from models.
  - Agents must update project registries and QA evidence before closing any backlog item.

required_context:
  repository_level:
    - ../../../../AGENT_BOOTSTRAP.md
    - ../../../../PROJECT_STATE.yaml
    - ../../../../SOURCE_OF_TRUTH.yaml
    - ../../../../nexora-framework/00-start-here/FRAMEWORK_EXECUTION_SEQUENCE.yaml
    - ../../../../nexora-framework/02-standards/standards/agent-agnostic-standard.yaml
    - ../../../../nexora-framework/02-standards/standards/model-driven-product-engineering-standard.yaml
    - ../../../../nexora-framework/02-standards/standards/capability-package-standard.yaml
    - ../../../../nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml
    - ../../../../nexora-framework/02-standards/standards/enterprise-product-foundation-standard.yaml
    - ../../../../nexora-framework/05-prompts/prompts/security-quality-gate-prompts.yaml
    - ../../../../nexora-framework/04-recipes/recipes/agent-to-mvp-recipe.yaml
  project_level:
    - ../../BUSINESS_REQUIREMENT.md
    - ../../PROJECT_BRIEF.yaml
    - ../../SOURCE_OF_TRUTH.yaml
    - ../../PROJECT_STATE.yaml
    - ../../01-product-definition/business-capabilities/bcm-001/business-capability-map.yaml
    - ../../01-product-definition/business-capabilities/bcm-002/capability-dependency-map.yaml
    - ../../02-domain-definition/domain-foundation/context-map/context-map.yaml
    - ../../02-domain-definition/domain-foundation/shared-kernel/shared-kernel.yaml
    - ../../02-domain-definition/domain-foundation/aggregates/aggregate-catalog.yaml
    - ../mvp/healthcare-operations-platform-mvp-framework.yaml
    - HOP_COMMERCIAL_PRODUCT_BACKLOG.yaml
    - HOP_QUALITY_ALIGNMENT_BACKLOG.yaml
    - HOP_ENTERPRISE_FOUNDATION_ALIGNMENT_BACKLOG.yaml

prompt_sequence:
  - id: HOP-COM-PROMPT-001
    name: Select next executable backlog item
    intent: Determine the next backlog item to execute using project state and commercial backlog dependency order.
    input:
      - ../../PROJECT_STATE.yaml
      - HOP_COMMERCIAL_PRODUCT_BACKLOG.yaml
    expected_output:
      - selected_module_id
      - selected_backlog_item_id
      - dependency_status
      - blocking_gaps
      - execution_plan
    prompt: |
      Load the HOP project state and HOP commercial product backlog.
      Select the next executable backlog item by dependency order.
      If any dependency is incomplete, stop and report the exact blocker.
      If the selected item changes code, load 08-qa/technical-debt/technical-debt-index.yaml and include the required debt-first action in the execution plan.
      If the selected item is a definition item, prepare the capability package modeling plan.
      If the selected item is an implementation item, verify that the definition package exists first.

  - id: HOP-COM-PROMPT-002
    name: Generate capability package models
    intent: Create all required capability package model artifacts before compilation or implementation.
    input:
      - HOP_COMMERCIAL_PRODUCT_BACKLOG.yaml
      - ../../01-product-definition/business-capabilities/bcm-001/business-capability-map.yaml
      - ../../01-product-definition/business-capabilities/bcm-002/capability-dependency-map.yaml
      - ../../02-domain-definition/domain-foundation/context-map/context-map.yaml
      - ../../02-domain-definition/domain-foundation/aggregates/aggregate-catalog.yaml
    expected_output:
      - capability-package.yaml
      - business-model.yaml
      - business-rules.yaml
      - processes.yaml
      - events.yaml
      - openapi-source.yaml
      - permissions.yaml
      - ui-model.yaml
      - mobile-model.yaml
      - test-model.yaml
      - observability-model.yaml
      - generation-plan.yaml
      - traceability.yaml
    prompt: |
      Generate the complete Capability Package model set for every capability in the selected HOP roadmap group.
      Use the commercial product backlog as sequencing context, BCM-001 for capabilities, BCM-002 for dependency profiles, and the domain foundation for bounded contexts and aggregate ownership.
      Place each package under 01-product-definition/business-capabilities/packages/.
      Do not implement code during this step.
      Do not manually define CRUD, DTO, controller, repository, SDK, Swagger, repetitive documentation or repetitive test artifacts as implementation work; capture them in generation-plan.yaml as generated outputs.
      Every machine-executable artifact must be YAML when applicable, with Markdown as the human companion.

  - id: HOP-COM-PROMPT-003
    name: Validate capability package models
    intent: Confirm that generated capability packages satisfy MDPE, traceability and agent-agnostic requirements.
    input:
      - selected_capability_package_folders
      - ../../SOURCE_OF_TRUTH.yaml
      - HOP_COMMERCIAL_PRODUCT_BACKLOG.yaml
    expected_output:
      - validation_report
      - missing_artifacts
      - traceability_gaps
      - agent_agnostic_findings
      - ready_for_compilation_decision
    prompt: |
      Validate the selected Capability Package model set.
      Confirm that all required artifacts exist, YAML is parseable, Markdown companion files exist where required, capabilities trace to BCM-001, dependencies trace to BCM-002, API surfaces are classified, and security/audit/test expectations are present.
      Confirm that generation-plan.yaml separates generated outputs from custom implementation points.
      Scan for named-agent dependencies or vendor-specific execution requirements.
      If any blocking gap exists, update the package before allowing compilation or implementation.

  - id: HOP-COM-PROMPT-004
    name: Compile and implement selected backlog item
    intent: Compile generated outputs and implement only custom rule points for one backlog item at a time.
    input:
      - selected_backlog_item
      - selected_capability_package_folders
      - ../../07-implementation
      - ../../08-qa
    expected_output:
      - code_changes
      - tests
      - security_quality_evidence_yaml
      - security_quality_evidence_md
      - qa_evidence_yaml
      - qa_evidence_md
      - registry_updates
    prompt: |
      Implement only the selected backlog item.
      Load the selected Capability Package models first and follow existing project implementation patterns.
      Before feature work, load ../../08-qa/technical-debt/technical-debt-index.yaml and resolve or materially reduce at least one open debt item using the framework selection order. If no open debt exists, record that explicitly in evidence.
      Determine whether the current HOP phase requires higher debt burn-down intensity. Early MVP work reduces at least one relevant debt item; module closeout, release preparation and late commercial work must reduce multiple relevant items when open debt remains.
      Generate repetitive platform artifacts from the models before writing custom code.
      Keep changes scoped to the selected backlog item.
      Externalize new or changed user-visible text, validation copy, error prose, status labels, error codes and repeated magic values through backend message bundles, frontend/mobile localization resources, constants, configuration or policy providers as appropriate.
      Add or update only generated tests or custom rule tests appropriate to the backend, web, mobile, portal, integration or operations scope.
      Run or document applicable open source security quality gates for the changed stack, including best practices, coding standards, duplicate code, complexity, SAST/static analysis, OWASP or equivalent secure-code rules, dependency vulnerability checks across all severities, secrets scan, coverage, message externalization/i18n review and DAST when a runnable surface exists.
      For OWASP Dependency-Check, use the configured local advisory database. Do not refresh/download the NVD database during ordinary backlog execution; that is a manual once-per-day responsibility of the project operator or security reviewer. Record the database path and freshness timestamp/date in evidence.
      Record current line coverage, previous iteration line coverage baseline and the 80 percent target for every changed stack. If current coverage is below 80 percent, it must not decrease below the previous baseline and the target gap must remain tracked as technical debt.
      Mandatory executable gates must actually run before closure. If Maven, Java, Node, npm,
      native packages, Docker, database services, network access or audit endpoints are missing or
      blocked, first attempt documented remediation or request approval. If still unavailable, mark
      the backlog blocked_by_environment or ready_for_external_validation, keep next_backlog_item on
      the current backlog item, write exact remediation commands, and stop. Do not use manual source
      review to convert an unexecuted mandatory gate into a pass.
      Do not close the backlog item with unresolved vulnerabilities of any severity, missing duplicate/complexity/OWASP analysis, coverage below the previous iteration baseline, missing debt-first action, or unexternalized user-facing messages/magic strings unless an immediate accepted-risk/debt disposition exists with owner and target backlog.
      Write security quality evidence under 08-qa/security-quality/<selected-backlog-item-id>/.
      Write QA evidence under 08-qa and update PROJECT_STATE.yaml and SOURCE_OF_TRUTH.yaml.
      Before closure, reconcile every backlog pointer and status registry that references the
      current or next backlog item, including PROJECT_STATE.yaml, SOURCE_OF_TRUTH.yaml,
      HOP_COMMERCIAL_BACKLOG_EXECUTION_PROMPTS.yaml, affected capability traceability.yaml files,
      local-solution-runbook.yaml/.md and any QA/security indexes. The current backlog item must
      be consistently closed, and the next_backlog_item pointer must match PROJECT_STATE.yaml.
      Run the verifiable HOP backlog closure audit before marking the item closed:
      - parse all HOP YAML outside dependency/build folders;
      - search stale active/current/next backlog ids, previous next-backlog ids and ready_for_next_backlog_item mismatches;
      - search changed evidence and registries for not_executed, failed, passed_with_execution_limitation, closed_with_execution_limitation, blocked_by_missing_toolchain, blocked_by_network and blocked_by_unsupported_runtime;
      - run git diff --check;
      - confirm tests, coverage, vulnerability and static-analysis numbers recorded in evidence match actual command output;
      - commit when all gates pass and commits are allowed;
      - confirm git status --short is clean after commit.
      If any audit item fails or is not run, do not claim completion, do not advance next_backlog_item, and report the item as incomplete or blocked with exact remediation steps.
      Stop before starting the next backlog item.

  - id: HOP-COM-PROMPT-005
    name: Close module
    intent: Validate and close a completed module before moving to the next dependency.
    input:
      - selected_module_folder
      - ../../PROJECT_STATE.yaml
      - ../../SOURCE_OF_TRUTH.yaml
      - ../../08-qa
    expected_output:
      - closeout_evidence_yaml
      - closeout_evidence_md
      - updated_project_state
      - updated_source_of_truth
      - next_module_recommendation
    prompt: |
      Close the selected HOP module.
      Validate all backlog items for the module, confirm all required tests and QA evidence are present, confirm traceability is complete, and update project state and source registries.
      Re-run or verify non-limited passed evidence for all required backend, frontend, mobile,
      contract, dependency, coverage, build and security gates, including debt-first execution,
      best-practice/standards, duplicate-code, complexity, OWASP/secure-code and message
      externalization/i18n reviews. Do not close the module or recommend
      the next module while any required gate is not_executed, passed_with_execution_limitation,
      closed_with_execution_limitation, blocked_by_missing_toolchain, blocked_by_network or
      blocked_by_unsupported_runtime.
      Confirm coverage did not decrease below the previous measured baseline for any applicable stack.
      Final HOP product closure is not allowed unless every applicable stack reaches at least 80
      percent line coverage and every technical-debt item is closed.
      Recommend the next module only after closeout evidence is written and all mandatory executable
      gates have passed or are explicitly not applicable.

validation_commands:
  yaml_parse:
    intent: Validate YAML syntax for source artifacts.
    command_template: "Parse all YAML files outside generated dependency folders and fail on syntax errors."
  registry_references:
    intent: Confirm source registries point to existing files or folders.
    command_template: "Validate SOURCE_OF_TRUTH.yaml and PROJECT_MANIFEST.yaml references."
  agent_agnostic_scan:
    intent: Confirm no artifact requires a specific named agent or vendor runtime.
    command_template: "Scan source artifacts for named-agent or vendor-specific requirements and resolve findings."
  security_quality_gate:
    intent: Confirm open-source-first and security quality checks were run or documented for code-changing work.
    command_template: "Run applicable open source tests, build, coverage, best-practice and standards checks, duplicate-code checks, complexity checks, SAST/static analysis, OWASP/secure-code checks, dependency vulnerability checks across all severities, secrets scan, message externalization/i18n review and DAST where applicable. For OWASP Dependency-Check or equivalent local-advisory-database tools, run the scanner against the local database available at execution time and record freshness; do not refresh/download the database unless explicitly assigned. Address at least one open technical-debt item before feature work unless no open debt exists; increase debt burn-down intensity as the project advances. Coverage target is 80 percent; if below target, do not allow coverage to drop below the previous measured baseline. If mandatory executable gates cannot run, stop as blocked_by_environment or ready_for_external_validation and do not advance next_backlog_item."
  verifiable_closure_audit:
    intent: Prevent false backlog closure and stale handoffs.
    command_template: "Before claiming completion, parse HOP YAML, sweep stale backlog pointers, sweep evidence/registries for limited or blocked gate states, run git diff --check, confirm evidence metrics match command output, commit when allowed, and verify git status --short is clean. If any item fails or is not run, keep next_backlog_item unchanged and report incomplete or blocked."
  git_whitespace:
    intent: Confirm no whitespace errors before commit.
    command_template: "Run repository whitespace validation before closing the item."

next_backlog_item:
  module_id: COM-MOD-012
  backlog_item_id: COM-MOD-012-BE-001
  name: Compile tenant operations, feature flags and operational controls
  expected_folder: 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/ and
    08-qa/qa/platform-hardening-and-saas-operations/
  paused_functional_backlog_item: null
  required_debt_first_action: null
  coverage_floor:
    backend_java_maven_line_coverage_percent_if_backend_is_touched: 83.99
    frontend_typescript_web_line_coverage_percent: 88.68
    mobile_typescript_foundation_line_coverage_percent: 99.21
    patient_portal_typescript_web_line_coverage_percent: 94.11
    doctor_portal_typescript_web_line_coverage_percent: 96.28
    public_website_typescript_web_line_coverage_percent: 98.61
    final_target_percent: 80
  mandatory_execution_notes:
    - Keep the implementation agent-agnostic; do not add vendor-specific agent/runtime dependencies.
    - Preserve coverage floors: backend (83.99%), employee portal (88.68%), mobile (99.21%), patient portal (94.11%), doctor portal (96.28%), and public website (98.61%).
    - Do not advance next_backlog_item if compiler, typecheck, automated tests, build or static-analysis gates cannot run.
    - Reconcile PROJECT_STATE.yaml, SOURCE_OF_TRUTH.yaml, this prompt file, capability traceability files and local runbook pointers before commit.
    - Review 08-qa/technical-debt/technical-debt-index.yaml before backend work and resolve or materially reduce at least one open item when applicable.
    - Compile the BCM-ORG-001/BCM-PLT-001/002/005/006/007/008/009 openapi-source.yaml operations into real Spring Modulith modules/controllers so the operational runbooks in 09-operations/runbooks/ (COM-MOD-012-OPS-002) stop being partially aspirational -- in particular, close each runbook's documented known_gaps_and_forward_pointers (a Prometheus-compatible metrics endpoint, tenant_id/user_id/trace_id MDC logging context, and distinct liveness/readiness actuator groups) where in scope for this backlog item.
  previous_backlog_item:
    backlog_item_id: COM-MOD-012-OPS-002
    status: closed
    summary: >-
      COM-MOD-012-OPS-002 closed clean. 10 executable runbook pairs (observability,
      health/readiness/liveness, metrics/logs/traces validation, backup, restore, incident
      response, rollback incident handoff, tenant-impact triage, evidence collection, post-incident
      review) plus an index README were added under 09-operations/runbooks/, built on
      production-deployment-strategy.yaml. Every local-executable command was cross-checked against
      real repository state (compose.local.yml, .env.example, application.yml,
      AuditComplianceController); unimplemented telemetry (Prometheus metrics, trace export) and
      unprovisioned shared-environment infrastructure were documented as
      known_gaps_and_forward_pointers rather than silently marked passed. TD-DB-004 was materially
      reduced via tenant-impact-triage-runbook.yaml's mandatory cross-tenant leakage check, an
      operational compensating control pending native Row Level Security. Capability traceability
      was updated for all 8 COM-MOD-012 capabilities. The work was definition-only, preserved
      coverage floors across all delivered stacks, passed YAML parse, stale-pointer sweep,
      agent-agnostic scan, secret scan and git diff --check, and advanced next_backlog_item to
      COM-MOD-012-BE-001.
