commercialization_objective:
  summary: Deliver HOP as a commercial healthcare operations product for diagnostic laboratory and imaging organizations.
  product_is_commercializable_when:
    - Core operational workflows run from tenant setup through result delivery.
    - Web employee portal, patient and doctor digital channels, mobile foundation and backend APIs are aligned.
    - Revenue, billing request, payments and reconciliation boundaries are usable by a real operation.
    - Security, audit, observability, supportability and deployment operations are production-ready.
    - Integration and migration boundaries allow customers to onboard without coupling HOP to legacy platforms.
    - Customer data can be ingested from simple open formats that any incumbent system provider can deliver without proprietary dependencies.
    - Optional product capabilities can be offered, purchased, entitled, installed and consumed through a marketplace-ready extension model.
    - Compliance, quality, documentation and customer enablement are sufficient for a paid pilot and general availability.
    - No technical debt remains open in 08-qa/technical-debt/.
    - Every applicable delivered stack has at least 80 percent line coverage.
    - No intermediate iteration decreases stack coverage below the previous measured baseline.
  explicit_boundaries:
    - Country-specific fiscal connectors are adapter implementations and must not block core billing request readiness.
    - AI features are commercial differentiators but cannot validate, release or amend clinical results.
    - Imaging may be delivered as an expansion package if the first commercial launch focuses on clinical laboratory operations.

mdpe_policy:
  architecture: Model Driven Product Engineering
  primary_development_unit: Business Capability Package
  roadmap_grouping_unit: module
  source_of_truth_rule: Models are the only durable editable source of truth.
  execution_flow:
    - model
    - compile
    - implement_rules
    - validate
    - release
  do_not_write_manually:
    - CRUD scaffolding
    - DTOs
    - Controllers
    - Repositories
    - Swagger documentation
    - SDKs
    - Repetitive documentation
    - Duplicate models
    - Repetitive test cases
  write_manually:
    - Business model
    - Business rules
    - Business processes
    - Domain decisions
    - OpenAPI source contracts
    - Non-generatable custom rule implementation
    - Compiler templates and generators
    - Architecture decisions

commercial_readiness_pillars:
  - id: CRP-001
    name: Operational completeness
    description: The product supports the diagnostic organization operating cycle across branches.
  - id: CRP-002
    name: Revenue readiness
    description: The product supports prices, payments, cash sessions, billing requests and reconciliation evidence.
  - id: CRP-003
    name: Digital channel readiness
    description: Patients, doctors and employees can interact through appropriate web and mobile surfaces.
  - id: CRP-004
    name: Compliance and audit readiness
    description: Clinical, financial and administrative actions are traceable, controlled and reviewable.
  - id: CRP-005
    name: SaaS and operations readiness
    description: The product can be deployed, monitored, supported, backed up and upgraded predictably.
  - id: CRP-006
    name: Integration and migration readiness
    description: External systems and legacy datasets pass through stable anti-corruption, simple-format ingestion, validation and reconciliation boundaries.
  - id: CRP-007
    name: Customer enablement readiness
    description: Onboarding, configuration, training, support and launch materials exist for customers.
  - id: CRP-008
    name: Expansion readiness
    description: Imaging, advanced quality and AI overlays can be added without rewriting the operational core.
  - id: CRP-009
    name: Marketplace readiness
    description: Product packages can be published, purchased, entitled, installed, activated, upgraded and consumed per tenant.

