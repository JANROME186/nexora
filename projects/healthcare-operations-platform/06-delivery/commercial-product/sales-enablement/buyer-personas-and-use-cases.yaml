personas:
  - id: BP-001
    name: Laboratory Director
    title: Director / General Manager
    organization_type: Clinical diagnostic laboratory (1 to 10 branches)
    decision_role: Primary decision maker for operational technology purchases.
    pain_points:
      - Fragmented systems for catalog, orders, results, billing, and inventory.
      - Manual processes for result validation and delivery.
      - Limited visibility across branches.
      - Difficulty migrating from legacy LIS without data loss.
      - High cost and vendor lock-in with current systems.
    goals:
      - Unify operations on a single platform.
      - Reduce turnaround time from sample to result.
      - Provide digital access for patients and referring doctors.
      - Maintain regulatory compliance with minimal manual effort.
    key_use_cases:
      - End-to-end diagnostic workflow from order to result delivery.
      - Multi-branch operations with centralized catalog and pricing.
      - Digital result delivery to patients and referring doctors.
      - Operational dashboards and audit trail.
    recommended_package: professional
    objections:
      - Needs proof of complete workflow before committing.
      - Concerned about data migration risk.

  - id: BP-002
    name: Quality Manager
    title: Quality Manager / Quality Assurance Lead
    organization_type: Regulated clinical laboratory or hospital laboratory department.
    decision_role: Influencer; drives quality and compliance technology requirements.
    pain_points:
      - Manual tracking of external quality controls and proficiency testing.
      - Paper-based or spreadsheet CAPA management.
      - Audit preparation requires manual evidence assembly.
      - Equipment calibration and maintenance tracking is fragmented.
    goals:
      - Digital management of internal and external quality controls.
      - Automated CAPA workflows with traceability.
      - One-click audit evidence generation.
      - Equipment and calibration lifecycle tracking.
    key_use_cases:
      - Internal QC with Levey-Jennings tracking.
      - External QC program participation and result recording.
      - CAPA initiation, investigation, and closure workflow.
      - Audit scheduling, execution, and evidence retention.
      - Equipment calibration and maintenance scheduling.
    recommended_package: enterprise
    objections:
      - Needs integration with existing proficiency testing providers.
      - Requires evidence that the platform meets accreditation requirements.

  - id: BP-003
    name: IT Manager
    title: IT Manager / Chief Technology Officer
    organization_type: Multi-branch laboratory network or hospital group.
    decision_role: Technical evaluator and implementation owner.
    pain_points:
      - Legacy systems are difficult to integrate and maintain.
      - Vendor lock-in to proprietary databases and infrastructure.
      - No API governance or rate limiting for external integrations.
      - Security and compliance auditing requires manual effort.
    goals:
      - Deploy on existing infrastructure without cloud provider lock-in.
      - Integrate with existing hospital systems (HIS, EHR) through standard APIs.
      - Implement observability and incident response procedures.
      - Ensure data migration from legacy systems is safe and reversible.
    key_use_cases:
      - Self-hosted deployment with Docker and PostgreSQL.
      - API management with rate limiting and partner key governance.
      - Data migration with dry-run validation and reconciliation.
      - Observability with Prometheus metrics and structured logging.
      - Backup, restore, and disaster recovery procedures.
    recommended_package: enterprise
    objections:
      - Needs to validate deployment on existing infrastructure.
      - Requires detailed API documentation and security architecture.

  - id: BP-004
    name: Chief Financial Officer
    title: CFO / Finance Director
    organization_type: Any diagnostic laboratory or healthcare organization.
    decision_role: Budget approver; evaluates ROI and total cost of ownership.
    pain_points:
      - High licensing and maintenance costs for legacy LIS systems.
      - Unpredictable customization and integration costs.
      - Manual financial reconciliation between laboratory and billing systems.
      - Cash session discrepancies require manual investigation.
    goals:
      - Predictable subscription-based pricing.
      - Integrated cashier and billing request management.
      - Reduced operational cost through automation.
      - Clear ROI with measurable time and cost savings.
    key_use_cases:
      - Cash session management with variance tracking.
      - Billing request automation through fiscal adapter boundaries.
      - Financial audit trail for all payment and billing transactions.
      - Multi-price-list support for different payers and insurance contracts.
    recommended_package: professional
    objections:
      - Needs TCO comparison with current system.
      - Wants to see ROI projections before committing.

  - id: BP-005
    name: Operations Manager
    title: Operations Manager / Branch Manager
    organization_type: Multi-branch diagnostic laboratory.
    decision_role: User champion; drives adoption and daily usage decisions.
    pain_points:
      - Disconnected workflows between front desk, laboratory, and cashier.
      - No real-time visibility into sample status and turnaround times.
      - Patient and doctor complaints about result delivery delays.
      - Training new staff on multiple disconnected systems.
    goals:
      - Unified front desk worklist for reception and order management.
      - Real-time sample tracking through the laboratory workflow.
      - Fast result delivery through digital channels.
      - Simple, consistent user experience for staff training.
    key_use_cases:
      - Reception worklist with walk-in and scheduled intake.
      - Diagnostic order creation with real-time pricing.
      - Sample tracking from collection through release.
      - Result notification to patients and referring doctors.
    recommended_package: professional
    objections:
      - Needs to see the employee portal in action before endorsing.
      - Concerned about change management and staff adoption.

open_source_first: true
agent_agnostic: true
no_proprietary_agent_dependencies: true
