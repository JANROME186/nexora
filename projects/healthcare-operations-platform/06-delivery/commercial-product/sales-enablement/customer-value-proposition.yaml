  id: HOP-CVP-001
  type: customer-value-proposition
  name: HOP Customer Value Proposition
  version: 1.0.0
  status: approved
  human_readable: customer-value-proposition.md
  machine_readable: customer-value-proposition.yaml
  backlog_item: COM-MOD-016-COM-001
  created_date: 2026-07-24
  owner: Nexora Commercial Team

project:
  name: Healthcare Operations Platform
  slug: healthcare-operations-platform
  module: COM-MOD-016
  release: REL-003

value_proposition:
  problem_statement: >-
    Diagnostic laboratories operate with fragmented systems that create operational
    inefficiency, manual errors, delayed result delivery, compliance risk, and high
    total cost of ownership. Legacy laboratory information systems are expensive,
    inflexible, and lock organizations into proprietary technology stacks.

  solution: >-
    The Nexora Healthcare Operations Platform (HOP) replaces fragmented legacy systems
    with a single, integrated, cloud-ready platform that covers the complete diagnostic
    laboratory operating cycle. Built on open-source-first principles, HOP is
    self-hostable, vendor-agnostic, and extensible through a marketplace model.

  benefits:
    operational:
      - title: Unified Operating Cycle
        description: One platform from catalog configuration through result delivery eliminates system fragmentation.
      - title: Reduced Turnaround Time
        description: Digital workflows and automated notifications accelerate sample-to-result delivery.
      - title: Multi-Branch Visibility
        description: Centralized catalog, pricing, and operations management across all branches.
      - title: Safe Data Migration
        description: Validated import from legacy systems using open formats with reconciliation.

    financial:
      - title: Predictable Subscription Pricing
        description: Transparent per-tier pricing replaces unpredictable licensing and customization costs.
      - title: Lower Total Cost of Ownership
        description: Open-source infrastructure eliminates proprietary database and middleware licensing.
      - title: Integrated Financial Controls
        description: Cash sessions, payment tracking, and billing request automation reduce financial leakage.

    quality_and_compliance:
      - title: Built-In Quality Management
        description: Internal and external QC, CAPA, calibration, and audit management in the same platform.
      - title: Full Traceability
        description: Every clinical and administrative action is auditable with append-only event recording.
      - title: Regulatory Readiness
        description: Separation of technical and medical validation, result amendment controls, and evidence retention.

    digital:
      - title: Patient and Doctor Channels
        description: Self-service portals and mobile app for result access, appointments, and notifications.
      - title: Public Discovery
        description: Public website for service catalog visibility and appointment/quotation requests.
      - title: Open API Ecosystem
        description: Standard APIs with governance, rate limiting, and partner key management.

  roi_indicators:
    - indicator: Reduction in manual data entry
      expected_impact: 40 to 60 percent reduction through digitized workflows and automated catalog-to-order pricing.
    - indicator: Faster result turnaround
      expected_impact: 20 to 30 percent improvement through digital validation, notification, and delivery.
    - indicator: Lower infrastructure cost
      expected_impact: 30 to 50 percent savings versus proprietary LIS licensing and database fees.
    - indicator: Reduced compliance preparation time
      expected_impact: 50 to 70 percent reduction through built-in quality management and audit evidence.
    - indicator: Staff training time
      expected_impact: 30 percent reduction through unified interface across all operational workflows.

  proof_points:
    - point: >-
        HOP covers 70+ business capabilities across 17 modules, from tenant setup through
        marketplace-ready extension packaging.
    - point: >-
        6 product surfaces (employee portal, patient portal, doctor portal, mobile app,
        public website, operations console) provide complete digital channel coverage.
    - point: >-
        Open-source-first architecture with zero proprietary cloud provider or database dependencies.
    - point: >-
        Built-in data migration capability supports CSV, JSON, XLSX, NDJSON, and ZIP formats
        with dry-run validation and reconciliation reports.
    - point: >-
        Quality management includes internal QC, external QC, CAPA, audit management,
        calibration, equipment, and maintenance tracking.

open_source_first: true
agent_agnostic: true
no_proprietary_agent_dependencies: true
