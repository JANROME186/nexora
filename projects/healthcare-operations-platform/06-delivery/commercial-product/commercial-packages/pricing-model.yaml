artifact:
  id: HOP-COM-PRICING-001
  type: commercial-pricing-model
  name: HOP Initial Pricing Model
  version: 1.0.0
  status: draft
  human_readable: pricing-model.md
  machine_readable: pricing-model.yaml
  backlog_item: COM-MOD-016-COM-001
  created_date: 2026-07-24
  owner: Nexora Commercial Product Team

project:
  name: Healthcare Operations Platform
  slug: healthcare-operations-platform
  module: COM-MOD-016
  release: REL-003

pricing_disclaimer: >-
  This is an initial pricing model for commercial planning and sales enablement purposes.
  Final pricing requires market validation, competitive analysis, and executive approval
  before commercial launch. All amounts are expressed in USD and are subject to regional
  adjustment, currency conversion, and local tax requirements.

pricing_strategy:
  model: subscription_with_volume_tiers
  billing_cycles:
    - monthly
    - annual (10% discount)
  currency: USD
  tax_handling: Tax exclusive; local tax applied at invoice per tenant jurisdiction.
  payment_terms: Net 30 for annual contracts; prepaid for monthly.

subscription_tiers:
  - tier: starter
    package: HOP-PKG-STARTER
    base_monthly_price_usd: 499
    included_users: 5
    additional_user_monthly_price_usd: 29
    included_monthly_orders: 2000
    overage_per_order_usd: 0.15
    included_branches: 1
    additional_branch_monthly_price_usd: 99
    setup_fee_usd: 1500
    minimum_contract_months: 12

  - tier: professional
    package: HOP-PKG-PROFESSIONAL
    base_monthly_price_usd: 1499
    included_users: 20
    additional_user_monthly_price_usd: 25
    included_monthly_orders: 10000
    overage_per_order_usd: 0.10
    included_branches: 3
    additional_branch_monthly_price_usd: 149
    setup_fee_usd: 5000
    minimum_contract_months: 12
    includes_onboarding_hours: 40
    includes_data_migration_package: true

  - tier: enterprise
    package: HOP-PKG-ENTERPRISE
    base_monthly_price_usd: custom
    pricing_model: custom_quote
    included_users: unlimited
    included_monthly_orders: unlimited
    included_branches: unlimited
    setup_fee_usd: custom
    minimum_contract_months: 24
    includes_onboarding_hours: 80
    includes_data_migration_package: true
    includes_dedicated_account_manager: true
    includes_custom_sla: true

volume_discounts:
  - threshold_monthly_orders: 25000
    discount_percent: 5
  - threshold_monthly_orders: 50000
    discount_percent: 10
  - threshold_monthly_orders: 100000
    discount_percent: 15

annual_prepayment_discount_percent: 10

add_on_pricing:
  - add_on: Data Migration Service
    description: Professional services for legacy data migration using BCM-PLT-010.
    pricing: Per project; typical range 2000 to 10000 USD depending on data volume and complexity.
    available_for: [starter, professional, enterprise]

  - add_on: Custom Integration Development
    description: Development of custom integration adapters (BCM-PLT-004) for third-party systems.
    pricing: Per integration; typical range 3000 to 15000 USD.
    available_for: [professional, enterprise]

  - add_on: Extended Training Package
    description: Additional instructor-led training hours beyond included onboarding.
    pricing: 150 USD per hour.
    available_for: [starter, professional, enterprise]

  - add_on: Premium Support Upgrade
    description: Upgrade from standard to priority or dedicated support tier.
    pricing: 20 percent of base subscription price per month.
    available_for: [starter, professional]

expansion_package_pricing:
  - expansion: HOP-EXP-IMAGING
    name: Imaging Operations
    pricing_model: Per tenant monthly add-on to Enterprise base.
    indicative_monthly_price_usd: custom_quote
    status: planned
    note: Pricing to be finalized when COM-MOD-014 is commercially available.

  - expansion: HOP-EXP-AI
    name: AI Overlay
    pricing_model: Per tenant monthly add-on to Enterprise base plus consumption-based AI inference.
    indicative_monthly_price_usd: custom_quote
    status: planned
    note: Pricing to be finalized when COM-MOD-015 is commercially available.

pilot_program:
  name: HOP Early Adopter Pilot
  description: >-
    Reduced-price pilot program for initial commercial customers to validate workflows,
    gather feedback, and establish reference cases before general availability.
  pilot_duration_months: 3
  pilot_discount_percent: 50
  pilot_exit_criteria:
    - Customer completes onboarding checklist (ONB-GUIDE-001 through ONB-GUIDE-008).
    - Customer processes at least 500 diagnostic orders through the full workflow.
    - Customer provides structured feedback on operational completeness and usability.
    - Zero unresolved P1 incidents during pilot period.

open_source_first: true
agent_agnostic: true
no_proprietary_agent_dependencies: true
