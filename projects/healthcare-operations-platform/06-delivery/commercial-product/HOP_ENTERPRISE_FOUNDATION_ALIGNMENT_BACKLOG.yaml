artifact:
  id: HOP-ENT-FOUND-BACKLOG-001
  type: enterprise-foundation-alignment-backlog
  name: HOP Enterprise Product Foundation Alignment Backlog
  version: 1.0.0
  status: active
  human_readable: HOP_ENTERPRISE_FOUNDATION_ALIGNMENT_BACKLOG.md
  machine_readable: HOP_ENTERPRISE_FOUNDATION_ALIGNMENT_BACKLOG.yaml
  owner: Nexora Product Architecture Team

purpose: >
  Pause functional development and align HOP with the updated Nexora Enterprise
  Product Foundation Standard before continuing MVP-MOD-007-PORTAL-001.

framework_sources:
  - ../../../../nexora-framework/02-standards/standards/enterprise-product-foundation-standard.yaml
  - ../../../../nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml
  - ../../../../nexora-framework/02-standards/standards/agent-agnostic-standard.yaml
  - ../../../../nexora-framework/05-prompts/prompts/generic-project-lifecycle-prompts.yaml
  - ../../../../nexora-framework/05-prompts/prompts/security-quality-gate-prompts.yaml

pause:
  paused_backlog_item: MVP-MOD-007-PORTAL-001
  reason: >
    Enterprise foundations for localization, IAM-protected dynamic menus,
    login/session management, database product baseline, UX/UI design system,
    code documentation, persistence architecture, contract-first generation,
    stack review, technical-debt control and meaningful coverage improvement
    must be aligned before customer-facing portal work continues.
  resume_when:
    - HOP-ENT-FOUND-001 status is closed.
    - PROJECT_STATE.yaml and HOP commercial backlog pointers return to MVP-MOD-007-PORTAL-001.
    - No blocking foundation gap remains.

backlog_items:
  - id: HOP-ENT-FOUND-001
    name: Align HOP enterprise product foundations before continuing portals
    status: next
    type: cross-cutting-foundation-alignment
    priority: P0
    blocks:
      - MVP-MOD-007-PORTAL-001
      - MVP-MOD-007-APP-001
      - COM-MOD-009
      - commercial_general_availability
    scope:
      backend:
        - inventory_hardcoded_messages_and_error_prose
        - define_es_MX_en_US_message_bundle_strategy
        - inventory_permissions_and_protected_actions
        - define_login_session_context_and_backend_authorization_baseline
        - inventory_database_scripts_and_product_schema_gaps
        - create_database_architecture_dictionary_normalization_seed_initialization_deliverables
        - review_jpa_hibernate_orm_strategy_and_raw_sql_boundaries
        - review_openapi_first_generation_lombok_mapstruct_springdoc_and_related_java_stack_enablers
        - define_javadoc_standard_and inventory_public_contract_documentation_gaps
        - raise_or_plan_backend_coverage_improvement_by_3_to_5_points_while_below_80
      frontend_web:
        - inventory_hardcoded_visible_text_and_magic_strings
        - establish_es_MX_en_US_locale_resources_and_language_switch_mechanism
        - define_permission_catalog_mapping_for_routes_menu_items_and_actions
        - implement_or_plan_dynamic_menu_from_authenticated_user_permissions
        - define_login_session_client_context
        - create_ux_ui_design_system_baseline_for_employee_portal
        - review_openapi_client_generation_strategy
        - inventory_shared_contract_documentation_gaps
      mobile_app:
        - inventory_hardcoded_visible_text_and_magic_strings
        - establish_es_MX_en_US_locale_resources_and_language_switch_mechanism
        - define_permission_and_session_model_for_mobile_navigation
        - create_mobile_ux_ui_design_system_baseline
        - establish_measured_coverage_baseline_and_80_percent_plan
      database:
        - define_product_database_baseline_independent_from_infra
        - document_third_normal_form_review
        - define_country_locale_currency_support_for_MX_US_es_MX_en_US_MXN_USD
        - define_translatable_catalog_tables
        - define_seed_data_for_initial_laboratory_tests_and_studies
      quality_and_debt:
        - classify_existing_debt_under_updated_foundation_standard
        - create_single_prioritized_burn_down_plan
        - increase_debt_burn_down_requirement_for_late_operational_core_iterations
        - reject_symbolic_coverage_improvement_when_stack_remains_below_80
    required_outputs:
      - path: 03-architecture/enterprise-foundation/enterprise-foundation-alignment.yaml
        companion: 03-architecture/enterprise-foundation/enterprise-foundation-alignment.md
      - path: 03-architecture/i18n-localization/localization-strategy.yaml
        companion: 03-architecture/i18n-localization/localization-strategy.md
      - path: 03-architecture/security-compliance/iam-permission-model.yaml
        companion: 03-architecture/security-compliance/iam-permission-model.md
      - path: 03-architecture/security-compliance/session-management-baseline.yaml
        companion: 03-architecture/security-compliance/session-management-baseline.md
      - path: 03-architecture/data-architecture/database-architecture.yaml
        companion: 03-architecture/data-architecture/database-architecture.md
      - path: 03-architecture/data-architecture/data-dictionary.yaml
        companion: 03-architecture/data-architecture/data-dictionary.md
      - path: 03-architecture/data-architecture/normalization-report.yaml
        companion: 03-architecture/data-architecture/normalization-report.md
      - path: 03-architecture/data-architecture/seed-data-catalog.yaml
        companion: 03-architecture/data-architecture/seed-data-catalog.md
      - path: 03-architecture/ux-ui/ux-ui-foundation.yaml
        companion: 03-architecture/ux-ui/ux-ui-foundation.md
      - path: 03-architecture/technology-architecture/persistence-and-contract-generation-review.yaml
        companion: 03-architecture/technology-architecture/persistence-and-contract-generation-review.md
      - path: 08-qa/qa/enterprise-foundation/HOP-ENT-FOUND-001-validation.yaml
        companion: 08-qa/qa/enterprise-foundation/HOP-ENT-FOUND-001-validation.md
      - path: 08-qa/security-quality/HOP-ENT-FOUND-001/security-quality-evidence.yaml
        companion: 08-qa/security-quality/HOP-ENT-FOUND-001/security-quality-evidence.md
    acceptance_criteria:
      - HOP hard-coded text inventory exists for frontend web and mobile app and defines remediation by severity.
      - es-MX and en-US are the mandatory base locales for web, app and backend message catalogs.
      - A language switch mechanism is defined and, when code is changed in the same slice, implemented for the touched client.
      - Every existing and planned screen/action/API operation has a permission mapping or an explicit gap.
      - Dynamic menu and action filtering rules are defined from authenticated user permissions and tenant/branch context.
      - Login, logout, session expiration, authenticated user context and permission loading baseline are defined with implementation backlog.
      - Product database deliverables exist independently from Docker or local infrastructure.
      - Data dictionary, normalization report, seed strategy and country/locale/currency/translatable catalog support are documented.
      - Java persistence strategy explicitly decides how JPA/Hibernate, repositories, raw SQL, migrations and read models are used.
      - Contract-first/OpenAPI generation review covers backend, frontend and mobile clients.
      - Java Javadoc and frontend/mobile shared-contract documentation standards are applied or converted into blocking remediation.
      - UX/UI look and feel baseline exists for web and app with design tokens and component guidance.
      - Existing technical debt is reprioritized under this foundation standard and at least two relevant items are closed or materially reduced before any feature work resumes.
      - Backend coverage plan targets a 3 to 5 percentage point increase while below 80 percent; symbolic increases are not accepted.
      - Mobile coverage baseline plan is defined as P0 before mobile expansion.
      - All YAML parses successfully and HOP remains agent agnostic.
      - PROJECT_STATE.yaml, SOURCE_OF_TRUTH.yaml, HOP_COMMERCIAL_PRODUCT_BACKLOG.yaml and HOP_COMMERCIAL_BACKLOG_EXECUTION_PROMPTS.yaml agree on the next backlog item.
    closure_gates:
      - yaml_parse
      - agent_agnostic_scan
      - stale_pointer_sweep
      - evidence_state_sweep
      - security_quality_evidence
      - technical_debt_index_update
      - git_diff_check
      - commit_hash
      - clean_git_status
    next_backlog_when_closed: MVP-MOD-007-PORTAL-001
