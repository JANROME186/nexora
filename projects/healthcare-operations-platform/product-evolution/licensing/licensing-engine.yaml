id: LIC-001
name: Licensing Engine Architecture
type: licensing-architecture
version: 0.22.0
status: draft
plans:
  - id: plan-starter
    name: Starter
    target: Small laboratories
    capabilities:
      - patient-management.core
      - order-management.core
      - sample-management.core
      - results.core
      - cashier.core
    excluded:
      - ai.advanced
      - pacs.core
      - hl7.integration
  - id: plan-professional
    name: Professional
    target: Growing laboratories
    capabilities:
      - patient-management.core
      - order-management.core
      - doctor-portal.core
      - patient-portal.core
      - inventory.core
      - billing.core
      - ai.basic
      - device-integrations.basic
  - id: plan-enterprise
    name: Enterprise
    target: Large diagnostic organizations
    capabilities:
      - '*'
runtime_flow:
  - authentication
  - tenant-resolution
  - license-resolution
  - feature-flag-resolution
  - authorization
  - capability-execution
rules:
  - Do not hard-code plan checks inside controllers, UI components or domain logic.
  - Entitlements must be resolved through a dedicated policy service.
