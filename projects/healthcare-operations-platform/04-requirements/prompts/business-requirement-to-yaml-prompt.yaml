artifact:
  id: HOP-PROMPT-BR-YAML-001
  type: prompt
  name: Business Requirement to YAML Prompt
  version: 1.0.0
  status: approved
  human_readable: business-requirement-to-yaml-prompt.md
  machine_readable: business-requirement-to-yaml-prompt.yaml

purpose: Transform a requester-supplied BUSINESS_REQUIREMENT.md into BUSINESS_REQUIREMENT.yaml for agentic analysis and implementation.

inputs:
  required:
    - projects/<project-slug>/BUSINESS_REQUIREMENT.md
  optional:
    - projects/<project-slug>/SOURCE_OF_TRUTH.yaml
    - projects/<project-slug>/PROJECT_STATE.yaml
    - projects/<project-slug>/PROJECT_BRIEF.yaml

outputs:
  required:
    - projects/<project-slug>/BUSINESS_REQUIREMENT.yaml

source_policy:
  markdown_is_human_source: true
  yaml_is_agent_index: true
  agent_may_invent_business_facts: false
  missing_markdown_behavior: stop_and_request_business_requirement

transformation_rules:
  - Preserve requester intent.
  - Do not invent missing business facts.
  - Normalize sections into predictable YAML keys.
  - Put missing information under requires_clarification.
  - Do not convert assumptions into facts.
  - Do not introduce agent-specific dependencies.
  - Do not introduce cloud-specific dependencies unless explicitly stated.
  - Do not introduce provider-specific dependencies unless explicitly stated.
  - Keep downstream artifact references only when already present or explicitly requested.
  - Validate YAML parsing before reporting completion.

required_yaml_sections:
  - artifact
  - input_governance
  - project
  - executive_summary
  - business_context
  - business_opportunity
  - problem_statement
  - user_need
  - actors
  - product_scope
  - business_capability_map
  - engineering_model
  - mvp
  - commercial_product
  - marketplace
  - open_data_ingestion
  - business_rules
  - data_privacy_audit
  - integrations
  - digital_channels
  - ai
  - constraints
  - out_of_scope_initial
  - success_criteria
  - requires_clarification
  - future_project_template
  - downstream_source_artifacts

not_applicable_rule:
  format:
    applicable: false
    reason: Short business reason.

validation_report:
  must_include:
    - yaml_parsing_status
    - clarification_fields
    - agent_agnostic_status
    - source_of_truth_update_needed

generic_instruction: >
  Transform projects/<project-slug>/BUSINESS_REQUIREMENT.md into
  BUSINESS_REQUIREMENT.yaml using this prompt. Do not invent missing business
  facts; place gaps under requires_clarification; validate YAML parsing; keep
  the result agent-agnostic.
