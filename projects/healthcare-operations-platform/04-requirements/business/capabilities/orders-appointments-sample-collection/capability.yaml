id: CAP-006
name: Orders, Appointments & Sample Collection
version: 0.28.0
status: draft
owner: Product Architecture
classification: core-capability
business_domain: diagnostic_operations
summary: >
  Manages diagnostic orders, appointments, preparation validation, sample labels,
  sample collection and traceability before laboratory or imaging processing.
depends_on:
  - CAP-001
  - CAP-002
  - CAP-003
  - CAP-004
  - CAP-005
enables:
  - CAP-007
  - CAP-008
  - CAP-009
  - CAP-010
principles:
  - API Contract First
  - Business Rules First
  - Traceability by Design
  - Progressive AI
  - Local Development First
roles:
  - patient
  - receptionist
  - cashier
  - phlebotomist
  - imaging_technician
  - supervisor
  - physician
  - chemist
aggregates:
  - DiagnosticOrder
  - Appointment
  - Sample
  - CollectionSession
entities:
  - DiagnosticOrder
  - DiagnosticOrderLine
  - Appointment
  - Sample
  - SampleContainer
  - SampleLabel
  - SampleRejection
  - CollectionInstruction
  - OrderAuthorization
value_objects:
  - OrderNumber
  - AppointmentSlot
  - SampleCode
  - PreparationStatus
  - PaymentClearanceStatus
  - CollectionPriority
business_rules:
  - id: BR-006-001
    description: Every order must belong to a laboratory, branch and active patient.
    severity: high
  - id: BR-006-006
    description: Every sample must have a unique identifier, label and relationship to order, patient and study.
    severity: high
  - id: BR-006-009
    description: Payment-required orders cannot advance unless paid or explicitly authorized.
    severity: high
state_machines:
  - order_state
  - appointment_state
  - sample_state
domain_events:
  - AppointmentScheduled
  - PatientCheckedIn
  - DiagnosticOrderConfirmed
  - OrderPaymentCleared
  - SampleLabelsGenerated
  - SampleCollected
  - SampleRejected
  - SampleReceivedByLab
commands:
  - CreateDiagnosticOrder
  - ConfirmDiagnosticOrder
  - ScheduleAppointment
  - GenerateSampleLabels
  - RegisterSampleCollection
  - RejectSample
queries:
  - GetOrderById
  - SearchOrders
  - GetAppointmentAvailability
  - GetPendingCollections
  - GetSampleTraceability
openapi_contracts:
  - contracts/openapi/orders/orders.openapi.yaml
  - contracts/openapi/appointments/appointments.openapi.yaml
  - contracts/openapi/samples/samples.openapi.yaml
knowledge_nodes:
  - knowledge/capabilities/cap-006-orders-appointments-sample-collection/capability-node.yaml
quality_gates:
  - openapi_contract_exists
  - domain_events_defined
  - state_machines_defined
  - business_rules_linked
  - qa_tests_defined
