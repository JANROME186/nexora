user_stories:
- id: US-PER-003-001
  capability: BCM-PER-003
  title: Manage Doctor Management
  story: As an authorized user, I want to manage Doctor Management so that the organization
    can operate this capability consistently.
  priority: High
  roadmap: MVP1
  acceptance_criteria:
  - 'Scenario: authorized access is allowed and unauthorized access is denied.'
  - 'Scenario: required fields and business rules are validated.'
  - 'Scenario: the action is auditable.'
