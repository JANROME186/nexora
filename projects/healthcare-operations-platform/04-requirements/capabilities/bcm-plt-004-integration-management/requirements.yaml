- id: FR-PLT-004-004
  type: functional
  capability: BCM-PLT-004
  domain: DOM-10
  statement: The platform shall support monitoring, auditability and operational reporting
    for integraciones.
  priority: Critical
  roadmap: MVP2
  acceptance_criteria:
  - Given an authorized user, when the action is performed, then the platform validates
