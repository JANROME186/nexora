artifact:
  id: BCM-002
  type: capability-dependency-map
  name: Healthcare Operations Platform Capability Dependency Map
  version: 1.0.0
  status: draft
  owner: Product Architecture Team
  source_of_truth: 01-product-definition/business-capabilities/bcm-002/capability-dependency-map.yaml
  depends_on:
    - BCM-001
    - CTX-MAP-001
    - AGG-CATALOG-001
  generated_artifacts:
    - 01-product-definition/business-capabilities/bcm-002/capability-dependency-map.md
    - 04-generated/diagrams/product/capability-dependency-map.mmd

principles:
  - Dependencies express product and implementation sequencing, not runtime coupling.
  - Capabilities must depend on published language, APIs, events or read models, never on another context persistence model.
  - MVP1 must produce a usable diagnostic laboratory operation before optional imaging, advanced quality and advanced AI modules.
  - AI capabilities are optional overlays unless explicitly promoted by product governance.
  - Migration and integration capabilities must pass through anti-corruption layers.

product_areas:
  public_website:
    description: Public discovery, patient-facing entry points and lightweight lead capture.
  employee_portal:
    description: Core internal operations for reception, laboratory, billing, administration and management.
  doctor_portal:
    description: Referring physician access to patients, orders and results.
  patient_portal:
    description: Patient self-service access to appointments, documents, payments and results.
  mobile_apps:
    description: Mobile experiences for patients, doctors and selected operational staff workflows.
  platform_core:
    description: Cross-cutting platform services needed by all portals and modules.

