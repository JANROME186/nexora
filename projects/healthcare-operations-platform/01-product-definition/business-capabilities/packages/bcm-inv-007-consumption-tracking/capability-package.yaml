capability:
  id: BCM-INV-007
  name:
    en: Consumption Tracking
    es: Consumos
  domain: DOM-08 Inventory
  priority: Critical
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001; stockSummary decrease delegated to this capability)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Automatically decrements InventoryItem.stockSummary and the selected StockLot.remainingQuantity
    when a linked diagnostic test is performed, using BCM-INV-002's reagentProfile.consumptionUnitRatio.
    Reads AGG-009 LaboratoryResult (owned by laboratory-results) read-only to determine which test
    was performed; never mutates LaboratoryResult. Feeds BCM-QLT-001 Internal Quality Controls with
    the control-material lot used for a QC run.
  in_scope:
    - "Consumption: decrease StockLot.remainingQuantity and InventoryItem.stockSummary.onHandQuantity when a linked test is performed."
    - Read-only reference to LaboratoryResult/order test-performed events.
  out_of_scope:
    - LaboratoryResult mutation (owned exclusively by laboratory-results/BCM-LAB-006).
    - Reagent classification itself (BCM-INV-002).
    - Non-consumption exits and waste (BCM-INV-006/009).

roadmap:
  module: COM-MOD-010
  release: REL-002
  package_status: modeled
  next_backlog_item: COM-MOD-010-BE-002
  paused_functional_backlog_item: null

