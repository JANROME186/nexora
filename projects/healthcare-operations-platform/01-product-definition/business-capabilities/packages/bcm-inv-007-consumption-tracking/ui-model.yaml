artifact:
  id: HOP-UI-BCM-INV-007
  type: ui-model
  name: Consumption Tracking UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-007
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: partial
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-CNS-007-01
    name: Consumption History
    route: /admin/inventory/consumption
    purpose: Review automatic consumption records per InventoryItem/StockLot, primarily read-only.
    components: [DataTable, ConsumptionDetailPanel]
    generatable: true

states:
  - recorded

localization:
  languages: [en, es]
  default: es
  message_key_namespace: inventory.consumption.*
  note: New user-facing strings must be registered under the inventory.consumption.* message-key namespace, not hardcoded.

rationale: >
  Consumption is primarily automatic (test-performance-driven); the employee-portal screen is
  read-oriented review, with a mobile capture option deferred per mobile-model.yaml.
