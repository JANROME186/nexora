artifact:
  id: HOP-UI-BCM-LAB-010
  type: ui-model
  name: Result Release UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-010
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  patient_portal:
    status: status_later
    generatable: not_applicable
  doctor_portal:
    status: status_later
    generatable: not_applicable

screens:
  - id: SCR-RLS-010-01
    name: Release Worklist
    route: /results/release-worklist
    type: list
    scopes: [result.manage]
    components:
      - DataTable
      - LaboratoryFilter
    generatable: true
  - id: SCR-RLS-010-02
    name: Release Result
    route: /results/{resultId}/release
    type: action_panel
    scopes: [result.manage]
    components:
      - ReleaseEligibilitySummary
      - ReleaseResultButton
    generatable: false
    custom_reason: Enforces multi-precondition eligibility check before allowing release.
  - id: SCR-RLS-010-03
    name: Amend Result
    route: /results/{resultId}/amend
    type: form
    scopes: [result.manage]
    components:
      - OriginalValuePanel
      - AmendmentRequestForm
    generatable: false
    custom_reason: Combines original-value display, reason capture and licensed-authority-gated amendment submission.

states:
  - captured
  - pending_technical_validation
  - technically_validated
  - pending_medical_validation
  - medically_validated
  - released
  - amended

localization:
  languages: [en, es]
  default: es
