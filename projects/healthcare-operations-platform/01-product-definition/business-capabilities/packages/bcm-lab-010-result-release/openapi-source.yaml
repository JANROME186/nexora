artifact:
  id: HOP-API-SRC-BCM-LAB-010
  type: openapi-source
  name: Result Release API Source Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-010
  note: >
    Source contract model. The rendered OpenAPI document, controllers, DTOs
    and SDKs are generated outputs declared in generation-plan.yaml.

api:
  base_path: /api/clinical-operations/laboratory-results/{resultId}/release
  surface_classification: internal
  future_surfaces:
    - classification: partner
      status: status_later
      note: Patient/doctor portal released-result visibility is MVP-MOD-007 scope.
  security:
    scheme: bearer_jwt
    required_scopes_default: [result.manage]

resources:
  - name: ResultRelease
    operations:
      - id: listReleaseWorklist
        method: GET
        path: /release-worklist
        scopes: [result.manage]
        generatable: true
      - id: releaseResult
        method: POST
        path: /release
        scopes: [result.manage]
        generatable: false
        custom_reason: Multi-precondition eligibility check spanning medical validation and sample status.
      - id: amendResult
        method: POST
        path: /amend
        scopes: [result.manage]
        generatable: false
        custom_reason: Licensed-authority verification and append-only amendment recording.

schemas_source:
  - ResultReleaseWorklistEntry
  - ReleaseEligibilityCheck
  - AmendmentRequest

error_model:
  standard: rfc7807
  domain_errors:
    - code: RESULT_MEDICAL_VALIDATION_REQUIRED
      maps_to_rule: RN-001
    - code: RESULT_LINKED_SAMPLE_REJECTED
      maps_to_rule: RN-002
    - code: RESULT_RELEASED_VALUE_IMMUTABLE
      maps_to_rule: RN-003
    - code: RESULT_AMENDMENT_UNAUTHORIZED_OR_UNREASONED
      maps_to_rule: RN-004
    - code: RESULT_BOUNDARY_VIOLATION
      maps_to_rule: RN-005
    - code: RESULT_SCOPE_MISMATCH
      maps_to_rule: RN-006
