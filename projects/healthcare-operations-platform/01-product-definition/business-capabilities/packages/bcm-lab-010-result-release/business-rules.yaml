artifact:
  id: HOP-BR-BCM-LAB-010
  type: business-rules
  name: Result Release Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-010
  rule_id_pattern: "RN-###"

rules:
  - id: RN-001
    statement: A result can be released only after medical validation; release of a result not yet medically validated is refused.
    applies_to: LaboratoryResult
    enforcement_point: command:ReleaseResult
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Requires a read-only cross-capability status check against LaboratoryResult.medicalValidation owned by BCM-LAB-009.
    test_refs: [TST-RLS-010-01]
  - id: RN-002
    statement: A result whose linked Sample is rejected cannot be released, regardless of whether a value was captured before the rejection.
    applies_to: LaboratoryResult
    enforcement_point: command:ReleaseResult
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Requires a read-only cross-capability, cross-context check against Sample.status owned by BCM-LAB-002.
    brm_alignment: BRM-001-R010
    test_refs: [TST-RLS-010-02]
  - id: RN-003
    statement: A released result's value is immutable; post-release corrections must be represented as a new ResultAmendment event, never as an in-place update to the original value.
    applies_to: LaboratoryResult
    enforcement_point: command:AmendResult
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Requires an append-only persistence strategy consistent with the aggregate's evidence-preservation invariant.
    test_refs: [TST-RLS-010-03]
  - id: RN-004
    statement: An amendment must be requested and authorized by a licensed clinical authority and must reference the amended-from value and a structured reason; an unauthorized or unreasoned amendment request is refused.
    applies_to: LaboratoryResult
    enforcement_point: command:AmendResult
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Requires a licensed-authority check mirroring BCM-LAB-009's RN-002, plus mandatory reason capture.
    test_refs: [TST-RLS-010-04]
  - id: RN-005
    statement: This capability may mutate only LaboratoryResult.releaseRecord and LaboratoryResult.amendments; it must never write resultValue, technicalValidation, criticalFlag or medicalValidation directly.
    applies_to: LaboratoryResult
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Cross-capability boundary enforcement mirrors the aggregate ownership rule declared by BCM-LAB-006 (RN-006).
    test_refs: [TST-RLS-010-05]
  - id: RN-006
    statement: Release and amendment commands must execute within the actor's tenant and laboratory scope.
    applies_to: LaboratoryResult
    enforcement_point: authorization:result.manage
    severity: critical
    audit_required: true
    generatable: true
    test_refs: [TST-RLS-010-06]
  - id: RN-007
    statement: Release and amendment events must include actor identity, result reference and, for amendments, the amendment reason.
    applies_to: LaboratoryResult
    enforcement_point: event:ResultReleased, event:ResultAmended
    severity: high
    audit_required: true
    generatable: true
    test_refs: [TST-RLS-010-07]

enforcement_summary:
  generatable_rules: [RN-006, RN-007]
  custom_implementation_rules: [RN-001, RN-002, RN-003, RN-004, RN-005]
