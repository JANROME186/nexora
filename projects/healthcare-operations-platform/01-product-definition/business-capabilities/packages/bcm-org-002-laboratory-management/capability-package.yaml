capability:
  id: BCM-ORG-002
  name:
    en: Laboratory Management
    es: Gestión de Laboratorios
  domain: DOM-01 Organization
  priority: High
  roadmap: MVP1
  dependency_profile: foundation
  bounded_context: organization-management
  primary_aggregate: Laboratory
  aggregate_ref: AGG-002

scope:
  summary: >
    Governs laboratory organization identity, multi-branch laboratory registration, sanitary license tracking,
    clinical director assignment, laboratory operating hours, and operational capability enablement
    for Healthcare Operations Platform.
  in_scope:
    - Laboratory registration, profile management, and brand identity configuration.
    - Sanitary license registration, regulatory accreditation tracking, and expiration alerts.
    - Medical/Clinical director assignment and professional credential verification.
    - Laboratory-level operational defaults and capability toggles.
    - Multi-branch laboratory hierarchy binding under parent tenant.
  out_of_scope:
    - Tenant-level SaaS quotas and RLS database isolation (handled by BCM-ORG-001 Tenant Management).
    - Individual branch physical location and room management (handled by BCM-ORG-003 Branch Management).
    - Diagnostic service catalog definitions (handled by BCM-SVC-001).

