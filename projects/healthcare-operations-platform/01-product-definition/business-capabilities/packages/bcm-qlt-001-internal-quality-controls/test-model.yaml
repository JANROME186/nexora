artifact:
  id: HOP-TEST-BCM-QLT-001
  type: test-model
  name: Internal Quality Controls Test Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-QLT-001

test_cases:
  - id: TST-IQC-001-01
    type: architecture
    validates_rule: RN-001
    statement: No code path in this capability writes InventoryItem, StockLot or AGG-009 LaboratoryResult.
    generatable: false
  - id: TST-IQC-001-02
    type: acceptance
    validates_rule: RN-002
    statement: A measured value outside expectedRange resolves ruleEvaluation to warning or out_of_control per the Westgard-style rule set, not silently to in_control.
    generatable: false
  - id: TST-IQC-001-03
    type: acceptance
    validates_rule: RN-003
    statement: An out_of_control run cannot be accepted without an authorized OverrideAcceptanceDecision carrying a reason.
    generatable: false
  - id: TST-IQC-001-04
    type: acceptance
    validates_rule: RN-004
    statement: Recording a QC run against a non-control-material or non-active StockLot is rejected.
    generatable: false
  - id: TST-IQC-001-05
    type: contract
    validates_rule: RN-005
    statement: A caller outside the run's tenant/laboratory/branch scope cannot record, override or read a QC run.
    generatable: true

test_layers:
  - contract_tests
  - unit_tests
  - acceptance_tests
  - architecture_tests

generation_policy:
  repetitive_tests: generated
  custom_rule_tests: [TST-IQC-001-01, TST-IQC-001-02, TST-IQC-001-03, TST-IQC-001-04]
