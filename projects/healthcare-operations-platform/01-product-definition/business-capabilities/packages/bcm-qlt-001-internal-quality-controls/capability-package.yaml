capability:
  id: BCM-QLT-001
  name:
    en: Internal Quality Controls
    es: Controles Internos
  domain: DOM-09 Quality
  priority: Critical
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: QualityControlRun (new entity owned by this capability)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Records internal quality control runs performed with control-material reagent lots (owned by
    BCM-INV-001/BCM-INV-003), evaluates acceptance/rejection using Westgard-style rules and links
    the outcome, read-only, to the patient results it validates (AGG-009 LaboratoryResult, owned by
    laboratory-results). Introduces QualityControlRun as a new, non-duplicating entity — it never
    mutates InventoryItem, StockLot or LaboratoryResult. Out-of-control outcomes are surfaced to
    BCM-LAB-008 Technical Validation (a capability outside COM-MOD-010, already closed under
    MVP-MOD-006) as a downstream signal; enforcing a release block based on that signal remains
    that capability's own responsibility, not this one's.
  in_scope:
    - "QualityControlRun: measured value, expected range, Westgard-style rule evaluation, acceptance decision."
    - Read-only reference to the control-material StockLot and any linked LaboratoryResult batch.
  out_of_scope:
    - InventoryItem/StockLot mutation (BCM-INV-001/003; this capability only reads the control-material lot).
    - LaboratoryResult mutation of any kind (owned exclusively by laboratory-results/BCM-LAB-006/008/009/010).
    - External quality control / proficiency testing (BCM-QLT-002, roadmap MVP3, not part of COM-MOD-010).

roadmap:
