artifact:
  id: HOP-UI-BCM-LAB-009
  type: ui-model
  name: Medical Validation UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-009
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-MVL-009-01
    name: Medical Validation Worklist
    route: /results/medical-validation-worklist
    type: list
    scopes: [result.manage]
    components:
      - DataTable
      - LaboratoryFilter
      - CriticalIndicatorBadge
    generatable: true
  - id: SCR-MVL-009-02
    name: Medical Validation Review
    route: /results/{resultId}/medical-validation
    type: action_panel
    scopes: [result.manage]
    components:
      - ResultClinicalContextPanel
      - ClinicalInterpretationNoteForm
      - ValidateResultButton
    generatable: false
    custom_reason: Combines clinical context display, interpretation note capture and the licensed-authority-gated validation action.

states:
  - captured
  - pending_technical_validation
  - technically_validated
  - pending_medical_validation
  - medically_validated
  - released
  - amended

localization:
  languages: [en, es]
  default: es
