artifact:
  id: HOP-BR-BCM-LAB-009
  type: business-rules
  name: Medical Validation Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-009
  rule_id_pattern: "RN-###"

rules:
  - id: RN-001
    statement: A result can be medically validated only after it is technically validated (status technically_validated); medical validation before technical validation is refused.
    applies_to: LaboratoryResult
    enforcement_point: command:PerformMedicalValidation
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Requires a read-only cross-capability status check against LaboratoryResult.technicalValidation owned by BCM-LAB-008.
    test_refs: [TST-MVL-009-01]
  - id: RN-002
    statement: Medical validation must be performed by an actor holding an active, verified medical credential at the time of validation; validation by an unverified or expired credential is refused.
    applies_to: LaboratoryResult
    enforcement_point: command:PerformMedicalValidation
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Requires a read-only cross-capability credential check against BCM-PER-003's doctor credential state.
    test_refs: [TST-MVL-009-02]
  - id: RN-003
    statement: Medical validation must never be performed by an AI capability, regardless of tenant configuration or automation policy.
    applies_to: LaboratoryResult
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Enforces BRM-001-R017 and FORBID-CTX-002 as a hard architectural boundary, not a configurable policy.
    brm_alignment: BRM-001-R017
    test_refs: [TST-MVL-009-03]
  - id: RN-004
    statement: This capability may mutate only LaboratoryResult.medicalValidation; it must never write technicalValidation, criticalFlag, releaseRecord or amendments.
    applies_to: LaboratoryResult
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Cross-capability boundary enforcement mirrors the aggregate ownership rule declared by BCM-LAB-006 (RN-006).
    test_refs: [TST-MVL-009-04]
  - id: RN-005
    statement: Medical validation commands must execute within the actor's tenant and laboratory scope.
    applies_to: LaboratoryResult
    enforcement_point: authorization:result.manage
    severity: critical
    audit_required: true
    generatable: true
    test_refs: [TST-MVL-009-05]
  - id: RN-006
    statement: Medical validation events must include actor identity, result reference and validation timestamp.
    applies_to: LaboratoryResult
    enforcement_point: event:ResultMedicallyValidated
    severity: high
    audit_required: true
    generatable: true
    test_refs: [TST-MVL-009-06]

enforcement_summary:
  generatable_rules: [RN-005, RN-006]
  custom_implementation_rules: [RN-001, RN-002, RN-003, RN-004]
