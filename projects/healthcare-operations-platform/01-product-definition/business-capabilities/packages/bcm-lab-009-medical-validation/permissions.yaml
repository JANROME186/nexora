artifact:
  id: HOP-PERM-BCM-LAB-009
  type: permissions
  name: Medical Validation Permissions
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-009
  depends_on_capability: BCM-PLT-001

scopes:
  - code: result.manage
    description: Perform medical validation of a technically validated result.
  - code: result.read
    description: Read medical validation history for audit or downstream workflows.

roles:
  - role: medical-validator
    grants: [result.manage, result.read]
  - role: technical-validator
    grants: [result.read]
  - role: tenant-administrator
    grants: [result.read]

access_policies:
  - id: POL-MVL-009-01
    statement: Medical validation commands are scoped to the actor's tenant and laboratory.
    enforcement: row_level_tenant_laboratory_filter
  - id: POL-MVL-009-02
    statement: This capability may write only LaboratoryResult.medicalValidation; no other LaboratoryResult field may be written from this capability.
    enforcement: cross_capability_delegation_policy
  - id: POL-MVL-009-03
    statement: No automated, AI-assisted or service-account actor may call PerformMedicalValidation under any tenant configuration.
    enforcement: ai_governance_policy

audit_obligations:
  audit_sink: BCM-PLT-007
  events:
    - event: ResultMedicallyValidated
      fields: [resultId, actorId]
