artifact:
  id: HOP-PERM-BCM-PLT-004
  type: permissions
  name: Integration Management Permissions
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-004
  depends_on_capability: BCM-PLT-001

scopes:
  - code: integration.endpoint.manage
    description: Register, retire and receive messages on behalf of an IntegrationEndpoint.
  - code: integration.message.read
    description: Read integration endpoint and message status.

roles:
  - role: system
    grants: [integration.endpoint.manage, integration.message.read]
  - role: tenant-administrator
    grants: [integration.endpoint.manage, integration.message.read]
  - role: integration-partner-system
    grants: [integration.message.read]

access_policies:
  - id: POL-INT-004-01
    statement: Integration endpoint and message commands are scoped to the calling actor's tenant and laboratory.
    enforcement: row_level_tenant_laboratory_filter
  - id: POL-INT-004-02
    statement: All external message parsing is delegated to IntegrationAdapterPort; direct protocol-library access outside the port is forbidden.
    enforcement: adapter_boundary_policy

audit_obligations:
  audit_sink: BCM-PLT-007
  events:
    - event: IntegrationEndpointRegistered
      fields: [endpointId, protocol, direction]
    - event: MessageNormalizationFailed
      fields: [endpointId, externalMessageId, canonicalErrorCode]
    - event: MessageDeadLettered
      fields: [endpointId, externalMessageId]
