capability:
  id: BCM-PLT-006
  name:
    en: Observability
    es: Observabilidad y Monitoreo
  domain: DOM-10 Platform
  priority: High
  roadmap: MVP1
  dependency_profile: foundation
  bounded_context: platform-operations
  primary_aggregate: ObservabilityTarget

scope:
  summary: >
    Governs OpenTelemetry tracing, Prometheus metric collection standards, Grafana operational dashboard
    definitions, health check probes, SLO/SLA alert definitions, log aggregation standards,
    customer onboarding telemetry, and operational launch evidence for Healthcare Operations Platform.
  in_scope:
    - System health check endpoints (/health/liveness, /health/readiness, /health/startup).
    - Commercial launch readiness telemetry targets (SLO/SLA baseline metrics, customer onboarding funnel metrics, launch error budgets).
    - OpenTelemetry distributed trace context propagation across services and API gateways.
    - Prometheus metrics catalog (request rate, error rate, latency quantiles, JVM, database connection pool, business metrics).
    - Structured JSON logging format standard with MDC context (tenant_id, user_id, trace_id).
    - Alerting threshold definitions for SLO breaches and critical operational failures.
  out_of_scope:
    - Business domain event auditing (handled by BCM-PLT-007 Audit Trail).
    - Automatic infrastructure provisioning (handled by deployment runbooks and BCM-PLT-009).

