artifact:
  id: HOP-TRC-BCM-PLT-006
  type: traceability
  name: Observability Traceability Matrix
  version: 1.0.0

capability_id: BCM-PLT-006
roadmap_group: COM-MOD-012

mappings:
  - requirement: "SaaS Platform Observability and Health Probes"
    rules: [RN-OBS-001, RN-OBS-002, RN-OBS-003]
    processes: [PROC-OBS-001]
    events: [HealthProbeFailedEvent, SloBreachedEvent]
    api_endpoints: [/actuator/health/liveness, /actuator/health/readiness, /actuator/prometheus]
    permissions: [metrics:read, health:read]
    tests: [TEST-OBS-001, TEST-OBS-002, TEST-OBS-003]

operational_strategy:
  backlog_item: COM-MOD-012-OPS-002
  status: closed
  evidence: ../../../../08-qa/qa/platform-hardening-and-saas-operations/COM-MOD-012-OPS-002-validation.yaml
  contribution: >-
    Required telemetry and probe gates for environment promotion and production readiness
    (COM-MOD-012-OPS-001). COM-MOD-012-OPS-002 makes those gates executable via
    observability-runbook.yaml, health-readiness-liveness-runbook.yaml and
    metrics-logs-traces-validation-runbook.yaml, and documents the current gap between the modeled
    ObservabilityTarget/SloDefinition and the actual running backend (health/info actuator only, no
    Prometheus metrics endpoint or trace exporter yet), forward-pointing that gap to
    COM-MOD-012-BE-001.

implementation:
  backlog_item: COM-MOD-012-BE-001
  status: compiled
  evidence: ../../../../08-qa/qa/platform-hardening-and-saas-operations/COM-MOD-012-BE-001-validation.yaml
  api_endpoints_implemented:
    - "GET /actuator/health/liveness"
    - "GET /actuator/health/readiness"
    - "GET /actuator/prometheus"
  note: >-
    All three operations are satisfied by Spring Boot Actuator + Micrometer configuration
    (micrometer-registry-prometheus dependency, management.* properties) rather than hand-written
    controllers. tenant_id/user_id/trace_id MDC logging context (RequestObservabilityContextFilter)
    was added in the same backlog item to satisfy the metrics-logs-traces-validation-runbook.yaml
    BCM-PLT-006 invariant. Distributed trace export to the local OTel Collector remains open
    (observability-runbook.yaml known_gaps_and_forward_pointers); this backlog item only wired
    trace-id propagation into log MDC, not span export.

validation:
  backlog_item: COM-MOD-012-QA-001
  status: validated
  evidence: ../../../../08-qa/qa/platform-hardening-and-saas-operations/COM-MOD-012-QA-001-validation.yaml
  contribution: >-
    Live runtime validation against a running backend found and fixed a real resilience defect:
    application-local.yml's readiness probe group only included the default readinessState (not
    db), so it reported UP even with PostgreSQL stopped -- an orchestrator would have kept routing
    traffic to a dead-database pod. Fixed by adding management.endpoint.health.group.readiness.include:
    readinessState,db to application-local.yml (the profile with a real DataSource bean; the same
    include in the base application.yml broke context startup for profiles with no DataSource, so
    it was scoped there instead) plus a new regression test
    (ObservabilityReadinessLocalDatabaseTest). Re-verified live: readiness correctly reports
    DOWN/503 while PostgreSQL is stopped and UP again after recovery, while liveness correctly
    stays UP throughout (no unnecessary pod restart). MDC tenantId/userId/traceId confirmed
    populated on live HTTP traffic including malformed-JSON error paths; W3C traceparent reuse and
    control-character header sanitization confirmed live. Also executed a real backup
    (backup-runbook.yaml, pg_dump custom-format, SHA-256 checksum, pg_restore --list structural
    verification: 415 TOC entries) and restore rehearsal (restore-runbook.yaml, isolated
    hop_restore_verify database, row counts matched source exactly: 40=40) as operational
    readiness evidence. Distributed trace export, a provisioned Grafana/Prometheus/Loki stack and
    SLO/SLA alerting remain open, confirmed still not implemented; re-registered as TD-OBS-001
    (the local OTel Collector container is running and reachable, but the backend has no
    OpenTelemetry/micrometer-tracing dependency to export spans to it).
