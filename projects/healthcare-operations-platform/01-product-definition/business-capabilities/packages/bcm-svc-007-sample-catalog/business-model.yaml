artifact:
  id: HOP-BM-BCM-SVC-007
  type: business-model
  name: Sample Catalog Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-007
  bounded_context: catalog-test-configuration
  primary_aggregate: TestDefinition

entities:
  - id: ENT-SMP-001
    name: SampleType
    is_aggregate_root: false
    owned_by_aggregate: TestDefinition
    description: A catalog of biological sample kinds.
    fields:
      - name: sampleTypeId
        type: uuid
        required: true
        identifier: true
      - name: tenantId
        type: TenantId
        required: true
      - name: laboratoryId
        type: LaboratoryId
        required: true
      - name: code
        type: string
        required: true
        unique_scope: [tenantId, laboratoryId]
      - name: name
        type: LocalizedText
        required: true
      - name: matrix
        type: enum
        values: [blood, serum, plasma, urine, stool, swab, tissue, other]
        required: true
      - name: status
        type: enum
        values: [draft, published, deprecated, retired]
        required: true
      - name: version
        type: integer
        required: true
      - name: audit
        type: AuditMetadata
        required: true
  - id: ENT-SMP-002
    name: SampleRequirement
    is_aggregate_root: false
    owned_by_aggregate: TestDefinition
    description: The sample specification required to run a test.
    fields:
      - name: requirementId
        type: uuid
        required: true
        identifier: true
      - name: sampleTypeRefId
        type: uuid
        required: true
      - name: minVolumeMl
        type: decimal
        required: false
      - name: containerRefId
        type: uuid
        required: false
      - name: handlingInstructions
        type: LocalizedText
        required: false
      - name: storageTemperature
        type: enum
        values: [ambient, refrigerated, frozen, deep_frozen]
        required: false
      - name: status
        type: enum
        values: [draft, published, deprecated, retired]
        required: true
      - name: version
        type: integer
        required: true

value_objects:
  - name: LocalizedText
    fields:
      - name: en
        type: string
        required: true
      - name: es
        type: string
        required: true

relationships:
  - from: SampleRequirement
    to: SampleType
    type: many_to_one
  - from: SampleRequirement
    to: TestDefinition
    type: reference_by_id
    note: Requirements are linked to tests owned by BCM-SVC-002.
  - from: SampleRequirement
    to: Sample
    type: reference_by_id
    note: Collected samples in orders-samples (AGG-008) conform to published requirements.

invariants:
  - id: INV-SVC-007-01
    statement: A published sample requirement must reference a published sample type.
  - id: INV-SVC-007-02
    statement: Minimum volume must be greater than zero when present.
  - id: INV-SVC-007-03
    statement: Sample type code must be unique within a laboratory.

external_references:
  - identifier: TenantId
    source: shared-kernel
  - identifier: LaboratoryId
    source: shared-kernel
  - aggregate: TestDefinition
    context: catalog-test-configuration
    access: owning_context
  - aggregate: Sample
    context: orders-samples
    access: published_language_only
