artifact:
  id: HOP-PROC-BCM-ATT-006
  type: processes
  name: Quotation Management Processes
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-006

actors:
  - id: receptionist
    actor_ref: ACT-004
    name: Receptionist
    source: ACM-001
  - id: branch-administrator
    actor_ref: ACT-003
    name: Branch Administrator
    source: ACM-001
    note: Approves discounts beyond receptionist policy limits.

processes:
  - id: PRC-QUO-006-01
    name: Draft quotation
    actor: receptionist
    trigger: A prospective or existing patient requests a price estimate.
    commands:
      - StartQuotation
    preconditions:
      - Actor holds quotation.manage.
    steps:
      - Capture patient reference or prospective contact.
      - Add catalog selection from published tests and panels.
      - Persist QuotationRequest with draft status.
    outcome: QuotationDrafted
    rules: [RN-001, RN-006]
  - id: PRC-QUO-006-02
    name: Issue quotation
    actor: receptionist
    trigger: Catalog selection is final and the quotation must be priced and shared.
    commands:
      - IssueQuotation
    preconditions:
      - Quotation has at least one line.
    steps:
      - Resolve the applicable published price list.
      - Capture QuotationPricingSnapshot.
      - Apply discount within policy limits if requested.
      - Set validUntil per tenant policy.
      - Transition quotation to issued status.
      - Publish QuotationIssued.
    outcome: QuotationIssued
    rules: [RN-002, RN-003, RN-008]
  - id: PRC-QUO-006-03
    name: Accept quotation
    actor: receptionist
    trigger: The patient accepts the issued quotation.
    commands:
      - AcceptQuotation
    preconditions:
      - Quotation is issued and not past validUntil.
    steps:
      - Transition quotation to accepted status.
      - Publish QuotationAccepted.
    outcome: QuotationAccepted
    rules: [RN-004, RN-008]
  - id: PRC-QUO-006-04
    name: Convert quotation to order
    actor: receptionist
    trigger: An accepted quotation proceeds to diagnostic order intake.
    commands:
      - ConvertQuotation
    preconditions:
      - Quotation is accepted.
    steps:
      - Invoke BCM-LAB-001 CreateDiagnosticOrder with the quotation's catalog selection.
      - Transition quotation to converted status and record convertedOrderId.
      - Publish QuotationConverted.
    outcome: QuotationConverted
    rules: [RN-005, RN-007]
  - id: PRC-QUO-006-05
    name: Cancel or expire quotation
    actor: receptionist
    trigger: The quotation is declined, superseded or its validity window elapses.
    commands:
      - CancelQuotation
      - ExpireQuotation
    steps:
      - Capture cancellation reason if actor-initiated.
      - Transition quotation to cancelled or expired status.
    outcome: QuotationClosed
    rules: [RN-007]

commands:
  - name: StartQuotation
    generatable: false
    custom_reason: Published-catalog validation.
  - name: IssueQuotation
    generatable: false
    custom_reason: Price-list resolution, pricing snapshot capture and discount policy enforcement.
  - name: AcceptQuotation
    generatable: false
    custom_reason: Validity-window enforcement.
  - name: ConvertQuotation
    generatable: false
    custom_reason: Cross-capability delegation to BCM-LAB-001.
  - name: CancelQuotation
    generatable: true
  - name: ExpireQuotation
    generatable: true
