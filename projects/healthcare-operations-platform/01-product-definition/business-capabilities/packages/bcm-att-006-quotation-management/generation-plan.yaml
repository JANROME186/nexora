artifact:
  id: HOP-GEN-BCM-ATT-006
  type: generation-plan
  name: Quotation Management Generation Plan
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-006
  compiler_strategy: model_to_platform

generated_outputs:
  backend:
    - CRUD scaffolding for QuotationRequest
    - DTOs for QuotationRequest, QuotationLine, QuotationPricingSnapshot, DiscountApplication and ProspectiveContact
    - Controllers for generatable operations (list, get, cancel, expire)
    - Repository interfaces and persistence adapters
    - Event consumers for TestDefinitionPublished, PriceListPublished and PatientRegistrationCommitted
    - API adapters
  frontend:
    - Employee portal quotation list and detail (SCR-QUO-006-02, SCR-QUO-006-03)
    - Routes and Client SDK usage
  contracts:
    - Rendered OpenAPI document from openapi-source.yaml
    - Typed SDK
    - Swagger documentation
  tests:
    - Repetitive unit tests for RN-006 and RN-008
    - Contract tests for authorization
    - Acceptance test skeletons for orchestration rules
  operations:
    - Metric and log wiring from observability-model.yaml
    - Dashboard skeleton
    - Alert definitions

custom_implementation_points:
  - id: CUS-QUO-006-01
    description: Published-catalog validation for quotation lines (RN-001).
    maps_to_backlog: MVP-MOD-004-BE-002
  - id: CUS-QUO-006-02
    description: Price-list resolution and pricing snapshot capture at issuance (RN-002).
    maps_to_backlog: MVP-MOD-004-BE-002
  - id: CUS-QUO-006-03
    description: Tenant-configurable discount policy enforcement (RN-003).
    maps_to_backlog: MVP-MOD-004-BE-002
  - id: CUS-QUO-006-04
    description: Validity-window enforcement at acceptance (RN-004).
    maps_to_backlog: MVP-MOD-004-BE-002
  - id: CUS-QUO-006-05
    description: Cross-capability conversion delegating to BCM-LAB-001 CreateDiagnosticOrder (RN-005).
    maps_to_backlog: MVP-MOD-004-BE-002
  - id: CUS-QUO-006-06
    description: Terminal-state immutability guard (RN-007).
    maps_to_backlog: MVP-MOD-004-BE-002
  - id: CUS-QUO-006-07
    description: Quotation builder UI with pricing preview and discount application.
    maps_to_backlog: MVP-MOD-004-FE-001

do_not_write_manually:
  - CRUD scaffolding
  - DTOs
  - Controllers
  - Repositories
  - Swagger documentation
  - SDKs
  - Repetitive documentation
  - Repetitive test cases

provenance:
  source_models:
    - business-model.yaml
    - business-rules.yaml
    - processes.yaml
    - events.yaml
    - openapi-source.yaml
    - ui-model.yaml
    - permissions.yaml
    - observability-model.yaml
  generation_metadata_required: true
