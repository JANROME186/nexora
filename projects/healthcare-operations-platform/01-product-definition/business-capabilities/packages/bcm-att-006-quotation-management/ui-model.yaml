artifact:
  id: HOP-UI-BCM-ATT-006
  type: ui-model
  name: Quotation Management UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-006
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  public_website:
    status: request_only_later
    generatable: deferred
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-QUO-006-01
    name: Quotation Builder
    route: /quotations/new
    type: wizard
    scopes: [quotation.manage]
    components:
      - PatientOrProspectPicker
      - CatalogItemSelector
      - PricingSummaryPanel
      - DiscountApplicationForm
    generatable: false
    custom_reason: Combines published-catalog validation, pricing preview and tenant discount policy enforcement.
  - id: SCR-QUO-006-02
    name: Quotation List
    route: /quotations
    type: list
    scopes: [quotation.read]
    components:
      - DataTable
      - StatusFilter
      - BranchFilter
    generatable: true
  - id: SCR-QUO-006-03
    name: Quotation Detail
    route: /quotations/{quotationId}
    type: detail
    scopes: [quotation.read]
    components:
      - QuotationSummary
      - PricingSnapshotPanel
      - ConvertToOrderButton
      - AuditTraceLink
    generatable: true

states:
  - draft
  - issued
  - accepted
  - expired
  - converted
  - cancelled

localization:
  languages: [en, es]
  default: es
