artifact:
  id: HOP-BR-BCM-ATT-006
  type: business-rules
  name: Quotation Management Business Rules
  version: 0.2.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-006
  rule_id_pattern: "RN-###"

rules:
  - id: RN-001
    statement: A quotation line may reference only a CatalogSnapshot taken from a currently published TestDefinition or panel version.
    applies_to: QuotationLine
    enforcement_point: command:AddQuotationLine, command:IssueQuotation
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Requires cross-capability validation against BCM-SVC-001/002/003 publication state.
    test_refs: [TST-QUO-006-01]
  - id: RN-002
    statement: A quotation cannot be issued without a captured QuotationPricingSnapshot referencing a published price list; each quotation line is priced from its own independently resolved price list, since a multi-service quotation may span catalog items only priced in different lists.
    applies_to: QuotationRequest
    enforcement_point: command:IssueQuotation
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Pricing snapshot must be sourced from BCM-SVC-009 and validated for currency and effective-dated coverage; multi-price-list resolution requires one price-list lookup per quotation line rather than one for the whole quotation.
    test_refs: [TST-QUO-006-02]
  - id: RN-003
    statement: A discount application must not exceed the tenant-configured maximum discount policy for the actor's role (a standard cap, and a higher cap only reachable through the quotation.discount.override authorization scope).
    applies_to: DiscountApplication
    enforcement_point: command:ApplyQuotationDiscount
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Discount policy limits are tenant-configurable (FrontDeskPolicyStore standard/override caps) and role-dependent through the discountOverride authorization gate.
    test_refs: [TST-QUO-006-03]
  - id: RN-004
    statement: A quotation cannot be accepted after its validUntil date; it must be reissued or explicitly extended first.
    applies_to: QuotationRequest
    enforcement_point: command:AcceptQuotation
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Requires date comparison combined with an explicit reissue/extension workflow.
    test_refs: [TST-QUO-006-04]
  - id: RN-005
    statement: Converting an accepted quotation into a diagnostic order must invoke BCM-LAB-001 CreateDiagnosticOrder and set convertedOrderId, never persist an order directly.
    applies_to: QuotationRequest
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Cross-capability delegation boundary; the Sale aggregate does not yet exist (deferred to MVP-MOD-005).
    test_refs: [TST-QUO-006-05]
  - id: RN-006
    statement: Quotation commands must execute within the actor's tenant, laboratory and branch scope.
    applies_to: QuotationRequest
    enforcement_point: authorization:quotation.manage
    severity: critical
    audit_required: true
    generatable: true
    test_refs: [TST-QUO-006-06]
  - id: RN-007
    statement: A converted or cancelled quotation is immutable; corrections require a new quotation version, never in-place mutation.
    applies_to: QuotationRequest
    enforcement_point: command:ConvertQuotation, command:CancelQuotation
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Requires explicit terminal-state guard.
    test_refs: [TST-QUO-006-07]
  - id: RN-008
    statement: Quotation audit events must include actor identity, branch and total amount.
    applies_to: QuotationRequest
    enforcement_point: event:QuotationIssued, event:QuotationAccepted
    severity: high
    audit_required: true
    generatable: true
    test_refs: [TST-QUO-006-08]
  - id: RN-009
    statement: A public-website (anonymous, channel=public_website) quotation request must capture a ProspectiveContact rather than an existing Patient link, remains in draft state until staff issuance, and is subject to BCM-PLT-005's public rate-limit classification.
    applies_to: QuotationRequest
    enforcement_point: command:StartQuotation
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Anonymous-channel intake validation and public rate-limit application are governance/security rules, not generic CRUD.
    test_refs: [TST-QUO-006-09]

enforcement_summary:
  generatable_rules: [RN-006, RN-008]
  custom_implementation_rules: [RN-001, RN-002, RN-003, RN-004, RN-005, RN-007, RN-009]
