capability:
  id: BCM-ATT-006
  name:
    en: Quotation Management
    es: Cotizaciones
  domain: DOM-04 Care Delivery
  priority: High
  roadmap: MVP1
  dependency_profile: care_delivery
  bounded_context: cash-sales
  secondary_bounded_context: catalog-test-configuration
  primary_aggregate: none
  aggregate_ref: none
  aggregate_ownership_note: >
    QuotationRequest is a lightweight process entity owned by this
    capability. The cash-sales Sale aggregate (AGG-010) is not yet
    implemented (it belongs to the future MVP-MOD-005 Cashier and Billing
    Request module); until then, this capability is the sole owner of
    quotation state. On acceptance, a quotation may convert into a diagnostic
    order through BCM-LAB-001 CreateDiagnosticOrder, and later, once
    MVP-MOD-005 exists, into a Sale.
  process_ref: HRP-001-P03

scope:
  summary: >
    Produces pre-order price estimates for prospective or existing patients
    from published catalog items and price lists, applying tenant commercial
    rules (discounts, promotions) within policy limits. A quotation is a
    standalone, versionable record; it never mutates catalog, price list or
    order state. Accepted quotations may be converted into a diagnostic
    order through BCM-LAB-001.
  in_scope:
    - Quotation draft, issuance, acceptance, expiration, cancellation and conversion.
    - Immutable catalog and price-list snapshot capture at issuance time.
    - Tenant-configured discount/commercial-rule application within policy limits.
    - Quotation validity window management.
    - Conversion of an accepted quotation into a diagnostic order.
  out_of_scope:
    - Catalog and price list definition and publication (BCM-SVC-001/002/003/009).
    - Diagnostic order aggregate mutation (BCM-LAB-001).
    - Sale and payment aggregate ownership (BCM-ATT-005, MVP-MOD-005, future).
    - Promotion rule authoring (BCM-ATT-007, MVP2).

