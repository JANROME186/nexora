    - process: PRC-QUO-006-01
      commands: [StartQuotation]
    - process: PRC-QUO-006-02
      commands: [IssueQuotation]
    - process: PRC-QUO-006-03
      commands: [AcceptQuotation]
    - process: PRC-QUO-006-04
      commands: [ConvertQuotation]
    - process: PRC-QUO-006-05
      commands: [CancelQuotation, ExpireQuotation]
  api_to_permissions:
