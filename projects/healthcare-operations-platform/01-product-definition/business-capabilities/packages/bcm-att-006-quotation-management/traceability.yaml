      audit_sink: BCM-PLT-007
    - event: QuotationIssued
      audit_sink: BCM-PLT-007
    - event: QuotationAccepted
      audit_sink: BCM-PLT-007
    - event: QuotationConverted
      audit_sink: BCM-PLT-007
    - event: QuotationClosed
