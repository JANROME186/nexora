    - screen: SCR-QUO-006-02
      operations: [listQuotations]
    - screen: SCR-QUO-006-03
      operations: [getQuotation, acceptQuotation, convertQuotation, cancelQuotation]
  future_aggregate_note: >
    Once MVP-MOD-005 Cashier and Billing Request models the Sale aggregate
    (AGG-010), a follow-up capability-package revision may add an optional
    QuotationRequest-to-Sale conversion path alongside the existing
    QuotationRequest-to-DiagnosticOrder path. No forward dependency is taken
    on unbuilt MVP-MOD-005 artifacts.
  generated_outputs_ref: generation-plan.yaml
