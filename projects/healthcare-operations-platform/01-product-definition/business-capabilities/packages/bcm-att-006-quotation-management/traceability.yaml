  compilation_backend_root: ../../../../07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/frontdeskcaredelivery/quotationmanagement/
  compilation_schema: ../../../../07-implementation/backend/src/main/resources/db/front-desk-care-delivery/schema.sql
  backlog_items:
    definition: MVP-MOD-004-DEF
    definition_status: closed
    compilation: MVP-MOD-004-BE-001
    compilation_status: closed
    custom_rules: MVP-MOD-004-BE-002
    custom_rules_status: closed
    ui: MVP-MOD-004-FE-001
    ui_status: closed
    validation: MVP-MOD-004-QA-001
    validation_status: closed
    closeout: MVP-MOD-004-CLOSEOUT
    closeout_status: closed
    stale_status_correction_note: >-
      Corrected by COM-MOD-011-DEF: ui/validation/closeout were stale at "pending" though
      MVP-MOD-004-FE-001, MVP-MOD-004-QA-001 and MVP-MOD-004-CLOSEOUT are all closed per
      PROJECT_STATE.yaml completed_backlog_items and capability-package-index.yaml (roadmap_group
      MVP-MOD-004, package_status module_closed).
  cross_module_reuse:
    - roadmap_group: COM-MOD-011
      backlog_item: COM-MOD-011-DEF
      surface_added: public_website
      note: >-
        Public website quotation-request intake modeled by extending openapi-source.yaml
        (RN-009, public_surface reusing startQuotation), capability-package.yaml,
        business-rules.yaml, test-model.yaml, ui-model.yaml and permissions.yaml. No new
        capability package, aggregate or schema was created.
    - roadmap_group: COM-MOD-011
      backlog_item: COM-MOD-011-BE-001
      surface_added: public_website (runtime intake)
      note: >-
        Compiled POST /api/public/care-delivery/quotation-requests via the new
        frontdeskcaredelivery::public-intake-port named interface. RN-009 enforced:
        QuotationManagementService.startPublic accepts a ProspectiveContact only, always lands in
        draft state, and reuses the existing RN-001 published-catalog validation for every line.
        No new capability package, aggregate or schema was created; the existing ProspectiveContact
        inline fields on QuotationRequest are reused.
    - roadmap_group: COM-MOD-011
      backlog_item: COM-MOD-011-WEB-001
      surface_added: public_website (frontend intake)
      note: >-
        Compiled QuotationRequestPage at 07-implementation/public-website/src/pages/, posting to
        /api/public/care-delivery/quotation-requests via src/api/careDeliveryApi.ts. Reuses the
        same CatalogItemLinesField component as AppointmentRequestPage, extended with a
        per-line quantity input. Same client-side validation (contact-required-or, at-least-one-
        line, consent) and 429 cooldown handling pattern as the appointment form.
    - roadmap_group: COM-MOD-011
      backlog_item: COM-MOD-011-FE-001
      surface_added: employee_portal (staff review) + backend defect fix
      note: >-
        Defect found and fixed: unlike AppointmentSlot, QuotationRequest had no channel field, so
        public-website-submitted drafts were only distinguishable from staff-initiated ones by an
        unreliable status+patientId heuristic. Added QuotationRequest.channel (mirroring
        AppointmentSlot's CHANNEL_* constants), an additive nullable
        care_delivery.quotations.channel column, and QuotationManagementService validation:
        start() defaults to channel=employee_portal when omitted and rejects channel=public_website
        from internal callers; startPublic() always stamps channel=public_website regardless of
        input. Compiled PublicQuotationRequestsScreen at
        07-implementation/employee-portal/src/components/screens/, listing
        GET /api/care-delivery/quotations filtered client-side to
        channel=="public_website" && status=="draft", with issue/cancel triage actions via the
        existing endpoints. No new action endpoint was created.
    - roadmap_group: COM-MOD-011
      backlog_item: COM-MOD-011-QA-001
      surface_added: integrated QA, SEO and privacy validation
      note: >-
        Validated public quotation request intake, channel field integrity, and staff triage queue end to end with
        zero vulnerabilities across Maven quality, OWASP Dependency-Check, npm audit, and Trivy fs scans. Verified
        privacy consent, 429 rate limit handling, IAM permission gating, es-MX/en-US i18n key parity and axe-core
        accessibility checks.
