artifact:
  id: HOP-TEST-BCM-PER-003
  type: test-model
  name: Doctor Management Test Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PER-003

test_cases:
  - id: TST-DOC-003-01
    type: unit
    validates_rule: RN-001
    statement: Reject registration of duplicate doctor code within tenant.
    generatable: true
  - id: TST-DOC-003-02
    type: acceptance
    validates_rule: RN-002
    statement: Registration is blocked when duplicate detection has not been invoked.
    generatable: false
  - id: TST-DOC-003-03
    type: architecture
    validates_rule: RN-003
    statement: Only medical-staff repository writes are permitted for Doctor aggregate.
    generatable: false
  - id: TST-DOC-003-04
    type: acceptance
    validates_rule: RN-004
    statement: Activation is blocked when no verified medical license credential exists.
    generatable: false
  - id: TST-DOC-003-05
    type: acceptance
    validates_rule: RN-004
    statement: Activation succeeds once a medical license credential is verified.
    generatable: false
  - id: TST-DOC-003-06
    type: regression
    validates_rule: RN-005
    statement: Credential expiration transitions status to expired and flags doctor for re-verification.
    generatable: false
  - id: TST-DOC-003-07
    type: acceptance
    validates_rule: RN-006
    statement: Suspended doctors are excluded from new order eligibility.
    generatable: false
  - id: TST-DOC-003-08
    type: acceptance
    validates_rule: RN-007
    statement: Preparing portal access does not grant portal access without downstream provisioning.
    generatable: false
  - id: TST-DOC-003-09
    type: unit
    validates_rule: RN-008
    statement: DoctorSnapshot masks primary document and credential numbers per tenant policy.
    generatable: true
  - id: TST-DOC-003-10
    type: contract
    validates_rule: RN-009
    statement: Unauthorized actors cannot read, write or verify doctors.
    generatable: true

test_layers:
  - contract_tests
  - unit_tests
  - acceptance_tests
  - regression_tests
  - architecture_tests

generation_policy:
  repetitive_tests: generated
  custom_rule_tests: [TST-DOC-003-02, TST-DOC-003-03, TST-DOC-003-04, TST-DOC-003-05, TST-DOC-003-06, TST-DOC-003-07, TST-DOC-003-08]
