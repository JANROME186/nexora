artifact:
  id: HOP-PROC-BCM-INV-006
  type: processes
  name: Stock Exits Processes
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-006

actors:
  - id: laboratory-technician
    actor_ref: ACT-007
    name: Laboratory Technician
    source: ACM-001
    note: Reused as the closest existing role for warehouse exit handling; non-blocking substitution.

processes:
  - id: PRC-SXT-006-01
    name: Record stock exit
    actor: laboratory-technician
    trigger: Stock is transferred to another branch or returned to the supplier.
    commands:
      - ApplyStockExit
    preconditions:
      - StockLot exists, is active and has sufficient remainingQuantity.
      - quantity is strictly greater than zero.
    steps:
      - Validate destinationBranchId when exitReason requires it.
      - Decrease StockLot.remainingQuantity and InventoryItem.stockSummary.onHandQuantity.
      - Publish StockExited.
    outcome: StockExited
    rules: [RN-001, RN-002, RN-004, RN-005]

commands:
  - name: ApplyStockExit
    generatable: false
    custom_reason: Delegated multi-field mutation with a real-time remainingQuantity/status guard.
