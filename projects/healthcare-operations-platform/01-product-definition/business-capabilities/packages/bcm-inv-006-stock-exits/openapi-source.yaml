artifact:
  id: HOP-API-SRC-BCM-INV-006
  type: openapi-source
  name: Stock Exits API Source Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-006

api:
  base_path: /api/inventory/stock-exits
  surface_classification: internal
  security:
    scheme: bearer_jwt
    required_scopes_default: [inventory.exits.manage, inventory.exits.read]

resources:
  - name: StockExitRecord
    operations:
      - id: applyStockExit
        method: POST
        path: /
        scopes: [inventory.exits.manage]
        generatable: false
        custom_reason: Real-time remainingQuantity/status guard against the referenced StockLot.
      - id: listStockExits
        method: GET
        path: /
        scopes: [inventory.exits.read]
        generatable: true

schemas_source:
  - StockExitRecord

error_model:
  standard: rfc7807
  code_field: >
    Every error response carries a first-class `code` string field, consistent with the
    COM-MOD-010 module convention.
  domain_errors:
    - code: STOCK_EXIT_QUANTITY_EXCEEDS_LOT
      maps_to_rule: RN-001
    - code: STOCK_EXIT_DESTINATION_BRANCH_REQUIRED
      maps_to_rule: RN-002
    - code: STOCK_EXIT_LOT_NOT_ELIGIBLE
      maps_to_rule: RN-004
    - code: STOCK_EXIT_SCOPE_MISMATCH
      maps_to_rule: RN-005
