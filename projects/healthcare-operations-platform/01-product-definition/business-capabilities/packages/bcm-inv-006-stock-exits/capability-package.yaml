capability:
  id: BCM-INV-006
  name:
    en: Stock Exits
    es: Salidas
  domain: DOM-08 Inventory
  priority: High
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001; stockSummary decrease delegated to this capability)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Records non-consumption stock exits (branch transfer, internal transfer, return to supplier)
    decreasing StockLot.remainingQuantity and InventoryItem.stockSummary.onHandQuantity through the
    narrowly-scoped ApplyStockExit command. Distinct from BCM-INV-007 Consumption Tracking, which
    covers test-performance-driven decrements, and BCM-INV-009 Waste Management, which covers
    disposal.
  in_scope:
    - "Stock exit: decrease StockLot.remainingQuantity and InventoryItem.stockSummary.onHandQuantity for transfer/return exits."
  out_of_scope:
    - Test-consumption-driven decrements (BCM-INV-007).
    - Disposal/waste decrements (BCM-INV-009).
    - Lot metadata ownership (BCM-INV-003).

roadmap:
  module: COM-MOD-010
  release: REL-002
  package_status: modeled
  next_backlog_item: COM-MOD-010-QA-001
  paused_functional_backlog_item: null

