artifact:
  id: HOP-BM-BCM-INV-006
  type: business-model
  name: Stock Exits Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-006
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001)
  model_kind: operational_process_over_shared_aggregate

entities:
  - id: ENT-SXT-001
    name: StockExitRecord
    is_aggregate_root: false
    described_as: process_record
    owned_by_aggregate: InventoryItem
    description: Append-only exit record; each row is one non-consumption, non-waste stock decrement.
    fields:
      - name: stockExitId
        type: uuid
        required: true
        identifier: true
      - name: inventoryItemId
        type: InventoryItemId
        required: true
      - name: stockLotId
        type: uuid
        required: true
      - name: tenantId
        type: TenantId
        required: true
      - name: branchId
        type: BranchId
        required: true
      - name: quantity
        type: decimal
        required: true
      - name: exitReason
        type: enum
        values: [branch_transfer, internal_transfer, return_to_supplier]
        required: true
      - name: destinationBranchId
        type: BranchId
        required: false
      - name: exitedBy
        type: UserId
        required: true
      - name: exitedAt
        type: datetime
        required: true
      - name: audit
        type: AuditMetadata
        required: true

value_objects: []

invariants:
  - id: INV-SXT-001
    statement: quantity must be strictly greater than zero and must not exceed the referenced StockLot's remainingQuantity.
  - id: INV-SXT-002
    statement: An exit with exitReason branch_transfer or internal_transfer must supply destinationBranchId.
  - id: INV-SXT-003
    statement: Confirming a StockExitRecord is the only trigger allowed to invoke ApplyStockExit on InventoryItem.stockSummary and the referenced StockLot.remainingQuantity; this capability never mutates any other field.
  - id: INV-SXT-004
    statement: An exit against an expired or disposed StockLot is rejected; expired lots must route through BCM-INV-009 Waste Management instead.

external_references:
  - shared_kernel:
      - VO-ID-001 TenantId
      - VO-ID-003 BranchId
      - VO-ID-004 UserId
      - VO-007 AuditMetadata
  - capabilities:
      - BCM-INV-001 InventoryItem aggregate (delegated mutation target for stockSummary decrease)
      - BCM-INV-003 Lot Management (read-only StockLot status/quantity reference)
