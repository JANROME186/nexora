artifact:
  id: HOP-OBS-BCM-PLT-005
  type: observability-model
  name: API Management Observability Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-005
  depends_on_capability: BCM-PLT-006

logs:
  - event: api_surface_classified
    level: info
    fields: [registrationId, ownerCapability, operationId, classification]
    correlation_id: registrationId
  - event: partner_api_key_issued
    level: info
    fields: [keyId, consumerName]
    correlation_id: keyId
  - event: partner_api_key_revoked
    level: warn
    fields: [keyId, consumerName]
    correlation_id: keyId
  - event: api_rate_limit_exceeded
    level: warn
    fields: [registrationId, consumerName]
    correlation_id: registrationId

metrics:
  - name: api_operations_classified_total
    type: counter
    labels: [tenantId, classification]
  - name: partner_api_keys_active_total
    type: gauge
    labels: [tenantId]
  - name: api_rate_limit_exceeded_total
    type: counter
    labels: [tenantId, classification]
  - name: api_deprecation_scheduled_total
    type: counter
    labels: [tenantId]

traces:
  - span: IssuePartnerApiKey
    child_spans:
      - ValidateScopeCoverage
  - span: ClassifyApiOperation
    child_spans:
      - EvaluatePublishGate

audit_events:
  - ApiSurfaceClassified
  - PartnerApiKeyIssued
  - PartnerApiKeyRevoked
  - ApiDeprecationScheduled

alerts:
  - name: PartnerApiKeyRevokedUnexpectedly
    condition: partner_api_key_revoked occurs outside a scheduled maintenance window
    severity: medium
  - name: ApiRateLimitExceededSustained
    condition: api_rate_limit_exceeded_total rate exceeds threshold for a sustained period
    severity: high
