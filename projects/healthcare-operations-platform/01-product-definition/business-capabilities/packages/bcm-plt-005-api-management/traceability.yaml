      operations: [classifyApiOperation, listApiOperations, scheduleApiDeprecation]
    - screen: SCR-APIM-005-02
      operations: [issuePartnerApiKey, revokePartnerApiKey, listPartnerApiKeys]
  consumed_by_capabilities:
    - capability: BCM-PLT-004
      relationship: Shares the integration-interoperability bounded context; IntegrationAcknowledgement informs delivery observability for governed partner operations.
    - capability: COM-MOD-009 (future, doctor_portal partner_api_later)
      relationship: Will consume partner-classified operations governed here once implemented.
  technical_debt_alignment:
    - debt: TD-STACK-003
      alignment: generation-plan.yaml designates this capability as the concrete OpenAPI-Generator TypeScript client pilot target.
    - debt: TD-I18N-002
      alignment: >-
        openapi-source.yaml error_model models a first-class `code` field from inception, matching
        the acceptance criterion for structured-error-code API consumers; MVP-MOD-008-BE-002 added
        a `messageKey` field alongside it.
    - debt: TD-BE-015
      alignment: >-
        Opened by MVP-MOD-008-BE-002 to track that RN-004 rate-limit enforcement is scoped to
        partner-API-key-bearing requests only. Materially reduced by COM-MOD-011-DEF: RN-007 and
        RateLimitPolicy.consumerIdentificationMethod now model IP-address/session-token
        identification for the public classification tier. Closed by COM-MOD-011-BE-001:
        PublicApiRateLimitInterceptor (co-located with PartnerApiKeyRateLimitInterceptor) reuses
        PartnerApiRateLimiter under a public:: namespace and derives the consumer bucket from
        RateLimitPolicy.consumerIdentificationMethod; verified end-to-end by
        PublicWebApiTest.publicRateLimitBlocksAnonymousTrafficByIpAddress.
  generated_outputs_ref: generation-plan.yaml
  qa_evidence: ../../../../08-qa/qa/integration-and-migration-readiness/MVP-MOD-008-DEF-validation.yaml
  compilation_evidence:
    backend_implementation: ../../../../../07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/integrationinteroperability/apimanagement/
    schema: ../../../../../07-implementation/backend/src/main/resources/db/integration-interoperability/schema.sql
    qa_evidence: ../../../../08-qa/qa/integration-and-migration-readiness/MVP-MOD-008-BE-002-validation.yaml
    security_quality_evidence: ../../../../08-qa/security-quality/MVP-MOD-008-BE-002/security-quality-evidence.yaml
    notes: >-
      listApiOperations, revokePartnerApiKey, listPartnerApiKeys, setRateLimitPolicy compiled as
      generatable outputs. ClassifyApiOperation (CUS-APIM-005-01, classification/publish-gating) and
      IssuePartnerApiKey (CUS-APIM-005-02, scope/tenant validation against partner-classified
      operations) implemented. MVP-MOD-008-BE-002 implemented RN-003's retirement transition
      (retireDeprecatedOperation, gated by the elapsed deprecation window) and RN-004's rate-limit
      enforcement (PartnerApiKeyRateLimitInterceptor + PartnerApiRateLimiter fixed-window counter for
      X-Partner-Api-Key-bearing requests; public/internal classification-tier enforcement remains
      TD-BE-015). Also closed a real RN-005 audit gap: setRateLimitPolicy previously never recorded an
      audit event. The OpenAPI-Generator TypeScript client pilot remains scheduled for
      MVP-MOD-008-FE-001 per TD-STACK-003.
  backlog_items:
    definition: MVP-MOD-008-DEF
    definition_status: closed
    compilation: MVP-MOD-008-BE-001
    compilation_status: closed
    custom_rules: MVP-MOD-008-BE-002
    custom_rules_status: closed
    ui: MVP-MOD-008-FE-001
    ui_status: closed
    validation: MVP-MOD-008-QA-001
    validation_status: closed
    closeout: MVP-MOD-008-CLOSEOUT
    closeout_status: closed
    stale_status_correction_note: >-
      Corrected by COM-MOD-011-DEF: ui/validation/closeout were stale at "pending" though
      MVP-MOD-008-FE-001, MVP-MOD-008-QA-001 and MVP-MOD-008-CLOSEOUT are all closed per
      PROJECT_STATE.yaml completed_backlog_items and capability-package-index.yaml (roadmap_group
      MVP-MOD-008, package_status module_closed).
  cross_module_reuse:
    - roadmap_group: COM-MOD-009
      backlog_item: COM-MOD-009-BE-001 (implied)
      surface_added: doctor_portal (partner_api_later)
      note: Recorded here retroactively by COM-MOD-011-DEF; not independently verified against COM-MOD-009 evidence.
    - roadmap_group: COM-MOD-011
      backlog_item: COM-MOD-011-DEF
      surface_added: public_website (governance only)
      note: >-
        Added RN-007 and RateLimitPolicy.consumerIdentificationMethod to govern the new
        classification=public operations registered by BCM-SVC-001/002/003/005 and
        BCM-ATT-001/006. No new capability package or aggregate was created; materially reduces
        TD-BE-015.
    - roadmap_group: COM-MOD-011
      backlog_item: COM-MOD-011-BE-001
      surface_added: public_website (runtime enforcement)
      note: >-
        Compiled PublicApiRateLimitInterceptor next to PartnerApiKeyRateLimitInterceptor and
        persisted RateLimitPolicy.consumerIdentificationMethod end to end (domain record, JDBC and
        in-memory repositories, controller DTO, service validation, ADD-COLUMN-IF-NOT-EXISTS
        schema migration). Both interceptors are wired by ApiManagementWebConfig. Closes TD-BE-015.
        Backend line coverage 83.73% -> 83.96%; 324 tests, 0 failures/errors/skipped; OWASP
        Dependency-Check and Trivy fs report 0 findings.
