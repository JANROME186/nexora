    downstream_consumer_roles: [public-api-consumers, partner-integrations]
  domain_foundation:
    bounded_context: integration-interoperability
    aggregate_reference: ApiSurfaceRegistration (new platform aggregate; shares integration-interoperability bounded context with BCM-PLT-004's IntegrationEndpoint without duplicating it)
    context_relationships: [REL-CTX-011]
    context_map_observation: >-
      context-map.yaml REL-CTX-011 already declares integration-interoperability as an
      anti-corruption-layer bounded context; BCM-PLT-005 governs the outbound/API-consumer side of
      that same bounded context while BCM-PLT-004 governs the inbound message side. No new
      bounded-context or context-map.yaml entry was required.
    shared_kernel_refs: [VO-ID-001, VO-006, VO-007]
  brm_alignment:
    - rule: BRM-001-R018
      alignment: Audit records are append-only; every classification, key and deprecation action is audited (RN-005).
  hrp_alignment:
    - process: HRP-001-P08 Migration and Integration Dry Run
      capability_role: Partner/public API governance segment of the process (shared with BCM-PLT-004).
  rules_to_tests:
    - rule: RN-001
      tests: [TST-APIM-005-01]
    - rule: RN-002
      tests: [TST-APIM-005-02]
    - rule: RN-003
      tests: [TST-APIM-005-03]
    - rule: RN-004
      tests: [TST-APIM-005-04]
    - rule: RN-005
      tests: [TST-APIM-005-05]
    - rule: RN-006
      tests: [TST-APIM-005-06]
    - rule: RN-007
      tests: [TST-APIM-005-07]
