    - process: PRC-APIM-005-01
      commands: [ClassifyApiOperation]
    - process: PRC-APIM-005-02
      commands: [IssuePartnerApiKey]
    - process: PRC-APIM-005-03
      commands: [RevokePartnerApiKey]
    - process: PRC-APIM-005-04
      commands: [ScheduleApiDeprecation]
