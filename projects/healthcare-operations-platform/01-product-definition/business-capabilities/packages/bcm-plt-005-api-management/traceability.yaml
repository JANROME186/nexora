    - operation: classifyApiOperation
      scope: api.classification.manage
    - operation: issuePartnerApiKey
      scope: api.partnerkey.manage
    - operation: revokePartnerApiKey
      scope: api.partnerkey.manage
    - operation: setRateLimitPolicy
      scope: api.ratelimit.manage
  events_to_audit:
    - event: ApiSurfaceClassified
      audit_sink: BCM-PLT-007
    - event: PartnerApiKeyIssued
      audit_sink: BCM-PLT-007
    - event: PartnerApiKeyRevoked
      audit_sink: BCM-PLT-007
    - event: ApiDeprecationScheduled
      audit_sink: BCM-PLT-007
