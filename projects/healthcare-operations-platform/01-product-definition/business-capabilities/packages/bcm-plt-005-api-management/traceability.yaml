validation:
  backlog_item: COM-MOD-012-QA-001
  status: validated
  evidence: ../../../../08-qa/qa/platform-hardening-and-saas-operations/COM-MOD-012-QA-001-validation.yaml
  contribution: >-
    OWASP ZAP API scan (zap-api-scan.py, full /v3/api-docs surface, 353 imported URLs) against the
    running backend found 0 SQLi/XSS/RCE/path-traversal/SSRF findings across every active-scan
    rule (all PASS). It found and this backlog item fixed a real cross-cutting defect: a null byte
    or other invalid-UTF8 string parameter reaching JDBC returned an unhandled 500 (Spring
    DataIntegrityViolationException wrapping a PostgreSQL SQLSTATE 22021 PSQLException) instead of
    a 400 on 6 laboratoryworkflow worklist endpoints plus /api/revenue/cashier/sessions
    (TD-QA-005, closed same-iteration via a narrow GlobalExceptionHandler mapping keyed on the
    SQLSTATE, leaving all other DataIntegrityViolationException causes -- e.g. real 409 conflicts
    -- unregressed). No stack trace or internal path was ever exposed in the client response in
    either case. OWASP ZAP baseline scan against the employee portal (unchanged by this backlog
    item) confirmed 0 FAIL-NEW findings; the 4 WARN-NEW findings (missing CSP/COEP headers,
    non-cacheable content) all match the already-registered TD-FE-005 (deferred to the production
    hosting layer).
