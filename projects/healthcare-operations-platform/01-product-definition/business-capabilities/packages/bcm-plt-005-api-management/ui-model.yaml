artifact:
  id: HOP-UI-BCM-PLT-005
  type: ui-model
  name: API Management UI Model
  version: 0.2.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-005
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: admin_required
    generatable: partial
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: partner_api_later
    generatable: not_applicable
    note: >
      Doctor portal itself consumes governed partner APIs later (COM-MOD-009); it does not surface
      API-management administration.
  public_website:
    status: governance_only
    generatable: not_applicable
    note: >
      This capability has no public-facing screen; COM-MOD-011 public_website operations are
      registered elsewhere (BCM-SVC-001/002/003/005, BCM-ATT-001/006) and governed here via
      ApiSurfaceRegistration classification and RateLimitPolicy, visible only through the existing
      employee-portal SCR-APIM-005-01 screen.

screens:
  - id: SCR-APIM-005-01
    name: API Surface Classification
    route: /admin/api-management/operations
    purpose: List operations across all capabilities and classify them as public, internal or partner.
    components: [DataTable, ClassificationForm, DeprecationScheduleForm]
    generatable: partial
    custom_reason: Classification and deprecation-scheduling forms invoke custom governance commands (RN-001, RN-003).
  - id: SCR-APIM-005-02
    name: Partner API Keys
    route: /admin/api-management/partner-keys
    purpose: Issue, list and revoke partner API keys and view their rate-limit policy.
    components: [DataTable, IssueKeyForm, RevokeAction]
    generatable: partial
    custom_reason: Key issuance validates scope coverage against classified partner operations (RN-002).

states:
  - active
  - deprecation_scheduled
  - retired

localization:
  languages: [en, es]
  default: es
  message_key_namespace: apimanagement.*
  note: >
    New user-facing strings for these screens must be registered under the apimanagement.*
    message-key namespace in the backend MessageSource and frontend locale catalogs established by
    HOP-ENT-FOUND-001/HOP-QA-ALIGN-005, not hardcoded.

rationale: >
  BCM-PLT-005 is an administrative governance capability; only employee-portal administrators
  classify operations, issue partner keys and manage rate limits. No patient or doctor-facing
  screen is modeled here.
