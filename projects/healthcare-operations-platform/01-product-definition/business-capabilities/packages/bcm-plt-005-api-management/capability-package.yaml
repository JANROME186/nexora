  mdpe_standard: ../../../../../../nexora-framework/02-standards/standards/model-driven-product-engineering-standard.yaml
  agent_agnostic_standard: ../../../../../../nexora-framework/02-standards/standards/agent-agnostic-standard.yaml

capability:
  id: BCM-PLT-005
  name:
    en: API Management
    es: API Management
  domain: DOM-10 Platform
  priority: High
  roadmap: MVP2
  dependency_profile: platform_extension
  bounded_context: integration-interoperability
  primary_aggregate: ApiSurfaceRegistration (new platform aggregate owned by this capability)
  process_ref: HRP-001-P08

scope:
  summary: >
    Governance boundary for every API operation HOP exposes: classification as public, internal or
    partner; partner API key issuance, scoping and revocation; rate-limit policy per consumer; and
    deprecation/versioning governance for breaking changes. Does not implement the operations
    themselves (each owning capability's openapi-source.yaml does that); this capability owns only
    the classification, consumer and policy metadata that governs how those operations are exposed
    and consumed externally.
  in_scope:
    - "ApiSurfaceRegistration aggregate: per-operation classification (public/internal/partner), versioning and deprecation metadata."
    - "PartnerApiKey entity: issuance, scope, tenant binding, revocation."
    - Rate-limit policy per consumer and per classification tier.
    - Deprecation window and migration-note governance for breaking changes to a published
      public or partner operation.
  out_of_scope:
    - The business logic of any classified operation itself, which belongs to its owning capability.
    - Message-level protocol normalization for inbound integration traffic (BCM-PLT-004).
    - Bulk file-based migration ingestion (BCM-PLT-010).
    - Concrete rate-limiting middleware/library selection, a custom implementation and stack
      decision deferred to MVP-MOD-008-BE-002/generation-plan.yaml.

roadmap:
  module: COM-MOD-011
  release: REL-002
  package_status: compiled
  next_backlog_item: COM-MOD-011-BE-001
  paused_functional_backlog_item: null
  package_status_correction_note: >-
    Corrected by COM-MOD-011-DEF: next_backlog_item was stale at COM-MOD-009-BE-001 (already
    closed) and package_status at "module_closed" (a roadmap-group state, not a valid
    capability-package_status enum value; capability-package-index.yaml correctly records this
    capability itself as compiled). module/next_backlog_item now point at COM-MOD-011, the
    current consuming module.

dependencies:
