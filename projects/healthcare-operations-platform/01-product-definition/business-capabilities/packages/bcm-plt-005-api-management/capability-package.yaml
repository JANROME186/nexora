product_surfaces:
  backend: required
  employee_portal: admin_required
  patient_portal: not_required
  doctor_portal: partner_api_later
  mobile_app: not_required
  public_website: governance_only
  public_website_note: >-
    This capability has no public-facing screen or endpoint of its own; it governs the
    classification=public entries and public-tier RateLimitPolicy that BCM-SVC-001/002/003/005
    and BCM-ATT-001/006 register for their new public_surface operations under COM-MOD-011. RN-007
    (added by COM-MOD-011-DEF) materially reduces TD-BE-015 by modeling how anonymous public
    consumers are identified for rate-limiting.

