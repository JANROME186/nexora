capability:
  id: BCM-ORG-003
  name:
    en: Branch Management
    es: Gestión de Sucursales
  domain: DOM-01 Organization
  priority: High
  roadmap: MVP1
  dependency_profile: foundation
  bounded_context: organization-management
  primary_aggregate: Branch
  aggregate_ref: AGG-003

scope:
  summary: >
    Governs physical branch location setup, operating schedules, reception and sample collection readiness,
    contact details, and operational status management for Healthcare Operations Platform.
  in_scope:
    - Branch creation, physical address, and geo-location registration under a parent laboratory.
    - Branch operational capacity (reception windows, sample collection stations, appointment capacity).
    - Branch operating hours, holiday calendars, and emergency closure status.
    - Branch contact details, local manager assignment, and customer communication info.
    - Branch status lifecycle (CONFIGURATION, OPERATIONAL, MAINTENANCE, SUSPENDED, CLOSED).
  out_of_scope:
    - Parent laboratory identity and sanitary license management (handled by BCM-ORG-002 Laboratory Management).
    - Detailed appointment slot scheduling algorithms (handled by BCM-ATT-001 Appointment Scheduling).
    - Cash register assignment per cashier (handled by BCM-ATT-005 Cashier Operations).

