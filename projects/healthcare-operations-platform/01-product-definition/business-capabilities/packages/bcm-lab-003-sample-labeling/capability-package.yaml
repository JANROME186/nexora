capability:
  id: BCM-LAB-003
  name:
    en: Sample Labeling
    es: Etiquetado
  domain: DOM-05 Clinical Operations
  priority: High
  roadmap: MVP1
  dependency_profile: clinical_operations
  bounded_context: orders-samples
  primary_aggregate: Sample (AGG-008, owned by BCM-LAB-002)
  process_ref: HRP-001-P05

scope:
  summary: >
    Prints and assigns the specimen barcode label to a collected Sample.
    Holds delegated authority over the Sample.labelInfo field only; it does
    not create, receive, reject or dispose samples. It models its own
    LabelPrintJob process record (print queue, reprint tracking, label
    template selection) and, once a label is confirmed applied, invokes
    the AssignSpecimenLabel command against the Sample aggregate owned by
    BCM-LAB-002.
  in_scope:
    - LabelPrintJob process record (queue, template, reprint count).
    - Specimen barcode generation and print-confirmation workflow.
    - Delegated mutation of Sample.labelInfo through AssignSpecimenLabel.
    - Label mismatch/error detection before confirmation.
  out_of_scope:
    - Sample creation, collection data, rejection at collection (BCM-LAB-002).
    - Sample reception, rejection at reception and disposal (BCM-LAB-005).
    - Container and label template catalog definition (BCM-SVC-007, BCM-SVC-008).
    - Result capture and validation (BCM-LAB-006, BCM-LAB-008, BCM-LAB-009, BCM-LAB-010).

roadmap:
