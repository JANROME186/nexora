artifact:
  id: HOP-UI-BCM-LAB-003
  type: ui-model
  name: Sample Labeling UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-003
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-LBL-003-01
    name: Print and Confirm Label
    route: /samples/{sampleId}/label
    type: action_panel
    scopes: [sample.label]
    components:
      - LabelTemplatePreview
      - PrintLabelButton
      - ConfirmLabelDialog
      - MismatchWarningBanner
      - ReprintLabelButton
    generatable: false
    custom_reason: Combines print-queue status, mismatch-check display and confirmation/reprint actions.

states:
  - queued
  - printed
  - reprint_requested
  - confirmed
  - error

localization:
  languages: [en, es]
  default: es
