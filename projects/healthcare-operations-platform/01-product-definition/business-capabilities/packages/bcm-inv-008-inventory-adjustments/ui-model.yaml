artifact:
  id: HOP-UI-BCM-INV-008
  type: ui-model
  name: Inventory Adjustments UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-008
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: partial
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-ADJ-008-01
    name: Inventory Adjustments
    route: /admin/inventory/adjustments
    purpose: Request, approve and review manual stock corrections.
    components: [DataTable, AdjustmentForm, ApprovalPanel]
    generatable: partial
    custom_reason: Approval confirmation invokes the custom ApplyAdjustment command (RN-001, RN-002, RN-004).

states:
  - requested
  - approved

localization:
  languages: [en, es]
  default: es
  message_key_namespace: inventory.adjustment.*
  note: New user-facing strings must be registered under the inventory.adjustment.* message-key namespace, not hardcoded.

rationale: >
  Inventory adjustments are an internal back-office correction task performed from the employee
  portal, with a mobile capture option deferred per mobile-model.yaml.
