capability:
  id: BCM-INV-008
  name:
    en: Inventory Adjustments
    es: Ajustes
  domain: DOM-08 Inventory
  priority: High
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001; stockSummary correction delegated to this capability)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Records manual stock corrections (physical count discrepancies, data-entry corrections) with a
    mandatory reason code and approval, through the narrowly-scoped ApplyAdjustment command.
    Adjustments can be positive or negative but must never drive quantity negative.
  in_scope:
    - "Positive or negative stock correction with mandatory reasonCode and approver."
  out_of_scope:
    - Routine receipt/exit/consumption/waste movements (BCM-INV-005/006/007/009).
    - Lot metadata ownership (BCM-INV-003).

roadmap:
  module: COM-MOD-010
  release: REL-002
  package_status: modeled
  next_backlog_item: COM-MOD-010-BE-002
  paused_functional_backlog_item: null

