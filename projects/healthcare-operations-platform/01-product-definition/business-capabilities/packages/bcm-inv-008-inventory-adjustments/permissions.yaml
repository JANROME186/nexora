artifact:
  id: HOP-PERM-BCM-INV-008
  type: permissions
  name: Inventory Adjustments Permissions
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-008
  depends_on_capability: BCM-PLT-001

scopes:
  - code: inventory.adjustment.manage
    description: Request or approve a stock adjustment (ApplyAdjustment).
  - code: inventory.adjustment.read
    description: Read adjustment history.

roles:
  - role: tenant-administrator
    grants: [inventory.adjustment.manage, inventory.adjustment.read]
  - role: branch-administrator
    grants: [inventory.adjustment.manage, inventory.adjustment.read]
  - role: laboratory-technician
    grants: [inventory.adjustment.manage, inventory.adjustment.read]

access_policies:
  - id: POL-ADJ-008-01
    statement: Adjustment commands are scoped to the calling actor's tenant, laboratory and branch.
    enforcement: row_level_tenant_laboratory_branch_filter
  - id: POL-ADJ-008-02
    statement: requestedBy and approvedBy must be different users; self-approval is rejected.
    enforcement: separation_of_duties_policy

audit_obligations:
  audit_sink: BCM-PLT-007
  events:
    - event: StockAdjusted
      fields: [adjustmentId, inventoryItemId, stockLotId, quantityDelta, reasonCode]
