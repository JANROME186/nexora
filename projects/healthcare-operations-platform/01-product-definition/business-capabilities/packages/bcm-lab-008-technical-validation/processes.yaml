artifact:
  id: HOP-PROC-BCM-LAB-008
  type: processes
  name: Technical Validation Processes
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-008

actors:
  - id: technical-validator
    actor_ref: ACT-008
    name: Technical Validator
    source: ACM-001

processes:
  - id: PRC-TVL-008-01
    name: Perform technical validation
    actor: technical-validator
    trigger: A result has been submitted for validation and appears on the technical validation worklist.
    commands:
      - PerformTechnicalValidation
    preconditions:
      - Result is in pending_technical_validation status.
      - No unresolved reliability-affecting incident.
      - Actor holds result.manage as technical-validator.
    steps:
      - Run TechnicalAcceptanceCheck (delta check, reference-range plausibility, incident clearance).
      - Evaluate CriticalThresholdCheck.
      - Record TechnicalValidationRecord and transition result to technically_validated.
      - Publish ResultTechnicallyValidated.
    outcome: ResultTechnicallyValidated
    rules: [RN-001, RN-002, RN-006, RN-007]
  - id: PRC-TVL-008-02
    name: Flag critical result
    actor: technical-validator
    trigger: CriticalThresholdCheck indicates the value exceeds a critical bound.
    commands:
      - FlagCriticalResult
    preconditions:
      - Result exists and has a captured ResultValue.
    steps:
      - Record CriticalResultFlag with reason.
      - Publish ResultFlaggedCritical.
      - Trigger the notification/escalation hook toward BCM-PLT-003.
    outcome: ResultFlaggedCritical
    rules: [RN-003, RN-004, RN-005, RN-007]

commands:
  - name: PerformTechnicalValidation
    generatable: false
    custom_reason: Multi-criterion acceptance check and segregation-of-duties enforcement.
  - name: FlagCriticalResult
    generatable: false
    custom_reason: Critical-threshold comparison and mandatory notification hook.
