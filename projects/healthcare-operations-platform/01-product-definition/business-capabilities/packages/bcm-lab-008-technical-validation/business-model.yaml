artifact:
  id: HOP-BM-BCM-LAB-008
  type: business-model
  name: Technical Validation Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-008
  bounded_context: laboratory-results
  primary_aggregate: LaboratoryResult (AGG-009, owned by BCM-LAB-006)
  model_kind: operational_process_over_shared_aggregate

entities:
  - id: ENT-TVL-001
    name: TechnicalValidationWorklistEntry
    is_aggregate_root: false
    described_as: process_record
    owned_by_aggregate: LaboratoryResult
    description: Queue entry for a result pending technical/analytical review.
    fields:
      - name: worklistEntryId
        type: uuid
        required: true
        identifier: true
      - name: resultId
        type: ResultId
        required: true
      - name: tenantId
        type: TenantId
        required: true
      - name: laboratoryId
        type: LaboratoryId
        required: true
      - name: queueStatus
        type: enum
        values: [pending_review, under_review, resolved]
        required: true
      - name: audit
        type: AuditMetadata
        required: true

value_objects:
  - id: VO-TVL-001
    name: TechnicalAcceptanceCheck
    description: Structured technical/analytical review outcome performed before validating a result.
    fields:
      - name: deltaCheckPassed
        type: boolean
        required: true
        description: Whether the value is consistent with the patient's recent prior result for the same analyte, when one exists.
      - name: withinReferenceRangePlausibility
        type: boolean
        required: true
      - name: unresolvedIncidentsCleared
        type: boolean
        required: true
      - name: checkedAt
        type: datetime
        required: true
  - id: VO-TVL-002
    name: CriticalThresholdCheck
    description: Comparison of the captured result value against the ReferenceRangeSnapshot's critical low/high thresholds.
    fields:
      - name: exceedsCriticalLow
        type: boolean
        required: true
      - name: exceedsCriticalHigh
        type: boolean
        required: true
      - name: evaluatedAt
        type: datetime
        required: true

invariants:
  - id: INV-TVL-001
    statement: A result cannot be technically validated while it has an unresolved processing incident affecting reliability.
  - id: INV-TVL-002
    statement: Technical validation may be performed only by an authorized Technical Validator role, never by the actor who captured the result, when tenant policy requires segregation of duties.
  - id: INV-TVL-003
    statement: A result whose value exceeds a critical threshold must be flagged critical before or at the point of technical validation; flagging must never be skipped silently.
  - id: INV-TVL-004
    statement: This capability writes only LaboratoryResult.technicalValidation and LaboratoryResult.criticalFlag; it must never write medicalValidation, releaseRecord or amendments.

external_references:
  - shared_kernel:
      - VO-ID-001 TenantId
      - VO-ID-002 LaboratoryId
      - VO-ID-004 UserId
      - VO-ID-009 ResultId
      - VO-007 AuditMetadata
  - capabilities:
      - BCM-LAB-006 LaboratoryResult aggregate (delegated mutation target for technicalValidation and criticalFlag)
      - BCM-SVC-006 published ReferenceRange (critical-threshold source, already snapshotted by BCM-LAB-006)
      - BCM-PLT-003 Notification Management (critical-result notification hook)
