artifact:
  id: HOP-UI-BCM-LAB-008
  type: ui-model
  name: Technical Validation UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-008
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-TVL-008-01
    name: Technical Validation Worklist
    route: /results/technical-validation-worklist
    type: list
    scopes: [result.manage]
    components:
      - DataTable
      - LaboratoryFilter
      - CriticalIndicatorBadge
    generatable: true
  - id: SCR-TVL-008-02
    name: Technical Validation Review
    route: /results/{resultId}/technical-validation
    type: action_panel
    scopes: [result.manage]
    components:
      - TechnicalAcceptanceChecklist
      - CriticalThresholdIndicator
      - ValidateResultButton
      - FlagCriticalDialog
    generatable: false
    custom_reason: Combines acceptance-criteria checklist with validation and critical-flag actions gated by segregation-of-duties.

states:
  - captured
  - pending_technical_validation
  - technically_validated
  - pending_medical_validation
  - medically_validated
  - released
  - amended

localization:
  languages: [en, es]
  default: es
