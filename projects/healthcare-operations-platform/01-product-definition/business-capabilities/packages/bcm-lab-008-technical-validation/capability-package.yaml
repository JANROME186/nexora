capability:
  id: BCM-LAB-008
  name:
    en: Technical Validation
    es: Validación Técnica
  domain: DOM-05 Clinical Operations
  priority: Critical
  roadmap: MVP1
  dependency_profile: clinical_operations
  bounded_context: laboratory-results
  primary_aggregate: LaboratoryResult (AGG-009, owned by BCM-LAB-006)
  process_ref: HRP-001-P06

scope:
  summary: >
    Performs the analytical/technical review of a submitted LaboratoryResult:
    checks instrument performance, delta checks, reference-range plausibility
    and unresolved processing incidents, then either technically validates
    the result or flags it critical for expedited notification. Holds
    delegated authority over LaboratoryResult.technicalValidation and
    LaboratoryResult.criticalFlag only; it does not capture results, perform
    medical validation or release results.
  in_scope:
    - TechnicalValidationWorklistEntry process record (queue of results pending technical review).
    - Analytical/technical acceptance criteria evaluation (delta check, reference-range plausibility, unresolved incidents).
    - Delegated mutation of LaboratoryResult.technicalValidation through PerformTechnicalValidation.
    - Delegated mutation of LaboratoryResult.criticalFlag through FlagCriticalResult.
  out_of_scope:
    - Result capture and processing incident recording (BCM-LAB-006).
    - Medical validation and clinical interpretation authority (BCM-LAB-009).
    - Result release and post-release amendment (BCM-LAB-010).
    - Notification delivery mechanics for critical results (BCM-PLT-003, hook only in this package).

roadmap:
  module: MVP-MOD-006
  release: REL-001
  package_status: module_closed
  next_backlog_item: none (module closed; see MVP-MOD-007-DEF for the next roadmap module)

