capability:
  id: BCM-QLT-007
  name:
    en: Audit Management
    es: Gestión de Auditorías
  domain: DOM-09 Quality
  priority: High
  roadmap: MVP3
  dependency_profile: quality_compliance
  bounded_context: external-quality-compliance
  primary_aggregate: AuditSchedule (AGG-022)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Manages internal quality audits, accredited external regulatory audits (e.g., ISO 15189, ISO 9001, COFEPRIS, CLIA),
    and vendor/supplier audits. Supports audit planning, scope definition, checklist execution, finding/non-conformity
    recording with severity classification (critical, major, minor, opportunity), linking non-conformities to CAPA (BCM-QLT-006),
    and publishing formal audit reports backed by evidence retained in Document Management (BCM-PLT-008).
  in_scope:
    - Internal and external audit schedule management (planned -> in_progress -> report_pending -> closed).
    - Auditor team assignment (lead auditor, co-auditors).
    - Finding and non-conformity recording with severity classification.
    - Automatic CAPA (BCM-QLT-006) trigger for critical and major non-conformities.
    - Storing immutable audit reports, evidence artifacts, and accreditation documentation (BCM-PLT-008).
  out_of_scope:
    - Operational runtime append-only audit event logging (BCM-PLT-007 Audit Trail).
    - CAPA root cause investigation execution (BCM-QLT-006).

