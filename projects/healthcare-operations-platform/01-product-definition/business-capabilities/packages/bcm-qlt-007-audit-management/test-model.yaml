test_cases:
  - id: TST-AUD-001
    name: Lead Auditor Role Verification
    type: unit
    target_rule: RN-AUD-001
    description: Verify that setting leadAuditorId requires user with quality.audit.execute scope.

  - id: TST-AUD-002
    name: Trigger CAPA on Critical Finding
    type: integration
    target_rule: RN-AUD-002
    description: Verify that logging a finding with severity 'critical' emits AuditFindingRecorded and triggers BCM-QLT-006 CAPA.

  - id: TST-AUD-003
    name: Audit Closure Gating
    type: unit
    target_rule: RN-AUD-003
    description: Verify audit closure is blocked if any finding lacks documented evidence.
