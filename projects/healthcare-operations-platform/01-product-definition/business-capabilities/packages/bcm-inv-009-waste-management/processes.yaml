artifact:
  id: HOP-PROC-BCM-INV-009
  type: processes
  name: Waste Management Processes
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-009

actors:
  - id: laboratory-technician
    actor_ref: ACT-007
    name: Laboratory Technician
    source: ACM-001
    note: Reused as the closest existing role for bench-level disposal recording.
  - id: branch-administrator
    actor_ref: ACT-003
    name: Branch Administrator
    source: ACM-001

processes:
  - id: PRC-WST-009-01
    name: Record waste disposal
    actor: laboratory-technician
    trigger: Stock is found expired, damaged, contaminated or recalled and must be removed from usable inventory.
    commands:
      - ApplyWasteDisposal
    preconditions:
      - StockLot exists and has sufficient remainingQuantity.
      - wasteReasonCode is supplied.
    steps:
      - Decrease StockLot.remainingQuantity and InventoryItem.stockSummary.onHandQuantity.
      - If remainingQuantity reaches zero, transition StockLot.status to disposed.
      - Publish WasteRecorded.
    outcome: WasteRecorded
    rules: [RN-001, RN-002, RN-004, RN-005]

commands:
  - name: ApplyWasteDisposal
    generatable: false
    custom_reason: Delegated multi-field mutation with a real-time quantity guard and a conditional cross-entity status transition.
