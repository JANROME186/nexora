capability:
  id: BCM-INV-009
  name:
    en: Waste Management
    es: Mermas
  domain: DOM-08 Inventory
  priority: High
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001; stockSummary disposal decrease delegated to this capability)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Records disposal of expired, damaged, contaminated or recalled stock, decreasing
    StockLot.remainingQuantity and InventoryItem.stockSummary.onHandQuantity through the
    narrowly-scoped ApplyWasteDisposal command, and marks the StockLot disposed when fully
    exhausted. Distinct from BCM-INV-006 Stock Exits (non-waste movement) and BCM-INV-007
    Consumption Tracking (test-performance-driven usage).
  in_scope:
    - "Waste disposal: decrease StockLot.remainingQuantity and InventoryItem.stockSummary.onHandQuantity, with mandatory wasteReasonCode."
    - Marking a StockLot disposed when its remainingQuantity reaches zero via a waste transaction.
  out_of_scope:
    - Routine transfer/return exits (BCM-INV-006).
    - Test-performance-driven consumption (BCM-INV-007).
    - Lot metadata ownership (BCM-INV-003).

roadmap:
  module: COM-MOD-010
  release: REL-002
  package_status: modeled
  next_backlog_item: COM-MOD-010-CLOSEOUT
  paused_functional_backlog_item: null

