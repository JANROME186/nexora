artifact:
  id: HOP-TEST-BCM-INV-001
  type: test-model
  name: Product Catalog Test Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-001

test_cases:
  - id: TST-CAT-001-01
    type: contract
    validates_rule: RN-001
    statement: Creating an InventoryItem with a duplicate itemCode in the same tenant/laboratory/branch scope is rejected.
    generatable: true
  - id: TST-CAT-001-02
    type: acceptance
    validates_rule: RN-002
    statement: Creating an InventoryItem with classification capital_equipment and itemType consumable is rejected.
    generatable: false
  - id: TST-CAT-001-03
    type: architecture
    validates_rule: RN-003
    statement: No code path outside this capability writes InventoryItem's core identity fields directly.
    generatable: false
  - id: TST-CAT-001-04
    type: acceptance
    validates_rule: RN-004
    statement: A discontinued InventoryItem rejects a new stock-entry command but remains readable.
    generatable: false
  - id: TST-CAT-001-05
    type: contract
    validates_rule: RN-005
    statement: A caller outside the item's tenant/laboratory/branch scope cannot read or manage it.
    generatable: true

test_layers:
  - contract_tests
  - unit_tests
  - acceptance_tests
  - architecture_tests

generation_policy:
  repetitive_tests: generated
  custom_rule_tests: [TST-CAT-001-02, TST-CAT-001-03, TST-CAT-001-04]
