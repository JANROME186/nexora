artifact:
  id: HOP-TRACE-BCM-INV-001
  type: traceability
  name: Product Catalog Traceability
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-001

traces:
  capability_map:
    bcm_001: BCM-INV-001
    domain: DOM-08 Inventory
  dependency_map:
    bcm_002_profile: inventory_quality
    required_capabilities: [BCM-SVC-002, BCM-SVC-007, BCM-ORG-003, BCM-PLT-001, BCM-PLT-007]
    downstream_capabilities: [BCM-INV-002, BCM-INV-004]
  domain_foundation:
    bounded_context: inventory-procurement
    aggregate_reference: AGG-013 InventoryItem (owner; pre-existing aggregate reused, not duplicated)
    context_relationships: [REL-CTX-007]
    context_map_observation: >-
      context-map.yaml REL-CTX-007 already declares inventory-procurement as a customer of
      catalog-test-configuration with published language ConsumableRequirement/ReagentRequirement/
      TestConsumptionProfile; this package reuses those exact names. No context-map.yaml edit was
      required.
    shared_kernel_refs: [VO-ID-001, VO-ID-002, VO-ID-003, VO-007]
  aggregate_catalog_observation: >-
    AGG-013 InventoryItem is formally owned by this capability; the 9 other InventoryItem-referencing
    capabilities in capability-dependency-map.yaml (BCM-INV-002/003/005/006/007/008/009,
    BCM-QLT-003/004/005) hold delegated, field-scoped mutation authority documented in each of
    their own business-model.yaml files. No duplicate or competing aggregate was created.
  brm_alignment: []
  hrp_alignment:
    - process: not_yet_defined_in_HRP-001
      capability_role: >-
        HRP-001 does not yet include an Inventory and Internal Quality reference process; this
        package's processes.yaml is self-contained. Tracked as a non-blocking documentation gap for
        a future HRP-001 extension, not a modeling defect.
  rules_to_tests:
    - rule: RN-001
      tests: [TST-CAT-001-01]
    - rule: RN-002
      tests: [TST-CAT-001-02]
    - rule: RN-003
      tests: [TST-CAT-001-03]
    - rule: RN-004
      tests: [TST-CAT-001-04]
    - rule: RN-005
      tests: [TST-CAT-001-05]
  processes_to_commands:
    - process: PRC-CAT-001-01
      commands: [CreateInventoryItem]
    - process: PRC-CAT-001-02
      commands: [UpdateInventoryItem]
    - process: PRC-CAT-001-03
      commands: [DiscontinueInventoryItem]
  api_to_permissions:
    - operation: createInventoryItem
      scope: inventory.catalog.manage
    - operation: listInventoryItems
      scope: inventory.catalog.read
    - operation: discontinueInventoryItem
      scope: inventory.catalog.manage
  events_to_audit:
    - event: InventoryItemRegistered
      audit_sink: BCM-PLT-007
    - event: InventoryItemDiscontinued
      audit_sink: BCM-PLT-007
  ui_to_api:
    - screen: SCR-CAT-001-01
      operations: [createInventoryItem, listInventoryItems, getInventoryItem, updateInventoryItem, discontinueInventoryItem]
  consumed_by_capabilities:
    - capability: BCM-INV-002
      relationship: Delegated mutation authority over reagentProfile.
    - capability: BCM-INV-003
      relationship: Owns StockLot records referencing inventoryItemId.
    - capability: BCM-INV-005
      relationship: Delegated Apply* authority over stockSummary (increase).
    - capability: BCM-INV-006
      relationship: Delegated Apply* authority over stockSummary (decrease, exit).
    - capability: BCM-INV-007
      relationship: Delegated Apply* authority over stockSummary (decrease, consumption).
    - capability: BCM-INV-008
      relationship: Delegated Apply* authority over stockSummary (correction).
    - capability: BCM-INV-009
      relationship: Delegated Apply* authority over stockSummary (decrease, disposal).
    - capability: BCM-QLT-003
      relationship: Delegated authority over calibrationRecord (equipment items).
    - capability: BCM-QLT-004
      relationship: Delegated authority over equipmentProfile.
    - capability: BCM-QLT-005
      relationship: Delegated authority over maintenanceRecord (equipment items).
    - capability: BCM-INV-004
      relationship: References inventoryItemId (read-only) as purchase order lines.
  generated_outputs_ref: generation-plan.yaml
  qa_evidence: ../../../../08-qa/qa/inventory-and-internal-quality/COM-MOD-010-DEF-validation.yaml
  compilation_evidence:
    backend_implementation: ../../../../../07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/inventoryquality/productcatalog/
    schema: ../../../../../07-implementation/backend/src/main/resources/db/inventory-and-internal-quality/schema.sql
    qa_evidence: ../../../../08-qa/qa/inventory-and-internal-quality/COM-MOD-010-BE-001-validation.yaml
    security_quality_evidence: ../../../../08-qa/security-quality/COM-MOD-010-BE-001/security-quality-evidence.yaml
    notes: >-
      createInventoryItem, listInventoryItems, getInventoryItem, updateInventoryItem compiled as
      generatable outputs. discontinueInventoryItem (RN-004, CUS-CAT-001-03) is exposed and
      consulted by BCM-INV-002/003/004/005 before accepting new commands. CUS-CAT-001-01 (RN-002
      itemType/classification consistency) and CUS-CAT-001-02 (RN-003 delegated-ownership
      boundary) implemented in InventoryItemService.
  backlog_items:
    definition: COM-MOD-010-DEF
    definition_status: closed
    compilation: COM-MOD-010-BE-001
    compilation_status: closed
    custom_rules: COM-MOD-010-BE-001
    custom_rules_status: closed
    ui: COM-MOD-010-FE-001
    ui_status: closed
    validation: COM-MOD-010-QA-001
    validation_status: closed
    closeout: COM-MOD-010-CLOSEOUT
    closeout_status: closed
