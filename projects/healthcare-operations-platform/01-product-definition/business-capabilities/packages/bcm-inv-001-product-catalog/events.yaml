artifact:
  id: HOP-EVT-BCM-INV-001
  type: events
  name: Product Catalog Events
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-001

domain_events:
  - name: InventoryItemRegistered
    description: A new inventory item was registered in the catalog.
    payload: [inventoryItemId, itemType, classification]
    audit: true
  - name: InventoryItemUpdated
    description: Inventory item core identity fields were updated.
    payload: [inventoryItemId]
    audit: true
  - name: InventoryItemDiscontinued
    description: An inventory item was discontinued and can no longer receive new stock movements.
    payload: [inventoryItemId]
    audit: true

integration_events:
  published:
    - name: InventoryItemRegistered
      description: Signals sibling inventory/quality capabilities that a new InventoryItem exists for delegated field assignment.
      consumers: [inventory-procurement]
    - name: InventoryItemDiscontinued
      description: Signals delegated capabilities to stop accepting new movement commands for this item.
      consumers: [inventory-procurement]
  consumed: []

published_language:
  - InventoryItem (read-only reference by inventoryItemId, used by all 12 sibling COM-MOD-010 capabilities)
