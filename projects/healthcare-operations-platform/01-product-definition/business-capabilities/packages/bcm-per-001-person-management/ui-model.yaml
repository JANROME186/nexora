artifact:
  id: HOP-UI-BCM-PER-001
  type: ui-model
  name: Person Management UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PER-001
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-PER-001-01
    name: Global Person Search
    route: /people/search
    type: search
    scopes: [person.read]
    components:
      - PersonSearchInput
      - PersonSearchResultList
      - DocumentTypeFilter
    generatable: true
    notes: Employee portal search across Patients and Doctors within the tenant scope.
  - id: SCR-PER-001-02
    name: Duplicate Detection Panel
    route: /people/duplicates
    type: panel
    scopes: [person.read]
    components:
      - DuplicateCandidateList
      - ConfidenceScoreBadge
      - AuditTraceLink
    generatable: false
    custom_reason: Displays custom confidence scoring results.
  - id: SCR-PER-001-03
    name: Merge Coordination Workspace
    route: /people/merges
    type: workspace
    scopes: [person.merge.read, person.merge.write]
    components:
      - MergeCoordinationList
      - MergeCoordinationDetail
      - MergeAuthorizationBanner
    generatable: false
    custom_reason: Cross-context coordination is a custom process.

states:
  - none
  - searching
  - candidates_available
  - merge_pending
  - merge_completed

localization:
  languages: [en, es]
  default: es
