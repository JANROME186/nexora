artifact:
  id: HOP-PERM-BCM-SVC-001
  type: permissions
  name: Diagnostic Service Catalog Permissions
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-001
  depends_on_capability: BCM-PLT-001

scopes:
  - code: catalog.service.read
    description: Read diagnostic services and published snapshots.
  - code: catalog.service.write
    description: Create and update diagnostic service drafts.
  - code: catalog.service.publish
    description: Publish and deprecate diagnostic services.

roles:
  - role: catalog-administrator
    grants: [catalog.service.read, catalog.service.write]
  - role: laboratory-manager
    grants: [catalog.service.read, catalog.service.write, catalog.service.publish]
  - role: reception-agent
    grants: [catalog.service.read]

access_policies:
  - id: POL-SVC-001-01
    statement: Catalog write and publish operations are tenant and laboratory scoped.
    enforcement: row_level_tenant_laboratory_filter
  - id: POL-SVC-001-02
    statement: Read of unpublished drafts is restricted to catalog authors and managers.
    enforcement: status_based_filter

audit_obligations:
  audit_sink: BCM-PLT-007
  events:
    - event: DiagnosticServiceCreated
      fields: [serviceId, actorId, tenantId]
    - event: DiagnosticServicePublished
      fields: [serviceId, version, actorId]
    - event: DiagnosticServiceDeprecated
      fields: [serviceId, actorId]
