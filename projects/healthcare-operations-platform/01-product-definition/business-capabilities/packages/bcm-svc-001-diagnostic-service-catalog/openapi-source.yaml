artifact:
  id: HOP-API-SRC-BCM-SVC-001
  type: openapi-source
  name: Diagnostic Service Catalog API Source Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-001
  note: >
    Source contract model. The rendered OpenAPI document, controllers, DTOs and
    SDKs are generated outputs declared in generation-plan.yaml and must not be
    authored manually.

api:
  base_path: /api/catalog/diagnostic-services
  surface_classification: internal
  future_surfaces:
    - classification: public
      status: read_only_later
      note: Public website service discovery consumes published snapshots later.
  security:
    scheme: bearer_jwt
    required_scopes_default: [catalog.service.read]

resources:
  - name: DiagnosticService
    operations:
      - id: listDiagnosticServices
        method: GET
        path: /
        scopes: [catalog.service.read]
        generatable: true
      - id: getDiagnosticService
        method: GET
        path: /{serviceId}
        scopes: [catalog.service.read]
        generatable: true
      - id: createDiagnosticService
        method: POST
        path: /
        scopes: [catalog.service.write]
        generatable: true
      - id: updateDiagnosticService
        method: PUT
        path: /{serviceId}
        scopes: [catalog.service.write]
        generatable: true
      - id: publishDiagnosticService
        method: POST
        path: /{serviceId}/publish
        scopes: [catalog.service.publish]
        generatable: false
        custom_reason: Publication validation and snapshot freeze are custom rules.
      - id: deprecateDiagnosticService
        method: POST
        path: /{serviceId}/deprecate
        scopes: [catalog.service.publish]
        generatable: true
      - id: getPublishedServiceSnapshot
        method: GET
        path: /{serviceId}/published-snapshot
        scopes: [catalog.service.read]
        generatable: false
        custom_reason: Returns frozen version-aware snapshot for downstream consumers.

schemas_source:
  - DiagnosticService
  - DiagnosticServiceCategory
  - ServiceComponentLink
  - PublishedServiceSnapshot

error_model:
  standard: rfc7807
  domain_errors:
    - code: CATALOG_SERVICE_CODE_CONFLICT
      maps_to_rule: RN-001
    - code: CATALOG_SERVICE_NOT_PUBLISHABLE
      maps_to_rule: RN-002
