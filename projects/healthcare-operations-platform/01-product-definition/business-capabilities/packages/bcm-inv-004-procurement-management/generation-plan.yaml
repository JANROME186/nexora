artifact:
  id: HOP-GEN-BCM-INV-004
  type: generation-plan
  name: Procurement Management Generation Plan
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-004
  compiler_strategy: model_to_platform

generated_outputs:
  backend:
    - DTOs for PurchaseOrder, PurchaseOrderLine, SupplierSnapshot
    - Repository interfaces and persistence adapters for PurchaseOrder
    - API adapters for createPurchaseOrder, approvePurchaseOrder, cancelPurchaseOrder, listPurchaseOrders
  frontend:
    - Purchase Orders screen (list, create, approve, cancel shells; submit/receive wired separately)
  contracts:
    - Rendered OpenAPI document from openapi-source.yaml
    - Typed SDK
  tests:
    - Repetitive unit tests for RN-003, RN-004, RN-005
  operations:
    - Metric and log wiring from observability-model.yaml
    - Purchase-order-cycle-time alert definitions

custom_implementation_points:
  - id: CUS-PUR-004-01
    description: Cross-capability InventoryItem status validation at submission (RN-001).
    maps_to_backlog: COM-MOD-010-BE-001
  - id: CUS-PUR-004-02
    description: Receipt delegation to BCM-INV-005's own ApplyStockReceipt command (RN-002).
    maps_to_backlog: COM-MOD-010-BE-001

do_not_write_manually:
  - CRUD scaffolding
  - DTOs
  - Controllers
  - Repositories
  - Swagger documentation
  - SDKs
  - Repetitive documentation
  - Repetitive test cases

provenance:
  source_models:
    - business-model.yaml
    - business-rules.yaml
    - processes.yaml
    - events.yaml
    - openapi-source.yaml
    - ui-model.yaml
    - permissions.yaml
    - observability-model.yaml
  generation_metadata_required: true
