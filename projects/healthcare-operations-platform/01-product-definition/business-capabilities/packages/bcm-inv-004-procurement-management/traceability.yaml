artifact:
  id: HOP-TRACE-BCM-INV-004
  type: traceability
  name: Procurement Management Traceability
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-004

traces:
  capability_map:
    bcm_001: BCM-INV-004
    domain: DOM-08 Inventory
  dependency_map:
    bcm_002_profile: inventory_quality
    required_capabilities: [BCM-INV-001, BCM-SVC-002, BCM-SVC-007, BCM-ORG-003, BCM-PLT-001, BCM-PLT-007]
    downstream_capabilities: [BCM-INV-005]
  domain_foundation:
    bounded_context: inventory-procurement
    aggregate_reference: >-
      PurchaseOrder (new entity owned by this capability; no prior aggregate of this name existed
      in aggregate-catalog.yaml). Does not duplicate AGG-013 InventoryItem or AGG-014 Supplier;
      both are referenced by id/snapshot only.
    context_relationships: [REL-CTX-007]
    supplier_ownership_note: >-
      AGG-014 Supplier's bounded_context is inventory-procurement, but its formal capability owner
      is BCM-PER-006 Supplier Management (domain DOM-03 People), which is not part of COM-MOD-010
      and is not yet modeled. This package deliberately does not claim Supplier ownership; it holds
      only a captured SupplierSnapshot value object, consistent with the instruction to document
      ownership/delegation rather than duplicate an aggregate.
    shared_kernel_refs: [VO-ID-001, VO-ID-002, VO-ID-003, VO-001, VO-007]
  brm_alignment: []
  hrp_alignment:
    - process: not_yet_defined_in_HRP-001
      capability_role: Self-contained processes.yaml; tracked as a non-blocking documentation gap.
  rules_to_tests:
    - rule: RN-001
      tests: [TST-PUR-004-01]
    - rule: RN-002
      tests: [TST-PUR-004-02]
    - rule: RN-003
      tests: [TST-PUR-004-03]
    - rule: RN-004
      tests: [TST-PUR-004-04]
    - rule: RN-005
      tests: [TST-PUR-004-05]
  processes_to_commands:
    - process: PRC-PUR-004-01
      commands: [CreatePurchaseOrder, SubmitPurchaseOrder]
    - process: PRC-PUR-004-02
      commands: [ApprovePurchaseOrder, CancelPurchaseOrder]
    - process: PRC-PUR-004-03
      commands: [ReceivePurchaseOrderLine]
  api_to_permissions:
    - operation: createPurchaseOrder
      scope: inventory.procurement.manage
    - operation: approvePurchaseOrder
      scope: inventory.procurement.manage
    - operation: listPurchaseOrders
      scope: inventory.procurement.read
  events_to_audit:
    - event: PurchaseOrderApproved
      audit_sink: BCM-PLT-007
    - event: PurchaseOrderLineReceived
      audit_sink: BCM-PLT-007
  ui_to_api:
    - screen: SCR-PUR-004-01
      operations: [createPurchaseOrder, submitPurchaseOrder, approvePurchaseOrder, cancelPurchaseOrder, receivePurchaseOrderLine, listPurchaseOrders]
  consumed_by_capabilities:
    - capability: BCM-INV-005
      relationship: Receives PurchaseOrderLineReceived to record the actual stock receipt against InventoryItem/StockLot.
  generated_outputs_ref: generation-plan.yaml
  qa_evidence: ../../../../08-qa/qa/inventory-and-internal-quality/COM-MOD-010-DEF-validation.yaml
  compilation_evidence:
    backend_implementation: ../../../../../07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/inventoryquality/procurementmanagement/
    schema: ../../../../../07-implementation/backend/src/main/resources/db/inventory-and-internal-quality/schema.sql
    qa_evidence: ../../../../08-qa/qa/inventory-and-internal-quality/COM-MOD-010-BE-001-validation.yaml
    security_quality_evidence: ../../../../08-qa/security-quality/COM-MOD-010-BE-001/security-quality-evidence.yaml
    notes: >-
      Full purchase-order lifecycle compiled: createPurchaseOrder, listPurchaseOrders,
      submitPurchaseOrder, approvePurchaseOrder, cancelPurchaseOrder, receivePurchaseOrderLine.
      submitPurchaseOrder revalidates every line's InventoryItem status against BCM-INV-001
      (RN-001). Line receipt delegates to BCM-INV-005 StockEntryService which calls back into
      recordLineReceipt to advance the PO's line/header state (single source of truth in this
      capability for line quantity validation). PurchaseOrderLine.STATUS_RECEIVED transitions the
      header to STATUS_RECEIVING/STATUS_RECEIVED automatically.
  backlog_items:
    definition: COM-MOD-010-DEF
    definition_status: closed
    compilation: COM-MOD-010-BE-001
    compilation_status: closed
    custom_rules: COM-MOD-010-BE-002
    custom_rules_status: pending
    ui: COM-MOD-010-FE-001
    ui_status: closed
    validation: COM-MOD-010-QA-001
    validation_status: active
    closeout: COM-MOD-010-CLOSEOUT
    closeout_status: pending
