capability:
  id: BCM-INV-004
  name:
    en: Procurement Management
    es: Compras
  domain: DOM-08 Inventory
  priority: High
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: PurchaseOrder (new entity owned by this capability)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Manages purchase intent toward suppliers: draft, submit, approve and track purchase order
    lines referencing InventoryItem (read-only) until goods receipt. Introduces PurchaseOrder as a
    new, non-duplicating entity in the inventory-procurement bounded context — capability-dependency-
    map.yaml lists only InventoryItem/Supplier as this capability's related aggregates because
    receipt completion is delegated entirely to BCM-INV-005 Stock Entries, never mutated directly
    here. AGG-014 Supplier is owned by the not-yet-modeled BCM-PER-006 Supplier Management; this
    capability holds only a captured, read-only SupplierSnapshot, mirroring the PatientSnapshot
    pattern used by DiagnosticOrder.
  in_scope:
    - "PurchaseOrder lifecycle: draft, submit, approve, cancel."
    - Purchase order lines referencing InventoryItemId (read-only) with requested quantity, unit cost and expected delivery date.
    - Triggering BCM-INV-005's own receipt command on delivery; never writing InventoryItem/StockLot directly.
  out_of_scope:
    - Supplier master data creation/mutation (external reference only; future BCM-PER-006).
    - Actual stock receipt and StockLot creation (BCM-INV-003/005).
    - InventoryItem core identity fields (BCM-INV-001).

