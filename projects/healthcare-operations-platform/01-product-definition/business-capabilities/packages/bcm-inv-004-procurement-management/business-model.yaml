artifact:
  id: HOP-BM-BCM-INV-004
  type: business-model
  name: Procurement Management Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-004
  bounded_context: inventory-procurement
  primary_aggregate: PurchaseOrder
  model_kind: aggregate_owner

entities:
  - id: ENT-PUR-001
    name: PurchaseOrder
    is_aggregate_root: true
    description: >
      New entity owned by this capability. Not a duplicate of AGG-013 InventoryItem or AGG-014
      Supplier; it references both by id/snapshot only and never mutates either directly. Receipt
      completion delegates to BCM-INV-005's own ApplyStockReceipt command.
    fields:
      - name: purchaseOrderId
        type: uuid
        required: true
        identifier: true
      - name: tenantId
        type: TenantId
        required: true
      - name: laboratoryId
        type: LaboratoryId
        required: true
      - name: branchId
        type: BranchId
        required: true
      - name: supplierReference
        type: SupplierSnapshot
        required: true
      - name: lines
        type: list[PurchaseOrderLine]
        required: true
      - name: status
        type: enum
        values: [draft, submitted, approved, partially_received, received, cancelled]
        required: true
      - name: audit
        type: AuditMetadata
        required: true

value_objects:
  - id: VO-PUR-001
    name: SupplierSnapshot
    description: >
      Read-only external reference captured at order creation. AGG-014 Supplier is owned by the
      not-yet-modeled BCM-PER-006 Supplier Management; this value object never triggers a live
      cross-context lookup after capture.
    fields:
      - name: supplierId
        type: uuid
        required: false
      - name: supplierNameSnapshot
        type: string
        required: true
      - name: capturedAt
        type: datetime
        required: true
  - id: VO-PUR-002
    name: PurchaseOrderLine
    description: One requested line item, referencing an existing InventoryItem by id only.
    fields:
      - name: lineId
        type: uuid
        required: true
      - name: inventoryItemId
        type: InventoryItemId
        required: true
      - name: requestedQuantity
        type: decimal
        required: true
      - name: unitCost
        type: Money
        required: true
      - name: expectedDeliveryDate
        type: date
        required: false
      - name: receivedQuantity
        type: decimal
        required: true
        default: 0
        description: Rolled up from BCM-INV-005 receipt confirmations; read-only from this capability's own perspective once receipt begins.

invariants:
  - id: INV-PUR-001
    statement: A PurchaseOrder line's inventoryItemId must reference an existing, non-discontinued InventoryItem at submission time.
  - id: INV-PUR-002
    statement: This capability never mutates InventoryItem or Supplier persistence directly; goods receipt is delegated entirely to BCM-INV-005's own ApplyStockReceipt command.
  - id: INV-PUR-003
    statement: A cancelled or fully received PurchaseOrder is terminal and cannot accept new lines or status transitions.
  - id: INV-PUR-004
    statement: requestedQuantity and unitCost must be strictly greater than zero for every line.

external_references:
  - shared_kernel:
      - VO-ID-001 TenantId
      - VO-ID-002 LaboratoryId
      - VO-ID-003 BranchId
      - VO-001 Money
      - VO-007 AuditMetadata
  - capabilities:
      - BCM-INV-001 InventoryItem aggregate (read-only reference for purchase order lines)
      - BCM-INV-005 Stock Entries (receipt completion delegate)
      - BCM-PER-006 Supplier Management (not yet modeled; AGG-014 Supplier remains an external, ID-only reference)
  - aggregate_catalog:
      - AGG-014 Supplier (owning bounded context inventory-procurement, but formal ownership reserved for the not-yet-modeled BCM-PER-006; this capability does not claim ownership)
