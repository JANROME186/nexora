artifact:
  id: HOP-TEST-BCM-LAB-006
  type: test-model
  name: Laboratory Processing Test Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-006

test_cases:
  - id: TST-LPR-006-01
    type: acceptance
    validates_rule: RN-001
    statement: Capturing a result against a sample that is not received is rejected.
    generatable: false
  - id: TST-LPR-006-02
    type: acceptance
    validates_rule: RN-002
    statement: Capturing a result without a resolvable analyte or reference-range snapshot is rejected.
    generatable: false
  - id: TST-LPR-006-03
    type: acceptance
    validates_rule: RN-003
    statement: A physiologically implausible numeric value for the analyte's unit raises a processing incident rather than being silently accepted.
    generatable: false
  - id: TST-LPR-006-04
    type: architecture
    validates_rule: RN-004
    statement: This capability never parses raw ASTM, HL7 or file-based protocol payloads directly.
    generatable: false
  - id: TST-LPR-006-05
    type: acceptance
    validates_rule: RN-005
    statement: Submitting a result for validation with an unresolved reliability-affecting incident is rejected.
    generatable: false
  - id: TST-LPR-006-06
    type: architecture
    validates_rule: RN-006
    statement: No capability other than BCM-LAB-006, BCM-LAB-008, BCM-LAB-009 or BCM-LAB-010 writes LaboratoryResult persistence directly, and no AI capability calls a validation, release or amendment command.
    generatable: false
  - id: TST-LPR-006-07
    type: contract
    validates_rule: RN-007
    statement: Unauthorized or out-of-scope actors cannot capture a result or record an incident.
    generatable: true
  - id: TST-LPR-006-08
    type: unit
    validates_rule: RN-008
    statement: ResultCaptured carries actor, branch, sample reference and analyte reference.
    generatable: true

test_layers:
  - contract_tests
  - unit_tests
  - acceptance_tests
  - architecture_tests

generation_policy:
  repetitive_tests: generated
  custom_rule_tests: [TST-LPR-006-01, TST-LPR-006-02, TST-LPR-006-03, TST-LPR-006-04, TST-LPR-006-05, TST-LPR-006-06]
