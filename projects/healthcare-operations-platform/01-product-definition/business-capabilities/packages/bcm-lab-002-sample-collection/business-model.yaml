artifact:
  id: HOP-BM-BCM-LAB-002
  type: business-model
  name: Sample Collection Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-002
  bounded_context: orders-samples
  primary_aggregate: Sample
  model_kind: aggregate_owner

entities:
  - id: ENT-COL-001
    name: Sample
    is_aggregate_root: true
    aggregate_ref: AGG-008
    description: >
      The sample aggregate. This capability defines the complete field
      structure and creates the aggregate; BCM-LAB-003 and BCM-LAB-005 hold
      delegated authority to mutate specific named fields (labelInfo;
      receptionRecord, rejectionReason, disposal) through their own commands,
      never through direct persistence access.
    fields:
      - name: sampleId
        type: SampleId
        required: true
        identifier: true
      - name: tenantId
        type: TenantId
        required: true
      - name: laboratoryId
        type: LaboratoryId
        required: true
      - name: branchId
        type: BranchId
        required: true
      - name: orderId
        type: OrderId
        required: true
        description: References the accepted DiagnosticOrder line this sample fulfills.
      - name: orderLineId
        type: uuid
        required: true
      - name: patientSnapshot
        type: PatientIdentitySnapshot
        required: true
      - name: sampleRequirementSnapshot
        type: SampleRequirementSnapshot
        required: true
      - name: collectionData
        type: SampleCollectionData
        required: true
      - name: labelInfo
        type: SpecimenLabelInfo
        required: false
        description: Owned by BCM-LAB-003; null until AssignSpecimenLabel executes.
      - name: receptionRecord
        type: SampleReceptionRecord
        required: false
        description: Owned by BCM-LAB-005; null until ReceiveSampleAtLaboratory or RejectSampleAtReception executes.
      - name: rejectionReason
        type: SampleRejectionReason
        required: false
      - name: status
        type: SampleStatus
        required: true
      - name: chainOfCustody
        type: list[ChainOfCustodyEvent]
        required: true
      - name: audit
        type: AuditMetadata
        required: true

value_objects:
  - id: VO-COL-001
    name: PatientIdentitySnapshot
    description: Minimal immutable patient identity fields needed on the specimen label and worklist, captured at collection time from the DiagnosticOrder's own PatientSnapshot (never re-read live from BCM-PER-002).
    fields:
      - name: patientId
        type: PatientId
        required: true
      - name: name
        type: PersonName
        required: true
      - name: birthDate
        type: date
        required: true
      - name: capturedAt
        type: datetime
        required: true
  - id: VO-COL-002
    name: SampleRequirementSnapshot
    description: Immutable copy of the published SampleRequirement (container type, minimum volume, handling instructions) captured at collection time from BCM-SVC-007.
    fields:
      - name: sampleRequirementId
        type: uuid
        required: true
      - name: publishedVersion
        type: integer
        required: true
      - name: containerType
        type: string
        required: true
      - name: minimumVolume
        type: string
        required: false
      - name: handlingInstructions
        type: string
        required: false
      - name: capturedAt
        type: datetime
        required: true
  - id: VO-COL-003
    name: SampleCollectionData
    description: Data captured at the moment of physical collection.
    fields:
      - name: collectorId
        type: UserId
        required: true
      - name: collectionSite
        type: string
        required: false
        description: Anatomical or physical collection site (for example left antecubital vein).
      - name: collectionMethod
        type: enum
        values: [venipuncture, capillary, swab, urine_midstream, stool, other]
        required: true
      - name: containerUsed
        type: string
        required: true
      - name: collectedAt
        type: datetime
        required: true
      - name: patientConditionAtCollection
        type: enum
        values: [normal, fasting_confirmed, non_fasting, difficult_draw, other]
        required: false
  - id: VO-COL-004
    name: SpecimenLabelInfo
    description: Owned and mutated exclusively by BCM-LAB-003; modeled here only as a field placeholder on the shared aggregate.
    fields:
      - name: labelId
        type: uuid
        required: true
      - name: barcodeValue
        type: string
        required: true
      - name: printedAt
        type: datetime
        required: true
  - id: VO-COL-005
    name: SampleReceptionRecord
    description: Owned and mutated exclusively by BCM-LAB-005; modeled here only as a field placeholder on the shared aggregate.
    fields:
      - name: receivedBy
        type: UserId
        required: true
      - name: receivedAt
        type: datetime
        required: true
      - name: conditionAtReception
        type: enum
        values: [acceptable, hemolyzed, insufficient_volume, wrong_container, unlabeled, clotted, other]
        required: true
  - id: VO-COL-006
    name: SampleRejectionReason
    description: Structured rejection reason, capturable either at collection (this capability) or at reception (BCM-LAB-005).
    fields:
      - name: rejectedBy
        type: UserId
        required: true
      - name: rejectedAt
        type: datetime
        required: true
      - name: rejectionStage
        type: enum
        values: [at_collection, at_reception]
        required: true
      - name: reasonCode
        type: enum
        values: [hemolysis, insufficient_volume, wrong_container, unlabeled, clotted, contaminated, expired_transport_window, patient_refused, other]
        required: true
      - name: notes
        type: string
        required: false
  - id: VO-COL-007
    name: ChainOfCustodyEvent
    description: Append-only custody trace entry. Every state transition on Sample appends one event; entries are never edited or removed.
    fields:
      - name: eventType
        type: enum
        values: [collected, labeled, received, rejected, in_process, disposed]
        required: true
      - name: actorId
        type: UserId
        required: true
      - name: occurredAt
        type: datetime
        required: true
      - name: locationBranchId
        type: BranchId
        required: true
  - id: VO-COL-008
    name: SampleStatus
    description: Sample lifecycle state.
    values: [collected, labeled, in_transit, received, rejected, in_process, disposed]

invariants:
  - id: INV-COL-001
    statement: A Sample must always reference a valid, accepted DiagnosticOrder line and carry a PatientIdentitySnapshot and SampleRequirementSnapshot captured at collection time; it must never resolve these by live lookup.
  - id: INV-COL-002
    statement: A Sample cannot exist without at least one ChainOfCustodyEvent; the collected event is appended atomically with aggregate creation.
  - id: INV-COL-003
    statement: Only BCM-LAB-002, BCM-LAB-003 and BCM-LAB-005 may mutate Sample state, each restricted to its own named field set; no other capability or bounded context may write Sample persistence directly.
  - id: INV-COL-004
    statement: A rejected Sample is terminal; it can never transition to received, in_process or disposed except through the explicit disposal-of-rejected-sample path.
  - id: INV-COL-005
    statement: The chain-of-custody list is append-only; existing entries are immutable.

external_references:
  - shared_kernel:
      - VO-ID-001 TenantId
      - VO-ID-002 LaboratoryId
      - VO-ID-003 BranchId
      - VO-ID-004 UserId
      - VO-ID-005 PatientId
      - VO-ID-007 OrderId
      - VO-ID-008 SampleId
      - VO-002 PersonName
      - VO-007 AuditMetadata
  - capabilities:
      - BCM-LAB-001 DiagnosticOrder aggregate (read-only order-line source)
      - BCM-SVC-007 published SampleRequirement (read-only snapshot source)
      - BCM-PER-002 Patient aggregate (indirect, via DiagnosticOrder's own snapshot)
      - BCM-ORG-003 Branch aggregate (read-only reference source)
  - aggregate_catalog:
      - AGG-008 Sample (forbidden_mutators: laboratory-results, inventory-procurement, billing-tax)
