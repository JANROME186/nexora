capability:
  id: BCM-RES-004
  name:
    en: Digital Delivery
    es: Entrega Digital
  domain: DOM-07 Results
  priority: High
  roadmap: MVP1
  dependency_profile: results_delivery
  bounded_context: laboratory-results
  primary_aggregate: ResultDeliveryTicket (new entity owned by this capability; LaboratoryResult AGG-009 is read-only)
  process_ref: HRP-001-P07

scope:
  summary: >
    Delivers a released result and its generated report to authorized patient, doctor and mobile
    channels. Enforces that only released results are ever delivered externally, that patients and
    representatives see only their own (or represented) results, and that doctors see only results
    linked to their referral or treatment relationship. Owns a ResultDeliveryTicket process record
    tracking delivery attempts and status; never mutates LaboratoryResult, Patient or Doctor.
    Notification dispatch itself is delegated to BCM-RES-007/BCM-PLT-003, keeping this capability
    decoupled from any specific delivery provider.
  in_scope:
    - ResultDeliveryTicket entity: delivery channel, recipient, status, delivered/viewed timestamps.
    - Release-state and authorization gate before any external visibility (patient portal, doctor portal, mobile app).
    - Patient representative authorization check before delivering to a representative.
    - Delegated notification trigger through BCM-RES-007 when a delivery becomes visible.
    - Recording ResultViewed when an authorized recipient opens the result.
  out_of_scope:
    - LaboratoryResult aggregate ownership and release/amendment authority (BCM-LAB-006, BCM-LAB-010).
    - PDF report generation and document storage (BCM-RES-002, BCM-PLT-008).
    - Notification message composition and provider dispatch (BCM-RES-007, BCM-PLT-003).
    - Chronological multi-result history views (BCM-RES-005).

