artifact:
  id: HOP-PROC-BCM-RES-004
  type: processes
  name: Digital Delivery Processes
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-RES-004

actors:
  - id: patient
    actor_ref: ACT-012
    name: Patient
    source: ACM-001
  - id: patient-representative
    actor_ref: ACT-013
    name: Patient Representative
    source: ACM-001
  - id: referring-doctor
    actor_ref: ACT-011
    name: Referring Doctor
    source: ACM-001

processes:
  - id: PRC-DLV-004-01
    name: Authorize result delivery
    actor: system
    trigger: ResultReleased is published for a result whose order has patient and/or referring-doctor recipients.
    commands:
      - AuthorizeResultDelivery
    preconditions:
      - LaboratoryResult status is released.
    steps:
      - Run DeliveryAuthorizationCheck per recipient (patient, representative, referring doctor).
      - Create ResultDeliveryTicket in authorized status for each recipient that passes the check.
      - Trigger the notification hook toward BCM-RES-007.
    outcome: ResultDeliveryAuthorized
    rules: [RN-001, RN-002, RN-003, RN-004, RN-006]
  - id: PRC-DLV-004-02
    name: View delivered result
    actor: patient
    trigger: An authorized recipient opens their delivered result in the patient portal, doctor portal or mobile app.
    commands:
      - RecordResultViewed
    preconditions:
      - ResultDeliveryTicket is in authorized or delivered status for this recipient.
    steps:
      - Serve the result summary and attached report reference.
      - Record ResultViewed with viewedAt.
      - Transition the ticket to viewed.
    outcome: ResultViewed
    rules: [RN-007, RN-008]
  - id: PRC-DLV-004-03
    name: Withhold delivery on amendment
    actor: system
    trigger: ResultAmended is published for a result with existing delivery tickets.
    commands:
      - WithholdResultDelivery
    preconditions:
      - One or more ResultDeliveryTicket records exist for the resultId.
    steps:
      - Transition existing tickets to withheld.
      - Re-run PRC-DLV-004-01 to re-authorize delivery of the amended result.
    outcome: ResultDeliveryWithheld
    rules: [RN-005]

commands:
  - name: AuthorizeResultDelivery
    generatable: false
    custom_reason: Multi-recipient authorization check spanning release state, identity and referral relationship.
  - name: RecordResultViewed
    generatable: false
    custom_reason: View-state transition distinct from a generic access audit entry.
  - name: WithholdResultDelivery
    generatable: false
    custom_reason: Amendment-triggered state transition and re-authorization.
