artifact:
  id: HOP-CAP-PKG-IDX-001
  type: capability-package-index
  name: HOP Business Capability Package Index
  version: 2.0.0
  status: approved
  human_readable: README.md
  machine_readable: capability-package-index.yaml
  qa_evidence: ../../../08-qa/qa/inventory-and-internal-quality/COM-MOD-010-DEF-validation.yaml

policy:
  primary_development_unit: business_capability_package
  roadmap_grouping_allowed: true
  source_capability_map: ../bcm-001/business-capability-map.yaml
  dependency_map: ../bcm-002/capability-dependency-map.yaml
  standard: ../../../../../nexora-framework/02-standards/standards/capability-package-standard.yaml
  execution_flow:
    - model
    - compile
    - implement_rules
    - validate
    - release

do_not_write_manually:
  - CRUD scaffolding
  - DTOs
  - Controllers
  - Repositories
  - Swagger documentation
  - SDKs
  - Repetitive documentation
  - Duplicate models
  - Repetitive test cases

