capability:
  id: BCM-PLT-003
  name:
    en: Notification Management
    es: Notificaciones
  domain: DOM-10 Platform
  priority: High
  roadmap: MVP1
  dependency_profile: platform_extension
  bounded_context: notifications
  primary_aggregate: NotificationRequest (new platform aggregate owned by this capability)
  process_ref: HRP-001-P07

scope:
  summary: >
    Provider-agnostic notification dispatch platform capability. Receives NotificationRequest
    submissions from business capabilities (BCM-RES-007 for result notifications; other
    capabilities in later modules), routes them to a configured channel (email, SMS, push, in-app)
    through a NotificationProviderPort, and records delivery outcome. Never owns a business
    decision about what to send or to whom — that remains with the requesting capability (per
    REL-CTX-012, "notifications subscribes to events but does not own business decisions"); this
    capability is a pure dispatch and delivery-tracking mechanism.
  in_scope:
    - NotificationRequest aggregate: recipient, channel, template reference, payload, dispatch status.
    - NotificationProviderPort with channel-specific adapters (email, SMS, push, in-app), defaulting to a local/deterministic adapter for on-premises deployment.
    - Delivery attempt tracking, retry policy and terminal outcome recording.
    - Recipient notification preference lookup (opt-in/opt-out per channel).
  out_of_scope:
    - Deciding what event should produce a notification or its business content (BCM-RES-007 and other requesting capabilities own that).
    - Result-specific notification composition (BCM-RES-007).
    - Any business aggregate mutation (LaboratoryResult, Patient, Doctor, Sample).

roadmap:
