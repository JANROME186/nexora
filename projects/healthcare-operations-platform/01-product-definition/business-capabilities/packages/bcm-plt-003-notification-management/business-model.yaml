artifact:
  id: HOP-BM-BCM-PLT-003
  type: business-model
  name: Notification Management Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-003
  bounded_context: notifications
  primary_aggregate: NotificationRequest
  model_kind: aggregate_owner

entities:
  - id: ENT-NOT-001
    name: NotificationRequest
    is_aggregate_root: true
    description: >
      A single notification dispatch request submitted by a requesting capability (e.g.
      BCM-RES-007). This capability owns dispatch mechanics only; the business decision to notify
      and the message content template selection belong to the requester.
    fields:
      - name: notificationRequestId
        type: uuid
        required: true
        identifier: true
      - name: tenantId
        type: TenantId
        required: true
      - name: requestingCapability
        type: string
        required: true
        description: Identifies the capability that submitted the request (e.g. BCM-RES-007), for traceability only.
      - name: requestingReferenceId
        type: uuid
        required: true
        description: The requester's own entity id (e.g. a ResultNotificationRequest id); opaque to this capability.
      - name: recipientId
        type: uuid
        required: true
      - name: recipientType
        type: enum
        values: [patient, doctor, patient_representative, internal_staff]
        required: true
      - name: channel
        type: enum
        values: [email, sms, push, in_app]
        required: true
      - name: templateReference
        type: string
        required: true
        description: Opaque template identifier resolved by BCM-PLT-003 against a template registry; content composition remains the requester's responsibility.
      - name: templateParameters
        type: map[string,string]
        required: true
      - name: priority
        type: enum
        values: [normal, high, critical]
        required: true
        default: normal
      - name: deliveryAttempts
        type: list[NotificationDeliveryAttempt]
        required: true
      - name: status
        type: enum
        values: [queued, dispatched, delivered, failed, suppressed_by_preference]
        required: true
      - name: audit
        type: AuditMetadata
        required: true

value_objects:
  - id: VO-NOT-001
    name: NotificationDeliveryAttempt
    description: One dispatch attempt to the configured provider adapter, recording outcome for retry/audit purposes.
    fields:
      - name: attemptNumber
        type: integer
        required: true
      - name: attemptedAt
        type: datetime
        required: true
      - name: outcome
        type: enum
        values: [success, transient_failure, permanent_failure]
        required: true
      - name: providerReference
        type: string
        required: false
        description: Opaque provider-assigned tracking id, when the adapter returns one.
  - id: VO-NOT-002
    name: RecipientNotificationPreference
    description: Recipient's opt-in/opt-out preference per channel, checked before dispatch.
    fields:
      - name: channel
        type: enum
        values: [email, sms, push, in_app]
        required: true
      - name: optedIn
        type: boolean
        required: true
      - name: criticalOverrideAllowed
        type: boolean
        required: true
        default: true
        description: When true, a critical-priority request may still dispatch on this channel even if the recipient opted out of routine notifications, per tenant policy.

ports:
  - id: PORT-NOT-001
    name: NotificationProviderPort
    description: >
      Provider-agnostic dispatch boundary, mirroring the FiscalAdapterPort (MVP-MOD-005) and
      DocumentStoragePort (BCM-PLT-008) patterns. Callers depend only on this interface; the
      physical channel/provider (SMTP relay, SMS gateway, push service) is a replaceable adapter.
    operations:
      - dispatch(NotificationRequest) -> NotificationDeliveryAttempt
    default_adapter: local_deterministic_adapter
    adapter_reference: >
      A local, self-hostable adapter suitable for on-premises/dev deployment (for example a local
      SMTP relay for email and an in-app channel requiring no external provider); production
      channel adapters (SMS gateway, push notification service) may be added later without
      changing this port.

invariants:
  - id: INV-NOT-001
    statement: A NotificationRequest can be dispatched only after checking RecipientNotificationPreference for the target channel, unless priority is critical and criticalOverrideAllowed is true.
  - id: INV-NOT-002
    statement: All physical dispatch goes through NotificationProviderPort; no caller or internal code path may address a channel provider directly.
  - id: INV-NOT-003
    statement: This capability never decides business notification content or trigger conditions; templateReference and templateParameters are supplied verbatim by the requesting capability.
  - id: INV-NOT-004
    statement: This capability never mutates any business aggregate (LaboratoryResult, Patient, Doctor, Sample).

external_references:
  - shared_kernel:
      - VO-ID-001 TenantId
      - VO-007 AuditMetadata
  - capabilities:
      - BCM-RES-007 Result Notifications (primary caller in MVP-MOD-007 scope)
  - context_map:
      - REL-CTX-012 (notifications subscribes to events but does not own business decisions)
