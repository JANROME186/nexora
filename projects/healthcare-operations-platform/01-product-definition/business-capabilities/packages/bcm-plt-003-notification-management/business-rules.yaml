artifact:
  id: HOP-BR-BCM-PLT-003
  type: business-rules
  name: Notification Management Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-003
  rule_id_pattern: "RN-###"

rules:
  - id: RN-001
    statement: A notification cannot dispatch on a channel the recipient has opted out of, unless priority is critical and the tenant's criticalOverrideAllowed policy permits override.
    applies_to: NotificationRequest
    enforcement_point: command:DispatchNotification
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Preference lookup and critical-override policy evaluation are custom logic, not a generic field check.
    test_refs: [TST-NOT-003-01]
  - id: RN-002
    statement: All physical dispatch must go through NotificationProviderPort; no code path may call a channel provider (SMTP, SMS gateway, push service) directly.
    applies_to: NotificationRequest
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Enforces the provider-agnostic adapter boundary mirroring FiscalAdapterPort (MVP-MOD-005) and DocumentStoragePort (BCM-PLT-008).
    test_refs: [TST-NOT-003-02]
  - id: RN-003
    statement: This capability never determines notification content or trigger conditions; it dispatches only the templateReference and templateParameters supplied verbatim by the requesting capability.
    applies_to: NotificationRequest
    enforcement_point: command:SubmitNotificationRequest
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Boundary enforcement consistent with REL-CTX-012 (notifications does not own business decisions).
    test_refs: [TST-NOT-003-03]
  - id: RN-004
    statement: A failed dispatch attempt must be retried according to the configured retry policy before the request transitions to a terminal failed status; retries are capped to prevent unbounded resource use.
    applies_to: NotificationRequest
    enforcement_point: command:DispatchNotification
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Retry-policy sequencing and terminal-state determination are custom workflow logic.
    test_refs: [TST-NOT-003-04]
  - id: RN-005
    statement: This capability never mutates any business aggregate; it only writes its own NotificationRequest entity.
    applies_to: NotificationRequest
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Keeps this a generic, domain-agnostic dispatch service.
    test_refs: [TST-NOT-003-05]
  - id: RN-006
    statement: Notification commands must execute within the requesting capability's tenant scope.
    applies_to: NotificationRequest
    enforcement_point: authorization:notification.submit, authorization:notification.read
    severity: critical
    audit_required: true
    generatable: true
    test_refs: [TST-NOT-003-06]
  - id: RN-007
    statement: Every dispatch attempt and terminal outcome must be recorded and auditable, including provider reference when available.
    applies_to: NotificationRequest
    enforcement_point: event:NotificationDispatched, event:NotificationDeliveryFailed
    severity: high
    audit_required: true
    generatable: true
    test_refs: [TST-NOT-003-07]

enforcement_summary:
  generatable_rules: [RN-006, RN-007]
  custom_implementation_rules: [RN-001, RN-002, RN-003, RN-004, RN-005]
