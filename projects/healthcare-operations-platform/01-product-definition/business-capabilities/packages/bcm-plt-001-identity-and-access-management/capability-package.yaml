capability:
  id: BCM-PLT-001
  name:
    en: Identity and Access Management
    es: Gestión de Identidad y Accesos
  domain: DOM-10 Platform
  priority: Critical
  roadmap: MVP1
  dependency_profile: foundation
  bounded_context: identity-access
  primary_aggregate: UserAccount
  aggregate_ref: AGG-004

scope:
  summary: >
    Governs user authentication, session management, multi-factor authentication (MFA),
    service account token governance, fine-grained action permissions (domain.resource.action.scope per TD-IAM-002),
    and SaaS operational authorization for all HOP channels and platform operations.
  in_scope:
    - User registration, authentication, login, logout, MFA verification, and session lifecycle.
    - Password hashing, verification, and credential management.
    - Service account token generation and scope policy enforcement for automated SaaS operations.
    - Fine-grained permission model (`domain.resource.action.scope`) and role-to-permission mapping (addressing TD-IAM-002).
    - Support-assisted access (delegated login support for troubleshooting) with strict audit checks.
    - es-MX / en-US localization of IAM errors and interface keys.
  out_of_scope:
    - Business capabilities logic for downstream clinical or billing actions.
    - PDF report storage or generation (BCM-RES-002, BCM-PLT-008).
    - Email/SMS provider integrations (handled via BCM-PLT-003 Notification Management).

roadmap:
