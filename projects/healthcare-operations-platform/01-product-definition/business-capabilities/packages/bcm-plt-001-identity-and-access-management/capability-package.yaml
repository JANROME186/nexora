capability:
  id: BCM-PLT-001
  name:
    en: Identity and Access Management
    es: Gestión de Identidad y Accesos
  domain: DOM-10 Platform
  priority: Critical
  roadmap: MVP1
  dependency_profile: foundation
  bounded_context: identity-access
  primary_aggregate: UserAccount
  aggregate_ref: AGG-004

scope:
  summary: >
    Governs user authentication, session management, and authorization for all HOP channels,
    including the Employee Portal, Patient Portal, Doctor Portal, and Mobile App. Owns the
    UserAccount aggregate (AGG-004) under the identity-access bounded context. Defines the
    coarse-grained screen-level permission catalog and the role-to-permission mapping used to
    drive dynamic menus, as well as audit logging for authorization and support-assisted logins.
  in_scope:
    - User registration, authentication, login, logout, and session lifecycle.
    - Password hashing, verification, and credential management.
    - Dynamic menu filter metadata and permission verification.
    - Coarse-grained screen-level permissions catalog (27 screen codes plus portal codes).
    - Support-assisted access (delegated login support for troubleshooting) with strict audit checks.
    - es-MX / en-US localization of IAM errors and interface keys.
  out_of_scope:
    - Business capabilities logic for downstream clinical or billing actions.
    - PDF report storage or generation (BCM-RES-002, BCM-PLT-008).
    - Email/SMS provider integrations (handled via BCM-PLT-003 Notification Management).

