artifact:
  id: HOP-BR-BCM-PLT-001
  type: business-rules
  name: Identity and Access Management Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-001

rules:
  - id: RN-001
    statement: All passwords must be hashed using a cryptographically secure algorithm (e.g., bcrypt) before database persistence.
    applies_to: UserAccount.passwordHash
    enforcement_point: before_save
    severity: Critical
    audit_required: false
    test_refs: [TS-IAM-001]
  - id: RN-002
    statement: Users are locked out for 15 minutes after 5 consecutive failed login attempts to prevent brute-force attacks.
    applies_to: UserAccount.failedLoginAttempts
    enforcement_point: authentication_flow
    severity: High
    audit_required: true
    test_refs: [TS-IAM-002]
  - id: RN-003
    statement: Active sessions must be invalidated upon password reset or suspension of the associated UserAccount.
    applies_to: SessionContext
    enforcement_point: request_interceptor
    severity: High
    audit_required: true
    test_refs: [TS-IAM-003]
  - id: RN-004
    statement: Support-assisted login (impersonation) requires explicit customer authorization, is restricted to read-only access (no clinical signature or payment capture), and creates an immutable audit trail.
    applies_to: SupportAssistanceFlow
    enforcement_point: assistance_initiation
    severity: Critical
    audit_required: true
    test_refs: [TS-IAM-004]
  - id: RN-005
    statement: Least privilege must be enforced by deny-by-default role filtering for portals and employee navigation screens.
    applies_to: AccessControlInterceptor
    enforcement_point: request_authorization
    severity: Critical
    audit_required: true
    test_refs: [TS-IAM-005]
  - id: RN-006
    statement: Localization preference (es-MX / en-US) must be tied to the session/login context and dynamically propagated to all API response messages.
    applies_to: SessionContext
    enforcement_point: response_formatting
    severity: Medium
    audit_required: false
    test_refs: [TS-IAM-006]
