capability:
  id: BCM-ORG-001
  name:
    en: Tenant Management
    es: Gestión de Tenants
  domain: DOM-01 Organization
  priority: High
  roadmap: MVP1
  dependency_profile: foundation
  bounded_context: organization-management
  primary_aggregate: Tenant
  aggregate_ref: AGG-017

scope:
  summary: >
    Governs multi-tenant lifecycle management, tenant provisioning, configuration overrides,
    resource quota enforcement, database/schema isolation policies (including PostgreSQL native RLS policy specs),
    and SaaS subscription status binding for Healthcare Operations Platform.
  in_scope:
    - Tenant onboarding, provisioning, activation, suspension, and archive lifecycle.
    - Tenant-level quota definition (storage, API calls, active users, branch limits).
    - Tenant database/schema isolation policies (PostgreSQL native Row-Level Security parameters per TD-DB-004).
    - Tenant organization profile, branding customization, locale defaults, and subscription binding.
    - Tenant offboarding and data retention/purge workflow triggering.
  out_of_scope:
    - Individual user credential management (handled by BCM-PLT-001 IAM).
    - Fine-grained feature flag toggling (handled by BCM-PLT-002 Platform Configuration).
    - Invoicing and fiscal billing for SaaS subscription billing (handled by BCM-ATT-008).

