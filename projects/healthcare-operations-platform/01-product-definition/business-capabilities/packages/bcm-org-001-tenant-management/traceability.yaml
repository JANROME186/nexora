artifact:
  id: HOP-TRC-BCM-ORG-001
  type: traceability
  name: Tenant Management Traceability Matrix
  version: 1.0.0

capability_id: BCM-ORG-001
roadmap_group: COM-MOD-012

mappings:
  - requirement: "SaaS Tenant Operations & Multi-Tenancy Hardening"
    rules: [RN-TEN-001, RN-TEN-002, RN-TEN-003, RN-TEN-004]
    processes: [PROC-TEN-001, PROC-TEN-002, PROC-TEN-003]
    events: [TenantProvisionedEvent, TenantStatusChangedEvent, TenantQuotaExceededEvent]
    api_endpoints: ["/api/v1/platform/tenants", "/api/v1/platform/tenants/{tenantId}/status"]
    permissions: [tenant:create, tenant:read, tenant:update_status, tenant:manage_quota]
    tests: [TEST-TEN-001, TEST-TEN-002, TEST-TEN-003, TEST-TEN-004]
    technical_debt_addressed: [TD-DB-004]

operational_strategy:
  backlog_item: COM-MOD-012-OPS-002
  status: closed
  evidence: ../../../../08-qa/qa/platform-hardening-and-saas-operations/COM-MOD-012-OPS-002-validation.yaml
  contribution: >-
    Tenant onboarding, isolation smoke checks, subscription state and tenant promotion controls
    (COM-MOD-012-OPS-001). COM-MOD-012-OPS-002 adds tenant-impact-triage-runbook.yaml, the
    executable procedure that determines tenant scope during any incident, restore or higher-risk
    deployment and serves as the operational compensating control for TD-DB-004 pending native
    Row Level Security.

implementation:
  backlog_item: COM-MOD-012-BE-001
  status: compiled
  evidence: ../../../../08-qa/qa/platform-hardening-and-saas-operations/COM-MOD-012-BE-001-validation.yaml
  api_endpoints_implemented:
    - "POST /api/platform/tenants (provisionTenant)"
    - "GET /api/platform/tenants (listTenants)"
    - "GET /api/platform/tenants/{tenantId} (getTenant)"
    - "PUT /api/platform/tenants/{tenantId}/status (updateTenantStatus)"
  note: >-
    Implemented paths use the existing unversioned /api/platform/... prefix (matching every other
    platform endpoint already shipped) rather than the /api/v1/... paths shown in this package's
    openapi-source.yaml/mappings above. Tenant quota (TenantQuota), branding (TenantBranding) and
    data-masking-policy value objects modeled in business-model.yaml are not yet exposed by any
    operation and were not persisted, since no compiled endpoint requires them.

validation:
  backlog_item: COM-MOD-012-QA-001
  status: validated
  evidence: ../../../../08-qa/qa/platform-hardening-and-saas-operations/COM-MOD-012-QA-001-validation.yaml
  contribution: >-
    Live runtime validation of provisionTenant/listTenants/updateTenantStatus against a running
    backend: duplicate tenant code correctly rejected (409), invalid status value correctly
    rejected (400), status transition on a nonexistent tenant correctly rejected (404), 20
    concurrent tenant provisions all succeeded with no duplicate-code race (unique index backstop
    confirmed), and both TenantStatusChanged audit events verified present with
    previousStatus/newStatus/reason metadata via a live GET /api/audit/events query.
