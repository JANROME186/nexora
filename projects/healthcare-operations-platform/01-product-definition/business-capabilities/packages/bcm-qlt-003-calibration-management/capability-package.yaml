capability:
  id: BCM-QLT-003
  name:
    en: Calibration Management
    es: Calibraciones
  domain: DOM-09 Quality
  priority: High
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001; calibrationRecord delegated to this capability)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Records calibration events for equipment-classified InventoryItem records: standard used,
    result (pass/fail/adjusted), next due date and certificate reference. Holds delegated,
    field-scoped mutation authority over InventoryItem.calibrationRecord only. On a failed
    calibration, publishes CalibrationFailed for BCM-QLT-004 Equipment Management to react to
    (transition availabilityStatus to out_of_service) rather than writing equipmentProfile itself.
  in_scope:
    - "Calibration event recording: standard, result, nextDueDate, certificateReference."
    - Calibration due-date monitoring.
  out_of_scope:
    - InventoryItem creation and core identity fields (BCM-INV-001).
    - equipmentProfile mutation (BCM-QLT-004).
    - Maintenance event recording (BCM-QLT-005).

roadmap:
  module: COM-MOD-010
  release: REL-002
  package_status: modeled
  next_backlog_item: COM-MOD-010-BE-002
  paused_functional_backlog_item: null

