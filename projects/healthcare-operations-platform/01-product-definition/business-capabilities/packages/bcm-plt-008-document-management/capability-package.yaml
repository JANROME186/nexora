capability:
  id: BCM-PLT-008
  name:
    en: Document Management
    es: Gestión Documental Operativa
  domain: DOM-10 Platform
  priority: High
  roadmap: MVP1
  dependency_profile: platform_extension
  bounded_context: document-management
  primary_aggregate: StoredDocument (AGG-023)
  process_ref: HRP-001-P07

scope:
  summary: >
    Generic document storage, operational documentation (runbooks, SOPs, disaster recovery proof artifacts,
    compliance certificates), retention policy management, and evidence bundling service. Extended under COM-MOD-013
    to support regulatory evidence packages (ISO 15189 / COFEPRIS / CAP), legal hold locks, and compliance tag indexing.
  in_scope:
    - StoredDocument aggregate: identifier, version, content hash, storage reference, retention policy.
    - Operational & Regulatory documentation classification: SOPs, runbooks, EQA certificates, CAPA evidence, audit reports.
    - Storage-provider-agnostic port (DocumentStoragePort) with local filesystem/S3/MinIO adapters.
    - Document integrity verification (SHA-256 hash check) on read.
    - Document retention schedules (5-year, 10-year, permanent) and legal hold locking.
    - Regulatory compliance evidence package bundling (`ComplianceEvidencePackage`).
  out_of_scope:
    - Business aggregate mutation (LaboratoryResult, Patient, Invoice, CAPA, Audit).
    - Dynamic PDF layout rendering (handled by BCM-RES-002).

roadmap:
  module: COM-MOD-013
  release: REL-003
