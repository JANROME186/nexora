capability:
  id: BCM-PLT-008
  name:
    en: Document Management
    es: Gestión Documental
  domain: DOM-10 Platform
  priority: High
  roadmap: MVP1
  dependency_profile: platform_extension
  bounded_context: document-management
  primary_aggregate: StoredDocument (new platform aggregate owned by this capability)
  process_ref: HRP-001-P07

scope:
  summary: >
    Generic, domain-agnostic document storage and versioning service used by multiple bounded
    contexts (results, billing, imaging, patient records) without owning any of their business
    aggregates. Provides a stable StoredDocument aggregate with identifier, version, content hash,
    storage backend reference and retention metadata behind a storage-provider-agnostic port, so
    that callers such as BCM-RES-002 never depend on a specific object-storage vendor.
  in_scope:
    - StoredDocument aggregate: identifier, version, content hash, storage reference, retention policy.
    - Storage-provider-agnostic port (DocumentStoragePort) with a local filesystem/deterministic adapter for on-premises deployments.
    - Document integrity verification (hash check) on read.
    - Document retention and disposal scheduling metadata (policy fields only; execution is operational, out of scope here).
  out_of_scope:
    - Any business aggregate that references a document (LaboratoryResult, Patient, Invoice, ImagingStudy) — this capability never mutates them.
    - PDF rendering itself (BCM-RES-002); this capability only stores and versions the resulting bytes.
    - Notification of document availability (BCM-RES-007, BCM-PLT-003).

roadmap:
