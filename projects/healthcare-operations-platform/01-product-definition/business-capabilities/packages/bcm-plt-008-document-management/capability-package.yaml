capability:
  id: BCM-PLT-008
  name:
    en: Document Management
    es: Gestión Documental Operativa
  domain: DOM-10 Platform
  priority: High
  roadmap: MVP1
  dependency_profile: platform_extension
  bounded_context: document-management
  primary_aggregate: StoredDocument (new platform aggregate owned by this capability)
  process_ref: HRP-001-P07

scope:
  summary: >
    Generic, domain-agnostic document storage, operational documentation (runbooks, SOPs,
    disaster recovery proof artifacts, compliance certificates), and versioning service
    used across clinical and SaaS platform operation bounded contexts.
  in_scope:
    - StoredDocument aggregate: identifier, version, content hash, storage reference, retention policy.
    - Operational documentation classification: SOPs, operational runbooks, backup/restore proof, compliance manuals.
    - Storage-provider-agnostic port (DocumentStoragePort) with local filesystem/S3/MinIO adapters.
    - Document integrity verification (SHA-256 hash check) on read.
    - Document retention and legal hold management.
  out_of_scope:
    - Any business aggregate that references a document (LaboratoryResult, Patient, Invoice, ImagingStudy) — this capability never mutates them.
    - PDF rendering itself (BCM-RES-002); this capability only stores and versions the resulting bytes.

