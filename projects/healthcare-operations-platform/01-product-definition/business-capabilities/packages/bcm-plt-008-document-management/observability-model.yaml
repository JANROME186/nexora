artifact:
  id: HOP-OBS-BCM-PLT-008
  type: observability-model
  name: Document Management Observability Model
  version: 1.2.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-008

metrics:
  - name: documents_stored_total
    type: counter
    description: Total number of documents uploaded and stored.
    labels: [tenant_id, owner_capability, compliance_category]

  - name: documents_under_legal_hold
    type: gauge
    description: Number of documents currently locked under legal hold.
    labels: [tenant_id]

  - name: evidence_packages_created_total
    type: counter
    description: Total number of compliance evidence packages generated.
    labels: [tenant_id]

logs:
  - event: LegalHoldApplied
    level: WARN
    mdc_fields: [tenantId, userId, traceId, documentId, legalHold]
    pattern: "Legal hold status updated: documentId={documentId}, legalHold={legalHold}"

tracing:
  propagation_headers: [X-Correlation-ID, X-Tenant-ID]
