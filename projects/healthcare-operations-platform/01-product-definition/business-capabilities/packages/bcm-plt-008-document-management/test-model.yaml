artifact:
  id: HOP-TST-BCM-PLT-008
  type: test-model
  name: Document Management Test Model
  version: 1.2.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-008

test_cases:
  - id: TST-DOC-001
    name: SHA-256 Hash Integrity Verification
    type: unit
    target_rule: RN-DOC-001
    description: Verify that document retrieval computes SHA-256 hash and throws DOCUMENT_HASH_MISMATCH if tampered.

  - id: TST-DOC-002
    name: Legal Hold Lock Enforcement
    type: unit
    target_rule: RN-DOC-002
    description: Verify that legalHold=true prevents document disposal.

  - id: TST-DOC-003
    name: Regulatory Retention Minimum Check
    type: unit
    target_rule: RN-DOC-003
    description: Verify regulatory documents reject retention schedules under 5 years.

  - id: TST-DOC-004
    name: Legal Hold Toggle Authorization
    type: unit
    target_rule: RN-DOC-004
    description: Verify updateLegalHold checks document.retention.manage permission scope.
