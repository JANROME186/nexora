artifact:
  id: HOP-UI-BCM-PLT-008
  type: ui-model
  name: Document Management UI Model
  version: 0.1.0
  status: not_applicable
  classification: editable_model
  capability: BCM-PLT-008
  target_surface: none

surfaces:
  employee_portal:
    status: not_required
    generatable: not_applicable
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens: []

states:
  - stored
  - superseded
  - pending_disposal
  - disposed

localization:
  languages: [en, es]
  default: es

rationale: >
  BCM-PLT-008 is a system-to-system internal storage service with no direct UI; owning
  capabilities (BCM-RES-002) surface any document-facing screens themselves (report history,
  regeneration). No screens are modeled here.
