artifact:
  id: HOP-BM-BCM-PLT-008
  type: business-model
  name: Document Management Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-008
  bounded_context: document-management
  primary_aggregate: StoredDocument
  model_kind: aggregate_owner

entities:
  - id: ENT-DOC-001
    name: StoredDocument
    is_aggregate_root: true
    description: >
      Generic, domain-agnostic document record. Owns only storage metadata; the business meaning
      of the document (a result report, an invoice, a patient consent scan) belongs entirely to
      the owning capability referencing this document by documentId. This capability never reads
      or interprets business content.
    fields:
      - name: documentId
        type: uuid
        required: true
        identifier: true
      - name: tenantId
        type: TenantId
        required: true
      - name: laboratoryId
        type: LaboratoryId
        required: true
      - name: ownerCapability
        type: string
        required: true
        description: Identifies the capability that created the document (e.g. BCM-RES-002), for traceability only.
      - name: ownerReferenceId
        type: uuid
        required: true
        description: The owning capability's own entity id (e.g. reportId); opaque to this capability.
      - name: documentVersion
        type: integer
        required: true
      - name: contentType
        type: string
        required: true
      - name: contentHash
        type: string
        required: true
      - name: sizeBytes
        type: integer
        required: true
      - name: storageReference
        type: StorageReference
        required: true
      - name: retentionPolicy
        type: RetentionPolicy
        required: true
      - name: status
        type: enum
        values: [stored, superseded, pending_disposal, disposed]
        required: true
      - name: audit
        type: AuditMetadata
        required: true

value_objects:
  - id: VO-DOC-001
    name: StorageReference
    description: Opaque, provider-agnostic pointer to the physical bytes; only the configured DocumentStoragePort adapter interprets it.
    fields:
      - name: storageProvider
        type: enum
        values: [local_filesystem, object_storage_compatible]
        required: true
      - name: storageKey
        type: string
        required: true
      - name: storedAt
        type: datetime
        required: true
  - id: VO-DOC-002
    name: RetentionPolicy
    description: Retention metadata only; scheduled disposal execution is an operational concern outside this capability package.
    fields:
      - name: retainUntil
        type: date
        required: false
      - name: legalHold
        type: boolean
        required: true
        default: false

ports:
  - id: PORT-DOC-001
    name: DocumentStoragePort
    description: >
      Provider-agnostic storage boundary, mirroring the FiscalAdapterPort pattern established for
      billing request adapters in MVP-MOD-005. Callers depend only on this interface; the physical
      storage technology is a replaceable adapter.
    operations:
      - putDocument(bytes, contentType) -> StorageReference
      - getDocument(StorageReference) -> bytes
      - deleteDocument(StorageReference) -> void
    default_adapter: local_filesystem_deterministic_adapter
    adapter_reference: local, self-hostable filesystem adapter suitable for on-premises deployment; open-source object-storage-compatible adapters may be added later without changing this port.

invariants:
  - id: INV-DOC-001
    statement: A StoredDocument's contentHash must match the bytes returned by DocumentStoragePort.getDocument at every read; a mismatch is a critical integrity failure.
  - id: INV-DOC-002
    statement: This capability never inspects or interprets the business meaning of stored bytes; content type and business context are fully opaque beyond contentType and ownerCapability/ownerReferenceId.
  - id: INV-DOC-003
    statement: A document under legalHold cannot transition to pending_disposal or disposed regardless of retentionPolicy.retainUntil.
  - id: INV-DOC-004
    statement: This capability never mutates any business aggregate (LaboratoryResult, Patient, Invoice, ImagingStudy); it only stores opaque bytes referenced by their owning capabilities.

external_references:
  - shared_kernel:
      - VO-ID-001 TenantId
      - VO-ID-002 LaboratoryId
      - VO-007 AuditMetadata
  - capabilities:
      - BCM-RES-002 PDF Report Generation (primary caller in MVP-MOD-007 scope)
  - related_aggregates_referenced_by_others:
      - LaboratoryResult (AGG-009, via BCM-RES-002's GeneratedResultReport)
      - Patient (AGG-001, future patient-document scope)
      - Invoice (AGG-012, future billing-document scope)
      - ImagingStudy (AGG-015, future imaging-report scope, MVP-MOD-014)
