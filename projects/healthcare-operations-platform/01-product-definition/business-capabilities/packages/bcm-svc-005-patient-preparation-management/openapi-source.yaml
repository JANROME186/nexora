artifact:
  id: HOP-API-SRC-BCM-SVC-005
  type: openapi-source
  name: Patient Preparation Management API Source Model
  version: 0.2.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-005
  note: >
    Source contract model. Rendered OpenAPI, controllers, DTOs and SDKs are
    generated outputs declared in generation-plan.yaml.

api:
  base_path: /api/catalog/preparations
  surface_classification: internal
  public_surface:
    status: required
    classification: public
    security: anonymous_rate_limited
    governed_by: BCM-PLT-005 ApiSurfaceRegistration/RateLimitPolicy (classification=public)
    exposed_operations:
      - operation_ref: getPublishedPreparationSnapshot
        scopes: [catalog.preparation.public_read]
        rate_limit_classification: public
    note: >-
      Realizes the future_surfaces placeholder for COM-MOD-011 Public Website and Digital
      Growth. Patient portal continues to consume the same operation under its own
      read_only_later surface. Reuses the existing PublishedPreparationSnapshot schema; no new
      schema defined.
  security:
    scheme: bearer_jwt
    required_scopes_default: [catalog.preparation.read]

resources:
  - name: PreparationInstruction
    operations:
      - id: listPreparations
        method: GET
        path: /
        scopes: [catalog.preparation.read]
        generatable: true
      - id: getPreparation
        method: GET
        path: /{preparationId}
        scopes: [catalog.preparation.read]
        generatable: true
      - id: createPreparation
        method: POST
        path: /
        scopes: [catalog.preparation.write]
        generatable: true
      - id: updatePreparation
        method: PUT
        path: /{preparationId}
        scopes: [catalog.preparation.write]
        generatable: true
      - id: assignPreparation
        method: POST
        path: /{preparationId}/assignments
        scopes: [catalog.preparation.write]
        generatable: false
        custom_reason: Target publication validation is a custom rule.
      - id: publishPreparation
        method: POST
        path: /{preparationId}/publish
        scopes: [catalog.preparation.publish]
        generatable: false
        custom_reason: Localization validation and snapshot freeze are custom rules.
      - id: deprecatePreparation
        method: POST
        path: /{preparationId}/deprecate
        scopes: [catalog.preparation.publish]
        generatable: true
      - id: getPublishedPreparationSnapshot
        method: GET
        path: /{preparationId}/published-snapshot
        scopes: [catalog.preparation.read]
        generatable: false
        custom_reason: Returns frozen version-aware snapshot for downstream consumers, mirroring BCM-SVC-001/002/003.

schemas_source:
  - PreparationInstruction
  - PreparationAssignment
  - PublishedPreparationSnapshot

error_model:
  standard: rfc7807
  domain_errors:
    - code: CATALOG_PREPARATION_CODE_CONFLICT
      maps_to_rule: RN-001
    - code: CATALOG_PREPARATION_LOCALIZATION_INCOMPLETE
      maps_to_rule: RN-002
    - code: CATALOG_PREPARATION_TARGET_NOT_PUBLISHED
      maps_to_rule: RN-004
