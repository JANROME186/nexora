artifact:
  id: HOP-PERM-BCM-SVC-005
  type: permissions
  name: Patient Preparation Management Permissions
  version: 0.2.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-005
  depends_on_capability: BCM-PLT-001

scopes:
  - code: catalog.preparation.read
    description: Read preparation instructions and published guidance.
  - code: catalog.preparation.write
    description: Create, update and assign preparation drafts.
  - code: catalog.preparation.publish
    description: Publish and deprecate preparations.
  - code: catalog.preparation.public_read
    description: >-
      Anonymous, rate-limited read of published preparation guidance only, consumed by the
      COM-MOD-011 public website. Never grants visibility into drafts.

roles:
  - role: catalog-administrator
    grants: [catalog.preparation.read, catalog.preparation.write]
  - role: laboratory-manager
    grants: [catalog.preparation.read, catalog.preparation.write, catalog.preparation.publish]
  - role: reception-agent
    grants: [catalog.preparation.read]
  - role: public-website-visitor
    grants: [catalog.preparation.public_read]
    authentication: anonymous
    governed_by: BCM-PLT-005 RateLimitPolicy (classification=public)

access_policies:
  - id: POL-SVC-005-01
    statement: Catalog write and publish operations are tenant and laboratory scoped.
    enforcement: row_level_tenant_laboratory_filter
  - id: POL-SVC-005-02
    statement: >-
      Published preparation guidance is readable by patient-facing and public surfaces without
      authoring scopes, rate-limited per BCM-PLT-005's public classification tier for anonymous
      callers. Realized by COM-MOD-011-DEF.
    enforcement: status_based_filter_plus_public_rate_limit

audit_obligations:
  audit_sink: BCM-PLT-007
  events:
    - event: PreparationCreated
      fields: [preparationId, actorId, tenantId]
    - event: PreparationPublished
      fields: [preparationId, version, actorId]
    - event: PreparationAssigned
      fields: [assignmentId, preparationId, targetRefId, actorId]
