artifact:
  id: HOP-EVT-BCM-SVC-005
  type: events
  name: Patient Preparation Management Events
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-005
  aggregate: TestDefinition

domain_events:
  - name: PreparationCreated
    description: A preparation instruction draft was created.
    payload: [preparationId, tenantId, laboratoryId, code, category, version]
    audit: true
  - name: PreparationAssigned
    description: A preparation was assigned to a test or panel.
    payload: [assignmentId, preparationId, targetType, targetRefId]
    audit: true
  - name: PreparationPublished
    description: A preparation version was published and frozen.
    payload: [preparationId, version, publishedAt, publishedBy]
    audit: true
  - name: PreparationDeprecated
    description: A preparation was deprecated.
    payload: [preparationId, version, deprecatedAt]
    audit: true

integration_events:
  published:
    - name: PreparationInstructionPublished
      description: Published patient-facing preparation guidance.
      consumers:
        - orders-samples
        - notifications
        - patient_portal
        - public_website
  consumed:
    - name: TestDefinitionPublished
      source: BCM-SVC-002
    - name: PanelDefinitionPublished
      source: BCM-SVC-003

published_language:
  - PreparationInstruction
