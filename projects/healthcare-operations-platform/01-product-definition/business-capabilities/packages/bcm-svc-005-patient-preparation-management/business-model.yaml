artifact:
  id: HOP-BM-BCM-SVC-005
  type: business-model
  name: Patient Preparation Management Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-005
  bounded_context: catalog-test-configuration
  primary_aggregate: TestDefinition

entities:
  - id: ENT-PRP-001
    name: PreparationInstruction
    is_aggregate_root: false
    owned_by_aggregate: TestDefinition
    description: A patient preparation instruction associated with tests or panels.
    fields:
      - name: preparationId
        type: uuid
        required: true
        identifier: true
      - name: tenantId
        type: TenantId
        required: true
      - name: laboratoryId
        type: LaboratoryId
        required: true
      - name: code
        type: string
        required: true
        unique_scope: [tenantId, laboratoryId]
      - name: title
        type: LocalizedText
        required: true
      - name: instructionText
        type: LocalizedText
        required: true
      - name: category
        type: enum
        values: [fasting, medication, activity, timing, hydration, other]
        required: true
      - name: durationHours
        type: integer
        required: false
      - name: status
        type: enum
        values: [draft, published, deprecated, retired]
        required: true
      - name: version
        type: integer
        required: true
      - name: audit
        type: AuditMetadata
        required: true
  - id: ENT-PRP-002
    name: PreparationAssignment
    is_aggregate_root: false
    owned_by_aggregate: TestDefinition
    description: Assignment of a preparation to a test or panel.
    fields:
      - name: assignmentId
        type: uuid
        required: true
        identifier: true
      - name: preparationId
        type: uuid
        required: true
      - name: targetType
        type: enum
        values: [test, panel]
        required: true
      - name: targetRefId
        type: uuid
        required: true

value_objects:
  - name: LocalizedText
    fields:
      - name: en
        type: string
        required: true
      - name: es
        type: string
        required: true

relationships:
  - from: PreparationInstruction
    to: PreparationAssignment
    type: one_to_many
  - from: PreparationAssignment
    to: TestDefinition
    type: reference_by_id
    note: Targets reference published tests or panels.

invariants:
  - id: INV-SVC-005-01
    statement: A published preparation must have localized instruction text for all supported languages.
  - id: INV-SVC-005-02
    statement: Fasting preparations must declare a duration in hours.
  - id: INV-SVC-005-03
    statement: Preparation code must be unique within a laboratory.

external_references:
  - identifier: TenantId
    source: shared-kernel
  - identifier: LaboratoryId
    source: shared-kernel
  - aggregate: TestDefinition
    context: catalog-test-configuration
    access: owning_context
