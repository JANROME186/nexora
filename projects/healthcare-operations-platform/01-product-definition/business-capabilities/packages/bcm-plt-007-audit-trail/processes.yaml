artifact:
  id: HOP-PRC-BCM-PLT-007
  type: processes
  name: Audit Trail Processes
  version: 1.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-007

processes:
  - id: PRC-AUD-TR-001
    name: Record Security & Operational Audit Event
    description: Record append-only audit event with cryptographic hash chaining.
    steps:
      - step_number: 1
        name: Construct Audit Payload
        actor: System / Application Boundary
        action: Capture eventType, actorId, category, resourceType, resourceId, and complianceCorrelationId.
      - step_number: 2
        name: Compute Hash Chain & Persist
        actor: System
        action: Calculate eventHash over previousEventHash + payload and insert into append-only table.

  - id: PRC-AUD-TR-002
    name: Search & Export Compliance Audit Evidence
    description: Execute structured search and export evidence packages for regulatory audits.
    steps:
      - step_number: 1
        name: Query Audit Log
        actor: Quality Auditor / Compliance Officer
        action: Execute search filtered by category, date range, complianceCorrelationId, or qualityInvestigationId.
      - step_number: 2
        name: Verify Chain Integrity & Export
        actor: System
        action: Verify SHA-256 hash sequence and generate CSV/JSON compliance evidence export package.
