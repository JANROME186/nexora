artifact:
  id: HOP-PROC-BCM-PLT-007
  type: processes
  name: Audit Trail Business Processes
  version: 1.0.0

processes:
  - id: PROC-AUD-001
    name: Record Security Audit Event
    actor: System Interceptor / Security Service
    trigger: Security or Domain Event Occurrence
    steps:
      - Intercept command or API call.
      - Extract actor, tenant, IP, and payload metadata.
      - Fetch previous event hash and compute SHA-256 current hash chain entry.
      - Write to append-only audit repository.
    outcome: Audit Event Recorded and Hash-Chained

  - id: PROC-AUD-002
    name: Compliance Audit Export & Integrity Verification
    actor: Tenant Compliance Officer / Auditor
    trigger: Regulatory Audit Request
    steps:
      - Validate audit chain hash integrity across selected time range.
      - Generate encrypted CSV/NDJSON compliance audit package.
      - Store audit export proof in Document Management (BCM-PLT-008).
    outcome: Verifiable Audit Package Delivered
