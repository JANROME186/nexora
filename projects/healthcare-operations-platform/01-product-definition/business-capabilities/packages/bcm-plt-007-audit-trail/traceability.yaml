operational_strategy:
  backlog_item: COM-MOD-012-OPS-002
  status: closed
  evidence: ../../../../08-qa/qa/platform-hardening-and-saas-operations/COM-MOD-012-OPS-002-validation.yaml
  contribution: >-
    Deployment, migration, rollback and privileged-operation audit evidence
    (COM-MOD-012-OPS-001). COM-MOD-012-OPS-002's evidence-collection-runbook.yaml treats the
