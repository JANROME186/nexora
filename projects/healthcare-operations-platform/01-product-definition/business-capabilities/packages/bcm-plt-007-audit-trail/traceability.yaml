    audit expectation for its own privileged actions pending native BCM-PLT-009 workflow
    automation of those audit events.

validation:
  backlog_item: COM-MOD-012-QA-001
  status: validated
  evidence: ../../../../08-qa/qa/platform-hardening-and-saas-operations/COM-MOD-012-QA-001-validation.yaml
  contribution: >-
    Confirmed live via GET /api/audit/events that both COM-MOD-012-BE-001 privileged operations
    record correctly: TenantStatusChanged (previousStatus, newStatus, reason metadata) and
