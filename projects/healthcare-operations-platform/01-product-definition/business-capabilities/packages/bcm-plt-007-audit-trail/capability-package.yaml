capability:
  id: BCM-PLT-007
  name:
    en: Audit Trail
    es: Auditoría de Seguridad y Operaciones
  domain: DOM-10 Platform
  priority: Critical
  roadmap: MVP1
  dependency_profile: foundation
  bounded_context: audit-compliance
  primary_aggregate: AuditEvent
  aggregate_ref: AGG-018

scope:
  summary: >
    Governs append-only security audit event recording, tamper-evident hash chaining,
    HIPAA/GDPR compliance data access logging, audit search & export APIs, and operational
    retention policies for Healthcare Operations Platform.
  in_scope:
    - Append-only recording of security events (authentication, authorization, permission changes).
    - Clinical and financial data access logging (patient data view, medical result release, payment refund).
    - Operational administration audit trail (tenant state changes, feature flag toggles, maintenance actions).
    - Tamper-evident cryptographic hash chaining for audit log integrity verification.
    - Tenant-scoped audit log query and compliance export APIs.
  out_of_scope:
    - Ephemeral application telemetry or debug logs (handled by BCM-PLT-006 Observability).
    - Physical storage volume snapshot management (handled by BCM-PLT-008 and BCM-PLT-009).

roadmap:
  module: COM-MOD-012
  release: REL-002
