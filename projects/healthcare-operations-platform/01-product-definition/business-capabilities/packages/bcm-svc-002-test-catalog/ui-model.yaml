artifact:
  id: HOP-UI-BCM-SVC-002
  type: ui-model
  name: Test Catalog UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-002
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  patient_portal:
    status: read_only_later
    generatable: deferred
  doctor_portal:
    status: read_only_later
    generatable: deferred

screens:
  - id: SCR-SVC-002-01
    name: Test List
    route: /catalog/tests
    type: list
    scopes: [catalog.test.read]
    components: [DataTable, StatusFilter, SearchBar]
    generatable: true
  - id: SCR-SVC-002-02
    name: Test Editor
    route: /catalog/tests/{testId}
    type: form
    scopes: [catalog.test.write]
    components: [TestDetailForm, AnalyteLinkEditor, SampleRequirementLinkEditor, ResultTypeSelector]
    generatable: true
  - id: SCR-SVC-002-03
    name: Publish Test Dialog
    route: /catalog/tests/{testId}/publish
    type: confirmation
    scopes: [catalog.test.publish]
    components: [PublicationChecklist, LinkedComponentEligibilitySummary]
    generatable: false
    custom_reason: Displays cross-aggregate publication validation results.

states: [draft, published, deprecated, retired]

localization:
  languages: [en, es]
  default: es
