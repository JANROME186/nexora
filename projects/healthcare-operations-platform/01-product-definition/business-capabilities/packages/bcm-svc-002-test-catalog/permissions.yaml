artifact:
  id: HOP-PERM-BCM-SVC-002
  type: permissions
  name: Test Catalog Permissions
  version: 0.2.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-002
  depends_on_capability: BCM-PLT-001

scopes:
  - code: catalog.test.read
    description: Read test definitions and published snapshots.
  - code: catalog.test.write
    description: Create and update test definition drafts.
  - code: catalog.test.publish
    description: Publish and deprecate test definitions.
  - code: catalog.test.public_read
    description: >-
      Anonymous, rate-limited read of published test snapshots only, consumed by the
      COM-MOD-011 public website. Never grants visibility into drafts.

roles:
  - role: catalog-administrator
    grants: [catalog.test.read, catalog.test.write]
  - role: laboratory-manager
    grants: [catalog.test.read, catalog.test.write, catalog.test.publish]
  - role: reception-agent
    grants: [catalog.test.read]
  - role: public-website-visitor
    grants: [catalog.test.public_read]
    authentication: anonymous
    governed_by: BCM-PLT-005 RateLimitPolicy (classification=public)

access_policies:
  - id: POL-SVC-002-01
    statement: Catalog write and publish operations are tenant and laboratory scoped.
    enforcement: row_level_tenant_laboratory_filter
  - id: POL-SVC-002-02
    statement: Unpublished drafts are visible only to authors and managers.
    enforcement: status_based_filter
  - id: POL-SVC-002-03
    statement: >-
      Public, anonymous catalog reads return only status=published snapshots and are rate-limited
      per BCM-PLT-005's public classification tier.
    enforcement: status_based_filter_plus_public_rate_limit

audit_obligations:
  audit_sink: BCM-PLT-007
  events:
    - event: TestDefinitionCreated
      fields: [testDefinitionId, actorId, tenantId]
    - event: TestDefinitionPublished
      fields: [testDefinitionId, version, actorId]
    - event: TestDefinitionDeprecated
      fields: [testDefinitionId, actorId]
