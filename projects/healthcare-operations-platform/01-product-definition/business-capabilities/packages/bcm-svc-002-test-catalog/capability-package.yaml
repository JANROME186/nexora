capability:
  id: BCM-SVC-002
  name:
    en: Test Catalog
    es: Catálogo de Pruebas
  domain: DOM-03 Diagnostic Services
  priority: Critical
  roadmap: MVP1
  dependency_profile: catalog
  bounded_context: catalog-test-configuration
  primary_aggregate: TestDefinition
  aggregate_ref: AGG-006

scope:
  summary: >
    Defines individual diagnostic tests including method, measurement unit,
    result type, turnaround time and references to analytes, samples and
    preparations. The test is the atomic orderable clinical definition.
  in_scope:
    - Test definition, methodology and result typing.
    - Test lifecycle draft, published, deprecated.
    - References to analytes, sample requirements and preparation instructions.
    - Published test snapshot exposure for orders and processing.
  out_of_scope:
    - Panel composition (BCM-SVC-003).
    - Analyte master definition (BCM-SVC-004).
    - Reference range values (BCM-SVC-006).
    - Pricing (BCM-SVC-009).

