artifact:
  id: HOP-API-SRC-BCM-RES-005
  type: openapi-source
  name: Result History API Source Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-RES-005
  note: >
    Source contract model. The rendered OpenAPI document, controllers, DTOs and SDKs are generated
    outputs declared in generation-plan.yaml.

api:
  base_path: /api/results/history
  surface_classification: partner
  security:
    scheme: bearer_jwt
    required_scopes_default: [history.view]

resources:
  - name: PatientResultHistoryView
    operations:
      - id: getResultHistory
        method: GET
        path: /
        scopes: [history.view]
        generatable: false
        custom_reason: Recipient-scoped authorization filtering and trend computation restricted to authorized entries.

schemas_source:
  - PatientResultHistoryView

error_model:
  standard: rfc7807
  domain_errors:
    - code: HISTORY_UNAUTHORIZED_ENTRY_ATTEMPTED
      maps_to_rule: RN-001
    - code: HISTORY_BOUNDARY_VIOLATION
      maps_to_rule: RN-002
    - code: HISTORY_TREND_CROSS_PATIENT_LEAK_PREVENTED
      maps_to_rule: RN-003
    - code: HISTORY_STALE_AMENDMENT_VALUE_BLOCKED
      maps_to_rule: RN-004
    - code: HISTORY_SCOPE_MISMATCH
      maps_to_rule: RN-005
