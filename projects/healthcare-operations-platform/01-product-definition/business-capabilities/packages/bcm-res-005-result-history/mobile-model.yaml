artifact:
  id: HOP-MOB-BCM-RES-005
  type: mobile-model
  name: Result History Mobile Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-RES-005

mobile_scope:
  status: result_view_required
  rationale: >
    MVP-MOD-007 declares mobile_app as result_view_required at the module level. This capability
    shares that requirement with BCM-RES-004: patients view their single released results there,
    and their chronological/trend history here, both subject to the same recipient-scoped
    authorization.
  target_app: patient_app
  flows:
    - id: MOB-RHS-005-01
      name: View result history and trends
      route: results/history
      scopes: [history.view]
      generatable: false
      custom_reason: Trend visualization requires authorization-scoped cross-entry comparison, mirroring the portal screen.
  offline_expectations: >
    A previously fetched history list may be cached read-only for offline display; trend
    recomputation requires connectivity.
