artifact:
  id: HOP-OBS-BCM-RES-005
  type: observability-model
  name: Result History Observability Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-RES-005
  depends_on_capability: BCM-PLT-006

logs:
  - event: result_history_entry_projected
    level: debug
    fields: [historyEntryId, patientId, resultId, analyteName]
    correlation_id: patientId
  - event: result_history_viewed
    level: info
    fields: [patientId, actorId, actorType]
    correlation_id: patientId
  - event: result_history_entry_updated
    level: info
    fields: [historyEntryId, resultId]
    correlation_id: patientId

metrics:
  - name: result_history_viewed_total
    type: counter
    labels: [tenantId, actorType]
  - name: result_history_projection_lag_ms
    type: histogram
    labels: [tenantId]
  - name: result_history_significant_change_detected_total
    type: counter
    labels: [tenantId, analyteName]

traces:
  - span: GetResultHistory
    child_spans:
      - ApplyRecipientScopeFilter
      - ComputeTrendIndicators
      - RecordResultHistoryViewed

audit_events:
  - ResultHistoryViewed

alerts:
  - name: ResultHistoryProjectionLagHigh
    condition: result_history_projection_lag_ms exceeds threshold
    severity: warning
  - name: ResultHistoryCrossPatientLeakSuspected
    condition: a trend computation references an entry outside the requesting recipient's authorized scope
    severity: critical
