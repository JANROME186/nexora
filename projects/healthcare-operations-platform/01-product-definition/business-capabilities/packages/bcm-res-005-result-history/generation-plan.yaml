artifact:
  id: HOP-GEN-BCM-RES-005
  type: generation-plan
  name: Result History Generation Plan
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-RES-005
  compiler_strategy: model_to_platform

generated_outputs:
  backend:
    - DTOs for PatientResultHistoryView
    - Repository interfaces and persistence adapters for the read projection
    - Event consumers for ResultDeliveryAuthorized and ResultDeliveryWithheld
    - API adapters
  frontend:
    - Patient/doctor portal history and trend screen (SCR-RHS-005-01)
    - Routes and Client SDK usage
  mobile:
    - Mobile history and trend flow (MOB-RHS-005-01)
  contracts:
    - Rendered OpenAPI document from openapi-source.yaml
    - Typed SDK
    - Swagger documentation
  tests:
    - Repetitive unit tests for RN-005 and RN-006
    - Contract tests for authorization
  operations:
    - Metric and log wiring from observability-model.yaml
    - Dashboard skeleton
    - Alert definitions

custom_implementation_points:
  - id: CUS-RHS-005-01
    description: Event-sourced PatientResultHistoryView projection rebuild restricted to authorized entries (RN-001).
    maps_to_backlog: MVP-MOD-007-BE-001
  - id: CUS-RHS-005-02
    description: Read-only architecture-boundary enforcement against LaboratoryResult and Patient (RN-002).
    maps_to_backlog: MVP-MOD-007-BE-002
  - id: CUS-RHS-005-03
    description: Authorization-scoped cross-entry trend computation (RN-003).
    maps_to_backlog: MVP-MOD-007-BE-002
  - id: CUS-RHS-005-04
    description: Amendment-triggered history entry update gated on BCM-RES-004 re-authorization (RN-004).
    maps_to_backlog: MVP-MOD-007-BE-002
  - id: CUS-RHS-005-05
    description: Chronological/trend UI for portal and mobile.
    maps_to_backlog: MVP-MOD-007-PORTAL-001

do_not_write_manually:
  - CRUD scaffolding
  - DTOs
  - Controllers
  - Repositories
  - Swagger documentation
  - SDKs
  - Repetitive documentation
  - Repetitive test cases

provenance:
  source_models:
    - business-model.yaml
    - business-rules.yaml
    - processes.yaml
    - events.yaml
    - openapi-source.yaml
    - ui-model.yaml
    - permissions.yaml
    - observability-model.yaml
  generation_metadata_required: true
