capability:
  id: BCM-RES-007
  name:
    en: Result Notifications
    es: Notificaciones
  domain: DOM-07 Results
  priority: High
  roadmap: MVP1
  dependency_profile: results_delivery
  bounded_context: notifications
  primary_aggregate: ResultNotificationRequest (new entity owned by this capability; LaboratoryResult AGG-009 is read-only)
  process_ref: HRP-001-P07

scope:
  summary: >
    Owns the business decision of when and what to notify a patient or doctor about a result
    (delivery available, critical result, amendment), composing the notification content and
    submitting it to BCM-PLT-003 for provider-agnostic dispatch. This capability decides the
    "what" and "why"; BCM-PLT-003 decides the "how" (channel adapter mechanics). Never mutates
    LaboratoryResult, Patient or Doctor.
  in_scope:
    - ResultNotificationRequest entity: trigger reason, recipient, composed template reference, dispatch tracking reference.
    - Notification composition rules per trigger (delivery available, critical result, amendment).
    - Delegated submission to BCM-PLT-003's NotificationRequest via SubmitNotificationRequest.
    - Notification delivery status tracking (queued/dispatched/delivered/failed) mirrored from BCM-PLT-003 events.
  out_of_scope:
    - Physical dispatch mechanics and provider adapters (BCM-PLT-003).
    - LaboratoryResult aggregate ownership (BCM-LAB-006) and delivery authorization (BCM-RES-004).
    - Critical-result escalation/acknowledgement tracking (BCM-RES-006).

roadmap:
  module: MVP-MOD-007
  release: REL-001
  package_status: modeled
  next_backlog_item: MVP-MOD-007-BE-001

