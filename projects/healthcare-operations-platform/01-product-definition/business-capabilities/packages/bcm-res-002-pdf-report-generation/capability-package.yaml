capability:
  id: BCM-RES-002
  name:
    en: PDF Report Generation
    es: Reportes PDF
  domain: DOM-07 Results
  priority: High
  roadmap: MVP1
  dependency_profile: results_delivery
  bounded_context: laboratory-results
  primary_aggregate: GeneratedResultReport (new entity owned by this capability; LaboratoryResult AGG-009 is read-only)
  process_ref: HRP-001-P07

scope:
  summary: >
    Generates the PDF report artifact for a released LaboratoryResult and persists it through
    Document Management (BCM-PLT-008). Owns the GeneratedResultReport entity — a document
    metadata record with identifier, version, integrity hash and generation provenance — never
    the LaboratoryResult aggregate itself. Regeneration after an amendment produces a new
    versioned report rather than mutating the prior one, preserving the full report history.
  in_scope:
    - GeneratedResultReport entity: identifier, version, content hash, generation timestamp, source result/release reference.
    - PDF rendering trigger on ResultReleased and re-render trigger on ResultAmended.
    - Delegated persistence of the rendered PDF bytes through BCM-PLT-008's Document Management.
    - Report integrity verification (hash re-check) before serving a stored report.
  out_of_scope:
    - LaboratoryResult aggregate ownership (BCM-LAB-006) and its release/amendment authority (BCM-LAB-010).
    - Physical document storage, retention and versioning mechanics (BCM-PLT-008).
    - Patient/doctor delivery of the generated report (BCM-RES-004).
    - Notification of report availability (BCM-RES-007, BCM-PLT-003).

roadmap:
  module: MVP-MOD-007
  release: REL-001
  package_status: modeled
  next_backlog_item: MVP-MOD-007-PORTAL-001

