artifact:
  id: HOP-PROC-BCM-RES-002
  type: processes
  name: PDF Report Generation Processes
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-RES-002

actors:
  - id: system
    actor_ref: ACT-018
    name: Audit Service
    source: ACM-001
    note: Report generation is primarily event-triggered; ACT-018 represents the audit trail sink, not the trigger actor. Manual regeneration is available to a medical validator (ACT-009) for exceptional cases.
  - id: medical-validator
    actor_ref: ACT-009
    name: Medical Validator
    source: ACM-001

processes:
  - id: PRC-RPT-002-01
    name: Generate result report
    actor: system
    trigger: A LaboratoryResult transitions to released (ResultReleased) or an existing released result is amended (ResultAmended).
    commands:
      - GenerateResultReport
    preconditions:
      - Source LaboratoryResult status is released (or being amended from released).
    steps:
      - Render the PDF from the release/amendment snapshot.
      - Compute the content hash.
      - Persist the rendered bytes through BCM-PLT-008 and capture the returned DocumentReference.
      - Create GeneratedResultReport in generated status.
      - Publish ReportGenerated.
    outcome: ReportGenerated
    rules: [RN-001, RN-002, RN-006, RN-007]
  - id: PRC-RPT-002-02
    name: Regenerate report after amendment
    actor: system
    trigger: ResultAmended is published for a result with an existing GeneratedResultReport.
    commands:
      - RegenerateResultReport
    preconditions:
      - A prior GeneratedResultReport exists for the resultId.
    steps:
      - Mark the prior GeneratedResultReport as superseded.
      - Execute PRC-RPT-002-01 to produce the next report version.
    outcome: ReportSuperseded
    rules: [RN-003]
  - id: PRC-RPT-002-03
    name: Retrieve and verify report
    actor: medical-validator
    trigger: A user or downstream capability requests the stored report.
    commands:
      - none (query only)
    preconditions:
      - Actor holds report.read.
    steps:
      - Fetch the GeneratedResultReport and its DocumentReference.
      - Re-verify contentHash against the stored bytes.
      - Serve the document only when the hash matches.
    outcome: ReportServed
    rules: [RN-004, RN-006]

commands:
  - name: GenerateResultReport
    generatable: false
    custom_reason: PDF rendering, hash computation and delegated document storage.
  - name: RegenerateResultReport
    generatable: false
    custom_reason: Append-only supersession and version-sequencing logic.
