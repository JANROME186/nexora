artifact:
  id: HOP-BM-BCM-ATT-005
  type: business-model
  name: Cashier Operations Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-005
  bounded_context: cash-sales
  primary_aggregates: [AGG-010 Sale, AGG-011 CashRegister]

entities:
  - id: ENT-CASH-001
    name: Sale
    is_aggregate_root: true
    aggregate_ref: AGG-010
    description: >
      Commercial record created from an accepted diagnostic order or accepted quotation. Owns sale
      lines, discounts, payment allocations, cancellation records and refund intent.
    fields:
      - {name: saleId, type: SaleId, required: true, identifier: true}
      - {name: tenantId, type: TenantId, required: true}
      - {name: laboratoryId, type: LaboratoryId, required: true}
      - {name: branchId, type: BranchId, required: true}
      - {name: patientId, type: PatientId, required: true}
      - {name: sourceType, type: enum, values: "diagnostic_order, quotation", required: true}
      - {name: sourceReferenceId, type: string, required: true}
      - {name: saleLines, type: "list[SaleLine]", required: true}
      - {name: totals, type: SaleTotals, required: true}
      - {name: paymentAllocations, type: "list[PaymentAllocation]", required: false}
      - {name: status, type: enum, values: "draft, payable, partially_paid, paid, cancelled, refunded", required: true}
      - {name: audit, type: AuditMetadata, required: true}
  - id: ENT-CASH-002
    name: CashRegister
    is_aggregate_root: true
    aggregate_ref: AGG-011
    description: Branch cash register state and session lifecycle.
    fields:
      - {name: cashRegisterId, type: CashRegisterId, required: true, identifier: true}
      - {name: branchId, type: BranchId, required: true}
      - {name: currentSession, type: CashSession, required: false}
      - {name: status, type: enum, values: "inactive, open, closing, closed", required: true}
      - {name: audit, type: AuditMetadata, required: true}

value_objects:
  - id: VO-CASH-001
    name: SaleLine
    fields:
      - {name: catalogItemId, type: uuid, required: true}
      - {name: catalogItemKind, type: enum, values: "test, panel, service", required: true}
      - {name: descriptionSnapshot, type: string, required: true}
      - {name: quantity, type: integer, required: true}
      - {name: unitAmount, type: Money, required: true}
      - {name: lineTotal, type: Money, required: true}
  - id: VO-CASH-002
    name: SaleTotals
    fields:
      - {name: subtotalAmount, type: Money, required: true}
      - {name: discountAmount, type: Money, required: true}
      - {name: totalAmount, type: Money, required: true}
      - {name: paidAmount, type: Money, required: true}
      - {name: outstandingAmount, type: Money, required: true}
  - id: VO-CASH-003
    name: PaymentAllocation
    fields:
      - {name: paymentId, type: PaymentId, required: true}
      - {name: amount, type: Money, required: true}
      - {name: method, type: enum, values: "cash, card, transfer, wallet, mixed", required: true}
      - {name: registeredAt, type: datetime, required: true}
      - {name: registeredBy, type: UserId, required: true}
  - id: VO-CASH-004
    name: CashSession
    fields:
      - {name: sessionId, type: CashSessionId, required: true}
      - {name: openedBy, type: UserId, required: true}
      - {name: openingAmount, type: Money, required: true}
      - {name: openedAt, type: datetime, required: true}
      - {name: closedAt, type: datetime, required: false}
      - {name: closingSummary, type: CashClosing, required: false}
  - id: VO-CASH-005
    name: CashClosing
    fields:
      - {name: expectedAmount, type: Money, required: true}
      - {name: countedAmount, type: Money, required: true}
      - {name: varianceAmount, type: Money, required: true}
      - {name: varianceReason, type: string, required: false}

invariants:
  - id: INV-CASH-001
    statement: A sale must be created from an accepted diagnostic order or accepted quotation snapshot.
  - id: INV-CASH-002
    statement: A payment cannot be registered without an open cash session for cash methods.
  - id: INV-CASH-003
    statement: Payment allocations cannot exceed the sale outstanding amount unless the overpayment policy explicitly allows it.
  - id: INV-CASH-004
    statement: Closing a cash session requires counted cash and variance calculation.
  - id: INV-CASH-005
    statement: Cashier operations cannot mutate DiagnosticOrder, Patient or Invoice state directly.

external_references:
  - shared_kernel: [TenantId, LaboratoryId, BranchId, PatientId, UserId, Money, AuditMetadata]
  - capabilities: [BCM-LAB-001, BCM-ATT-006, BCM-SVC-009, BCM-ATT-008, BCM-PLT-007]
