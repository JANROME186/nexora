    - CRUD scaffolding for Sale and CashRegister read surfaces.
    - DTOs for Sale, SaleLine, SaleTotals, PaymentAllocation, CashSession and CashClosing.
    - Controllers for generatable read operations.
    - Repository interfaces and persistence adapters.
  frontend:
    - Employee portal cashier session, sale worklist and payment screens.
  contracts:
    - Rendered OpenAPI document from openapi-source.yaml.
    - Typed SDK.
  tests:
    - Repetitive unit and contract tests for generatable operations.
  operations:
    - Metrics, logs and alert wiring from observability-model.yaml.

custom_implementation_points:
  - {id: CUS-CASH-001, description: Accepted order/quotation source validation and sale snapshot capture., maps_to_backlog: MVP-MOD-005-BE-001}
  - {id: CUS-CASH-002, description: Cash session requirement and branch session exclusivity., maps_to_backlog: MVP-MOD-005-BE-001}
  - {id: CUS-CASH-003, description: Payment allocation policy and outstanding balance enforcement., maps_to_backlog: MVP-MOD-005-BE-001}
  - {id: CUS-CASH-004, description: Cash closing variance calculation and reason enforcement., maps_to_backlog: MVP-MOD-005-BE-001}
  - {id: CUS-CASH-005, description: Billing request boundary delegation to BCM-ATT-008., maps_to_backlog: MVP-MOD-005-BE-002}

