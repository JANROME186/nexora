artifact:
  id: HOP-API-SRC-BCM-ATT-001
  type: openapi-source
  name: Appointment Scheduling API Source Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-001
  note: >
    Source contract model. The rendered OpenAPI document, controllers, DTOs
    and SDKs are generated outputs declared in generation-plan.yaml.

api:
  base_path: /api/care-delivery/appointments
  surface_classification: internal
  future_surfaces:
    - classification: public
      status: appointment_request_later
      note: Patient portal appointment request handoff planned for COM-MOD-009.
  security:
    scheme: bearer_jwt
    required_scopes_default: [appointment.manage]

resources:
  - name: AppointmentSlot
    operations:
      - id: listAppointments
        method: GET
        path: /
        scopes: [appointment.read]
        generatable: true
      - id: getAppointment
        method: GET
        path: /{appointmentId}
        scopes: [appointment.read]
        generatable: true
      - id: requestAppointment
        method: POST
        path: /
        scopes: [appointment.manage]
        generatable: false
        custom_reason: Preparation-instruction surfacing and catalog publication check.
      - id: confirmAppointment
        method: POST
        path: /{appointmentId}/confirm
        scopes: [appointment.manage]
        generatable: false
        custom_reason: Branch operational-status and overlap validation.
      - id: checkInAppointment
        method: POST
        path: /{appointmentId}/check-in
        scopes: [appointment.manage]
        generatable: false
        custom_reason: Handoff to order creation.
      - id: cancelAppointment
        method: POST
        path: /{appointmentId}/cancel
        scopes: [appointment.manage]
        generatable: true
      - id: markAppointmentNoShow
        method: POST
        path: /{appointmentId}/no-show
        scopes: [appointment.manage]
        generatable: false
        custom_reason: Tenant-configurable grace-period policy.

schemas_source:
  - AppointmentSlot
  - RequestedCatalogItem
  - PreparationSummary

error_model:
  standard: rfc7807
  domain_errors:
    - code: APPOINTMENT_BRANCH_NOT_ACTIVE
      maps_to_rule: RN-001
    - code: APPOINTMENT_WINDOW_OVERLAP
      maps_to_rule: RN-002
    - code: APPOINTMENT_CATALOG_ITEM_NOT_PUBLISHED
      maps_to_rule: RN-003
    - code: APPOINTMENT_SCOPE_MISMATCH
      maps_to_rule: RN-004
    - code: APPOINTMENT_ORDER_HANDOFF_VIOLATION
      maps_to_rule: RN-005
