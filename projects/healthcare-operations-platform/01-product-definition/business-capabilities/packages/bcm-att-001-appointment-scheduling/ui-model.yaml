artifact:
  id: HOP-UI-BCM-ATT-001
  type: ui-model
  name: Appointment Scheduling UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-001
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  patient_portal:
    status: appointment_request_later
    generatable: deferred
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-APT-001-01
    name: Appointment Scheduler
    route: /appointments/new
    type: wizard
    scopes: [appointment.manage]
    components:
      - PatientPicker
      - DoctorPicker
      - CatalogItemSelector
      - PreparationSummaryPanel
      - CalendarSlotPicker
    generatable: false
    custom_reason: Combines branch capacity display, overlap validation and preparation-instruction surfacing.
  - id: SCR-APT-001-02
    name: Appointment Calendar
    route: /appointments
    type: calendar
    scopes: [appointment.read]
    components:
      - BranchCalendarView
      - StatusFilter
      - CheckInButton
    generatable: false
    custom_reason: Calendar rendering with inline check-in action.
  - id: SCR-APT-001-03
    name: Appointment Detail
    route: /appointments/{appointmentId}
    type: detail
    scopes: [appointment.read]
    components:
      - AppointmentSummary
      - LinkedOrderLink
      - AuditTraceLink
    generatable: true

states:
  - requested
  - confirmed
  - checked_in
  - cancelled
  - no_show
  - completed

localization:
  languages: [en, es]
  default: es
