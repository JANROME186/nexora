artifact:
  id: HOP-UI-BCM-ATT-001
  type: ui-model
  name: Appointment Scheduling UI Model
  version: 0.2.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-001
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  patient_portal:
    status: required
    generatable: true
  doctor_portal:
    status: not_required
    generatable: not_applicable
  public_website:
    status: required
    generatable: not_applicable
    note: >-
      Public website pages are a COM-MOD-011-WEB-001 delivery concern, not an employee-portal
      screen. This capability only exposes the anonymous requestAppointment intake operation
      (openapi-source.yaml public_surface, RN-008) consumed by that public page.

screens:
  - id: SCR-APT-001-04
    name: Patient Self-Scheduler
    route: /patient/appointments/new
    type: wizard
    scopes: [PORTAL_PATIENT_ACCESS]
    components:
      - BranchSelector
      - CatalogItemSelector
      - PreparationSummaryPanel
      - CalendarSlotPicker
      - ConfirmBookingButton
    generatable: true
  - id: SCR-APT-001-01
    name: Appointment Scheduler
    route: /appointments/new
    type: wizard
    scopes: [appointment.manage]
    components:
      - PatientPicker
      - DoctorPicker
      - CatalogItemSelector
      - PreparationSummaryPanel
      - CalendarSlotPicker
    generatable: false
    custom_reason: Combines branch capacity display, overlap validation and preparation-instruction surfacing.
  - id: SCR-APT-001-02
    name: Appointment Calendar
    route: /appointments
    type: calendar
    scopes: [appointment.read]
    components:
      - BranchCalendarView
      - StatusFilter
      - CheckInButton
    generatable: false
    custom_reason: Calendar rendering with inline check-in action.
  - id: SCR-APT-001-03
    name: Appointment Detail
    route: /appointments/{appointmentId}
    type: detail
    scopes: [appointment.read]
    components:
      - AppointmentSummary
      - LinkedOrderLink
      - AuditTraceLink
    generatable: true

states:
  - requested
  - confirmed
  - checked_in
  - cancelled
  - no_show
  - completed

localization:
  languages: [en, es]
  default: es
