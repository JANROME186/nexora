artifact:
  id: HOP-BR-BCM-ATT-001
  type: business-rules
  name: Appointment Scheduling Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-001
  rule_id_pattern: "RN-###"

rules:
  - id: RN-001
    statement: An appointment cannot be confirmed for a branch that is not operationally active.
    applies_to: AppointmentSlot
    enforcement_point: command:ConfirmAppointment
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Requires reading BranchOperationalStatus from BCM-ORG-003 at confirmation time.
    test_refs: [TST-APT-001-01]
  - id: RN-002
    statement: An appointment cannot be confirmed if the requested window overlaps an existing confirmed appointment for the same patient at the same branch, nor if confirming it would exceed the branch's tenant-configurable daily appointment capacity.
    applies_to: AppointmentSlot
    enforcement_point: command:ConfirmAppointment
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Overlap detection requires querying existing confirmed slots for the patient and branch; capacity enforcement requires a tenant-configurable policy and a branch-wide same-window count.
    test_refs: [TST-APT-001-02]
  - id: RN-003
    statement: Requested catalog items must reference only published tests or panels.
    applies_to: RequestedCatalogItem
    enforcement_point: command:RequestAppointment, command:ConfirmAppointment
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Requires cross-capability validation against BCM-SVC-001/002 publication state.
    test_refs: [TST-APT-001-03]
  - id: RN-004
    statement: Appointment commands must execute within the actor's tenant, laboratory and branch scope.
    applies_to: AppointmentSlot
    enforcement_point: authorization:appointment.manage
    severity: critical
    audit_required: true
    generatable: true
    test_refs: [TST-APT-001-04]
  - id: RN-005
    statement: Converting a checked-in appointment into a diagnostic order must invoke BCM-LAB-001 CreateDiagnosticOrder and set linkedOrderId, never persist an order directly.
    applies_to: AppointmentSlot
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Cross-capability delegation boundary mirroring the BCM-ATT-002 pattern.
    test_refs: [TST-APT-001-05]
  - id: RN-006
    statement: An appointment not checked in within the tenant-configured grace period after its scheduled window must be marked no_show.
    applies_to: AppointmentSlot
    enforcement_point: scheduled_policy
    severity: medium
    audit_required: true
    generatable: false
    custom_reason: Requires tenant-configurable grace-period policy and a time-based transition.
    test_refs: [TST-APT-001-06]
  - id: RN-007
    statement: Appointment audit events must include actor identity, branch and channel.
    applies_to: AppointmentSlot
    enforcement_point: event:AppointmentConfirmed
    severity: high
    audit_required: true
    generatable: true
    test_refs: [TST-APT-001-07]

enforcement_summary:
  generatable_rules: [RN-004, RN-007]
  custom_implementation_rules: [RN-001, RN-002, RN-003, RN-005, RN-006]
