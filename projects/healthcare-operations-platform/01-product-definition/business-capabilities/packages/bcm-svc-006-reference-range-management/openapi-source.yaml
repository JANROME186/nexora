artifact:
  id: HOP-API-SRC-BCM-SVC-006
  type: openapi-source
  name: Reference Range Management API Source Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-006
  note: >
    Source contract model. Rendered OpenAPI, controllers, DTOs and SDKs are
    generated outputs declared in generation-plan.yaml.

api:
  base_path: /api/catalog/reference-ranges
  surface_classification: internal
  security:
    scheme: bearer_jwt
    required_scopes_default: [catalog.range.read]

resources:
  - name: ReferenceRange
    operations:
      - id: listReferenceRanges
        method: GET
        path: /
        scopes: [catalog.range.read]
        generatable: true
      - id: getReferenceRange
        method: GET
        path: /{rangeId}
        scopes: [catalog.range.read]
        generatable: true
      - id: createReferenceRange
        method: POST
        path: /
        scopes: [catalog.range.write]
        generatable: true
      - id: updateReferenceRange
        method: PUT
        path: /{rangeId}
        scopes: [catalog.range.write]
        generatable: false
        custom_reason: Overlap detection, threshold consistency and effective-dated versioning.
      - id: publishReferenceRange
        method: POST
        path: /{rangeId}/publish
        scopes: [catalog.range.publish]
        generatable: false
        custom_reason: Analyte validation and snapshot freeze are custom rules.
      - id: deprecateReferenceRange
        method: POST
        path: /{rangeId}/deprecate
        scopes: [catalog.range.publish]
        generatable: true
      - id: getEffectiveRangeSnapshot
        method: GET
        path: /effective
        query: [analyteId, sex, ageDays, observationDate]
        scopes: [catalog.range.read]
        generatable: false
        custom_reason: Effective-date and demographic resolution for downstream validation.

schemas_source:
  - ReferenceRange
  - ReferenceRangeSegment
  - EffectiveRangeSnapshot

error_model:
  standard: rfc7807
  domain_errors:
    - code: CATALOG_RANGE_BOUNDS_INVALID
      maps_to_rule: RN-001
    - code: CATALOG_RANGE_CRITICAL_INCONSISTENT
      maps_to_rule: RN-002
    - code: CATALOG_RANGE_SEGMENT_OVERLAP
      maps_to_rule: RN-003
    - code: CATALOG_RANGE_ANALYTE_NOT_PUBLISHED
      maps_to_rule: RN-004
