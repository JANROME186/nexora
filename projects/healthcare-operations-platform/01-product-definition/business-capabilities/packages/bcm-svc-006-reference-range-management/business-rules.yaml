artifact:
  id: HOP-BR-BCM-SVC-006
  type: business-rules
  name: Reference Range Management Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-006
  rule_id_pattern: "RN-###"

rules:
  - id: RN-001
    statement: Normal low must be less than or equal to normal high within a segment.
    applies_to: ReferenceRangeSegment
    enforcement_point: command:CreateReferenceRange, command:UpdateReferenceRange
    severity: high
    audit_required: true
    generatable: true
    test_refs: [TST-SVC-006-01]
  - id: RN-002
    statement: Critical thresholds must lie outside the normal boundaries.
    applies_to: ReferenceRangeSegment
    enforcement_point: command:CreateReferenceRange, command:UpdateReferenceRange
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Clinical threshold consistency decision table across low/high boundaries.
    test_refs: [TST-SVC-006-02]
  - id: RN-003
    statement: Demographic segments must not overlap for the same sex and condition.
    applies_to: ReferenceRange
    enforcement_point: command:CreateReferenceRange, command:UpdateReferenceRange
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Overlap detection across age and demographic dimensions.
    test_refs: [TST-SVC-006-03]
  - id: RN-004
    statement: A reference range can only be published against a published analyte.
    applies_to: ReferenceRange
    enforcement_point: command:PublishReferenceRange
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Cross-aggregate analyte publication validation.
    test_refs: [TST-SVC-006-04]
  - id: RN-005
    statement: A published reference range version is immutable; changes create a new effective-dated version.
    applies_to: ReferenceRange
    enforcement_point: command:UpdateReferenceRange
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Effective-dated versioning and snapshot freeze; clinical audit requirement.
    test_refs: [TST-SVC-006-05]
  - id: RN-006
    statement: Result validation must resolve the range version effective at the result observation date.
    applies_to: ReferenceRange
    enforcement_point: query:EffectiveRangeSnapshot
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Effective-date resolution logic for downstream validation.
    test_refs: [TST-SVC-006-06]
  - id: RN-007
    statement: Only users with reference range authoring permission may create, update or publish ranges.
    applies_to: ReferenceRange
    enforcement_point: authorization:catalog.range.write
    severity: critical
    audit_required: true
    generatable: true
    test_refs: [TST-SVC-006-07]

enforcement_summary:
  generatable_rules: [RN-001, RN-007]
  custom_implementation_rules: [RN-002, RN-003, RN-004, RN-005, RN-006]
