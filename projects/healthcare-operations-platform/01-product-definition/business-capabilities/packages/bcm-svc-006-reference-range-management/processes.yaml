artifact:
  id: HOP-PROC-BCM-SVC-006
  type: processes
  name: Reference Range Management Processes
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-006

actors:
  - id: laboratory-manager
    name: Laboratory Manager
    source: ACM-001
  - id: medical-director
    name: Medical Director
    source: ACM-001

processes:
  - id: PRC-SVC-006-01
    name: Define reference range
    actor: laboratory-manager
    trigger: An analyte requires reference ranges.
    commands:
      - CreateReferenceRange
    preconditions:
      - Analyte exists and is published.
      - Actor holds catalog.range.write.
    steps:
      - Select analyte and effective date.
      - Configure demographic segments and thresholds.
      - Persist as draft version 1.
    outcome: ReferenceRangeCreated
    rules: [RN-001, RN-002, RN-003, RN-007]
  - id: PRC-SVC-006-02
    name: Publish reference range
    actor: medical-director
    trigger: A draft range is clinically approved.
    commands:
      - PublishReferenceRange
    preconditions:
      - Analyte is published.
      - Thresholds and segments are consistent.
    steps:
      - Validate analyte publication and threshold consistency.
      - Freeze effective-dated snapshot.
      - Mark range published.
    outcome: ReferenceRangePublished
    rules: [RN-004, RN-005]
  - id: PRC-SVC-006-03
    name: Version reference range
    actor: medical-director
    trigger: Clinical thresholds change.
    commands:
      - UpdateReferenceRange
    steps:
      - Create new effective-dated draft version.
      - Preserve prior version for historical validation.
    outcome: ReferenceRangeRevised
    rules: [RN-005, RN-006]

commands:
  - name: CreateReferenceRange
    generatable: true
  - name: UpdateReferenceRange
    generatable: false
    custom_reason: Overlap detection, threshold consistency and effective-dated versioning.
  - name: PublishReferenceRange
    generatable: false
    custom_reason: Cross-aggregate analyte validation and snapshot freeze.
  - name: DeprecateReferenceRange
    generatable: true
