artifact:
  id: HOP-BM-BCM-SVC-006
  type: business-model
  name: Reference Range Management Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-006
  bounded_context: catalog-test-configuration
  primary_aggregate: TestDefinition

entities:
  - id: ENT-REF-001
    name: ReferenceRange
    is_aggregate_root: false
    owned_by_aggregate: TestDefinition
    description: A demographic-segmented range of expected analyte values.
    fields:
      - name: rangeId
        type: uuid
        required: true
        identifier: true
      - name: tenantId
        type: TenantId
        required: true
      - name: laboratoryId
        type: LaboratoryId
        required: true
      - name: analyteRefId
        type: uuid
        required: true
      - name: version
        type: integer
        required: true
      - name: status
        type: enum
        values: [draft, published, deprecated, retired]
        required: true
      - name: effectiveFrom
        type: date
        required: true
      - name: effectiveTo
        type: date
        required: false
      - name: audit
        type: AuditMetadata
        required: true
  - id: ENT-REF-002
    name: ReferenceRangeSegment
    is_aggregate_root: false
    owned_by_aggregate: TestDefinition
    description: A demographic segment with numeric thresholds.
    fields:
      - name: segmentId
        type: uuid
        required: true
        identifier: true
      - name: rangeId
        type: uuid
        required: true
      - name: sex
        type: enum
        values: [any, male, female, other]
        required: true
      - name: ageMinDays
        type: integer
        required: false
      - name: ageMaxDays
        type: integer
        required: false
      - name: condition
        type: string
        required: false
      - name: normalLow
        type: decimal
        required: false
      - name: normalHigh
        type: decimal
        required: false
      - name: criticalLow
        type: decimal
        required: false
      - name: criticalHigh
        type: decimal
        required: false
      - name: unit
        type: string
        required: false

value_objects:
  - name: DemographicScope
    fields:
      - name: sex
        type: enum
        values: [any, male, female, other]
        required: true
      - name: ageRangeDays
        type: DateRange
        required: false

relationships:
  - from: ReferenceRange
    to: ReferenceRangeSegment
    type: one_to_many
  - from: ReferenceRange
    to: AnalyteDefinition
    type: reference_by_id
    note: Ranges reference published analytes owned by BCM-SVC-004.
  - from: ReferenceRange
    to: LaboratoryResult
    type: reference_by_id
    note: Published ranges are consumed by result validation in laboratory-results.

invariants:
  - id: INV-SVC-006-01
    statement: normalLow must be less than or equal to normalHigh when both present.
  - id: INV-SVC-006-02
    statement: Critical thresholds must lie outside the normal range boundaries.
  - id: INV-SVC-006-03
    statement: Demographic segments within a range must not overlap for the same sex and condition.
  - id: INV-SVC-006-04
    statement: A published range must reference a published analyte.

external_references:
  - identifier: TenantId
    source: shared-kernel
  - identifier: LaboratoryId
    source: shared-kernel
  - value_object: DateRange
    source: shared-kernel
  - aggregate: TestDefinition
    context: catalog-test-configuration
    access: owning_context
  - aggregate: LaboratoryResult
    context: laboratory-results
    access: published_language_only
