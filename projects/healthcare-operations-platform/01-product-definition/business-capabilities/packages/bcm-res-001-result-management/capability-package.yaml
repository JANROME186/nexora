capability:
  id: BCM-RES-001
  name:
    en: Result Management
    es: Gestión de Resultados
  domain: DOM-07 Results
  priority: Critical
  roadmap: MVP1
  dependency_profile: results_delivery
  bounded_context: laboratory-results
  primary_aggregate: LaboratoryResult (AGG-009, owned by BCM-LAB-006; read-only in this capability)
  process_ref: HRP-001-P06

scope:
  summary: >
    Provides the internal, role-scoped read/search facade over LaboratoryResult for laboratory
    and clinical staff: worklist and search views across capture, validation, release and
    amendment states, with row-level authorization and full access auditing. This capability owns
    no part of the LaboratoryResult aggregate; it maintains its own read-only ResultSearchIndexEntry
    projection built from BCM-LAB-006/008/009/010's domain events, and never issues a command
    against LaboratoryResult. It is the upstream read source that BCM-RES-002 (PDF generation),
    BCM-RES-004 (digital delivery) and BCM-RES-006 (critical result handling) build upon.
  in_scope:
    - Internal result search and worklist views spanning all lifecycle states (captured through amended).
    - ResultSearchIndexEntry read-model projection, kept current via consumed domain events.
    - Row-level, role-scoped authorization (laboratory technician, technical validator, medical validator, tenant administrator).
    - Access audit logging for every read of a result, internal or external.
  out_of_scope:
    - LaboratoryResult aggregate ownership and any state mutation (BCM-LAB-006, BCM-LAB-008, BCM-LAB-009, BCM-LAB-010).
    - PDF report generation (BCM-RES-002).
    - Patient/doctor-facing digital delivery and history (BCM-RES-004, BCM-RES-005).
    - Critical-result escalation tracking (BCM-RES-006).
    - Notification dispatch (BCM-RES-007, BCM-PLT-003).

