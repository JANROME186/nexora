artifact:
  id: HOP-TRACE-BCM-PLT-010
  type: traceability
  name: Open Data Ingestion and Migration Traceability
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-010

traces:
  capability_map:
    bcm_001: BCM-PLT-010
    domain: DOM-10 Platform
  dependency_map:
    bcm_002_profile: data_ingestion_migration
    required_capabilities: [BCM-ORG-001, BCM-ORG-002, BCM-ORG-003, BCM-PLT-001, BCM-PLT-007]
    optional_capabilities: [BCM-PLT-005, BCM-PLT-006, BCM-PLT-008]
    downstream_capabilities: [BCM-PER-001, BCM-PER-002, BCM-PER-003, BCM-SVC-001, BCM-SVC-002, BCM-SVC-009, BCM-LAB-001, BCM-RES-001]
    related_aggregates_declared_by_bcm_002: [MigrationJob, ImportBatch, ImportValidationReport]
  domain_foundation:
    bounded_context: data-migration-portability
    secondary_bounded_contexts: [integration-interoperability, audit-compliance]
    aggregate_reference: MigrationJob (AGG-016, owner; owns ImportBatch, MappingTemplate, ImportValidationReport, ReconciliationReport, ImportExecution)
    aggregate_naming_correspondence: >-
      aggregate-catalog.yaml AGG-016 names MigrationJob's owned sub-entities "SourceDataset" and
      "ValidationReport"; this package uses "ImportBatch" and "ImportValidationReport", the exact
      names capability-dependency-map.yaml's related_aggregates list uses for BCM-PLT-010. Both
      pairs refer to the same conceptual entities (one received package; one dry-run validation
      output) — no duplicate aggregate is introduced, and no aggregate-catalog.yaml edit was made
      since aggregate-catalog.yaml changes are an architecture-governance action requiring an ADR.
    context_relationships: [REL-CTX-010]
    context_map_observation: >-
      context-map.yaml REL-CTX-010 already declares data-migration-portability as an
      anti-corruption-layer targeting all-core-contexts with published_language
      UniversalImportRecord/CanonicalDataRecord/MigrationValidationReport. This package's
      MigrationJob/ImportBatch/ImportValidationReport/ReconciliationReport/ImportExecution model the
      concrete entities behind that published language without renaming it.
    shared_kernel_refs: [VO-ID-001, VO-ID-002, VO-003, VO-007]
  brm_alignment:
    - rule: BRM-001-R016
      alignment: Integration adapters cannot bypass validation; enforced by RN-001, RN-002, RN-003.
    - rule: BRM-001-R018
      alignment: Audit records are append-only; every migration job step is audited (RN-005).
  hrp_alignment:
    - process: HRP-001-P08 Migration and Integration Dry Run
      capability_role: Receive, map, dry-run validate and reconcile segment of the process (shared with BCM-PLT-004/BCM-PLT-005).
  contract_alignment:
    open_data_ingestion_standard: ../../../../../../nexora-framework/02-standards/standards/open-data-ingestion-standard.yaml
    hop_open_data_ingestion_contract: ../../../../05-contracts/import-export/open-data-ingestion/open-data-ingestion-contract.yaml
    requirements: ../../../../04-requirements/capabilities/bcm-plt-010-open-data-ingestion-and-migration/requirements.yaml
    coverage: >-
      All 5 functional requirements (FR-PLT-010-001..005) and all 5 user stories
      (US-PLT-010-001..005) are modeled: accepted formats (business-model.yaml MigrationManifest,
      openapi-source.yaml), dry-run validation before mutation (RN-002), reconciliation reports
      (ReconciliationReport entity), auditable/retryable jobs (RN-004, RN-005), and a
      provider-deliverable package specification (the reused HOP-ODI-001 contract).
  rules_to_tests:
    - rule: RN-001
      tests: [TST-MIG-010-01]
    - rule: RN-002
      tests: [TST-MIG-010-02]
    - rule: RN-003
      tests: [TST-MIG-010-03]
    - rule: RN-004
      tests: [TST-MIG-010-04]
    - rule: RN-005
      tests: [TST-MIG-010-05]
    - rule: RN-006
      tests: [TST-MIG-010-06]
  processes_to_commands:
    - process: PRC-MIG-010-01
      commands: [ReceiveImportPackage]
    - process: PRC-MIG-010-02
      commands: [MapImportBatch, RunDryRunValidation]
    - process: PRC-MIG-010-03
      commands: [ApproveImport, ExecuteImport]
    - process: PRC-MIG-010-04
      commands: [RetryImportExecution]
  api_to_permissions:
    - operation: createMigrationJob
      scope: migration.job.create
    - operation: receiveImportPackage
      scope: migration.job.create
    - operation: runDryRunValidation
      scope: migration.job.create
    - operation: approveImport
      scope: migration.job.approve
    - operation: commitImport
      scope: migration.job.approve
    - operation: retryImportExecution
      scope: migration.job.approve
  events_to_audit:
    - event: MigrationJobCreated
      audit_sink: BCM-PLT-007
    - event: ImportDryRunValidated
      audit_sink: BCM-PLT-007
    - event: MigrationExecuted
      audit_sink: BCM-PLT-007
    - event: ImportReconciled
      audit_sink: BCM-PLT-007
  ui_to_api:
    - screen: SCR-MIG-010-01
      operations: [createMigrationJob, receiveImportPackage, listMigrationJobs]
    - screen: SCR-MIG-010-02
      operations: [runDryRunValidation, getDryRunReport, approveImport]
    - screen: SCR-MIG-010-03
      operations: [getReconciliationReport, retryImportExecution]
  consumed_by_capabilities:
    - capability: BCM-PLT-008
      relationship: Optionally stores raw uploaded migration bundles via DocumentStoragePort (ImportPackageStoragePort reuse).
    - capability: BCM-PER-001, BCM-PER-002, BCM-PER-003, BCM-SVC-001, BCM-SVC-002, BCM-SVC-009, BCM-LAB-001
      relationship: ImportExecution invokes only these capabilities' own existing domain commands; never a direct write.
  technical_debt_alignment:
    - debt: TD-BE-013
      alignment: Closed by MVP-MOD-008-BE-002; ImportFileParser now counts XLSX rows via Apache POI.
    - debt: TD-BE-014
      alignment: >-
        Opened by MVP-MOD-008-BE-002 to track that MigrationDomainCommandPort's only implementation
        is a local deterministic stand-in, not a real cross-module command delegation.
  generated_outputs_ref: generation-plan.yaml
  qa_evidence: ../../../../08-qa/qa/integration-and-migration-readiness/MVP-MOD-008-DEF-validation.yaml
  compilation_evidence:
    backend_implementation: ../../../../../07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/datamigrationportability/migrationmanagement/
    schema: ../../../../../07-implementation/backend/src/main/resources/db/data-migration-portability/schema.sql
    qa_evidence: ../../../../08-qa/qa/integration-and-migration-readiness/MVP-MOD-008-BE-002-validation.yaml
    security_quality_evidence: ../../../../08-qa/security-quality/MVP-MOD-008-BE-002/security-quality-evidence.yaml
    notes: >-
      CreateMigrationJob, ApproveImport, getReconciliationReport compiled as generatable outputs.
      ReceiveImportPackage (CUS-MIG-010-01, real manifest/checksum verification via SnakeYAML and
      CSV/JSON/NDJSON/XLSX/ZIP parsing via Apache Commons CSV, Apache POI, Jackson and java.util.zip;
      XLSX row-level parsing closed TD-BE-013) and RunDryRunValidation (CUS-MIG-010-03,
      structural/required-field/referential-integrity/duplicate-detection categories; business-rule,
      privacy-and-consent, catalog-consistency, financial-reconciliation and clinical-result-integrity
      categories from the Open Data Ingestion Contract's 10-category list remain a later scope,
      unchanged from BE-001) implemented. MVP-MOD-008-BE-002 implemented CUS-MIG-010-04/05/06: a new
      MigrationDomainCommandPort (mirroring IntegrationAdapterPort/FiscalAdapterPort) is the sole
      interaction point commitImport/retryImportExecution use to advance an import, keeping INV-MIG-003
      satisfied by construction; ImportExecution.checkpoint is a real delimited list of completed
      entity categories that retryImportExecution uses to skip already-completed work on resume
      (INV-MIG-004); a ReconciliationReport#PHASE_POST_IMPORT report is written after every
      commit/retry attempt reflecting exactly what that attempt completed or rejected (RN-005).
      MigrationJob reaches STATUS_RECONCILED once every category succeeds, or STATUS_FAILED once
      MAX_EXECUTION_ATTEMPTS is exhausted. The port's only implementation
      (LocalDeterministicMigrationDomainCommandAdapter) is honestly a local deterministic stand-in,
      not real cross-module command wiring — see TD-BE-014.
      events.yaml gained MigrationImportApproved/MigrationImportRetried to name these new audit
      actions consistently with the existing domain_events set.
  backlog_items:
    definition: MVP-MOD-008-DEF
    definition_status: closed
    compilation: MVP-MOD-008-BE-001
    compilation_status: closed
    custom_rules: MVP-MOD-008-BE-002
    custom_rules_status: closed
    ui: MVP-MOD-008-FE-001
    ui_status: pending
    validation: MVP-MOD-008-QA-001
    validation_status: pending
    closeout: MVP-MOD-008-CLOSEOUT
    closeout_status: pending
