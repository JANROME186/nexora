artifact:
  id: HOP-BR-BCM-PLT-010
  type: business-rules
  name: Open Data Ingestion and Migration Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-010
  rule_id_pattern: "RN-###"

rules:
  - id: RN-001
    statement: Migration data may only be ingested from a manifest-declared bundle in an accepted format (CSV, XLSX, JSON, NDJSON, ZIP bundle); a bundle missing a valid manifest is rejected before any file is parsed.
    applies_to: ImportBatch
    enforcement_point: command:ReceiveImportPackage
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Manifest and checksum verification against the Open Data Ingestion Standard requires custom parsing and validation logic.
    test_refs: [TST-MIG-010-01]
  - id: RN-002
    statement: Every import must complete a dry-run validation producing an ImportValidationReport before any domain command executes; a failed or skipped dry run blocks mutation.
    applies_to: ImportValidationReport
    enforcement_point: command:ExecuteImport
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Cross-referencing dry-run completion state before allowing execution is a custom gating rule.
    test_refs: [TST-MIG-010-02]
  - id: RN-003
    statement: Import execution must occur exclusively through existing domain commands (e.g. patient registration, catalog publication, order intake); no import path may write directly to a domain aggregate's storage.
    applies_to: ImportExecution
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Enforces the anti-corruption-layer/domain-command-only boundary required by BRM-001-R016.
    test_refs: [TST-MIG-010-03]
  - id: RN-004
    statement: Migration jobs must be retryable from their last successful checkpoint without re-executing already-committed domain mutations.
    applies_to: ImportExecution
    enforcement_point: command:RetryImportExecution
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Checkpoint-based idempotent resume requires custom execution-state tracking.
    test_refs: [TST-MIG-010-04]
  - id: RN-005
    statement: Every migration job step (received, mapped, validated, executed, reconciled) must be audited and produce or update a ReconciliationReport with imported, rejected, skipped and warning counts.
    applies_to: MigrationJob
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Cross-entity reconciliation aggregation and audit-obligation enforcement.
    test_refs: [TST-MIG-010-05]
  - id: RN-006
    statement: Import commands must execute within the actor's tenant and laboratory scope.
    applies_to: MigrationJob
    enforcement_point: "authorization:migration.job.create, authorization:migration.job.approve"
    severity: critical
    audit_required: true
    generatable: true
    test_refs: [TST-MIG-010-06]

enforcement_summary:
  generatable_rules: [RN-006]
  custom_implementation_rules: [RN-001, RN-002, RN-003, RN-004, RN-005]
