artifact:
  id: HOP-PERM-BCM-PLT-010
  type: permissions
  name: Open Data Ingestion and Migration Permissions
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PLT-010
  depends_on_capability: BCM-PLT-001

scopes:
  - code: migration.job.create
    description: Create migration jobs, receive import packages and map/dry-run validate batches.
  - code: migration.job.review
    description: Read migration jobs, dry-run reports and reconciliation reports.
  - code: migration.job.approve
    description: Approve, commit and retry migration job execution.

roles:
  - role: system
    grants: [migration.job.create, migration.job.review, migration.job.approve]
  - role: platform-administrator
    grants: [migration.job.create, migration.job.review, migration.job.approve]
  - role: tenant-administrator
    grants: [migration.job.create, migration.job.review]

access_policies:
  - id: POL-MIG-010-01
    statement: Migration commands are scoped to the actor's tenant and laboratory.
    enforcement: row_level_tenant_laboratory_filter
  - id: POL-MIG-010-02
    statement: Import execution never bypasses the owning domain's own commands; all commits are attributed to the actor who approved the import.
    enforcement: domain_command_only_policy
  - id: POL-MIG-010-03
    statement: Committing an import requires a separate approve step from a different or the same explicitly-authorized actor after reviewing the dry-run report.
    enforcement: two_step_approval_policy

audit_obligations:
  audit_sink: BCM-PLT-007
  events:
    - event: MigrationJobCreated
      fields: [migrationJobId, sourceSystemName]
    - event: ImportDryRunValidated
      fields: [importBatchId, reportId, passed]
    - event: MigrationExecuted
      fields: [migrationJobId, executionId, status]
    - event: ImportReconciled
      fields: [migrationJobId, reconciliationReportId, importedCounts, rejectedCounts]
