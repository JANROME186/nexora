    es: Ingesta Abierta de Datos y Migración
  domain: DOM-10 Platform
  priority: Critical
  roadmap: MVP1
  dependency_profile: data_ingestion_migration
  bounded_context: data-migration-portability
  secondary_bounded_contexts: [integration-interoperability, audit-compliance]
  primary_aggregate: MigrationJob (AGG-016, owner)
  process_ref: HRP-001-P08
  implements_contract: ../../../../05-contracts/import-export/open-data-ingestion/open-data-ingestion-contract.yaml
  implements_requirements: ../../../../04-requirements/capabilities/bcm-plt-010-open-data-ingestion-and-migration/requirements.yaml

scope:
  summary: >
    Provider-agnostic legacy-data migration boundary. Ingests customer data delivered by incumbent
    systems in simple, documented, provider-deliverable formats (CSV, XLSX, JSON, NDJSON, ZIP
    bundles), validates and reconciles it in a dry run before any domain mutation, and executes
    accepted imports exclusively through existing domain commands. Implements
    NXF-ODI-STD-001 (Open Data Ingestion Standard) and the HOP Open Data Ingestion Contract
    (HOP-ODI-001).
  in_scope:
    - "MigrationJob aggregate (AGG-016): owns ImportBatch (per-package upload; the source dataset), MappingTemplate, ImportValidationReport, ReconciliationReport and ImportExecution."
    - Manifest-driven package receipt and checksum/format verification.
    - Dry-run validation producing row-level errors, warnings and reconciliation totals before mutation.
    - Anti-corruption mapping from source fields to HOP canonical entities.
    - Import execution exclusively through existing domain commands (people, catalog, orders,
      results index per requirements.yaml's minimum_entity_groups); never direct persistence writes.
    - Retryable, auditable migration jobs with reconciliation reports (imported/rejected/skipped/warning
      counts).
  out_of_scope:
    - Real-time message-level protocol integration (BCM-PLT-004).
    - API classification and partner key governance (BCM-PLT-005).
    - The domain commands themselves (patient registration, catalog publication, etc.), which
      belong to their owning capabilities; this capability only invokes them.

