artifact:
  id: HOP-UI-BCM-INV-003
  type: ui-model
  name: Lot Management UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-003
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: partial
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-LOT-003-01
    name: Stock Lot Register
    route: /admin/inventory/items/{inventoryItemId}/lots
    purpose: List lots, register a new lot, quarantine/release and view expiration status.
    components: [DataTable, StockLotForm, StatusBadge, ExpirationBadge]
    generatable: partial
    custom_reason: Expiration status is driven by the scheduled expiration sweep (RN-002).

states:
  - active
  - quarantined
  - expired
  - depleted
  - disposed

localization:
  languages: [en, es]
  default: es
  message_key_namespace: inventory.lot.*
  note: New user-facing strings must be registered under the inventory.lot.* message-key namespace, not hardcoded.

rationale: >
  Lot registration and expiration monitoring are internal warehouse/laboratory back-office tasks
  performed from the employee portal only.
