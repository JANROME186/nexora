artifact:
  id: HOP-EVT-BCM-INV-003
  type: events
  name: Lot Management Events
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-003

domain_events:
  - name: StockLotRegistered
    description: A new physical batch of an InventoryItem was registered.
    payload: [stockLotId, inventoryItemId, lotNumber, expirationDate]
    audit: true
  - name: StockLotQuarantined
    description: A stock lot was placed on quality hold.
    payload: [stockLotId, inventoryItemId]
    audit: true
  - name: StockLotReleased
    description: A quarantined stock lot was released back to active status.
    payload: [stockLotId, inventoryItemId]
    audit: true
  - name: StockLotExpired
    description: A stock lot automatically transitioned to expired status.
    payload: [stockLotId, inventoryItemId, expirationDate]
    audit: true

integration_events:
  published:
    - name: StockLotExpired
      description: Signals BCM-INV-006/BCM-INV-009 that an expired lot is eligible for return or disposal.
      consumers: [inventory-procurement]
  consumed: []

published_language: []
