capability:
  id: BCM-INV-003
  name:
    en: Lot Management
    es: Lotes
  domain: DOM-08 Inventory
  priority: High
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001; StockLot owned by this capability)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Owns the StockLot entity — physical batch metadata (lot number, expiration date, storage
    condition, quarantine/expired/disposed status) for every InventoryItem, keyed by
    inventoryItemId. StockLot is a sibling entity of InventoryItem within the same aggregate
    boundary, created on first receipt (in coordination with BCM-INV-005 Stock Entries) and
    tracked through its expiration lifecycle. Never mutates InventoryItem.stockSummary quantities
    directly; quantity changes are the delegated responsibility of BCM-INV-005/006/007/008/009,
    each of which references a StockLot by id.
  in_scope:
    - "StockLot creation and metadata: lotNumber, expirationDate, storageCondition, supplier snapshot."
    - Expiration monitoring and quarantine/release/expire status transitions.
  out_of_scope:
    - Any stock quantity movement (BCM-INV-005/006/007/008/009 own quantity changes on a StockLot).
    - InventoryItem core identity fields (BCM-INV-001).
    - Supplier master data (external reference only; owned by the not-yet-modeled BCM-PER-006).

roadmap:
  module: COM-MOD-010
  release: REL-002
