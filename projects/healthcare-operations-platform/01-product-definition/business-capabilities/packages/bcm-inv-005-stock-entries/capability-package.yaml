capability:
  id: BCM-INV-005
  name:
    en: Stock Entries
    es: Entradas
  domain: DOM-08 Inventory
  priority: High
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001; stockSummary increase delegated to this capability)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Records goods receipt (from an approved BCM-INV-004 purchase order line or a manual entry)
    increasing StockLot.remainingQuantity and InventoryItem.stockSummary.onHandQuantity through the
    narrowly-scoped ApplyStockReceipt command. Coordinates with BCM-INV-003 to create the first
    StockLot for a new batch.
  in_scope:
    - "Goods receipt: increase StockLot.remainingQuantity and InventoryItem.stockSummary.onHandQuantity."
    - Linking a receipt to its originating BCM-INV-004 purchase order line, when applicable.
  out_of_scope:
    - Lot metadata ownership (BCM-INV-003).
    - Purchase order lifecycle (BCM-INV-004).
    - Stock decreases of any kind (BCM-INV-006/007/008/009).

roadmap:
  module: COM-MOD-010
  release: REL-002
  package_status: module_closed
  next_backlog_item: none (module closed; see COM-MOD-011-DEF for the next roadmap module)
  paused_functional_backlog_item: null

dependencies:
  required_capabilities:
    - BCM-INV-001
    - BCM-INV-003
    - BCM-SVC-002
    - BCM-SVC-007
    - BCM-ORG-003
    - BCM-PLT-001
