artifact:
  id: HOP-TEST-BCM-INV-005
  type: test-model
  name: Stock Entries Test Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-005

test_cases:
  - id: TST-SEN-005-01
    type: contract
    validates_rule: RN-001
    statement: Recording a stock receipt with zero or negative quantity is rejected.
    generatable: true
  - id: TST-SEN-005-02
    type: acceptance
    validates_rule: RN-002
    statement: A purchase_order_receipt entry referencing a draft or cancelled PurchaseOrder is rejected.
    generatable: false
  - id: TST-SEN-005-03
    type: architecture
    validates_rule: RN-003
    statement: No code path outside ApplyStockReceipt increases InventoryItem.stockSummary or StockLot.remainingQuantity.
    generatable: false
  - id: TST-SEN-005-04
    type: acceptance
    validates_rule: RN-004
    statement: A receipt against a discontinued InventoryItem is rejected.
    generatable: false
  - id: TST-SEN-005-05
    type: contract
    validates_rule: RN-005
    statement: A caller outside the item's tenant/laboratory/branch scope cannot record or read a stock entry.
    generatable: true

test_layers:
  - contract_tests
  - unit_tests
  - acceptance_tests
  - architecture_tests

generation_policy:
  repetitive_tests: generated
  custom_rule_tests: [TST-SEN-005-02, TST-SEN-005-03, TST-SEN-005-04]
