artifact:
  id: HOP-API-SRC-BCM-INV-005
  type: openapi-source
  name: Stock Entries API Source Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-005

api:
  base_path: /api/inventory/stock-entries
  surface_classification: internal
  security:
    scheme: bearer_jwt
    required_scopes_default: [inventory.entries.manage, inventory.entries.read]

resources:
  - name: StockEntryRecord
    operations:
      - id: applyStockReceipt
        method: POST
        path: /
        scopes: [inventory.entries.manage]
        generatable: false
        custom_reason: Delegated multi-field mutation with cross-capability validation.
      - id: listStockEntries
        method: GET
        path: /
        scopes: [inventory.entries.read]
        generatable: true

schemas_source:
  - StockEntryRecord

error_model:
  standard: rfc7807
  code_field: >
    Every error response carries a first-class `code` string field, consistent with the
    COM-MOD-010 module convention.
  domain_errors:
    - code: STOCK_ENTRY_QUANTITY_INVALID
      maps_to_rule: RN-001
    - code: STOCK_ENTRY_PURCHASE_ORDER_LINE_INVALID
      maps_to_rule: RN-002
    - code: STOCK_ENTRY_ITEM_DISCONTINUED
      maps_to_rule: RN-004
    - code: STOCK_ENTRY_SCOPE_MISMATCH
      maps_to_rule: RN-005
