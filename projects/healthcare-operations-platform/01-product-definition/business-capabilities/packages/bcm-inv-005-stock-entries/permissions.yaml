artifact:
  id: HOP-PERM-BCM-INV-005
  type: permissions
  name: Stock Entries Permissions
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-005
  depends_on_capability: BCM-PLT-001

scopes:
  - code: inventory.entries.manage
    description: Record a stock receipt (ApplyStockReceipt).
  - code: inventory.entries.read
    description: Read stock entry history.

roles:
  - role: tenant-administrator
    grants: [inventory.entries.manage, inventory.entries.read]
  - role: branch-administrator
    grants: [inventory.entries.manage, inventory.entries.read]
  - role: laboratory-technician
    grants: [inventory.entries.manage, inventory.entries.read]

access_policies:
  - id: POL-SEN-005-01
    statement: Stock entry commands are scoped to the calling actor's tenant, laboratory and branch.
    enforcement: row_level_tenant_laboratory_branch_filter
  - id: POL-SEN-005-02
    statement: stockSummary.onHandQuantity may only be increased through ApplyStockReceipt.
    enforcement: field_level_delegation_boundary

audit_obligations:
  audit_sink: BCM-PLT-007
  events:
    - event: StockReceived
      fields: [stockEntryId, inventoryItemId, stockLotId, quantity, sourceType]
