artifact:
  id: HOP-BM-BCM-SVC-009
  type: business-model
  name: Price List Management Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-009
  bounded_context: catalog-test-configuration
  primary_aggregate: TestDefinition

entities:
  - id: ENT-PRC-001
    name: PriceList
    is_aggregate_root: false
    owned_by_aggregate: TestDefinition
    description: A version-aware collection of price entries.
    fields:
      - name: priceListId
        type: uuid
        required: true
        identifier: true
      - name: tenantId
        type: TenantId
        required: true
      - name: laboratoryId
        type: LaboratoryId
        required: true
      - name: code
        type: string
        required: true
        unique_scope: [tenantId, laboratoryId]
      - name: name
        type: LocalizedText
        required: true
      - name: currency
        type: ISO-4217
        required: true
      - name: agreementRefId
        type: uuid
        required: false
      - name: effectiveFrom
        type: date
        required: true
      - name: effectiveTo
        type: date
        required: false
      - name: status
        type: enum
        values: [draft, published, deprecated, retired]
        required: true
      - name: version
        type: integer
        required: true
      - name: audit
        type: AuditMetadata
        required: true
  - id: ENT-PRC-002
    name: PriceEntry
    is_aggregate_root: false
    owned_by_aggregate: TestDefinition
    description: A price for a catalog item within a price list.
    fields:
      - name: entryId
        type: uuid
        required: true
        identifier: true
      - name: priceListId
        type: uuid
        required: true
      - name: itemType
        type: enum
        values: [service, test, panel]
        required: true
      - name: itemRefId
        type: uuid
        required: true
      - name: price
        type: Money
        required: true

value_objects:
  - name: LocalizedText
    fields:
      - name: en
        type: string
        required: true
      - name: es
        type: string
        required: true

relationships:
  - from: PriceList
    to: PriceEntry
    type: one_to_many
  - from: PriceEntry
    to: TestDefinition
    type: reference_by_id
    note: Price entries reference published services, tests or panels.
  - from: PriceList
    to: Sale
    type: reference_by_id
    note: Published price snapshots are consumed by sales pricing in cash-sales (AGG-010).

invariants:
  - id: INV-SVC-009-01
    statement: A price entry amount must be non-negative.
  - id: INV-SVC-009-02
    statement: A published price list may reference only published catalog items.
  - id: INV-SVC-009-03
    statement: Overlapping effective-dated price lists for the same scope and currency are not allowed.
  - id: INV-SVC-009-04
    statement: Price list code must be unique within a laboratory.

external_references:
  - identifier: TenantId
    source: shared-kernel
  - identifier: LaboratoryId
    source: shared-kernel
  - value_object: Money
    source: shared-kernel
  - aggregate: TestDefinition
    context: catalog-test-configuration
    access: owning_context
  - aggregate: Sale
    context: cash-sales
    access: published_language_only
