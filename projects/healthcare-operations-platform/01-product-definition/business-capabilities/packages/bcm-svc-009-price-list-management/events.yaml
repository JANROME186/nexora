artifact:
  id: HOP-EVT-BCM-SVC-009
  type: events
  name: Price List Management Events
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-009
  aggregate: TestDefinition

domain_events:
  - name: PriceListCreated
    description: A price list draft was created.
    payload: [priceListId, tenantId, laboratoryId, code, currency, version, effectiveFrom]
    audit: true
  - name: PriceListPublished
    description: A price list version was published and frozen.
    payload: [priceListId, version, currency, effectiveFrom, publishedBy]
    audit: true
  - name: PriceListRevised
    description: A published price list was revised into a new effective-dated version.
    payload: [priceListId, previousVersion, newVersion, effectiveFrom]
    audit: true
  - name: PriceListDeprecated
    description: A price list was deprecated.
    payload: [priceListId, version, deprecatedAt]
    audit: true

integration_events:
  published:
    - name: PriceListPublished
      description: Published language consumed by quotations, cashier and billing.
      consumers:
        - cash-sales
        - billing-tax
        - BCM-ATT-005
        - BCM-ATT-006
        - BCM-ATT-008
  consumed:
    - name: PublishedServiceCatalogUpdated
      source: BCM-SVC-001
    - name: TestDefinitionPublished
      source: BCM-SVC-002
    - name: PanelDefinitionPublished
      source: BCM-SVC-003

published_language:
  - PriceList
  - EffectivePriceSnapshot
