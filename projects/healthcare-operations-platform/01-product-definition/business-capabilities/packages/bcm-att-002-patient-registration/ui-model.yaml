artifact:
  id: HOP-UI-BCM-ATT-002
  type: ui-model
  name: Patient Registration UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-002
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  patient_portal:
    status: required
    generatable: true
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-REG-002-04
    name: Patient Self-Registration Wizard
    route: /patient/register
    type: wizard
    scopes: [anonymous]
    components:
      - PersonalDataForm
      - ConsentAgreementCheckbox
      - SubmitRegistrationButton
    generatable: true
  - id: SCR-REG-002-01
    name: Registration Intake
    route: /registrations/new
    type: wizard
    scopes: [patient.register]
    components:
      - IntakeChannelSelector
      - NaturalKeyForm
      - DuplicateCandidatePanel
      - MatchResolutionSelector
      - DraftPatientForm
      - RepresentativeSection
      - ConsentSection
    generatable: false
    custom_reason: Combines duplicate-detection candidates and cross-capability commit orchestration.
  - id: SCR-REG-002-02
    name: Registration Request List
    route: /registrations
    type: list
    scopes: [patient.register.read]
    components:
      - DataTable
      - IntakeChannelFilter
      - OutcomeFilter
    generatable: true
  - id: SCR-REG-002-03
    name: Registration Request Detail
    route: /registrations/{registrationRequestId}
    type: detail
    scopes: [patient.register.read]
    components:
      - RequestSummary
      - MatchResolutionSummary
      - CommitStatusBadge
      - AuditTraceLink
    generatable: true

states:
  - pending
  - committed
  - cancelled
  - rejected

localization:
  languages: [en, es]
  default: es
