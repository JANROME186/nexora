artifact:
  id: HOP-BR-BCM-ATT-002
  type: business-rules
  name: Patient Registration Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-002
  rule_id_pattern: "RN-###"

rules:
  - id: RN-001
    statement: A registration request must consult duplicate detection and record the resulting decision before committing.
    applies_to: PatientRegistrationRequest
    enforcement_point: command:StartPatientRegistration, command:CommitPatientRegistration
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Orchestration integrates BCM-PER-001 detector and captures actor decision.
    test_refs: [TST-REG-002-01]
  - id: RN-002
    statement: A new patient registration must commit only through BCM-PER-002 aggregate commands, never through direct persistence.
    applies_to: PatientRegistrationRequest
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Requires cross-capability orchestration and boundary enforcement.
    test_refs: [TST-REG-002-02]
  - id: RN-003
    statement: A representative registration must attach a PatientRepresentative with active authorization range during commit.
    applies_to: PatientRegistrationRequest
    enforcement_point: command:CommitPatientRegistration
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Combines patient commit and representative attach as one atomic decision.
    test_refs: [TST-REG-002-03]
  - id: RN-004
    statement: Registration scope must match the actor's tenant, laboratory and branch scope.
    applies_to: PatientRegistrationRequest
    enforcement_point: authorization:patient.register
    severity: critical
    audit_required: true
    generatable: true
    test_refs: [TST-REG-002-04]
  - id: RN-005
    statement: Registration must capture required consents when the tenant policy declares them mandatory.
    applies_to: PatientRegistrationRequest, ConsentSelection
    enforcement_point: command:CommitPatientRegistration
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Tenant policy defines which consent types are mandatory.
    test_refs: [TST-REG-002-05]
  - id: RN-006
    statement: Registration cannot commit if the natural-key candidate matches an existing patient with high confidence unless the actor explicitly resolves to reuse the existing record.
    applies_to: PatientRegistrationRequest
    enforcement_point: command:CommitPatientRegistration
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Confidence-based match resolution needs explicit actor decision.
    test_refs: [TST-REG-002-06, TST-REG-002-07]
  - id: RN-007
    statement: Registration audit events must include actor identity, branch and intake channel.
    applies_to: PatientRegistrationRequest
    enforcement_point: event:PatientRegistrationCommitted
    severity: high
    audit_required: true
    generatable: true
    test_refs: [TST-REG-002-08]
  - id: RN-008
    statement: A minor patient registration must default to representative registration when local age of majority policy applies.
    applies_to: PatientRegistrationRequest
    enforcement_point: command:StartPatientRegistration
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Age-of-majority thresholds are tenant configuration.
    test_refs: [TST-REG-002-09]

enforcement_summary:
  generatable_rules: [RN-004, RN-007]
  custom_implementation_rules: [RN-001, RN-002, RN-003, RN-005, RN-006, RN-008]
