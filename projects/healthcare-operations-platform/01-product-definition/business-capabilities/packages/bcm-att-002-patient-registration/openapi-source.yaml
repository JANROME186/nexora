artifact:
  id: HOP-API-SRC-BCM-ATT-002
  type: openapi-source
  name: Patient Registration API Source Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-002
  note: >
    Source contract model. The rendered OpenAPI document, controllers, DTOs
    and SDKs are generated outputs declared in generation-plan.yaml.

api:
  base_path: /api/care-delivery/patient-registrations
  surface_classification: internal
  future_surfaces:
    - classification: public
      status: request_only_later
      note: Patient portal registration request handoff planned for COM-MOD-009.
  security:
    scheme: bearer_jwt
    required_scopes_default: [patient.register]

resources:
  - name: PatientRegistrationRequest
    operations:
      - id: listPatientRegistrations
        method: GET
        path: /
        scopes: [patient.register]
        generatable: true
      - id: getPatientRegistration
        method: GET
        path: /{registrationRequestId}
        scopes: [patient.register]
        generatable: true
      - id: startPatientRegistration
        method: POST
        path: /
        scopes: [patient.register]
        generatable: false
        custom_reason: Duplicate detection consultation and age-of-majority default.
      - id: commitPatientRegistration
        method: POST
        path: /{registrationRequestId}/commit
        scopes: [patient.register]
        generatable: false
        custom_reason: Orchestration through BCM-PER-002 commands.
      - id: cancelPatientRegistration
        method: POST
        path: /{registrationRequestId}/cancel
        scopes: [patient.register]
        generatable: true

schemas_source:
  - PatientRegistrationRequest
  - DraftPatientData
  - DraftRepresentativeData
  - ConsentSelection
  - PatientRegistrationOutcome

error_model:
  standard: rfc7807
  domain_errors:
    - code: REGISTRATION_DUPLICATE_DECISION_REQUIRED
      maps_to_rule: RN-001
    - code: REGISTRATION_BOUNDARY_VIOLATION
      maps_to_rule: RN-002
    - code: REGISTRATION_REPRESENTATIVE_REQUIRED
      maps_to_rule: RN-003
    - code: REGISTRATION_CONSENT_MISSING
      maps_to_rule: RN-005
    - code: REGISTRATION_MATCH_RESOLUTION_REQUIRED
      maps_to_rule: RN-006
    - code: REGISTRATION_MINOR_REPRESENTATIVE_REQUIRED
      maps_to_rule: RN-008
