artifact:
  id: HOP-EVT-BCM-ATT-002
  type: events
  name: Patient Registration Events
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-002

domain_events:
  - name: PatientRegistrationStarted
    description: A registration request was created and duplicate detection was consulted.
    payload:
      - registrationRequestId
      - tenantId
      - branchId
      - actorId
      - intakeChannel
      - candidatePatientId
      - duplicateDetectionId
    audit: true
  - name: PatientRegistrationCommitted
    description: A registration request was committed, resulting in patient creation or reuse.
    payload:
      - registrationRequestId
      - outcomePatientId
      - registrationKind
      - actorId
      - intakeChannel
      - branchId
      - hasRepresentative
      - consentCount
    audit: true
  - name: PatientRegistrationCancelled
    description: A registration request was cancelled.
    payload:
      - registrationRequestId
      - reasonCode
      - actorId
    audit: true

integration_events:
  published:
    - name: PatientRegistrationOutcomeProjected
      description: Signals reception and appointment modules that a registration outcome is available.
      consumers:
        - orders-samples
        - reception
        - cash-sales
  consumed:
    - name: PersonDuplicateDetectionRequested
      source: BCM-PER-001
    - name: PatientRegistered
      source: BCM-PER-002
    - name: PatientRepresentativeAttached
      source: BCM-PER-002
    - name: PatientConsentRecorded
      source: BCM-PER-002

published_language:
  - PatientRegistrationOutcome
