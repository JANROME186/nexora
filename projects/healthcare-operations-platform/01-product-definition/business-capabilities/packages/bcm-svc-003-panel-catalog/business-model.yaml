artifact:
  id: HOP-BM-BCM-SVC-003
  type: business-model
  name: Panel Catalog Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-003
  bounded_context: catalog-test-configuration
  primary_aggregate: TestDefinition

entities:
  - id: ENT-PNL-001
    name: PanelDefinition
    is_aggregate_root: false
    owned_by_aggregate: TestDefinition
    description: A clinical grouping of tests ordered together.
    fields:
      - name: panelId
        type: uuid
        required: true
        identifier: true
      - name: tenantId
        type: TenantId
        required: true
      - name: laboratoryId
        type: LaboratoryId
        required: true
      - name: code
        type: string
        required: true
        unique_scope: [tenantId, laboratoryId]
      - name: name
        type: LocalizedText
        required: true
      - name: status
        type: enum
        values: [draft, published, deprecated, retired]
        required: true
      - name: version
        type: integer
        required: true
      - name: audit
        type: AuditMetadata
        required: true
  - id: ENT-PNL-002
    name: PanelMember
    is_aggregate_root: false
    owned_by_aggregate: TestDefinition
    description: A member test reference within a panel.
    fields:
      - name: memberId
        type: uuid
        required: true
        identifier: true
      - name: panelId
        type: uuid
        required: true
      - name: testRefId
        type: uuid
        required: true
      - name: displayOrder
        type: integer
        required: false
      - name: mandatory
        type: boolean
        required: true

value_objects:
  - name: LocalizedText
    fields:
      - name: en
        type: string
        required: true
      - name: es
        type: string
        required: true

relationships:
  - from: PanelDefinition
    to: PanelMember
    type: one_to_many
  - from: PanelMember
    to: TestDefinition
    type: reference_by_id
    note: Member tests owned by BCM-SVC-002.

invariants:
  - id: INV-SVC-003-01
    statement: A panel must contain at least two member tests.
  - id: INV-SVC-003-02
    statement: A published panel may reference only published member tests.
  - id: INV-SVC-003-03
    statement: Panel code must be unique within a laboratory.

external_references:
  - identifier: TenantId
    source: shared-kernel
  - identifier: LaboratoryId
    source: shared-kernel
  - aggregate: TestDefinition
    context: catalog-test-configuration
    access: owning_context
