artifact:
  id: HOP-TEST-BCM-SVC-003
  type: test-model
  name: Panel Catalog Test Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-003

test_cases:
  - id: TST-SVC-003-01
    type: unit
    validates_rule: RN-001
    statement: Reject duplicate panel code within a laboratory.
    generatable: true
  - id: TST-SVC-003-02
    type: unit
    validates_rule: RN-002
    statement: Reject publishing a panel with fewer than two members.
    generatable: true
  - id: TST-SVC-003-03
    type: acceptance
    validates_rule: RN-003
    statement: Publishing fails when a member test is not published.
    generatable: false
  - id: TST-SVC-003-04
    type: regression
    validates_rule: RN-004
    statement: Editing a published panel creates a new draft and preserves the frozen version.
    generatable: false
  - id: TST-SVC-003-05
    type: contract
    validates_rule: RN-005
    statement: Unauthorized users cannot create, update or publish panels.
    generatable: true

test_layers: [contract_tests, unit_tests, acceptance_tests, regression_tests]

generation_policy:
  repetitive_tests: generated
  custom_rule_tests: [TST-SVC-003-03, TST-SVC-003-04]
