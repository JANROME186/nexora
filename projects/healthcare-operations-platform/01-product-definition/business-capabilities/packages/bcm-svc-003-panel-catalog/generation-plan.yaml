artifact:
  id: HOP-GEN-BCM-SVC-003
  type: generation-plan
  name: Panel Catalog Generation Plan
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-003
  compiler_strategy: model_to_platform

generated_outputs:
  backend:
    - CRUD scaffolding for PanelDefinition, PanelMember
    - DTOs
    - Controllers for generatable operations
    - Repository interfaces and baseline persistence adapters
    - Domain skeleton for panel projection on TestDefinition context
    - API adapters
  frontend:
    - Employee portal list and editor components (SCR-SVC-003-01, SCR-SVC-003-02)
    - Routes
    - Forms
    - Client SDK usage
  contracts:
    - Rendered OpenAPI document from openapi-source.yaml
    - Typed SDK
    - Swagger documentation
  tests:
    - Repetitive unit tests for RN-001, RN-002, RN-005
    - Contract tests
    - Acceptance test skeletons
  operations:
    - Metric and log wiring from observability-model.yaml
    - Dashboard definition skeleton
    - Alert definition for HighPanelPublishFailureRate

custom_implementation_points:
  - id: CUS-SVC-003-01
    description: Member test publication validation at publish time (RN-003).
    maps_to_backlog: MVP-MOD-002-BE-002
  - id: CUS-SVC-003-02
    description: Immutable versioning and snapshot freeze on edit (RN-004).
    maps_to_backlog: MVP-MOD-002-BE-002
  - id: CUS-SVC-003-03
    description: Published panel snapshot projection endpoint for downstream consumers.
    maps_to_backlog: MVP-MOD-002-BE-002

do_not_write_manually:
  - CRUD scaffolding
  - DTOs
  - Controllers
  - Repositories
  - Swagger documentation
  - SDKs
  - Repetitive documentation
  - Repetitive test cases

provenance:
  source_models:
    - business-model.yaml
    - business-rules.yaml
    - processes.yaml
    - events.yaml
    - openapi-source.yaml
    - ui-model.yaml
    - permissions.yaml
    - observability-model.yaml
  generation_metadata_required: true
