openapi: 3.0.3
info:
  title: Workflow Engine API
  version: 1.0.0
  description: OpenAPI source specification for triggering and tracking operational workflows.
paths:
  /api/v1/platform/workflows/executions:
    get:
      summary: List active and historical workflow executions
      operationId: listWorkflowExecutions
      responses:
        '200':
          description: List of executions
    post:
      summary: Trigger an operational workflow execution
      operationId: triggerWorkflow
      responses:
        '202':
          description: Workflow execution started
  /api/v1/platform/workflows/executions/{executionId}/rollback:
    post:
      summary: Trigger manual rollback for a running or failed workflow execution
      operationId: rollbackWorkflow
      responses:
        '200':
          description: Rollback initiated
