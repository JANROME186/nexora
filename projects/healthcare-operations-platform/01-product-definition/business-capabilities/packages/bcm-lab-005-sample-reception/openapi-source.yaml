artifact:
  id: HOP-API-SRC-BCM-LAB-005
  type: openapi-source
  name: Sample Reception API Source Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-005
  note: >
    Source contract model. The rendered OpenAPI document, controllers, DTOs
    and SDKs are generated outputs declared in generation-plan.yaml.

api:
  base_path: /api/clinical-operations/samples/{sampleId}/reception
  surface_classification: internal
  security:
    scheme: bearer_jwt
    required_scopes_default: [sample.receive]

resources:
  - name: SampleReception
    operations:
      - id: listReceptionWorklist
        method: GET
        path: /reception-worklist
        scopes: [sample.receive]
        generatable: true
      - id: receiveSampleAtLaboratory
        method: POST
        path: /receive
        scopes: [sample.receive]
        generatable: false
        custom_reason: Multi-criterion condition check and delegated Sample.receptionRecord mutation.
      - id: rejectSampleAtReception
        method: POST
        path: /reject
        scopes: [sample.receive]
        generatable: false
        custom_reason: Structured reason-code validation and terminal-state transition.
      - id: disposeSample
        method: POST
        path: /dispose
        scopes: [sample.dispose]
        generatable: false
        custom_reason: Terminal-state precondition guard and evidence-preserving disposal record.

schemas_source:
  - ReceptionWorklistEntry
  - ReceptionConditionCheck
  - DisposalRecord

error_model:
  standard: rfc7807
  domain_errors:
    - code: SAMPLE_UNLABELED_AT_RECEPTION
      maps_to_rule: RN-001
    - code: SAMPLE_CONDITION_CHECK_FAILED
      maps_to_rule: RN-002
    - code: SAMPLE_TERMINAL_STATE_VIOLATION
      maps_to_rule: RN-003
    - code: SAMPLE_DISPOSAL_EVIDENCE_PRESERVATION_VIOLATION
      maps_to_rule: RN-004
    - code: SAMPLE_BOUNDARY_VIOLATION
      maps_to_rule: RN-005
    - code: SAMPLE_SCOPE_MISMATCH
      maps_to_rule: RN-006
