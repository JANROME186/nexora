artifact:
  id: HOP-EVT-BCM-LAB-005
  type: events
  name: Sample Reception Events
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-005

domain_events:
  - name: SampleReceived
    description: A labeled sample passed reception condition checks and was accepted at the laboratory.
    payload:
      - sampleId
      - orderId
      - tenantId
      - branchId
      - actorId
      - receivedAt
    audit: true
  - name: SampleRejected
    description: A sample was rejected at reception due to a failed condition check.
    payload:
      - sampleId
      - orderId
      - rejectionStage
      - reasonCode
      - actorId
      - rejectedAt
    audit: true
  - name: SampleDisposed
    description: A sample reached its terminal disposal state.
    payload:
      - sampleId
      - disposalReason
      - actorId
      - disposedAt
    audit: true

integration_events:
  published:
    - name: SampleReceived
      description: Signals laboratory processing that the sample is available for analysis.
      consumers:
        - laboratory-results
    - name: SampleRejected
      description: Signals order management and cashier that a required sample failed reception.
      consumers:
        - orders-samples
    - name: SampleDisposed
      description: Signals inventory and quality tracking of specimen disposal (informational only in MVP-MOD-006).
      consumers:
        - orders-samples
  consumed:
    - name: SpecimenLabelAssigned
      source: BCM-LAB-003

published_language:
  - SampleReceived
  - SampleRejected
  - SampleDisposed
