capability:
  id: BCM-LAB-005
  name:
    en: Sample Reception
    es: Recepción de Muestras
  domain: DOM-05 Clinical Operations
  priority: High
  roadmap: MVP1
  dependency_profile: clinical_operations
  bounded_context: orders-samples
  primary_aggregate: Sample (AGG-008, owned by BCM-LAB-002)
  process_ref: HRP-001-P05

scope:
  summary: >
    Receives a labeled Sample at the laboratory, verifies specimen condition
    against reception criteria (labeling present, container intact, no
    hemolysis or other visible defect, within transport time window) and
    either accepts it (receivedRecord + status=received) or rejects it
    (rejectionReason with rejectionStage=at_reception). Also manages
    end-of-life disposal for samples that finish or fail the pipeline. Holds
    delegated authority over Sample.receptionRecord, rejection-at-reception
    and disposal only; it does not create, collect or label samples.
  in_scope:
    - Reception worklist for labeled, in-transit samples awaiting laboratory intake.
    - SampleReceptionRecord condition verification (hemolysis, insufficient volume, wrong container, unlabeled, clotted).
    - Delegated mutation of Sample.receptionRecord through ReceiveSampleAtLaboratory.
    - Delegated rejection-at-reception through RejectSampleAtReception.
    - Sample disposal through DisposeSample once a sample reaches a terminal, evidence-preserved state.
  out_of_scope:
    - Sample creation, collection data, rejection at collection (BCM-LAB-002).
    - Specimen label printing and confirmation (BCM-LAB-003).
    - Sample transport between sites (BCM-LAB-004, MVP2, out of MVP-MOD-006).
    - Laboratory processing and result capture (BCM-LAB-006).

