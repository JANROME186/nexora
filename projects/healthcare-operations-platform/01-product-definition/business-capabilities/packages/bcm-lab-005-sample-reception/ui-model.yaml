artifact:
  id: HOP-UI-BCM-LAB-005
  type: ui-model
  name: Sample Reception UI Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-005
  target_surface: employee_portal

surfaces:
  employee_portal:
    status: required
    generatable: true
  patient_portal:
    status: not_required
    generatable: not_applicable
  doctor_portal:
    status: not_required
    generatable: not_applicable

screens:
  - id: SCR-RCP-005-01
    name: Reception Worklist
    route: /samples/reception-worklist
    type: list
    scopes: [sample.receive]
    components:
      - DataTable
      - BranchFilter
      - TransportWindowIndicator
    generatable: true
  - id: SCR-RCP-005-02
    name: Receive or Reject Sample
    route: /samples/{sampleId}/reception
    type: form
    scopes: [sample.receive]
    components:
      - ReceptionConditionChecklist
      - ReceiveSampleButton
      - RejectSampleDialog
    generatable: false
    custom_reason: Combines multi-criterion condition checklist with receive/reject branching logic.
  - id: SCR-RCP-005-03
    name: Dispose Sample
    route: /samples/{sampleId}/dispose
    type: action_panel
    scopes: [sample.dispose]
    components:
      - DisposalReasonForm
      - DisposeSampleButton
    generatable: false
    custom_reason: Enforces terminal-state precondition before allowing disposal.

states:
  - collected
  - labeled
  - in_transit
  - received
  - rejected
  - in_process
  - disposed

localization:
  languages: [en, es]
  default: es
