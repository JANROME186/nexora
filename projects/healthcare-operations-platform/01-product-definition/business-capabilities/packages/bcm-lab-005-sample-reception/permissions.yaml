artifact:
  id: HOP-PERM-BCM-LAB-005
  type: permissions
  name: Sample Reception Permissions
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-LAB-005
  depends_on_capability: BCM-PLT-001

scopes:
  - code: sample.receive
    description: List the reception worklist, receive a sample and reject a sample at reception.
  - code: sample.dispose
    description: Dispose a sample that has reached a terminal state.
  - code: sample.read
    description: Read reception and disposal history for audit or downstream workflows.

roles:
  - role: laboratory-technician
    grants: [sample.receive, sample.dispose, sample.read]
  - role: branch-administrator
    grants: [sample.receive, sample.dispose, sample.read]
  - role: sample-collector
    grants: [sample.read]
  - role: tenant-administrator
    grants: [sample.read]
  - role: technical-validator
    grants: [sample.read]

access_policies:
  - id: POL-RCP-005-01
    statement: Reception and disposal commands are scoped to the actor's tenant, laboratory and branch.
    enforcement: row_level_tenant_laboratory_branch_filter
  - id: POL-RCP-005-02
    statement: This capability may write only Sample.receptionRecord, rejection-at-reception fields and disposal fields; no other Sample field may be written from this capability.
    enforcement: cross_capability_delegation_policy

audit_obligations:
  audit_sink: BCM-PLT-007
  events:
    - event: SampleReceived
      fields: [sampleId, orderId, actorId, branchId]
    - event: SampleRejected
      fields: [sampleId, orderId, rejectionStage, reasonCode, actorId]
    - event: SampleDisposed
      fields: [sampleId, disposalReason, actorId]
