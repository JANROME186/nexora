artifact:
  id: HOP-EVT-BCM-PER-002
  type: events
  name: Patient Management Events
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-PER-002
  aggregate: Patient

domain_events:
  - name: PatientRegistered
    description: A new patient master-data record was registered.
    payload:
      - patientId
      - tenantId
      - laboratoryId
      - patientCode
      - registeredAt
      - actorId
    audit: true
  - name: PatientUpdated
    description: A patient master-data record was updated.
    payload:
      - patientId
      - changedFields
      - updatedAt
      - actorId
    audit: true
  - name: PatientMerged
    description: A patient record was merged into a surviving record.
    payload:
      - sourcePatientId
      - survivingPatientId
      - mergedAt
      - actorId
    audit: true
  - name: PatientDeactivated
    description: A patient record was deactivated.
    payload:
      - patientId
      - deactivatedAt
      - actorId
    audit: true
  - name: PatientConsentRecorded
    description: A patient consent statement was recorded.
    payload:
      - patientId
      - consentId
      - consentType
      - grantedBy
      - grantedAt
    audit: true
  - name: PatientConsentRevoked
    description: A patient consent statement was revoked.
    payload:
      - patientId
      - consentId
      - revokedAt
      - actorId
    audit: true
  - name: PatientRepresentativeAttached
    description: A representative was attached to a patient.
    payload:
      - patientId
      - representativeId
      - relationship
      - authorizationValidRange
      - actorId
    audit: true
  - name: PatientRepresentativeUpdated
    description: A representative relationship was updated.
    payload:
      - patientId
      - representativeId
      - changedFields
      - actorId
    audit: true
  - name: PatientRepresentativeRevoked
    description: A representative relationship was revoked.
    payload:
      - patientId
      - representativeId
      - revokedAt
      - actorId
    audit: true

integration_events:
  published:
    - name: PatientSnapshotProjected
      description: Signals downstream consumers that a Patient projection changed.
      consumers:
        - orders-samples
        - laboratory-results
        - imaging-operations
        - cash-sales
        - billing-tax
        - patient-portal
    - name: PatientMergedProjected
      description: Signals downstream consumers to rewire references to a merged patient.
      consumers:
        - orders-samples
        - laboratory-results
        - imaging-operations
        - cash-sales
        - billing-tax
  consumed:
    - name: PersonDuplicateDetectionRequested
      source: BCM-PER-001
      description: Confirms duplicate detection was executed before registration.

published_language:
  - PatientId
  - PatientSnapshot
  - PatientEligibilityStatus
  - PatientRepresentativeAssertion
