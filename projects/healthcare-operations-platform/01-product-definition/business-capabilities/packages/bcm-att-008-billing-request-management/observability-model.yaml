artifact:
  id: HOP-OBS-BCM-ATT-008
  type: observability-model
  name: Billing Request Management Observability Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-008
  depends_on_capability: BCM-PLT-006

logs:
  - {event: invoice_requested, level: info, fields: [invoiceRequestId, saleId, patientId]}
  - {event: invoice_submitted, level: info, fields: [invoiceRequestId, providerCode, adapterCorrelationId]}
  - {event: invoice_failed, level: warn, fields: [invoiceRequestId, providerCode, statusCode]}
  - {event: invoice_cancelled, level: info, fields: [invoiceRequestId, cancelledBy]}

metrics:
  - {name: billing_requests_created_total, type: counter, labels: [tenantId, branchId]}
  - {name: billing_adapter_submissions_total, type: counter, labels: [tenantId, providerCode, status]}
  - {name: billing_adapter_latency_ms, type: histogram, labels: [tenantId, providerCode]}
  - {name: billing_failed_requests_total, type: counter, labels: [tenantId, providerCode]}

traces:
  - span: CreateBillingRequest
    child_spans: [ResolveSale, CaptureFiscalProfileSnapshot, CalculateTaxLines]
  - span: SubmitBillingRequest
    child_spans: [ResolveBillingAdapter, SubmitToAdapter, PersistAdapterResponse]

alerts:
  - {name: BillingAdapterFailureSpike, condition: billing_failed_requests_total rate exceeds threshold, severity: warning}
  - {name: BillingAdapterLatencyHigh, condition: billing_adapter_latency_ms p95 exceeds threshold, severity: warning}
