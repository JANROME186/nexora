artifact:
  id: HOP-BUS-RLS-BCM-PLT-002
  type: business-rules
  name: Platform Configuration Business Rules
  version: 1.0.0

rules:
  - id: RN-CFG-001
    statement: Feature flags must be dynamically resolvable per tenant context without requiring server restarts.
    applies_to: FeatureFlag
    enforcement_point: FeatureFlagEvaluator
    severity: HIGH
    audit_required: true
    test_refs: [TEST-CFG-001]

  - id: RN-CFG-002
    statement: Data masking policies for document and credential fields must be tenant-configurable (addressing TD-BE-008).
    applies_to: DataMaskingPolicy
    enforcement_point: PatientDoctorReadModelMapper
    severity: HIGH
    audit_required: true
    test_refs: [TEST-CFG-002]

  - id: RN-CFG-003
    statement: Sensitive configuration keys marked is_encrypted must be stored using AES-256 GCM envelope encryption.
    applies_to: ConfigKeyRoot
    enforcement_point: ConfigPersistenceProvider
    severity: CRITICAL
    audit_required: true
    test_refs: [TEST-CFG-003]
