capability:
  id: BCM-PLT-002
  name:
    en: Platform Configuration
    es: Configuración de Plataforma y Feature Flags
  domain: DOM-10 Platform
  priority: High
  roadmap: MVP1
  dependency_profile: foundation
  bounded_context: platform-operations
  primary_aggregate: PlatformConfiguration

scope:
  summary: >
    Governs global platform parameters, system environment profiles, tenant feature flag toggles,
    customer onboarding setup guides, configuration templates (Starter, Professional, Enterprise defaults),
    dynamic PII data masking policy overrides, and commercial launch feature controls for Healthcare Operations Platform.
  in_scope:
    - Global platform parameters and tenant-specific configuration key-value overrides.
    - Customer onboarding wizard feature flags (customer_onboarding_wizard_enabled, customer_self_configuration_enabled, commercial_demo_mode_enabled).
    - Initial customer configuration templates and export/import parameter bundles.
    - Feature flag evaluation engine with percentage rollouts, tenant rules, and targeted evaluation.
    - System environment configuration profiles.
    - Dynamic data masking configuration for document/credential read models (addressing TD-BE-008).
    - Maintenance mode activation and customer notification banner configuration.
  out_of_scope:
    - User role and permission definitions (handled by BCM-PLT-001 IAM).
    - Hardening of external API endpoints (handled by BCM-PLT-005 API Management).

roadmap:
  module: COM-MOD-016
  release: REL-003
  package_status: modeled
  next_backlog_item: COM-MOD-016-OPS-001

