openapi: 3.0.3
info:
  title: Platform Configuration API
  version: 1.0.0
  description: OpenAPI source specification for Platform Configuration and Feature Flags.
paths:
  /api/v1/platform/config:
    get:
      summary: Get platform configuration parameters
      operationId: getPlatformConfig
      responses:
        '200':
          description: Configuration parameters map
  /api/v1/platform/feature-flags:
    get:
      summary: Evaluate feature flags for active context
      operationId: evaluateFeatureFlags
      responses:
        '200':
          description: Evaluated feature flag state
    post:
      summary: Create or update feature flag
      operationId: updateFeatureFlag
      responses:
        '200':
          description: Feature flag updated
