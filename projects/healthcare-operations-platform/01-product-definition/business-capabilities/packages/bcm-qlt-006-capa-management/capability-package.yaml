capability:
  id: BCM-QLT-006
  name:
    en: CAPA Management
    es: Gestión CAPA (Acciones Correctivas y Preventivas)
  domain: DOM-09 Quality
  priority: High
  roadmap: MVP3
  dependency_profile: quality_compliance
  bounded_context: external-quality-compliance
  primary_aggregate: CapaInvestigation (AGG-021)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Provides end-to-end management of Corrective Action and Preventive Action (CAPA) investigations.
    Supports structured root cause analysis (RCA) using 5-Whys or Ishikawa methodologies, action plan formulation,
    multi-level approval workflows, execution tracking, and mandatory post-implementation effectiveness verification.
    Integrates event-driven triggers from clinical/operational quality signals (e.g., EQA failures, internal QC out-of-control,
    audit findings, critical result escalations, or customer complaints).
  in_scope:
    - CAPA investigation lifecycle state machine (draft -> investigating -> action_plan_pending -> in_execution -> verification_pending -> closed).
    - Structured Root Cause Analysis (RCA) recording.
    - Corrective and preventive action item assignment, target due dates, and completion evidence attachment via BCM-PLT-008.
    - Multi-role authorization (initiator, investigator, quality approver, effectiveness verifier).
    - Event-driven ingestion of quality signals from BCM-QLT-001, BCM-QLT-002, BCM-QLT-007, BCM-RES-006, and BCM-PLT-007.
  out_of_scope:
    - Internal daily QC run execution (BCM-QLT-001).
    - External EQA survey result scoring (BCM-QLT-002).
    - Audit scheduling and finding entry (BCM-QLT-007).

