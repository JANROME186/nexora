justification: >
  Corrective Action and Preventive Action (CAPA) investigations involve complex multi-step root cause analysis
  (5-Whys/Fishbone), action plan formalization, formal quality approval, and regulatory evidence evaluation.
  These workflows are scoped exclusively to the desktop Employee Portal for quality assurance professionals.
  No mobile interface is required.
