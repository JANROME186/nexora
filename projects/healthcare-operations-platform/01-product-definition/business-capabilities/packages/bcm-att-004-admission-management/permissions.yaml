artifact:
  id: HOP-PERM-BCM-ATT-004
  type: permissions
  name: Admission Management Permissions
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-ATT-004
  depends_on_capability: BCM-PLT-001

scopes:
  - code: admission.manage
    description: Start, mark ready, commit or reject an admission request.
  - code: admission.read
    description: Read admission request history for audit and review.

roles:
  - role: receptionist
    grants: [admission.manage, admission.read]
  - role: branch-administrator
    grants: [admission.manage, admission.read]
  - role: tenant-administrator
    grants: [admission.read]

access_policies:
  - id: POL-ADM-004-01
    statement: Admission commands are scoped to the actor's tenant, laboratory and branch.
    enforcement: row_level_tenant_laboratory_branch_filter
  - id: POL-ADM-004-02
    statement: Admission commit must delegate order mutation to BCM-LAB-001 aggregate commands.
    enforcement: cross_capability_delegation_policy

audit_obligations:
  audit_sink: BCM-PLT-007
  events:
    - event: AdmissionRequestStarted
      fields: [admissionId, actorId, branchId, visitId]
    - event: AdmissionMarkedReady
      fields: [admissionId, actorId]
    - event: AdmissionRequestCommitted
      fields: [admissionId, createdOrderId, actorId, branchId]
    - event: AdmissionRequestRejected
      fields: [admissionId, actorId, rejectionReason]
