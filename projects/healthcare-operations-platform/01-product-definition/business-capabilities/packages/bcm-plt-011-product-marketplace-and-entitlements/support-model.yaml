artifact:
  id: HOP-MKT-SUPPORT-BCM-PLT-011
  type: marketplace-support-model
  name: Marketplace Support Model
  version: 1.0.0
  status: modeled

support:
  channels:
    - tenant_admin_support
    - marketplace_operator_support
    - vendor_support_when_vendor_package_exists
  severity_routes:
    sev1:
      route: incident_response
      response_slo: inherited_from_operational_governance
    sev2:
      route: product_support
      response_slo: inherited_from_operational_governance
    sev3:
      route: support_queue
      response_slo: inherited_from_operational_governance
  support_artifacts_required:
    - package_runbook
    - installation_guide
    - rollback_guide
    - known_limitations
    - customer_release_notes

ownership:
  nexora_owned_packages: Nexora Support
  third_party_packages: Provider plus Nexora Marketplace Operations
