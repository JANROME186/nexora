artifact:
  id: HOP-MKT-TEL-BCM-PLT-011
  type: marketplace-telemetry-model
  name: Marketplace Telemetry Model
  version: 1.0.0
  status: modeled

telemetry:
  metrics:
    - marketplace_package_views_total
    - marketplace_offer_purchases_total
    - marketplace_entitlement_decisions_total
    - marketplace_entitlement_denials_total
    - marketplace_installations_total
    - marketplace_installation_failures_total
    - marketplace_upgrade_rollbacks_total
    - marketplace_billing_events_total
  dimensions:
    - tenant_id
    - package_code
    - package_version
    - offer_code
    - decision
    - region
  logs:
    - package_lifecycle_log
    - entitlement_decision_log
    - installation_workflow_log
    - billing_adapter_event_log
  tracing:
    propagation_required: true
    correlation_id_required: true
    spans:
      - compatibility_evaluation
      - entitlement_evaluation
      - installation_workflow
      - billing_event_publication
