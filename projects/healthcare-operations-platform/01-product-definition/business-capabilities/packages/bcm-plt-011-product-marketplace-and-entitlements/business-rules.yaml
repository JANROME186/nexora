artifact:
  id: HOP-RULES-BCM-PLT-011
  type: business-rules
  name: Product Marketplace and Entitlements Rules
  version: 1.0.0
  status: modeled
  backlog_item: COM-MOD-017-DEF

rules:
  - id: RN-MKT-001
    statement: A marketplace package must map to at least one Business Capability Package or approved extension point.
    applies_to: MarketplacePackage
    enforcement_point: package_publication
    severity: high
    audit_required: true
    test_refs: [TEST-MKT-001]
  - id: RN-MKT-002
    statement: Package activation requires an active tenant entitlement, IAM permission and auditable activation command.
    applies_to: PackageInstallation
    enforcement_point: activation
    severity: critical
    audit_required: true
    test_refs: [TEST-MKT-002, TEST-MKT-006]
  - id: RN-MKT-003
    statement: Package offers must keep provider-specific payment details outside the product model.
    applies_to: CommercialOffer
    enforcement_point: offer_publication
    severity: high
    audit_required: true
    test_refs: [TEST-MKT-003]
  - id: RN-MKT-004
    statement: Package upgrade, rollback, suspension, uninstall and retirement behavior must be defined before publication.
    applies_to: MarketplacePackage
    enforcement_point: certification
    severity: high
    audit_required: true
    test_refs: [TEST-MKT-004]
  - id: RN-MKT-005
    statement: Entitlement checks must be centralized and cannot be hard-coded in controllers, UI components or mobile views.
    applies_to: TenantEntitlement
    enforcement_point: generated_outputs
    severity: critical
    audit_required: true
    test_refs: [TEST-MKT-005]
  - id: RN-MKT-006
    statement: Marketplace packages cannot bypass IAM, audit, privacy, consent, retention, financial controls or clinical authority rules.
    applies_to: protected_capability_consumption
    enforcement_point: runtime_consumption
    severity: critical
    audit_required: true
    test_refs: [TEST-MKT-006, TEST-MKT-007]

