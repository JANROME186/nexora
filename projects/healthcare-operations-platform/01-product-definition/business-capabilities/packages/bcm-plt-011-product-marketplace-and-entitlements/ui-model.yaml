artifact:
  id: HOP-UI-BCM-PLT-011
  type: ui-model
  name: Product Marketplace and Entitlements UI Model
  version: 1.0.0
  status: modeled
  backlog_item: COM-MOD-017-DEF

employee_portal:
  screens:
    - id: SCREEN_MARKETPLACE_CATALOG_ADMIN
      purpose: Review package catalog, versions, certification state and publication metadata.
      required_permissions: [marketplace.package:certify, marketplace.package:publish]
    - id: SCREEN_MARKETPLACE_OFFERS
      purpose: Manage commercial offers, bundles, trial policy and package availability.
      required_permissions: [marketplace.offer:publish]
    - id: SCREEN_TENANT_ENTITLEMENTS
      purpose: Grant, revoke, inspect and troubleshoot tenant entitlements.
      required_permissions: [marketplace.entitlement:grant, marketplace.entitlement:revoke]
    - id: SCREEN_PACKAGE_INSTALLATIONS
      purpose: Install, activate, upgrade, rollback, suspend and uninstall packages per tenant.
      required_permissions: [marketplace.installation:install, marketplace.installation:activate]
public_website:
  surfaces:
    - id: PUBLIC_MARKETPLACE_LISTING
      purpose: Discover published public package listings and request commercial contact.
patient_portal:
  entitlement_behavior: Hide unavailable package features unless tenant entitlement and IAM permission allow access.
doctor_portal:
  entitlement_behavior: Hide unavailable package features unless tenant entitlement and IAM permission allow access.

i18n:
  locales: [es-MX, en-US]
  namespace: marketplace
  hardcoded_text_allowed: false

