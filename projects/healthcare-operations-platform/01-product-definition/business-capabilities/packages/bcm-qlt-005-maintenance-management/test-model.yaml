artifact:
  id: HOP-TEST-BCM-QLT-005
  type: test-model
  name: Maintenance Management Test Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-QLT-005

test_cases:
  - id: TST-MNT-005-01
    type: acceptance
    validates_rule: RN-001
    statement: Recording maintenance against an InventoryItem with itemType reagent is rejected.
    generatable: false
  - id: TST-MNT-005-02
    type: acceptance
    validates_rule: RN-002
    statement: Starting and completing maintenance publish MaintenanceScheduled/MaintenanceCompleted without this capability writing InventoryItem.equipmentProfile.
    generatable: false
  - id: TST-MNT-005-03
    type: architecture
    validates_rule: RN-003
    statement: No code path outside this capability appends to InventoryItem.maintenanceRecord.
    generatable: false
  - id: TST-MNT-005-04
    type: contract
    validates_rule: RN-004
    statement: Completing maintenance with completedAt on or before startedAt is rejected.
    generatable: true
  - id: TST-MNT-005-05
    type: contract
    validates_rule: RN-005
    statement: A caller outside the item's tenant/laboratory/branch scope cannot record, complete or read a maintenance event.
    generatable: true

test_layers:
  - contract_tests
  - unit_tests
  - acceptance_tests
  - architecture_tests

generation_policy:
  repetitive_tests: generated
  custom_rule_tests: [TST-MNT-005-01, TST-MNT-005-02, TST-MNT-005-03]
