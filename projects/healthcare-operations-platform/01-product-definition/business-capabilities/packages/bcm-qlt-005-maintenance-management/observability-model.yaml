artifact:
  id: HOP-OBS-BCM-QLT-005
  type: observability-model
  name: Maintenance Management Observability Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-QLT-005
  depends_on_capability: BCM-PLT-006

logs:
  - event: maintenance_recorded
    level: info
    fields: [maintenanceEventId, inventoryItemId, maintenanceType]
    correlation_id: maintenanceEventId
  - event: maintenance_completed
    level: info
    fields: [maintenanceEventId, inventoryItemId, downtimeMinutes]
    correlation_id: maintenanceEventId

metrics:
  - name: maintenance_events_total
    type: counter
    labels: [tenantId, branchId, maintenanceType]
  - name: maintenance_downtime_minutes_total
    type: counter
    labels: [tenantId, branchId]

traces:
  - span: RecordMaintenance
    child_spans: [ValidateItemTypeEligibility, PublishMaintenanceScheduled]
  - span: CompleteMaintenance
    child_spans: [ValidateCompletionTemporalGuard, PublishMaintenanceCompleted]

audit_events:
  - MaintenanceScheduled
  - MaintenanceCompleted

alerts:
  - name: MaintenanceDowntimeHigh
    condition: maintenance_downtime_minutes_total exceeds configured threshold per period
    severity: medium
