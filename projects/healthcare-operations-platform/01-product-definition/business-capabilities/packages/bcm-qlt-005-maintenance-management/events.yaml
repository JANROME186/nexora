artifact:
  id: HOP-EVT-BCM-QLT-005
  type: events
  name: Maintenance Management Events
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-QLT-005

domain_events:
  - name: MaintenanceRecorded
    description: A maintenance event was appended to an equipment item's maintenanceRecord.
    payload: [maintenanceEventId, inventoryItemId, maintenanceType]
    audit: true
  - name: MaintenanceScheduled
    description: A maintenance event started, taking the equipment out of service.
    payload: [maintenanceEventId, inventoryItemId]
    audit: true
  - name: MaintenanceCompleted
    description: A maintenance event finished, returning the equipment to availability.
    payload: [maintenanceEventId, inventoryItemId, downtimeMinutes]
    audit: true

integration_events:
  published:
    - name: MaintenanceScheduled
      description: Signals BCM-QLT-004 Equipment Management to transition availabilityStatus to out_of_service.
      consumers: [inventory-procurement]
    - name: MaintenanceCompleted
      description: Signals BCM-QLT-004 Equipment Management to transition availabilityStatus back to available.
      consumers: [inventory-procurement]
  consumed: []

published_language: []
