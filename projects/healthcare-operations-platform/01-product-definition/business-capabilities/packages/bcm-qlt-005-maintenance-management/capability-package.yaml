capability:
  id: BCM-QLT-005
  name:
    en: Maintenance Management
    es: Mantenimiento
  domain: DOM-09 Quality
  priority: High
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001; maintenanceRecord delegated to this capability)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Records preventive and corrective maintenance events for equipment-classified InventoryItem
    records, including downtime and next-scheduled-maintenance tracking. Holds delegated,
    field-scoped mutation authority over InventoryItem.maintenanceRecord only. Publishes
    MaintenanceScheduled and MaintenanceCompleted for BCM-QLT-004 Equipment Management to react to
    (out_of_service during the maintenance window, back to available on completion) rather than
    writing equipmentProfile itself.
  in_scope:
    - "Maintenance event recording: maintenanceType, description, downtimeMinutes, nextScheduledAt."
    - Maintenance due-date monitoring.
  out_of_scope:
    - InventoryItem creation and core identity fields (BCM-INV-001).
    - equipmentProfile mutation (BCM-QLT-004).
    - Calibration event recording (BCM-QLT-003).

roadmap:
  module: COM-MOD-010
  release: REL-002
  package_status: modeled
  next_backlog_item: COM-MOD-010-CLOSEOUT
  paused_functional_backlog_item: null

