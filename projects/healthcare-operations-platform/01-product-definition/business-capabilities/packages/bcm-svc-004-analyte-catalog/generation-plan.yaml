artifact:
  id: HOP-GEN-BCM-SVC-004
  type: generation-plan
  name: Analyte Catalog Generation Plan
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-004
  compiler_strategy: model_to_platform

generated_outputs:
  backend:
    - CRUD scaffolding for AnalyteDefinition, AnalyteResultConstraint, AnalyteCodedValue
    - DTOs
    - Controllers for generatable operations
    - Repository interfaces and baseline persistence adapters
    - Domain skeleton for analyte projection on TestDefinition context
    - API adapters
  frontend:
    - Employee portal list and editor components (SCR-SVC-004-01, SCR-SVC-004-02)
    - Routes
    - Forms
    - Client SDK usage
  contracts:
    - Rendered OpenAPI document from openapi-source.yaml
    - Typed SDK
    - Swagger documentation
  tests:
    - Repetitive unit tests for RN-001, RN-002, RN-003, RN-005, RN-007
    - Contract tests
    - Acceptance test skeletons
  operations:
    - Metric and log wiring from observability-model.yaml
    - Dashboard definition skeleton
    - Alert definition for HighAnalytePublishFailureRate

custom_implementation_points:
  - id: CUS-SVC-004-01
    description: Immutable versioning and snapshot freeze on edit (RN-004).
    maps_to_backlog: MVP-MOD-002-BE-002
  - id: CUS-SVC-004-02
    description: Data type change ripple review across dependent tests and ranges (RN-006).
    maps_to_backlog: MVP-MOD-002-BE-002
  - id: CUS-SVC-004-03
    description: Published analyte snapshot projection endpoint for result capture and ranges.
    maps_to_backlog: MVP-MOD-002-BE-002

do_not_write_manually:
  - CRUD scaffolding
  - DTOs
  - Controllers
  - Repositories
  - Swagger documentation
  - SDKs
  - Repetitive documentation
  - Repetitive test cases

provenance:
  source_models:
    - business-model.yaml
    - business-rules.yaml
    - processes.yaml
    - events.yaml
    - openapi-source.yaml
    - ui-model.yaml
    - permissions.yaml
    - observability-model.yaml
  generation_metadata_required: true
