artifact:
  id: HOP-TEST-BCM-SVC-004
  type: test-model
  name: Analyte Catalog Test Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-SVC-004

test_cases:
  - id: TST-SVC-004-01
    type: unit
    validates_rule: RN-001
    statement: Reject duplicate analyte code within a laboratory.
    generatable: true
  - id: TST-SVC-004-02
    type: unit
    validates_rule: RN-002
    statement: Reject numeric analyte without unit or precision.
    generatable: true
  - id: TST-SVC-004-03
    type: unit
    validates_rule: RN-003
    statement: Reject publishing a coded analyte without coded values.
    generatable: true
  - id: TST-SVC-004-04
    type: regression
    validates_rule: RN-004
    statement: Editing a published analyte creates a new draft and preserves the frozen version.
    generatable: false
  - id: TST-SVC-004-05
    type: unit
    validates_rule: RN-005
    statement: Reject constraint where min exceeds max.
    generatable: true
  - id: TST-SVC-004-06
    type: acceptance
    validates_rule: RN-006
    statement: Data type change on a published analyte forces new version and flags dependents.
    generatable: false
  - id: TST-SVC-004-07
    type: contract
    validates_rule: RN-007
    statement: Unauthorized users cannot create, update or publish analytes.
    generatable: true

test_layers: [contract_tests, unit_tests, acceptance_tests, regression_tests]

generation_policy:
  repetitive_tests: generated
  custom_rule_tests: [TST-SVC-004-04, TST-SVC-004-06]
