artifact:
  id: HOP-BR-BCM-RES-006
  type: business-rules
  name: Critical Results Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-RES-006
  rule_id_pattern: "RN-###"

rules:
  - id: RN-001
    statement: A CriticalResultEscalation must be created for every ResultFlaggedCritical event without exception; there is no configuration or tenant policy that suppresses escalation-record creation.
    applies_to: CriticalResultEscalation
    enforcement_point: event:ResultFlaggedCritical
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Mandatory, unconditional creation is a patient-safety compliance rule, not a configurable business option.
    brm_alignment: BRM-001-R013
    test_refs: [TST-CRR-006-01]
  - id: RN-002
    statement: An escalation not acknowledged by its deadline must automatically advance to the next escalationTier and trigger a new notification request through BCM-RES-007.
    applies_to: CriticalResultEscalation
    enforcement_point: command:EscalateCriticalResult
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Deadline-driven tier progression and cross-capability re-notification triggering are custom workflow logic.
    test_refs: [TST-CRR-006-02]
  - id: RN-003
    statement: An escalation can be closed only after both acknowledgedBy and acknowledgedAt are recorded; a close attempt without acknowledgement is refused.
    applies_to: CriticalResultEscalation
    enforcement_point: command:AcknowledgeCriticalResult
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Terminal-state guard requiring both fields present, not a generic status transition.
    test_refs: [TST-CRR-006-03]
  - id: RN-004
    statement: This capability never mutates LaboratoryResult state, including the criticalFlag field; it only reads the ResultFlaggedCritical event and writes its own CriticalResultEscalation entity.
    applies_to: CriticalResultEscalation
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Cross-capability boundary enforcement consistent with AGG-009's ownership rules declared by BCM-LAB-006/BCM-LAB-008.
    test_refs: [TST-CRR-006-04]
  - id: RN-005
    statement: Escalation commands must execute within the actor's tenant and laboratory scope.
    applies_to: CriticalResultEscalation
    enforcement_point: authorization:escalation.manage, authorization:escalation.read
    severity: critical
    audit_required: true
    generatable: true
    test_refs: [TST-CRR-006-05]
  - id: RN-006
    statement: Escalation lifecycle events must include actor identity (or system trigger), result reference and escalation tier.
    applies_to: CriticalResultEscalation
    enforcement_point: event:CriticalResultEscalated, event:CriticalResultAcknowledged
    severity: high
    audit_required: true
    generatable: true
    test_refs: [TST-CRR-006-06]

enforcement_summary:
  generatable_rules: [RN-005, RN-006]
  custom_implementation_rules: [RN-001, RN-002, RN-003, RN-004]
