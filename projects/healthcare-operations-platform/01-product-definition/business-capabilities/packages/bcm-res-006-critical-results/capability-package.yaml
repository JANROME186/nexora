capability:
  id: BCM-RES-006
  name:
    en: Critical Results
    es: Resultados Críticos
  domain: DOM-07 Results
  priority: Critical
  roadmap: MVP1
  dependency_profile: results_delivery
  bounded_context: laboratory-results
  primary_aggregate: CriticalResultEscalation (new entity owned by this capability; LaboratoryResult AGG-009 is read-only)
  process_ref: HRP-001-P06

scope:
  summary: >
    Tracks the traceable escalation and acknowledgement lifecycle for every result flagged critical
    by BCM-LAB-008: escalation record creation, assignment to a responsible clinician, an
    acknowledgement deadline, and closure once the critical value has been acted upon. This is the
    "traceable notification or escalation record" that BRM-001-R013 requires — distinct from the
    notification message itself (BCM-RES-007) and from the technical act of flagging (BCM-LAB-008).
    Never mutates LaboratoryResult.
  in_scope:
    - CriticalResultEscalation entity: assigned handler, acknowledgement deadline, acknowledgement status, escalation tier.
    - Escalation-tier progression when acknowledgement is not recorded within the deadline (e.g. notify a supervising clinician).
    - Internal worklist of open critical-result escalations for clinical staff.
  out_of_scope:
    - LaboratoryResult aggregate ownership and the critical flag itself (BCM-LAB-006, BCM-LAB-008).
    - Notification message composition and dispatch (BCM-RES-007, BCM-PLT-003).
    - Patient/doctor delivery of the underlying result (BCM-RES-004).

roadmap:
  module: MVP-MOD-007
  release: REL-001
  package_status: modeled
  next_backlog_item: MVP-MOD-007-PORTAL-001

