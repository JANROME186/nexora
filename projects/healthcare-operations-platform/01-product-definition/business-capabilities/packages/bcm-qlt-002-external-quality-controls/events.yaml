artifact:
  id: HOP-EVT-BCM-QLT-002
  type: events
  name: External Quality Controls Domain Events
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-QLT-002

events:
  - id: EVT-EQC-001
    name: ExternalQualitySurveyReceived
    description: Emitted when a new EQA survey round is registered.
    payload:
      - name: evaluationId
        type: uuid
      - name: tenantId
        type: string
      - name: providerName
        type: string
      - name: surveyCycle
        type: string
      - name: registeredAt
        type: datetime

  - id: EVT-EQC-002
    name: ExternalQualityEvaluationRecorded
    description: Emitted when provider evaluation scoring and rating are recorded.
    payload:
      - name: evaluationId
        type: uuid
      - name: tenantId
        type: string
      - name: zScore
        type: decimal
      - name: performanceRating
        type: string
      - name: evaluatedAt
        type: datetime

  - id: EVT-EQC-003
    name: ExternalQualityOutOfRangeDetected
    description: Emitted when an EQA evaluation result is unacceptable, triggering CAPA investigation.
    payload:
      - name: evaluationId
        type: uuid
      - name: tenantId
        type: string
      - name: laboratoryId
        type: string
      - name: testDefinitionId
        type: uuid
      - name: zScore
        type: decimal
      - name: detectedAt
        type: datetime
