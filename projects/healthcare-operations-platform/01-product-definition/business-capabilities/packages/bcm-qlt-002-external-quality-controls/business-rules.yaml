artifact:
  id: HOP-BR-BCM-QLT-002
  type: business-rules
  name: External Quality Controls Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-QLT-002

rules:
  - id: RN-EQC-001
    name: Mandatory Survey Registration Before Measurement
    description: Sample measurement values cannot be entered without an active, registered survey cycle.
    enforcement: synchronous
    error_code: EQC_SURVEY_NOT_REGISTERED
    message:
      en: Survey cycle must be registered before sample measurements can be recorded.
      es: El ciclo de evaluación externa debe estar registrado antes de capturar resultados.

  - id: RN-EQC-002
    name: Automatic Z-Score Calculation
    description: >
      When peer group mean and SD are supplied by provider, z-score must be calculated as
      (measuredValue - peerGroupMean) / peerGroupSd.
    enforcement: automatic
    error_code: EQC_CALCULATION_INVALID
    message:
      en: Peer group standard deviation must be non-zero to calculate z-score.
      es: La desviación estándar del grupo de pares debe ser mayor a cero para calcular el z-score.

  - id: RN-EQC-003
    name: Out-of-Range Threshold Classification
    description: >
      Evaluations with |z| <= 2.0 are classified as acceptable.
      Evaluations with 2.0 < |z| <= 3.0 are classified as warning.
      Evaluations with |z| > 3.0 or provider-declared failure are classified as unacceptable.
    enforcement: synchronous
    error_code: EQC_CLASSIFICATION_FAILED
    message:
      en: Evaluation rating classification failed.
      es: La clasificación del resultado de evaluación externa falló.

  - id: RN-EQC-004
    name: Mandatory CAPA Trigger for Unacceptable Evaluation
    description: Any evaluation resulting in 'unacceptable' rating must automatically create a CAPA investigation in BCM-QLT-006.
    enforcement: event_driven
    error_code: EQC_CAPA_TRIGGER_FAILED
    message:
      en: Failed to trigger CAPA investigation for unacceptable external quality evaluation.
      es: Error al activar la investigación CAPA para la evaluación externa no aceptable.

  - id: RN-EQC-005
    name: Provider Report Retention Policy
    description: External provider PDF evaluation reports must be attached and stored with a minimum retention of 5 years via BCM-PLT-008.
    enforcement: synchronous
    error_code: EQC_DOCUMENT_REQUIRED
    message:
      en: Provider evaluation report document is required for final closure of evaluation.
      es: Se requiere adjuntar el informe del proveedor para el cierre definitivo de la evaluación.
