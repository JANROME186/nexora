artifact:
  id: HOP-PRC-BCM-QLT-002
  type: processes
  name: External Quality Controls Processes
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-QLT-002

processes:
  - id: PRC-EQC-001
    name: Register EQA Survey Round
    description: Quality coordinator registers a new external quality assessment survey round from a provider.
    steps:
      - step_number: 1
        name: Enter Survey Details
        actor: Quality Coordinator
        action: Submit provider name, program code, survey cycle, sample identifiers, and submission deadline.
      - step_number: 2
        name: Validate Test Mapping
        actor: System
        action: Verify that target analyte/test maps to active catalog TestDefinition (BCM-SVC-002).
      - step_number: 3
        name: Create Pending Evaluation Entries
        actor: System
        action: Create ExternalQualityEvaluation record in pending_evaluation state.

  - id: PRC-EQC-002
    name: Record Survey Measurement Results
    description: Lab technician enters measurement result for EQA sample.
    steps:
      - step_number: 1
        name: Enter Result Value
        actor: Laboratory Analyst
        action: Enter measured value for sample code before submission deadline.
      - step_number: 2
        name: Confirm Submission
        actor: Quality Coordinator
        action: Review and mark survey submission as sent to provider.

  - id: PRC-EQC-003
    name: Process Provider Evaluation Report
    description: Record provider scoring results, peer statistics, and handle out-of-range outcomes.
    steps:
      - step_number: 1
        name: Input Peer Group Results
        actor: Quality Coordinator
        action: Enter peer group mean, SD, count, and attach provider evaluation PDF.
      - step_number: 2
        name: Compute Metrics & Rating
        actor: System
        action: Calculate z-score/SDDI and assign rating (acceptable, warning, unacceptable).
      - step_number: 3
        name: Handle Unacceptable Outcome
        actor: System
        action: >
          If rating is unacceptable, emit ExternalQualityOutOfRangeDetected event to trigger CAPA (BCM-QLT-006)
          and log audit entry in BCM-PLT-007.
