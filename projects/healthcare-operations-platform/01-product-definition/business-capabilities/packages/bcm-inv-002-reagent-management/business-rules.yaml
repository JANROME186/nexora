artifact:
  id: HOP-BR-BCM-INV-002
  type: business-rules
  name: Reagent Management Business Rules
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-002
  rule_id_pattern: "RN-###"

rules:
  - id: RN-001
    statement: A ReagentProfileAssignment may only target an InventoryItem whose itemType is reagent or consumable.
    applies_to: ReagentProfileAssignment
    enforcement_point: command:AssignReagentProfile
    severity: high
    audit_required: true
    generatable: false
    custom_reason: Requires reading InventoryItem.itemType owned by a sibling capability before assignment.
    test_refs: [TST-RGT-002-01]
  - id: RN-002
    statement: consumptionUnitRatio must be strictly greater than zero.
    applies_to: ReagentProfileAssignment
    enforcement_point: command:AssignReagentProfile
    severity: high
    audit_required: true
    generatable: true
    test_refs: [TST-RGT-002-02]
  - id: RN-003
    statement: Only BCM-INV-002 may write InventoryItem.reagentProfile; this capability never mutates any other InventoryItem field.
    applies_to: InventoryItem
    enforcement_point: architecture_boundary
    severity: critical
    audit_required: true
    generatable: false
    custom_reason: Enforces the delegated field-mutation boundary shared across COM-MOD-010.
    test_refs: [TST-RGT-002-03]
  - id: RN-004
    statement: Reagent management commands must execute within the actor's tenant, laboratory and branch scope.
    applies_to: ReagentProfileAssignment
    enforcement_point: "authorization:inventory.reagent.manage, authorization:inventory.reagent.read"
    severity: critical
    audit_required: true
    generatable: true
    test_refs: [TST-RGT-002-04]

enforcement_summary:
  generatable_rules: [RN-002, RN-004]
  custom_implementation_rules: [RN-001, RN-003]
