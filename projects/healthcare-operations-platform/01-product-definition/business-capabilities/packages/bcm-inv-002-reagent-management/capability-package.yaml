capability:
  id: BCM-INV-002
  name:
    en: Reagent Management
    es: Reactivos
  domain: DOM-08 Inventory
  priority: Critical
  roadmap: MVP2
  dependency_profile: inventory_quality
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001; reagentProfile delegated)
  process_ref: not_yet_defined_in_HRP-001

scope:
  summary: >
    Classifies reagent- and consumable-type InventoryItem records with their diagnostic test
    linkage and consumption ratio, so that BCM-INV-007 Consumption Tracking can automatically
    decrement stock when a linked test is performed. Holds delegated, field-scoped mutation
    authority over InventoryItem.reagentProfile only; never creates or deletes an InventoryItem,
    never touches stockSummary or any other delegated field.
  in_scope:
    - "ReagentProfile assignment: reagentCategory, consumptionUnitRatio, linkedTestDefinitionId."
    - Read-only validation of linkedTestDefinitionId against BCM-SVC-002/BCM-SVC-004 published TestDefinition.
  out_of_scope:
    - InventoryItem creation and core identity fields (BCM-INV-001).
    - Stock lot, quantity or consumption event handling (BCM-INV-003/007).
    - TestDefinition mutation (read-only reference to catalog-test-configuration only).

roadmap:
  module: COM-MOD-010
  release: REL-002
  package_status: module_closed
  next_backlog_item: none (module closed; see COM-MOD-011-DEF for the next roadmap module)
  paused_functional_backlog_item: null

