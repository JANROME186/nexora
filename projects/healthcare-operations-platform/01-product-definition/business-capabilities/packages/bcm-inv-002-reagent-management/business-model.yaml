artifact:
  id: HOP-BM-BCM-INV-002
  type: business-model
  name: Reagent Management Business Model
  version: 0.1.0
  status: modeled
  classification: editable_model
  capability: BCM-INV-002
  bounded_context: inventory-procurement
  primary_aggregate: InventoryItem (AGG-013, owned by BCM-INV-001)
  model_kind: operational_process_over_shared_aggregate

entities:
  - id: ENT-RGT-001
    name: ReagentProfileAssignment
    is_aggregate_root: false
    described_as: process_record
    owned_by_aggregate: InventoryItem
    description: Process record capturing the reagent classification and test linkage applied to an InventoryItem.
    fields:
      - name: assignmentId
        type: uuid
        required: true
        identifier: true
      - name: inventoryItemId
        type: InventoryItemId
        required: true
      - name: tenantId
        type: TenantId
        required: true
      - name: branchId
        type: BranchId
        required: true
      - name: linkedTestDefinitionId
        type: uuid
        required: false
        description: Read-only reference to a published TestDefinition (BCM-SVC-002/BCM-SVC-004).
      - name: reagentCategory
        type: enum
        values: [calibrator, control, working_reagent, buffer, diluent, other]
        required: true
      - name: consumptionUnitRatio
        type: decimal
        required: true
        description: Units of this item consumed per performed test.
      - name: effectiveFrom
        type: date
        required: true
      - name: audit
        type: AuditMetadata
        required: true

value_objects: []

invariants:
  - id: INV-RGT-001
    statement: A ReagentProfileAssignment may only target an InventoryItem whose itemType is reagent or consumable.
  - id: INV-RGT-002
    statement: consumptionUnitRatio must be strictly greater than zero.
  - id: INV-RGT-003
    statement: Confirming a ReagentProfileAssignment is the only trigger allowed to invoke AssignReagentProfile on the InventoryItem aggregate; this capability never mutates any other InventoryItem field.
  - id: INV-RGT-004
    statement: linkedTestDefinitionId, when present, must resolve to a published TestDefinition at assignment time; it is captured as a read-only reference, never re-validated by live lookup on every consumption event.

external_references:
  - shared_kernel:
      - VO-ID-001 TenantId
      - VO-ID-003 BranchId
      - VO-007 AuditMetadata
  - capabilities:
      - BCM-INV-001 InventoryItem aggregate (delegated mutation target for reagentProfile)
      - BCM-SVC-002 Test Catalog / BCM-SVC-004 Analyte Catalog (read-only published TestDefinition)
      - BCM-INV-007 Consumption Tracking (downstream consumer of consumptionUnitRatio)
