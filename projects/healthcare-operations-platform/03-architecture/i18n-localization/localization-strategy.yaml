artifact:
  id: HOP-I18N-STRAT-001
  type: localization-strategy
  name: HOP Localization and Internationalization Strategy
  version: 1.0.0
  status: approved
  human_readable: localization-strategy.md
  machine_readable: localization-strategy.yaml
  owner: Nexora Product Architecture Team
  created_date: 2026-07-17
  source_backlog_item: HOP-ENT-FOUND-001

purpose: >
  Define the mandatory es-MX/en-US localization baseline for backend, employee-portal and
  mobile-app, the language-switch mechanism, and the remediation plan for text that could not be
  externalized in this iteration, per
  ../../../../nexora-framework/02-standards/standards/enterprise-product-foundation-standard.yaml
  (mandatory_foundations.localization_and_i18n).

required_base_locales:
  - es-MX
  - en-US
default_locale: es-MX
fallback_locale: en-US
locale_configuration_axes:
  - tenant_default_locale
  - user_selected_locale
  - fallback_locale

hardcoded_text_inventory:
  method: >
    Repository grep of user-visible strings across 07-implementation/backend (exception messages,
    validation prose), 07-implementation/employee-portal/src (JSX literals, src/i18n/messages.ts)
    and 07-implementation/mobile-app/src (screen-model validation strings, src/i18n/messages.ts),
    cross-referenced against the existing HOP-QA-ALIGN-005 inventory
    (08-qa/qa/quality-alignment/HOP-QA-ALIGN-005-message-externalization-inventory.yaml) which
    already classified backend/frontend/mobile literals as P0/P1/P2.
  backend:
    total_estimated_hardcoded_prose_strings: ~30 domain error/validation messages (per
      HOP-QA-ALIGN-005), concentrated in per-module *ApiErrorResponse / *NotFoundException /
      InvalidXCommandException prose.
    remediated_this_iteration:
      module: identityaccess
      mechanism: Spring MessageSource baseline (see backend_mechanism below) with es-MX default
        and en-US fallback resource bundles, applied to identityaccess validation/not-found
        messages and the new authorization-denied message.
      remaining_modules_not_yet_migrated:
        - auditcompliance
        - cashsales (billingrequestmanagement, cashieroperations)
        - catalogtestconfiguration (8 sub-modules)
        - documentmanagement
        - frontdeskcaredelivery (5 sub-modules)
        - laboratoryworkflow (orderssamples, laboratoryresults)
        - notificationmanagement
        - organizationmanagement
        - peopleclinicalmasterdata (4 sub-modules)
        - resultsanddigitaldelivery (4 sub-modules)
      disposition: >
        Registered as continued scope of TD-I18N-002 (materially reduced, not closed, by this
        backlog item). Each module migrates its exception/validation prose to the shared
        MessageSource + resource-bundle mechanism established here when that module is next
        touched by a code-changing backlog item, per the framework's gradual-remediation policy.
  frontend_employee_portal:
    total_estimated_inline_strings: >-
      ~130 (per HOP-QA-ALIGN-005 - 5 previously centralized as repeated/duplicated literals; ~125
      single-occurrence headings/labels/hints/confirmations remained inline JSX text prior to this
      iteration).
    remediated_this_iteration:
      mechanism: Locale-keyed catalog split (src/i18n/locales/es-MX.ts, src/i18n/locales/en-US.ts)
        with a LocaleContext/useLocale() React context, localStorage persistence, and a visible
        language-switch control in AppShell driving the header title/subtitle and all 27
        navigation tab labels end to end in both locales.
      remaining_scope_not_yet_migrated: The ~125 single-occurrence per-screen inline strings
        (headings, button labels, field hints, confirmation copy) across the 27 screen components
        remain inline pending incremental per-screen migration.
      disposition: Continued scope of TD-I18N-002 (materially reduced, not closed).
  mobile_app:
    total_estimated_strings: 9 validation-copy literals in screen "model" files (per
      HOP-QA-ALIGN-005; no renderable UI layer exists yet).
    remediated_this_iteration:
      mechanism: Same locale-keyed split pattern (src/i18n/locales/es-MX.ts, en-US.ts) applied to
        the existing flat catalog, with a plain getMessages(locale) function (no UI/React layer
        exists yet, so no visual language switch is applicable this iteration).
      disposition: Localization-resource mechanism is now locale-aware; a real UI/renderer stack
        selection remains TD-APP-001, and full localization-resource validation against that
        stack remains part of TD-I18N-002's mobile scope.

backend_mechanism:
  approach: Spring MessageSource / ResourceBundle
  bundle_base_name: classpath:i18n/messages
  files:
    - 07-implementation/backend/src/main/resources/i18n/messages.properties (default = es-MX
      content, since es-MX is the platform default locale)
    - 07-implementation/backend/src/main/resources/i18n/messages_es_MX.properties
    - 07-implementation/backend/src/main/resources/i18n/messages_en_US.properties
  configuration_class: com.nexora.hop.platformfoundation.sharedkernel.LocalizationConfig
  helper_class: com.nexora.hop.platformfoundation.sharedkernel.HopMessages
  current_limitation: >
    Locale is currently supplied explicitly by the caller (defaulting to es-MX) because the
    backend has no authenticated request context yet (no login/session mechanism exists — see
    session-management-baseline.yaml). Request-scoped Accept-Language / user-preferred-locale
    resolution is deferred until real backend authentication exists (tracked in
    session-management-baseline.yaml's implementation backlog).
  api_error_code_field: >
    The five *ApiErrorResponse shapes (CatalogApiErrorResponse, FrontDeskApiErrorResponse,
    IdentityAccess/OrganizationManagement ApiErrorResponse, PeopleApiErrorResponse) do not yet
    carry a first-class `code` field independent of the resolved message text; adding it remains
    TD-I18N-002 scope, coordinated with each capability's openapi-source.yaml error_model.

frontend_mechanism:
  approach: Homegrown locale-keyed TypeScript catalogs (not a third-party i18n library in this
    iteration; react-i18next/FormatJS adoption remains evaluated and deferred, see below)
  library_evaluation:
    considered: [react-i18next, "@formatjs/intl (FormatJS)"]
    decision: not_adopted_this_iteration
    reason: >
      Both are mature, actively maintained, MIT-licensed open source options and remain the
      recommended target for full-catalog adoption (ICU message format, pluralization, number/date
      formatting). Introducing either as a new runtime dependency was judged unnecessary to
      establish the required es-MX/en-US mechanism for this foundation-alignment iteration, since a
      typed, dependency-free TypeScript catalog + React context satisfies the standard's
      `frontend_required_patterns` (locale_message_catalogs, no_hard_coded_visible_text_in_new_
      components, typed_message_keys_when_supported) without adding bundle size or a migration
      surface during an iteration that must not touch the 27 existing screens' business logic.
    trigger_to_revisit: When TD-I18N-002's remaining ~125-string per-screen migration is scheduled,
      or when pluralization/date/currency formatting needs (relevant once MXN/USD amounts and
      es-MX/en-US date formats are surfaced per-locale) exceed what a flat key-value catalog can
      express cleanly.
  files:
    - 07-implementation/employee-portal/src/i18n/locales/es-MX.ts
    - 07-implementation/employee-portal/src/i18n/locales/en-US.ts
    - 07-implementation/employee-portal/src/i18n/LocaleContext.tsx
  language_switch_mechanism:
    ui: Visible ES/EN control in AppShell header.
    persistence: localStorage key hop.locale, falling back to en-US if a stored value is invalid,
      defaulting to es-MX otherwise.
    scope_demonstrated: AppShell header title/subtitle and the 27 navigation tab labels render from
      the active locale end to end.

mobile_mechanism:
  approach: Same locale-keyed catalog split, no UI layer yet (mobile-app has no renderer).
  files:
    - 07-implementation/mobile-app/src/i18n/locales/es-MX.ts
    - 07-implementation/mobile-app/src/i18n/locales/en-US.ts
    - 07-implementation/mobile-app/src/i18n/locale.ts (getMessages(locale), default es-MX)
  language_switch_mechanism: not_applicable_yet_no_ui_renderer
  revisit_trigger: TD-APP-001 renderer-stack selection.

closure_gate_compliance: >
  New/changed user-visible text introduced by this backlog item's own code changes (AppShell
  header/tabs, the language-switch control itself, new backend authorization-denied and
  identityaccess validation messages) is externalized in both es-MX and en-US. Pre-existing
  hardcoded text not touched by this iteration is registered as continued TD-I18N-002 scope with an
  explicit remaining-module/remaining-screen inventory above, per the standard's closure_gate text:
  "New or changed UI/app/backend visible text cannot close unless it is externalized in both es-MX
  and en-US or registered as blocking remediation in the active foundation backlog."

technical_debt_disposition:
  item: TD-I18N-002
  action: materially_reduced
  remaining_scope: See remaining_modules_not_yet_migrated / remaining_scope_not_yet_migrated above.
  status_after_this_iteration: open (materially reduced, not closed)

validations:
  - Backend messages.properties/_es_MX/_en_US resolve distinct text per locale (HopMessagesTest).
  - Frontend LocaleContext switch changes rendered AppShell text and persists via localStorage
    (LocaleContext test).
  - No new hardcoded visible text was introduced by this backlog item outside the catalogs above
    (spot-checked in the code-review pass described in HOP-ENT-FOUND-001-validation.md).
