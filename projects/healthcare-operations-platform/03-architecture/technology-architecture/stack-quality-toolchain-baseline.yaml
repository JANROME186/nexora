        latest_result: 124_findings
        required_action: reduce_findings_gradually_under_TD-BE-002
      - category: Duplication
        tool: PMD CPD
        status: configured_passing
        evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-002-validation.yaml
        latest_result: 0_duplications
        required_action: keep_in_backend_quality_profile
      - category: Duplicate dependencies and classes
        tool: Duplicate Finder Maven Plugin
        status: configured_passing
        evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-002-validation.yaml
        required_action: keep_in_backend_quality_profile
      - category: Coverage
        tool: JaCoCo
        status: configured_below_target
        evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-002-validation.yaml
        latest_result: 77.92_line_coverage
        required_action: raise_to_80_percent_under_TD-BE-003_without_dropping_below_77_92
      - category: Dependency vulnerabilities
        tool: OWASP Dependency-Check
        status: configured_passing
        evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-004-validation.yaml
        latest_result: 0_vulnerabilities
        required_action: keep_nvd_kev_scan_active_all_severities_using_manual_daily_database_refresh
        local_database_policy:
          data_directory: C:/Documents/Proyectos/Laboratorio/dependency-check-data
          auto_update_during_backlog_execution: false
          manual_refresh_frequency: once_per_day
          responsible_party: project_operator_or_security_reviewer
          agent_responsibility: >-
            Execute OWASP Dependency-Check against the locally available database and record the
            database path plus freshness timestamp/date in security-quality evidence. Do not
            download or refresh the NVD database during ordinary backlog execution unless a backlog
            explicitly assigns that operational task.
      - category: Containers, filesystem and secrets
        tool: Trivy
        status: configured_passing_all_severities
        evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-004-validation.yaml
        latest_result: 0_vulnerabilities_0_secrets_0_misconfigurations
        required_action: run_without_severity_filter_for_backlog_closure
      - category: SBOM
        tool: CycloneDX Maven Plugin
        status: configured
        evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-002-validation.yaml
        required_action: enforce_release_sbom_publication_before_ga
      - category: Build rules
        tool: Maven Enforcer
        status: configured
        required_action: keep_java_maven_and_dependency_rules_current
      - category: Dependency currency
        tool: Maven Versions Plugin
        status: configured
        required_action: use_during_stack_evolution_review_or_register_debt
      - category: Licenses
        tool: License Maven Plugin or License Checker
        status: configured
        required_action: harden_release_license_policy_before_ga
      - category: Advanced tests
        tool: PIT or Pitest
        status: configured_not_strict
        required_action: apply_to_core_domain_or_high_risk_modules
      - category: Architecture
        tool: ArchUnit
        status: partially_covered_by_spring_modulith_tests
        required_action: evaluate_archunit_for_explicit_layer_and_package_rules
      - category: Refactor and technical debt
        tool: OpenRewrite
        status: deferred
        required_action: use_for_future_modernization_debt_or_framework_migrations
        debt_item: TD-STACK-001
      - category: API compatibility
        tool: Revapi
        status: configured_skipped_until_public_java_api_exists
        required_action: evaluate_when_public_java_api_or_sdk_changes
      - category: Compiler static analysis
        tool: Google Error Prone
        status: not_yet_configured
        required_action: evaluate_compatibility_with_current_jdk_and_maven_build
        debt_item: TD-BE-002
      - category: Additional SAST
        tool: Semgrep CE
        status: not_yet_configured
        required_action: evaluate_for_ci_defense_in_depth
        debt_item: TD-BE-002
