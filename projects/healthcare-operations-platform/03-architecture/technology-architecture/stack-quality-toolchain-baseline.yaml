artifact:
  id: HOP-STACK-QUALITY-TOOLCHAIN-001
  type: stack-quality-toolchain-baseline
  name: HOP Stack Quality Toolchain Baseline
  version: 1.2.2
  status: active_with_mandatory_debt_first_remediation
  created_date: 2026-07-09
  last_refreshed_date: 2026-07-15
  standard: ../../../../nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml

selected_stack_reference: 03-architecture/technology-architecture/client-stack-market-validation.yaml

missing_required_tooling_policy:
  effective_from_backlog_item: COM-MOD-013-FE-001
  rule: >-
    If a required validation category applies to a changed HOP stack but the stack lacks an
    executable script, plugin or tool configuration, the executing agent must create or update
    technical debt before backlog closure. Missing duplicate-code, complexity, SAST/static
    analysis, OWASP/secure-code, dependency, secrets, coverage, i18n, accessibility, DAST, SBOM
    or license tooling must not be documented as merely "if configured" or "not applicable" when
    the product surface exists.
  valid_not_applicable_boundary: >-
    not_applicable_with_reason is valid only when the surface, runtime or artifact type genuinely
    does not exist or was not touched by the backlog item.
  required_evidence_disposition_values:
    - passed
    - failed
    - blocked_by_environment
    - ready_for_external_validation
    - technical_debt_registered_with_blocking_decision
    - not_applicable_with_reason_for_absent_or_untouched_surface_only

