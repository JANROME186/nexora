artifact:
  id: HOP-STACK-QUALITY-TOOLCHAIN-001
  type: stack-quality-toolchain-baseline
  name: HOP Stack Quality Toolchain Baseline
  version: 1.0.0
  status: active_with_mandatory_debt_first_remediation
  created_date: 2026-07-09
  last_refreshed_date: 2026-07-09
  standard: ../../../../nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml

selected_stack_reference: 03-architecture/technology-architecture/client-stack-market-validation.yaml

toolchain_by_stack:
  java_maven:
    applicable: true
    component: 07-implementation/backend
    tools:
      - category: Quality and bugs
        tool: SpotBugs
        status: not_yet_configured
        required_action: evaluate_and_add_or_register_debt_during_backend_quality_hardening
      - category: Code security
        tool: Find Security Bugs
        status: not_yet_configured
        required_action: evaluate_and_add_or_register_debt_during_backend_quality_hardening
      - category: Style
        tool: Checkstyle
        status: not_yet_configured
        required_action: define_team_rules_before_ga
      - category: Static analysis
        tool: PMD
        status: not_yet_configured
        required_action: evaluate_and_add_or_register_debt_during_backend_quality_hardening
      - category: Duplication
        tool: PMD CPD
        status: not_yet_configured
        required_action: run_before_module_or_release_closeout_when_codebase_is_large_enough
      - category: Coverage
        tool: JaCoCo
        status: not_yet_configured
        required_action: add_backend_coverage_gate
      - category: Dependency vulnerabilities
        tool: OWASP Dependency-Check
        status: not_yet_configured
        required_action: add_or_document_alternative_dependency_scan_all_severities
      - category: Containers, filesystem and secrets
        tool: Trivy
        status: configured_manually
        evidence: 08-qa/security-quality/MVP-MOD-002-QA-001/security-quality-evidence.yaml
        required_action: run_without_severity_filter_for_backlog_closure
      - category: SBOM
        tool: CycloneDX Maven Plugin
        status: not_yet_configured
        required_action: add_before_release_readiness
      - category: Build rules
        tool: Maven Enforcer
        status: not_yet_configured
        required_action: add_java_maven_version_and_dependency_rules
      - category: Licenses
        tool: License Maven Plugin
        status: not_yet_configured
        required_action: add_or_document_license_review_process
      - category: Advanced tests
        tool: PIT or Pitest
        status: deferred
        required_action: apply_to_core_domain_or_high_risk_modules
      - category: Architecture
        tool: ArchUnit
        status: partially_covered_by_spring_modulith_tests
        required_action: evaluate_archunit_for_explicit_layer_and_package_rules
      - category: Refactor and technical debt
        tool: OpenRewrite
        status: deferred
        required_action: use_for_future_modernization_debt_or_framework_migrations
      - category: Additional SAST
        tool: Semgrep CE
        status: not_yet_configured
        required_action: evaluate_for_ci_defense_in_depth
  typescript_web:
    applicable: true
    component: 07-implementation/employee-portal
    configured_tools:
      - TypeScript strict project check
      - Vitest
      - V8 coverage provider
      - npm audit
      - Trivy filesystem scan
    gaps_to_evaluate:
      - ESLint
      - Semgrep CE
      - duplicate-code detector such as jscpd
      - complexity rules such as ESLint complexity or sonarjs cognitive-complexity
      - frontend DAST with OWASP ZAP when runnable surface is available
      - SBOM generation
      - license review automation
      - localization/i18n literal scan for user-visible strings
  mobile_typescript:
    applicable: true
    component: 07-implementation/mobile-app
    status: foundation_only
    gaps_to_evaluate:
      - final mobile renderer stack before native UI implementation
      - mobile test and coverage gate
      - dependency and license scans
      - duplicate-code and complexity analysis
      - secure-code analysis
      - localization resource validation

enterprise_quality_gate_policy:
  effective_from_next_code_changing_backlog: true
  debt_first_required: true
  all_severity_vulnerability_scans_required: true
  message_externalization_required: true
  required_per_changed_stack:
    - best_practices
    - coding_standards
    - duplicate_code
    - complexity
    - owasp_or_secure_code
    - dependency_vulnerabilities_all_severities
    - secrets
    - coverage
    - message_externalization_and_i18n
  closure_blockers:
    - no_existing_technical_debt_item_resolved_or_materially_reduced_when_open_debt_exists
    - vulnerability_scan_filtered_only_to_high_or_critical
    - missing_duplicate_code_or_complexity_analysis
    - missing_owasp_or_secure_code_analysis
    - unexternalized_user_visible_messages_error_prose_or_magic_strings
  next_iteration_debt_candidates:
    - TD-BE-002
    - TD-BE-003
    - TD-BE-004
    - TD-QA-001
    - TD-FE-002

mvp_mod_002_closeout_disposition:
  performed_during: MVP-MOD-002-CLOSEOUT
  performed_on: 2026-07-09
  mandatory_now:
    description: Gates required and executed for this module closeout.
    tools:
      - Backend Maven test suite (JUnit) - passed 42/0/0 (standard) and 42/0/0 (PostgreSQL-backed).
      - Trivy filesystem scan (vuln, secret, misconfig) - passed 0 HIGH/CRITICAL.
      - Frontend TypeScript strict check, Vitest coverage, production build and npm audit - passed.
  already_covered:
    description: Categories already satisfied by existing tooling.
    tools:
      - Dependency vulnerability + secrets + misconfiguration - Trivy (backend and frontend) and npm audit.
      - Architecture rules - partially covered by Spring Modulith structure verification (ArchUnit available transitively).
      - Frontend coverage - Vitest V8 provider (68.7% lines).
  not_applicable_now:
    description: Categories deferred with documented reason.
    tools:
      - Full automated DAST - OWASP ZAP unavailable locally; manual integrated HTTP smoke passed (TD-QA-001).
      - PIT/Pitest mutation testing - reserved for core-domain/high-risk hardening.
      - OpenRewrite - reserved for future modernization or framework migration.
  registered_as_gradual_debt:
    description: Active gaps routed to the technical-debt backlog. At least one open item must be resolved or materially reduced before every code-changing backlog item.
    items:
      - id: TD-BE-002
        tools: [SpotBugs, Find Security Bugs, PMD, PMD CPD, Checkstyle, Semgrep CE]
      - id: TD-BE-003
        tools: [JaCoCo backend coverage]
      - id: TD-BE-004
        tools: [CycloneDX Maven Plugin, Maven Enforcer, License Maven Plugin, OWASP Dependency-Check]
      - id: TD-STACK-001
        tools: [major framework and runtime upgrades]

technical_debt_items_created_or_updated:
  - id: TD-QA-001
    reason: DAST automation gap.
  - id: TD-QA-002
    reason: Trivy scanner version upgrade (0.69.2 available -> 0.72.0).
  - id: TD-BE-001
    reason: Mockito Java agent future compatibility.
  - id: TD-BE-002
    reason: Backend Java/Maven static analysis and SAST toolchain gap.
  - id: TD-BE-003
    reason: Backend test coverage measurement gate (JaCoCo) gap.
  - id: TD-BE-004
    reason: Backend release readiness supply-chain gates (SBOM, license, enforcer) gap.
  - id: TD-STACK-001
    reason: Gradual major framework/runtime modernization roadmap.

next_actions:
  - Add backend static analysis and SAST (TD-BE-002) during the next backend-touching iteration or earlier.
  - Add backend coverage gate (TD-BE-003) with JaCoCo during the next backend-touching iteration or earlier.
  - Add SBOM, license and build-rule gates (TD-BE-004) as incremental debt remediation, not only at release readiness.
  - Add automated DAST (TD-QA-001) as an active quality debt item; do not wait for release hardening when a runnable surface is available.
  - Revisit the stack modernization roadmap (TD-STACK-001) at each module closeout.

decision:
  mvp_mod_002_closeout_toolchain_review_completed: true
  ready_for_mvp_mod_002_closeout_execution: true
  ready_for_release_without_toolchain_gap_review: false
  ready_for_future_code_backlog_without_debt_first_action: false
