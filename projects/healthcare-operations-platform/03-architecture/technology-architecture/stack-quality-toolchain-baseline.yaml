enterprise_quality_gate_policy:
  effective_from_next_code_changing_backlog: true
  debt_first_required: true
  all_severity_vulnerability_scans_required: true
  message_externalization_required: true
  target_line_coverage_percent: 80
  previous_iteration_coverage_is_hard_floor: true
  final_project_closure_requires_no_open_technical_debt: true
  final_project_closure_requires_coverage_target: true
  required_per_changed_stack:
    - best_practices
    - coding_standards
    - duplicate_code
    - complexity
    - owasp_or_secure_code
    - dependency_vulnerabilities_all_severities
    - secrets
    - coverage
    - message_externalization_and_i18n
  closure_blockers:
    - no_existing_technical_debt_item_resolved_or_materially_reduced_when_open_debt_exists
    - coverage_decreases_below_previous_iteration_baseline
    - vulnerability_scan_filtered_only_to_high_or_critical
    - missing_duplicate_code_or_complexity_analysis
    - missing_owasp_or_secure_code_analysis
    - missing_required_validation_tooling_without_registered_technical_debt
    - unexternalized_user_visible_messages_error_prose_or_magic_strings
  next_iteration_debt_candidates:
    - TD-BE-002
    - TD-BE-003
    - TD-BE-004
    - TD-QA-001
    - TD-FE-002
    - new_or_updated_toolchain_debt_from_quality_toolchain_evolution_review
  current_coverage_baselines:
    backend_java_maven:
      current_line_coverage_percent: 77.92
      next_iteration_minimum_line_coverage_percent: 77.92
      final_closure_target_percent: 80
      tracked_by: TD-BE-003
    frontend_typescript_web:
      current_line_coverage_percent: 84.44
      next_iteration_minimum_line_coverage_percent: 84.44
      final_closure_target_percent: 80
      tracked_by: TD-FE-004
    mobile_typescript:
      current_line_coverage_percent: 97.15
      next_iteration_minimum_line_coverage_percent: 97.15
      final_closure_target_percent: 80
      tracked_by: TD-APP-002

mvp_mod_002_closeout_disposition:
  performed_during: MVP-MOD-002-CLOSEOUT
  performed_on: 2026-07-09
  mandatory_now:
    description: Gates required and executed for this module closeout.
    tools:
      - Backend Maven test suite (JUnit) - passed 42/0/0 (standard) and 42/0/0 (PostgreSQL-backed).
      - Historical Trivy filesystem scan (vuln, secret, misconfig) - passed with a HIGH/CRITICAL filter at the time; future closure requires all-severity scans.
      - Frontend TypeScript strict check, Vitest coverage, production build and npm audit - passed.
  already_covered:
    description: Categories already satisfied by existing tooling.
    tools:
      - Dependency vulnerability + secrets + misconfiguration - Trivy (backend and frontend) and npm audit.
      - Architecture rules - partially covered by Spring Modulith structure verification (ArchUnit available transitively).
      - Frontend coverage - Vitest V8 provider (68.7% lines).
  not_applicable_now:
    description: Categories deferred with documented reason.
    tools:
      - Full automated DAST - OWASP ZAP unavailable locally; manual integrated HTTP smoke passed (TD-QA-001).
      - PIT/Pitest mutation testing - reserved for core-domain/high-risk hardening.
      - OpenRewrite - reserved for future modernization or framework migration.
  registered_as_gradual_debt:
    description: Active gaps routed to the technical-debt backlog. At least one open item must be resolved or materially reduced before every code-changing backlog item.
    items:
      - id: TD-BE-002
        tools: [SpotBugs, Find Security Bugs, PMD, PMD CPD, Checkstyle, Spotless, Google Error Prone, Semgrep CE]
      - id: TD-BE-003
        tools: [JaCoCo backend coverage]
      - id: TD-BE-004
        tools: [CycloneDX Maven Plugin, Maven Enforcer, Maven Versions Plugin, License Maven Plugin or License Checker, OWASP Dependency-Check, Duplicate Finder Maven Plugin, Revapi]
      - id: TD-STACK-001
        tools: [major framework and runtime upgrades]

technical_debt_items_created_or_updated:
  - id: TD-QA-001
    reason: DAST automation gap.
  - id: TD-QA-002
    reason: Trivy scanner version upgrade (0.69.2 available -> 0.72.0).
  - id: TD-BE-001
    reason: Mockito Java agent future compatibility.
  - id: TD-BE-002
    reason: Backend Java/Maven static analysis and SAST toolchain gap.
  - id: TD-BE-003
    reason: Backend test coverage measurement gate (JaCoCo) gap.
  - id: TD-BE-004
    reason: Backend release readiness supply-chain gates (SBOM, license, enforcer) gap.
  - id: TD-STACK-001
    reason: Gradual major framework/runtime modernization roadmap.

next_actions:
  - Add backend static analysis and SAST (TD-BE-002) during the next backend-touching iteration or earlier.
  - Add backend coverage gate (TD-BE-003) with JaCoCo during the next backend-touching iteration or earlier.
  - Add SBOM, license and build-rule gates (TD-BE-004) as incremental debt remediation, not only at release readiness.
  - Add automated DAST (TD-QA-001) as an active quality debt item; do not wait for release hardening when a runnable surface is available.
  - Revisit the stack modernization roadmap (TD-STACK-001) at each module closeout.

