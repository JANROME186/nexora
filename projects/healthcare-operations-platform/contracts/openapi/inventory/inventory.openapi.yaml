openapi: 3.1.0
info:
  title: Nexora Inventory API
  version: 0.1.0
  description: Contract-first API for suppliers, inventory items, warehouses, stock movements, purchase orders, lots and inventory audits.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Suppliers
  - name: InventoryItems
  - name: Warehouses
  - name: Stock
  - name: Procurement
  - name: Lots
  - name: Audits
paths:
  /suppliers:
    get:
      tags: [Suppliers]
      summary: Search suppliers
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, suspended, archived] }
      responses:
        '200': { description: Supplier list }
    post:
      tags: [Suppliers]
      summary: Register supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupplierRequest' }
      responses:
        '201': { description: Supplier created }
  /inventory-items:
    get:
      tags: [InventoryItems]
      summary: Search inventory items
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: categoryId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Inventory item list }
    post:
      tags: [InventoryItems]
      summary: Create inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInventoryItemRequest' }
      responses:
        '201': { description: Inventory item created }
  /warehouses:
    get:
      tags: [Warehouses]
      summary: Search warehouses
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: branchId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Warehouse list }
    post:
      tags: [Warehouses]
      summary: Create warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWarehouseRequest' }
      responses:
        '201': { description: Warehouse created }
  /stock-balances:
    get:
      tags: [Stock]
      summary: Get stock balances
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: branchId
          in: query
          schema: { type: string }
        - name: warehouseId
          in: query
          schema: { type: string }
        - name: itemId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Stock balances }
  /stock-movements:
    post:
      tags: [Stock]
      summary: Post immutable stock movement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostStockMovementRequest' }
      responses:
        '201': { description: Stock movement posted }
    get:
      tags: [Stock]
      summary: Search stock movements
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: itemId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Stock movement list }
  /purchase-requests:
    post:
      tags: [Procurement]
      summary: Create purchase request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePurchaseRequest' }
      responses:
        '201': { description: Purchase request created }
  /purchase-orders:
    get:
      tags: [Procurement]
      summary: Search purchase orders
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200': { description: Purchase order list }
    post:
      tags: [Procurement]
      summary: Create purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePurchaseOrderRequest' }
      responses:
        '201': { description: Purchase order created }
  /goods-receipts:
    post:
      tags: [Procurement]
      summary: Receive goods
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGoodsReceiptRequest' }
      responses:
        '201': { description: Goods received }
  /lots:
    get:
      tags: [Lots]
      summary: Search lots
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: itemId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200': { description: Lot list }
  /reorder-alerts:
    get:
      tags: [Stock]
      summary: Get reorder alerts
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: branchId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Reorder alerts }
  /inventory-audits:
    post:
      tags: [Audits]
      summary: Start inventory audit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartInventoryAuditRequest' }
      responses:
        '201': { description: Inventory audit started }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: x-organization-id
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
  schemas:
    CreateSupplierRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        taxId: { type: string }
        status: { type: string, enum: [draft, active] }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/SupplierContactInput' }
    SupplierContactInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    CreateInventoryItemRequest:
      type: object
      required: [name, categoryId, unitOfMeasure]
      properties:
        name: { type: string }
        categoryId: { type: string }
        unitOfMeasure: { type: string }
        lotControlled: { type: boolean }
        expirationControlled: { type: boolean }
        restricted: { type: boolean }
    CreateWarehouseRequest:
      type: object
      required: [name, branchId]
      properties:
        name: { type: string }
        branchId: { type: string }
    PostStockMovementRequest:
      type: object
      required: [movementType, itemId, warehouseId, quantity, reason]
      properties:
        movementType: { type: string, enum: [receipt, consumption, adjustment, transfer, reservation, quarantine, disposal, reversal] }
        itemId: { type: string }
        warehouseId: { type: string }
        lotId: { type: string }
        quantity: { type: number }
        reason: { type: string }
        relatedOrderId: { type: string }
        relatedTestId: { type: string }
    CreatePurchaseRequest:
      type: object
      required: [branchId, lines]
      properties:
        branchId: { type: string }
        expectedDate: { type: string, format: date }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PurchaseLineInput' }
    CreatePurchaseOrderRequest:
      type: object
      required: [supplierId, branchId, lines]
      properties:
        supplierId: { type: string }
        branchId: { type: string }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PurchaseLineInput' }
    PurchaseLineInput:
      type: object
      required: [itemId, quantity]
      properties:
        itemId: { type: string }
        quantity: { type: number }
        unitCost: { type: number }
    CreateGoodsReceiptRequest:
      type: object
      required: [purchaseOrderId, warehouseId, lines]
      properties:
        purchaseOrderId: { type: string }
        warehouseId: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [itemId, quantity]
            properties:
              itemId: { type: string }
              quantity: { type: number }
              lotNumber: { type: string }
              expirationDate: { type: string, format: date }
    StartInventoryAuditRequest:
      type: object
      required: [warehouseId]
      properties:
        warehouseId: { type: string }
        categoryId: { type: string }
