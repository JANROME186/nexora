artifact:
  id: HOP-GOV-PRB-001
  type: operational-governance-specification
  name: HOP Problem Management & RCA Governance Specification
  version: 1.0.0
  status: approved
  human_readable: problem-management-governance.md
  machine_readable: problem-management-governance.yaml
  backlog_item: COM-MOD-016-OPS-001
  created_date: 2026-07-24
  owner: HOP Platform Quality & Architecture Governance Team

project:
  name: Healthcare Operations Platform
  slug: healthcare-operations-platform
  module: COM-MOD-016
  release: REL-003

problem_triggers:
  - trigger: P1_incident_closure
    rule: Every closed P1 incident automatically generates a mandatory Problem investigation record.
  - trigger: recurring_p2_p3_incidents
    rule: 3 or more incidents with identical error codes or component root causes within a 30-day window generate a Problem record.
  - trigger: major_security_vulnerability
    rule: Critical/High security vulnerability identified during open-source scans generates a Problem record if immediate hotfix is deferred.

investigation_methodology:
  framework: Five_Whys_and_Fishbone_Analysis
  steps:
    - Step 1: Problem Definition & Impact Statement
    - Step 2: Chronological Timeline Reconstruction
    - Step 3: Root Cause Traversal (5 Whys)
    - Step 4: Technical Debt & Architectural Gap Identification
    - Step 5: Preventive Action Item Definition & Backlog Entry

known_error_database:
  kedb_policy:
    purpose: Maintain searchable index of temporary workarounds and known non-blocking product limitations for L1/L2 support.
    location: 09-operations/governance/problem-management-governance.yaml
    review_frequency: monthly
  registered_known_errors:
    - id: KE-OBS-001
      title: Distributed trace export requires external OpenTelemetry collector stack
      workaround: Rely on Spring MDC traceId log correlation and Prometheus HTTP metrics
      tracked_debt_item: TD-OBS-001
      target_module: Infrastructure Expansion

    - id: KE-IAM-004
      title: Quality & Document controllers assign synthetic tenant ID
      workaround: Use request-header filtering and application-level tenant context verification
      tracked_debt_item: TD-IAM-004
      target_module: Future Spring Modulith Shared Context Refactoring

technical_debt_integration:
  policy:
    - Problem resolution actions must be logged as actionable items in 08-qa/technical-debt/technical-debt-index.yaml.
    - Each debt item must contain risk level, owner, target backlog, and acceptance criteria.
    - Technical debt burn-down rules enforce resolution before final General Availability (GA) closure.

traceability:
  capabilities:
    - BCM-PLT-002
    - BCM-PLT-006
    - BCM-PLT-007
  standards_compliance:
    agent_agnostic: true
    open_source_first: true
    no_proprietary_agent_dependencies: true
