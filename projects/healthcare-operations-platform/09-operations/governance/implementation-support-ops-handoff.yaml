artifact:
  id: HOP-GOV-HND-001
  type: operational-governance-specification
  name: HOP Implementation to Support & Operations Handoff Specification
  version: 1.0.0
  status: approved
  human_readable: implementation-support-ops-handoff.md
  machine_readable: implementation-support-ops-handoff.yaml
  backlog_item: COM-MOD-016-OPS-001
  created_date: 2026-07-24
  owner: HOP Professional Services & Customer Operations Team

project:
  name: Healthcare Operations Platform
  slug: healthcare-operations-platform
  module: COM-MOD-016
  release: REL-003

handoff_phases:
  - phase: 1_Implementation_Phase
    owner: Professional Services / Delivery Team
    activities: Tenant setup, organization/branch/lab configuration, initial data ingestion (BCM-PLT-010), custom pricing/catalog setup.
    deliverables: Initial Tenant Onboarding Report, Data Ingestion Summary.

  - phase: 2_Hypercare_Phase
    duration_days: 30
    joint_owners: Professional Services Lead & L2 Support Lead
    activities: Daily operational check-ins, priority support routing, user training reinforcement, performance monitoring.
    exit_criteria: Zero open P1/P2 incidents for 10 consecutive days, customer signoff on core operational workflows.

  - phase: 3_BAU_Operations_Handoff
    owner: L2 Support Engineering & BAU Customer Success
    activities: Full transition to standard L1/L2/L3 support model, ticket queue transfer, routine maintenance inclusion.
    signoff_required: Formal Handoff Protocol Signoff Document.

handoff_checklist:
  technical_readiness:
    - Tenant provisioned with correct legal name, tax ID, tier, and isolation strategy (BCM-ORG-001).
    - Initial organization, laboratory, and branch records created and linked (BCM-ORG-002, BCM-ORG-003).
    - User accounts, role assignments, and initial permission matrices configured (BCM-PLT-001).
    - Master diagnostic catalog, test definitions, reference ranges, and price lists published (MVP-MOD-002).

  operational_readiness:
    - Open data ingestion migration package imported, dry-run executed, and reconciliation report signed off (BCM-PLT-010).
    - Integration endpoints and partner API keys configured with rate-limiting policies (BCM-PLT-004, BCM-PLT-005).
    - Backup policies active and database restore rehearsal verified.
    - Actuator health probes and Prometheus metrics monitoring confirmed active.

  support_and_customer_readiness:
    - Customer administrator and staff key roles trained on employee portal screens.
    - Customer support contacts and escalation hierarchy configured in L1 ticketing system.
    - Standard Operating Procedures (SOPs) handed over to customer clinic managers.
    - Operational acceptance criteria (OAC) validated and signed off by Customer Project Sponsor.

traceability:
  capabilities:
    - BCM-ORG-001
    - BCM-ORG-002
    - BCM-ORG-003
    - BCM-PLT-002
    - BCM-PLT-006
    - BCM-PLT-007
    - BCM-PLT-008
  standards_compliance:
    agent_agnostic: true
    open_source_first: true
    no_proprietary_agent_dependencies: true
