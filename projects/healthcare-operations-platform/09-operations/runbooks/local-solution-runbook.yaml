artifact:
  id: HOP-LOCAL-RUNBOOK-001
  type: integrated-local-solution-runbook
  name: HOP Integrated Local Solution Runbook
  version: 1.0.0
  status: active
  human_readable: local-solution-runbook.md
  machine_readable: local-solution-runbook.yaml
  standard: ../../../../nexora-framework/02-standards/standards/integrated-local-solution-runbook-standard.yaml
  owner: Nexora Engineering

project:
  name: Healthcare Operations Platform
  slug: healthcare-operations-platform
  current_active_backlog_item: COM-MOD-010-DEF
  paused_functional_backlog_item: null
  quality_alignment_backlog_status: closed
  quality_alignment_backlog: 06-delivery/commercial-product/HOP_QUALITY_ALIGNMENT_BACKLOG.yaml
  enterprise_foundation_alignment_backlog_status: closed
  enterprise_foundation_alignment_backlog: 06-delivery/commercial-product/HOP_ENTERPRISE_FOUNDATION_ALIGNMENT_BACKLOG.yaml
  enterprise_foundation_alignment_closeout_evidence: 08-qa/qa/enterprise-foundation/HOP-ENT-FOUND-001-validation.yaml
  runbook_confirmation_note: >-
    MVP-MOD-008-DEF (Integration and Migration Readiness capability package models) is a
    definition-only backlog item: it added no runtime component, port, environment variable,
    startup order or validation command. HOP-ENT-FOUND-001 was validated using the existing
    documented commands below; no new runtime component, port, environment variable, startup order
    or validation command was introduced. MVP-MOD-008-BE-001 (backend compilation of BCM-PLT-004/
    BCM-PLT-005/BCM-PLT-010) added two new schema files —
    backend/src/main/resources/db/integration-interoperability/schema.sql and
    backend/src/main/resources/db/data-migration-portability/schema.sql — both added to
    application-local.yml's `spring.sql.init.schema-locations` list alongside the pre-existing
    per-module schema files; no new port, environment variable, startup order or validation command was introduced
    (the same `-Pquality "-Dhop.local-db-tests=true" clean verify` command validates them). No
    Docker-init mount script exists for these two new schemas — unlike platform-foundation, the
    local Postgres container has no separate init-mount copy to keep in sync, so TD-STACK-004's
    drift risk does not apply to them. The local-database-backed backend command remains dependent
    on the pre-existing platform-foundation schema/Docker-init-mount sync described below (TD-STACK-004).
    MVP-MOD-008-BE-002 (integration retry/dead-letter, API deprecation/rate-limit and migration
    checkpoint custom rules) added 3 columns (correlation_id, next_retry_at, dead_letter_reason) to
    integration_interoperability.integration_message_records and widened
    data_migration_portability.import_executions.checkpoint from varchar(160) to text, both in the
    same two schema.sql files above (no new file, no new port, environment variable, startup order
    or validation command); a pre-existing local Postgres container from before this change needs
    those columns added manually (`ALTER TABLE ... ADD COLUMN IF NOT EXISTS ...`) since schema.sql's
    `CREATE TABLE IF NOT EXISTS` does not retroactively alter an already-created table — a fresh
    `docker compose up` (or an equivalent freshly-created local Postgres volume) picks up the new
    columns automatically with no manual step. This backlog item also added an
    `X-Partner-Api-Key` request header (consumed only by
    `PartnerApiKeyRateLimitInterceptor`); requests without it are entirely unaffected, so no
    existing runbook validation step changes. MVP-MOD-008-FE-001 added employee-portal integration,
    API-governance and migration administration screens; it did not add a runtime port,
    environment variable, startup order or infrastructure dependency, and remains validated through
    and MVP-MOD-008-CLOSEOUT are closed. COM-MOD-009-DEF is closed (modeled BCM-PLT-001). COM-MOD-009-BE-001 (backend compilation of portals authorization structures) added authentication, lockout, impersonation sandbox, and granular permissions. It also added five columns to identity.user_accounts (username, password_hash, failed_login_attempts, locked_until, last_login_at), which are automatically added via ALTER TABLE statements to existing local Postgres instances. No new port, environment variable, or startup order was introduced; validated using existing Maven test suite. COM-MOD-009-PORTAL-001 (patient portal commercial workflow) is closed: it compiled LoginForm, Dashboard layouts, and secure self-access interceptor backend rules, raising patient portal Vitest coverage to 89.58% (TD-FE-008 closed). It did not add a new port, environment variable, or startup order; validated using the existing patient-portal and backend test suites. COM-MOD-009-PORTAL-002 (doctor portal commercial workflow) is closed: it rebuilt the doctor-portal frontend (login, permission-filtered navigation, patients/results/orders/notifications screens) against the existing doctor-portal dev port (4002, unchanged from vite.config.ts) and added backend least-privilege enforcement (a doctorId query filter on the existing GET /api/clinical-operations/diagnostic-orders endpoint, three new HopAuthorizationInterceptor self-access blocks, and a new ReferringDoctorAuthorizationPort Spring Modulith named interface consumed by the existing resultsanddigitaldelivery module). It added no new runtime component, port, environment variable, startup order, database schema change or validation command; validated using the existing doctor-portal (`npm run quality`) and backend (`mvn -Pquality "-Dhop.local-db-tests=true" clean verify`) commands documented below. Doctor-portal Vitest coverage rose to 89.86% (TD-FE-009 closed). COM-MOD-009-APP-001 (patient mobile workflow) is closed: it added PATIENT role permissions, permission-filtered profile/appointments/orders/results/notifications routes, localized es-MX/en-US labels, a patientMobileApi facade and patientMobileWorkflowModel to the existing mobile-app component. It added no new runtime component, port, environment variable, startup order, database schema change or infrastructure dependency; validated using the existing mobile-app `npm run quality` and `npm audit --audit-level=low` commands. Mobile coverage rose to 99.21%. COM-MOD-009-QA-001 (channel access and privacy evidence) is closed. COM-MOD-009-CLOSEOUT (Module closeout and registry update) is closed. The next active backlog item is COM-MOD-010-DEF.
  intended_audience:
    - human_reviewer
    - qa_reviewer
    - development_agent

local_ports:
  backend_api: http://localhost:8080
  employee_portal: http://localhost:5173
  postgres: localhost:5432
  redis: localhost:6379
  otel_grpc: localhost:4317
  otel_http: localhost:4318
  otel_health: http://localhost:13133

prerequisites:
  - id: PRE-001
    name: Docker with Compose support
    required_for: infrastructure_services
  - id: PRE-002
    name: Java 21
    required_for: backend_api
  - id: PRE-003
    name: Maven 3.9.x or compatible Maven wrapper/settings usage
    required_for: backend_build_and_run
  - id: PRE-004
    name: Node.js and npm
    required_for: employee_portal_and_mobile_validation
  - id: PRE-005
    name: PowerShell or compatible shell
    required_for: local_commands_on_windows

component_inventory:
  - id: INF-001
    name: Local infrastructure services
    type: infrastructure
    path: 07-implementation/compose.local.yml
    depends_on:
      - 07-implementation/.env
    port_or_url: postgres:5432, redis:6379, otel:4317/4318/13133
    start_command: docker compose --env-file .env -f compose.local.yml up -d
    health_check: docker compose --env-file .env -f compose.local.yml ps
    stop_command_or_process_note: docker compose --env-file .env -f compose.local.yml down
    owner_area: platform_operations
  - id: BE-001
    name: HOP backend API
    type: backend
    path: 07-implementation/backend
    depends_on:
      - INF-001
    port_or_url: http://localhost:8080
    start_command: mvn --settings .mvn/settings.xml spring-boot:run "-Dspring-boot.run.profiles=local"
    health_check: GET http://localhost:8080/actuator/health and GET http://localhost:8080/api/platform/health
    stop_command_or_process_note: Stop the Maven Spring Boot process in its terminal.
    owner_area: backend
  - id: WEB-001
    name: Employee portal web app
    type: frontend_webapp
    path: 07-implementation/employee-portal
    depends_on:
      - BE-001
    port_or_url: http://localhost:5173
    start_command: npm run dev -- --host 127.0.0.1
    health_check: Open http://localhost:5173 and confirm the app loads.
    stop_command_or_process_note: Stop the Vite process in its terminal.
    owner_area: frontend
  - id: APP-001
    name: Mobile app foundation package
    type: mobile_validation_package
    path: 07-implementation/mobile-app
    depends_on:
      - WEB-001 dependencies installed
    port_or_url: not_applicable_renderer_agnostic_package
    start_command: npm test
    health_check: npm run typecheck and npm test
    stop_command_or_process_note: No long-running process.
    owner_area: mobile

startup_order:
  - id: STEP-001
    name: Prepare environment file
    working_directory: 07-implementation
    command: Copy-Item .env.example .env
    when: Run only if .env does not exist.
  - id: STEP-002
    name: Start infrastructure services
    working_directory: 07-implementation
    command: docker compose --env-file .env -f compose.local.yml up -d
    expected_result: PostgreSQL, Redis and OpenTelemetry Collector containers are running.
  - id: STEP-003
    name: Verify infrastructure services
    working_directory: 07-implementation
    command: docker compose --env-file .env -f compose.local.yml ps
    expected_result: postgres, redis and otel-collector are Up or healthy.
  - id: STEP-004
    name: Start backend API
    working_directory: 07-implementation/backend
    command: mvn --settings .mvn/settings.xml spring-boot:run "-Dspring-boot.run.profiles=local"
    expected_result: Backend starts on http://localhost:8080.
  - id: STEP-005
    name: Install employee portal dependencies
    working_directory: 07-implementation/employee-portal
    command: npm install
    when: Run when node_modules is missing or package-lock.json changed.
  - id: STEP-006
    name: Start employee portal web app
    working_directory: 07-implementation/employee-portal
    command: npm run dev -- --host 127.0.0.1
    expected_result: Employee portal starts on http://localhost:5173 and proxies /api to backend.

health_checks:
  - id: HC-001
    name: Backend actuator health
    working_directory: repository_root
    command: Invoke-RestMethod http://localhost:8080/actuator/health
    expected_result: status is UP.
  - id: HC-002
    name: Platform health
    working_directory: repository_root
    command: Invoke-RestMethod http://localhost:8080/api/platform/health
    expected_result: status is UP.
  - id: HC-003
    name: Employee portal availability
    working_directory: repository_root
    command: Invoke-WebRequest http://localhost:5173
    expected_result: HTTP 200.

smoke_validation:
  - id: SMOKE-001
    name: Open employee portal
    url: http://localhost:5173
    expected_result: HOP employee portal shell loads.
  - id: SMOKE-002
    name: Create and inspect platform tenant through UI or API
    expected_result: Tenant creation succeeds and can be retrieved.
  - id: SMOKE-003
    name: Diagnostic Catalog baseline
    expected_result: Diagnostic catalog screens load and can use backend /api/catalog endpoints when backend is running.
  - id: SMOKE-004
    name: People and Clinical Master Data baseline
    expected_result: >
      POST /api/people/patients and POST /api/people/doctors register a patient and doctor;
      GET /api/people/persons/search returns both records with duplicate-detection scoring.
      POST /api/care-delivery/patient-registrations starts a registration and returns outcome
      pending; POST .../{id}/commit commits the registration through Patient Management (blocks
      with HTTP 409 on an unresolved high-confidence duplicate or missing mandatory consent).
      Patient merge, representative/consent revocation, doctor suspension, portal-access
      preparation and credential verify/revoke custom-rule endpoints (MVP-MOD-003-BE-002) are
      functional and no longer return HTTP 501.
  - id: SMOKE-005
    name: People and Clinical Master Data employee portal screens (MVP-MOD-003-FE-001)
    expected_result: >
      With tenant, laboratory and branch scope selected (Tenants/Laboratories/Branches tabs), the
      "People Search" tab searches patients and doctors and runs duplicate detection with a visible
      confidence badge; "Patients" registers a patient and can load its snapshot, attach/revoke a
      representative, record/revoke a consent, and merge a duplicate into a survivor; "Doctors"
      registers a doctor and can attach/verify/revoke a credential, suspend the doctor (with
      confirmation) and prepare portal access; "Patient Registrations" starts a registration,
      commits it (showing a visual high-confidence duplicate candidate list and a 409 message when
      a match must be resolved or a mandatory consent is missing), and cancels a pending
      registration (with confirmation).
  - id: SMOKE-006
    name: Front Desk and Care Delivery baseline (MVP-MOD-004-BE-001)
    expected_result: >
      POST /api/clinical-operations/diagnostic-orders creates a diagnostic order with immutable
      patient/doctor/branch snapshots; POST .../{id}/price, .../accept and .../complete transition
      it through priced, accepted and completed (no endpoint returns HTTP 501).
      POST /api/care-delivery/appointments creates an appointment; .../confirm rejects a
      non-operational branch or an overlapping confirmed appointment for the same patient;
      .../check-in hands off to reception. POST /api/care-delivery/reception-visits starts a
      visit; .../confirm-identity performs a read-only identity check against Patient Management;
      .../advance-to-admission blocks with HTTP 409 until identity is confirmed. POST
      /api/care-delivery/admission-requests starts an admission from a confirmed reception visit;
      .../mark-ready validates published catalog selection; .../commit delegates to Diagnostic
      Order Management and returns createdOrderId. POST /api/care-delivery/quotations creates a
      quotation; .../issue resolves price-list pricing and enforces a discount policy cap (HTTP
      409 beyond the limit); .../accept and .../convert produce a linked diagnostic order.
  - id: SMOKE-007
    name: Front Desk and Care Delivery custom rules (MVP-MOD-004-BE-002)
    expected_result: >
      POST /api/clinical-operations/diagnostic-orders rejects a doctorId that is not
      isEligibleAsReferringDoctor with HTTP 409; .../price resolves each order line's price
      independently, so a two-line order spanning two price lists still prices correctly;
      .../cancel accepts just a reasonCode for a draft/priced order but requires an additional
      overrideJustification of at least 15 characters once the order is accepted or in_progress.
      POST /api/care-delivery/appointments/{id}/confirm additionally rejects once the tenant's
      configured daily branch capacity is reached; .../no-show requires the tenant's configured
      grace period to have elapsed after scheduledEnd; GET .../preparation-instructions returns
      published preparation instructions for the appointment's requested catalog items. GET
      /api/care-delivery/reception-visits orders the queue by priority (urgent first) then by
      longest wait time. POST /api/care-delivery/admission-requests/{id}/commit only requires the
      acknowledgements the tenant's policy marks mandatory (both consent and sample-requirement
      acknowledgement by default). POST /api/care-delivery/quotations/{id}/issue resolves each
      quotation line's price independently and applies a tenant-configurable discount cap instead
      of a fixed constant.
  - id: SMOKE-008
    name: Front Desk and Care Delivery employee portal screens (MVP-MOD-004-FE-001)
    expected_result: >
      With tenant, laboratory and branch scope selected, the "Front Desk" tab starts a walk-in or
      scheduled reception visit, confirms identity, updates priority, advances to admission
      (blocking with a visible HTTP 409 message when identity is not yet confirmed) and abandons a
      visit (with confirmation); the queue lists in the backend's priority order. The "Diagnostic
      Orders" tab creates a walk-in, appointment, admission or quotation-conversion order with one
      or more test/panel lines, showing the immutable patient/doctor/branch snapshots and pricing
      snapshot once priced; price/accept/complete/cancel transitions succeed, and cancelling an
      accepted or in-progress order without a 15+ character override justification surfaces the
      backend's ORDER_CANCELLATION_OVERRIDE_REQUIRED message. Every action shows a loading, success
      or error banner; abandon and cancel require an explicit confirmation dialog. Appointment
      Scheduling, Admission Management and Quotation Management screens remain tracked as
      TD-FE-006.
  - id: SMOKE-009
    name: Cashier and Billing Request backend baseline (MVP-MOD-005-BE-001)
    expected_result: >
      Create an accepted diagnostic order or accepted quotation, then POST
      /api/revenue/cashier/sales to create a payable Sale. Open a cash session with POST
      /api/revenue/cashier/sessions, register a cash or card payment with POST
      /api/revenue/cashier/sales/{saleId}/payments, verify GET
      /api/revenue/cashier/sales/{saleId} shows partially_paid or paid totals, and close the
      session with POST /api/revenue/cashier/sessions/{sessionId}/close. After a sale is paid,
      POST /api/revenue/billing-requests creates an InvoiceRequest and GET
      /api/revenue/billing-requests/{invoiceRequestId}/tax-lines returns tax lines. submit, retry
      and cancel billing adapter actions execute the provider-agnostic local deterministic fiscal
      adapter boundary introduced by MVP-MOD-005-BE-002.
  - id: SMOKE-010
    name: Cashier and Billing Request employee portal screens (MVP-MOD-005-FE-001)
    expected_result: >
      With tenant, laboratory and branch scope selected, the "Cash Sessions" tab opens a session
      (opening amount/currency), lists sessions, and closes a session with a counted amount; closing
      with a counted amount that differs from the expected amount and no variance reason surfaces
      the backend's CASH_VARIANCE_REASON_REQUIRED message. The "Sales" tab creates a sale from an
      accepted diagnostic order or accepted quotation, shows sale lines/totals/outstanding
      balance/payment status, registers a payment (a payment above the outstanding balance surfaces
      PAYMENT_EXCEEDS_OUTSTANDING_BALANCE), and cancels a non-paid sale with confirmation; once a
      sale reaches paid it shows a hint to create a billing request. The "Billing Requests" tab
      creates a billing request from a paid sale's id (a billing request for a sale that is not yet
      paid surfaces BILLING_SALE_REQUIRED), shows tax lines, and executes submit/retry/cancel
      against the fiscal adapter boundary, each gated by a confirmation dialog. Every action shows a
      loading, success or error banner.

quality_validation:
  - id: QA-001
    name: Backend standard tests
    working_directory: 07-implementation/backend
    command: mvn -gs .mvn/global-settings.xml --settings .mvn/settings.xml test
  - id: QA-002
    name: Backend PostgreSQL tests
    working_directory: 07-implementation/backend
    command: mvn -gs .mvn/global-settings.xml --settings .mvn/settings.xml test "-Dhop.local-db-tests=true"
    depends_on:
      - INF-001
    expected_result: >
      Local PostgreSQL tests run with no skipped local tests when Docker Compose is active, including
      CashSalesLocalDatabaseTest for the cash_sales schema, and (since MVP-MOD-008-BE-001)
      IntegrationInteroperabilityLocalDatabaseTest for the integration_interoperability schema and
      DataMigrationPortabilityLocalDatabaseTest for the data_migration_portability schema.
  - id: QA-003
    name: Backend enterprise quality profile
    working_directory: 07-implementation/backend
    command: mvn -gs .mvn/global-settings.xml --settings .mvn/settings.xml -Pquality verify checkstyle:checkstyle pmd:pmd pmd:cpd spotbugs:spotbugs cyclonedx:makeAggregateBom duplicate-finder:check
    expected_result: >
      Tests, Checkstyle, PMD/CPD, SpotBugs/Find Security Bugs, JaCoCo, CycloneDX, Enforcer,
      license and duplicate dependency/class checks run. Any vulnerability or tool failure blocks
      backlog closure; residual PMD and coverage findings must be linked to technical debt.
  - id: QA-004
    name: Backend dependency vulnerability scan - all severities
    working_directory: 07-implementation/backend
    command: mvn -gs .mvn/global-settings.xml --settings .mvn/settings.xml -Pquality org.owasp:dependency-check-maven:check
    expected_result: OWASP Dependency-Check reports 0 vulnerabilities.
  - id: QA-005
    name: Employee portal enterprise quality profile
    working_directory: 07-implementation/employee-portal
    command: npm run quality
    expected_result: Typecheck, lint, coverage, build, duplication, format and license gates pass.
  - id: QA-006
    name: Employee portal dependency audit - all severities
    working_directory: 07-implementation/employee-portal
    command: npm audit --audit-level=low
    expected_result: 0 vulnerabilities.
  - id: QA-007
    name: Mobile foundation enterprise quality profile
    working_directory: 07-implementation/mobile-app
    command: npm run quality
    expected_result: Typecheck, lint, tests, duplication and format gates pass.
  - id: QA-008
    name: Integrated all-severity filesystem, secret and misconfiguration scan
    working_directory: 07-implementation
    command: trivy fs --scanners vuln,secret,misconfig --exit-code 1 --no-progress --skip-dirs "backend/.m2,backend/target,employee-portal/node_modules,employee-portal/dist,mobile-app/node_modules" .
    expected_result: 0 vulnerabilities, 0 secrets and 0 misconfigurations across all severities.
  - id: QA-009
    name: OWASP ZAP DAST baseline for employee portal
    working_directory: 07-implementation
    command: >-
      docker run --rm --add-host=host.docker.internal:host-gateway -v
      "<repo>/08-qa/security-quality/HOP-QA-ALIGN-004:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable
      zap-baseline.py -t http://host.docker.internal:5173 -r zap-employee-portal.html -J
      zap-employee-portal.json -m 2
    windows_docker_desktop_note: >-
      --network host does not bridge to the Windows host under Docker Desktop's WSL2 backend; use
      --add-host=host.docker.internal:host-gateway and target host.docker.internal instead of
      localhost/127.0.0.1. vite.config.ts's server.allowedHosts must include
      "host.docker.internal" or Vite returns HTTP 403 to the scanner.
    depends_on:
      - INF-001
      - BE-001
      - WEB-001
    expected_result: >
      ZAP completes and findings of any severity are remediated or registered with accepted-risk
      disposition. If Docker image pull, network mode or permissions fail, request support and keep
      HOP-QA-ALIGN-004 open instead of closing with an execution limitation.
  - id: QA-010
    name: OWASP ZAP DAST API scan for backend
    working_directory: 07-implementation
    command: >-
      docker run --rm --add-host=host.docker.internal:host-gateway -v
      "<repo>/08-qa/security-quality/HOP-QA-ALIGN-004:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable
      zap-api-scan.py -t http://host.docker.internal:8080/v3/api-docs -f openapi -r
      zap-backend-api.html -J zap-backend-api.json
    windows_docker_desktop_note: Same --add-host / host.docker.internal requirement as QA-009.
    depends_on:
      - INF-001
      - BE-001
    expected_result: >
      ZAP completes and findings of any severity are remediated or registered with accepted-risk
      disposition. If OpenAPI is unavailable, document the exact API-documentation blocker before
      closing the DAST backlog item.

stop_steps:
  - id: STOP-001
    name: Stop employee portal
    instruction: Stop the Vite terminal process with Ctrl+C.
  - id: STOP-002
    name: Stop backend API
    instruction: Stop the Maven Spring Boot terminal process with Ctrl+C.
  - id: STOP-003
    name: Stop infrastructure services
    working_directory: 07-implementation
    command: docker compose --env-file .env -f compose.local.yml down

reset_steps:
  - id: RESET-001
    name: Remove local infrastructure volumes
    working_directory: 07-implementation
    command: docker compose --env-file .env -f compose.local.yml down -v
    warning: This deletes local PostgreSQL and Redis data.

troubleshooting:
  - symptom: Backend cannot connect to PostgreSQL.
    checks:
      - Confirm docker compose services are running.
      - Confirm 07-implementation/.env matches backend local profile variables.
      - Confirm port 5432 is not occupied by another PostgreSQL instance.
  - symptom: Employee portal API calls fail.
    checks:
      - Confirm backend is running on http://localhost:8080.
      - Confirm Vite proxy configuration still points /api to http://localhost:8080.
  - symptom: Mobile tests cannot find TypeScript or Vitest commands.
    checks:
      - Run npm install in 07-implementation/employee-portal first because mobile currently reuses that toolchain.

known_limitations:
  - Mobile app is currently a renderer-agnostic TypeScript foundation, not a native runnable app.
  - >-
    Mobile line coverage measurement is blocked because mobile-app reuses employee-portal's
    installed vitest toolchain via a relative binary path, which does not resolve
    @vitest/coverage-v8 as a bare module specifier from a sibling directory; tracked as TD-APP-002.
  - >-
    DAST (QA-009 employee portal baseline, QA-010 backend API scan) executed successfully during
    HOP-QA-ALIGN-004; both closed TD-QA-001. On Docker Desktop with a WSL2 backend, ZAP containers
    must use --add-host=host.docker.internal:host-gateway and target
    http://host.docker.internal:<port> because --network host does not bridge to the Windows host.
  - >-
    The employee portal dev server does not set Content-Security-Policy or
    Cross-Origin-Embedder-Policy (a production-strength policy would break Vite's eval-based HMR);
    tracked as TD-FE-005, must close before any production deployment of the employee portal.
  - >-
    A malformed empty-key query/form parameter causes an unhandled 500 on
    POST /api/platform/tenants (Tomcat parameter-parsing edge case, no information disclosure);
    tracked as TD-QA-004.
  - Release supply-chain gates are configured but release-policy hardening remains tracked as TD-BE-004.
  - >-
    Message externalization and magic-string remediation baseline established (HOP-QA-ALIGN-005,
    TD-I18N-001 closed); remaining full-adoption work (backend API code field, full frontend/mobile
    i18n-library adoption) tracked as TD-I18N-002.
  - >-
    The employee portal has no Appointment Scheduling, Admission Management or Quotation
    Management screens yet (MVP-MOD-004-FE-001 delivered Front Desk/Reception and Diagnostic
    Orders only); administrators with API access are not blocked; tracked as TD-FE-006.
  - >-
    The employee portal's LaboratoryResult type (used by ResultReleaseScreen,
    TechnicalValidationScreen, MedicalValidationScreen and the MVP-MOD-007-FE-001 Result Search
    screen) does not match the real BCM-LAB-006 backend record field-for-field (singular
    analyteSnapshot/referenceRangeSnapshot/resultValue vs. the FE's plural fields, no version
    field). MVP-MOD-007-FE-001 worked around this locally for its own screen via response
    normalization in resultsDeliveryApi.ts; tracked as TD-FE-007.
  - >-
    In this sandboxed development environment, Maven runs in --offline mode and the backend
    `-Pquality` profile's spotless/checkstyle/pmd/spotbugs/dependency-check plugins are not cached
    locally, so QA-003 cannot execute here (PluginResolutionException, not a code finding). QA-001/
    QA-002 (mvn test, including JaCoCo) run successfully offline and remain the authoritative
    backend gates in this environment; QA-003 should be run in an environment with network access
    before a release-readiness or GA gate.

quality_gate_command_matrix:
  backend:
    - QA-001
    - QA-002
    - QA-003
    - QA-004
  frontend:
    - QA-005
    - QA-006
  mobile:
    - QA-007
  integrated_security:
    - QA-008
    - QA-009
    - QA-010
  closure_rule: >
