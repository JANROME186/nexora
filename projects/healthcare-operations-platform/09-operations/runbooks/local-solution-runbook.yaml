artifact:
  id: HOP-LOCAL-RUNBOOK-001
  type: integrated-local-solution-runbook
  name: HOP Integrated Local Solution Runbook
  version: 1.0.0
  status: active
  human_readable: local-solution-runbook.md
  machine_readable: local-solution-runbook.yaml
  standard: ../../../../nexora-framework/02-standards/standards/integrated-local-solution-runbook-standard.yaml
  owner: Nexora Engineering

project:
  name: Healthcare Operations Platform
  slug: healthcare-operations-platform
  current_active_backlog_item: HOP-QA-ALIGN-001
  paused_functional_backlog_item: MVP-MOD-004-FE-001
  active_quality_alignment_backlog: 06-delivery/commercial-product/HOP_QUALITY_ALIGNMENT_BACKLOG.yaml
  intended_audience:
    - human_reviewer
    - qa_reviewer
    - development_agent

local_ports:
  backend_api: http://localhost:8080
  employee_portal: http://localhost:5173
  postgres: localhost:5432
  redis: localhost:6379
  otel_grpc: localhost:4317
  otel_http: localhost:4318
  otel_health: http://localhost:13133

prerequisites:
  - id: PRE-001
    name: Docker with Compose support
    required_for: infrastructure_services
  - id: PRE-002
    name: Java 21
    required_for: backend_api
  - id: PRE-003
    name: Maven 3.9.x or compatible Maven wrapper/settings usage
    required_for: backend_build_and_run
  - id: PRE-004
    name: Node.js and npm
    required_for: employee_portal_and_mobile_validation
  - id: PRE-005
    name: PowerShell or compatible shell
    required_for: local_commands_on_windows

component_inventory:
  - id: INF-001
    name: Local infrastructure services
    type: infrastructure
    path: 07-implementation/compose.local.yml
    depends_on:
      - 07-implementation/.env
    port_or_url: postgres:5432, redis:6379, otel:4317/4318/13133
    start_command: docker compose --env-file .env -f compose.local.yml up -d
    health_check: docker compose --env-file .env -f compose.local.yml ps
    stop_command_or_process_note: docker compose --env-file .env -f compose.local.yml down
    owner_area: platform_operations
  - id: BE-001
    name: HOP backend API
    type: backend
    path: 07-implementation/backend
    depends_on:
      - INF-001
    port_or_url: http://localhost:8080
    start_command: mvn --settings .mvn/settings.xml spring-boot:run "-Dspring-boot.run.profiles=local"
    health_check: GET http://localhost:8080/actuator/health and GET http://localhost:8080/api/platform/health
    stop_command_or_process_note: Stop the Maven Spring Boot process in its terminal.
    owner_area: backend
  - id: WEB-001
    name: Employee portal web app
    type: frontend_webapp
    path: 07-implementation/employee-portal
    depends_on:
      - BE-001
    port_or_url: http://localhost:5173
    start_command: npm run dev -- --host 127.0.0.1
    health_check: Open http://localhost:5173 and confirm the app loads.
    stop_command_or_process_note: Stop the Vite process in its terminal.
    owner_area: frontend
  - id: APP-001
    name: Mobile app foundation package
    type: mobile_validation_package
    path: 07-implementation/mobile-app
    depends_on:
      - WEB-001 dependencies installed
    port_or_url: not_applicable_renderer_agnostic_package
    start_command: npm test
    health_check: npm run typecheck and npm test
    stop_command_or_process_note: No long-running process.
    owner_area: mobile

startup_order:
  - id: STEP-001
    name: Prepare environment file
    working_directory: 07-implementation
    command: Copy-Item .env.example .env
    when: Run only if .env does not exist.
  - id: STEP-002
    name: Start infrastructure services
    working_directory: 07-implementation
    command: docker compose --env-file .env -f compose.local.yml up -d
    expected_result: PostgreSQL, Redis and OpenTelemetry Collector containers are running.
  - id: STEP-003
    name: Verify infrastructure services
    working_directory: 07-implementation
    command: docker compose --env-file .env -f compose.local.yml ps
    expected_result: postgres, redis and otel-collector are Up or healthy.
  - id: STEP-004
    name: Start backend API
    working_directory: 07-implementation/backend
    command: mvn --settings .mvn/settings.xml spring-boot:run "-Dspring-boot.run.profiles=local"
    expected_result: Backend starts on http://localhost:8080.
  - id: STEP-005
    name: Install employee portal dependencies
    working_directory: 07-implementation/employee-portal
    command: npm install
    when: Run when node_modules is missing or package-lock.json changed.
  - id: STEP-006
    name: Start employee portal web app
    working_directory: 07-implementation/employee-portal
    command: npm run dev -- --host 127.0.0.1
    expected_result: Employee portal starts on http://localhost:5173 and proxies /api to backend.

health_checks:
  - id: HC-001
    name: Backend actuator health
    working_directory: repository_root
    command: Invoke-RestMethod http://localhost:8080/actuator/health
    expected_result: status is UP.
  - id: HC-002
    name: Platform health
    working_directory: repository_root
    command: Invoke-RestMethod http://localhost:8080/api/platform/health
    expected_result: status is UP.
  - id: HC-003
    name: Employee portal availability
    working_directory: repository_root
    command: Invoke-WebRequest http://localhost:5173
    expected_result: HTTP 200.

smoke_validation:
  - id: SMOKE-001
    name: Open employee portal
    url: http://localhost:5173
    expected_result: HOP employee portal shell loads.
  - id: SMOKE-002
    name: Create and inspect platform tenant through UI or API
    expected_result: Tenant creation succeeds and can be retrieved.
  - id: SMOKE-003
    name: Diagnostic Catalog baseline
    expected_result: Diagnostic catalog screens load and can use backend /api/catalog endpoints when backend is running.
  - id: SMOKE-004
    name: People and Clinical Master Data baseline
    expected_result: >
      POST /api/people/patients and POST /api/people/doctors register a patient and doctor;
      GET /api/people/persons/search returns both records with duplicate-detection scoring.
      POST /api/care-delivery/patient-registrations starts a registration and returns outcome
      pending; POST .../{id}/commit commits the registration through Patient Management (blocks
      with HTTP 409 on an unresolved high-confidence duplicate or missing mandatory consent).
      Patient merge, representative/consent revocation, doctor suspension, portal-access
      preparation and credential verify/revoke custom-rule endpoints (MVP-MOD-003-BE-002) are
      functional and no longer return HTTP 501.
  - id: SMOKE-005
    name: People and Clinical Master Data employee portal screens (MVP-MOD-003-FE-001)
    expected_result: >
      With tenant, laboratory and branch scope selected (Tenants/Laboratories/Branches tabs), the
      "People Search" tab searches patients and doctors and runs duplicate detection with a visible
      confidence badge; "Patients" registers a patient and can load its snapshot, attach/revoke a
      representative, record/revoke a consent, and merge a duplicate into a survivor; "Doctors"
      registers a doctor and can attach/verify/revoke a credential, suspend the doctor (with
      confirmation) and prepare portal access; "Patient Registrations" starts a registration,
      commits it (showing a visual high-confidence duplicate candidate list and a 409 message when
      a match must be resolved or a mandatory consent is missing), and cancels a pending
      registration (with confirmation).
  - id: SMOKE-006
    name: Front Desk and Care Delivery baseline (MVP-MOD-004-BE-001)
    expected_result: >
      POST /api/clinical-operations/diagnostic-orders creates a diagnostic order with immutable
      patient/doctor/branch snapshots; POST .../{id}/price, .../accept and .../complete transition
      it through priced, accepted and completed (no endpoint returns HTTP 501).
      POST /api/care-delivery/appointments creates an appointment; .../confirm rejects a
      non-operational branch or an overlapping confirmed appointment for the same patient;
      .../check-in hands off to reception. POST /api/care-delivery/reception-visits starts a
      visit; .../confirm-identity performs a read-only identity check against Patient Management;
      .../advance-to-admission blocks with HTTP 409 until identity is confirmed. POST
      /api/care-delivery/admission-requests starts an admission from a confirmed reception visit;
      .../mark-ready validates published catalog selection; .../commit delegates to Diagnostic
      Order Management and returns createdOrderId. POST /api/care-delivery/quotations creates a
      quotation; .../issue resolves price-list pricing and enforces a discount policy cap (HTTP
      409 beyond the limit); .../accept and .../convert produce a linked diagnostic order.
  - id: SMOKE-007
    name: Front Desk and Care Delivery custom rules (MVP-MOD-004-BE-002)
    expected_result: >
      POST /api/clinical-operations/diagnostic-orders rejects a doctorId that is not
      isEligibleAsReferringDoctor with HTTP 409; .../price resolves each order line's price
      independently, so a two-line order spanning two price lists still prices correctly;
      .../cancel accepts just a reasonCode for a draft/priced order but requires an additional
      overrideJustification of at least 15 characters once the order is accepted or in_progress.
      POST /api/care-delivery/appointments/{id}/confirm additionally rejects once the tenant's
      configured daily branch capacity is reached; .../no-show requires the tenant's configured
      grace period to have elapsed after scheduledEnd; GET .../preparation-instructions returns
      published preparation instructions for the appointment's requested catalog items. GET
      /api/care-delivery/reception-visits orders the queue by priority (urgent first) then by
      longest wait time. POST /api/care-delivery/admission-requests/{id}/commit only requires the
      acknowledgements the tenant's policy marks mandatory (both consent and sample-requirement
      acknowledgement by default). POST /api/care-delivery/quotations/{id}/issue resolves each
      quotation line's price independently and applies a tenant-configurable discount cap instead
      of a fixed constant.

quality_validation:
  - id: QA-001
    name: Backend standard tests
    working_directory: 07-implementation/backend
    command: mvn --settings .mvn/settings.xml test
  - id: QA-002
    name: Backend PostgreSQL tests
    working_directory: 07-implementation/backend
    command: mvn --settings .mvn/settings.xml test "-Dhop.local-db-tests=true"
    depends_on:
      - INF-001
  - id: QA-003
    name: Employee portal typecheck
    working_directory: 07-implementation/employee-portal
    command: npm run typecheck
  - id: QA-004
    name: Employee portal unit and UI tests
    working_directory: 07-implementation/employee-portal
    command: npm test
  - id: QA-005
    name: Employee portal coverage
    working_directory: 07-implementation/employee-portal
    command: npm run test:coverage
  - id: QA-006
    name: Employee portal build
    working_directory: 07-implementation/employee-portal
    command: npm run build
  - id: QA-007
    name: Employee portal dependency audit
    working_directory: 07-implementation/employee-portal
    command: npm audit --audit-level=high
  - id: QA-008
    name: Mobile foundation typecheck
    working_directory: 07-implementation/mobile-app
    command: npm run typecheck
  - id: QA-009
    name: Mobile foundation tests
    working_directory: 07-implementation/mobile-app
    command: npm test

stop_steps:
  - id: STOP-001
    name: Stop employee portal
    instruction: Stop the Vite terminal process with Ctrl+C.
  - id: STOP-002
    name: Stop backend API
    instruction: Stop the Maven Spring Boot terminal process with Ctrl+C.
  - id: STOP-003
    name: Stop infrastructure services
    working_directory: 07-implementation
    command: docker compose --env-file .env -f compose.local.yml down

reset_steps:
  - id: RESET-001
    name: Remove local infrastructure volumes
    working_directory: 07-implementation
    command: docker compose --env-file .env -f compose.local.yml down -v
    warning: This deletes local PostgreSQL and Redis data.

troubleshooting:
  - symptom: Backend cannot connect to PostgreSQL.
    checks:
      - Confirm docker compose services are running.
      - Confirm 07-implementation/.env matches backend local profile variables.
      - Confirm port 5432 is not occupied by another PostgreSQL instance.
  - symptom: Employee portal API calls fail.
    checks:
      - Confirm backend is running on http://localhost:8080.
      - Confirm Vite proxy configuration still points /api to http://localhost:8080.
  - symptom: Mobile tests cannot find TypeScript or Vitest commands.
    checks:
      - Run npm install in 07-implementation/employee-portal first because mobile currently reuses that toolchain.

known_limitations:
  - Mobile app is currently a renderer-agnostic TypeScript foundation, not a native runnable app.
  - DAST automation remains tracked as technical debt TD-QA-001.
  - Release supply-chain gates remain tracked as technical debt TD-BE-004.

component_readmes:
  - 07-implementation/README.md
  - 07-implementation/backend/README.md
  - 07-implementation/employee-portal/README.md
  - 07-implementation/mobile-app/README.md

feedback_capture:
  project_feedback_index: 08-qa/framework-feedback/framework-feedback-index.yaml
  technical_debt_index: 08-qa/technical-debt/technical-debt-index.yaml
  instruction: >
    If this runbook is incomplete, ambiguous, or still requires hidden manual
    component-by-component knowledge for basic startup, capture project feedback
    and propose framework feedback when reusable.
