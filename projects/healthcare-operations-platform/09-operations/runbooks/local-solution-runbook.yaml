    runtime_change: >-
      Real fix, not additive: `application-local.yml`'s `spring.sql.init.schema-locations` was
      missing `classpath:db/external-quality-and-compliance/schema.sql` (added). This was
      compounded by an inverted `@Profile` on the 4 externalqualitycompliance JDBC/in-memory
      repository pairs (corrected to `@Profile("local")` / `@Profile("!local")`, matching every
      other module's convention). Together these meant the local backend previously started fine
      but silently persisted External Quality/CAPA/Audit/Quality-Event-Intake data in memory only
      -- lost on every restart -- instead of to hop-local-postgres. No new component, port,
      environment variable, Docker service or startup-order change; existing schema-locations
      mechanism now correctly covers this module's tables. Additionally,
      `employee-portal/vite.config.ts`'s dev-server `/api` proxy target, previously hardcoded to
      `http://localhost:8080` with no override, now reads an optional `HOP_BACKEND_URL`
      environment variable (falls back to the existing `http://localhost:8080` default when
      unset) -- a small, backward-compatible fix so the portal can be pointed at an alternate
      backend port (e.g. the documented `8090` workaround below) without editing source.
    dast_execution: >-
      This backlog item validates a runnable backend and employee-portal, so DAST was executed for
      real (not `not_applicable`): `zap-api-scan.py` against the full backend OpenAPI surface (939
      URLs, all COM-MOD-013 endpoints included) found and this item fixed a real defect (`TD-QA-007`
