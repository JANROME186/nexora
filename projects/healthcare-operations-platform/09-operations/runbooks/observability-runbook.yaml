artifact:
  id: HOP-RUNBOOK-OBS-001
  type: operational-runbook
  name: Observability Operations Runbook
  version: 1.0.0
  status: active
  backlog_item: COM-MOD-012-OPS-002
  module: COM-MOD-012 Platform Hardening and SaaS Operations
  human_readable: observability-runbook.md
  machine_readable: observability-runbook.yaml
  owner: Nexora Platform Operations
  date: 2026-07-22

purpose: >
  Give an operator a single, executable entry point to confirm HOP telemetry (health probes,
  metrics, logs and traces) is present, correctly scoped and usable before, during and after any
  deployment or incident. This runbook is the parent of health-readiness-liveness-runbook.yaml and
  metrics-logs-traces-validation-runbook.yaml, which detail the two most frequently repeated
  validation procedures referenced from here.

applicable_environments:
  local:
    posture: docker_compose_otel_collector_plus_actuator_health_info
    notes: Executable today against compose.local.yml.
  dev:
    posture: shared_otel_collector_prometheus_grafana_loki_compatible_stack
    notes: Target posture per production-deployment-strategy.yaml; infrastructure not yet provisioned.
  qa:
    posture: full_telemetry_and_alert_dry_runs
    notes: Target posture; infrastructure not yet provisioned.
  staging:
    posture: production_equivalent_dashboards_alerts_slo_checks
    notes: Target posture; infrastructure not yet provisioned.
  prod:
    posture: required_metrics_logs_traces_slo_alerts_incident_notifications
    notes: Target posture; infrastructure not yet provisioned.

capability_traceability:
  BCM-PLT-006:
    responsibility: Primary owner. ObservabilityTarget aggregate, health probes, metrics catalog, tracing, structured logging.
    package: ../../01-product-definition/business-capabilities/packages/bcm-plt-006-observability/
  BCM-PLT-002:
    responsibility: Feature-flag-gated maintenance mode and environment configuration read during triage.
  BCM-PLT-009:
    responsibility: Operational workflow that this runbook is executed under (deployment/incident/rollback).
  BCM-PLT-007:
    responsibility: Audit trail cross-check for privileged observability actions (dashboard/alert changes).

iam_and_audit:
  required_permissions:
    - metrics:read
    - health:read
  minimum_role: platform_operations_or_release_manager
  audit_expectation: >
    Any change to alert thresholds, dashboards or telemetry configuration must be traceable to an
    actor via BCM-PLT-007. Read-only observability checks in this runbook do not themselves require
    an audit event; privileged configuration changes do.

prerequisites:
  - id: PRE-001
    name: Local infrastructure services running (INF-001 in local-solution-runbook.yaml)
    required_for: otel_collector_health_check
  - id: PRE-002
    name: Backend API running (BE-001 in local-solution-runbook.yaml)
    required_for: actuator_health_and_info_checks
  - id: PRE-003
    name: PowerShell or compatible shell
    required_for: local_commands_on_windows

procedure:
  - id: OBS-STEP-001
    name: Confirm OpenTelemetry Collector is healthy
    working_directory: 07-implementation
    command: Invoke-WebRequest http://localhost:13133
    expected_result: HTTP 200 from the collector health extension.
  - id: OBS-STEP-002
    name: Confirm backend actuator health
    working_directory: repository_root
    command: Invoke-RestMethod http://localhost:8080/actuator/health
    expected_result: status is UP.
  - id: OBS-STEP-003
    name: Confirm backend build/version info is resolvable
    working_directory: repository_root
    command: Invoke-RestMethod http://localhost:8080/actuator/info
    expected_result: HTTP 200 (payload may be minimal until build-info is wired).
  - id: OBS-STEP-004
    name: Run the detailed health/readiness/liveness procedure
    reference: health-readiness-liveness-runbook.yaml
  - id: OBS-STEP-005
    name: Run the detailed metrics/logs/traces validation procedure
    reference: metrics-logs-traces-validation-runbook.yaml

success_criteria:
  - OTel Collector health extension returns HTTP 200.
  - Backend actuator health returns status UP.
  - No unexplained gap exists between expected and observed telemetry sources for the environment's target posture.

failure_criteria:
  - OTel Collector or backend health endpoint is unreachable or returns a non-UP status.
  - A deployed service exposes no /actuator/health equivalent (violates BCM-PLT-006 invariant "every deployed service must expose liveness and readiness endpoints").

evidence_expected:
  - Captured HTTP status and JSON body of each check, with UTC timestamp.
  - Reference to the deployment or incident id this check was run for.
  - Stored under 08-qa/qa/platform-hardening-and-saas-operations/ or the active incident's evidence folder (see evidence-collection-runbook.yaml).

responsible_role: platform_operations_on_call

next_action_if_failed: >
  Escalate to incident-response-runbook.yaml immediately if the failure is on a shared or
  production environment. On local/dev, consult troubleshooting in local-solution-runbook.yaml
  first; if unresolved, register a technical-debt or framework-feedback item rather than silently
  skipping the check.

related_runbooks:
  - health-readiness-liveness-runbook.yaml
  - metrics-logs-traces-validation-runbook.yaml
  - incident-response-runbook.yaml
  - evidence-collection-runbook.yaml

known_gaps_and_forward_pointers:
  - gap: No Prometheus-compatible metrics endpoint is exposed yet (management.endpoints.web.exposure.include is health,info only in application.yml; no micrometer-registry-prometheus dependency in backend/pom.xml).
    forward_pointer: COM-MOD-012-BE-001 (Compile tenant operations, feature flags and operational controls).
  - gap: No distributed tracing exporter is wired from the backend to the local OTel Collector yet; the collector runs and is reachable, but no application spans are produced.
    forward_pointer: COM-MOD-012-BE-001.
  - gap: No Grafana/Prometheus/Loki-compatible stack is provisioned in dev/qa/staging/prod; only the environment_configuration_policy target posture is defined in production-deployment-strategy.yaml.
    forward_pointer: future infrastructure-provisioning backlog item under COM-MOD-012 or a dedicated MVP-MOD infra item.

closure:
  backlog_item: COM-MOD-012-OPS-002
  status: active
