artifact:
  id: HOP-RUNBOOK-INCIDENT-001
  type: operational-runbook
  name: Incident Response Runbook
  version: 1.0.0
  status: active
  backlog_item: COM-MOD-012-OPS-002
  module: COM-MOD-012 Platform Hardening and SaaS Operations
  human_readable: incident-response-runbook.md
  machine_readable: incident-response-runbook.yaml
  owner: Nexora Platform Operations
  date: 2026-07-22

purpose: >
  Give the on-call operator a single decision tree from first detection of a HOP operational
  incident through triage, mitigation and handoff to specialized runbooks (rollback, restore,
  tenant-impact triage, evidence collection, post-incident review). This is the hub runbook for
  BCM-PLT-009's operational incident workflow.

applicable_environments:
  local: executable_for_drills_and_local_debugging
  dev: applicable
  qa: applicable
  staging: applicable
  prod: applicable_highest_severity_default

capability_traceability:
  BCM-PLT-009:
    responsibility: Owns the incident workflow this runbook documents (states, approvals, handoffs).
  BCM-PLT-006:
    responsibility: Primary detection source (health checks, telemetry) that triggers most incidents.
  BCM-PLT-007:
    responsibility: Every incident action (mitigation, rollback, restore, access grant) must be traceable via audit events.
  BCM-ORG-001:
    responsibility: Tenant scope of the incident must be established early (see tenant-impact-triage-runbook.yaml).
  BCM-PLT-001:
    responsibility: Emergency break-glass access, if used, is an IAM-governed action requiring post-hoc audit review.

severity_classification:
  - level: P1_CRITICAL
    definition: Full outage, data integrity risk, or a security/tenant-isolation breach affecting any tenant.
    response_target: immediate_all_hands
  - level: P2_HIGH
    definition: Partial outage or degraded functionality affecting one or more tenants, no data integrity risk confirmed.
    response_target: within_1_hour
  - level: P3_WARNING
    definition: Isolated or non-customer-facing degradation, SLO at risk but not yet breached.
    response_target: within_1_business_day

iam_and_audit:
  required_permissions:
    - platform:incident:manage
  minimum_role: platform_operations_on_call_escalating_to_release_manager_for_P1
  audit_expectation: >
    Every mitigation, access grant, rollback trigger or restore trigger taken during the incident
    must be captured in the incident evidence bundle (see evidence-collection-runbook.yaml) and,
    once BCM-PLT-009 automation exists, as native audit events.

prerequisites:
  - id: PRE-001
    name: observability-runbook.yaml and health-readiness-liveness-runbook.yaml have been run to confirm the signal is real
    required_for: incident_declaration
  - id: PRE-002
    name: Access to run backup/restore/rollback runbooks if mitigation requires them
    required_for: mitigation

procedure:
  - id: INC-STEP-001
    name: Detect and confirm
    detail: >
      Run observability-runbook.yaml and health-readiness-liveness-runbook.yaml. Do not declare an
      incident on a single unconfirmed alert; confirm with at least one independent signal
      (health probe plus log/metric, or two consecutive probe failures).
  - id: INC-STEP-002
    name: Classify severity
    detail: Assign P1/P2/P3 per severity_classification above.
  - id: INC-STEP-003
    name: Establish tenant impact scope
    reference: tenant-impact-triage-runbook.yaml
    detail: Determine whether the incident is single-tenant, multi-tenant or platform-wide before choosing mitigation.
  - id: INC-STEP-004
    name: Contain
    detail: >
      Apply the narrowest effective mitigation first: a tenant-specific feature flag disable
      (BCM-PLT-002) is preferred over a full rollback; a full rollback is preferred over a database
      restore, per the escalation order below.
  - id: INC-STEP-005
    name: Choose and execute mitigation
    escalation_order:
      - tenant_specific_feature_flag_disable
      - application_rollback_to_previous_image_digest
      - database_restore_from_verified_backup
    references:
      - rollback-incident-handoff-runbook.yaml
      - restore-runbook.yaml
  - id: INC-STEP-006
    name: Verify mitigation
    reference: health-readiness-liveness-runbook.yaml
    detail: Re-run health/readiness checks and a relevant smoke_validation entry from local-solution-runbook.yaml (or its environment equivalent) after mitigation.
  - id: INC-STEP-007
    name: Collect evidence continuously
    reference: evidence-collection-runbook.yaml
    detail: Evidence collection runs in parallel with steps 1-6, not only at the end.
  - id: INC-STEP-008
    name: Declare incident resolved and schedule post-incident review
    reference: post-incident-review-runbook.yaml

success_criteria:
  - Incident detected, classified, contained with the narrowest effective mitigation, and verified resolved within the response_target for its severity.
  - Full evidence trail exists from detection through resolution.

failure_criteria:
  - Mitigation is applied without first establishing tenant-impact scope.
  - A rollback or restore is executed without following rollback-incident-handoff-runbook.yaml or restore-runbook.yaml.
  - No post-incident review is scheduled for a P1 or P2 incident.

evidence_expected:
  - Timeline of detection, classification, mitigation steps taken, verification results and resolution time, per evidence-collection-runbook.yaml.

responsible_role: platform_operations_on_call

next_action_if_failed: >
  If mitigation does not resolve the incident within the response_target, escalate severity one
  level and broaden the response (add release manager, then product owner, per
  environment-matrix.yaml approval_required chains for staging/prod). If the incident implicates
  potential data integrity or breach, treat evidence preservation as equally urgent to mitigation
  per evidence-collection-runbook.yaml.

related_runbooks:
  - observability-runbook.yaml
  - health-readiness-liveness-runbook.yaml
  - tenant-impact-triage-runbook.yaml
  - rollback-incident-handoff-runbook.yaml
  - restore-runbook.yaml
  - evidence-collection-runbook.yaml
  - post-incident-review-runbook.yaml

known_gaps_and_forward_pointers:
  - gap: No alerting backend pages an on-call operator automatically; incident detection today is manual, driven by running observability-runbook.yaml.
    forward_pointer: >-
      COM-MOD-012-BE-001 closed without an alerting backend; tracked as TD-OBS-001 (distributed
      trace export, provisioned Grafana/Prometheus/Loki stack and SLO/SLA alerting backend), owned
      by a future dedicated observability-infrastructure backlog item.
  - gap: No incident-tracking system integration exists; this runbook's evidence trail is the record of truth until one is adopted.
    forward_pointer: BCM-PLT-009 workflow automation.

closure:
  backlog_item: COM-MOD-012-OPS-002
  status: active
