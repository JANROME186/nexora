artifact:
  id: HOP-RUNBOOK-RESTORE-001
  type: operational-runbook
  name: Database Restore Runbook
  version: 1.0.0
  status: active
  backlog_item: COM-MOD-012-OPS-002
  module: COM-MOD-012 Platform Hardening and SaaS Operations
  human_readable: restore-runbook.md
  machine_readable: restore-runbook.yaml
  owner: Nexora Platform Operations
  date: 2026-07-22

purpose: >
  Restore a PostgreSQL backup produced by backup-runbook.yaml into a verification target, and
  rehearse restore procedures before they are needed in a real incident. Satisfies
  deployment-readiness-checklist.yaml's DEP-POST-004 (latest restore rehearsal evidence attached)
  and rollback_strategy.database.required_controls.restore_runbook_reference in
  production-deployment-strategy.yaml. A restore is always rehearsed against an isolated target
  first; restoring directly over a live database is an explicit, separately-approved incident
  action, not the default path.

applicable_environments:
  local:
    tooling: pg_restore_via_docker_exec_into_isolated_database
    executable_today: true
  dev:
    tooling: pg_restore_or_managed_snapshot_restore
    executable_today: false
  qa:
    tooling: pg_restore_or_managed_snapshot_restore
    executable_today: false
  staging:
    tooling: pg_restore_full_rehearsal_required_before_prod_promotion
    executable_today: false
  prod:
    tooling: pgBackRest_or_equivalent_open_source_point_in_time_recovery
    executable_today: false

capability_traceability:
  BCM-ORG-001:
    responsibility: A full-database restore affects every tenant; tenant isolation must be re-verified after restore (see tenant-impact-triage-runbook.yaml).
  BCM-PLT-007:
    responsibility: The restore action, its reason and its scope must be recorded as an audit event once BCM-PLT-009 automates it.
  BCM-PLT-009:
    responsibility: Owns the eventual workflow/approval gate around production restore execution.
  BCM-PLT-001:
    responsibility: Restore into a live target requires the platform_operations or release_manager role; a compromised-credential incident is the one scenario where restore may run under emergency break-glass access per production-deployment-strategy.yaml configuration_precedence.

iam_and_audit:
  required_permissions:
    - platform:restore:execute
  minimum_role: platform_operations_or_release_manager
  approval_required_for_live_target: product_owner_and_operations_owner (mirrors staging/prod approval_required in environment-matrix.yaml)
  audit_expectation: Record actor, timestamp, backup artifact used (path + checksum), restore target and outcome.

prerequisites:
  - id: PRE-001
    name: A verified backup artifact exists (see backup-runbook.yaml BACKUP-STEP-005)
    required_for: any_restore
  - id: PRE-002
    name: An isolated restore target (a separate database/container) for rehearsal, distinct from the live database
    required_for: rehearsal_restore
  - id: PRE-003
    name: Explicit approval recorded before restoring into any live shared/staging/prod target
    required_for: live_restore

procedure:
  - id: RESTORE-STEP-001
    name: Create an isolated verification database inside the running PostgreSQL container
    working_directory: 07-implementation
    command: docker exec hop-local-postgres createdb -U hop hop_restore_verify
    expected_result: Database hop_restore_verify created.
  - id: RESTORE-STEP-002
    name: Restore the backup artifact into the isolated verification database
    working_directory: 07-implementation
    command: docker exec hop-local-postgres pg_restore -U hop -d hop_restore_verify --clean --if-exists /tmp/hop-backup-<timestamp>.dump
    expected_result: pg_restore completes with 0 fatal errors (warnings about missing objects on an empty target are expected).
  - id: RESTORE-STEP-003
    name: Verify row counts on a sample of tenant-scoped tables against the pre-backup source
    working_directory: repository_root
    command: docker exec hop-local-postgres psql -U hop -d hop_restore_verify -c "SELECT count(*) FROM identity.user_accounts;"
    expected_result: Row count is consistent with the backup's known-good baseline.
  - id: RESTORE-STEP-004
    name: Drop the verification database after successful rehearsal
    working_directory: 07-implementation
    command: docker exec hop-local-postgres dropdb -U hop hop_restore_verify
    expected_result: Verification database removed; no residual data outside the intended evidence artifacts.
  - id: RESTORE-STEP-005
    name: (Live restore only, with recorded approval) Stop the backend, restore into the live database, restart, then run tenant-impact-triage-runbook.yaml
    reference: tenant-impact-triage-runbook.yaml
    when: An incident requires restoring the actual live database, not a rehearsal.

success_criteria:
  - Restore rehearsal completes without fatal errors and sample row counts match the known-good baseline.
  - For a live restore, the backend passes health-readiness-liveness-runbook.yaml and tenant-impact-triage-runbook.yaml immediately after restart.

failure_criteria:
  - pg_restore reports fatal errors or the target database is left in an inconsistent state.
  - Post-restore row counts diverge from the expected baseline without an explained, approved data-loss window.
  - A live restore is executed without recorded approval.

evidence_expected:
  - Restore command output, row-count verification results, timestamp, operator identity, and (for live restores) the approval record and the tenant-impact-triage-runbook.yaml result.

responsible_role: platform_operations_on_call_with_release_manager_approval_for_live_targets

next_action_if_failed: >
  If rehearsal fails, do not proceed with the deployment or migration that required a restorable
  backup; treat the backup itself as unverified and re-run backup-runbook.yaml. If a live restore
  fails mid-incident, escalate immediately within incident-response-runbook.yaml and consider the
  next-most-recent verified backup.

related_runbooks:
  - backup-runbook.yaml
  - rollback-incident-handoff-runbook.yaml
  - tenant-impact-triage-runbook.yaml
  - incident-response-runbook.yaml

known_gaps_and_forward_pointers:
  - gap: No automated restore-rehearsal schedule exists; rehearsal is manual and on-demand.
    forward_pointer: COM-MOD-012-BE-001 and BCM-PLT-009 workflow automation.
  - gap: No point-in-time recovery (PITR) capability is configured; only full-dump restore is exercised.
    forward_pointer: adoption of pgBackRest or equivalent WAL-archiving tool for staging/prod.

closure:
  backlog_item: COM-MOD-012-OPS-002
  status: active
