artifact:
  id: HOP-ONB-GUIDE-007
  type: training-human-validation-acceptance-specification
  name: HOP Initial Training, Human Validation and Acceptance Specification
  version: 1.0.0
  status: approved
  human_readable: initial-training-human-validation-and-acceptance-guide.md
  machine_readable: initial-training-human-validation-and-acceptance-guide.yaml
  backlog_item: COM-MOD-016-DOC-001

training_roles:
  - ADMIN
  - FRONT_DESK
  - LAB_TECH
  - MEDICAL_VALIDATOR
  - QUALITY_MANAGER
  - DOCTOR

human_in_the_loop_rules:
  no_autonomous_medical_release: true
  dual_validation_required: true
  immutable_released_reports: true
  cashier_variance_supervisory_override: true

parallel_run:
  minimum_duration_days: 5
  discrepancy_tolerance_clinical: 0
  discrepancy_tolerance_financial: 0.00

acceptance_criteria:
  - staff_training_completed
  - parallel_run_zero_discrepancies
  - data_reconciliation_signed_off
  - technical_security_verified
  - support_hypercare_handed_over
  - formal_acceptance_executed

traceability:
  capabilities:
    - BCM-ORG-001
    - BCM-PLT-007
  open_source_first: true
  agent_agnostic: true
