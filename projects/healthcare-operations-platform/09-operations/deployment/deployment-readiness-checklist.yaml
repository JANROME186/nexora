artifact:
  id: HOP-OPS-DEPLOY-CHECK-001
  type: deployment-readiness-checklist
  name: HOP Deployment Readiness Checklist
  version: 1.0.0
  status: approved
  backlog_item: COM-MOD-012-OPS-001
  human_readable: deployment-readiness-checklist.md
  machine_readable: deployment-readiness-checklist.yaml

pre_deployment:
  - id: DEP-PRE-001
    check: Source branch points to the intended release commit.
    evidence: git_commit_sha
  - id: DEP-PRE-002
    check: All stack quality gates pass for changed deployment units.
    evidence: qa_and_security_quality_evidence
  - id: DEP-PRE-003
    check: Vulnerability scans across all severities have zero unresolved findings.
    evidence: owasp_dependency_check_npm_audit_trivy_reports
  - id: DEP-PRE-004
    check: SBOM is generated for backend and containerized artifacts.
    evidence: cyclonedx_or_compatible_sbom
  - id: DEP-PRE-005
    check: Database migration dry-run completed.
    evidence: migration_report
  - id: DEP-PRE-006
    check: Rollback and restore commands are attached.
    evidence: rollback_plan

deployment:
  - id: DEP-RUN-001
    check: Images or bundles are pulled by immutable digest or release id.
  - id: DEP-RUN-002
    check: Environment variables and secrets are loaded from approved providers.
  - id: DEP-RUN-003
    check: Health, readiness and liveness probes pass.
  - id: DEP-RUN-004
    check: Tenant isolation smoke checks pass.
  - id: DEP-RUN-005
    check: API gateway policy, CORS, CSP, HSTS and rate limits are active.

post_deployment:
  - id: DEP-POST-001
    check: Smoke tests pass for backend, employee portal, public website, patient portal, doctor portal and mobile compatibility paths when applicable.
  - id: DEP-POST-002
    check: Metrics, logs and traces are visible with tenant and correlation context.
  - id: DEP-POST-003
    check: Audit events exist for deployment, migration and privileged operations.
  - id: DEP-POST-004
    check: Backup schedule and latest restore rehearsal evidence are attached.
  - id: DEP-POST-005
    check: Release evidence is archived in the document management capability.

closure:
  next_backlog_item: COM-MOD-012-OPS-002
  required_status_to_close: all_applicable_checks_passed_or_explicitly_not_applicable
