rules:
  - Healthcare Operations Platform is a project under Nexora.
  - This folder is the boundary for HOP-specific artifacts.
  - HOP project root must contain only numbered folders plus project control files.
  - Nexora framework standards are inherited from ../../nexora-framework/.
  - HOP source artifacts must remain agent agnostic and free of named-agent requirements.
  - Agent-executable artifacts must have YAML machine-readable files and Markdown human-readable files when applicable.
  - BUSINESS_REQUIREMENT.md remains requester-supplied source material; BUSINESS_REQUIREMENT.yaml is only a structured index derived from it.
  - HOP BUSINESS_REQUIREMENT.md is curated as the business intake template for future Nexora projects.
  - BUSINESS_REQUIREMENT.yaml must be derived from BUSINESS_REQUIREMENT.md using the documented transformation prompt.
  - Agents must resolve the latest business requirement version from 00-intake/business-requirements/BUSINESS_REQUIREMENT_INDEX.yaml before analysis or development.
  - Business requirement changes require impact assessment before derived artifacts or implementation are modified.
  - MVP-MOD-001 development is approved by the MVP development readiness decision; strategic enterprise roadmap items do not block the first module.
  - HOP development after MVP-MOD-001 must follow 06-delivery/commercial-product/HOP_COMMERCIAL_PRODUCT_BACKLOG.yaml.
  - HOP follows Nexora Model Driven Product Engineering.
  - Business Capability Packages are the primary development unit.
  - Modules are roadmap groupings and must not replace capability packages as source of truth.
  - Migration must support simple open ingestion formats that incumbent providers can reasonably export.
  - Marketplace-ready capabilities must use package, offer, entitlement, installation, compatibility and lifecycle models.
  - Optional commercial functionality must not bypass IAM, audit, privacy, clinical authority or financial controls.
  - HOP must prefer open source, self-hostable and standards-based technologies unless an ADR approves an exception.
  - HOP must validate requester-proposed and current stack choices against current stable or LTS open source market practice before release-oriented decisions.
  - HOP must maintain stack-specific quality toolchain baselines and register non-blocking tooling gaps as technical debt.
  - HOP code-changing backlog items must produce security quality evidence with applicable tests, SAST/static analysis, dependency vulnerability checks, secrets scan, coverage and DAST when runnable surfaces exist.
  - HOP must maintain 09-operations/runbooks/local-solution-runbook.md and .yaml as the single integrated local startup, validation and shutdown guide for human reviewers.
  - HOP agents must update or explicitly confirm the integrated local runbook whenever runtime components, ports, variables, startup order, validation commands or review surfaces change.
  - HOP technology reviews must not be constrained permanently by the initial stack; agents must register non-blocking upgrade, migration, dependency, framework or tooling findings in 08-qa/technical-debt/ and remediate gradually when affected components are touched.
  - HOP execution feedback that can improve the Nexora framework must be registered under 08-qa/framework-feedback/.
  - HOP agents may propose central framework backlog items but must not implement framework improvements unless Nexora explicitly assigns them.
  - Generated artifacts must not be edited manually.
  - Architecture changes require ADR.
