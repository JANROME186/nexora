rules:
  - Healthcare Operations Platform is a project under Nexora.
  - This folder is the boundary for HOP-specific artifacts.
  - HOP project root must contain only numbered folders plus project control files.
  - Nexora framework standards are inherited from ../../nexora-framework/.
  - HOP source artifacts must remain agent agnostic and free of named-agent requirements.
  - Agent-executable artifacts must have YAML machine-readable files and Markdown human-readable files when applicable.
  - BUSINESS_REQUIREMENT.md remains requester-supplied source material; BUSINESS_REQUIREMENT.yaml is only a structured index derived from it.
  - HOP BUSINESS_REQUIREMENT.md is curated as the business intake template for future Nexora projects.
  - BUSINESS_REQUIREMENT.yaml must be derived from BUSINESS_REQUIREMENT.md using the documented transformation prompt.
  - Agents must resolve the latest business requirement version from 00-intake/business-requirements/BUSINESS_REQUIREMENT_INDEX.yaml before analysis or development.
  - Business requirement changes require impact assessment before derived artifacts or implementation are modified.
  - MVP-MOD-001 development is approved by the MVP development readiness decision; strategic enterprise roadmap items do not block the first module.
  - HOP development after MVP-MOD-001 must follow 06-delivery/commercial-product/HOP_COMMERCIAL_PRODUCT_BACKLOG.yaml.
  - HOP follows Nexora Model Driven Product Engineering.
  - Business Capability Packages are the primary development unit.
  - Modules are roadmap groupings and must not replace capability packages as source of truth.
  - Migration must support simple open ingestion formats that incumbent providers can reasonably export.
  - Marketplace-ready capabilities must use package, offer, entitlement, installation, compatibility and lifecycle models.
  - Optional commercial functionality must not bypass IAM, audit, privacy, clinical authority or financial controls.
  - HOP must prefer open source, self-hostable and standards-based technologies unless an ADR approves an exception.
  - HOP must validate requester-proposed and current stack choices against current stable or LTS open source market practice before release-oriented decisions.
  - HOP must maintain stack-specific quality toolchain baselines and register non-blocking tooling gaps as technical debt.
  - HOP code-changing backlog items must produce security quality evidence with applicable tests, best-practice and coding-standard checks, duplicate-code checks, complexity checks, SAST/static analysis, OWASP or equivalent secure-code checks, dependency vulnerability checks across all severities, secrets scan, coverage, message externalization/i18n review and DAST when runnable surfaces exist.
  - HOP OWASP Dependency-Check uses a local advisory database refreshed manually once per day by the project operator or security reviewer. Agents must execute the scan against the database available at execution time and document its path and freshness; refreshing or downloading the NVD database is not a framework or backlog-agent responsibility unless explicitly assigned.
  - HOP functional development was unblocked by HOP-QA-ALIGN-CLOSEOUT; MVP-MOD-005 and MVP-MOD-006 (through MVP-MOD-006-CLOSEOUT) are closed, MVP-MOD-007 Results and Digital Delivery is closed, and MVP-MOD-008 Integration and Migration Readiness is closed. MVP-MOD-008-DEF, MVP-MOD-008-BE-001, MVP-MOD-008-BE-002, MVP-MOD-008-FE-001, MVP-MOD-008-QA-001 and MVP-MOD-008-CLOSEOUT are closed. BE-002 raised backend coverage to 80.49% and registered TD-BE-014/TD-BE-015. FE-001 closed with integration/API-governance/migration employee-portal screens, employee-portal coverage raised from 85.50% to 86.47%, npm audit and Trivy at 0 vulnerabilities, TD-STACK-003 and TD-I18N-002 further reduced, and TD-FE-010 registered for non-blocking generated admin-screen composition warnings. QA-001 confirmed backend quality at 265 tests and 80.49% coverage, employee-portal quality at 101 tests and 86.47% coverage, Trivy/npm/Dependency-Check at 0 vulnerabilities and no coverage regression. COM-MOD-009-BE-001, COM-MOD-009-PORTAL-001, COM-MOD-009-PORTAL-002, COM-MOD-009-APP-001 and COM-MOD-009-QA-001 are closed; COM-MOD-009-APP-001 raised mobile coverage to 99.21% and COM-MOD-009-QA-001 validated channel access/privacy evidence with npm quality, npm audit, and Trivy passing at 0 vulnerabilities. COM-MOD-009-CLOSEOUT is closed. COM-MOD-010-DEF modeled 13 Inventory and Internal Quality capability packages with 14 artifacts each and preserved runtime/coverage baselines because it was definition-only. COM-MOD-010-BE-001 compiled the BCM-INV-001..009 backend outputs as a single inventoryquality Spring Modulith module with 27 REST operations across nine hexagonal sub-packages, JDBC + in-memory dual adapters, first-class code+messageKey error envelope, seven new SCREEN_INVENTORY_* PermissionCode values and 38 new inventory.error.<code> catalog keys; backend line coverage 80.60% -> 82.94% with 308 tests. COM-MOD-010-BE-002 compiled BCM-QLT-001/003/004/005 backend outputs with equipment, calibration, maintenance and internal quality-control APIs, JDBC + in-memory adapters, four schema tables, four quality screen permissions and 16 localized inventory.error.<code> keys; 312 backend tests passed, backend coverage stayed at 82.94%, OWASP Dependency-Check scanned 65 dependencies with 0 vulnerabilities using the local manual database, Trivy reported 0 vulnerability/misconfiguration findings, YAML parse covered 1,583 files and the agent-agnostic scan had 0 findings. COM-MOD-010-FE-001 compiled the employee-portal administration UI for all 13 COM-MOD-010 capability packages, comprising 11 permission-filtered screens, a typed inventoryQualityApi facade over all 27 backend REST operations, and full es-MX/en-US externalization; employee-portal coverage rose from 86.47% to 87.87% with 124 tests (48 test files, 0 failures); npm audit and Trivy fs (vuln/secret/misconfig, all severities) reported 0 findings; TD-FE-010 was materially reduced by implementing its own preferred remediation (a shared DataTable component and a small-sub-component decomposition convention) applied to all 11 new screens with 0 new lint size/complexity warnings; TD-STACK-003 and TD-I18N-002 were further reduced. COM-MOD-010-QA-001 validated end-to-end traceability across all 13 COM-MOD-010 capability packages, fixed a stale backlog_items.custom_rules traceability pointer in the 9 BCM-INV-001..009 traceability.yaml files (was pointing at COM-MOD-010-BE-002/pending; corrected to COM-MOD-010-BE-001/closed) and a stale capability-package-index.yaml roadmap-group pointer, and found and fixed a real backend coverage gap -- a clean rebuild reproducibly measured 81.90% (below the 82.94% floor, 0 backend source changes since BE-002) because BE-002's 4 new JDBC adapters (quality-control/calibration/equipment/maintenance) had no local-database integration test; added InventoryQualityControlsLocalDatabaseTest.java, raising corrected backend coverage to 83.73% (315 tests, 0 failures/errors/skipped). Employee-portal coverage confirmed at 88.24% (floor 87.87%, 124 tests/48 files, 0 failures). OWASP Dependency-Check (65 dependencies), npm audit and Trivy fs (vuln/secret/misconfig, all severities) reported 0 vulnerabilities/secrets/misconfigurations; YAML parse (1,105 files) and agent-agnostic scan passed; git diff --check clean. COM-MOD-010-CLOSEOUT closed the module -- all 13 COM-MOD-010 capability packages (BCM-INV-001..009, BCM-QLT-001/003/004/005) were confirmed module_closed in capability-package-index.yaml and their traceability.yaml files; the technical-debt index was reviewed and found zero open or materially-reduced debt attributable to COM-MOD-010; this was a documentation/registry-only closeout (no source code touched), so backend (83.73%), employee-portal (88.24%), mobile (99.21%), patient-portal (94.11%) and doctor-portal (96.28%) coverage are re-affirmed unchanged rather than re-measured; YAML parse, a stale-pointer sweep and git diff --check were executed for the closeout itself. COM-MOD-011-DEF is closed. All 7 COM-MOD-011 capabilities (BCM-SVC-001/002/003/005, BCM-ATT-001/006, BCM-PLT-005) were confirmed reused from already-modeled/compiled capability packages owned by MVP-MOD-002, MVP-MOD-004 and MVP-MOD-008, with zero new capability package, aggregate or schema created; each package's product_surfaces, openapi-source.yaml, ui-model.yaml, permissions.yaml and traceability.yaml were extended with a public_website surface; TD-BE-015 was materially reduced via a new BCM-PLT-005 RN-007 and RateLimitPolicy.consumerIdentificationMethod field; three pre-existing stale roadmap/status pointers unrelated to this item's own scope were found and corrected in BCM-ATT-001, BCM-ATT-006 and BCM-PLT-005; definition-only, no code implemented, coverage unchanged. COM-MOD-011-BE-001 is closed. It compiled the backend for HOP's anonymous public-website surface -- ten new REST operations under /api/public/** (published-only catalog reads for BCM-SVC-001/002/003/005, BCM-ATT-001 RN-008 anonymous appointment intake, BCM-ATT-006 RN-009 anonymous quotation intake), a new publicweb Spring Modulith module depending only on the new catalogtestconfiguration::catalog-public-read-port and frontdeskcaredelivery::public-intake-port named interfaces, and BCM-PLT-005 RN-007 rate-limit enforcement via a new PublicApiRateLimitInterceptor driven by RateLimitPolicy.consumerIdentificationMethod (closes TD-BE-015). Two additive DDL migrations (ADD COLUMN IF NOT EXISTS) extended the existing rate_limit_policies and appointments schema files. Added the public.error.* and public.rate_limit.* i18n key namespaces in es-MX and en-US (TD-I18N-002 further reduced). Backend line coverage 83.73% -> 83.96% with 324 tests and 0 failures/errors/skipped against a running compose.local.yml PostgreSQL 16 container; OWASP Dependency-Check reported 108 dependencies scanned and 0 vulnerabilities; Trivy fs (vuln/secret/misconfig, all severities) reported 0 findings; YAML parse succeeded for 1,156 files with 0 errors; agent-agnostic scan reported 0 real source-code hits; git diff --check reported 0 whitespace errors. COM-MOD-011-WEB-001 is closed. It compiled the public website frontend at 07-implementation/public-website/ (React 19 + TypeScript 5 strict + Vite 6, following the patient-portal/doctor-portal conventions -- hand-rolled LocaleContext, plain-fetch httpClient, no state-management library, plus a new hand-rolled History-API router instead of a router dependency), consuming the anonymous /api/public/** surface from COM-MOD-011-BE-001 -- published catalog discovery for diagnostic services/tests/panels/preparations (BCM-SVC-001/002/003/005) and public appointment/quotation request intake (BCM-ATT-001 RN-008, BCM-ATT-006 RN-009) with an explicit client-side cooldown for BCM-PLT-005 RN-007's 429 rate-limit responses, since the backend sends no Retry-After header. Deployment identity (tenantId/laboratoryId/branch list) is deployment-owned site configuration since COM-MOD-011-DEF modeled no public branch-directory capability. Added SEO (per-page title/description/canonical/Open Graph metadata, robots.txt, sitemap.xml), accessibility (eslint-plugin-jsx-a11y plus an automated jest-axe regression check wired into npm run test/quality) and privacy (a /privacy notice page, required consent checkboxes on both request forms) foundations, materially reducing TD-UX-002 -- documented responsive breakpoints and an automated accessibility check, the debt's own acceptance criteria -- as the reference pattern for this new module; employee-portal itself was not touched, so the debt is not closed. Established the first coverage baseline for this stack -- 97 tests, 34 test files, 0 failures, 98.61% line/statement coverage, 93.15% branch coverage, 87.70% function coverage. ESLint reported 0 errors and 16 non-blocking warnings; jscpd reported 3.9% duplication, below the 5% threshold; npm audit and Trivy fs (vuln/secret/misconfig, all severities) reported 0 findings; agent-agnostic scan reported 1 false positive (a CSS cursor property) and 0 real hits; git diff --check reported 0 whitespace errors. Verified locally via npm run build && npm run preview (production shell served correctly). Docker later became reachable in the same session, so full live end-to-end verification was then performed against a real backend and Postgres instance for all 10 /api/public/** operations through the real dev proxy; this surfaced and fixed a real pre-existing defect where catalog-test-configuration/schema.sql seed rows used status='PUBLISHED' (uppercase) against the lowercase published domain constant used by every catalog listPublished/getPublishedSnapshot filter, silently hiding every seeded catalog row from published-only views project-wide. Corrected the 10 seed literals to lowercase (no Java source changed) and re-ran backend regression gates clean -- mvn -Pquality -Dhop.local-db-tests=true clean verify (324 tests, 0 failures/errors/skipped, coverage unchanged at 83.96%), checkstyle/pmd/spotbugs/duplicate-finder (0 new violations), OWASP Dependency-Check (65 dependencies, 0 vulnerabilities) and Trivy fs on the backend directory (0 vulnerabilities/secrets/misconfigurations). COM-MOD-011-FE-001 is closed. It compiled the staff-facing content and public-request administration screens in the existing employee portal at 07-implementation/employee-portal/ -- PublicContentReviewScreen consumes the same anonymous /api/public/catalog/**/published endpoints the public website itself calls (rather than the internal catalog-admin API already owned by DiagnosticCatalogScreen), so no tenantId/audit/internal field can leak into the staff view by construction; PublicAppointmentRequestsScreen and PublicQuotationRequestsScreen triage the existing internal /api/care-delivery/appointments and /api/care-delivery/quotations endpoints, filtered client-side to channel=="public_website" and the pending status, with Confirm/Reject and Issue/Reject actions reusing existing confirm/cancel/issue endpoints -- no new backend action endpoint was created. A real defect was found and fixed along the way -- QuotationRequest had no channel field, unlike AppointmentSlot, so public-website-submitted quotation drafts could not be reliably distinguished from staff-initiated ones; added QuotationRequest.channel (mirroring AppointmentSlot's CHANNEL_* constants), an additive nullable care_delivery.quotations.channel column, and QuotationManagementService validation defaulting to channel=employee_portal when omitted (preserving every untouched caller) while startPublic() always stamps channel=public_website regardless of input. This touched the backend, so its full Maven quality profile was re-run -- 327 tests, 0 failures, backend line coverage 83.96% -> 83.99%. 3 new ScreenKey/PermissionCode pairs were added, granted to ADMIN and FRONT_DESK, with navigation tabs hidden (not disabled) for other roles per the IAM permission model; all visible text uses new namespaced es-MX/en-