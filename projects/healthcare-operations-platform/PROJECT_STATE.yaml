        Follow-up validation executed in a compatible local toolchain: Docker/Postgres local,
        Maven 3.9.11 with Java 21, npm run typecheck, npm test, npm run test:coverage, npm run
        build, npm audit and Trivy offline scan all passed. The prior execution-limited QA evidence
