artifact:
  id: TD-QA-001
  type: technical-debt-item
  name: Automate DAST baseline scans for runnable web and API surfaces
  version: 1.0.0
  status: open
  created_date: 2026-07-09

source:
  discovered_during_backlog_item: MVP-MOD-002-QA-001
  module: MVP-MOD-002 Diagnostic Catalog
  evidence: 08-qa/security-quality/MVP-MOD-002-QA-001/security-quality-evidence.yaml

classification:
  category: quality_tooling
  affected_area: integrated_web_and_api_runtime
  risk_level: medium
  blocking: true
  reason_blocking: >
    HOP-QA-ALIGN-004 requires DAST against runnable backend and employee portal
    surfaces before functional development can resume. Manual source review or
    smoke testing cannot replace this executable gate.

current_state:
  issue: OWASP ZAP DAST has not yet been executed against the current local API/UI runtime.
  compensating_control: >
    All-severity dependency, filesystem, secret and misconfiguration scans pass with 0 findings,
    but this does not close DAST.

target_state:
