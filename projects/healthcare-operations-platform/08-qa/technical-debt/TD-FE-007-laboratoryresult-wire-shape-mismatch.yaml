artifact:
  id: TD-FE-007
  type: technical-debt-item
  name: LaboratoryResult wire-shape mismatch between the employee-portal FE type and the real BCM-LAB-006 backend record
  version: 1.0.0
  status: open
  created_date: 2026-07-17

source:
  discovered_during_backlog_item: MVP-MOD-007-FE-001
  module: MVP-MOD-007 Results and Digital Delivery
  evidence: 08-qa/qa/results-and-digital-delivery/MVP-MOD-007-FE-001-validation.yaml

classification:
  category: api_contract_drift
  affected_area: employee_portal_laboratory_result_type
  affected_components:
    - 07-implementation/employee-portal/src/api/types.ts (LaboratoryResult, ResultValue,
      ReferenceRangeSnapshot, AnalyteSnapshot, ProcessingIncident, AmendmentRecord)
    - 07-implementation/employee-portal/src/components/screens/ResultReleaseScreen.tsx
    - 07-implementation/employee-portal/src/components/screens/TechnicalValidationScreen.tsx
    - 07-implementation/employee-portal/src/components/screens/MedicalValidationScreen.tsx
    - 07-implementation/employee-portal/src/components/screens/ResultSearchScreen.tsx
    - 07-implementation/employee-portal/src/api/resultsDeliveryApi.ts
    - 07-implementation/backend/.../laboratoryworkflow/laboratoryresults/domain/LaboratoryResult.java
  risk_level: medium
  blocking: false
  reason_non_blocking: >
    MVP-MOD-007-FE-001's own screen (ResultSearchScreen.tsx) normalizes the real backend response
    into the existing FE LaboratoryResult shape at the API-client boundary
    (resultsDeliveryApi.ts's toLaboratoryResult and its field-mapper helpers), so it renders
    correctly against the real backend today. The three already-closed MVP-MOD-006 screens
    (ResultReleaseScreen, TechnicalValidationScreen, MedicalValidationScreen) are unaffected in
    practice because their tests only ever mock the API-client boundary and never exercise a real
    backend response, so the mismatch has not caused an observed production defect; it is a latent
    risk if those screens are ever pointed at unmocked data.

current_state:
  issue: >
    The employee-portal LaboratoryResult interface (types.ts) declares analyteSnapshots/
    referenceRangeSnapshots/resultValues as arrays, a top-level testDefinitionId, an incidents field
    and a required version: number. The real backend record
    (laboratoryworkflow.laboratoryresults.domain.LaboratoryResult, owned by BCM-LAB-006) instead has
    singular analyteSnapshot/referenceRangeSnapshot/resultValue fields, a branchId and orderId not
    modeled on the FE side, a processingIncidents field (not "incidents"), no version field, and
    nested value objects with different field names (e.g. ReferenceRangeSnapshot.referenceRangeId/
    lowValue/highValue/criticalLowValue/criticalHighValue as strings vs. the FE's rangeRefId/
    normalLow/normalHigh/criticalLow/criticalHigh as numbers; AnalyteSnapshot.analyteId vs. the FE's
    analyteRefId; ProcessingIncident.notes/recordedBy/recordedAt vs. the FE's description/loggedBy/
    loggedAt; ResultAmendment.amendmentReason vs. the FE's reason).
  compensating_control:
    - resultsDeliveryApi.ts (MVP-MOD-007-FE-001) normalizes the real response for
      listReleasedResults/getResultById so ResultSearchScreen.tsx is unaffected.
    - The three MVP-MOD-006 screens that also consume this type call a separate, older API client
      (laboratoryOperationsApi.ts) whose own contract-accuracy was not re-validated by this backlog
      item (out of scope; historical, pre-existing debt).

target_state:
  preferred_open_source_tooling:
    - No new tooling required; either (a) reshape the shared LaboratoryResult FE type and its
      dependents (ResultReleaseScreen.tsx, TechnicalValidationScreen.tsx,
      MedicalValidationScreen.tsx, laboratoryOperationsApi.ts) to match the real backend record
      field-for-field, or (b) apply the same normalization pattern used in
      resultsDeliveryApi.ts to laboratoryOperationsApi.ts so every consumer goes through one
      corrected mapping layer.
  expected_integration_points:
    - 07-implementation/employee-portal/src/api/types.ts
    - 07-implementation/employee-portal/src/api/laboratoryOperationsApi.ts
    - 07-implementation/employee-portal/src/components/screens/ResultReleaseScreen.tsx
    - 07-implementation/employee-portal/src/components/screens/TechnicalValidationScreen.tsx
    - 07-implementation/employee-portal/src/components/screens/MedicalValidationScreen.tsx

remediation:
  strategy: gradual_when_a_future_backlog_item_touches_laboratoryOperationsApi_or_its_screens
  owner: frontend_platform_team
  target_backlog: mvp_mod_006_follow_up_or_next_laboratory_result_ui_backlog_item_not_yet_scheduled
  priority: P2
  recommended_trigger:
    - A future backlog item that touches ResultReleaseScreen.tsx, TechnicalValidationScreen.tsx,
      MedicalValidationScreen.tsx or laboratoryOperationsApi.ts, or that adds a MockMvc/contract
      test exercising these screens against a real backend response.
  acceptance_criteria:
    - The FE LaboratoryResult type (and its nested value-object types) match the real backend
      record field-for-field, or every consumer goes through a single, tested normalization layer.
    - A contract or integration test exists asserting the FE type correctly consumes a real
      (non-mocked) backend LaboratoryResult JSON payload.
