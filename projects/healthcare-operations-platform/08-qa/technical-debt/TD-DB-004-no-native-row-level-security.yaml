artifact:
  id: TD-DB-004
  type: technical-debt-item
  name: Tenant scoping is enforced by application-level WHERE clauses, not PostgreSQL native
    row-level security policies
  version: 1.0.0
  status: open
  created_date: 2026-07-17

source:
  discovered_during_backlog_item: HOP-ENT-FOUND-001
  module: HOP-ENTERPRISE-FOUNDATION-ALIGNMENT
  evidence: 03-architecture/data-architecture/database-architecture.yaml

classification:
  category: database_defense_in_depth_gap
  affected_area: tenant_isolation
  affected_components:
    - 07-implementation/backend/src/main/resources/db/**
  risk_level: low
  urgency: low
  blocking: false
  reason_non_blocking: >
    Every existing JdbcXxxRepository consistently parameterizes tenant_id in its queries
    (spot-checked across multiple modules); native RLS would be defense-in-depth, not a fix for a
    known correctness bug.

current_state:
  issue: No PostgreSQL ROW LEVEL SECURITY policies exist; tenant isolation relies entirely on
    every repository query correctly including a tenant_id predicate.
  compensating_control:
    - Consistent, code-reviewed WHERE tenant_id = ? pattern across all existing repositories.

target_state:
  preferred_open_source_tooling: []
  expected_integration_points:
    - ALTER TABLE ... ENABLE ROW LEVEL SECURITY plus CREATE POLICY statements per tenant-scoped
      table, set via a session variable per connection.

remediation:
  strategy: release_readiness_hardening_backlog_item
  owner: backend_platform_team
  estimated_effort: medium
  estimated_cost_impact: low
  target_backlog: release_readiness_hardening_backlog_item
  dependencies_or_prerequisites:
    - TD-IAM-001 (a real authenticated principal is needed to set the RLS session tenant variable
      safely)
  incremental_remediation_triggers:
    - Approaching release/GA readiness gates (GA-003 security and compliance gate).
  acceptance_criteria:
    - RLS policies enforce tenant isolation at the database layer as defense-in-depth alongside
      existing application-level filtering.
  owner_or_responsible_role: backend_platform_team
