artifact:
  id: TD-FMT-001
  type: technical-debt-item
  name: Transition monolithic YAML task/state artifacts to Markdown frontmatter handoffs
  version: 1.0.0
  status: open
  created_date: 2026-07-24
  updated_date: 2026-07-24

source:
  discovered_during_backlog_item: NXF-CTX-001
  module: Nexora Framework Context Efficient Execution update
  standard: ../../../../nexora-framework/02-standards/standards/context-efficient-execution-standard.yaml

classification:
  category: documentation_format_migration
  affected_area: framework_and_hop_execution_artifacts
  risk_level: high
  blocking: true

current_state:
  issue: >-
    HOP and Nexora Framework contain many large YAML execution/state artifacts created before the
    context-efficient execution standard. These remain valid, but they are expensive for commercial
    agents to preload and can cause stale-pointer drift when agents read broad registries instead
    of compact handoffs.
  affected_artifact_types:
    - backlog execution prompts
    - project state registries
    - source-of-truth registries
    - capability package indexes
    - QA/security evidence indexes
  compensating_control: >-
    Existing YAML remains supported. New backlog handoffs must use compact Markdown with minimal
    frontmatter, and agents must use lazy loading plus targeted rg/read operations.

target_state:
  preferred_formats:
    - Markdown with minimal YAML frontmatter for task inputs, user stories and handoffs.
    - TOML or compact Markdown tables for inventories and concise configuration lists.
  migration_support:
    - Use local Python scripts and optional Ollama models to summarize and convert legacy YAML
      without consuming commercial model tokens.
    - Preserve machine-readability during migration and never delete authoritative YAML until a
      replacement has validation evidence.

remediation:
  strategy: stop_the_line_before_functional_hop_development_resumes
  recommended_trigger:
    - next prompt framework update
    - next module closeout
    - next evidence registry refactor
  acceptance_criteria:
    - New tasks produce <TASK_ID>-summary.md handoffs under 08-qa/handoffs/.
    - New prompt handoffs follow the context-efficient prompt contract.
    - A migration plan identifies which legacy YAML artifacts can be replaced, split or frontmatter-wrapped.
    - Optional Ollama-assisted conversion is validated locally or explicitly marked unavailable without blocking execution.
  latest_evidence:
    backlog_item: NXF-FMT-002
    status: active_blocking
    hop_inventory: ../format-migration/frontmatter-migration-report-projects-healthcare-operations-platform.md
    framework_inventory: ../format-migration/frontmatter-migration-report-nexora-framework.md
