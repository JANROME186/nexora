artifact:
  id: TD-QA-007
  type: technical-debt-item
  name: Malformed/truncated multipart upload caused an unhandled 500 instead of 400 on POST /api/documents
  version: 1.0.0
  status: closed
  created_date: 2026-07-24

source:
  discovered_during_backlog_item: COM-MOD-013-QA-001
  module: COM-MOD-013 Advanced Quality and Compliance
  evidence: 08-qa/security-quality/COM-MOD-013-QA-001/zap-backend-api.json

classification:
  category: backend_error_handling_gap
  affected_area: document_management_multipart_upload
  affected_components:
    - GlobalExceptionHandler
    - documentmanagement.adapter.in.web.DocumentManagementController
  risk_level: medium
  urgency: medium
  blocking: false
  reason_non_blocking: >-
    Found and fully fixed within this same backlog item's DAST re-scan before closure; not left
    open. No information disclosure occurred (verified: the 500 response body was Spring Boot's
    standard generic error JSON, no stack trace or internal detail exposed to the client).

current_state_before_fix:
  issue: >-
    An OWASP ZAP active-scan "Buffer Overflow" probe against POST /api/documents (BCM-PLT-008,
    the compliance-evidence document upload endpoint) abruptly closed the TCP connection mid
    multipart-body transmission. Spring's multipart parsing surfaced this as an
    org.springframework.web.multipart.MultipartException (wrapping the underlying IOException from
    the truncated stream), which GlobalExceptionHandler had no mapping for, so it fell through to
    the default Spring Boot error handler and returned HTTP 500 instead of a client-error status.
  how_found: >-
    OWASP ZAP API scan (zap-api-scan.py) against the full backend /v3/api-docs surface (939 URLs,
    including all 5 COM-MOD-013 endpoint prefixes), run as part of this backlog item's mandatory
    DAST closure. Full scan otherwise reported 117 PASS categories and 0 other WARN/FAIL findings.

fix_applied: >-
  Added GlobalExceptionHandler.handleMultipartException(), mapping
  org.springframework.web.multipart.MultipartException (which also covers
  MaxUploadSizeExceededException for oversized uploads) to HTTP 400 with the same
  "Malformed or invalid request parameter" body used by the existing invalid-parameter handler,
  consistent with this class's established convention (TD-QA-004/005 fixed the same category of
  defect for other input-validation edge cases).

verification: >-
  Added GlobalExceptionHandlerTest.mapsMultipartExceptionToBadRequestBody(), asserting a 400
  response for a MultipartException wrapping a truncated-stream IOException (381 -> 382 backend
  tests, 0 failures). Backend restarted with the fix and the full OWASP ZAP API scan (939 URLs)
  was re-run against the live instance; see
  08-qa/security-quality/COM-MOD-013-QA-001/zap-backend-api.json for the confirming re-scan result.

remediation:
  strategy: closed_by_COM_MOD_013_QA_001_MultipartException_handler_and_DAST_rescan
  owner: backend_team
  estimated_effort: small
  estimated_cost_impact: none
  target_backlog: closed
  acceptance_criteria:
    - POST /api/documents (and any other multipart endpoint) returns 400, not 500, for a malformed
      or abruptly-truncated multipart request body.
    - A regression test exists for the mapping.
    - A live re-scan against the running backend confirms 0 FAIL-NEW/WARN-NEW for this finding.
