artifact:
  id: TD-BE-003
  type: technical-debt-item
  name: Add backend test coverage measurement and gate (JaCoCo)
  version: 1.0.0
  status: materially_reduced
  created_date: 2026-07-09

source:
  discovered_during_backlog_item: MVP-MOD-002-CLOSEOUT
  module: MVP-MOD-002 Diagnostic Catalog
  evidence: 08-qa/qa/catalog-test-configuration/MVP-MOD-002-CLOSEOUT.yaml

classification:
  category: quality_tooling
  affected_area: backend_test_coverage
  affected_components:
    - 07-implementation/backend
  risk_level: medium
  blocking: false
  reason_non_blocking: >
    The backend has a passing automated test suite (42 tests, 0 failures/errors) covering API,
    contract, custom rules, Modulith structure and database-backed behavior. Coverage is currently
    demonstrated by test breadth rather than an instrumented percentage. The employee portal already
    reports coverage. Formal backend coverage measurement is a quality maturity improvement, not an
    MVP blocker.

current_state:
  issue: >
    The backend Maven quality profile now produces an instrumented JaCoCo report. Current measured
    line coverage is 67.47% (confirmed by two independent clean-rebuild runs during
    MVP-MOD-005-CLOSEOUT), below the Nexora final project closure target of 80%.
  compensating_control:
    - 105 backend tests pass under the quality profile with 0 failures and 0 errors.
    - Employee portal reports 80.66% line coverage through Vitest V8 provider (target already met).
  coverage_measurement_correction: >
    MVP-MOD-005-QA-001 originally reported 68.66%, measured via a non-clean multi-run jacoco.exec
    that accumulated hit-marks across separate Maven invocations in the same session. Corrected
    during MVP-MOD-005-CLOSEOUT to the accurate, reproducible clean-rebuild figure: 67.47%,
    unchanged from MVP-MOD-005-BE-002's baseline.

target_state:
  preferred_open_source_tooling:
    - JaCoCo Maven plugin for unit and integration coverage.
  expected_integration_points:
    - backend Maven test/verify phase
    - module closeout aggregate coverage evidence
    - CI coverage gate

remediation:
  strategy: gradual_when_backend_test_infrastructure_is_touched
  owner: backend_platform_team
  target_backlog: next_backend_touching_backlog_item_or_module_closeout
  priority: P1
  recommended_trigger:
    - next backend backlog item that adds or changes backend tests
    - module closeout requiring aggregate backend coverage
    - release readiness coverage gate
  acceptance_criteria:
    - JaCoCo report is generated by the backend build.
    - Each backend-touching iteration preserves 67.47% as the current lower bound until a higher measured baseline is achieved.
    - Backend line coverage improves toward 80% whenever backend tests or code are touched.
    - Backend line coverage reaches at least 80% before final project closure or commercial GA.
    - Changed backend code does not reduce existing coverage.
  latest_evidence:
    backlog_item: HOP-ENT-FOUND-001
    evidence: 08-qa/qa/enterprise-foundation/HOP-ENT-FOUND-001-validation.yaml
    status: materially_reduced
    current_line_coverage_percent: 77.32
    next_iteration_minimum_line_coverage_percent: 77.32
    target_line_coverage_percent: 80
    note: >-
      This item file historically lagged the authoritative technical-debt-index.yaml
      current_stack_baselines figure across several intervening backlog items; updated here to the
      current 77.32% measured during HOP-ENT-FOUND-001. See technical-debt-index.yaml for the
      rolling authoritative figure going forward.
