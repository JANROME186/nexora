artifact:
  id: TD-FE-010
  type: technical-debt-item
  name: Employee-portal generated administration screens exceed function-size and complexity warning thresholds
  version: 1.0.0
  status: open
  created_date: 2026-07-19
  updated_date: 2026-07-19

source:
  discovered_during_backlog_item: MVP-MOD-008-FE-001
  module: MVP-MOD-008 Integration and Migration Readiness
  evidence: 08-qa/qa/integration-and-migration-readiness/MVP-MOD-008-FE-001-validation.yaml

classification:
  category: frontend_maintainability
  affected_area: employee_portal_admin_screen_composition
  affected_components:
    - 07-implementation/employee-portal/src/components/screens/IntegrationEndpointsScreen.tsx
    - 07-implementation/employee-portal/src/components/screens/ApiManagementScreen.tsx
    - 07-implementation/employee-portal/src/components/screens/MigrationJobsScreen.tsx
  risk_level: medium
  urgency: medium
  blocking: false
  reason_non_blocking: >-
    ESLint completed with exit code 0 and no errors; the warnings are maintainability warnings,
    not runtime failures, security findings, dependency vulnerabilities, test failures or coverage
    regressions. The new screens are covered by automated tests and the employee-portal line
    coverage improved from 85.50% to 86.47%.

current_state:
  issue: >-
    MVP-MOD-008-FE-001 added three broad generated administration screens that compile several
    capability operations each. ESLint reports max-lines-per-function warnings for all three and a
    complexity warning for MigrationJobsScreen. Comparable warnings already exist in older
    employee-portal screens, but these new warnings are explicitly registered so they are not
    hidden by the non-blocking lint profile.
  compensating_controls:
    - npm run quality passed with 101 frontend tests, production build, duplication, format and license checks.
    - npm run audit:all passed with 0 vulnerabilities.
    - Trivy filesystem scan over the employee portal reported 0 npm vulnerabilities.
    - Visible labels for the new screens are externalized in es-MX/en-US catalogs.

target_state:
  preferred_remediation: >-
    Decompose generated administration screens into smaller screen sections, form components and
    table/action components while preserving the typed integrationMigrationApi operation facade.
  quality_goal: >-
    New or touched employee-portal screen files should not introduce max-lines-per-function,
    complexity or cognitive-complexity warnings unless a dedicated technical-debt entry is created
    with owner, scope and target backlog.

remediation:
  strategy: gradual_refactor_when_employee_portal_admin_screens_are_next_touched
  owner: frontend_team
  estimated_effort: medium
  estimated_cost_impact: low
  target_backlog: MVP-MOD-008-QA-001_or_next_employee_portal_touch
  dependencies_or_prerequisites:
    - Preserve MVP-MOD-008-FE-001 screen behavior and tests.
  acceptance_criteria:
    - IntegrationEndpointsScreen, ApiManagementScreen and MigrationJobsScreen are decomposed so
      each function satisfies the configured ESLint function-size/complexity warning thresholds.
    - Existing tests remain green and coverage does not regress below the recorded 86.47% employee-portal baseline.
    - No visible text is moved back into component code; es-MX/en-US catalogs remain the source for labels.
