artifact:
  id: TD-IAM-002
  type: technical-debt-item
  name: Permission model is screen-level only; per-action and per-API-operation granularity,
    and the full domain.resource.action.scope grammar from AUTHZ-ARCH-001, remain unmodeled
  version: 1.0.0
  status: materially_reduced
  created_date: 2026-07-17

source:
  discovered_during_backlog_item: HOP-ENT-FOUND-001
  module: HOP-ENTERPRISE-FOUNDATION-ALIGNMENT
  evidence: 03-architecture/security-compliance/iam-permission-model.yaml

classification:
  category: security_foundation_gap
  affected_area: iam_permission_granularity
  affected_components:
    - 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/identityaccess/domain/PermissionCode.java
    - 07-implementation/employee-portal/src/state/permissions.ts
  risk_level: medium
  urgency: medium
  blocking: false
  reason_non_blocking: >
    Corrective closure added EndpointPermissionRegistry, binding backend API paths to capability,
    PermissionCode and HTTP action before controller execution. Remaining scope is finer in-screen
    button-level and domain.resource.action.scope grammar expansion, not the absence of API/action
    mapping.

current_state:
  issue: >
    PermissionCode has 30 capability/screen values (27 plus SCREEN_INTEGRATION_ENDPOINTS,
    SCREEN_API_MANAGEMENT and SCREEN_MIGRATION_JOBS added by MVP-MOD-008-BE-001) and
    EndpointPermissionRegistry maps protected backend API paths to a PermissionCode, HTTP action
    and business capability id. In-screen high-risk buttons still inherit their screen/capability
    permission and do not yet expose a distinct domain.resource.action.scope permission value.
    MVP-MOD-008-BE-001 also confirmed this gap concretely against the finer scope-string model
    (integration.endpoint.manage, api.classification.manage, migration.job.approve, etc.) that
    BCM-PLT-004/BCM-PLT-005/BCM-PLT-010's own permissions.yaml files model: the new capabilities were
    deliberately mapped onto the existing coarse PermissionCode pattern rather than introducing a
    second, parallel authorization mechanism, consistent with reusing established patterns.
  compensating_control:
    - Screen-level filtering already prevents unauthorized navigation to entire feature areas.
    - Backend request-time enforcement now protects mapped API paths with 401/403 decisions.

target_state:
  preferred_open_source_tooling: []
  expected_integration_points:
    - identityaccess/domain/PermissionCode.java (extend with per-action values as needed)
    - Per-screen action buttons in 07-implementation/employee-portal/src/components/screens/

remediation:
  strategy: gradual_when_a_future_backlog_item_adds_or_touches_a_protected_action
  owner: security_architecture_team
  estimated_effort: medium (incremental, per-action, spread across many future backlog items)
  estimated_cost_impact: low
  target_backlog: gradual_when_AUTHZ-ARCH-001_is_promoted_from_Draft_or_a_new_protected_action_ships
  dependencies_or_prerequisites:
    - Future authorization-model promotion if domain.resource.action.scope becomes mandatory.
  incremental_remediation_triggers:
    - A future backlog item adds a new protected action.
    - AUTHZ-ARCH-001 is promoted out of Draft status.
  acceptance_criteria:
    - Every protected backend command/query has its own permission code.
    - Button/action-level UI filtering exists for at least the highest-risk actions (cancel order,
      void sale, release critical result).
  progress_evidence:
    - 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/identityaccess/security/EndpointPermissionRegistry.java
    - 07-implementation/backend/src/test/java/com/nexora/hop/platformfoundation/identityaccess/security/EndpointPermissionRegistryTest.java
  owner_or_responsible_role: security_architecture_team
