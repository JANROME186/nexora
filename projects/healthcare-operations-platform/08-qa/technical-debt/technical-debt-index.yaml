artifact:
  id: HOP-TD-IDX-001
  type: technical-debt-index
  name: HOP Technology Debt Index
  version: 1.0.0
  status: active
  human_readable: README.md
  machine_readable: technical-debt-index.yaml

standard:
  framework_standard: ../../../../nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml
  prompt_playbook: ../../../../nexora-framework/05-prompts/prompts/security-quality-gate-prompts.yaml

purpose: Track HOP technology modernization, migration and enterprise quality debt discovered by iterative quality reviews.

policy:
  initial_stack_is_baseline_not_permanent_constraint: true
  review_required_during:
    - every_code_changing_backlog_item
    - dependency_change
    - module_closeout
    - release_readiness
  remediation_strategy: debt_first_and_gradual_when_affected_components_are_touched
  final_project_closure_requires_no_open_debt: true
  debt_burndown_intensity:
    early_mvp: at_least_one_relevant_debt_item_per_code_changing_iteration
    module_closeout: reduce_multiple_relevant_items_when_open_debt_exists
    release_or_ga: all_debt_closed
  coverage_policy:
    target_line_coverage_percent: 80
    previous_iteration_coverage_is_hard_floor: true
    below_target_requires_improvement_each_iteration: true
    below_target_minimum_relevant_iteration_improvement_percentage_points: 3
    below_target_preferred_relevant_iteration_improvement_percentage_points: 5
    final_project_closure_requires_target: true
    current_stack_baselines:
      backend_java_maven:
        current_line_coverage_percent: 78.51
        source_evidence: 08-qa/qa/results-and-digital-delivery/MVP-MOD-007-CLOSEOUT-validation.yaml
        next_iteration_minimum_line_coverage_percent: 78.51
        final_closure_target_percent: 80
        correction_note: >-
          MVP-MOD-007-QA-001 raised backend line coverage to 78.42%. MVP-MOD-007-CLOSEOUT's
          TD-BE-010 fix added one real unit test for the new SampleReadPort-backed cancellation
          branch, raising it to 78.51% (211 tests, 0 failures/errors) with no regression. Still
          below the final 80% target; future backend iterations must not regress below 78.51% and
          must keep moving toward it.
      frontend_typescript_web:
        current_line_coverage_percent: 85.50
        source_evidence: 08-qa/qa/results-and-digital-delivery/MVP-MOD-007-CLOSEOUT-validation.yaml
        next_iteration_minimum_line_coverage_percent: 85.50
        final_closure_target_percent: 80
        correction_note: >-
          MVP-MOD-007-CLOSEOUT found employee-portal coverage had regressed from the 84.44% floor
          to 84.03%: MVP-MOD-007-PORTAL-001 expanded laboratoryOperationsApi.ts and
          laboratoryResultMapper.ts (shared with the employee portal) without adding a dedicated
          unit test for the API module. Added src/test/laboratoryOperationsApi.test.ts (mirroring
          the existing cashSalesApi.test.ts/frontDeskApi.test.ts pattern), restoring coverage to
          85.50%, above the previous 84.44% floor. Must not regress below 85.50%.
      mobile_typescript_foundation:
        current_line_coverage_percent: 98.87
        source_evidence: 08-qa/qa/results-and-digital-delivery/MVP-MOD-007-CLOSEOUT-validation.yaml
        next_iteration_minimum_line_coverage_percent: 98.87
        final_closure_target_percent: 80
        correction_note: >-
          Re-measured during MVP-MOD-007-CLOSEOUT with no code changes to the mobile app: 98.87%
          (31 tests), consistent with the 97.15% -> 98.87% growth already reflected upstream. No
          regression.
      patient_portal_typescript_web:
        current_line_coverage_percent: 41.93
        source_evidence: 08-qa/qa/results-and-digital-delivery/MVP-MOD-007-CLOSEOUT-validation.yaml
        next_iteration_minimum_line_coverage_percent: 41.93
        final_closure_target_percent: 80
        correction_note: >-
          First-ever coverage measurement for patient-portal, taken during MVP-MOD-007-CLOSEOUT.
          MVP-MOD-007-PORTAL-001 closed this stack with only an application smoke test and never
          recorded a percentage. Tracked by new item TD-FE-008; not a regression since no prior
          floor existed.
      doctor_portal_typescript_web:
        current_line_coverage_percent: 40.62
        source_evidence: 08-qa/qa/results-and-digital-delivery/MVP-MOD-007-CLOSEOUT-validation.yaml
        next_iteration_minimum_line_coverage_percent: 40.62
        final_closure_target_percent: 80
        correction_note: >-
          First-ever coverage measurement for doctor-portal, taken during MVP-MOD-007-CLOSEOUT.
          MVP-MOD-007-PORTAL-001 closed this stack with only an application smoke test and never
          recorded a percentage. Tracked by new item TD-FE-009; not a regression since no prior
          floor existed.
  promote_to_blocking_when:
    - vulnerability_or_secure_code_finding_without_disposition
    - unsupported_runtime_blocks_safe_development
    - quality_gate_cannot_run_without_upgrade
    - enterprise_quality_alignment_blocks_functional_development
    - final_project_closure_requested_with_open_debt
    - final_project_closure_requested_with_any_applicable_stack_below_80_percent_coverage
    - iteration_coverage_decreases_below_previous_baseline

item_path_pattern: 08-qa/technical-debt/<debt-id>-<short-name>.yaml

