artifact:
  id: HOP-TD-IDX-001
  type: technical-debt-index
  name: HOP Technology Debt Index
  version: 1.0.0
  status: active
  human_readable: README.md
  machine_readable: technical-debt-index.yaml

standard:
  framework_standard: ../../../../nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml
  prompt_playbook: ../../../../nexora-framework/05-prompts/prompts/security-quality-gate-prompts.yaml

purpose: Track non-blocking HOP technology modernization and migration debt discovered by iterative quality reviews.

policy:
  initial_stack_is_baseline_not_permanent_constraint: true
  review_required_during:
    - every_code_changing_backlog_item
    - dependency_change
    - module_closeout
    - release_readiness
  remediation_strategy: gradual_when_affected_components_are_touched
  promote_to_blocking_when:
    - critical_or_high_security_risk_without_accepted_risk
    - unsupported_runtime_blocks_safe_development
    - quality_gate_cannot_run_without_upgrade

item_path_pattern: 08-qa/technical-debt/<debt-id>-<short-name>.yaml

entries:
  - id: TD-QA-001
    title: Automate DAST baseline scans for runnable web and API surfaces
    status: open
    risk_level: medium
    blocking: false
    source_backlog_item: MVP-MOD-002-QA-001
    affected_area: integrated_web_and_api_runtime
    file: 08-qa/technical-debt/TD-QA-001-dast-automation.yaml
    remediation_strategy: gradual_when_affected_components_are_touched
  - id: TD-QA-002
    title: Upgrade Trivy scanner version in local and CI quality toolchain
    status: open
    risk_level: low
    blocking: false
    source_backlog_item: MVP-MOD-002-QA-001
    affected_area: vulnerability_secret_misconfiguration_scanning
    file: 08-qa/technical-debt/TD-QA-002-trivy-tool-upgrade.yaml
    remediation_strategy: gradual_when_quality_toolchain_is_touched
  - id: TD-BE-001
    title: Configure Mockito Java agent for future JDK test compatibility
    status: open
    risk_level: low
    blocking: false
    source_backlog_item: MVP-MOD-002-QA-001
    affected_area: backend_test_infrastructure
    file: 08-qa/technical-debt/TD-BE-001-mockito-java-agent.yaml
    remediation_strategy: gradual_when_backend_test_infrastructure_is_touched
