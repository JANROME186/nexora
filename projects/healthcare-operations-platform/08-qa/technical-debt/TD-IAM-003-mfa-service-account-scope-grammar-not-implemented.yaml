artifact:
  id: TD-IAM-003
  type: technical-debt-item
  name: BCM-PLT-001 MFA, service-account credentials and the domain.resource.action.scope permission grammar are not implemented
  version: 1.0.0
  status: open
  created_date: 2026-07-23

source:
  discovered_during_backlog_item: COM-MOD-012-BE-001
  module: COM-MOD-012 Platform Hardening and SaaS Operations
  evidence: 08-qa/qa/platform-hardening-and-saas-operations/COM-MOD-012-BE-001-validation.yaml

classification:
  category: identity_access_capability_gap
  affected_area: identity_access_extensions
  affected_components:
    - 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/identityaccess/security/EndpointPermissionRegistry.java
    - 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/identityaccess/domain/PermissionCode.java
  risk_level: low
  urgency: low
  blocking: false
  reason_non_blocking: >-
    Session-based authentication with role-to-screen permission mapping (RolePermissionCatalog) is
    fully functional and covers every currently-shipped endpoint, including the two added by this
    backlog item. No shipped feature requires MFA, service-account credentials or the finer
    domain.resource.action.scope grammar today.

current_state:
  issue: >-
    COM-MOD-012-DEF modeled action-level scope grammar (domain.resource.action.scope) in
    bcm-plt-001-identity-and-access-management to further reduce TD-IAM-002, plus MFA and
    service-account credential support, as capability extensions. None of the three operations
    compiled by COM-MOD-012-BE-001 (provisionTenant, listTenants/updateTenantStatus,
    getPlatformConfig/evaluateFeatureFlags/updateFeatureFlag) required these extensions, so they
    were not implemented in this backlog item.

target_state:
  preferred_remediation: >-
    Implement MFA (a second factor on HopAuthenticationResolver's session/local-fixture paths),
    service-account credentials (a non-interactive principal type alongside AuthenticatedUserContext),
    and migrate PermissionCode from a flat enum to the domain.resource.action.scope grammar, when a
    future backlog item's operations actually need per-action (not just per-screen) granularity.
  quality_goal: >-
    Extend the IAM model when a concrete operation needs the finer grammar, not speculatively ahead
    of need.

remediation:
  strategy: gradual_when_a_future_backlog_item_next_touches_identityaccess
  owner: backend_team
  estimated_effort: large
  estimated_cost_impact: medium
  target_backlog: a_future_identityaccess_focused_backlog_item
  acceptance_criteria:
    - MFA is enforceable on at least one authentication path.
    - Service-account credentials authenticate without a human session.
    - At least one endpoint is registered against the domain.resource.action.scope grammar instead
      of a flat PermissionCode, without regressing existing screen-level checks.
