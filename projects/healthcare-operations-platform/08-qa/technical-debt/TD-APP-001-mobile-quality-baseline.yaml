  recommended_trigger:
    - HOP-QA-ALIGN-003
    - HOP-QA-ALIGN-006
  acceptance_criteria:
    - Final mobile stack quality baseline is documented.
    - Runnable mobile quality commands or explicit not-applicable rationale are documented in the integrated runbook.
    - Future mobile feature work has a clear closure gate.
