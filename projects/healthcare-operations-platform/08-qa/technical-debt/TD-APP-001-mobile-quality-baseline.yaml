classification:
  category: quality_tooling
  affected_area: mobile_app_quality_profile
  affected_components:
    - 07-implementation/mobile-app
  risk_level: medium
  blocking: false
  reason_non_blocking: >
    The mobile TypeScript foundation now has executable typecheck, lint, test,
    duplicate-code and formatting gates. Native renderer-specific quality gates
    remain active debt for the moment the final mobile stack is selected.

current_state:
  issue: >
    Mobile quality gates are defined for the renderer-agnostic TypeScript foundation.
    Future native implementation still needs native security, package coverage,
    dependency/license and localization gates.

target_state:
