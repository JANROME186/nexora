artifact:
  id: TD-BE-015
  type: technical-debt-item
  name: Rate-limit enforcement is scoped to partner-API-key-bearing requests only
  version: 1.2.0
  status: closed
  created_date: 2026-07-18
  closed_date: 2026-07-21

source:
  discovered_during_backlog_item: MVP-MOD-008-BE-002
  module: MVP-MOD-008-Integration-and-Migration-Readiness
  evidence: 08-qa/qa/integration-and-migration-readiness/MVP-MOD-008-BE-002-validation.yaml

classification:
  category: incomplete_feature_scope
  affected_area: api_management_rate_limit_enforcement
  affected_components:
    - 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/integrationinteroperability/apimanagement/adapter/in/web/PartnerApiKeyRateLimitInterceptor.java
  risk_level: low
  urgency: low
  blocking: false
  reason_non_blocking: >
    RN-004 requires public and partner API requests exceeding their classification tier's
    rate-limit policy to be rejected. MVP-MOD-008-BE-002 implements a real, working enforcement
    interceptor (PartnerApiKeyRateLimitInterceptor + PartnerApiRateLimiter, a fixed-window counter)
    for requests that present the X-Partner-Api-Key header, which is the only authenticated
    per-consumer identity this backend currently has for any classification tier. Public and
    internal classification requests have no per-consumer credential and no request-path-to-
    ApiSurfaceRegistration.operationId mapping exists yet anywhere in the codebase, so a
    classification-tier-wide limiter cannot be wired without inventing that mapping.

current_state:
  issue: >
    setRateLimitPolicy accepts and persists a policy for "public" and "internal" classifications
    (not only "partner"), but only the "partner" policy is ever consulted, and only when the
    caller supplies a partner key. A flood of public/internal requests is not currently throttled.

target_state:
  preferred_open_source_tooling:
    - Reuse PartnerApiRateLimiter's fixed-window approach once a request-classification identity
      exists for public/internal traffic.
  expected_integration_points:
    - A request-path-to-operationId resolver (mirroring EndpointPermissionRegistry's prefix-match
      convention) so PartnerApiKeyRateLimitInterceptor (or a sibling) can resolve classification for
      unauthenticated/internal callers.

remediation:
  strategy: gradual_before_first_public_api_consumer_onboarding
  owner: platform_team
  estimated_effort: small
  estimated_cost_impact: low
  target_backlog: COM-MOD-011_or_earlier_if_a_public_consumer_is_onboarded_sooner
  dependencies_or_prerequisites: []
  incremental_remediation_triggers:
    - A real public or internal-classification API consumer requires throttling before partner-key
      issuance is relevant to them.
  acceptance_criteria:
    - Public and internal classification requests are throttled against their configured
      RateLimitPolicy without requiring a partner API key.
  owner_or_responsible_role: platform_team

materially_reduced_by_com_mod_011_def:
  date: 2026-07-20
  what_changed: >-
    The incremental_remediation_trigger fired: BCM-SVC-001/002/003/005 and BCM-ATT-001/006 are
    the first real public API consumers, registered by COM-MOD-011-DEF. Rather than leave the
    consumer-identification gap unscheduled, BCM-PLT-005 business-model.yaml gained a new
    RateLimitPolicy.consumerIdentificationMethod field (partner_api_key | ip_address |
    session_token) and business-rules.yaml gained RN-007, explicitly requiring public-classification
    requests to be rate-limited by IP address or session token rather than exempted for lacking a
    PartnerApiKey.
  what_remains: >-
    No runtime code was implemented (COM-MOD-011-DEF is a definition-only backlog item). The
    request-path-to-operationId resolver and the actual IP/session-token counter/window mechanism
    for PartnerApiKeyRateLimitInterceptor (or a sibling) remain a COM-MOD-011-BE-001 implementation
    task; acceptance_criteria above is not yet met.

closed_by_com_mod_011_be_001:
  date: 2026-07-21
  what_changed: >-
    Implemented a new PublicApiRateLimitInterceptor (co-located with
    PartnerApiKeyRateLimitInterceptor inside the apimanagement adapter/in/web package) registered
    by ApiManagementWebConfig under /api/public/**. The interceptor resolves the public-classification
    RateLimitPolicy, derives a consumer bucket from RateLimitPolicy.consumerIdentificationMethod
    (ip_address via X-Forwarded-For|RemoteAddr, session_token via X-Public-Session-Token|session id)
    and reuses PartnerApiRateLimiter's fixed-window counter under a "public::" namespace prefix so
    partner and public buckets are isolated. RateLimitPolicy now persists consumerIdentificationMethod
    end to end (domain record, JDBC repository, in-memory repository, controller DTO, service
    validation, database schema with an additive ALTER TABLE ADD COLUMN IF NOT EXISTS). Verified by
    PublicWebApiTest.publicRateLimitBlocksAnonymousTrafficByIpAddress against a running compose.local.yml
    PostgreSQL container.
  evidence:
    - 08-qa/qa/public-website-and-digital-growth/COM-MOD-011-BE-001-validation.yaml
    - 08-qa/security-quality/COM-MOD-011-BE-001/security-quality-evidence.yaml
  acceptance_criteria_status: met
