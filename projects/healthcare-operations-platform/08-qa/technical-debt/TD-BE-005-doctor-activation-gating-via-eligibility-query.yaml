artifact:
  id: TD-BE-005
  type: technical-debt-item
  name: Doctor referring-eligibility is a computed query, not an activation-gated status field
  version: 1.0.0
  status: open
  created_date: 2026-07-09

source:
  discovered_during_backlog_item: MVP-MOD-003-BE-002
  module: MVP-MOD-003 People and Clinical Master Data
  evidence: 08-qa/qa/people-and-clinical-master-data/MVP-MOD-003-BE-002-validation.yaml

classification:
  category: business_rule_modeling_gap
  affected_area: doctor_management_activation
  affected_components:
    - 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/peopleclinicalmasterdata/doctormanagement/application/DoctorManagementService.java
    - 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/peopleclinicalmasterdata/doctormanagement/DoctorDirectory.java
  risk_level: medium
  blocking: false
  reason_non_blocking: >
    BCM-PER-003 RN-004 ("a doctor cannot become active without at least one verified credential")
    and RN-006 (suspension revokes referring eligibility) are both enforced through a new computed
    method, DoctorManagementService#isEligibleAsReferringDoctor / DoctorDirectory#
    isEligibleAsReferringDoctor, consulted by downstream contexts instead of the raw Doctor#status
    field. The already-shipped MVP-MOD-003-BE-001 generatable behavior sets status=active
    unconditionally at registration (validated by an existing passing test), and changing that
    stored default would be a business-model/generation-plan change outside this backlog's declared
    scope (no capability-package redesign). The eligibility query gives the correct answer for every
    caller that needs it; only the raw status field itself does not reflect credential/suspension
    state.

current_state:
  issue: >
    Doctor#status can read "active" for a doctor with zero verified credentials, or for a doctor
    that still has status=active after a partial-data inconsistency, while the actual referring
    eligibility must be computed separately by combining status, credential verification and
    non-suspension.
  compensating_control:
    - DoctorManagementService.isEligibleAsReferringDoctor(doctorId) and
      DoctorDirectory.isEligibleAsReferringDoctor(doctorId) are the documented, tested single
      source of truth for referring-eligibility; covered by DoctorEligibilityRulesTest (3 tests).
    - Javadoc on both methods calls out the boundary explicitly.

target_state:
  preferred_open_source_tooling: []
  expected_integration_points:
    - bcm-per-003-doctor-management/business-model.yaml (Doctor state machine)
    - bcm-per-003-doctor-management/business-rules.yaml (RN-004 enforcement_point)
    - DoctorManagementService#register / #verifyCredential / #revokeCredential

remediation:
  strategy: gradual_when_doctor_state_machine_is_next_modeled
  recommended_trigger:
    - a future backlog item that revisits BCM-PER-003's business-model.yaml Doctor state machine
    - UI compilation (MVP-MOD-003-FE-001) if it needs a single authoritative "active" badge instead
      of a derived eligibility call
  acceptance_criteria:
    - Either the business-model.yaml Doctor state machine introduces a distinct
      pending_credentialing status set at registration and transitioned to active only on first
      verified credential, or the generation-plan.yaml explicitly documents status as
      administrative-only and eligibility as the enforced concept, with generatable behavior updated
      to match consistently.
    - No caller reads Doctor#status directly to decide referring eligibility once the target state
      lands; all such checks go through the eligibility query.
