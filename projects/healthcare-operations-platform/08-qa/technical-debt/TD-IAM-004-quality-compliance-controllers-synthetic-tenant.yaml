artifact:
  id: TD-IAM-004
  type: technical-debt-item
  name: External Quality/CAPA/Audit/Document-Management controllers assign a synthetic random TenantId instead of the authenticated request tenant
  version: 1.0.0
  status: open
  created_date: 2026-07-23

source:
  discovered_during_backlog_item: COM-MOD-013-QA-001
  module: COM-MOD-013 Advanced Quality and Compliance
  evidence: 08-qa/qa/advanced-quality-and-compliance/COM-MOD-013-QA-001-validation.yaml

classification:
  category: iam_tenant_context_gap
  affected_area: quality_compliance_and_document_management_tenant_traceability
  affected_components:
    - externalqualitycompliance.adapter.in.web.ExternalQualityController
    - externalqualitycompliance.adapter.in.web.CapaManagementController
    - externalqualitycompliance.adapter.in.web.AuditManagementController
    - externalqualitycompliance.adapter.in.web.QualityEventIntakeController
    - documentmanagement.adapter.in.web.DocumentManagementController
  risk_level: medium
  urgency: medium
  blocking: false
  reason_non_blocking: >-
    All 5 endpoint prefixes (/api/quality/external-controls, /api/quality/capa, /api/quality/audits,
    /api/quality/events, /api/documents) are registered in EndpointPermissionRegistry, so
    HopAuthorizationInterceptor still correctly denies unauthenticated/unauthorized requests
    (deny-by-default authorization is intact and unaffected by this finding). The gap is narrower:
    the tenant value attached to created compliance/document records is synthetic, not that access
    control is bypassed. No other HOP module currently reads these records by tenant filter, so no
    cross-tenant data leak has been demonstrated; the risk is evidence traceability/attribution, not
    unauthorized access.

current_state:
  issue: >-
    Every write operation in these 5 controllers (createExternalQualityEvaluation,
    createCapaInvestigation, createAuditSchedule, ingestQualityEvent, uploadDocument) calls
    `new TenantId(UUID.randomUUID().toString())` instead of resolving the tenant bound to the
    current authenticated request. This means every compliance/audit/document record created
    through these endpoints is attributed to a fabricated, unrecoverable tenant identifier rather
    than the real tenant that made the request -- directly undermining this module's own acceptance
    criterion that "Compliance evidence is traceable, searchable and retained." Confirmed this
    pattern is confined to these 5 controllers (grep across the entire backend found no other
    controller constructing a `new TenantId(UUID.randomUUID()...)`); it was introduced by
    COM-MOD-013-BE-001 and is not a pre-existing repository-wide pattern.
  root_cause: >-
    `identityaccess.security.AuthenticatedUserContextHolder` (a request-scoped ThreadLocal
    populated by HopAuthorizationInterceptor with the real userId/tenantId/roleCodes) already
    exists and is used by AuthController, but no business module currently reads from it. Both
    `externalqualitycompliance` and `documentmanagement`'s package-info.java ApplicationModule
    declarations explicitly omit `identityaccess` from `allowedDependencies`, so resolving the
    tenant this way today would require either widening those Spring Modulith module boundaries
    (needs its own review for cycle/encapsulation impact across the whole module graph, since
    identityaccess is a widely-referenced module) or exposing a narrower named-interface
    tenant-context port, most naturally from `sharedkernel` (already an allowed dependency for
    both modules) with `identityaccess`'s interceptor populating both holders. Neither exists yet.
    Attempting this live during a validation-only backlog item was judged too large a slice given
    PlatformFoundationModulithTest must stay green and the fix reasonably spans architecture
    decisions beyond these 5 controllers.

target_state:
  preferred_remediation: >-
    Introduce a small `sharedkernel`-owned tenant-context port (e.g.
    `sharedkernel.security.CurrentTenantContext`, a ThreadLocal holder with no identityaccess
    dependency) that `HopAuthorizationInterceptor` populates alongside
    `AuthenticatedUserContextHolder`. Have the 5 controllers listed above resolve
    `TenantId` from that port when present, falling back to the existing random-UUID behavior only
    when no authenticated context exists (matching AuthController's own `.orElse(...)` pattern),
    so standalone MockMvc unit tests that bypass the interceptor keep working unchanged.
  quality_goal: >-
    Compliance and document-management records created through authenticated requests must carry
    the real requesting tenant, not a fabricated placeholder, so evidence search/export/retention
    workflows are genuinely traceable by tenant.

remediation:
  strategy: gradual_when_a_shared_tenant_context_port_is_next_designed_or_when_these_controllers_are_next_touched
  owner: backend_team
  estimated_effort: medium
  estimated_cost_impact: low
  target_backlog: COM-MOD-013-CLOSEOUT_or_a_dedicated_future_IAM_hardening_backlog_item
  dependencies_or_prerequisites:
    - Decide the shared tenant-context port's home package and update the affected
      ApplicationModule allowedDependencies (or add a sharedkernel-based port) without breaking
      PlatformFoundationModulithTest.
  acceptance_criteria:
    - The 5 listed controllers resolve TenantId from the authenticated request context when one
      is present.
    - Existing standalone MockMvc controller tests continue to pass unchanged (fallback preserved).
    - PlatformFoundationModulithTest remains green after the module-boundary change.
