artifact:
  id: TD-BE-018
  type: technical-debt-item
  name: Marketplace entitlement policy, compatibility strategy, billing adapter and installation
    rollback orchestration are basic implementations only
  version: 1.0.0
  status: open
  created_date: 2026-07-24

source:
  discovered_during_backlog_item: COM-MOD-017-BE-001
  module: COM-MOD-017 Product Marketplace and Extension Packaging
  evidence: 08-qa/qa/product-marketplace-and-extension-packaging/COM-MOD-017-BE-001-validation.yaml

classification:
  category: backend_custom_rule_deferred
  affected_area: marketplace_entitlements_custom_implementation_points
  affected_components:
    - marketplaceentitlements.tenantentitlements.application.EntitlementPolicyEvaluator
    - marketplaceentitlements.compatibilityevaluation.application.CompatibilityEvaluator
    - marketplaceentitlements.billingadapter.adapter.out.adapter.LocalDeterministicBillingAdapter
    - marketplaceentitlements.packageinstallation.application.PackageInstallationService
  risk_level: medium
  urgency: low
  blocking: false
  reason_non_blocking: >-
    Every BCM-PLT-011 openapi-source.yaml operation is functional end to end with no endpoint
    responding unimplemented; every RN-MKT-001..006 invariant is enforced at its current basic
    level (capability-mapping-required submission, active-entitlement-gated activation, rollback
    checkpoint preservation, provider-agnostic billing boundary). No module or runbook depends on
    the deeper policy sophistication named below to function today.

current_state:
  issue: >-
    generation-plan.yaml names five custom_implementation_points for BCM-PLT-011: a central
    entitlement policy evaluator, a billing provider adapter boundary, a compatibility evaluation
    strategy, installation rollback orchestration and runtime feature-availability integration
    with IAM and menu generation. COM-MOD-017-BE-001 compiled a basic, correct implementation of
    each (entitlement existence/expiry check only, out of entitlement-policy.yaml's full 8-step
    evaluation_order; platform_version-only compatibility comparison, out of 9 modeled dimensions;
    a local deterministic billing adapter with no real provider integration or retry/idempotency;
    single-checkpoint rollback with no multi-step InstallationStep audit trail) sufficient for
    every generated REST operation to be functional, but did not implement the full sophistication
    each custom_implementation_point names. Runtime feature-availability integration with IAM
    permission evaluation and employee-portal menu generation was not started at all.

target_state:
  preferred_remediation: >-
    Implement the full entitlement-policy.yaml evaluation_order (tenant_status, package_status,
    license_status, compatibility_status, iam_permission, feature_flag, clinical_safety_control,
    usage_limit) in EntitlementPolicyEvaluator; extend CompatibilityEvaluator across the remaining
    8 compatibility.yaml dimensions; replace LocalDeterministicBillingAdapter's boundary with a
    real or more sophisticated provider-agnostic adapter including retry/idempotency mirroring
    FiscalAdapterPort/IntegrationAdapterPort's BE-002 maturation pattern; model InstallationStep
    as a persisted audit trail rather than a single rollback-checkpoint field; and wire a
    runtime feature-availability check into IAM permission evaluation and employee-portal menu
    generation so entitlement state actually gates UI navigation, not just backend commands.
  quality_goal: >-
    Match the precedent set by MVP-MOD-005 (fiscal adapter), MVP-MOD-008 (integration adapter) and
    COM-MOD-011 (rate-limit policy), where BE-001 compiled a basic generated boundary and BE-002
    delivered the mature custom-rule implementation.

remediation:
  strategy: implement_as_COM_MOD_017_BE_002_custom_rules_backlog_item
  owner: backend_team
  estimated_effort: large
  estimated_cost_impact: medium
  target_backlog: COM-MOD-017-BE-002
  dependencies_or_prerequisites:
    - COM-MOD-017-BE-001 generated backend outputs (closed).
  acceptance_criteria:
    - EntitlementPolicyEvaluator implements the full entitlement-policy.yaml evaluation_order.
    - CompatibilityEvaluator evaluates all 9 compatibility.yaml dimensions.
    - Billing adapter boundary supports retry/idempotency without becoming a domain source of truth (INV-MKT-003 preserved).
    - Installation rollback preserves a real multi-step audit trail, not a single checkpoint field.
    - A runtime feature-availability check gates at least one IAM permission or employee-portal menu decision.
