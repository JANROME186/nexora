artifact:
  id: TD-DEF-001
  type: technical-debt-item
  name: Quotation-to-Sale conversion path deferred until MVP-MOD-005 models the Sale aggregate
  version: 1.0.0
  status: closed
  created_date: 2026-07-15
  closed_date: 2026-07-16

source:
  discovered_during_backlog_item: MVP-MOD-004-DEF
  module: MVP-MOD-004 Front Desk and Care Delivery
  evidence: 08-qa/qa/front-desk-care-delivery/MVP-MOD-004-DEF-validation.yaml

classification:
  category: capability_scope_boundary
  affected_area: quotation_management_conversion_lifecycle
  affected_components:
    - 01-product-definition/business-capabilities/packages/bcm-att-006-quotation-management/business-model.yaml
    - 01-product-definition/business-capabilities/packages/bcm-att-006-quotation-management/processes.yaml
    - 01-product-definition/business-capabilities/packages/bcm-att-006-quotation-management/traceability.yaml
  risk_level: low
  blocking: false
  reason_non_blocking: >
    BCM-ATT-006 Quotation Management fully satisfies its MVP-MOD-004 scope
    by converting an accepted quotation into a diagnostic order through
    BCM-LAB-001 CreateDiagnosticOrder. Converting a quotation directly into a
    Sale is not required for Front Desk and Care Delivery; it becomes
    relevant only once MVP-MOD-005 Cashier and Billing Request implements
    the cash-sales Sale aggregate (AGG-010).

current_state:
  issue: >
    Resolved by MVP-MOD-005-BE-001. CashierOperationsService can now create a
    Sale from an accepted quotation and captures sale lines and totals into the
    CashSales aggregate model.
  compensating_control:
    - CashSalesApiTest covers creating a sale from an accepted quotation and cancelling it before payment.
    - MVP-MOD-005-BE-001 QA evidence records the closure.

target_state:
  preferred_open_source_tooling: []
  expected_integration_points:
    - bcm-att-006-quotation-management/business-model.yaml (QuotationRequest status enum and conversion commands)
    - bcm-att-006-quotation-management/processes.yaml (new ConvertQuotationToSale process)
    - future MVP-MOD-005 Sale aggregate business-model.yaml

remediation:
  strategy: closed_by_MVP_MOD_005_BE_001_sale_from_accepted_quotation
  recommended_trigger:
    - completed
  acceptance_criteria:
    - bcm-att-006-quotation-management business-model.yaml adds an optional
      Sale-conversion command alongside the existing order-conversion
      command without breaking the order-conversion path validated in
      MVP-MOD-004-DEF.
    - No quotation lifecycle regression for the diagnostic-order conversion
      path already delivered.
  closure_evidence:
    - 08-qa/qa/cashier-and-billing-request/MVP-MOD-005-BE-001-validation.yaml
    - 07-implementation/backend/src/test/java/com/nexora/hop/platformfoundation/cashsales/CashSalesApiTest.java
