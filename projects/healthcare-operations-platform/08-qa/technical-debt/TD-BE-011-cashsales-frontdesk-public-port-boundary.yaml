artifact:
  id: TD-BE-011
  type: technical-debt-item
  name: CashSales depends on open FrontDeskCareDelivery internals instead of stable public ports
  version: 1.0.0
  status: open
  created_date: 2026-07-16

source:
  discovered_during_backlog_item: MVP-MOD-005-BE-001
  module: MVP-MOD-005 Cashier and Billing Request
  evidence: 08-qa/qa/cashier-and-billing-request/MVP-MOD-005-BE-001-validation.yaml

classification:
  category: modular_architecture_boundary
  affected_area: cashsales_frontdesk_module_boundary
  affected_components:
    - 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/cashsales/
    - 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/frontdeskcaredelivery/package-info.java
  risk_level: medium
  blocking: false
  reason_non_blocking: >
    MVP-MOD-005-BE-001 requires creating Sale records from accepted diagnostic orders and quotations.
    The existing front-desk services expose the required source snapshots but not through a dedicated
    public port or named interface, so the module was temporarily opened to preserve Spring Modulith
    verification while keeping the capability functional and tested.

current_state:
  issue: >
    CashSales reads DiagnosticOrderManagementService and QuotationManagementService directly from
    FrontDeskCareDelivery. This keeps the backend usable but relaxes the preferred module boundary.
  compensating_control:
    - Spring Modulith verification passes with an explicit Type.OPEN declaration.
    - CashSales does not mutate front-desk, patient or catalog aggregates.
    - The source handoff is covered by CashSalesApiTest and full backend quality gates.

target_state:
  preferred_open_source_tooling:
    - Spring Modulith named interfaces
    - ArchUnit module-boundary checks
  expected_integration_points:
    - frontdeskcaredelivery public source snapshot port for diagnostic orders
    - frontdeskcaredelivery public source snapshot port for quotations
    - cashsales application services depending only on public ports

remediation:
  strategy: gradual_when_cashsales_or_frontdesk_module_boundary_is_next_touched
  recommended_trigger:
    - MVP-MOD-005-BE-002
    - MVP-MOD-005-QA-001
    - future front-desk/cash-sales refactor touching source snapshot handoff
  acceptance_criteria:
    - FrontDeskCareDelivery exposes stable public ports or named interfaces for sale-source snapshots.
    - CashSales no longer depends on internal front-desk application services.
    - frontdeskcaredelivery/package-info.java no longer needs Type.OPEN for cash-sales access.
    - Spring Modulith and ArchUnit checks pass with the stricter module boundary.
