documentation_security_review:
  - control: No secrets or credentials anywhere in COM-MOD-016 scope
    status: verified
    method: >-
      Pattern scan for api_key, apikey, secret, password, token, AKIA, -----BEGIN, "Bearer " across
      09-operations/onboarding/, 09-operations/governance/, 06-delivery/commercial-product/. 0 real
      secrets found; 5 matches are policy/documentation prose (secrets-scan procedure descriptions,
      the Authorization Bearer header convention, password-reset support activity), not values.
  - control: No proprietary agent or vendor lock-in dependencies introduced or referenced
    status: verified
    method: >-
      Pattern scan for Claude, ChatGPT, GPT-4, Anthropic, OpenAI, Copilot, Cursor across the same
      scope. 0 occurrences.
  - control: No forbidden execution-status markers in evidence
    status: verified
    method: >-
      Pattern scan for not_executed, failed, passed_with_execution_limitation,
      closed_with_execution_limitation, blocked_by_missing_toolchain, blocked_by_network,
      blocked_by_unsupported_runtime, exception, limitation across COM-MOD-016 scope. 0 occurrences.
  - control: No real or synthetic patient/personal data in demo or sales assets
    status: verified
    method: >-
      PII-shaped pattern scan (email addresses, SSN/CURP/RFC/passport-style identifiers, named
      individuals) across 06-delivery/commercial-product/. 0 matches; demo-data-checklist.yaml
      describes categories to seed, not embedded records; buyer personas are explicitly fictional.
  - control: No unsupported commercial claims
    status: verified
    method: >-
      Capability claims in commercial-packages/capability-matrix-by-package.yaml and
      sales-enablement assets cross-checked against closed capability package evidence
      (capability-package-index.yaml completed/active groups). pricing-model.yaml's draft status
      and its self-disclaimer were verified present, so no draft figure is asserted as final.
  - control: All corrected pointers resolve to real, existing files
    status: verified
    method: >-
      Every path written into the 4 fixed defects (capability-package-index.yaml,
      7x traceability.yaml, PROJECT_STATE.yaml, SOURCE_OF_TRUTH.yaml) was checked to resolve to an
      existing file on disk (COM-MOD-016-QA-001-validation.yaml/.md and this evidence pair, plus
      the pre-existing COM-MOD-016-COM-001/OPS-001 evidence files).

