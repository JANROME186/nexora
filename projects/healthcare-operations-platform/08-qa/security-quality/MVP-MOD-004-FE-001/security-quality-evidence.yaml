    - id: MIN_CANCELLATION_OVERRIDE_JUSTIFICATION_LENGTH
      value: 15
      location: employee-portal/src/components/screens/DiagnosticOrdersScreen.tsx
      note: Mirrors the backend's own named constant of the same value and meaning
        (DiagnosticOrderManagementService.MIN_CANCELLATION_OVERRIDE_JUSTIFICATION_LENGTH), not
