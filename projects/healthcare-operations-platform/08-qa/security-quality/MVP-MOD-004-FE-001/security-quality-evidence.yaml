  backend_business_error_prose: >-
    Not re-authored on the frontend. Every FrontDeskErrorCodes-prefixed message (e.g.
    RECEPTION_IDENTITY_NOT_CONFIRMED, ORDER_CANCELLATION_OVERRIDE_REQUIRED) is rendered as-is via
    StatusBanner, consistent with every other employee-portal screen; the backend is the single
    source of truth for that prose (HOP-QA-ALIGN-005 baseline).
  single_occurrence_ui_copy: >-
    Headings, button labels and field hints introduced by this backlog item are single-occurrence
    within their own screen and remain inline, consistent with the HOP-QA-ALIGN-005 closure rule
    (only new/changed repeated content must be externalized) and the broader deferred scope tracked
    by TD-I18N-002.

application_defects_found_and_fixed:
  - id: MVP-MOD-004-FE-001-DEFECT-001
    surface: employee-portal (ReceptionScreen.tsx, DiagnosticOrdersScreen.tsx)
    defect: >-
      Success StatusBanners for confirm-identity, price, accept, complete and cancel were rendered
      only inside the same status-gated JSX block whose visibility condition the action's own
      success response flips (e.g. pricing an order moves order.status from draft to priced, which
      hid both the "Price order" button and its "Order priced." success banner in the same
      render). Operators would see the control disappear with no visible confirmation that the
      action succeeded.
    fix: >-
      Each StatusBanner moved outside the status-gated control it was previously co-located with,
      so the banner is rendered unconditionally against its own useAsyncAction status (which is
      independent of order/visit status) and remains visible after the transition it reports on.
    found_by: The new ReceptionScreen.test.tsx / DiagnosticOrdersScreen.test.tsx tests
      (findByText timing out on the expected success message), not manual review.

