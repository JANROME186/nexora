    detail: All three scans (npm audit, OWASP Dependency-Check, Trivy) reported 0 findings.
  coverage_comparison:
    doctor_portal:
      previous_floor_percent: 40.62
      current_coverage_percent: 89.86
      final_target_percent: 80.00
      status: passed
      detail: >-
        Doctor-portal coverage rose from 40.62% to 89.86% (+49.24 points), comfortably
        exceeding the 80% target floor and the 3-5 point minimum iteration improvement.
    backend:
      previous_floor_percent: 80.49
      current_coverage_percent: 80.60
      final_target_percent: 80.00
      status: passed
      detail: Backend coverage improved from 80.49% to 80.60% with no regression.

technical_debt:
  debt_first_action: >-
    TD-FE-009 (doctor portal coverage baseline) was fully closed by rebuilding the doctor-portal
    frontend with real Vitest unit/integration test coverage. TD-IAM-002 (permission
    granularity gap) was materially reduced further with 2 new granular PermissionCode values
    and real per-request ownership enforcement (doctorId match, referral relationship
    verification via the new ReferringDoctorAuthorizationPort). TD-I18N-002 (full localization
    adoption) was materially reduced further by replacing the doctor-portal's wrong-domain
    locale catalog with a complete, correct doctor-domain catalog.
  new_debt_registered:
    - id: TD-FE-011
      title: >-
        patient-portal npm run lint currently fails with 2 pre-existing
        sonarjs/no-hardcoded-passwords errors on its login.password locale keys
      reason: >-
        Discovered while building the doctor-portal's equivalent locale keys; unrelated to this
        backlog item's own changes and out of scope to fix on a closed, already-verified
        deliverable (patient-portal, COM-MOD-009-PORTAL-001). Registered rather than hidden.
      blocking: false
  blocking: []

