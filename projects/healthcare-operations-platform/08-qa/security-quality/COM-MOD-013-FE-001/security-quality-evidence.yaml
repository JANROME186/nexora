  type: security-quality-evidence
  name: COM-MOD-013-FE-001 Security and Quality Evidence
  version: 1.0.0
  status: passed
  captured_on: 2026-07-23

scope: >-
  Employee portal (07-implementation/employee-portal/) Advanced Quality and Compliance administration
  screens: External Quality Controls (BCM-QLT-002), CAPA Management (BCM-QLT-006), Quality Audit
  Management (BCM-QLT-007), Compliance Evidence (BCM-PLT-007 / BCM-PLT-008), and Quality Event Intake,
  plus thin typed API facade (externalQualityComplianceApi.ts), IAM permission updates, and i18n catalogs.

local_toolchain_inventory_loaded: true

open_source_first_check:
  new_dependency_added: false
  stack_reviewed: React 18, TypeScript 5, Vite 6, Vitest, ESLint, jscpd, Prettier, npm audit, Trivy
  vulnerabilities_found: 0
  license_check: passed
  notes: >-
    No new production or development dependencies were added for COM-MOD-013-FE-001. All existing
    dev tooling and runtime libraries remain clean and licensed (MIT 5, UNLICENSED 1).

security_controls:
  authentication_and_authorization:
    screens_gated_by_iam: >-
      All 5 new screens and AuditEventsScreen are gated behind specific PermissionCode values
      (SCREEN_EXTERNAL_QUALITY_CONTROLS, SCREEN_CAPA_MANAGEMENT, SCREEN_AUDIT_MANAGEMENT,
      SCREEN_COMPLIANCE_EVIDENCE, SCREEN_QUALITY_EVENT_INTAKE) mapped 1:1 in SCREEN_TO_PERMISSION.
      Unpermitted navigation tabs are hidden dynamically from non-privileged roles.
    role_assignment: >-
      Added QUALITY_MANAGER role in permissions.ts with access to quality and audit screens.
  destructive_actions_confirmation:
    confirm_dialog_enforcement: >-
      All high-impact state transitions (External QC approve/reject, CAPA close/verify, Audit close,
      Compliance Evidence export, Quality Event link) require explicit user confirmation via
      blocking ConfirmDialog modal components before API calls are dispatched.
  message_externalization:
    hardcoded_ui_strings_added: 0
    locales_covered: [es-MX, en-US]
    namespaced_keys: t.advancedQualityCompliance.*, t.auditEvents.*, t.appShell.tabs.*
  xss_posture: >-
    All user-supplied text fields (descriptions, comments, finding categories, auditor names) are
    rendered safely using React's default JSX text-node escaping. No dangerouslySetInnerHTML is used.

