open_source_first_check:
  new_dependency_added: org.apache.poi:poi-ooxml:5.4.1
  justification: >-
    Explicitly named by bcm-plt-010-open-data-ingestion-and-migration/generation-plan.yaml
    (CUS-MIG-010-01) and by TD-BE-013's target_state as the preferred open-source tooling for XLSX
    row-level parsing. Apache-2.0 licensed, actively maintained. poi-ooxml alone (without
    poi-ooxml-full/poi-scratchpad) is sufficient for reading worksheet rows, keeping the transitive
    footprint to poi, xmlbeans, commons-compress and curvesapi.
  vulnerabilities_found: 0
  license_check: passed (Apache-2.0, compatible)
  dependency_convergence_note: >-
    poi-ooxml's transitive commons-io (2.18.0, plus 2.16.1 via its own commons-compress dependency)
    conflicted with commons-csv's transitive commons-io (2.20.0), failing
    maven-enforcer's dependencyConvergence rule. Resolved by pinning commons-io 2.20.0 (the newest
    of the three) in dependencyManagement, mirroring the existing jackson-databind CVE-pin pattern
    already used in this pom.xml. No functional behavior depends on the pinned version beyond normal
    I/O utility classes.
  alternative_libraries_considered: >-
    None newly evaluated this iteration; Apache POI was already the tool TD-BE-013 named as the
    preferred remediation, carried over from MVP-MOD-008-BE-001's own evaluation.

