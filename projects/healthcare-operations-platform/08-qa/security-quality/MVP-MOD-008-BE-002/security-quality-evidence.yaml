secure_code_review:
  bounded_retry_and_dead_letter: >-
    IntegrationManagementService.retryMessage enforces a hard MAX_RETRY_COUNT ceiling (5) with
    exponential backoff between attempts, preventing unbounded retry storms against the
    IntegrationAdapterPort; an exhausted message is deterministically dead-lettered rather than
    silently retried forever.
  rate_limit_enforcement: >-
    PartnerApiKeyRateLimitInterceptor rejects requests from an unknown or revoked partner key before
    any further processing (401), and throttles requests exceeding their configured
    requests-per-minute policy (429) via an in-memory fixed-window counter with no unbounded growth
    (one counter per active partner key id, replaced each new window).
  domain_command_boundary_preserved: >-
    MigrationDomainCommandPort is the only interaction point commitImport/retryImportExecution use
    to advance an import; its local deterministic implementation never touches any other module's
    repository, storage, or aggregate, preserving INV-MIG-003 by construction, verified by
    PlatformFoundationModulithTest's continued pass.
  structured_error_codes: >-
    Every new error code (INTEGRATION_MESSAGE_DEAD_LETTERED, INTEGRATION_RETRY_NOT_YET_DUE,
    API_DEPRECATION_WINDOW_NOT_ELAPSED, MIGRATION_EXECUTION_ATTEMPTS_EXHAUSTED,
    MIGRATION_DOMAIN_COMMAND_FAILED) is a named constant matching each capability's
    openapi-source.yaml error_model, with a first-class `messageKey` added alongside `code` on every
    response.
  input_validation: jakarta.validation and server-side enum/state-machine checks unchanged and extended consistently for every new command.

