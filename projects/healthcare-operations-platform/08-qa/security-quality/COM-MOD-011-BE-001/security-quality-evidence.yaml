artifact:
  id: HOP-SQ-COM-MOD-011-BE-001
  type: security-quality-evidence
  name: COM-MOD-011-BE-001 Security and Quality Evidence
  version: 1.0.0
  status: passed
  captured_on: 2026-07-21

scope: >-
  Backend implementation of the anonymous public-website surface for BCM-SVC-001/002/003/005,
  BCM-ATT-001, BCM-ATT-006 and BCM-PLT-005, plus real rate-limit enforcement for anonymous public
  traffic (materially closes TD-BE-015).

security_controls:
  authentication:
    public_paths_prefix: /api/public/
    authorization_bypass_mechanism: >-
      HopAuthorizationInterceptor is a no-op for paths not registered in EndpointPermissionRegistry.
      /api/public/** is deliberately not registered, so anonymous access is allowed only to
      published-only catalog reads and prospective-contact request intake endpoints.
    anonymous_traffic_isolation: >-
      Every public controller returns DTOs that omit tenantId, actorId, audit metadata and other
      privileged operational fields. Public appointment/quotation intake never carries a registered
      Patient link and never creates confirmed/issued records.
  rate_limiting:
    partner_classification:
      interceptor: PartnerApiKeyRateLimitInterceptor
      identity: X-Partner-Api-Key header
      status: continues_to_enforce_rn_004
    public_classification:
      interceptor: PublicApiRateLimitInterceptor
      identity: derived from RateLimitPolicy.consumerIdentificationMethod
        (ip_address via X-Forwarded-For|RemoteAddr, session_token via X-Public-Session-Token|
        requested session id)
      status: newly_enforced_by_com_mod_011_be_001
      rejection_response:
        http_status: 429
        code: PUBLIC_RATE_LIMIT_EXCEEDED
        message_key: public.error.public_rate_limit_exceeded
        body_shape: {status, code, messageKey, message, occurredAt}
      test_coverage:
        acceptance_test: PublicWebApiTest.publicRateLimitBlocksAnonymousTrafficByIpAddress
        rate_limit_semantics: fixed-window counter shared with PartnerApiRateLimiter under
          namespace prefix "public::" so partner and public buckets are isolated
  message_externalization:
    hardcoded_error_strings_added: 0
    new_i18n_keys:
      - public.error.public_rate_limit_exceeded
      - public.error.public_catalog_not_published
      - public.error.public_appointment_request_invalid
      - public.error.public_quotation_request_invalid
      - public.error.public_prospective_contact_required
      - public.error.public_channel_forbidden
      - public.rate_limit.identification_method_missing
      - public.rate_limit.window_size_seconds
    locales_covered: [es-MX, en-US, default]
  input_validation:
    request_body_validation: jakarta.validation @Valid + @NotBlank on tenantId, laboratoryId,
      branchId and catalog item references
    published_only_enforcement:
      catalog_read: enforced in CatalogPublicReadAdapter (status == published) and each catalog
        service's listPublished()/getPublishedSnapshot()
      intake_lines: AppointmentSchedulingService.requestFromProspectiveContact and
        QuotationManagementService.startPublic reuse the existing published-catalog validation
    error_handler: PublicWebExceptionHandler maps every InvalidCommand/Conflict/NotFound to the
      shared public error envelope
  cross_module_boundaries:
    catalog_public_read_port: catalog-public-read-port named interface exposes only published-only
      snapshots as records; internal catalog service classes remain private to the
      catalogtestconfiguration module
    frontdesk_public_intake_port: public-intake-port named interface exposes only submit-appointment/
      submit-quotation with a translated PublicIntakeException, isolating the publicweb module from
      internal frontdeskcaredelivery exception types

