security_review_specific_to_this_backlog:
  - topic: One-way identifier hashing for duplicate detection
    finding: PersonNaturalKey.hashIdentifier() uses SHA-256 (JDK MessageDigest) instead of the
      previous Integer.toHexString(hashCode()) approach, removing a weak/collision-prone identifier
      digest from the natural-key matching path. Hashes are used only for equality comparison
      during duplicate scoring, never reversed or exposed as a claimed strong secret-hash (no
      salting, since this is a matching index, not a credential store).
    result: passed
  - topic: Consent revocation immutability
    finding: revokePatientConsent inserts a new PatientConsent row rather than mutating the
      original; JdbcPatientRepository.saveConsent() has no ON CONFLICT clause, so a mutation
      attempt would fail loudly rather than silently succeed. Preserves consent evidence history
      for compliance/audit purposes.
    result: passed
  - topic: Patient merge never deletes data
    finding: mergePatient sets status=MERGED and mergedIntoPatientId on the source record; no
      DELETE is issued anywhere in the merge path. Historical references remain resolvable via the
      merge chain in findSnapshot (bounded by MAX_MERGE_CHAIN_HOPS=10 to prevent an unbounded or
      cyclic lookup from becoming a denial-of-service vector).
    result: passed
  - topic: Tenant isolation in duplicate detection
    finding: PersonDuplicateDetectionEngine, PersonDocumentUniquenessPolicy and
      TenantPeoplePolicyStore all scope every query and every configuration override by tenantId;
      no cross-tenant candidate can be returned or scored.
    result: passed
  - topic: No new externally-reachable configuration surface
    finding: TenantPeoplePolicyStore is an in-process component with no REST endpoint in this
      backlog item (see FWF-HOP-002 framework feedback); tenant policy values can only be changed
      by code calling the store directly (e.g. future tests or a future config capability), not by
      an unauthenticated or under-authorized HTTP caller.
    result: passed

