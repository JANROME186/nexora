  notes: All existing dependencies re-scanned clean; no new dependency introduced by this backlog item.

security_controls:
  resilience_readiness_probe_fix:
    finding: >-
      management.endpoint.health.group.readiness.include was unset, so the default readiness group
      only contained readinessState, not the db HealthIndicator. Readiness reported UP even with
      PostgreSQL stopped, which would cause an orchestrator to keep routing traffic to a
      dead-database pod.
    fix: >-
      Added the include to application-local.yml (the profile with a real DataSource bean).
      Attempting the same change in the base application.yml broke context startup for profiles
      with no DataSource bean (confirmed via a real "Health contributor 'db' ... does not exist"
      failure), so the fix was correctly scoped to application-local.yml only.
    verification: >-
      Live docker stop/start of hop-local-postgres confirmed readiness correctly flips to
      DOWN/503 and back to UP/200; liveness correctly stays UP throughout (no unnecessary restart
      churn). New regression test: ObservabilityReadinessLocalDatabaseTest.
  dast_findings_fixed:
    - id: TD-QA-005
      finding: >-
        A null byte (SQLSTATE 22021) or an oversized string field (SQLSTATE 22001) reaching a JDBC
        statement caused an unhandled 500 (DataIntegrityViolationException) on 6
        laboratoryworkflow worklist endpoints and POST /api/revenue/cashier/sessions. No stack
        trace or internal detail was ever exposed to the client in either case (verified: the
        response body was always the standard Spring Boot default error JSON).
      fix: >-
        GlobalExceptionHandler.handleDataIntegrityViolationException() walks the exception's cause
        chain and remaps to 400 only when the root SQLException's SQLState is in a small,
        explicitly-scoped set (22021, 22001). Every other DataIntegrityViolationException cause
        (e.g. a real 23505 unique-constraint conflict) is deliberately rethrown unchanged -- no
        behavior change to existing conflict handling elsewhere in the codebase.
      regression_tests:
        - GlobalExceptionHandlerTest.mapsInvalidByteSequenceDataIntegrityViolationToBadRequestBody
        - GlobalExceptionHandlerTest.mapsStringDataRightTruncationDataIntegrityViolationToBadRequestBody
        - GlobalExceptionHandlerTest.rethrowsOtherDataIntegrityViolationCausesUnchanged
    - id: TD-QA-006
      finding: >-
        POST /api/auth/assistance returned an unhandled 500 for a nonexistent assistedUserId
        instead of 404, because IdentityAccessExceptionHandler's @RestControllerAdvice was scoped
        (assignableTypes) to only IdentityAccessController, excluding AuthController even though
        both live in the identityaccess module and can both throw
        IdentityEntityNotFoundException.
      fix: >-
        Widened assignableTypes to { IdentityAccessController.class, AuthController.class }. No new
        exception-handling logic added; the existing, already-tested mapping now also covers the
        controller it was missing.
      regression_tests:
        - AuthControllerTest.assistanceForANonexistentAssistedUserReturnsNotFoundInsteadOfServerError
  audit_trail_verification:
    - operation: updateTenantStatus
      action: TenantStatusChanged
      verified: live GET /api/audit/events query confirmed previousStatus/newStatus/reason metadata present
    - operation: updateFeatureFlag
      action: FeatureFlagUpdated
      verified: live GET /api/audit/events query confirmed enabledByDefault/rolloutPercentage/updatedBy metadata present
  header_hardening_reverification:
    control_character_injection: >-
      Attempted CRLF/forged-header-line injection via X-HOP-TENANT-ID confirmed sanitized; no
      forged log line appeared in backend output (RequestObservabilityContextFilter's
      sanitizeForLogging(), unchanged from COM-MOD-012-BE-001).
    traceparent_validation: >-
      A valid W3C traceparent's trace-id segment was correctly reused in X-Trace-Id; a malformed
      traceparent value was correctly discarded and a fresh id minted instead, confirming no
      attacker-controlled value is ever reflected.

