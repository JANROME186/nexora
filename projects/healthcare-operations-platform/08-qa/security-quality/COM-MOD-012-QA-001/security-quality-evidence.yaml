scope: >-
  Integrated performance, resilience and security validation of COM-MOD-012 Platform Hardening and
  SaaS Operations: BCM-ORG-001 tenant operations, BCM-PLT-002 platform configuration and feature
  flags, BCM-PLT-006 observability (Prometheus, health groups, MDC logging), audit trail evidence
  for privileged operations, and the 8-capability traceability/runbook set. Includes a dedicated
  OWASP ZAP DAST pass against the full backend API surface (deferred by COM-MOD-012-BE-001) and the
  employee portal, plus a live backup/restore rehearsal.

