  new_dependency_added: false
  stack_reviewed: >-
    Spring Boot 4.1 / Java 21, Maven, JaCoCo, Checkstyle, PMD/CPD, SpotBugs/FindSecBugs, CycloneDX,
    OWASP Dependency-Check, Trivy 0.72.0, OWASP ZAP (zap-baseline.py, zap-api-scan.py)
