registry_gaps_found_and_corrected:
  - finding: >-
      Employee-portal line coverage had silently regressed from the 84.44% floor to 84.03%.
      MVP-MOD-007-PORTAL-001 expanded laboratoryOperationsApi.ts and laboratoryResultMapper.ts
      (shared with the employee portal) without adding a dedicated unit test for the API module.
    correction: >-
      Added src/test/laboratoryOperationsApi.test.ts covering all 18 exported functions, restoring
      coverage to 85.50%. Corrected in PROJECT_STATE.yaml (project), SOURCE_OF_TRUTH.yaml
      (project) and technical-debt-index.yaml.
  - finding: >-
      Patient-portal and doctor-portal line coverage had never been measured; MVP-MOD-007-PORTAL-001
      closed both stacks with only an application smoke test each.
    correction: >-
      Measured for the first time (41.93%/40.62%). Registered TD-FE-008/TD-FE-009 to track and
      raise toward the 80% target without blocking this closeout.
  - finding: >-
      technical-debt-index.yaml's mobile_typescript_foundation coverage baseline was stale at
      97.15%, never updated after MVP-MOD-007-APP-001 measured 98.87%.
    correction: Corrected to 98.87% with source_evidence pointing at this closeout's own re-measurement.

