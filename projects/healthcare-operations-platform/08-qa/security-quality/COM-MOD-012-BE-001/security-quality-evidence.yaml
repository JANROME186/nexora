artifact:
  id: HOP-SQ-COM-MOD-012-BE-001
  type: security-quality-evidence
  name: COM-MOD-012-BE-001 Security and Quality Evidence
  version: 1.0.0
  status: passed
  captured_on: 2026-07-23

scope: >-
  Backend compilation of BCM-ORG-001 tenant provisioning/listing/status-transition operations, the
  new BCM-PLT-002 Platform Configuration and Feature Flags module, and BCM-PLT-006 observability
  extensions (Prometheus metrics, liveness/readiness health groups, tenant/user/trace MDC logging
  context). Materially reduces TD-IAM-002 and TD-DB-004; further reduces TD-I18N-002. Registers
  TD-BE-016, TD-BE-017 and TD-IAM-003 for honestly-scoped deferred capability-package extensions.

security_controls:
  authentication:
    enforcement_unchanged: >-
      All four tenant-management endpoints and both feature-flag/config endpoints sit under
      /api/platform/**, already covered by HopAuthorizationInterceptor via EndpointPermissionRegistry.
      No authentication mechanism was added or bypassed by this backlog item.
  authorization:
    permission_registry_entries_added:
      - path_prefix: /api/platform/config
        permission: SCREEN_PLATFORM_CONFIGURATION
        capability: BCM-PLT-002
      - path_prefix: /api/platform/feature-flags
        permission: SCREEN_PLATFORM_CONFIGURATION
        capability: BCM-PLT-002
    pre_existing_entry_reused:
      path_prefix: /api/platform/tenants
      permission: SCREEN_TENANTS
      capability: BCM-ORG-001
      note: >-
        listTenants and updateTenantStatus automatically inherit this pre-existing prefix-matched
        rule; no registry change was needed for them.
    deny_by_default: >-
      SCREEN_PLATFORM_CONFIGURATION is granted to ADMIN only via RolePermissionCatalog's
      EnumSet.allOf(PermissionCode.class); every other role is denied by default (no explicit grant
      added).
  privileged_operation_audit:
    - operation: updateTenantStatus
      action: TenantStatusChanged
      mechanism: existing BCM-PLT-007 AuditRecorder.recordSystemEvent, tenant-scoped
      metadata: previousStatus, newStatus, reason
    - operation: updateFeatureFlag
      action: FeatureFlagUpdated
      mechanism: existing BCM-PLT-007 AuditRecorder.recordSystemEvent, platform-scoped (tenantId=null)
      metadata: enabledByDefault, rolloutPercentage, updatedBy
  header_input_hardening:
    finding: >-
      SpotBugs/FindSecBugs SERVLET_HEADER (CWE-807) on the new RequestObservabilityContextFilter,
      which reads X-HOP-TENANT-ID, X-HOP-USER-ID and traceparent request headers.
    mitigation:
      log_injection_prevention: >-
        sanitizeForLogging() strips every Unicode control character (including CR/LF) from
        tenant/user header values and bounds them to 120 characters before they are ever put into
        MDC, preventing a hostile header from forging additional log lines or exhausting log
        storage.
      header_reflection_prevention: >-
        resolveTraceId() only reuses the inbound traceparent trace-id segment when it matches the
        strict W3C Trace Context format (32 lowercase hex characters); any other value is discarded
        and a fresh UUID-derived id is minted instead, so an attacker-controlled value is never
        reflected back in the X-Trace-Id response header.
    test_coverage:
      - RequestObservabilityContextFilterTest.stripsControlCharactersFromTenantAndUserHeadersBeforeLogging
      - RequestObservabilityContextFilterTest.rejectsMalformedTraceparentAndMintsANewTraceIdInstead
    residual_finding_disposition: >-
      SpotBugs continues to report SERVLET_HEADER at low priority (rank 15) because the rule fires
      on any direct header read regardless of downstream handling; the identical rule already fires
      on the pre-existing, accepted HopAuthenticationResolver. quality.failOnViolation=false per the
      project's established policy; the real risk (log/header injection) is closed in code.
  message_externalization:
    hardcoded_error_strings_added: 0
    new_i18n_keys:
      - organizationmanagement.error.entity_not_found
      - organizationmanagement.error.organization_command_invalid
      - organizationmanagement.error.tenant_code_conflict
      - platformconfiguration.error.command_invalid
    locales_covered: [es-MX, en-US, default]
  input_validation:
    request_body_validation: jakarta.validation @Valid + @NotBlank on ProvisionTenantRequest.legalName
      (via service-layer requiredNameText), UpdateTenantStatusRequest.status, UpdateFeatureFlagRequest.flagKey/updatedBy
    tenant_code_uniqueness: pre-check via findTenantByCode plus a database unique index
      (tenants_code_key) as a defense-in-depth backstop against a race condition
    feature_flag_namespace_validation: flagKey must match ^[a-z][a-z0-9]*(\.[a-z0-9_]+)+$
    feature_flag_rollout_bounds: rolloutPercentage must be 0-100
    tenant_status_enum_validation: status must be one of PENDING_PROVISIONING/ACTIVE/SUSPENDED/ARCHIVED
    error_handlers: OrganizationManagementExceptionHandler and PlatformConfigurationExceptionHandler
      map every invalid-command/not-found/conflict exception to a structured
      {status, code, messageKey, message, occurredAt} envelope
  cross_module_boundaries:
    platformconfiguration_module: allowedDependencies=[auditcompliance] only; no direct dependency on
      organizationmanagement or identityaccess internals (tenant scoping for evaluateFeatureFlags is
      caller-supplied via a request parameter, not resolved via a cross-module security context read)
    modulith_boundary_test: PlatformFoundationModulithTest.moduleBoundariesAreValid passes with the
      new platformconfiguration module and the extended organizationmanagement/observability modules

