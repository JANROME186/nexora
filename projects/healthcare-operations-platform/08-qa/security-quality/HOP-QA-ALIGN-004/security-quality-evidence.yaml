application_defects_found_and_fixed:
  - id: HOP-QA-ALIGN-004-DEFECT-001
    endpoint: POST /api/people/persons/index/rebuild
    defect: >-
      Unvalidated caller-supplied tenantId reused as audit_events.tenant_id (varchar(36));
      an oversized value caused an unhandled DataIntegrityViolationException (HTTP 500).
    fix: >-
      PersonManagementService.rebuildIndex now validates TenantDirectory.tenantExists(tenant)
      before proceeding, returning a clean 404 for a nonexistent tenant.
    found_by: OWASP ZAP API scan
  - id: HOP-QA-ALIGN-004-DEFECT-002
    endpoint: POST /api/platform/tenants, POST /api/organization/laboratories, POST /api/organization/branches
    defect: >-
      No max-length validation on the name field, which maps to a varchar(180) column; an
      oversized value caused the same class of unhandled DataIntegrityViolationException.
    fix: >-
      OrganizationManagementService now validates name length (<=180 chars) via a new
      requiredNameText helper, returning a clean 400.
    found_by: OWASP ZAP API scan
  - id: HOP-QA-ALIGN-004-DEFECT-003
    surface: backend (all endpoints), employee portal (all routes)
    defect: Missing X-Content-Type-Options, Cross-Origin-Resource-Policy (backend); missing
      X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy,
      Cross-Origin-Opener-Policy, Cross-Origin-Resource-Policy (employee portal).
    fix: New SecurityHeadersFilter (backend); new securityHeadersPlugin dev-server middleware in
      vite.config.ts (employee portal).
    found_by: OWASP ZAP baseline and API scans

