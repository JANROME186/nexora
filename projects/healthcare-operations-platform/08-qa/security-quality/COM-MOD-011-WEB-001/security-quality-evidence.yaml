      UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --skip-dirs node_modules
      projects/healthcare-operations-platform/07-implementation/public-website
    version: 0.72.0
    vulnerabilities: 0
    secrets: 0
    misconfigurations: 0
  yaml_parse:
    method: parsed every touched/added .yml/.yaml file under
      projects/healthcare-operations-platform
    errors: 0
  agent_agnostic_scan:
    method: case-insensitive grep for openai|claude|cursor|gemini|copilot|anthropic across
      07-implementation/public-website source/config/test files
    total_matches: 1
    disposition: the CSS `cursor` pseudo-property (values `pointer`/`not-allowed`) in
