artifact:
  id: HOP-SQ-COM-MOD-011-WEB-001
  type: security-quality-evidence
  name: COM-MOD-011-WEB-001 Security and Quality Evidence
  version: 1.0.0
  status: passed
  captured_on: 2026-07-21

scope: >-
  Public website frontend (07-implementation/public-website/) consuming the anonymous
  /api/public/** surface compiled by COM-MOD-011-BE-001: published catalog discovery and public
  appointment/quotation request intake, with SEO/accessibility/privacy/i18n foundations.

open_source_first_check:
  new_dependency_added: true
  new_dependencies:
    - name: eslint-plugin-jsx-a11y
      kind: dev
      license: MIT
      reason: static accessibility linting, addresses TD-UX-002
    - name: jest-axe
      kind: dev
      license: MIT
      reason: automated axe-core accessibility regression checks wired into npm run quality
    - name: "@types/jest-axe"
      kind: dev
      license: MIT
      reason: TypeScript types for jest-axe under strict mode
  stack_reviewed: React 19, TypeScript 5 (strict), Vite 6, Vitest, ESLint, jscpd, Prettier, npm
    audit, Trivy
  vulnerabilities_found: 0
  license_check: passed
  notes: >-
    No new production/runtime dependency was added beyond react/react-dom (already used by every
    other portal). The three new dependencies are dev-only (lint/test tooling) and MIT-licensed,
    consistent with the open_source_first_policy accepted-license list. No router library or i18n
    library was added; routing and i18n follow the same hand-rolled-primitive pattern already used
    by patient-portal/doctor-portal (LocaleContext, httpClient), keeping the dependency surface
    minimal.

security_controls:
  authentication:
    public_paths_prefix: /api/public/
    frontend_posture: >-
      The public website never sends an auth token/session header; it calls /api/public/** exactly
      as an anonymous visitor's browser would, matching the backend's deliberate omission of that
      prefix from EndpointPermissionRegistry.
  no_internal_identifier_exposure: >-
    src/api/types.ts DTOs mirror the backend publicweb records exactly (no tenantId, actorId, audit
    timestamps or other internal identifier). tenantId/laboratoryId/branchId sent in appointment/
    quotation request bodies are sourced from deployment-owned site configuration
    (src/config/siteConfig.ts), never rendered as visible text or taken from a user-editable field.
  rate_limiting:
    backend_behavior: PublicApiRateLimitInterceptor returns 429 PUBLIC_RATE_LIMIT_EXCEEDED with no
      Retry-After header.
    frontend_handling: useRateLimitCooldown starts a fixed client-side cooldown (30s) on any
      ApiError.isRateLimited response, disabling the submit button and showing a localized
      countdown message, so a visitor cannot immediately re-trigger the same rate-limited request.
    test_coverage: AppointmentRequestPage.test.tsx / QuotationRequestPage.test.tsx assert the
      cooldown starts and the submit button disables on a mocked 429 response.
  message_externalization:
    hardcoded_ui_strings_added: 0
    locales_covered: [es-MX, en-US]
    error_code_mapping: >-
      resolveErrorMessage maps PUBLIC_RATE_LIMIT_EXCEEDED / PUBLIC_CATALOG_NOT_PUBLISHED /
      PUBLIC_APPOINTMENT_REQUEST_INVALID / PUBLIC_QUOTATION_REQUEST_INVALID /
      PUBLIC_PROSPECTIVE_CONTACT_REQUIRED to localized messages; unrecognized codes and network
      failures fall back to a generic localized message, never the server's raw English text.
  input_validation:
    client_side: >-
      Both request forms require native HTML5 required fields plus explicit checks for
      contact-required-or (phone or email), at-least-one-selected-item, and an explicit consent
      checkbox before calling the backend. This is a UX convenience layer only; the backend's own
      @NotBlank/business-rule validation (PublicAppointmentRequestBody/PublicQuotationRequestBody,
      PUBLIC_PROSPECTIVE_CONTACT_REQUIRED) remains the authoritative validation boundary.
    xss_posture: >-
      All catalog/error text is rendered through React's default JSX text-node escaping; no
      dangerouslySetInnerHTML is used anywhere in the module.
  privacy:
    dedicated_notice_page: /privacy route explains what contact data is collected and why.
    consent_required: both request forms block submission until an explicit consent checkbox is
      checked.
    data_minimization: only name/phone/email plus selected test/panel identifiers are collected;
      no clinical information is requested through either public form.

