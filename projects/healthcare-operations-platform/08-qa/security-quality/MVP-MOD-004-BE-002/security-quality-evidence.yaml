    current_active_backlog_item: MVP-MOD-004-CLOSEOUT
    reason: >
      The Nexora enterprise quality framework was strengthened after this
      evidence was produced. HOP-QA-ALIGN-CLOSEOUT has passed, MVP-MOD-004-FE-001
      and MVP-MOD-004-QA-001 are closed, and the active item is MVP-MOD-004-CLOSEOUT.
