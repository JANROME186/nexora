artifact:
  id: HOP-SQ-MVP-MOD-004-BE-002-001
  type: security-quality-evidence
  name: MVP-MOD-004-BE-002 Front Desk and Care Delivery Custom Rules Security Quality Evidence
  version: 1.0.0
  status: passed
  human_readable: security-quality-evidence.md
  machine_readable: security-quality-evidence.yaml
  created_date: 2026-07-15
  owner: Nexora Product Architecture Team

scope:
  backlog_item: MVP-MOD-004-BE-002
  module: MVP-MOD-004 Front Desk and Care Delivery
  release: REL-001
  implementation_root: 07-implementation/
  standard: ../../../../nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml
  objective: Apply open-source-first security and quality gates to the custom-rule implementation
    for the Front Desk and Care Delivery capability packages.

open_source_first:
  status: passed
  proprietary_runtime_dependency_detected: false
  new_dependencies_introduced: false
  reviewed_stack:
    - name: Spring Boot
      version: 3.5.14
      license: Apache-2.0
      role: backend application framework (unchanged from MVP-MOD-004-BE-001)
    - name: Spring Modulith
      version: 1.4.5
      license: Apache-2.0
      role: modular backend architecture support
    - name: PostgreSQL JDBC
      version: 42.7.12
      license: BSD-2-Clause
      role: database driver
    - name: Trivy
      version: 0.69.2
      license: Apache-2.0
      role: vulnerability, secret and misconfiguration scan

quality_gates:
  - id: SQ-001
    name: Backend automated tests
    command: mvn --settings .mvn/settings.xml test
    working_directory: 07-implementation/backend
    result: passed
    notes: 77 tests run, 0 failures, 0 errors, 7 skipped (local-db-only tests).
  - id: SQ-002
    name: Backend database-backed tests
    command: mvn --settings .mvn/settings.xml test "-Dhop.local-db-tests=true"
    working_directory: 07-implementation/backend
    result: passed
    notes: 77 tests run, 0 failures, 0 errors, 0 skipped against local PostgreSQL 16 (started via
      docker compose --env-file .env.example -f compose.local.yml up -d postgres). Exercises the
      new PreparationInstructionRepository.findAssignmentsByTarget and
      AppointmentSlotRepository.findByBranchId JDBC queries against the existing
      catalog.preparation_assignments and care_delivery.appointments tables (no schema change was
      required).
  - id: SQ-003
    name: Spring Modulith module boundary check
    command: mvn --settings .mvn/settings.xml test "-Dtest=PlatformFoundationModulithTest"
    working_directory: 07-implementation/backend
    result: passed
    notes: No new cross-top-level-module dependency was introduced. AppointmentSchedulingService's
      new call into PatientPreparationManagementService.findPublishedForTarget stays within the
      already-OPEN catalogtestconfiguration module boundary established in MVP-MOD-004-BE-001. 0
      violations.
  - id: SQ-004
    name: OpenAPI contract coverage
    command: mvn --settings .mvn/settings.xml test "-Dtest=FrontDeskCareDeliveryContractTest"
    working_directory: 07-implementation/backend
    result: passed
    notes: The new getAppointmentPreparationInstructions operation and the previously undocumented
      getRequestedItems operation both resolve to registered Spring MVC routes, alongside every
      operation from the five capability packages' openapi-source.yaml files.
  - id: SQ-005
    name: Functional endpoint coverage, including new custom-rule tests
    command: mvn --settings .mvn/settings.xml test "-Dtest=FrontDeskCareDeliveryApiTest"
    working_directory: 07-implementation/backend
    result: passed
    notes: 10 new tests cover every refined rule (doctor eligibility, per-line multi-price-list
      resolution for orders and quotations, tiered cancellation override, branch daily capacity,
      no-show grace period, preparation-instruction surfacing, reception queue ordering,
      admission acknowledgement policy, tenant-configurable discount policy). Every pre-existing
      test still passes.
  - id: SQ-006
    name: Static analysis (compiler warnings and Modulith validation)
    command: mvn --settings .mvn/settings.xml compile
    working_directory: 07-implementation/backend
    result: passed
    notes: Compilation completes without warnings. Deeper SAST tooling stays tracked in TD-BE-002
      (reused, not re-registered).
  - id: SQ-007
    name: Filesystem vulnerability, secret and misconfiguration scan
    command: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0
      --skip-dirs "backend/.m2,backend/target,employee-portal/node_modules,
      employee-portal/dist,mobile-app/node_modules" .
    working_directory: 07-implementation
    result: passed
    notes: 0 vulnerabilities, 0 secrets and 0 misconfigurations detected. backend/pom.xml scanned
      as pom target (no new dependencies added by this backlog item) and
      employee-portal/package-lock.json scanned as npm target.
  - id: SQ-008
    name: Agent-agnostic scan
    command: Directory scan for .claude/.cursor/.copilot/.windsurf/.aider* files or folders
      (tracked and untracked), plus a grep of every file touched by this backlog item for
      named-agent, assistant, vendor or cloud-runtime requirements (the required pattern list is
      recorded verbatim in this evidence file's own command text so the scan is reproducible).
    working_directory: repository root
    result: passed
    notes: >-
      0 matches found across the new FrontDeskPolicyStore, the refined frontdeskcaredelivery
      application services, the catalogtestconfiguration.patientpreparationmanagement reverse
      lookup, and the two new/updated technical-debt YAML files. The only two matches
      project-wide are the pattern-list words themselves, written out here and in
      08-qa/qa/front-desk-care-delivery/MVP-MOD-004-BE-002-validation.yaml as documentation of
      what the scan searched for; these are expected false positives, not findings.
  - id: SQ-009
    name: DAST
    command: not_executed
    result: deferred_with_technical_debt
    notes: OWASP ZAP is not part of the local toolchain yet. Manual MockMvc coverage exercises
      every endpoint touched by this backlog item. TD-QA-001 tracks automated DAST enablement
      (reused, not re-registered).
  - id: SQ-010
    name: Container or IaC scan
    command: trivy fs (same command as SQ-007)
    result: passed
    notes: compose.local.yml and other runtime files are covered by the same filesystem
      misconfiguration scan; unchanged by this backlog item.
  - id: SQ-011
    name: git diff --check
    command: git diff --check
    working_directory: repository root
    result: passed
    notes: 0 whitespace errors across every file touched by this backlog item (only expected
      LF/CRLF line-ending-normalization advisories on a Windows working copy).

dependency_remediation:
  changes_applied: false
  notes: No new dependencies were added. Runtime remains on Spring Boot 3.5.14 and PostgreSQL JDBC
    42.7.12 as validated in the MVP-MOD-004-BE-001 security evidence.

