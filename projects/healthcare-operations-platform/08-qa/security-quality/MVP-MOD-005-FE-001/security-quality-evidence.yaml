pre_existing_draft_correction: >-
  An uncommitted, partially built CashSessionsScreen.tsx, cashSalesApi.ts and types.ts extension
  from a prior session were found in the working tree at the start of this backlog item. The
  types.ts draft modeled Money-typed backend fields (CashSession.openingAmount,
  Sale.totals.*, PaymentAllocation.amount) as flat number+currency pairs, used non-existent field
  names (SaleTotals.subtotal/taxTotal/total/paidTotal/outstandingBalance instead of the backend's
  subtotalAmount/discountAmount/totalAmount/paidAmount/outstandingAmount) and invalid status
  literals (Sale.status "open" instead of the backend's "payable"; InvoiceRequest.status
  "pending"/"accepted"/"rejected" instead of the backend's "requested"/"submitted"/"issued"/
  "failed"/"cancelled"). This was a correctness/security-relevant finding: shipping it as-is would
  have produced a UI that silently failed to render real backend responses (undefined property
  access on the mismatched field names) with no compile-time signal, since the draft's own type
  definitions matched the draft's own (wrong) shape. All cashier/billing types were rewritten to
  match CashierOperationsController, BillingRequestController and their domain records
  field-for-field, verified against the actual Java source, before any screen was built or tested
  against them.

