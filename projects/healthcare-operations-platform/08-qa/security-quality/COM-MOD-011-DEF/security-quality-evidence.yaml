artifact:
  id: COM-MOD-011-DEF-SECURITY-QUALITY
  type: security-quality-evidence
  backlog_item: COM-MOD-011-DEF
  status: passed
  created_date: 2026-07-20
  standard: ../../../../nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml

scope_note: >
  COM-MOD-011-DEF is a definition-only backlog item: it does not create any new capability
  package. It confirms all 7 COM-MOD-011 capabilities (BCM-SVC-001/002/003/005, BCM-ATT-001/006,
  BCM-PLT-005) are reused from already-modeled/compiled capability packages owned by
  MVP-MOD-002, MVP-MOD-004 and MVP-MOD-008, and extends each package's product_surfaces,
  openapi-source.yaml, ui-model.yaml, permissions.yaml and traceability.yaml with a
  public_website surface. It materially reduces TD-BE-015 and updates project registries. No
  backend, frontend or mobile code was created or modified. Backend/frontend/mobile build, test,
  coverage, SAST, dependency vulnerability and DAST gates therefore do not apply to this backlog
  item; they are unchanged from their last measured values (backend 83.73%, employee portal
  88.24%, mobile 99.21%, patient portal 94.11%, doctor portal 96.28%, per
  08-qa/qa/inventory-and-internal-quality/COM-MOD-010-QA-001-validation.yaml) and are not
  regressed.

open_source_first:
  status: passed
  proprietary_runtime_dependency_detected: false
  new_dependencies_introduced: false
  note: >
    This backlog item introduced only editable YAML/Markdown capability-package model
    extensions and registry/technical-debt updates. No new library, framework or runtime
    dependency was introduced; the new public_surface operations reuse existing schemas
    (PublishedServiceSnapshot, PublishedTestSnapshot, PublishedPanelSnapshot,
    PublishedPreparationSnapshot, ProspectiveContact) and the existing RateLimitPolicy entity.

anonymous_public_surface_review:
  status: passed
  note: >
    This is the first backlog item to model an anonymous (unauthenticated), rate-limited public
    surface in HOP. Read operations (catalog.*.public_read) return only status=published
    snapshots, never drafts. Write operations (appointment.request.public,
    quotation.request.public) can only create a requested/draft-state record from a
    ProspectiveContact and can never confirm, issue, accept, convert or read other actors'
    records under the public scope (POL-APT-001-03, POL-QUO-006-04). All public operations are
    governed by BCM-PLT-005 ApiSurfaceRegistration classification=public and RateLimitPolicy,
    with a new RN-007/consumerIdentificationMethod modeling IP-address/session-token
    identification for anonymous rate-limiting (materially reducing TD-BE-015). The runtime
    enforcement of these rules is a COM-MOD-011-BE-001 implementation task, not yet code.

checks:
