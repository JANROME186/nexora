dast_summary_when_applicable:
  status: passed
  backend_zap_api_scan:
    tool: OWASP ZAP (Docker ghcr.io/zaproxy/zaproxy:stable) zap-api-scan.py
    target: http://host.docker.internal:8090/v3/api-docs (full backend OpenAPI surface, 939 URLs,
      including all COM-MOD-013 endpoint prefixes -- /api/quality/external-controls,
      /api/quality/capa, /api/quality/audits, /api/quality/events, /api/documents,
      /api/audit/events/export)
    first_run_result: "FAIL-NEW 0, WARN-NEW 2 (both the same finding: a Buffer Overflow active-scan
      probe against POST /api/documents abruptly closed the connection mid multipart upload,
      surfacing an unhandled MultipartException as HTTP 500), PASS 117"
    finding_fixed: >-
      Registered and closed as TD-QA-007. GlobalExceptionHandler gained a
      MultipartException -> 400 mapping (also covers oversized uploads via
      MaxUploadSizeExceededException, a MultipartException subtype); a new regression test
      (GlobalExceptionHandlerTest.mapsMultipartExceptionToBadRequestBody) was added; backend
      restarted with the fix.
    rescan_result: "FAIL-NEW 0, WARN-NEW 0, PASS 118"
    reports:
      - 08-qa/security-quality/COM-MOD-013-QA-001/zap-backend-api.html
      - 08-qa/security-quality/COM-MOD-013-QA-001/zap-backend-api.json
  employee_portal_zap_baseline_scan:
    tool: OWASP ZAP (Docker ghcr.io/zaproxy/zaproxy:stable) zap-baseline.py with Ajax Spider (-j)
    target: http://host.docker.internal:5173 (employee-portal dev server, 125 URLs including the
      COM-MOD-013 SPA shell/routes)
    result: "FAIL-NEW 0, WARN-NEW 6, PASS 61"
    warn_new_disposition: >-
      All 6 WARN-NEW categories are either the already-registered TD-FE-005 (Content Security
      Policy Header Not Set [10038]; Cross-Origin-Embedder-Policy Header Missing [90004] -- both
      intentionally deferred to the production hosting layer since Vite's dev-server eval-based HMR
      requires relaxed CSP/COEP, documented in vite.config.ts) or dev-server-only artifacts with no
      production relevance: a Vite HMR websocket handshake token in the URL (Information
      Disclosure - Sensitive Information in URL [10024]), Vite/React bundled dev-mode source
      comments (Information Disclosure - Suspicious Comments [10027]), dev-asset cache headers
      (Storable and Cacheable Content [10049]), and an informational "Modern Web Application"
      [10109] scan-tuning hint (not a vulnerability). No new debt registered; none of these are
      real, in-scope, fixable findings distinct from the already-tracked TD-FE-005.
    reports:
      - 08-qa/security-quality/COM-MOD-013-QA-001/zap-employee-portal.html
      - 08-qa/security-quality/COM-MOD-013-QA-001/zap-employee-portal.json
  runtime_setup_note: >-
    Port 8080 was occupied by an unrelated pre-existing process on this shared machine (same
    documented conflict as prior sessions); the backend was started with server.port=8090 for this
    DAST session only (no runbook/config port change). employee-portal's Vite dev-server proxy
    target was previously hardcoded to localhost:8080 with no override mechanism; added a small,
    backward-compatible change to vite.config.ts reading an optional HOP_BACKEND_URL environment
    variable (falls back to the existing http://localhost:8080 default when unset), enabling this
    and future sessions to point the portal at an alternate backend port without editing source.

