    ref: ../../technical-debt/TD-BE-007-credential-expiration-scheduler-missing.yaml
    severity: medium
  - id: TD-BE-008
    title: PatientSnapshot/DoctorSnapshot document and credential number masking is fixed, not
      tenant-configurable
    ref: ../../technical-debt/TD-BE-008-read-model-masking-not-tenant-configurable.yaml
    severity: medium
  - id: TD-FE-002
    title: Employee portal is missing patient/doctor update, patient document management and
      doctor specialty assignment UI
    ref: ../../technical-debt/TD-FE-002-patient-doctor-update-documents-specialty-ui-missing.yaml
    severity: low

overall_result: passed_with_execution_limitation
recommendation: >
  Proceed to MVP-MOD-003-CLOSEOUT. Re-run the backend Maven suite and the employee-portal
  npm test/coverage/build/audit gates in an unrestricted environment as an early step of that
  backlog item, and update QG-001/QG-002/QG-004..QG-007 and EX-001/EX-002 here once that run
  completes. TD-BE-007, TD-BE-008 and TD-FE-002 do not block closeout.
