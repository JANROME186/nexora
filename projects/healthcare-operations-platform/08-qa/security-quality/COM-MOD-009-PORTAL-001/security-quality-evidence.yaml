scope_note: >
  COM-MOD-009-PORTAL-001 is a patient portal commercial workflow compilation backlog item:
  it implements a real patient login flow against the backend auth endpoints, authenticated
  session context parsing, a dynamic permission-aware dashboard shell, views for profile,
  results history, appointments, diagnostic orders, and notifications, full es-MX/en-US
  localization, and a backend-enforced secure patient self-access interceptor.
  Patient portal unit tests passed successfully (18 tests) raising line coverage from
  the 41.93% floor to 89.58% (TD-FE-008 closed).

