artifact:
  id: HOP-SQ-MVP-MOD-003-BE-001-001
  type: security-quality-evidence
  name: MVP-MOD-003-BE-001 People and Clinical Master Data Backend Security Quality Evidence
  version: 1.0.0
  status: passed
  human_readable: security-quality-evidence.md
  machine_readable: security-quality-evidence.yaml
  created_date: 2026-07-09
  owner: Nexora Product Architecture Team

scope:
  backlog_item: MVP-MOD-003-BE-001
  module: MVP-MOD-003 People and Clinical Master Data
  release: REL-001
  implementation_root: 07-implementation/
  standard: ../../../../nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml
  objective: Apply open-source-first security and quality gates to the backend outputs compiled for
    the People and Clinical Master Data capability packages.

open_source_first:
  status: passed
  proprietary_runtime_dependency_detected: false
  new_dependencies_introduced: false
  reviewed_stack:
    - name: Spring Boot
      version: 3.5.14
      license: Apache-2.0
      role: backend application framework (unchanged from MVP-MOD-002)
    - name: Spring Modulith
      version: 1.4.5
      license: Apache-2.0
      role: modular backend architecture support
    - name: PostgreSQL JDBC
      version: 42.7.12
      license: BSD-2-Clause
      role: database driver
    - name: Trivy
      version: 0.69.2
      license: Apache-2.0
      role: vulnerability, secret and misconfiguration scan
    - name: SnakeYAML (transitive)
      version: transitive-managed
      license: Apache-2.0
      role: YAML parsing in contract tests

quality_gates:
  - id: SQ-001
    name: Backend automated tests
    command: mvn --settings .mvn/settings.xml test
    working_directory: 07-implementation/backend
    result: passed
    notes: 47 tests run, 0 failures, 0 errors, 5 skipped (local-db-only tests).
  - id: SQ-002
    name: Backend database-backed tests
    command: mvn --settings .mvn/settings.xml test "-Dhop.local-db-tests=true"
    working_directory: 07-implementation/backend
    result: passed
    notes: 52 tests run, 0 failures, 0 errors, 0 skipped against local PostgreSQL 16.
  - id: SQ-003
    name: Spring Modulith module boundary check
    command: mvn --settings .mvn/settings.xml test "-Dtest=PlatformFoundationModulithTest"
    working_directory: 07-implementation/backend
    result: passed
    notes: peopleclinicalmasterdata module declares only organizationmanagement and auditcompliance
      as allowed dependencies. No boundary violations reported by ApplicationModules verification.
  - id: SQ-004
    name: OpenAPI contract coverage
    command: mvn --settings .mvn/settings.xml test "-Dtest=PeopleClinicalMasterDataContractTest"
    working_directory: 07-implementation/backend
    result: passed
    notes: Every operation declared in the four capability packages' openapi-source.yaml files
      resolves to a Spring MVC route.
  - id: SQ-005
    name: Custom-rule hook coverage
    command: mvn --settings .mvn/settings.xml test "-Dtest=PeopleClinicalMasterDataApiTest"
    working_directory: 07-implementation/backend
    result: passed
    notes: Deferred operations respond HTTP 501 with a ruleId and backlogItem MVP-MOD-003-BE-002.
  - id: SQ-006
    name: Static analysis (compiler warnings and Modulith validation)
    command: mvn --settings .mvn/settings.xml compile
    working_directory: 07-implementation/backend
    result: passed
    notes: Compilation completes without warnings. Deeper SAST tooling stays tracked in TD-BE-002.
  - id: SQ-007
    name: Filesystem vulnerability, secret and misconfiguration scan
    command: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1
      --no-progress --skip-dirs "backend/.m2,backend/target,employee-portal/node_modules,
      employee-portal/dist,mobile-app/node_modules" .
    working_directory: 07-implementation
    result: passed
    notes: 0 vulnerabilities, 0 secrets and 0 misconfigurations detected. Backend pom.xml scanned
      as pom target and employee-portal/package-lock.json scanned as npm target.
  - id: SQ-008
    name: Agent-agnostic scan
    command: PowerShell Select-String scan of created Java, YAML and SQL artifacts for named-agent,
      assistant, vendor or cloud-runtime requirements.
    working_directory: 07-implementation/backend
    result: passed
    notes: 0 matches found across the new peopleclinicalmasterdata sources and schema.
  - id: SQ-009
    name: DAST
    command: not_executed
    result: deferred_with_technical_debt
    notes: OWASP ZAP is not part of the local toolchain yet. Manual MockMvc coverage exercises
      every endpoint. TD-QA-001 tracks automated DAST enablement.
  - id: SQ-010
    name: Container or IaC scan
    command: trivy fs (same command as SQ-007)
    result: passed
    notes: Compose and runtime files are covered by the same filesystem misconfiguration scan.

dependency_remediation:
  changes_applied: false
  notes: No new dependencies were added. Runtime remains on Spring Boot 3.5.14 and PostgreSQL JDBC
    42.7.12 as validated in the MVP-MOD-002 CLOSEOUT security evidence.

technical_debt:
  registered_reused:
    - TD-QA-001
    - TD-BE-002
    - TD-BE-003
    - TD-BE-004
    - TD-STACK-001
  newly_registered: []
  blocking: []

exceptions: []

readiness:
  security_quality_status: passed
  ready_for_next_backlog_item: MVP-MOD-003-BE-002
  next_required_focus:
    - Implement the deferred custom rules for BCM-PER-001/002/003 and BCM-ATT-002 identified in
      08-qa/qa/people-and-clinical-master-data/MVP-MOD-003-BE-001-validation.yaml.
    - Continue with automated DAST once TD-QA-001 is scheduled.
