artifact:
  id: HOP-SQ-COM-MOD-011-FE-001
  type: security-quality-evidence
  name: COM-MOD-011-FE-001 Security and Quality Evidence
  version: 1.0.0
  status: passed
  captured_on: 2026-07-22

scope: >-
  Employee portal (07-implementation/employee-portal/) content-and-request administration
  screens: staff review of published public-catalog content and triage queues for public-website
  appointment/quotation requests, consuming existing public/internal APIs. Also touches
  07-implementation/backend/ for a real, documented defect fix: QuotationRequest gained a channel
  field so public-website-submitted quotation drafts are reliably distinguishable from
  staff-initiated ones (mirroring AppointmentSlot, which already had this field).

open_source_first_check:
  new_dependency_added: true
  new_dependencies:
    - name: eslint-plugin-jsx-a11y
      kind: dev
      license: MIT
      reason: static accessibility linting, closes TD-UX-002 in employee-portal
    - name: jest-axe
      kind: dev
      license: MIT
      reason: automated axe-core accessibility regression checks wired into npm run quality
    - name: "@types/jest-axe"
      kind: dev
      license: MIT
      reason: TypeScript types for jest-axe under strict mode
  stack_reviewed: React 18, TypeScript 5, Vite 6, Vitest, ESLint, jscpd, Prettier, npm audit,
    Trivy; backend Spring Boot 4.1 / Java 21, Maven, JaCoCo, OWASP Dependency-Check, Trivy
  vulnerabilities_found: 0
  license_check: passed
  notes: >-
    No new production/runtime dependency was added beyond react/react-dom. All 3 new
    dependencies are dev-only (lint/test tooling), MIT-licensed. No new backend dependency was
    added; the CVE-2026-59889 fix (below) pins an existing transitive Jackson 3.x dependency to
    a patched version already published by upstream, not a new dependency.

security_controls:
  authentication:
    screens_gated_by_iam: >-
      All 3 new screens are gated behind new permission codes
      (SCREEN_PUBLIC_CONTENT_REVIEW, SCREEN_PUBLIC_APPOINTMENT_REQUESTS,
      SCREEN_PUBLIC_QUOTATION_REQUESTS) granted only to ADMIN and FRONT_DESK roles in
      ROLE_PERMISSION_CATALOG; navigation tabs are hidden, not just disabled, for other roles,
      matching the enterprise-product-foundation-standard iam_permission_model.
  no_internal_identifier_exposure_in_content_review: >-
    PublicContentReviewScreen consumes the same anonymous /api/public/catalog/**/published
    endpoints the public website itself calls (via publicContentApi.ts); the response DTOs never
    carry tenantId, audit metadata or another internal identifier, so none can be displayed by
    construction.
  no_new_state_changing_endpoint: >-
    Every triage action (confirm/cancel appointment, issue/cancel quotation) reuses an existing,
    already-IAM-gated internal endpoint. No new POST/PUT/DELETE endpoint was created.
  message_externalization:
    hardcoded_ui_strings_added: 0
    locales_covered: [es-MX, en-US]
    namespaced_keys: t.publicContentReview.*, t.publicAppointmentRequests.*,
      t.publicQuotationRequests.*
  input_validation:
    backend_channel_validation: >-
      QuotationManagementService.start() validates the (optional) channel against a fixed
      whitelist (QUOTATION_CHANNELS) and explicitly rejects channel=public_website from internal
      callers (InvalidFrontDeskCommandException -> HTTP 400); startPublic() always stamps
      channel=public_website server-side, ignoring any client-supplied value, so a staff caller
      cannot spoof a public request and a public caller cannot claim an internal channel.
  xss_posture: >-
    All catalog/request text is rendered through React's default JSX text-node escaping; no
    dangerouslySetInnerHTML is used in any new file.

