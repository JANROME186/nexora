closure:
  vulnerability_fixed:
    - id: CVE-2026-59889
      description: jackson-databind (tools.jackson.core, Jackson 3.x line managed by
        spring-boot-starter-parent 4.1.0) @JsonView bypassed for @JsonUnwrapped container
        properties on deserialization
      severity: MEDIUM
      fixed_version: 3.1.5 (pinned; upstream also offers 3.2.1)
      fix_location: 07-implementation/backend/pom.xml (dependencyManagement, mirrors the
        existing pattern already used to pin the classic Jackson 2.x line for CVE-2026-54515)
      found_via: Trivy filesystem scan on the backend directory during this backlog item's
        mandatory quality gates
      regression_status: 327 backend tests, 0 failures after the pin; JaCoCo coverage unchanged
        at 83.99%
  technical_debt_closed:
    - id: TD-UX-002
      contribution: retrofitted both acceptance criteria (documented responsive breakpoints,
        automated jest-axe accessibility check) into employee-portal itself, this debt's
        originally discovered affected_area, closing the remaining_scope COM-MOD-011-WEB-001 left
        open
  real_defect_fixed:
    - description: QuotationRequest had no channel field, unlike AppointmentSlot, so
        public-website-submitted quotation drafts could not be reliably distinguished from
        staff-initiated ones for the new triage queue screen
      files:
        - 07-implementation/backend/.../quotationmanagement/domain/QuotationRequest.java
        - 07-implementation/backend/.../quotationmanagement/application/QuotationManagementService.java
        - 07-implementation/backend/src/main/resources/db/front-desk-care-delivery/schema.sql
      regression_status: 4 new/extended backend tests, 0 new failures; 0 breaking change to any
        existing caller (channel defaults to employee_portal when omitted)
  new_debt_registered: []
