capability_coverage:
  - capability: BCM-PER-001
    name: Person Management
    ui_support: global search, duplicate detection with confidence scoring, search-index rebuild,
      merge coordination initiate/lookup
  - capability: BCM-PER-002
    name: Patient Management
    ui_support: register, list, snapshot, representative attach/revoke, consent record/revoke,
      merge
  - capability: BCM-PER-003
    name: Doctor Management
    ui_support: register, list, snapshot, credential attach/verify/revoke, suspend, prepare portal
      access
  - capability: BCM-ATT-002
    name: Patient Registration
    ui_support: start, list, detail, commit (with visual duplicate resolution), cancel

ux_requirements_covered:
  - requirement: Loading, error, empty and confirmation states
    implementation: Every async action uses the shared useAsyncAction hook and StatusBanner
      (idle/loading/success/error). Empty result sets render an explicit "No … yet" message
      instead of a blank table. Revoke, merge, suspend and cancel actions require an explicit
      ConfirmDialog confirmation before the request is sent.
  - requirement: Explicit handling of expected 2xx/4xx backend responses
    implementation: Successful 2xx responses update local state and show a success banner. Known
      4xx responses surface the backend's message text directly (e.g. 409
      REGISTRATION_MATCH_RESOLUTION_REQUIRED, REGISTRATION_REPRESENTATIVE_REQUIRED,
      REGISTRATION_CONSENT_MISSING, 404 not found). The registration commit flow specifically
      inspects the ApiError status code; on a 409 whose message contains MATCH_RESOLUTION_REQUIRED it calls
      detectPersonDuplicates and renders the real candidate list with confidence badges and a
      one-click resolution action, rather than just showing a generic error string.
  - requirement: Manejo visual de duplicados de alta confianza
    implementation: PersonSearchScreen's duplicate-detection panel and
      PatientRegistrationsScreen's post-409 duplicate panel both render candidates with a
      color-coded confidence badge (>=85% high / >=50% medium / below low) and the match reason
      returned by the backend.
  - requirement: No agent, vendor or runtime specific dependency
    implementation: Only React, the existing httpClient fetch wrapper and the project's own
      shared components are used; no new npm dependency was added.

