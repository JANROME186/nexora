execution_limitation:
  description: >
    This sandbox's network allowlist blocks fetching the Linux-native binaries that vite/vitest
    depend on (esbuild, @rollup/rollup-linux-x64-gnu). `npm install esbuild` and `npm audit` both
    returned an explicit 403 with the message "Connection blocked by network allowlist" /
    "403 Forbidden ... on a server you do not have access to". The repository's committed
    node_modules only contains Windows-native esbuild/rollup binaries (built on the developer's
    machine), which do not run in this Linux sandbox, so `npm test`, `npm run test:coverage`,
    `npm run build` and `npm audit` could not be executed here even though they are expected to
    work normally on the developer's own machine or in a CI runner with unrestricted npm registry
    access.
  mitigation_applied:
    - npm run typecheck (pure TypeScript compiler, no esbuild/rollup dependency) was run to
      completion with 0 errors, which structurally validates every new file (JSX correctness, prop
      types, hook usage, and every field reference against the DTOs in types.ts).
    - Every new test's queries (getByLabelText, getByRole name) were manually verified against the
      literal label/button text rendered by the corresponding component source.
    - Every API client call's URL, method and payload shape was manually verified against the
      actual backend controller/record definitions (PersonController, PatientController,
      DoctorController, PatientRegistrationController and their request/response records) read
      directly from source, not assumed from the openapi-source.yaml model alone.
    - Secrets scan, agent-agnostic scan, YAML parse and stale-pointer scan were all executed
      successfully in this sandbox since they do not require the blocked toolchain.
  residual_risk: >
    A runtime/rendering defect that only a real browser-DOM test run would catch (for example, a
    prop mismatch that TypeScript's structural typing does not flag, or a Testing Library query
    that resolves to more than one element after both the register and detail panels are visible)
    cannot be fully ruled out without an actual `npm test` execution. This is recorded honestly
    rather than asserting a passing test run that did not happen.
  recommended_follow_up: >
    Run `npm test`, `npm run test:coverage`, `npm run build` and `npm audit --audit-level=high` in
    `07-implementation/employee-portal` on the developer's machine or in CI (both have working
    platform-native esbuild/rollup binaries and unrestricted registry access) before or during
    MVP-MOD-003-QA-001, and correct this evidence file's VAL-002..VAL-005 results to the actual
    outcome.

