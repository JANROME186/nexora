capability_package_model_validation:
  method: Re-read business-model.yaml, business-rules.yaml, permissions.yaml, openapi-source.yaml,
    ui-model.yaml and traceability.yaml for all 4 packages and cross-checked internal consistency
    and prior MVP-MOD-003-DEF-validation.yaml findings.
  result: passed
  detail: >
    BCM-PER-001, BCM-PER-002, BCM-PER-003 and BCM-ATT-002 remain internally consistent: rule ids,
    scopes, operation ids and screen ids referenced in traceability.yaml exist in their respective
    business-rules.yaml, permissions.yaml, openapi-source.yaml and ui-model.yaml. No capability
    package was redesigned during this review.

traceability_validation:
  method: Cross-checked each package's traceability.yaml (capability_map, rules_to_tests,
    api_to_permissions, events_to_audit, ui_to_api, backlog_items) against the actual backend
    controllers, employee-portal API client and test files.
  result: passed_with_findings
  findings:
    - id: TRACE-001
      description: All 4 traceability.yaml files' backlog_items block is consistent and up to
        date (compilation/custom_rules/ui all closed, ui_status closed, correct evidence paths).
      severity: informational
    - id: TRACE-002
      description: capability-package-index.yaml's active_capability_package_group block was
        stale (still showed package_status modeled, backlog_item MVP-MOD-003-DEF, next_backlog_item
        MVP-MOD-003-BE-001, unchanged since the DEF backlog item closed). Corrected in this backlog
        item to package_status validated, backlog_item MVP-MOD-003-QA-001, next_backlog_item
        MVP-MOD-003-CLOSEOUT.
      severity: low
      status: fixed

openapi_contract_validation:
  method: For each of the 4 packages, compared every openapi-source.yaml operation (id, method,
    path) against the corresponding backend controller's Spring MVC route mappings.
  result: passed
  detail: >
    BCM-PER-001/PersonController (5/5 operations), BCM-PER-002/PatientController (17/17
    operations), BCM-PER-003/DoctorController (15/15 operations) and
    BCM-ATT-002/PatientRegistrationController (5/5 operations) all map one-to-one in both
    directions. No declared operation is missing a route and no route exists outside its
    openapi-source declaration, consistent with the existing PeopleClinicalMasterDataContractTest
    referenced by MVP-MOD-003-BE-001-validation.yaml and MVP-MOD-003-BE-002-validation.yaml.

be_002_custom_rule_validation:
  method: Read the actual backend Java source for every custom rule BE-002 claims to have
    implemented and compared it against the rule statement in each package's business-rules.yaml.
  result: passed_with_findings
  findings:
    - id: GAP-001
      rule: RN-005 (BCM-PER-003)
      description: >
        RN-005 requires a scheduler that proactively transitions expired credentials and flags the
        doctor for re-verification. Only a reactive check exists at verification time; no
        scheduled job or watcher is implemented. Doctor referring-eligibility is still computed
        correctly in real time against expiresAt, so no incorrect business outcome results today.
      severity: medium
      blocking: false
      disposition: >
        MVP-MOD-003-BE-002-validation.yaml's model_gaps_identified was corrected to record this
        gap. Registered as 08-qa/technical-debt/TD-BE-007-credential-expiration-scheduler-missing.yaml.
    - id: GAP-002
      rule: RN-008 (BCM-PER-002 and BCM-PER-003)
      description: >
        RN-008 requires tenant-configured masking of document/credential numbers in read models.
        A fixed, tenant-agnostic masking algorithm is applied instead; document numbers are never
        shown unmasked, so there is no raw data-exposure regression, but the masking policy is not
        tenant-configurable as modeled. Credential numbers are not exposed via DoctorSnapshot at
        all, so that half of the rule does not currently apply.
      severity: medium
      blocking: false
      disposition: >
        MVP-MOD-003-BE-002-validation.yaml's model_gaps_identified was corrected to record this
        gap. Registered as 08-qa/technical-debt/TD-BE-008-read-model-masking-not-tenant-configurable.yaml.
    - id: CONFIRM-001
      rule: RN-004 (BCM-PER-003)
      description: >
        Doctor status is set to active unconditionally at registration rather than gated on a
        verified credential; the rule is instead enforced for referring-eligibility purposes via
        isEligibleAsReferringDoctor. This is a previously disclosed deviation
        (08-qa/technical-debt/TD-BE-005-doctor-activation-gating-via-eligibility-query.yaml), and
        this validation confirms the disclosure still accurately describes the code.
      severity: medium
      blocking: false
      disposition: no new action; existing TD-BE-005 remains accurate.
    - id: CONFIRM-002
      rule: TD-BE-006 (patient registration commit transaction)
      description: >
        Confirmed PatientRegistrationService.commit() still has no @Transactional boundary, as
        already tracked by TD-BE-006-patient-registration-commit-non-atomic.yaml.
      severity: medium
      blocking: false
      disposition: no new action; existing TD-BE-006 remains accurate.
    - id: CONFIRM-003
      rule: RN-002 (BCM-PER-001 cross-context document uniqueness)
      description: >
        PersonDocumentUniquenessPolicy.ensureUnique() is confirmed invoked from both
        PatientManagementService.register() and DoctorManagementService.register(), enforcing
        primary document uniqueness across Patient and Doctor scopes within a tenant.
      severity: informational
      disposition: no action needed.

fe_001_ui_validation:
  method: For each of the 4 packages, compared every openapi-source.yaml operation against
    peopleApi.ts exported functions, and cross-checked traceability.yaml ui_to_api entries against
    actual calls in PersonSearchScreen.tsx, PatientsScreen.tsx, DoctorsScreen.tsx and
    PatientRegistrationsScreen.tsx. Also read the two test files added after the original FE-001
    session (PersonSearchScreen.test.tsx, peopleApi.test.ts) in full and cross-checked several
    assertions against actual component/API source.
  result: passed_with_findings
  findings:
    - id: GAP-003
      description: >
        11 of 42 modeled operations have no exported peopleApi.ts function and therefore no UI:
        updatePatient, deactivatePatient, updatePatientRepresentative, listPatientDocuments,
        attachPatientDocument, removePatientDocument (BCM-PER-002); updateDoctor, retireDoctor,
        listSpecialtyAssignments, assignSpecialty, unassignSpecialty (BCM-PER-003). All 11 were
        already explicitly named as out of scope in MVP-MOD-003-FE-001-validation.yaml's
        out_of_scope_confirmed section (patient/doctor editor screens, documents panel, specialty
        panel); this validation confirms that disclosure is accurate and complete, and additionally
        flags that patient-representative update (SCR-PAT-002-04) was not separately called out
        even though it is also missing.
      severity: low
      blocking: false
      disposition: Registered as 08-qa/technical-debt/TD-FE-002-patient-doctor-update-documents-specialty-ui-missing.yaml
        for a future UI backlog item. Backend already supports every one of these operations as
        generatable, contract-tested endpoints, so there is no backend risk.
    - id: GAP-004
      description: >
        getPatient, getDoctor and getPatientRegistration are exported by peopleApi.ts but never
        called from any screen (the screens use the *Snapshot variants or in-memory list data
        instead). Minor dead code, not a functional gap.
      severity: informational
      disposition: Tracked in the same TD-FE-002 entry as a cleanup note.
    - id: CONFIRM-004
      description: >
        The 31 operations that do have client functions all match their openapi-source.yaml
        method and path exactly. PersonSearchScreen.test.tsx and peopleApi.test.ts (added after
        the original FE-001 session) are legitimate, well-constructed tests whose assertions were
        spot-checked against the actual component/API source and would pass.
      severity: informational
      disposition: no action needed.

