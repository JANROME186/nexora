generated_outputs:
  backend:
    - Spring Modulith application module catalogtestconfiguration (package-info.java,
      allowedDependencies organizationmanagement, auditcompliance)
    - Domain records and repository ports for all 19 entities across the 8 capabilities
    - Application services enforcing only the business rules marked generatable true in each
      capability's business-rules.yaml
    - REST controllers rendered from each capability's openapi-source.yaml (9 controllers total
      covering diagnostic services, tests, panels, analytes, preparations, reference ranges,
      sample types, sample requirements, price lists)
    - In-memory adapters (profile "!local") and JDBC adapters (profile "local") per repository port
    - db/catalog-test-configuration/schema.sql (new "catalog" Postgres schema, 17 tables)
    - Shared exception/validation infrastructure (CatalogEntityNotFoundException,
      InvalidCatalogCommandException, CatalogCustomRuleNotImplementedException mapped to HTTP 501,
      CatalogExceptionHandler, CatalogValidation)
  tests:
    - CatalogTestConfigurationApiTest (8 tests covering generatable create/list/get/deprecate flows
      and 501 hook responses for every capability)
    - CatalogTestConfigurationContractTest (asserts every openapi-source.yaml operation across the
      8 capability packages resolves to a registered Spring MVC route)
    - CatalogTestConfigurationLocalDatabaseTest (validates JDBC persistence against a real Postgres
      instance using db/catalog-test-configuration/schema.sql)

