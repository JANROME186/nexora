model_gaps_identified:
  - id: GAP-BE-001-01
    capability: BCM-SVC-006
    statement: >
      business-rules.yaml lists RN-002 (critical threshold consistency) and RN-003 (demographic
      overlap detection) enforcement_point as applying to both create and update, but
      openapi-source.yaml marks createReferenceRange as generatable: true while updateReferenceRange
      is generatable: false. This implementation enforces only RN-001 (normal low <= normal high)
      at create time and defers RN-002/RN-003 entirely to MVP-MOD-002-BE-002, consistent with the
      contract-level generatable flag.
    resolution: minimum_compatible_option_applied
    correction_needed_in: bcm-svc-006-reference-range-management/business-rules.yaml or openapi-source.yaml
      (align enforcement_point classification with the intended create-time validation scope)
  - id: GAP-BE-001-02
    capability: BCM-SVC-007
    statement: >
      business-model.yaml ENT-SMP-002 (SampleRequirement) does not declare tenantId/laboratoryId
      fields, unlike every other catalog entity. This implementation adds tenantId and
      laboratoryId to SampleRequirement for tenant/laboratory scoping consistency with the rest of
      the Diagnostic Catalog (minimum compatible option).
    resolution: minimum_compatible_option_applied
    correction_needed_in: bcm-svc-007-sample-catalog/business-model.yaml (add tenantId/laboratoryId
      fields to ENT-SMP-002 to match the implementation)
  - id: GAP-BE-001-03
    capability: all
    statement: >
      No LaboratoryDirectory cross-module port exists yet in organizationmanagement (only
      TenantDirectory). Catalog services validate tenantId via TenantDirectory.tenantExists but
      accept laboratoryId as an opaque required string without existence validation against
      organizationmanagement.Laboratory.
    resolution: minimum_compatible_option_applied
    correction_needed_in: platformfoundation/organizationmanagement (expose a LaboratoryDirectory
      port) - recommended for a future backlog item, not blocking for MVP-MOD-002-BE-001.

