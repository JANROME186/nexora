scope:
  backlog_item: MVP-MOD-002-BE-002
  module: MVP-MOD-002 Diagnostic Catalog
  release: REL-001
  execution_flow_stage: implement_rules
  business_requirement_version: v0.68.0
  impact_assessment_required: false
  bounded_context: catalog-test-configuration
  implementation_root: 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/catalogtestconfiguration/
  objective: >
    Replace the HTTP 501 CatalogCustomRuleNotImplementedException hooks left by MVP-MOD-002-BE-001
    with functional, tested custom business rules for publication, immutable versioning/snapshots,
    preparation assignment, effective-dated versioning with overlap prevention, and effective-context
    resolution across the eight Diagnostic Catalog capabilities.

change_detection:
  last_analyzed_business_requirement_version: v0.68.0
  current_business_requirement_version: v0.68.0
  impact_pending: false

shared_infrastructure_added:
  - CatalogConflictException mapped to HTTP 409 (published-entity immutability and effective-window
    overlap conflicts) in shared/CatalogExceptionHandler.
  - EffectiveDating shared helper (window overlap detection and effective-on-date resolution) reused
    by reference range and price list rules.

custom_rules_implemented:
  - capability: BCM-SVC-001
    name: Diagnostic Service Catalog
    rules:
      - id: RN-002
        behavior: publishDiagnosticService transitions draft -> published; requires at least one
          orderable component; records DiagnosticServicePublished audit event.
      - id: CUS-SVC-001-03
        behavior: getPublishedServiceSnapshot returns the frozen published record; 404 while draft.
      - id: RN-003
        behavior: updateDiagnosticService on a published service is rejected with HTTP 409
          (immutable; create a new draft version).
  - capability: BCM-SVC-002
    name: Test Catalog
    rules:
      - id: RN-003
        behavior: publishTest transitions draft -> published; requires at least one analyte link
          and one sample requirement link before publication; audit event recorded.
      - id: CUS-SVC-002-04
        behavior: getPublishedTestSnapshot returns the frozen published record; 404 while draft.
      - id: RN-004
        behavior: updateTest on a published test is rejected with HTTP 409.
  - capability: BCM-SVC-003
    name: Panel Catalog
    rules:
      - id: RN-002/RN-003
        behavior: publishPanel requires at least two member tests and at least one mandatory member;
          transitions draft -> published; audit event recorded.
      - id: CUS-SVC-003-03
        behavior: getPublishedPanelSnapshot returns the frozen published record; 404 while draft.
      - id: RN-004
        behavior: updatePanel on a published panel is rejected with HTTP 409.
  - capability: BCM-SVC-004
    name: Analyte Catalog
    rules:
      - id: RN-003/RN-006
        behavior: publishAnalyte publishes only complete analytes (numeric requires unit and decimal
          precision; coded requires at least one coded value); audit event recorded.
      - id: CUS-SVC-004-03
        behavior: getPublishedAnalyteSnapshot returns the frozen published record; 404 while draft.
      - id: RN-004
        behavior: updateAnalyte on a published analyte is rejected with HTTP 409.
  - capability: BCM-SVC-005
    name: Patient Preparation Management
    rules:
      - id: RN-002
        behavior: publishPreparation requires full localization (title and instruction text in every
          language) and a duration for fasting preparations; audit event recorded.
      - id: RN-004
        behavior: assignPreparation is allowed only for a published preparation, validates the target
          type/reference, persists the assignment and records a PreparationAssigned audit event.
      - id: RN-005
        behavior: updatePreparation on a published preparation is rejected with HTTP 409.
  - capability: BCM-SVC-006
    name: Reference Range Management
    rules:
      - id: RN-001/RN-002
        behavior: segment normal bounds ordering plus critical threshold consistency (critical low
          <= normal low, critical high >= normal high, critical low <= critical high) enforced on
          create, update and publish.
      - id: RN-003
        behavior: demographic overlap detection across segments (sex, age, condition) enforced on
          create, update and publish.
      - id: RN-004
        behavior: updateReferenceRange is functional for draft ranges and rejected with HTTP 409 for
          published ranges.
      - id: RN-005
        behavior: publishReferenceRange rejects an effective window that overlaps another published
          range for the same analyte (HTTP 409); audit event recorded.
      - id: RN-006
        behavior: getEffectiveRangeSnapshot resolves the published range effective on the observation
          date whose segment matches the patient sex and age context.
  - capability: BCM-SVC-007
    name: Sample Catalog
    rules:
      - id: RN-003/RN-005
        behavior: publishSampleRequirement requires a declared minimum volume and a published
          referenced sample type; audit event recorded.
      - id: CUS-SVC-007-04
        behavior: getPublishedSampleRequirementSnapshot returns the frozen published record; 404
          while draft.
      - id: RN-004
        behavior: updateSampleRequirement on a published requirement is rejected with HTTP 409.
      - id: SAMPLE-TYPE-PUBLISH
        behavior: publishSampleType added to expose the sample type publication transition required
          by RN-003 (see GAP-BE-002-01).
  - capability: BCM-SVC-009
    name: Price List Management
    rules:
      - id: RN-004
        behavior: updatePriceList is functional for draft price lists and rejected with HTTP 409 for
          published price lists.
      - id: RN-003
        behavior: publishPriceList requires at least one price entry; audit event recorded.
      - id: RN-005
        behavior: publishPriceList rejects an effective window that overlaps another published price
          list sharing the same laboratory, currency and agreement scope (HTTP 409).
      - id: RN-006
        behavior: getEffectivePriceSnapshot resolves the published price list that prices the item on
          the sale date honouring an optional currency and agreement filter.

