model_changes:
  - id: GAP-BE-002-01
    capability: BCM-SVC-007
    statement: >
      bcm-svc-007-sample-catalog/openapi-source.yaml modeled a published SampleType status and RN-003
      (CATALOG_SAMPLE_TYPE_NOT_PUBLISHED) but exposed no operation to publish a sample type, which
      would make every sample requirement permanently unpublishable.
    resolution: >
      Added the publishSampleType operation to the editable openapi-source.yaml model (source of
      truth) and implemented SampleTypeController POST /types/{sampleTypeId}/publish plus
      SampleCatalogService.publishSampleType. This closes the gap at the model level so the contract
      test still verifies contract/route parity.

documented_boundaries:
  - >-
    Published-entity immutability uses the published record itself as the immutable snapshot. Because
    a direct update of a published entity is rejected (HTTP 409), the live published record is frozen
    and is what the published-snapshot projections return. A separate historical snapshot store was
    not required for this backlog item.
  - >-
    GAP-BE-001-03 (LaboratoryDirectory) remains an explicit non-blocking boundary. laboratoryId is
    still accepted as an opaque required string; no cross-module laboratory existence validation was
    added by this backlog item.
  - >-
    GAP-BE-001-02 (SampleRequirement tenantId/laboratoryId) is retained as implemented in
    MVP-MOD-002-BE-001; no further model change was required.
  - >-
    RN-003 reference range species-based segmentation is not modeled by ENT-REF-002, so demographic
    overlap detection covers sex, age and condition only ("species when applicable" is not applicable
    to the current model).
  - >-
    Effective resolution endpoints (reference range and price list) receive no laboratory in the
    contract, so resolution searches published entries by analyte and item. Adding a laboratory scope
    to these queries is recommended for a future contract revision but is a non-blocking boundary
    here.

validations:
  - id: VAL-001
    name: Backend compiles
    method: mvn --settings .mvn/settings.xml test-compile
    result: passed
  - id: VAL-002
    name: Backend test suite passes
    method: mvn --settings .mvn/settings.xml test
    result: passed
    detail: 42 tests run, 0 failures, 0 errors, 5 skipped (local-db tests skipped without a running
      Postgres). Includes the new CatalogCustomRulesApiTest (10 tests) and the updated
      CatalogTestConfigurationApiTest (8 tests) with functional assertions replacing the former 501
      expectations.
  - id: VAL-003
    name: Backend test suite passes against real Postgres
    method: docker compose -f compose.local.yml down -v; docker compose -f compose.local.yml up -d postgres; mvn --settings .mvn/settings.xml test -Dhop.local-db-tests=true
    result: passed
    detail: >-
      42 tests run, 0 failures, 0 errors, 0 skipped against a real Postgres 16 instance via docker
      compose, exercising every LocalDatabaseTest including CatalogTestConfigurationLocalDatabaseTest
      and the extended JDBC adapters (ReferenceRange.findByAnalyteRefId, PriceList.findByStatus). The
      Postgres volume must be reset (docker compose down -v) before the run because
      CatalogTestConfigurationLocalDatabaseTest uses fixed codes (DB-SVC-1, DB-PRC-1) and is not
      self-cleaning; a volume retained from the MVP-MOD-002-BE-001 run causes a legitimate
      duplicate-code 400 (existsByCode), not a defect.
  - id: VAL-004
    name: Spring Modulith module boundaries remain valid
    method: PlatformFoundationModulithTest
    result: passed
  - id: VAL-005
    name: OpenAPI/contract coverage
    method: CatalogTestConfigurationContractTest cross-checks every operation in all 8
      openapi-source.yaml files (including the newly modeled publishSampleType) against registered
      Spring MVC routes.
    result: passed
  - id: VAL-006
    name: Former 501 hooks now return functional behavior
    method: CatalogCustomRulesApiTest and CatalogTestConfigurationApiTest assert publication,
      snapshot, immutability (409), assignment gating, effective resolution and effective-window
      overlap (409) behavior instead of HTTP 501.
    result: passed
  - id: VAL-007
    name: YAML repository files remain parseable
    method: Edited bcm-svc-007 openapi-source.yaml parsed by SnakeYAML in CatalogTestConfigurationContractTest;
      this evidence YAML and the updated PROJECT_STATE.yaml / SOURCE_OF_TRUTH.yaml parse without errors.
    result: passed
  - id: VAL-008
    name: Agent-agnostic scan
    method: Reviewed all created/modified Java and YAML artifacts for named-agent, assistant,
      model-vendor or platform-runtime references.
    result: passed
    detail: No named-agent or vendor-runtime dependency found.

blocking_gaps: []

