preflight:
  purpose: >
    Burn down technical debt TD-BE-012 in LocalFilesystemDocumentAdapter before implementing
    custom delivery, notification, and critical results rules.
  corrections_applied:
    - file: LocalFilesystemDocumentAdapter.java
      finding: Path traversal vulnerability and constructor throwing warning (SpotBugs CT_CONSTRUCTOR_THROW).
      correction: Made class final, added resolveSafe path traversal verification, and thrown custom DocumentManagementException instead of RuntimeException.
    - file: NotificationManagementService.java
      finding: Locale-sensitive channel parsing and provider exception handling needed executable validation.
      correction: Added Locale.ROOT parsing, preserved failed-dispatch behavior, and covered null/invalid channel defaults.
    - file: LocalDeterministicNotificationProvider.java
      finding: Console output and CRLF-sensitive log values were reported by static analysis.
      correction: Replaced console output with guarded SLF4J logging and sanitized log values.
    - file: ResultDeliveryService.java
      finding: Method complexity and loop event creation were reported in touched custom-rule code.
      correction: Extracted patient, representative, doctor and event-publishing helpers.

validations:
  - id: VAL-DLV-001
    name: Delivery release enforcement
    rule_id: BCM-RES-004-RN-001
    test_id: TST-DLV-004-01
    result: passed
    detail: ResultDeliveryService authorizeResultDelivery throws IllegalStateException if status is not released.
  - id: VAL-DLV-002
    name: Patient identity ownership matching
    rule_id: BCM-RES-004-RN-002
    test_id: TST-DLV-004-02
    result: passed
    detail: ResultDeliveryService getDeliveredResult throws IllegalStateException if callerId does not match recipientId.
  - id: VAL-DLV-003
    name: Patient representative authorization validity
    rule_id: BCM-RES-004-RN-003
    test_id: TST-DLV-004-03
    result: passed
    detail: ResultDeliveryService listRepresentatives checks status is active and today is within valid authorization window.
  - id: VAL-DLV-004
    name: Referring doctor order match
    rule_id: BCM-RES-004-RN-004
    test_id: TST-DLV-004-04
    result: passed
    detail: ResultDeliveryService authorizeResultDelivery verifies referring doctor from order snapshot before ticket generation.
  - id: VAL-DLV-005
    name: Ticket withholding on result amendment
    rule_id: BCM-RES-004-RN-005
    test_id: TST-DLV-004-05
    result: passed
    detail: ResultDeliveryService withholdResultDelivery transitions tickets to WITHHELD and publishes ResultDeliveryWithheldEvent.
  - id: VAL-DLV-006
    name: Read-only boundary governance
    rule_id: BCM-RES-004-RN-006
    test_id: TST-DLV-004-06
    result: passed
    detail: No mutation commands are executed against LaboratoryResult, Patient or Doctor.
  - id: VAL-DLV-007
    name: Result viewed event logging
    rule_id: BCM-RES-004-RN-007
    test_id: TST-DLV-004-07
    result: passed
    detail: getDeliveredResult marks ticket status to VIEWED and publishes ResultViewedEvent.
  - id: VAL-CRR-001
    name: Critical escalation mandatory creation
    rule_id: BCM-RES-006-RN-001
    test_id: TST-CRR-006-01
    result: passed
    detail: Event listener creates CriticalResultEscalation for every ResultFlaggedCriticalEvent.
  - id: VAL-CRR-002
    name: Escalation tier progression
    rule_id: BCM-RES-006-RN-002
    test_id: TST-CRR-006-02
    result: passed
    detail: escalate method advances tier and triggers CriticalResultEscalatedEvent.
  - id: VAL-CRR-003
    name: Acknowledgment constraints
    rule_id: BCM-RES-006-RN-003
    test_id: TST-CRR-006-03
    result: passed
    detail: close method refuses closure without both acknowledgedBy and acknowledgedAt recorded.
  - id: VAL-RNT-001
    name: Notification composition sequence
    rule_id: BCM-RES-007-RN-001
    test_id: TST-RNT-007-01
    result: passed
    detail: ResultNotificationService composes result_delivered notification only on ResultDeliveryAuthorizedEvent.
  - id: VAL-RNT-002
    name: Notification critical trigger
    rule_id: BCM-RES-007-RN-002
    test_id: TST-RNT-007-02
    result: passed
    detail: ResultNotificationService composes result_critical notification on ResultFlaggedCriticalEvent.
  - id: VAL-RNT-003
    name: Notification platform dispatch
    rule_id: BCM-RES-007-RN-003
    test_id: TST-RNT-007-03
    result: passed
    detail: Dispatch routed through NotificationManagementService (SubmitNotificationRequest).

