technical_debt:
  registered:
    - id: TD-FE-007
      summary: >-
        LaboratoryResult (AGG-009, owned by BCM-LAB-006/MVP-MOD-006) has a wire-shape mismatch
        between its FE type (analyteSnapshots/referenceRangeSnapshots/resultValues arrays,
        testDefinitionId, version) and the real backend record (singular analyteSnapshot/
        referenceRangeSnapshot/resultValue, no version). This predates MVP-MOD-007-FE-001 and
        already affected the already-closed ResultReleaseScreen.tsx, TechnicalValidationScreen.tsx
        and MedicalValidationScreen.tsx (their tests only ever mocked the API-client boundary, never
        exercising a real backend response). This backlog item worked around it locally by
        normalizing the response inside resultsDeliveryApi.ts rather than reshaping the shared type.
      disposition: open_tracked_not_introduced_by_this_backlog_recommend_dedicated_cleanup_item
  out_of_scope_confirmed:
    - TD-FE-003 (ESLint complexity/max-lines-per-function warnings on pre-existing, untouched
      screens) — pre-existing, unrelated to this backlog item.
    - TD-I18N-002 (full i18n-library adoption) — pre-existing, unrelated to this backlog item's
      scope.

