agent_agnostic_validation: >
  Grepped every file touched by this backlog item (frontend and backend) for
  claude|anthropic|copilot|cursor|chatgpt|openai|gemini|codex|windsurf|aider (case-insensitive). 0
  forbidden matches; the only hits were "cursor: pointer" CSS declarations in the pre-existing
