i18n_and_magic_string_validation: >
  Non-ASCII symbols introduced in ResultSearchScreen.tsx ("⚠") were removed in favor of the existing
  catalog-status--critical CSS class plus text and aria-label, matching the convention already used
  by the sibling CriticalEscalationsScreen.tsx/ResultNotificationsScreen.tsx in this same backlog
  item. The em-dash ("—") used as a missing-value placeholder was kept: it is an already-established
  repo convention (present in SalesScreen.tsx, CashSessionsScreen.tsx, BillingRequestsScreen.tsx and
  DiagnosticOrdersScreen.tsx before this backlog item). Cross-screen selection guards and
  action-outcome messages were centralized in messages.ts; single-occurrence screen copy (headings,
  button labels, empty-state prose specific to one screen) remains inline, consistent with the
  repo's documented policy (messages.ts header comment, TD-I18N-002) that only literal duplicates
  across screens are externalized.

