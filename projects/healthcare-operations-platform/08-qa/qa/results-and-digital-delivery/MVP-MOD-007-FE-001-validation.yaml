  objective: >
    Compile the employee-portal UI outputs for Results and Digital Delivery: Result Search and
    Worklist / Result Detail (BCM-RES-001), Result Report History and Regenerate (BCM-RES-002),
    Critical Result Escalation Worklist / Acknowledge / Escalate / Close (BCM-RES-006), and Result
    Notification History (BCM-RES-007).

pre_existing_work_in_progress_found: >
  This backlog item started with an uncommitted, partially built set of four screens
  (ResultSearchScreen.tsx, ResultReportsScreen.tsx, CriticalEscalationsScreen.tsx,
  ResultNotificationsScreen.tsx), a resultsDeliveryApi.ts client, matching types.ts additions, and
  test files, plus AppShell/App/messages.ts wiring, all already present in the working tree from a
  prior session. npm run format:check was the only failing gate reported at handoff. That work was
  kept and built upon, but validating resultsDeliveryApi.ts against the real backend controllers
  (not just the tests, which mocked the HTTP layer) found the previous session's client targeted
  endpoints that did not actually exist as REST adapters: BCM-RES-001 result search/detail had no
  list-by-status endpoint and getResultById omitted the backend's required tenantId parameter;
  BCM-RES-002 report history/regenerate and BCM-RES-007 notification history had no web adapter at
  all — only bare domain classes or an application service existed for them, despite
  MVP-MOD-007-BE-001 ("Compile result report and document generation outputs") having been marked
  closed. This was escalated to the requester, who selected building the missing backend end to end
  rather than descoping or stubbing the corresponding screens.

debt_first_action:
  reviewed: 08-qa/technical-debt/technical-debt-index.yaml
  candidates_considered:
    - TD-FE-003
    - TD-I18N-002
  disposition: >
    TD-FE-003 (ESLint complexity/max-lines-per-function warnings on screen components) was
    reviewed. This backlog item's own new code triggered fresh instances of that same warning class
    on ResultSearchScreen.tsx (206-line component, complexity 27) and CriticalEscalationsScreen.tsx
    (243-line component) plus a complexity warning on resultsDeliveryApi.ts's response mapper; all
    three were refactored down to 0 lint warnings by extracting ResultDetailPanel/
    ResultLifecycleTimeline (ResultSearchScreen.tsx) and EscalationDetailPanel/EscalationsTable
    (CriticalEscalationsScreen.tsx) sub-components, and by splitting the LaboratoryResult mapper
    into toAnalyteSnapshots/toReferenceRangeSnapshots/toResultValues/toIncidents/toAmendments
    helpers, rather than adding to the historical TD-FE-003 total. TD-FE-003 itself (pre-existing
    screens) remains open and out of scope. TD-I18N-002 (full i18n-library adoption) is unrelated to
    this backlog item's scope; single-occurrence screen copy for the four new screens follows the
    same inline-copy convention as every other employee-portal screen.
  new_debt_registered: TD-FE-007 (new) — see technical_debt section below.

backend_gap_closure: >
  Rather than leaving MVP-MOD-007-FE-001 blocked on incomplete backend work from BE-001/BE-002, the
  following backend additions were made in 07-implementation/backend to give the four FE screens a
  real, contract-verified surface to call (all covered by JUnit unit tests plus one MockMvc
  integration assertion per new endpoint in LaboratoryResultsApiTest; full 07-implementation/backend
  suite: 156 tests, 0 failures, 0 errors, 9 skipped local-database tests, JaCoCo line coverage 76.99%
  vs. the 76.93% floor from MVP-MOD-007-BE-002):
  - BCM-RES-001: added LaboratoryResultsService.listByStatus + LaboratoryProcessingController
    GET /api/clinical-operations/laboratory-results?tenantId=&status= (repository.findByStatus
    already existed in both InMemory and Jdbc implementations; only the service method and the
    controller endpoint were missing).
  - BCM-RES-002: built the previously-missing GeneratedResultReportRepository (port + in-memory
    adapter), ResultReportService (list + regenerate, enforcing the RN-001 release-state
    precondition, versioning and superseding prior active reports), and ResultReportController
    (GET .../reports, POST .../reports/regenerate), wiring DocumentManagementService for the first
    time to an actual production caller (previously exercised only by its own unit test). Added a
    GENERATION_FAILED status and an integrityChecksum field to GeneratedResultReport additively,
    without changing the existing GENERATED/SUPERSEDED enum values or constructor already covered by
    ResultsDomainTest.
  - BCM-RES-007: added ResultNotificationRequestRepository.findByResultId,
    ResultNotificationService.listNotificationsForResult, and ResultNotificationController
    (GET .../notifications). Added channel/dispatchedAt/deliveredAt/failureReason fields to
    ResultNotificationRequest (additive; existing legacy/full constructors and getters used by
    ResultsDomainTest and ResultNotificationServiceTest were preserved).
  - Fixed a Spring Modulith module-boundary violation surfaced by this change: documentmanagement's
    application/domain packages had no NamedInterface, so resultsanddigitaldelivery could not
    legitimately depend on DocumentManagementService/StoredDocument/RetentionPolicy even though the
    module-level allowedDependencies already listed "documentmanagement". Added
    document-service/document-domain NamedInterfaces and referenced them explicitly;
    PlatformFoundationModulithTest passes.
  - All four additions follow the exact existing sibling pattern (ResultDeliveryController /
    CriticalResultEscalationController and their in-memory repositories), including the
    module's established convention of unconditional (no @Profile) in-memory repositories.

frontend_contract_correction: >
  resultsDeliveryApi.ts was updated to match the corrected/completed backend contract:
  getResultById, listResultReports, regenerateReport and listResultNotifications now require and
  send tenantId (and regenerateReport an actorId), matching every other controller in this codebase.
  Because BCM-LAB-006's LaboratoryResult wire shape (singular analyteSnapshot/
  referenceRangeSnapshot/resultValue, no version field) predates this backlog and is shared with
  already-closed MVP-MOD-006 screens (ResultReleaseScreen, TechnicalValidationScreen,
  MedicalValidationScreen) that already carry the same shape mismatch against their own FE
  LaboratoryResult type, reshaping that shared type was out of scope (historical debt, not
  introduced by this backlog item, per the framework's debt-first policy). Instead,
  resultsDeliveryApi.ts normalizes the real backend response into the existing LaboratoryResult FE
  shape at the API-client boundary (toLaboratoryResult and its five field-mapper helpers), so
  ResultSearchScreen.tsx renders correctly against the real backend without changing the shared type
  or the other, already-closed screens that consume it.

