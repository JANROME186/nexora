registry_gaps_found_and_corrected_disclosed:
  found_during: MVP-MOD-007-CLOSEOUT
  summary: >
    Two real, independent defects were found and fixed while re-verifying gates for closeout,
    rather than propagating them forward:
  findings:
    - id: FINDING-001
      area: employee_portal_coverage
      issue: >-
        Employee portal line coverage had silently regressed from the 84.44% floor recorded by
        HOP-ENT-FOUND-001 to 84.03%. MVP-MOD-007-PORTAL-001 expanded
        07-implementation/employee-portal/src/api/laboratoryOperationsApi.ts and
        laboratoryResultMapper.ts (shared with the employee portal) but never added a dedicated
        unit test for the API module (its 162 lines were only exercised indirectly, and mostly
        mocked, through the various *Screen.test.tsx suites).
      fix: >-
        Added src/test/laboratoryOperationsApi.test.ts, mirroring the existing
        cashSalesApi.test.ts/frontDeskApi.test.ts real-fetch-mock pattern, covering all 18 exported
        functions. Coverage restored to 85.50%, above the previous 84.44% floor. `npm run quality`
        re-executed clean (typecheck, lint, test:coverage, build, duplication, format:check,
        license:check); `npm audit --audit-level=low` returned 0 vulnerabilities.
      corrected_artifacts:
        - 07-implementation/employee-portal/src/test/laboratoryOperationsApi.test.ts (new)
        - PROJECT_STATE.yaml (project)
        - SOURCE_OF_TRUTH.yaml (project)
        - 08-qa/technical-debt/technical-debt-index.yaml
    - id: FINDING-002
      area: patient_doctor_portal_coverage_never_measured
      issue: >-
        MVP-MOD-007-PORTAL-001 closed patient-portal and doctor-portal with only an application
        smoke test each and never recorded a line-coverage percentage in any registry, so no
        coverage floor existed for either stack.
      fix: >-
        Measured both for the first time via `npm run test:coverage`: patient-portal 41.93%,
        doctor-portal 40.62%. Registered TD-FE-008 and TD-FE-009 to track and raise these toward
        the 80% target (via the COM-MOD-009 patient/doctor portal expansion) without blocking this
        closeout, mirroring how TD-FE-004/TD-APP-002 were opened for employee-portal/mobile at
        their own inception.
      corrected_artifacts:
        - 08-qa/technical-debt/TD-FE-008-patient-portal-coverage-baseline.yaml (new)
        - 08-qa/technical-debt/TD-FE-009-doctor-portal-coverage-baseline.yaml (new)
        - 08-qa/technical-debt/technical-debt-index.yaml
        - PROJECT_STATE.yaml (project)
  impact_on_this_closeout: >
    Both findings are corrected before this closeout is marked passed; no coverage figure in this
    evidence file or in any registry it updates is left inflated, stale or unmeasured without an
    explicit debt record.

debt_first_review:
  code_change_required_for_this_backlog_item: true
  rationale: >
    Unlike prior CLOSEOUT items in this project (which were registry-consolidation only),
    MVP-MOD-007-CLOSEOUT required a real code change to close TD-BE-010, which had been blocked on
    MVP-MOD-006-BE-002 (now closed) providing the cross-module Sample read port.
  technical_debt_index_reviewed: true
  debt_closed_by_this_backlog_item:
    - id: TD-BE-010
      title: Diagnostic order cancellation override uses order-status as a proxy for downstream sample/processing state
      change: >-
        Extended frontdeskcaredelivery's Spring Modulith allowedDependencies to
        laboratoryworkflow::sample-read-port. DiagnosticOrderManagementService.cancel() now calls
        SampleReadPort#hasActiveSampleForOrder(orderId, tenantId) (implemented by OrderSamplesService
        since MVP-MOD-006-BE-002) as the primary clinically-engaged trigger; the original
        order-status tier (accepted/in_progress) is retained only as a fallback for orders without
        a linked sample record.
      test_evidence: >-
        New FrontDeskCareDeliveryApiTest.diagnosticOrderCancellationRequiresOverrideOnceARealSampleIsCollectedRegardlessOfOrderStatus
        collects a real Sample against a "priced" (not yet accepted) order and proves cancel is
        rejected without an override and accepted with one -- showing order status alone no longer
        gates the decision. All 19 FrontDeskCareDeliveryApiTest cases and
        PlatformFoundationModulithTest (module-boundary/cycle check) pass with the new
        allowedDependencies entry.
  debt_registered_by_this_backlog_item:
    - id: TD-FE-008
      title: Establish patient portal test coverage baseline and raise it to the 80 percent target
    - id: TD-FE-009
      title: Establish doctor portal test coverage baseline and raise it to the 80 percent target
  technical_debt_index_summary:
    total_entries: 43
    closed: 17
    materially_reduced: 7
    open: 19
    note: >-
      19 open entries include TD-FE-008 and TD-FE-009, both newly registered by this backlog item;
      17 open entries are unrelated to MVP-MOD-007 (see the list below).
    blocking: 0
  open_debt_not_attributable_to_mvp_mod_007_left_untouched_by_design:
    - TD-STACK-001 (full-stack modernization roadmap)
    - TD-BE-005, TD-BE-006, TD-BE-007, TD-BE-008 (people/clinical-master-data custom-rule debt)
    - TD-FE-002 (people/clinical-master-data UI gaps)
    - TD-DEF-002 (appointment capacity planning, deferred to BCM-ORG-007)
    - TD-FE-005 (production hosting security headers)
    - TD-FE-006 (appointment/admission/quotation UI gaps)
    - TD-DB-002, TD-DB-003, TD-DB-004 (catalog localization, reference-data API, native RLS)
    - TD-UX-001, TD-UX-002, TD-UX-003 (component library, responsive/accessibility tooling, mobile layout)
    - TD-STACK-002, TD-STACK-003 (JPA/Hibernate evaluation, contract-generation tooling)
  materially_reduced_debt_not_attributable_to_mvp_mod_007_left_untouched_by_design:
    - TD-BE-002, TD-BE-003, TD-BE-004 (backend static analysis, coverage, release supply-chain gates)
    - TD-FE-003 (frontend enterprise quality profile)
    - TD-APP-001 (mobile enterprise quality baseline)
    - TD-I18N-002 (full localization/message-catalog adoption)
    - TD-IAM-002 (permission granularity)
  rationale_for_not_remediating_unrelated_debt: >
    None of the above items are scoped to BCM-RES-*/BCM-PLT-003/BCM-PLT-008 or to code this
    closeout touches; remediating them here would be scope creep unrelated to Results and Digital
    Delivery module closure. They remain correctly tracked and will be picked up by the backlog
    items whose scope they belong to.

