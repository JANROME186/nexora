    consistencia entre backend, employee portal, patient portal, doctor portal y mobile app.

pre_existing_work_in_progress_found: >
  The backend implementation was failing ApplicationContext loading in integration tests due to 
  the addition of JDBC repositories without proper profile isolation between tests and runtime.
  This was resolved by forcing the `test` profile for maven-surefire-plugin and properly separating 
  !local & !test for JDBC and local/test for InMemory repositories, perfectly aligning with TD-DB-001.

debt_first_action:
  reviewed: 08-qa/technical-debt/technical-debt-index.yaml
  candidates_considered:
    - TD-DB-001
    - TD-QA-004
  disposition: >
    Both TD-DB-001 (missing persistence layer for Results Digital Delivery) and TD-QA-004
    (malformed query parameter 500 error handling) were thoroughly addressed during the QA process.
    TD-QA-004 was remediated via GlobalExceptionHandler implementation, and TD-DB-001 was remediated
    via the creation of JDBC repositories bound to `!local & !test` profiles.
  new_debt_registered: none

