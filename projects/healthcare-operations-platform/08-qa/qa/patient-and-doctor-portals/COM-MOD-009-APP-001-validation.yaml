artifact:
  id: COM-MOD-009-APP-001-VALIDATION
  type: qa-validation-evidence
  backlog_item: COM-MOD-009-APP-001
  module: COM-MOD-009 Patient and Doctor Portals
  name: Patient mobile workflow validation
  status: passed
  created_date: 2026-07-19
  owner: Nexora Delivery Team

scope:
  changed_stack: mobile_app_typescript
  implementation_root: 07-implementation/mobile-app/
  objective: >
    Compile the patient mobile workflow over the existing mobile foundation so an authenticated
    patient can access profile, appointments, orders, released results and notifications through
    permission-filtered routes, localized labels and backend API facades.

delivered_capabilities:
  - id: patient_mobile_permissions
    status: passed
    evidence:
      - Added PATIENT role and five granular patient portal permissions to the mobile permission catalog.
      - Added patient-profile, patient-appointments, patient-orders, patient-results and patient-notifications routes.
      - Home actions are now filtered from session role permissions instead of fixed visible route lists.
  - id: patient_mobile_api_facade
    status: passed
    evidence:
      - Added patientMobileApi facade for profile, appointments, orders, results and notifications.
      - API calls propagate bearer token and session headers through the existing agent-agnostic FetchLike boundary.
  - id: patient_mobile_workflow_model
    status: passed
    evidence:
      - Added patientMobileWorkflowModel with loading, ready, empty, forbidden and error states.
      - Workflow only loads sections allowed by the authenticated session's permissions.
  - id: localization
    status: passed
    evidence:
      - Added es-MX and en-US mobile labels/messages for patient workflow routes and states.
      - Replaced hard-coded home screen display text with locale-backed message catalog values.

technical_debt_action:
  required_before_feature_work: true
  items_materially_reduced:
    - id: TD-I18N-002
      result: materially_reduced
      detail: >
        New and changed patient mobile labels, state messages and home screen text are externalized
        through the es-MX/en-US catalog rather than embedded in code.
    - id: TD-IAM-002
      result: materially_reduced
      detail: >
        Mobile patient workflow uses granular permission codes and role-derived dynamic navigation
        instead of broad static route exposure.

