security_and_access:
  anonymous_surface: >-
    The public website is unauthenticated by design, matching the backend's deliberate omission of
    /api/public/** from EndpointPermissionRegistry. No login/session state is introduced.
  no_internal_identifiers_exposed: >-
    Response DTOs (src/api/types.ts) mirror the backend publicweb records exactly; no tenantId,
    actorId, audit metadata or other internal identifier is displayed or requested from the user.
    tenantId/laboratoryId/branchId sent in appointment/quotation request bodies come from
    deployment-owned site configuration (src/config/siteConfig.ts), never from user-visible fields.
  rate_limit_handling: >-
    429 responses (PUBLIC_RATE_LIMIT_EXCEEDED) are explicitly handled: the submit button is
    disabled and a countdown message is shown for a fixed client-side cooldown window, since the
    backend interceptor sends no Retry-After header to compute an exact reset time from.
  privacy: >-
    A dedicated Privacy notice page (/privacy) explains what contact data is collected (name/
    phone/email) and why; both request forms require an explicit consent checkbox before
    submission, and collect no data beyond what the backend's ProspectiveContact intake accepts.
  dependency_posture: >-
    New dev-only dependencies: eslint-plugin-jsx-a11y, jest-axe, @types/jest-axe. No new runtime
    (production) dependency was added beyond react/react-dom, already used by every other portal.
  vulnerabilities: 0 known vulnerabilities in npm audit and Trivy scans.

closure_criteria:
  public_website_compiles_and_runs_locally: true
  consumes_public_api_surface_correctly: true
  tests_executed_with_evidence: true
  no_vulnerabilities_of_any_level: true
  no_coverage_regression: true
  technical_debt_addressed: true
  no_stale_pointers: true
  git_clean: true
  agent_agnostic: true
  live_backend_integration_note: >-
    This iteration's environment had no reachable Docker daemon to bring up compose.local.yml's
    PostgreSQL container and run the Spring Boot backend live, so end-to-end verification against
    a running backend was not performed in this session. The frontend build was verified via
    `npm run build` + `vite preview` (production shell served correctly, 200 on the JS bundle,
    robots.txt reachable), and the API contract was verified against the backend's own documented
    DTOs/error codes/status codes (PublicWebApiTest.java, PublicWebExceptionHandler.java,
    PublicApiRateLimitInterceptor.java) with 97 passing unit/integration tests mirroring that
    contract exactly. A live backend+frontend smoke run is recommended as part of human review per
    the local-solution-runbook process before this module is exposed publicly.

