debt_first_review:
  applicable: true
  debt_items_reviewed:
    - TD-UX-002
    - TD-UX-001
    - TD-FE-005
    - TD-I18N-002
    - TD-STACK-001
  debt_items_addressed:
    - id: TD-UX-002
      action: materially_reduced
      detail: >-
        This backlog item was the "next_frontend_quality_profile_hardening_backlog_item" the
        debt's remediation strategy pointed at. Implemented both acceptance criteria as the
        reference pattern for the new module: a documented mobile-first responsive breakpoint set
        (src/styles.css) applied to every screen, and an automated axe-core accessibility check
        (jest-axe, src/test/accessibility.test.tsx) wired into npm run test/quality plus
        eslint-plugin-jsx-a11y in npm run lint. employee-portal (the debt's originally discovered
        affected_area) was outside this item's working_directory and was not modified, so status
        moved from open to materially_reduced, not closed; full progress_log entry recorded in
        08-qa/technical-debt/TD-UX-002-no-responsive-accessibility-automation.yaml.
    - id: TD-I18N-002
      action: reduced
      detail: >-
        All visible labels/messages for the new public-website module were externalized to
        es-MX/en-US catalogs from the start; no hardcoded one-language label was introduced.
  new_debt_registered: []

