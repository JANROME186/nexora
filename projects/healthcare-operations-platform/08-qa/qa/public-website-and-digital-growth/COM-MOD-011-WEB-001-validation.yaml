implementation:
  public_website_outputs:
    - file: 07-implementation/public-website/src/api/httpClient.ts
      detail: >-
        Fetch wrapper returning a typed ApiError{status, code, message, isRateLimited}. code is
        parsed from the backend's shared error envelope so callers resolve a localized message by
        code instead of displaying the server's English message text; network failures are wrapped
        as ApiError(0, "NETWORK_ERROR").
    - file: 07-implementation/public-website/src/api/publicCatalogApi.ts
      detail: Typed client for all 8 GET /api/public/catalog/** operations (4 published-list +
        4 published-snapshot), matching the backend path/query-param contract exactly.
    - file: 07-implementation/public-website/src/api/careDeliveryApi.ts
      detail: Typed client for the 2 POST /api/public/care-delivery/** intake operations.
    - file: 07-implementation/public-website/src/api/types.ts
      detail: Request/response DTOs mirroring the backend publicweb records field-for-field; no
        tenantId/audit/internal-identifier field is added client-side.
    - file: 07-implementation/public-website/src/config/siteConfig.ts
      detail: >-
        Deployment-owned tenantId/laboratoryId/branch identity (env-overridable), since
        COM-MOD-011-DEF modeled no public branch-directory capability and the public catalog/
        intake endpoints require laboratoryId/branchId as input.
    - file: 07-implementation/public-website/src/router/Router.tsx
      detail: Minimal hand-rolled History-API router (Link/useRouter/RouterProvider), giving every
        catalog and form page a real, shareable, crawlable URL without adding a router dependency.
    - file: 07-implementation/public-website/src/i18n/LocaleContext.tsx
      detail: es-MX/en-US locale context following the same pattern as patient-portal/doctor-portal
        (default es-MX, fallback en-US, localStorage persistence).
    - file: 07-implementation/public-website/src/i18n/locales/es-MX.ts,en-US.ts
      detail: Full message catalog (nav, home, catalog sections, both request forms, errors keyed
        by backend error code, privacy notice, SEO titles/descriptions); no hardcoded UI strings.
    - file: 07-implementation/public-website/src/components/common/CatalogListView.tsx,
        CatalogDetailView.tsx
      detail: Shared loading/empty/error/success chrome reused by all 4 list and 4 detail pages,
        keeping jscpd duplication under threshold.
    - file: 07-implementation/public-website/src/pages/{Services,Tests,Panels,Preparations}Page.tsx,
        {Service,Test,Panel,Preparation}DetailPage.tsx
      detail: Published-catalog discovery pages, each with loading/empty/error/success states.
    - file: 07-implementation/public-website/src/pages/AppointmentRequestPage.tsx,
        QuotationRequestPage.tsx
      detail: Public request forms with client-side contact-required/at-least-one-item/consent
        validation, an explicit 429 cooldown (useRateLimitCooldown, since the backend sends no
        Retry-After header), and success/error/loading states.
    - file: 07-implementation/public-website/src/pages/HomePage.tsx, PrivacyPage.tsx,
        NotFoundPage.tsx
      detail: Landing page with catalog/branch overview, a privacy notice page describing the
        contact-data collection/use, and a 404 fallback.
    - file: 07-implementation/public-website/src/seo/usePageMeta.ts
      detail: Per-page document title/meta description/canonical link/Open Graph tag hook.
    - file: 07-implementation/public-website/public/robots.txt, sitemap.xml
      detail: Crawler foundations for the static routes known at deploy time.
    - file: 07-implementation/public-website/src/styles.css
      detail: Documented 3-tier mobile-first responsive breakpoint set (40rem/60rem/75rem) applied
        across every screen; addresses TD-UX-002's responsive-breakpoint acceptance criterion.
    - file: 07-implementation/public-website/eslint.config.js, package.json
      detail: Adds eslint-plugin-jsx-a11y to the lint gate and jest-axe to the test gate, addressing
        TD-UX-002's automated-accessibility-check acceptance criterion.

