security_and_access:
  no_internal_identifiers_exposed_in_content_review: >-
    PublicContentReviewScreen consumes the same anonymous /api/public/catalog/**/published
    endpoints the public website itself calls; the response DTOs never carry tenantId, audit
    metadata or other internal identifier, so none can be displayed by construction — no redaction
    logic was needed or written.
  request_queues_show_internal_data_only_to_authorized_staff: >-
    PublicAppointmentRequestsScreen/PublicQuotationRequestsScreen consume the existing internal
    /api/care-delivery/** endpoints (already IAM-gated server-side) and are themselves gated
    behind SCREEN_PUBLIC_APPOINTMENT_REQUESTS/SCREEN_PUBLIC_QUOTATION_REQUESTS permissions,
    granted only to ADMIN and FRONT_DESK roles; the tab is hidden entirely for other roles.
  no_new_action_endpoint: >-
    Every triage action (confirm/cancel appointment, issue/cancel quotation) reuses an existing
    backend endpoint; no new state-changing endpoint was created.
  dependency_posture: >-
    3 new dev-only dependencies (jest-axe, "@types/jest-axe", eslint-plugin-jsx-a11y), all MIT.
    No new production/runtime dependency was added beyond react/react-dom.
  vulnerabilities: >-
    0 known vulnerabilities in npm audit and Trivy scans (frontend and backend) after the Jackson
    CVE-2026-59889 fix; see quality_gates for the OWASP environment caveat.

