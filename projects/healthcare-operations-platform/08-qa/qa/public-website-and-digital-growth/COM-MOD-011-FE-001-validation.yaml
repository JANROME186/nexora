implementation:
  real_defect_found_and_fixed:
    description: >-
      QuotationRequest had no channel field, unlike AppointmentSlot, so public-website-submitted
      quotation drafts were only distinguishable from staff-initiated ones by an unreliable
      status+patientId heuristic — no reliable way to build a public-request queue screen for
      quotations existed.
    fix: >-
      Added QuotationRequest.channel (mirroring AppointmentSlot's CHANNEL_* constants), an
      additive nullable care_delivery.quotations.channel column, StartQuotationCommand.channel
      (optional), and QuotationManagementService validation: start() defaults to
      channel=employee_portal when omitted (preserving every existing untouched caller) and
      rejects channel=public_website from internal callers; startPublic() always stamps
      channel=public_website regardless of input. PublicQuotationIntakeResult also gained a
      channel field for symmetry with PublicAppointmentIntakeResult.
    backend_files:
      - 07-implementation/backend/.../quotationmanagement/domain/QuotationRequest.java
      - 07-implementation/backend/.../quotationmanagement/application/StartQuotationCommand.java
      - 07-implementation/backend/.../quotationmanagement/application/QuotationManagementService.java
      - 07-implementation/backend/.../quotationmanagement/adapter/in/web/QuotationController.java
      - 07-implementation/backend/.../quotationmanagement/adapter/out/jdbc/JdbcQuotationRequestRepository.java
      - 07-implementation/backend/.../publicweb/intake/PublicQuotationIntakeController.java (via
        PublicIntakePort.PublicQuotationIntakeResult)
      - 07-implementation/backend/.../frontdeskcaredelivery/publicintake/PublicIntakeAdapter.java
      - 07-implementation/backend/src/main/resources/db/front-desk-care-delivery/schema.sql
        (ALTER TABLE care_delivery.quotations ADD COLUMN IF NOT EXISTS channel varchar(40))
    backend_tests_added:
      - PublicWebApiTest.anonymousQuotationRequestStaysDraftFromProspectiveContact (extended with
        a channel="public_website" assertion)
      - FrontDeskCareDeliveryApiTest.quotationChannelDefaultsToEmployeePortalWhenOmitted
      - FrontDeskCareDeliveryApiTest.quotationChannelAcceptsAnExplicitInternalValue
      - FrontDeskCareDeliveryApiTest.quotationRejectsPublicWebsiteChannelFromInternalEndpoint
    backend_line_coverage_percent: 83.99
    backend_line_coverage_previous_baseline: 83.96
    backend_tests_total: 327
    backend_test_failures: 0
  employee_portal_outputs:
    - file: 07-implementation/employee-portal/src/api/publicContentApi.ts
      detail: Thin client for the 4 GET /api/public/catalog/**/published endpoints — the same
        anonymous endpoints the public website itself calls — so the content-review screen shows
        exactly what a visitor sees and inherently cannot expose tenantId/audit/internal fields.
    - file: 07-implementation/employee-portal/src/api/publicRequestsApi.ts
      detail: Thin client wrapping the existing internal /api/care-delivery/appointments and
        /api/care-delivery/quotations list/confirm/cancel/issue endpoints. No new backend action
        endpoint was created.
    - file: 07-implementation/employee-portal/src/api/types.ts
      detail: Added PublicDiagnosticServiceSnapshot/PublicTestSnapshot/PublicPanelSnapshot/
        PublicPreparationSnapshot (mirroring public-website's types field-for-field) and
        AppointmentSlot/QuotationRequest (full internal shape, since these are staff screens).
    - file: 07-implementation/employee-portal/src/components/screens/PublicContentReviewScreen.tsx
      detail: Multi-area toolbar (services/tests/panels/preparations), read-only DataTable of
        published items, loading/empty/error states. Deliberately consumes the public endpoints,
        not the internal catalog-admin API already owned by DiagnosticCatalogScreen.
    - file: 07-implementation/employee-portal/src/components/screens/PublicAppointmentRequestsScreen.tsx
      detail: Queue table filtered client-side to channel=="public_website" &&
        status=="requested", detail panel, Confirm/Reject actions behind ConfirmDialog, each
        wrapped in useAsyncAction with StatusBanner loading/error/success feedback. On action
        success the item is removed from the queue but the detail panel stays showing the updated
        record (not cleared), so the confirmation message and new status remain visible.
    - file: 07-implementation/employee-portal/src/components/screens/PublicQuotationRequestsScreen.tsx
      detail: Same shape, filtered to channel=="public_website" && status=="draft", Issue/Reject
        actions.
    - file: 07-implementation/employee-portal/src/state/permissions.ts, src/App.tsx,
        src/components/layout/AppShell.tsx
      detail: 3 new ScreenKeys/PermissionCodes (SCREEN_PUBLIC_CONTENT_REVIEW,
        SCREEN_PUBLIC_APPOINTMENT_REQUESTS, SCREEN_PUBLIC_QUOTATION_REQUESTS), granted to ADMIN
        (automatic) and FRONT_DESK (already owns reception/diagnostic-orders/diagnostic-catalog).
        Registered in SCREEN_COMPONENTS/SCREEN_TAB_LABEL_KEYS so navigation is permission-filtered
        like every other screen (hidden, not just disabled, per the enterprise IAM standard).
    - file: 07-implementation/employee-portal/src/i18n/locales/es-MX.ts, en-US.ts
      detail: 3 new namespaced message groups (publicContentReview, publicAppointmentRequests,
        publicQuotationRequests) plus 3 appShell.tabs entries, following the nested-namespace
        convention (t.<namespace>.*) rather than the legacy flat MESSAGES import. No hardcoded
        visible string in any new screen.
    - file: 07-implementation/employee-portal/src/components/common/ConfirmDialog.tsx
      detail: Removed autoFocus on the confirm button (jsx-a11y/no-autofocus finding surfaced by
        adding eslint-plugin-jsx-a11y — see technical_debt_addressed below).

