debt_first_review:
  applicable: true
  rationale: >-
    This is a definition-only backlog item with no code changes, so no code-changing debt item
    could be remediated with actual code. TD-BE-015 was genuinely reasonably addressable at the
    modeling stage: its own remediation_strategy already named
    gradual_before_first_public_api_consumer_onboarding with target_backlog
    COM-MOD-011_or_earlier, and this backlog item registers exactly that first public consumer set.
    RN-007 and RateLimitPolicy.consumerIdentificationMethod are a genuine forward modeling-stage
    decision, honestly scoped as such (status materially_reduced, not closed; runtime enforcement
    remains a COM-MOD-011-BE-001 task).
  debt_items_materially_reduced:
    - TD-BE-015
  debt_items_not_applicable_to_this_backlog_item:
    - reason: All other open/materially_reduced entries in technical-debt-index.yaml concern code, coverage or tooling areas unrelated to the 7 reused capabilities' public-surface modeling.

readiness:
  com_mod_011_def_status: closed
  ready_for_next_backlog_item: COM-MOD-011-BE-001
  next_backlog_item_name: Compile public catalog, location and request outputs
  hop_commercially_complete: false
  hop_ga_ready: false
  rationale: >
    All 7 COM-MOD-011 capabilities are confirmed reused from already-modeled/compiled capability
    packages with no duplicate model, aggregate or schema created. Each package's product_surfaces,
    openapi-source.yaml, ui-model.yaml, permissions.yaml and traceability.yaml were extended with a
    public_website surface realizing pre-existing future_surfaces/deferred_to placeholders left by
    MVP-MOD-002, MVP-MOD-004 and MVP-MOD-008. TD-BE-015 was materially reduced through a concrete,
    honestly-scoped modeling-stage decision. Three unrelated stale roadmap/status pointers
    (BCM-ATT-001, BCM-ATT-006, BCM-PLT-005) found during modeling were corrected. No code was
    implemented in this backlog item; backend coverage remains 83.73%, employee-portal 88.24%,
    mobile 99.21%, patient-portal 94.11% and doctor-portal 96.28%, all unchanged and not
    regressed. HOP is not commercially complete or GA-ready; COM-MOD-011-BE-001 through
    COM-MOD-011-CLOSEOUT and all subsequent REL-002/003/004 modules remain planned.
