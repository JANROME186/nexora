validations:
  - id: VAL-001
    name: No duplicate capability, aggregate or schema created
    method: >-
      Confirm all 7 COM-MOD-011 capabilities already existed as validated/compiled/modeled
      packages before this backlog item, and that every new operation added reuses an existing
      aggregate/schema rather than introducing a new one.
    result: passed
    detail: >-
      Zero new capability-package folders were created. BCM-SVC-001/002/003/005 reuse
      AGG-006 TestDefinition and their existing Published*Snapshot schemas. BCM-ATT-001/006 reuse
      the existing requestAppointment/startQuotation operations and BCM-ATT-006's
      ProspectiveContact schema (not duplicated into BCM-ATT-001). BCM-PLT-005 reuses the existing
      RateLimitPolicy entity, adding one field rather than a new entity.
  - id: VAL-002
    name: YAML syntax validation
    method: Parse all created and modified YAML files and fail on syntax errors.
    result: passed
    detail: >-
      35 capability-package-model files modified across 7 packages (capability-package.yaml,
      openapi-source.yaml, ui-model.yaml, permissions.yaml, traceability.yaml on all 7; plus
      business-rules.yaml/test-model.yaml on BCM-ATT-001, BCM-ATT-006 and BCM-PLT-005; plus
      business-model.yaml on BCM-PLT-005), capability-package-index.yaml,
      technical-debt-index.yaml, TD-BE-015's own file, root and project PROJECT_STATE.yaml/
      SOURCE_OF_TRUTH.yaml, and both commercial backlog/execution-prompt files all parsed without
      errors.
  - id: VAL-003
    name: Capability map and dependency map traceability unchanged
    method: >-
      Confirm no edit was made to bcm-001/business-capability-map.yaml or
      bcm-002/capability-dependency-map.yaml, since all 7 capabilities and their dependency
      profiles already existed there.
    result: passed
    detail: No changes made to either file; all 7 capabilities' capability_map/dependency_map trace blocks were already correct and unchanged.
  - id: VAL-004
    name: Public surface security modeling
    method: >-
      Confirm every new public_surface/public operation declares anonymous_rate_limited security,
      a public_read or request.public scope distinct from the internal scope, and a
      governed_by pointer to BCM-PLT-005.
    result: passed
    detail: >-
      All 6 consuming capabilities' public_surface blocks declare security: anonymous_rate_limited
      and governed_by: BCM-PLT-005 ApiSurfaceRegistration/RateLimitPolicy (classification=public).
      New permissions.yaml scopes (catalog.*.public_read, appointment.request.public,
      quotation.request.public) are distinct from existing internal scopes and granted only to a
      new anonymous public-website-visitor role.
  - id: VAL-005
    name: Write operations remain staff-gated
    method: >-
      Confirm the two write-capable public operations (requestAppointment, startQuotation) create
      only requested/draft-state records and cannot confirm, issue, accept, convert or read
      others' records under the public scope.
    result: passed
    detail: >-
      RN-008 (BCM-ATT-001) and RN-009 (BCM-ATT-006) explicitly restrict the public scope to
      creating a requested/draft-state record from a ProspectiveContact; POL-APT-001-03 and
      POL-QUO-006-04 explicitly state the public scope can never confirm/issue/accept/convert/read
      others' records.
  - id: VAL-006
    name: MDPE manual authoring compliance
    method: Confirm no CRUD, DTO, controller, repository, SDK, Swagger or repetitive test was authored as implementation.
    result: passed
    detail: Only editable models (capability-package.yaml, business-model/-rules, openapi-source, ui-model, permissions, test-model, traceability, README) were modified; no implementation code was written.
  - id: VAL-007
    name: Business rule format compliance
    method: Confirm every new rule (RN-007 BCM-PLT-005, RN-008 BCM-ATT-001, RN-009 BCM-ATT-006) follows RN-### format with all required fields and a corresponding test_refs entry.
    result: passed
    detail: All 3 new rules include id, statement, applies_to, enforcement_point, severity, audit_required, test_refs, and a matching new test-model.yaml case (TST-APIM-005-07, TST-APT-001-08, TST-QUO-006-09) cross-referenced in traceability.yaml rules_to_tests.
  - id: VAL-008
    name: Registered path existence
    method: Confirm all referenced package folders and index entries resolve to existing files.
    result: passed
  - id: VAL-009
    name: Agent-agnostic scan
    method: Scan created/modified artifacts for named-agent, assistant, model-vendor or platform-runtime requirements.
    result: passed
    detail: No named-agent or vendor-runtime dependency found in any modified artifact.
  - id: VAL-010
    name: capability-package-index.yaml consistency
    method: >-
      Confirm the new COM-MOD-011 active_capability_package_groups entry correctly marks each
      capability's package_status as reused (not modeled/compiled fresh) and points
      owning_roadmap_group at its real original module.
    result: passed
    detail: >-
      All 7 entries use package_status reused_public_surface_added or reused_governance_extended
      and declare owning_roadmap_group MVP-MOD-002, MVP-MOD-004 or MVP-MOD-008 matching their
      pre-existing completed_capability_package_groups entries exactly.

