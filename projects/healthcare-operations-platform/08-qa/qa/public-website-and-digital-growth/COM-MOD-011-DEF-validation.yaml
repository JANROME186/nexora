preflight:
  purpose: >-
    Before modeling, validated PROJECT_STATE.yaml (root and project), SOURCE_OF_TRUTH.yaml and
    HOP_COMMERCIAL_BACKLOG_EXECUTION_PROMPTS.yaml, confirmed the active backlog item was
    COM-MOD-011-DEF, and swept the repository for live (non-historical) pointers to
    COM-MOD-010-CLOSEOUT or COM-MOD-010-QA-001.
  corrections_applied: []
  stale_pointer_sweep_before_modeling:
    method: >-
      Repository-wide grep for COM-MOD-010-CLOSEOUT and COM-MOD-010-QA-001 across all YAML files.
    result: passed
    detail: >-
      All 31 matches were historical evidence references (closed backlog_items entries, qa_evidence
      pointers to closed-item evidence files, technical-debt coverage-baseline source_evidence)
      correctly marked closed/module_closed. No live active/current/next pointer targeted
      COM-MOD-010-CLOSEOUT or COM-MOD-010-QA-001; all such fields already named
      COM-MOD-011/COM-MOD-011-DEF.
  technical_debt_review:
    method: Reviewed 08-qa/technical-debt/technical-debt-index.yaml in full before modeling.
    finding: >-
      TD-BE-015 (rate-limit enforcement scoped to partner-API-key-bearing requests only) is
      explicitly tracked with remediation_strategy
      gradual_before_first_public_api_consumer_onboarding and target_backlog
      COM-MOD-011_or_earlier. BCM-SVC-001/002/003/005 and BCM-ATT-001/006 are the first real
      public API consumers, making this the exact trigger. Materially reduced (see
      debt_first_review below) rather than left untouched.
  additional_stale_pointers_found_during_modeling:
    - package: bcm-att-001-appointment-scheduling
      finding: >-
        capability-package.yaml's artifact.roadmap_group/roadmap.module were stale at COM-MOD-009
        (already closed) with roadmap.package_status stale at "modeled" though
        capability-package-index.yaml records this capability as compiled under the now
        module_closed MVP-MOD-004 roadmap group. traceability.yaml's backlog_items ui_status/
        validation_status/closeout_status were stale at "pending" though MVP-MOD-004-FE-001,
        MVP-MOD-004-QA-001 and MVP-MOD-004-CLOSEOUT are all closed.
      correction: >-
        Updated roadmap_group/module/next_backlog_item to COM-MOD-011/COM-MOD-011-BE-001,
        package_status to compiled, and the three stale traceability status fields to closed, each
        with an explicit correction_note.
    - package: bcm-att-006-quotation-management
      finding: >-
        capability-package.yaml's roadmap.package_status was stale at "modeled" though this
        capability is recorded as compiled under the now module_closed MVP-MOD-004 roadmap group.
        traceability.yaml's backlog_items ui_status/validation_status/closeout_status were stale
        at "pending" for the same reason as BCM-ATT-001.
      correction: >-
        Updated roadmap_group/module/next_backlog_item to COM-MOD-011/COM-MOD-011-BE-001,
        package_status to compiled, and the three stale traceability status fields to closed, each
        with an explicit correction_note.
    - artifact: SOURCE_OF_TRUTH.yaml (project)
      finding: >-
        A pre-existing latent YAML-validity defect was found while editing the rules narrative
        near line 497: "COM-MOD-010-CLOSEOUT closed the module: all 13 COM-MOD-010 capability
        packages..." used an unescaped colon-space inside an unquoted block-sequence plain
        scalar. A strict YAML 1.1 parser (PyYAML) reads the first colon-space in such a scalar
        as an implicit mapping-key separator, and a later occurrence elsewhere in the same long
        sentence then raised "mapping values are not allowed here" -- the file was not actually
        machine-parseable by a strict parser, though it read as plain prose to a human.
      correction: >-
        Replaced the colon with an em-dash-style "--" separator ("closed the module -- all 13
        ..."). Verified via a full PyYAML sweep of all 1,110 YAML files under
        projects/healthcare-operations-platform/ plus the root and project PROJECT_STATE.yaml/
        SOURCE_OF_TRUTH.yaml: 0 failures after the fix.
    - artifact: 08-qa/security-quality/security-quality-index.yaml
      finding: >-
        COM-MOD-010-CLOSEOUT's security-quality-evidence.yaml existed on disk but was never
        registered in the index.
      correction: Backfilled the missing COM-MOD-010-CLOSEOUT entry alongside the new COM-MOD-011-DEF entry.
    - package: bcm-plt-005-api-management
      finding: >-
        capability-package.yaml's roadmap.next_backlog_item was stale at COM-MOD-009-BE-001
        (already closed) and roadmap.package_status used the roadmap-group-level value
        "module_closed" rather than a valid capability package_status. traceability.yaml's
        backlog_items ui_status/validation_status/closeout_status were stale at "pending" though
        MVP-MOD-008-FE-001, MVP-MOD-008-QA-001 and MVP-MOD-008-CLOSEOUT are all closed.
      correction: >-
        Updated roadmap_group/module/next_backlog_item to COM-MOD-011/COM-MOD-011-BE-001,
        package_status to compiled, and the three stale traceability status fields to closed, each
        with an explicit correction_note.

