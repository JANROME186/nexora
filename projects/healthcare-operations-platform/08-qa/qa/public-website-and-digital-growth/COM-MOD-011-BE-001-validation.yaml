technical_debt:
  closed:
    - id: TD-BE-015
      title: Rate-limit enforcement is scoped to partner-API-key-bearing requests only
      resolution: >-
        Closed by COM-MOD-011-BE-001. Rate-limit enforcement now covers anonymous public-classified
        traffic via PublicApiRateLimitInterceptor (registered under /api/public/**) driven by the
        new RateLimitPolicy.consumerIdentificationMethod field (ip_address or session_token). The
        partner interceptor remains the enforcement path for partner-key requests. Verified by
        PublicWebApiTest.publicRateLimitBlocksAnonymousTrafficByIpAddress.
  materially_reduced:
    - id: TD-I18N-002
      title: Complete full message-catalog and localization-library adoption
      contribution: >-
        Added the public.error.* and public.rate_limit.* i18n key namespace with es-MX and en-US
        entries so every COM-MOD-011 public error response resolves to a shared, localizable key.

