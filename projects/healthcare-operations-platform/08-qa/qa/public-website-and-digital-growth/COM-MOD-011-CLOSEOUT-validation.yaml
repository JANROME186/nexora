  - requirement: Public requests can be routed into internal workflows without exposing private APIs.
    status: passed
    evidence: COM-MOD-011-BE-001/FE-001/QA-001 (BCM-ATT-001/006, BCM-PLT-005)
  - requirement: Public content remains governed and auditable.
    status: passed
    evidence: >-
      PublicContentReviewScreen consumes anonymous public endpoints for staff review without leaking internal tenantId
      or audit identifiers; internal catalog management remains restricted to staff administration.

