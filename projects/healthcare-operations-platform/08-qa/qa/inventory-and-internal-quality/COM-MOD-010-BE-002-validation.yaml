capability_compilation:
  - capability_id: BCM-QLT-001
    package_folder: 01-product-definition/business-capabilities/packages/bcm-qlt-001-internal-quality-controls/
    module: com.nexora.hop.platformfoundation.inventoryquality.internalqualitycontrols
    endpoints_all_functional: true
    generatable_outputs_implemented:
      - recordQualityControlRun POST /api/quality/internal-controls
      - overrideAcceptanceDecision POST /api/quality/internal-controls/{qcRunId}/override
      - listQualityControlRuns GET /api/quality/internal-controls
      - getQualityControlRun GET /api/quality/internal-controls/{qcRunId}
    custom_rules_implemented:
      - eligible available control-material stock lot
      - tenant/laboratory/branch scope validation
      - expected range validation and rule evaluation
      - supervisor-only override for out-of-control acceptance decisions
  - capability_id: BCM-QLT-003
    package_folder: 01-product-definition/business-capabilities/packages/bcm-qlt-003-calibration-management/
    module: com.nexora.hop.platformfoundation.inventoryquality.calibrationmanagement
    endpoints_all_functional: true
    generatable_outputs_implemented:
      - recordCalibration POST /api/quality/calibrations/items/{inventoryItemId}/calibrations
      - listCalibrations GET /api/quality/calibrations/items/{inventoryItemId}/calibrations
    custom_rules_implemented:
      - equipment-only calibration
      - nextDueDate after performedAt
      - failed calibration transitions equipment availability to out_of_service
  - capability_id: BCM-QLT-004
    package_folder: 01-product-definition/business-capabilities/packages/bcm-qlt-004-equipment-management/
    module: com.nexora.hop.platformfoundation.inventoryquality.equipmentmanagement
    endpoints_all_functional: true
    generatable_outputs_implemented:
      - setEquipmentProfile POST /api/quality/equipment/items/{inventoryItemId}/equipment-profile
      - changeEquipmentAvailability POST /api/quality/equipment/items/{inventoryItemId}/availability
      - getEquipmentProfile GET /api/quality/equipment/items/{inventoryItemId}/equipment-profile
      - listAvailabilityChanges GET /api/quality/equipment/items/{inventoryItemId}/availability
    custom_rules_implemented:
      - equipment-only profile and availability changes
      - retired status is terminal
      - append-only availability change history
  - capability_id: BCM-QLT-005
    package_folder: 01-product-definition/business-capabilities/packages/bcm-qlt-005-maintenance-management/
    module: com.nexora.hop.platformfoundation.inventoryquality.maintenancemanagement
    endpoints_all_functional: true
    generatable_outputs_implemented:
      - recordMaintenance POST /api/quality/maintenance/items/{inventoryItemId}/maintenance
      - completeMaintenance POST /api/quality/maintenance/maintenance/{maintenanceEventId}/complete
      - listMaintenance GET /api/quality/maintenance/items/{inventoryItemId}/maintenance
    custom_rules_implemented:
      - equipment-only maintenance
      - completedAt after startedAt
      - scheduled maintenance transitions equipment to out_of_service
      - completed maintenance transitions equipment to available

