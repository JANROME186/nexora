      regression (backend 66.48% >= 65.82%; frontend 73.04% >= 72.89%). TD-I18N-001 closed;
      TD-I18N-002 registered for the remaining larger-scope work.
    debt_closed: [TD-I18N-001]
    debt_registered: [TD-I18N-002]
    disposition: closed
  - id: HOP-QA-ALIGN-006
    name: Update integrated local runbook with quality gate execution
    status_in_backlog_file: closed
    evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-006-validation.yaml
    summary: >-
      Integrated local runbook updated with the full backend/frontend/mobile/Trivy/OWASP ZAP
      quality-gate command matrix and a closure policy: missing permissions/toolchains must not
      close a backlog item, and manual review cannot replace mandatory executable gates.
    disposition: closed

