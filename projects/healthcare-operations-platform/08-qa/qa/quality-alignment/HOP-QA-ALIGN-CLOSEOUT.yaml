  - id: HOP-QA-ALIGN-002
    name: Implement backend Java/Maven enterprise quality profile
    status_in_backlog_file: closed_with_residual_p1_debt
    evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-002-validation.yaml
    summary: >-
      17 backend Maven quality tools operationalized (Surefire, JaCoCo, PMD, PMD CPD, SpotBugs,
      Find Security Bugs, Checkstyle, Spotless, OWASP Dependency-Check, Trivy, CycloneDX, Enforcer,
      Versions, License Maven Plugin, Duplicate Finder, Revapi, PIT). 0 Checkstyle errors, 0
      SpotBugs findings, 0 CPD duplications, 0 dependency vulnerabilities. Line coverage 65.82%
      established as the backend floor.
    residual_p1_debt: [TD-BE-002, TD-BE-003, TD-BE-004]
    residual_p1_debt_registered_with_owner_target_and_criteria: true
    disposition: closed_with_residual_p1_debt_correctly_dispositioned
  - id: HOP-QA-ALIGN-003
    name: Implement frontend web enterprise quality profile
    status_in_backlog_file: closed_with_residual_p1_debt
    evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-003-validation.yaml
    summary: >-
      Employee portal and mobile-app quality profiles operationalized (typecheck, lint, tests,
      coverage, build, duplication, formatting, license, all-severity dependency audit). Employee
      portal: 18 tests, 0 failures, 72.89% line coverage established as the frontend floor. Mobile:
      8 tests, 0 failures. The P0 finding I18N-BASELINE-001 (tracked by TD-I18N-001) identified here
      is now resolved — see HOP-QA-ALIGN-005 below.
    residual_p1_debt: [TD-FE-003, TD-FE-004, TD-APP-001, TD-APP-002]
    residual_p1_debt_registered_with_owner_target_and_criteria: true
    p0_finding_resolved: TD-I18N-001 (closed by HOP-QA-ALIGN-005)
    disposition: closed_with_residual_p1_debt_correctly_dispositioned
  - id: HOP-QA-ALIGN-004
    name: Establish all-severity vulnerability, DAST and runtime security evidence
    status_in_backlog_file: closed
    evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-004-validation.yaml
    summary: >-
      All-severity backend/frontend dependency scans, Trivy filesystem/secret/misconfiguration scan,
      OWASP ZAP baseline (employee portal) and API (backend) scans all executed against the running
      local stack with 0 FAIL-NEW. 2 dependency CVEs and 2 unhandled-500 defects fixed. TD-QA-001
      (DAST automation) and TD-QA-002 (Trivy currency) closed — their own item files were corrected
      by this closeout to show status: closed (previously still read status: open despite the
      technical-debt index already showing closed). Residual Low/Medium findings dispositioned as
      TD-FE-005 and TD-QA-004.
    debt_closed: [TD-QA-001, TD-QA-002]
    debt_registered: [TD-FE-005, TD-QA-004]
    disposition: closed
  - id: HOP-QA-ALIGN-005
    name: Establish message externalization and magic-string remediation baseline
    status_in_backlog_file: closed
    evidence: 08-qa/qa/quality-alignment/HOP-QA-ALIGN-005-validation.yaml
    summary: >-
      Full backend (33 modeled domain error codes, 30 with a runtime throw site), employee-portal
      (5,020 lines) and mobile-app (398 lines) message-externalization inventories completed and
      P0/P1/P2-classified. Every P0 finding remediated behavior-preservingly (backend
