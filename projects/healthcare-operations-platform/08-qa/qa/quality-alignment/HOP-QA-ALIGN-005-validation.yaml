behavior_preservation_evidence: >-
  All backend and frontend/mobile remediation in this backlog item was a pure extraction of
  already-duplicated or already-informally-coded literal values into named constants/shared
  functions — no exception message text, UI copy, or control flow changed. This is directly
  evidenced by every touched test suite passing with identical pass/fail/skip counts to the
  pre-existing baseline (backend 77/0/7, frontend 18/0, mobile 8/0).

bounded_context_and_aggregate_ownership: >-
  No aggregate ownership changed. No OpenAPI contract for any HOP capability package changed —
  FrontDeskErrorCodes is a pure internal Java constants class with no API surface; the frontend/
  mobile i18n modules are internal TypeScript modules with no external contract.

