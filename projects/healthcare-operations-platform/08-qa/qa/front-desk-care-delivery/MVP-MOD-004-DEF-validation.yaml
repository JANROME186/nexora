validations:
  - id: VAL-001
    name: Required artifact completeness
    method: Verify each package contains the 14 required capability package artifacts.
    result: passed
    detail: 5 packages x 14 artifacts = 70 artifacts present.
  - id: VAL-002
    name: YAML syntax validation
    method: Parse all created and modified YAML files and fail on syntax errors.
    result: passed
    detail: All 70 package YAML files, updated capability-package-index.yaml, PROJECT_STATE.yaml, SOURCE_OF_TRUTH.yaml and HOP_COMMERCIAL_BACKLOG_EXECUTION_PROMPTS.yaml parsed without errors.
  - id: VAL-003
    name: Capability map traceability
    method: Confirm every package traces to a BCM-001 capability in DOM-04 or DOM-05.
    result: passed
    detail: BCM-ATT-001, BCM-ATT-003, BCM-ATT-004, BCM-ATT-006 mapped to DOM-04 Care Delivery; BCM-LAB-001 mapped to DOM-05 Clinical Operations.
  - id: VAL-004
    name: Dependency map traceability
    method: Confirm every package declares BCM-002 dependency profile and required/downstream capabilities.
    result: passed
    detail: care_delivery profile for BCM-ATT-001/003/004/006 and clinical_operations profile for BCM-LAB-001, aligned with BCM-002 capability entries.
  - id: VAL-005
    name: Domain foundation traceability
    method: Confirm bounded context and aggregate ownership match domain foundation.
    result: passed
    detail: >-
      BCM-LAB-001 owns AGG-007 DiagnosticOrder in bounded context
      orders-samples; BCM-ATT-001, BCM-ATT-003 and BCM-ATT-004 share the
      orders-samples bounded context and declare AGG-007 as a
      primary_aggregate_reference owned by BCM-LAB-001, orchestrating through
      its commands rather than mutating the aggregate directly (the same
      pattern already validated for BCM-ATT-002 around BCM-PER-002 in
      MVP-MOD-003); BCM-ATT-006 declares no owned DDD aggregate because the
      cash-sales Sale aggregate (AGG-010) remains out of scope until the
      future MVP-MOD-005, and instead owns a standalone QuotationRequest
      process aggregate.
  - id: VAL-006
    name: Business rule format compliance
    method: Confirm rules follow RN-### format with required fields.
    result: passed
    detail: All rules include id, statement, applies_to, enforcement_point, severity, audit_required, test_refs.
  - id: VAL-007
    name: Generation plan separation
    method: Confirm generation-plan separates generated outputs from custom implementation points.
    result: passed
    detail: Each package declares generated_outputs, custom_implementation_points and do_not_write_manually.
  - id: VAL-008
    name: MDPE manual authoring compliance
    method: Confirm no CRUD, DTO, controller, repository, SDK, Swagger or repetitive tests were authored as implementation.
    result: passed
    detail: Repetitive artifacts declared as generated outputs only; no implementation code created during MVP-MOD-004-DEF.
  - id: VAL-009
    name: API surface classification
    method: Confirm every openapi-source declares surface classification and per-operation generatable flags.
    result: passed
    detail: All operations classified internal; patient/doctor/public surfaces flagged appointment_request_later, order_request_later or request_only_later per module product_surfaces.
  - id: VAL-010
    name: Permissions and audit coverage
    method: Confirm each package declares scopes, roles, access policies and audit obligations to BCM-PLT-007.
    result: passed
  - id: VAL-011
    name: UI and mobile surface classification
    method: Confirm ui-model and mobile-model declare surface status per module product surfaces.
    result: passed
    detail: Employee portal required in all 5 packages; mobile check_in_later in BCM-ATT-001, not_required in BCM-ATT-003/004/LAB-001, not_required with public_website deferral in BCM-ATT-006.
  - id: VAL-012
    name: Registered path existence
    method: Confirm all package folders and index references resolve to existing files.
    result: passed
  - id: VAL-013
    name: Agent-agnostic scan
    method: Scan created artifacts for named-agent, assistant, model-vendor or platform-runtime requirements.
    result: passed
    detail: No named-agent or vendor-runtime dependency found in package artifacts.
  - id: VAL-014
    name: Cross-context ownership compliance
    method: Verify that BCM-ATT-001, BCM-ATT-003 and BCM-ATT-004 orchestrate rather than own the DiagnosticOrder aggregate, and that BCM-LAB-001 is the sole capability with commands mutating it.
    result: passed
    detail: Each orchestrating package's business-rules.yaml declares an architecture_boundary rule (RN-004/RN-005/RN-006 respectively) requiring delegation to BCM-LAB-001 commands; BCM-LAB-001 RN-004 declares the reciprocal boundary that only its own commands may mutate DiagnosticOrder state.
  - id: VAL-015
    name: Immutable snapshot modeling compliance
    method: Confirm BCM-LAB-001 captures immutable patient, doctor, branch, catalog and price snapshots on the DiagnosticOrder aggregate, and that Reception/Admission depend on patient, doctor, agenda and catalog while Quotation depends on catalog, price lists and commercial rules, per the MVP-MOD-004-DEF backlog instructions.
    result: passed
    detail: >-
      business-model.yaml for BCM-LAB-001 defines PatientSnapshot,
      DoctorSnapshot, BranchSnapshot, CatalogSnapshot and
      OrderPricingSnapshot value objects with sourceVersion/publishedVersion/
      priceListVersion fields and INV-ORD-001/INV-ORD-002 invariants;
      BCM-ATT-003/BCM-ATT-004 required_capabilities include BCM-PER-002,
      BCM-PER-003, BCM-ORG-003 and BCM-SVC-001/002; BCM-ATT-001
      required_capabilities include BCM-PER-002 and BCM-ORG-003 with
      optional BCM-SVC-001/005; BCM-ATT-006 required_capabilities include
      BCM-SVC-001/002/003, BCM-SVC-009 and optional BCM-ATT-007 for
      commercial discount rules.
  - id: VAL-016
    name: HRP alignment
    method: Confirm alignment with HRP-001-P03 Patient Registration and Order Intake.
    result: passed
    detail: All 5 packages' traceability.hrp_alignment declare their segment of P03 (appointment, reception, admission, quotation pre-order estimation, and order create/price/accept/cancel/complete).
  - id: VAL-017
    name: BRM alignment
    method: Confirm alignment with BRM-001 critical rules for patient master data, published catalog, order pricing snapshot and audit.
    result: passed
    detail: BCM-LAB-001 aligns BRM-001-R003/R004/R005/R006/R018; BCM-ATT-001 aligns BRM-001-R005/R018; BCM-ATT-003 aligns BRM-001-R003/R018; BCM-ATT-004 aligns BRM-001-R005/R018; BCM-ATT-006 aligns BRM-001-R005/R006/R018.
  - id: VAL-018
    name: No forward dependency on unbuilt modules
    method: Confirm BCM-ATT-006 Quotation Management does not require the unbuilt MVP-MOD-005 Sale aggregate to function within MVP-MOD-004 scope.
    result: passed
    detail: >-
      capability-package.yaml and traceability.yaml explicitly record that
      the cash-sales Sale aggregate (AGG-010) is deferred to a future
      MVP-MOD-005 backlog item; BCM-ATT-006 owns and versions its own
      QuotationRequest process aggregate and converts only into a
      DiagnosticOrder (BCM-LAB-001) within the current module scope.

blocking_gaps: []

non_blocking_observations:
  - id: OBS-001
    description: >-
      Quotation-to-Sale conversion (as opposed to quotation-to-order
      conversion) is intentionally out of scope until MVP-MOD-005 models the
      Sale aggregate; tracked as a documented package boundary, not a defect.
    disposition: tracked_in_technical_debt
    reference: 08-qa/technical-debt/TD-DEF-001-quotation-to-sale-conversion-deferred.yaml
  - id: OBS-002
    description: >-
      Appointment slot capacity planning against detailed branch schedules
      (BCM-ORG-007, MVP2) is out of scope for MVP-MOD-004; BCM-ATT-001 only
      validates branch operational status and simple overlap detection.
    disposition: tracked_in_technical_debt
    reference: 08-qa/technical-debt/TD-DEF-002-appointment-capacity-planning-deferred.yaml

readiness:
  mvp_mod_004_def_status: closed
  ready_for_next_backlog_item: MVP-MOD-004-BE-001
  next_backlog_item_name: Compile appointment, reception and order backend outputs
  rationale: >
    All five Front Desk and Care Delivery capability packages are modeled
    with the full required artifact set, traceable to BCM-001, BCM-002,
    domain foundation, business rules catalog, healthcare reference
    processes, permissions, events, APIs, UI, tests and observability, with
    generated versus custom implementation separated in generation plans.
    Immutable order snapshots, cross-capability aggregate boundaries and the
    explicit deferral of the unbuilt Sale aggregate are modeled and
    verified. No blocking gaps remain; two non-blocking scope observations
    are tracked as technical debt for future modules.
