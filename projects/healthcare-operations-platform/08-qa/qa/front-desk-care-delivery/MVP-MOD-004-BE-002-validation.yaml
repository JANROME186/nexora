artifact:
  id: HOP-QA-MVP-MOD-004-BE-002-001
  type: qa-validation-evidence
  name: MVP-MOD-004-BE-002 Front Desk and Care Delivery Custom Rule Implementation Validation
  version: 1.0.0
  status: passed
  human_readable: MVP-MOD-004-BE-002-validation.md
  machine_readable: MVP-MOD-004-BE-002-validation.yaml
  created_date: 2026-07-15
  owner: Nexora Product Architecture Team

scope:
  backlog_item: MVP-MOD-004-BE-002
  module: MVP-MOD-004 Front Desk and Care Delivery
  release: REL-001
  execution_flow_stage: custom_rules
  business_requirement_version: v0.68.0
  impact_assessment_required: false
  bounded_contexts:
    - orders-samples
    - cash-sales
  implementation_root: 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/frontdeskcaredelivery/
  baseline_evidence: MVP-MOD-004-BE-001-validation.yaml

objective: >
  Implement the custom rules explicitly deferred by MVP-MOD-004-BE-001's
  custom_rule_baseline_implemented_now.hooks_by_capability for each of the five Front Desk and Care
  Delivery capabilities, without regressing any already-compiled backend output.

custom_rules_implemented:
  - capability: BCM-LAB-001
    package: diagnosticordermanagement
    rules_refined: [RN-001, RN-003, RN-007]
    changes:
      - >-
        Per-line multi-price-list resolution: price(orderId, currency) now resolves a published
        price list independently for every order line instead of reusing the first line's price
        list, since a multi-service order may span catalog items only priced in different price
        lists. The order's OrderPricingSnapshot still records the primary (first-line) price list
        for backward-compatible auditing; the OrderCreated/OrderPriced audit event now also
        records priceListCount and multiPriceList.
      - >-
        Referring-doctor eligibility gating: create() now calls
        DoctorDirectory.isEligibleAsReferringDoctor(doctorId) (active status, at least one
        verified, non-expired medical_license credential) instead of existence only, throwing
        ORDER_DOCTOR_NOT_ELIGIBLE when the doctor is not eligible.
      - >-
        Tiered cancellation override: cancel(orderId, reasonCode, overrideJustification) now
        requires only a reasonCode for a draft or priced order, and additionally requires a
        written overrideJustification of at least 15 characters for an accepted or in-progress
        order. Order status is used as the closest enforceable proxy for "already has collected
        samples or in-progress laboratory work" since the Sample aggregate does not exist yet
        (tracked as TD-BE-010).
    api_contract_change: >
      DiagnosticOrderController's CancelOrderRequest gained an optional overrideJustification
      field; the cancel endpoint path and reasonCode field are unchanged.
  - capability: BCM-ATT-001
    package: appointmentscheduling
    rules_refined: [RN-002, RN-006]
    new_operation: [getAppointmentPreparationInstructions]
    changes:
      - >-
        Tenant-configurable branch daily capacity: confirm() now also blocks confirmation once the
        tenant's daily branch appointment capacity is reached
        (FrontDeskPolicyStore.branchDailyAppointmentCapacityFor, default 200/day), counting
        overlapping confirmed/checked-in slots at the branch. Real schedule-based capacity (staff,
        equipment, time-of-day) remains out of scope and stays tracked as TD-DEF-002 (updated to
        reflect this partial remediation).
      - >-
        Tenant-configurable no-show grace period: markNoShow() now requires the tenant's
        configured grace period (FrontDeskPolicyStore.noShowGraceDaysFor, in days, default 0) to
        have elapsed after the appointment's scheduledEnd date before it can be marked no-show.
      - >-
        Preparation-instruction surfacing (VO-APT-002): new
        getPreparationInstructions(appointmentId) aggregates published preparation instructions
        for every requested catalog item on the appointment, calling a new reverse lookup added to
        catalogtestconfiguration.patientpreparationmanagement
        (PatientPreparationManagementService.findPublishedForTarget, backed by a new
        PreparationInstructionRepository.findAssignmentsByTarget query). Exposed via a new GET
        /{appointmentId}/preparation-instructions operation.
  - capability: BCM-ATT-003
    package: receptionmanagement
    rules_refined: [RN-005, RN-007]
    changes:
      - >-
        Queue prioritization: list(tenantId) now orders the reception queue by priority (urgent,
        then priority, then normal) and, within the same priority, by longest elapsed wait time
        first (earliest createdAt first).
      - >-
        Richer reception-to-admission audit trail: advanceToAdmission()'s
        ReceptionVisitReadyForAdmission audit event now also records actorId, fromQueueStatus and
        toQueueStatus.
  - capability: BCM-ATT-004
    package: admissionmanagement
    rules_refined: [RN-003]
    changes:
      - >-
        Configurable acknowledgement policy: commit() now gates only the acknowledgements the
        tenant's policy actually requires
        (FrontDeskPolicyStore.requiredAdmissionAcknowledgementsFor, both consent and
        sample-requirement acknowledgement required by default) instead of requiring both
        unconditionally. A required acknowledgement that is missing still blocks the commit.
  - capability: BCM-ATT-006
    package: quotationmanagement
    rules_refined: [RN-002, RN-003]
    changes:
      - >-
        Per-line multi-price-list resolution: issue() now resolves a published price list
        independently for every quotation line, mirroring the BCM-LAB-001 fix. The
        QuotationRequest's pricing fields still record the primary (first-line) price list; the
        QuotationIssued audit event now also records priceListCount and multiPriceList.
      - >-
        Tenant-configurable discount policy: the standard and override discount percentage caps
        (previously fixed static ints 20/50) are now read from FrontDeskPolicyStore
        (standardMaxDiscountPercentageFor/overrideMaxDiscountPercentageFor per tenant, same 20/50
        defaults). The discountOverride command flag continues to gate which cap applies, standing
        in for role-based authorization (checked upstream of this service).
      - >-
        Quotation-to-Sale conversion remains out of scope; TD-DEF-001 stays open unchanged, exactly
        as required.

new_shared_infrastructure:
  - component: FrontDeskPolicyStore
    location: 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/frontdeskcaredelivery/shared/FrontDeskPolicyStore.java
    description: >
      New @Component tenant-scoped policy store (in-memory ConcurrentHashMap overrides with safe
      defaults, setter methods for future admin/test override), mirroring the existing
      peopleclinicalmasterdata.personmanagement.application.TenantPeoplePolicyStore precedent.
      Consolidates every tenant-configurable knob this backlog item introduces: no-show grace
      days, branch daily appointment capacity, required admission acknowledgements, and standard
      / override discount percentage caps.
  - component: PreparationInstructionRepository.findAssignmentsByTarget / PatientPreparationManagementService.findPublishedForTarget
    location: 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/catalogtestconfiguration/patientpreparationmanagement/
    description: >
      Additive reverse lookup (target -> published preparations) added to the existing
      catalogtestconfiguration.patientpreparationmanagement capability (only a forward
      preparation -> assignments lookup existed before), implemented in both the JDBC and
      in-memory repository adapters. No existing method signature changed.

bounded_context_and_aggregate_ownership: >
  No change to aggregate ownership. DiagnosticOrderManagementService remains the sole mutator of
  DiagnosticOrder (RN-004); Appointment Scheduling, Reception Management, Admission Management and
  Quotation Management continue to call its public command methods directly rather than persisting
  order state themselves. QuotationRequest remains a standalone aggregate owned by Quotation
  Management. No new cross-module write dependency was introduced; the one new cross-module read
  (AppointmentSchedulingService -> PatientPreparationManagementService.findPublishedForTarget)
  follows the existing Directory-style read-port pattern and stays within the already-open
  catalogtestconfiguration module boundary.

api_contract_changes:
  - package: bcm-lab-001-diagnostic-order-management
    change: CancelOrderRequest gained an optional overrideJustification field; new domain error
      code ORDER_DOCTOR_NOT_ELIGIBLE (RN-001) added to openapi-source.yaml error_model.
  - package: bcm-att-001-appointment-scheduling
    change: New GET /{appointmentId}/preparation-instructions operation and
      GET /{appointmentId}/requested-items documented as generatable:true (already implemented,
      previously undocumented). New domain error codes APPOINTMENT_BRANCH_CAPACITY_EXCEEDED
      (RN-002) and APPOINTMENT_NO_SHOW_GRACE_PERIOD_ACTIVE (RN-006).
  - package: bcm-att-006-quotation-management
    change: No new operations or fields; RN-002/RN-003 business-rules.yaml statements refined to
      describe the now-implemented per-line pricing and tenant-configurable discount policy.
  - package: bcm-att-003-reception-management, bcm-att-004-admission-management
    change: No contract change; business-rules.yaml already described the now-implemented behavior
      (RN-005 queue prioritization, RN-003 tenant-configured acknowledgement policy).

technical_debt_disposition:
  new:
    - id: TD-BE-010
      summary: >-
        Diagnostic order cancellation override uses order-status as a proxy for downstream
        sample/processing state (RN-007's full check is blocked on MVP-MOD-006's Sample aggregate,
        which does not exist yet).
  updated:
    - id: TD-DEF-002
      summary: >-
        Updated (not resolved) to reflect that a simple tenant-configurable daily branch capacity
        check now exists, closing the "no capacity check at all" gap while leaving real
        schedule-based (staff/equipment/time-of-day) capacity planning as the still-open target
        state, unchanged in scope from BCM-ORG-007.
  unchanged_and_still_open:
    - id: TD-DEF-001
      summary: >-
        Quotation-to-Sale conversion remains deferred until MVP-MOD-005 models the Sale aggregate;
        not touched by this backlog item as instructed.
    - id: TD-BE-009
      summary: Branch snapshot version placeholder; out of this backlog item's scope.

model_gaps_identified: []

out_of_scope_confirmed:
  - Frontend and mobile (MVP-MOD-004-FE-001 and later).
  - Quotation-to-Sale conversion into MVP-MOD-005's Sale aggregate (TD-DEF-001, unchanged).
  - RN-007's full sample/processing-state cancellation check, blocked on MVP-MOD-006 (TD-BE-010).
  - Real schedule-based appointment capacity planning sourced from BCM-ORG-007 (TD-DEF-002,
    partially addressed by the new flat daily-capacity check, not closed).
  - Formal QA validation backlog item MVP-MOD-004-QA-001.

validations:
  - id: VAL-001
    name: Backend test suite passes without a local database
    method: mvn --settings .mvn/settings.xml test
    working_directory: 07-implementation/backend
    result: passed
    detail: 77 tests run, 0 failures, 0 errors, 7 skipped (local-db-only tests skipped without a
      running Postgres).
  - id: VAL-002
    name: Backend test suite passes against real Postgres
    method: docker compose --env-file .env.example -f compose.local.yml up -d postgres; mvn
      --settings .mvn/settings.xml test "-Dhop.local-db-tests=true"
    working_directory: 07-implementation
    result: passed
    detail: 77 tests run, 0 failures, 0 errors, 0 skipped (the 7 tests gated by
      @EnabledIfSystemProperty for local-db-tests now execute), including the
      local-database-backed tests for the frontdeskcaredelivery and catalogtestconfiguration JDBC
      adapters touched by this backlog item (new findAssignmentsByTarget and findByBranchId
      queries).
  - id: VAL-003
    name: New and refined custom-rule test coverage
    method: FrontDeskCareDeliveryApiTest, extended with 10 new tests covering every rule refined
      in this backlog item.
    result: passed
    detail: >-
      diagnosticOrderRejectsIneligibleReferringDoctor, diagnosticOrderPricesEachLineFromItsOwnPriceList,
      diagnosticOrderCancellationRequiresOverrideJustificationOnceAccepted,
      appointmentConfirmRejectsWhenBranchDailyCapacityIsExceeded,
      appointmentNoShowRespectsTenantConfigurableGracePeriod,
      appointmentSurfacesPublishedPreparationInstructionsForRequestedItems,
      receptionQueueOrdersUrgentPriorityAheadOfLongerWaitingNormalVisit,
      admissionCommitHonorsTenantConfigurableAcknowledgementPolicy,
      quotationIssuePricesEachLineFromItsOwnPriceList, quotationDiscountPolicyIsTenantConfigurable.
      All pre-existing FrontDeskCareDeliveryApiTest scenarios continue to pass unmodified in
      behavior (test fixtures for doctor registration and price-list publication were extended to
      satisfy the newly enforced doctor-eligibility and price-list-agreement-scope rules, not to
      weaken any assertion).
  - id: VAL-004
    name: Spring Modulith module boundaries remain valid
    method: PlatformFoundationModulithTest (ApplicationModules.of(PlatformFoundationApplication.class).verify())
    result: passed
    detail: No new cross-module dependency was introduced beyond the existing OPEN-typed
      catalogtestconfiguration/peopleclinicalmasterdata/organizationmanagement modules
      established in MVP-MOD-004-BE-001; 0 violations.
  - id: VAL-005
    name: OpenAPI/contract coverage
    method: FrontDeskCareDeliveryContractTest cross-checks every operation in all 5
      openapi-source.yaml files (including the new getAppointmentPreparationInstructions
      operation) against registered Spring MVC routes.
    result: passed
  - id: VAL-006
    name: YAML repository files remain parseable
    method: Full-project YAML parse (557 files across framework and project, including this
      evidence file and every touched capability package YAML).
    result: passed
  - id: VAL-007
    name: Agent-agnostic scan
    method: Directory scan for .claude/.cursor/.copilot/.windsurf/.aider* files or folders
      (tracked and untracked) across projects/healthcare-operations-platform, plus a content grep
      of every file touched by this backlog item for claude|anthropic|copilot|cursor|chatgpt|
      openai|gemini|codex|windsurf|aider (case-insensitive).
    result: passed
    detail: 0 forbidden files/folders found; 0 content matches in any file touched by this backlog
      item. The pattern-list words above are written out only in this evidence file and its
      companion security-quality-evidence.yaml as documentation of what the scan searched for.
  - id: VAL-008
    name: Stale pointer scan
    method: Verified every relative file-path reference newly added in TD-BE-010, TD-DEF-002 and
      technical-debt-index.yaml resolves to an existing repository path (framework standard/prompt
      references and QA/security-quality evidence self-references included).
    result: passed
  - id: VAL-009
    name: Filesystem vulnerability, secret and misconfiguration scan
    method: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0
      --skip-dirs "backend/.m2,backend/target,employee-portal/node_modules,
      employee-portal/dist,mobile-app/node_modules" .
    working_directory: 07-implementation
    result: passed
    detail: 0 vulnerabilities, 0 secrets, 0 misconfigurations. backend/pom.xml unchanged (no new
      dependencies added by this backlog item).
  - id: VAL-010
    name: Security quality gate
    method: See 08-qa/security-quality/MVP-MOD-004-BE-002/security-quality-evidence.yaml.
    result: passed
  - id: VAL-011
    name: git diff --check
    method: git diff --check across every file touched by this backlog item.
    result: passed
    detail: 0 whitespace errors (only expected LF/CRLF line-ending-normalization advisories on a
      Windows working copy, not whitespace errors).

blocking_gaps: []

readiness:
  mvp_mod_004_be_002_status: closed
  ready_for_next_backlog_item: MVP-MOD-004-FE-001
  next_backlog_item_name: Compile front desk worklist and order creation UI outputs
  superseded_by_quality_alignment:
    status: superseded_for_execution_order_only
    active_backlog_item: HOP-QA-ALIGN-001
    reason: >
      The Nexora enterprise quality framework was strengthened after this
      evidence was produced. Functional continuation to MVP-MOD-004-FE-001 is
      paused until HOP-QA-ALIGN-CLOSEOUT passes.
  rationale: >
    Every custom rule explicitly deferred by MVP-MOD-004-BE-001's
    custom_rule_baseline_implemented_now.hooks_by_capability is now implemented and tested:
    multi-price-list resolution per order/quotation line, referring-doctor eligibility gating,
    tiered order-cancellation override, tenant-configurable appointment capacity and no-show grace
    period, preparation-instruction surfacing, reception queue prioritization by priority and wait
    time, tenant-configurable admission acknowledgement policy, and tenant-configurable quotation
    discount policy. No bounded context or aggregate ownership boundary was broken; no OpenAPI
    contract was broken (only additive changes); no prior technical debt was silently deleted.
    Backend tests pass both with and without Postgres. The remaining explicitly out-of-scope items
    (TD-DEF-001 quotation-to-Sale conversion, TD-BE-010 RN-007 full sample-state check, and the
    real schedule-based portion of TD-DEF-002 appointment capacity) are registered as non-blocking
    technical debt with clear remediation triggers, exactly as instructed.
