capability_coverage:
  - capability: BCM-ATT-003
    name: Reception Management
    screens_delivered:
      - SCR-REC-003-01 Front desk worklist (queue, priority order)
      - SCR-REC-003-02 Identity confirmation
      - SCR-REC-003-03 Visit detail (priority update, advance to admission, abandon)
    endpoints_used:
      - GET /api/care-delivery/reception-visits
      - POST /api/care-delivery/reception-visits
      - POST /api/care-delivery/reception-visits/{visitId}/confirm-identity
      - POST /api/care-delivery/reception-visits/{visitId}/advance-to-admission
      - POST /api/care-delivery/reception-visits/{visitId}/priority
      - POST /api/care-delivery/reception-visits/{visitId}/abandon
    walk_in_and_scheduled_support: >
      Intake channel selector offers walk_in and scheduled; the scheduled channel accepts a
      linked appointment id captured out of band (Appointment Scheduling has no dedicated screen
      yet, tracked by TD-FE-006).
  - capability: BCM-LAB-001
    name: Diagnostic Order Management
    screens_delivered:
      - SCR-ORD-001-01 Order creation (walk-in and scheduled/admission/quotation-linked channels)
      - SCR-ORD-001-02 Order list
      - SCR-ORD-001-03 Order detail (immutable snapshots)
      - SCR-ORD-001-04 Order lifecycle actions
    endpoints_used:
      - GET /api/clinical-operations/diagnostic-orders
      - GET /api/clinical-operations/diagnostic-orders/{orderId}
      - GET /api/clinical-operations/diagnostic-orders/{orderId}/lines
      - POST /api/clinical-operations/diagnostic-orders
      - POST /api/clinical-operations/diagnostic-orders/{orderId}/price
      - POST /api/clinical-operations/diagnostic-orders/{orderId}/accept
      - POST /api/clinical-operations/diagnostic-orders/{orderId}/cancel
      - POST /api/clinical-operations/diagnostic-orders/{orderId}/complete
    walk_in_and_scheduled_support: >
      Intake channel selector offers walk_in, appointment, admission and quotation_conversion,
      with an optional sourceReferenceId field for the linked appointment/admission/quotation id,
      matching CreateDiagnosticOrderRequest exactly.
    immutable_snapshots_rendered:
      - patientSnapshot (fullName, documentType, documentNumberMasked)
      - doctorSnapshot (fullName, or "None" when no referring doctor)
      - branchSnapshot (name)
      - pricingSnapshot (totalAmount, priceListId, priceListVersion)
    business_error_handling:
      - >-
        RECEPTION_IDENTITY_NOT_CONFIRMED (409) surfaced verbatim from the backend when advancing a
        visit to admission before identity is confirmed.
      - >-
        ORDER_CANCELLATION_OVERRIDE_REQUIRED (409) surfaced verbatim from the backend when
        cancelling an accepted/in-progress order without a 15+ character override justification;
        the UI additionally shows a field hint stating the minimum length before submission.
      - >-
        Every other FrontDeskErrorCodes-prefixed 409/404/400 response is surfaced through the same
        StatusBanner mechanism already used by every other employee-portal screen (ApiError.message
        rendered as-is, since the backend already produces human-readable "CODE: prose" text).

ux_states_delivered:
  loading: useAsyncAction's "loading" status disables the triggering control and shows "Working on
    it..." via StatusBanner, for every one of the 10 new async actions (list/start/confirm-identity/
    advance/priority/abandon for reception; list/create/price/accept/cancel for orders).
  empty: >-
    "No reception visits are currently queued for this tenant." and "No diagnostic orders exist yet
    for this tenant." shown after a successful load returns zero rows.
  error: >-
    StatusBanner renders ApiError.message (including the FrontDeskErrorCodes-prefixed business
    conflicts) or the shared MESSAGES.unexpectedError fallback for non-ApiError failures.
  confirmation: >-
    ConfirmDialog gates the two destructive/consequential actions with no undo path: abandoning a
    reception visit and cancelling a diagnostic order.
  success: >-
    A dedicated success message per action. Two screens had a UX defect found and fixed during this
    backlog item: the confirm-identity, price, accept, complete and cancel success banners were
    originally rendered only inside the same status-gated JSX block that the action's own success
    response hides (e.g. the "Price order" button and its StatusBanner both lived inside
    `{order.status === "draft" ? ... : null}`, so pricing an order immediately hid the very banner
    meant to confirm it succeeded). Found via the new tests (findByText timing out), fixed by moving
    each StatusBanner outside the status-gated control so the success message remains visible after
    the status transition it reports on.

