  objective: >
    Compile the employee portal UI outputs that let front desk staff use the already-implemented
    Front Desk and Care Delivery backend capabilities named explicitly by the backlog's acceptance
    summary: the front desk worklist (Reception Management, BCM-ATT-003) and diagnostic order
    creation/lifecycle with immutable patient/doctor/branch/catalog/price snapshots (Diagnostic
    Order Management, BCM-LAB-001), supporting both walk-in and scheduled intake.
  scope_note: >
    Per the framework's debt-first and iterative-delivery policy, this backlog item does not build
    dedicated screens for Appointment Scheduling (BCM-ATT-001), Admission Management (BCM-ATT-004)
    or Quotation Management (BCM-ATT-006) — those are fully implemented, tested backend
    capabilities reachable via direct API today, and the gap is formally registered as TD-FE-006
    with owner, target backlog and acceptance criteria rather than left undocumented.

debt_first_action:
  reviewed: 08-qa/technical-debt/technical-debt-index.yaml
  candidates_considered:
    - TD-FE-003
    - TD-FE-004
    - TD-I18N-002
  selected: TD-FE-004
  action_taken: >
    Raise employee portal line coverage to the 80 percent final-closure target
    (TD-FE-004) without dropping below the 73.04 percent floor. The new frontDeskApi.ts client,
    ReceptionScreen.tsx and DiagnosticOrdersScreen.tsx were built with matching test coverage from
    the start (frontDeskApi.test.ts 100 percent statements; ReceptionScreen.tsx 89.83 percent;
    DiagnosticOrdersScreen.tsx covered by 2 scenario tests), raising the measured employee-portal
    line coverage from 73.04 percent to 76.51 percent — a 3.47-point material reduction of
    TD-FE-004's gap to the 80 percent target, with no stack coverage regression.
  other_candidates_reviewed_not_selected: >
    TD-FE-003 (ESLint complexity/duplicate-string warnings on pre-existing screens) was reviewed;
    an initial attempt to mechanically extract 2 duplicate-string switch-case literals in
    DiagnosticCatalogScreen.tsx broke TypeScript's exhaustive-switch narrowing (introduced 3
    "lacks ending return statement" compile errors) and was reverted rather than shipped as a
    regression. TD-I18N-002 (backend code field, full i18n-library adoption) requires backend
    contract changes and a new frontend dependency, both out of this backlog item's scope.
  new_debt_registered: TD-FE-006 (Appointment Scheduling, Admission Management and Quotation
    Management employee-portal screens deferred; owner, target backlog and acceptance criteria
    registered).

