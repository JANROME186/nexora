iam_and_menu_validation:
  backend:
    method: >-
      Confirmed all 5 endpoint prefixes (/api/quality/external-controls, /api/quality/capa,
      /api/quality/audits, /api/quality/events, /api/documents) are registered in
      EndpointPermissionRegistry, so HopAuthorizationInterceptor enforces deny-by-default
      authorization for every sensitive action in this module (unaffected by the TD-IAM-004
      tenant-attribution finding, which is about data attribution, not access control).
    result: passed
  frontend:
    method: >-
      Confirmed permissions.ts defines SCREEN_EXTERNAL_QUALITY_CONTROLS/SCREEN_CAPA_MANAGEMENT/
      SCREEN_AUDIT_MANAGEMENT/SCREEN_COMPLIANCE_EVIDENCE/SCREEN_QUALITY_EVENT_INTAKE and grants them
      (plus SCREEN_AUDIT_EVENTS) exclusively to the QUALITY_MANAGER role (and ADMIN, which is
      granted every permission by construction); AppShell.tsx filters nav tabs via
      `permissions.has(SCREEN_TO_PERMISSION[tab.key])`, so unauthorized roles never see these tabs.
    result: passed
    note: >-
      The employee-portal has no production login/session mechanism yet (documented, pre-existing,
      portal-wide limitation in SessionContext.tsx, not specific to COM-MOD-013); this was already
      a known state before this item and is unchanged by it.

