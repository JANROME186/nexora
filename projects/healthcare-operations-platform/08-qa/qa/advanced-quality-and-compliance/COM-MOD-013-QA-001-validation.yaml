major_finding_and_fix:
  id: TD-DB-005
  title: COM-MOD-013 backend silently used in-memory storage instead of PostgreSQL
  how_found: >-
    A clean `mvn -Pquality -Dhop.local-db-tests=true clean verify` run measured backend line
    coverage at 82.57%, below the registry's recorded 84.14% floor. Rather than accepting a lower
    "corrected" baseline (the pattern used by prior items when a jacoco.exec measurement-inflation
    bug was found), the regression was investigated by breaking down jacoco.csv by package, which
    surfaced `externalqualitycompliance.adapter.out.jdbc` at 0% coverage (0/199 lines).
  root_cause_1: >-
    `application-local.yml`'s `spring.sql.init.schema-locations` list registers every other
    module's schema.sql but never included `db/external-quality-and-compliance/schema.sql`, so the
    tables backing BCM-QLT-002/006/007 (external_quality_evaluations, capa_investigations,
    audit_schedules, audit_findings, quality_event_intakes) were never created in local PostgreSQL.
  root_cause_2: >-
    The 4 real JDBC repository implementations were annotated `@Profile("!local & !test")` and
    their in-memory counterparts `@Profile("local | test")` -- the inverse of the convention used
    by every other already-validated module (e.g. inventoryquality's Jdbc*Repository classes use
    `@Profile("local")`). This made the real JDBC adapters unreachable under the "local" profile
    regardless of root cause 1, masking it entirely.
  combined_effect: >-
    Every External Quality Control, CAPA, Audit Management and Quality Event Intake record created
    through the running local backend was silently stored in a process-local in-memory map, never
    in PostgreSQL -- lost on every restart -- directly contradicting COM-MOD-013's own acceptance
    criterion "Compliance evidence is traceable, searchable and retained."
  fix: >-
    Added the missing schema-locations entry; corrected the 4 Jdbc*Repository classes to
    `@Profile("local")` and their 4 in-memory counterparts to `@Profile("!local")`.
  verification: >-
    Re-ran the pre-existing, unmodified ExternalQualityComplianceLocalDatabaseTest against real
    hop-local-postgres: both tests now pass, exercising real INSERT/SELECT SQL against the
    newly-created tables (previously failed with "relation external_quality_evaluations does not
    exist" when the profile fix alone was applied without the schema fix, confirming both root
    causes were real and both were needed). Full backend suite re-run clean: 381 tests, 0
    failures/errors/skipped. externalqualitycompliance.adapter.out.jdbc line coverage rose from
    0/199 (0%) to 146/199 (73.4%). Overall backend line coverage rose from the clean-rebuild 82.57%
    to 84.24%, now above both the 80% final-closure target and the previously recorded 84.14% floor.
  status: closed
  evidence_file: 08-qa/technical-debt/TD-DB-005-quality-compliance-persistence-never-wired.yaml

other_defects_found_and_fixed:
  - id: hardcoded-string
    finding: >-
      ComplianceEvidenceScreen.tsx's evidenceColumns() hardcoded the status column header as the
      literal Spanish string "Estado" instead of a locale key, despite COM-MOD-013-FE-001's own
      evidence claiming "complete i18n message catalogs (es-MX / en-US)".
    fix: >-
      Added `complianceEvidence.status` to both es-MX.ts ("Estado") and en-US.ts ("Status");
      ComplianceEvidenceScreen.tsx now reads `labels.status`.
    debt_contribution: materially reduces TD-I18N-002
  - id: td-fe-010-function-size
    finding: >-
      ComplianceEvidenceScreen's main function was 129 lines, over the enterprise quality profile's
      120-line max-lines-per-function ESLint threshold.
    fix: >-
      Extracted the compliance-documents list (heading, load button, status banner, empty state,
      DataTable) into a new DocumentsSection sub-component, mirroring the established
      COM-MOD-010-FE-001 decomposition pattern.
    verification: npm run lint warnings for this file dropped to 0; portal-wide warnings 51 -> 50.
    debt_contribution: materially reduces TD-FE-010
  - id: spotbugs-dm-default-encoding
    finding: >-
      SpotBugs High: DocumentManagementController.parseUuidOrGenerate() called String.getBytes()
      relying on the platform default charset (DM_DEFAULT_ENCODING).
    fix: explicit `val.getBytes(java.nio.charset.StandardCharsets.UTF_8)`.
  - id: spotbugs-nm-same-simple-name
    finding: >-
      SpotBugs High: externalqualitycompliance.domain.ExternalQualityComplianceException shadowed
      the simple name of its superclass externalqualitycompliance.ExternalQualityComplianceException
      (NM_SAME_SIMPLE_NAME_AS_SUPERCLASS), a confusing/error-prone naming collision.
    fix: >-
      Renamed the domain-package subclass to ExternalQualityDomainException across its 1
      definition, 5 same-package domain-class usages, 3 application-service usages and 1 test file.
  - id: spotbugs-ct-constructor-throw
    finding: >-
      SpotBugs Medium (5 instances): AuditFinding, AuditSchedule, CapaInvestigation,
      ExternalQualityEvaluation and QualityEventIntake constructors validate arguments and throw
      before full initialization (CT_CONSTRUCTOR_THROW / potential finalizer-attack surface).
    fix: >-
      Marked all 5 classes `final` (confirmed none are subclassed anywhere in the backend), the
      standard SpotBugs-recognized mitigation for this finding.

technical_debt_dispositioned_not_fixed:
  - finding: >-
      SpotBugs Medium DE_MIGHT_IGNORE (3 instances): AuditManagementService.recordAuditFinding,
      ExternalQualityService.scoreEvaluation and QualityEventIntakeService.ingestEvent each wrap a
      best-effort automatic CAPA-creation call in `catch (Exception ignored) {}`.
    disposition: accepted_risk
    reason: >-
      Intentional best-effort side effect (auto-opening a CAPA investigation) that must not block
      the primary audit-finding/evaluation/event save if it fails; consistent with the existing
      `catch (Exception ignored)` convention already used by
      AuditComplianceService.exportAuditEvents for its own best-effort document-upload step.
      Non-blocking per default_thresholds.sast_policy.medium
      (fail_unless_dispositioned_by_module_risk); no unhandled exception reaches the client in
      either path (verified against controller test expectations).
  - finding: >-
      5 controllers (ExternalQualityController, CapaManagementController, AuditManagementController,
      QualityEventIntakeController, DocumentManagementController) assign a synthetic random
      TenantId instead of the authenticated request's real tenant.
    disposition: registered_as_new_technical_debt
    id: TD-IAM-004
    reason: >-
      A correct fix requires a Spring Modulith module-boundary decision (a shared tenant-context
      port, most naturally sharedkernel-owned) that does not exist yet and is out of narrow
      QA-validation safe-scope; deny-by-default authorization itself is unaffected (all 5 endpoint
      prefixes are registered in EndpointPermissionRegistry). See
      08-qa/technical-debt/TD-IAM-004-quality-compliance-controllers-synthetic-tenant.yaml.
  - finding: >-
      73 Checkstyle findings (mostly 140-char LineLength, a few AvoidStarImport/UnusedImports), 570
      PMD violations, 2 CPD duplications, and 61 remaining SpotBugs findings (Low/Medium, pre-existing
      and repo-wide) with failOnViolation=false.
    disposition: tracked_under_existing_TD_BE_002
    reason: >-
      TD-BE-002 ("Configure backend Java/Maven static analysis and SAST toolchain") is already
      status materially_reduced with an explicit gradual_when_backend_code_is_touched remediation
      strategy; these non-blocking findings (checkstyle/pmd fail_on_violation is false by design)
      are consistent with that existing disposition, not a new gap.

