scope:
  objective: >
    Integrated validation of the full MVP-MOD-005 Cashier and Billing Request module: cash session
    open/close and variance handling, sale creation from an accepted diagnostic order or accepted
    quotation, sale totals/outstanding balance/payment status, payment allocation and its
    outstanding-balance guard, sale cancellation, billing request creation from a paid sale and its
    paid-sale guard, tax lines, submit/retry/cancel against the provider-agnostic fiscal adapter
    (including simulated adapter failure/retry), audit events for critical financial actions,
    module-boundary purity (CashSales must not mutate clinical/patient/order/catalog aggregates
    directly), and that the MVP-MOD-005-FE-001 employee-portal UI can drive the complete financial
    flow, with the integrated local runbook able to start, validate and stop the full solution.
  predecessor_evidence:
    - 08-qa/qa/cashier-and-billing-request/MVP-MOD-005-BE-001-validation.yaml
    - 08-qa/qa/cashier-and-billing-request/MVP-MOD-005-BE-002-validation.yaml
    - 08-qa/qa/cashier-and-billing-request/MVP-MOD-005-FE-001-validation.yaml
    - 08-qa/security-quality/MVP-MOD-005-BE-002/security-quality-evidence.yaml
    - 08-qa/security-quality/MVP-MOD-005-FE-001/security-quality-evidence.yaml
  evidence_companion:
    security_quality: 08-qa/security-quality/MVP-MOD-005-QA-001/security-quality-evidence.yaml

debt_first_action:
  reviewed: 08-qa/technical-debt/technical-debt-index.yaml
  candidates_considered:
    - TD-BE-001
    - TD-BE-002
    - TD-BE-003
    - TD-STACK-001
  selected: TD-BE-001
  action_taken: >
    Closed TD-BE-001 (Mockito dynamic self-attach warning / future-JDK compatibility). Added a
    maven-dependency-plugin `properties` execution to resolve `${org.mockito:mockito-core:jar}` and
    configured Surefire's argLine to load Mockito as a supported `-javaagent` ahead of the existing
    `-XX:+EnableDynamicAgentLoading` fallback flag, in 07-implementation/backend/pom.xml. Verified
    with a full backend test run (105 tests, 0 failures, 0 errors) showing no Mockito self-attach
    warning.
  also_advanced: >
    TD-BE-003 (backend coverage gate) was materially advanced as a side effect of the new
    CashSalesApiTest assertions and the new financialActionsProduceQueryableAuditEvents test: backend
    line coverage rose from 67.47% to 68.66%, a 1.19-point reduction of the gap to the 80%
    final-closure target, with no regression.
  other_candidates_reviewed_not_selected: >
    TD-BE-002 (static analysis/SAST toolchain) and TD-STACK-001 (stack modernization roadmap) were
    reviewed; both require broader, unrelated backend tooling or dependency work out of scope for a
    validation backlog item that is not meant to introduce new mandatory technology changes.
  new_debt_registered: none. No new frontend or backend gap was identified during this backlog item.

implemented_outputs:
  - id: QA-001
    path: 07-implementation/backend/pom.xml
    description: Added maven-dependency-plugin properties execution and updated the Surefire
      argLine to load Mockito as a supported Java agent (closes TD-BE-001), keeping
      -XX:+EnableDynamicAgentLoading as a fallback flag.
  - id: QA-002
    path: 07-implementation/backend/src/test/java/com/nexora/hop/platformfoundation/cashsales/CashSalesApiTest.java
    description: >
      Strengthened 3 existing conflict-path assertions to check the exact backend error code in the
      RFC 7807 `detail` field (CASH_VARIANCE_REASON_REQUIRED on unbalanced session close,
      PAYMENT_EXCEEDS_OUTSTANDING_BALANCE on overpayment, BILLING_SALE_REQUIRED on billing request
      creation for an unpaid sale) instead of only asserting HTTP 409. Added a new test,
      financialActionsProduceQueryableAuditEvents, that drives the full financial chain (sale
      creation, cash session open/close, payment registration, billing request creation and submit)
      against the real Spring MVC layer and then queries the real /api/audit/events endpoint,
      asserting SaleCreated/SalePaymentRegistered (by sale id), CashSessionOpened/CashSessionClosed
      (by session id) and BillingRequestCreated/BillingRequestSubmitted (by invoice request id) are
      all present and independently queryable — proving audit traceability through the public API,
      not only through BillingRequestAdapterUnitTest's mocked AuditRecorder verifications.
  - id: QA-003
    path: 09-operations/runbooks/local-solution-runbook.yaml
    description: Added SMOKE-010 (Cashier and Billing Request employee portal screens,
      MVP-MOD-005-FE-001), closing a gap where FE-001 had added 3 new review surfaces (Cash
      Sessions, Sales, Billing Requests tabs) without a corresponding runbook smoke-validation entry.
  - id: QA-004
    path: 09-operations/runbooks/local-solution-runbook.md
    description: Added smoke-validation items 8 (MVP-MOD-005-BE-001 backend baseline, mirroring the
      pre-existing SMOKE-009 that had never been reflected in the human-readable companion) and 9
      (MVP-MOD-005-FE-001 UI walkthrough, mirroring the new SMOKE-010), bringing the Markdown
      companion back in sync with the YAML source.

architecture_and_purity_validation:
  module_boundary_declaration: >
    07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/cashsales/package-info.java
    declares @ApplicationModule(allowedDependencies = {"auditcompliance", "catalogtestconfiguration",
    "frontdeskcaredelivery::sale-source-port"}). CashSales cannot depend on peopleclinicalmasterdata
    (patient/doctor aggregates) at all, and its only path to frontdeskcaredelivery is the named
    sale-source-port interface, not the module's internals.
  read_only_boundary: >
    FrontDeskSaleSourcePort (07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/frontdeskcaredelivery/application/FrontDeskSaleSourcePort.java)
    exposes only findOrderById, findOrderLines, findQuotationById and findQuotationLines — no
    mutation method exists on the port, and its Javadoc states explicitly that it "does not allow
    CashSales to mutate any front-desk aggregate." CashierOperationsService only calls these find*
    methods when creating a sale; patientId, doctorId-derived data and pricing are captured as
    immutable copied fields on the Sale aggregate, not live references.
  automated_verification: >
    PlatformFoundationModulithTest (Spring Modulith's ApplicationModules.of(...).verify()) runs as
    part of the standard backend test suite and passed (1 test, 0 failures) in every backend test
    run executed for this backlog item, automatically failing the build if CashSales' declared
    module boundary were ever violated by a future code change.
  conclusion: CashSales does not and structurally cannot mutate clinical, patient, order or catalog
    aggregates directly; confirmed by architecture (module declaration + read-only port), automated
    verification (Modulith test) and code review of CashierOperationsService/BillingRequestManagementService.

functional_scenario_coverage:
  - scenario: Cash session open and close
    test: CashSalesApiTest.cashierCanListSaleLinesPaymentsSessionsAndCloseBalancedSession
    result: passed
  - scenario: Variance handling and CASH_VARIANCE_REASON_REQUIRED
    test: CashSalesApiTest.cashierRejectsOverpaymentAndRequiresVarianceReasonOnClose (strengthened
      this backlog item with an explicit error-code assertion)
    result: passed
  - scenario: Sale creation from an accepted diagnostic order
    test: CashSalesApiTest.cashierCanCreateSaleFromAcceptedOrderAndRegisterCashPayment and others
    result: passed
  - scenario: Sale creation from an accepted quotation
    test: CashSalesApiTest.saleCanBeCreatedFromAcceptedQuotationAndCancelledBeforePayment
    result: passed
  - scenario: Sale totals, outstanding balance and paid status
    test: CashSalesApiTest.partialPaymentKeepsSalePayableForRemainingBalance and
      cashierCanCreateSaleFromAcceptedOrderAndRegisterCashPayment
    result: passed
  - scenario: Payment allocation
    test: CashSalesApiTest (multiple), BillingRequestAdapterUnitTest indirectly via paid-sale fixtures
    result: passed
  - scenario: PAYMENT_EXCEEDS_OUTSTANDING_BALANCE
    test: CashSalesApiTest.cashierRejectsOverpaymentAndRequiresVarianceReasonOnClose (strengthened
      this backlog item with an explicit error-code assertion)
    result: passed
  - scenario: Sale cancellation
    test: CashSalesApiTest.saleCanBeCreatedFromAcceptedQuotationAndCancelledBeforePayment
    result: passed
  - scenario: Billing request creation from a paid sale
    test: CashSalesApiTest.paidSaleCanCreateBillingRequestAndSubmitViaFiscalAdapter
    result: passed
  - scenario: BILLING_SALE_REQUIRED
    test: CashSalesApiTest.salesAndBillingRejectInvalidLifecycleTransitions (strengthened this
      backlog item with an explicit error-code assertion)
    result: passed
  - scenario: Tax lines
    test: CashSalesApiTest.paidSaleCanCreateBillingRequestAndSubmitViaFiscalAdapter,
      financialActionsProduceQueryableAuditEvents
    result: passed
  - scenario: Billing request submit, retry and cancel against the fiscal adapter
    test: CashSalesApiTest.billingRequestFullLifecycleSubmitRetryIssued,
      billingRequestCancelOnRequestedSucceeds,
      billingRequestSubmitIdempotencySecondSubmitOnSubmittedIsRejected
    result: passed
  - scenario: Adapter failure and retry path (simulated)
    test: BillingRequestAdapterUnitTest.submitWithRetryableAdapterExceptionSetsFailedStatus,
      submitWithTerminalAdapterExceptionSetsFailedStatus, retryOnFailedStatusTransitionsToIssued
    result: passed
    detail: A mocked FiscalAdapterPort throws FiscalAdapterException (retryable and terminal
      variants); the service sets status "failed" with a normalized adapterResponseSnapshot and a
      retry transitions a failed request to "issued", proving the safe-to-simulate adapter
      failure/retry path without depending on network conditions.
  - scenario: Audit events for critical financial actions
    test: financialActionsProduceQueryableAuditEvents (new this backlog item, real /api/audit/events
      query) and BillingRequestAdapterUnitTest's verify(auditRecorder).recordSystemEvent(...)
      assertions for BillingRequestSubmitted/BillingRequestSubmitFailed/BillingRequestRetried/BillingRequestCancelled
    result: passed
  - scenario: CashSales does not mutate clinical/patient/order/catalog aggregates directly
    test: PlatformFoundationModulithTest (Spring Modulith boundary verification) plus manual
      architecture review documented above
    result: passed
  - scenario: FE-001 UI can drive the complete financial flow
    test: CashSessionsScreen.test.tsx, SalesScreen.test.tsx, BillingRequestsScreen.test.tsx (each
      screen's create/list/detail/action flow, matching the backend contract field-for-field) plus
      manual runbook smoke walkthrough (SMOKE-010) of the running employee portal against the
      running backend
    result: passed

