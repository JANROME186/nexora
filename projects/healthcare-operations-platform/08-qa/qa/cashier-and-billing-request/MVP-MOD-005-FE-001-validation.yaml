capability_coverage:
  - capability: BCM-ATT-005
    name: Cashier Operations
    screens_delivered:
      - SCR-CASH-001 Cash session console (open, close, view variance)
      - SCR-CASH-002 Sale worklist (create from order/quotation, view sale)
      - SCR-CASH-003 Payment registration (register payment, cancel sale, request billing)
    endpoints_used:
      - GET /api/revenue/cashier/sessions
      - GET /api/revenue/cashier/sessions/{sessionId}
      - POST /api/revenue/cashier/sessions
      - POST /api/revenue/cashier/sessions/{sessionId}/close
      - GET /api/revenue/cashier/sales
      - GET /api/revenue/cashier/sales/{saleId}
      - GET /api/revenue/cashier/sales/{saleId}/lines
      - GET /api/revenue/cashier/sales/{saleId}/payments
      - POST /api/revenue/cashier/sales
      - POST /api/revenue/cashier/sales/{saleId}/payments
      - POST /api/revenue/cashier/sales/{saleId}/cancel
    sale_creation_sources: >
      Source selector offers diagnostic_order and quotation, matching Sale.SOURCE_DIAGNOSTIC_ORDER
      and Sale.SOURCE_QUOTATION exactly; sale lines and totals are populated synchronously by the
      backend at creation time and rendered immediately after create.
    totals_outstanding_and_status_display: >
      Sale detail renders subtotalAmount, discountAmount, totalAmount, paidAmount and
      outstandingAmount (all Money), plus the sale status badge (payable/partially_paid/paid/
      cancelled/refunded) and cancellationReason when present.
  - capability: BCM-ATT-008
    name: Billing Request Management
    screens_delivered:
      - SCR-BILL-001 Billing request worklist (create request, view request, retry failed)
      - SCR-BILL-002 Fiscal profile capture (submit request)
      - SCR-BILL-003 Adapter response detail (cancel request, retry request)
    endpoints_used:
      - GET /api/revenue/billing-requests
      - GET /api/revenue/billing-requests/{invoiceRequestId}
      - GET /api/revenue/billing-requests/{invoiceRequestId}/tax-lines
      - POST /api/revenue/billing-requests
      - POST /api/revenue/billing-requests/{invoiceRequestId}/submit
      - POST /api/revenue/billing-requests/{invoiceRequestId}/retry
      - POST /api/revenue/billing-requests/{invoiceRequestId}/cancel
    tax_lines_rendered: taxCode, taxRate, baseAmount and taxAmount for every tax line of the selected
      billing request.
    lifecycle_actions_gated_by_status: >
      Submit only shown in status "requested"; retry only shown in status "submitted" or "failed"
      (matching BillingRequestManagementService's own transition guards); cancel hidden once status
      is terminal ("issued" or "cancelled"). Every action is confirmation-gated.
    business_error_handling:
      - >-
        BILLING_SALE_REQUIRED (409) surfaced verbatim from the backend when creating a billing
        request for a sale that is not yet paid.
      - >-
        PAYMENT_EXCEEDS_OUTSTANDING_BALANCE (409) surfaced verbatim from the backend when a
        registered payment would exceed the sale's outstanding balance.
      - >-
        CASH_VARIANCE_REASON_REQUIRED (409) surfaced verbatim from the backend when closing a cash
        session with a counted amount that differs from the expected amount without a variance
        reason.
      - >-
        Adapter failures (BILLING_ADAPTER_TRANSIENT_ERROR/BILLING_ADAPTER_TERMINAL_ERROR) do not
        throw; the backend returns a 200 response with status "failed" and an
        adapterResponseSnapshot, which the detail view renders in a <pre> block and which unlocks
        the Retry action per the failed-state retry policy.

ux_states_delivered:
  loading: useAsyncAction's "loading" status disables the triggering control and shows "Working on
    it..." via StatusBanner, for every one of the 13 new async actions (list/open/close for cash
    sessions; list/create/lines/payments/pay/cancel for sales; list/create/submit/retry/cancel for
    billing requests).
  empty: >-
    "No cash sessions exist yet for this tenant.", "No sales exist yet for this tenant.", "This sale
    has no lines.", "No payments have been registered for this sale." and "No billing requests exist
    yet for this tenant." shown after a successful load returns zero rows.
  error: >-
    StatusBanner renders ApiError.message (including the CashSalesErrorCodes-prefixed business
    conflicts) or the shared MESSAGES.unexpectedError fallback for non-ApiError failures, consistent
    with every other employee-portal screen.
  confirmation: >-
    ConfirmDialog gates every destructive or financial action with no undo path: closing a cash
    session, cancelling a sale, and submitting/retrying/cancelling a billing request.
  success: >-
    A dedicated success message per action (Cash session opened./closed., Sale created./cancelled.,
    Payment registered., Billing request created./submitted./retried./cancelled.), each rendered
    outside any status-gated control so the message stays visible after the status transition it
    reports on (per the vanishing-success-banner lesson from MVP-MOD-004-FE-001).

backend_conflict_handling_and_normalization: >
  No frontend-side error re-authoring or normalization was added. Every CashSalesErrorCodes-prefixed
  "CODE: prose" message (SALE_SOURCE_NOT_ACCEPTED, CASH_SESSION_REQUIRED,
  PAYMENT_EXCEEDS_OUTSTANDING_BALANCE, CASH_VARIANCE_REASON_REQUIRED, SALE_TERMINAL_STATE_IMMUTABLE,
  BILLING_SALE_REQUIRED, BILLING_REQUEST_INVALID_STATE_TRANSITION) is rendered as-is via the shared
  StatusBanner/ApiError.message mechanism already used by every other employee-portal screen; the
  backend remains the single source of truth for that prose (HOP-QA-ALIGN-005 baseline).

behavior_preservation_evidence: >
  DiagnosticOrdersScreen.tsx's only change was removing its local formatMoney duplicate in favor of
  the new shared api/money.ts helper (byte-identical rendering behavior; the extracted function body
  is unchanged). All 30 pre-existing tests continued passing unchanged; 9 new tests were added across
  3 new screen test files and 1 new API test file.

