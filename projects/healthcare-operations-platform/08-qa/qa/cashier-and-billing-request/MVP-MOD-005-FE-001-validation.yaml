    description: TypeScript DTOs for BCM-ATT-005 (CashSession, Sale, SaleTotals, SaleLine,
      PaymentAllocation and their request types) and BCM-ATT-008 (InvoiceRequest,
      FiscalProfileSnapshot, TaxLine, CreateBillingRequestRequest), corrected to match the backend
      domain records field-for-field, including reusing the existing shared Money type.
  - id: FE-002
    path: 07-implementation/employee-portal/src/api/money.ts
    description: New shared formatMoney(money?) helper extracted from the pre-existing per-screen
      duplicate in DiagnosticOrdersScreen.tsx so the three new screens do not each carry their own
      copy of the same four-line function.
  - id: FE-003
    path: 07-implementation/employee-portal/src/api/cashSalesApi.ts
    description: Cashier Operations and Billing Request API client covering
      /api/revenue/cashier/sessions, /api/revenue/cashier/sales and /api/revenue/billing-requests,
      matching CashierOperationsController and BillingRequestController request/response records.
  - id: FE-004
    path: 07-implementation/employee-portal/src/components/screens/CashSessionsScreen.tsx
    description: SCR-CASH-001 - cash session console. Open session, list sessions by tenant, session
