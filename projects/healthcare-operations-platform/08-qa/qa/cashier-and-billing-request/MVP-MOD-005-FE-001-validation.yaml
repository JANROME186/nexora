    - 08-qa/qa/cashier-and-billing-request/MVP-MOD-005-BE-002-validation.yaml
    - 08-qa/security-quality/MVP-MOD-005-BE-002/security-quality-evidence.yaml
  objective: >
    Compile the employee portal UI outputs for the already-implemented Cashier and Billing Request
    backend capabilities named explicitly by the backlog's acceptance summary: cash session open/
    close with variance handling (Cashier Operations, BCM-ATT-005), sale creation from an accepted
    diagnostic order or quotation with payment allocation and sale cancellation (Cashier Operations,
    BCM-ATT-005), and billing request creation from a paid sale with tax lines, submit/retry/cancel
    against the provider-agnostic fiscal adapter boundary (Billing Request Management, BCM-ATT-008).

pre_existing_work_in_progress_found: >
  This backlog item started with an uncommitted, partially built CashSessionsScreen.tsx,
  cashSalesApi.ts and a types.ts extension already present in the working tree from a prior session.
  That work was reviewed against the actual backend contract (CashierOperationsController,
  BillingRequestController and their domain records/services) before being reused: the prior
  types.ts draft modeled Money-typed fields (openingAmount, countedAmount, sale totals, payment
  amounts) as flat number+currency pairs and used incorrect field names and status literals (for
  example SaleTotals.subtotal/taxTotal/total/paidTotal/outstandingBalance instead of the backend's
  subtotalAmount/discountAmount/totalAmount/paidAmount/outstandingAmount, and Sale.status "open"
  instead of the backend's "payable"). All cashier/billing types were corrected to match the
  backend's Sale, SaleTotals, SaleLine, PaymentAllocation, CashSession, InvoiceRequest, TaxLine and
  FiscalProfileSnapshot records field-for-field before any screen was built on top of them, so the
  UI would not silently break against the real API. cashSalesApi.ts's endpoint paths were already
  correct and only needed a CancelSaleRequest type import instead of an ad-hoc inline type.

debt_first_action:
  reviewed: 08-qa/technical-debt/technical-debt-index.yaml
  candidates_considered:
    - TD-FE-003
    - TD-FE-004
    - TD-I18N-002
  selected: TD-FE-004
  action_taken: >
    Raised employee portal line coverage from 76.51 percent to 80.57 percent, closing TD-FE-004 (the
    80 percent final-closure target for this stack) rather than merely reducing it. Achieved by
    building CashSessionsScreen.tsx, SalesScreen.tsx, BillingRequestsScreen.tsx and cashSalesApi.ts
    with matching test coverage from the start (cashSalesApi.test.ts 100 percent statements;
    CashSessionsScreen.tsx 94.26 percent; SalesScreen.tsx 98.06 percent; BillingRequestsScreen.tsx
    95.19 percent) plus a shared money.ts formatting utility extracted to keep jscpd duplication at
    0 findings across four now-identical formatMoney call sites.
  other_candidates_reviewed_not_selected: >
    TD-FE-003 (ESLint complexity/duplicate-string warnings on pre-existing screens) was reviewed;
    fixing it would touch unrelated screens outside this backlog item's scope. TD-I18N-002 (backend
    error `code` field and full i18n-library adoption) requires a backend contract change and a new
    frontend dependency, both out of scope for a UI-compilation backlog item.
  new_debt_registered: none. No new frontend gap was identified during this backlog item beyond the
    already-tracked TD-FE-003 and TD-I18N-002.

implemented_outputs:
