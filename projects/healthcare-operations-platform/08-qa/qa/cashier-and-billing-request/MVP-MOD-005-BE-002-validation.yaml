  frontdesk_public_port: 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/frontdeskcaredelivery/application/FrontDeskSaleSourcePort.java
  fiscal_adapter_boundary: 07-implementation/backend/src/main/java/com/nexora/hop/platformfoundation/cashsales/billingrequestmanagement/domain/FiscalAdapterPort.java

implemented_outputs:
  billing_request_management:
    - Provider-agnostic FiscalAdapterPort with submit, retry and cancel operations.
    - FiscalAdapterRequest and FiscalAdapterResponse contracts without country-specific fields.
    - LocalDeterministicFiscalAdapter default implementation for local development and automated validation.
    - Billing submit, retry and cancel endpoints now execute the adapter boundary instead of returning deferred conflicts.
    - Deterministic idempotency key derivation from invoice request identity and original request version.
    - Adapter status mapping for submitted, issued, failed and cancelled lifecycle states.
    - Adapter exception handling with normalized error codes, retryability and persisted response snapshots.
    - Terminal-state guards prevent invalid re-submit, retry and cancellation transitions.
  modular_boundary:
    - FrontDeskCareDelivery exposes a sale-source-port named interface for sale source snapshots.
    - CashSales depends on frontdeskcaredelivery::sale-source-port instead of an open module.
    - FrontDeskCareDelivery no longer requires Spring Modulith Type.OPEN for CashSales access.

