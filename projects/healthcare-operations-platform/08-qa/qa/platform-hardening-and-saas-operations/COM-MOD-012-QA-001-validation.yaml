technical_debt:
  closed:
    - id: TD-QA-005
      title: Null byte / oversized value in a request field or query parameter caused an unhandled
        500 across multiple modules
      contribution: >-
        GlobalExceptionHandler now maps DataIntegrityViolationException to 400 when its root cause
        is a SQLSTATE-class-22 (data exception: invalid byte sequence 22021, string truncation
        22001) SQLException, leaving every other cause (e.g. real 23xxx constraint conflicts)
        unchanged.
    - id: TD-QA-006
      title: AuthController.initiateAssistance returned 500 instead of 404 for a nonexistent
        assistedUserId
      contribution: >-
        IdentityAccessExceptionHandler's assignableTypes widened to also cover AuthController, so
        its existing IdentityEntityNotFoundException -> 404 mapping now applies there too.
  new:
    - id: TD-OBS-001
      title: Distributed trace export, provisioned Grafana/Prometheus/Loki stack and SLO/SLA
        alerting backend not implemented
      status: open
      risk_level: low
      blocking: false
  confirmed_still_open_unchanged:
    - TD-BE-016
    - TD-BE-017
    - TD-IAM-003
    - TD-BE-005
    - TD-BE-006
    - TD-BE-007
    - TD-BE-008
    - TD-FE-005

