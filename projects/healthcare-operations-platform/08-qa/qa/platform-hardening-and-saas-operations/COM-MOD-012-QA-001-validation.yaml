capability_traceability_validation:
  method: >-
    Live runtime testing against the running backend for every COM-MOD-012-BE-001-compiled
    operation, plus a full OWASP ZAP API scan (zap-api-scan.py) against the whole /v3/api-docs
    surface and a ZAP baseline scan against the employee portal. Cross-checked all 8 capabilities'
    traceability.yaml files against actual compiled surface and technical-debt-index.yaml.
  results:
    - capability_id: BCM-ORG-001
      status: validated
      detail: >-
        provisionTenant/listTenants/updateTenantStatus exercised live: duplicate code correctly
        rejected (409), invalid status value correctly rejected (400), status transition on a
        nonexistent tenant correctly rejected (404), 20 concurrent provisions all succeeded with no
        duplicate-code race (342ms total), and audit-event traceability confirmed live.
    - capability_id: BCM-PLT-001
      status: validated
      detail: >-
        SCREEN_PLATFORM_CONFIGURATION EndpointPermissionRegistry entries confirmed reachable and
        deny-by-default. TD-IAM-003 (MFA/service-account/scope-grammar) confirmed still open, not
        exposed by this item's scope.
    - capability_id: BCM-PLT-002
      status: validated
      detail: >-
        getPlatformConfig/evaluateFeatureFlags/updateFeatureFlag exercised live including the
        safe-default-false-with-no-tenantId invariant, non-namespaced flagKey rejection (400),
        out-of-bounds rollout rejection (400), and a verified FeatureFlagUpdated audit event.
    - capability_id: BCM-PLT-005
      status: validated
      detail: >-
        OWASP ZAP API scan (353 imported URLs, full active-scan rule set) found 0
        SQLi/XSS/RCE/path-traversal/SSRF findings; found and this item fixed 2 real defects
        (TD-QA-005, TD-QA-006). ZAP baseline scan against the employee portal found 0 FAIL-NEW; the
        4 WARN-NEW findings match the already-registered TD-FE-005.
    - capability_id: BCM-PLT-006
      status: validated
      detail: >-
        Found and fixed a real resilience defect: the readiness probe did not reflect database
        connectivity. Re-verified live: readiness correctly reports DOWN/503 with PostgreSQL
        stopped and UP after recovery; liveness correctly stays UP throughout. MDC
        tenantId/userId/traceId confirmed populated on live traffic including malformed-input error
        paths; W3C traceparent reuse and control-character sanitization confirmed live. Executed a
        real backup (pg_dump, checksum, pg_restore --list) and restore rehearsal (isolated database,
        matching row counts). Distributed trace export, a provisioned Grafana/Prometheus/Loki stack
        and SLO/SLA alerting confirmed still not implemented; registered as TD-OBS-001.
    - capability_id: BCM-PLT-007
      status: validated
      detail: >-
        Confirmed both COM-MOD-012-BE-001 privileged operations (TenantStatusChanged,
        FeatureFlagUpdated) record correctly via a live GET /api/audit/events query, with
        before/after and actor metadata. TD-BE-016 confirmed still open (unchanged).
    - capability_id: BCM-PLT-008
      status: validated
      detail: >-
        Confirmed extension_deferred, unchanged since COM-MOD-012-BE-001. This item's own
        backup/restore evidence was stored under 08-qa/ per the existing convention, confirming it
        remains the working interim control.
    - capability_id: BCM-PLT-009
      status: validated
      detail: >-
        Confirmed not_implemented (TD-BE-017, unchanged). Manually exercised the runbook workflow
        it will eventually automate (backup + restore rehearsal), both executed successfully.

performance_and_resilience_evidence:
  light_load_check:
    method: >-
      30 sequential GET /api/platform/tenants requests, then 20 concurrent POST
      /api/platform/tenants provisions, reproducible with a plain shell loop against the running
      local backend (no dedicated load-test tool required for this light local check).
    results:
      sequential_get_avg_latency_seconds: 0.0121
      concurrent_provisions_count: 20
      concurrent_provisions_total_time_ms: 342
      concurrent_provisions_failures: 0
      concurrent_provisions_duplicate_code_races: 0
  health_readiness_liveness_normal_scenario:
    liveness: UP (200)
    readiness: UP (200)
    prometheus: 200, text/plain Prometheus exposition format
  health_readiness_liveness_controlled_failure_scenario:
    method: docker stop hop-local-postgres, probe, then docker start hop-local-postgres, probe
    finding: >-
      Real defect found: readiness stayed UP (200) with PostgreSQL stopped, because
      management.endpoint.health.group.readiness.include was unset and the default readiness group
      only contains readinessState, not db.
    fix: >-
      Added management.endpoint.health.group.readiness.include: readinessState,db to
      application-local.yml (the profile with a real DataSource bean; the same include in the base
      application.yml broke context startup for profiles with no DataSource -- confirmed by
      reproducing "Health contributor 'db' ... does not exist" -- so it was scoped to
      application-local.yml only). New regression test:
      ObservabilityReadinessLocalDatabaseTest.readinessGroupIncludesDatabaseAndReportsUpAgainstTheRealLocalDatabase.
    verified_after_fix:
      readiness_with_db_down: "DOWN, HTTP 503"
      liveness_with_db_down: "UP, HTTP 200 (no unnecessary restart)"
      readiness_after_db_recovery: "UP, HTTP 200"
  invalid_input_handling:
    - case: duplicate tenant code
      expected: 409
      actual: 409
    - case: invalid tenant status value
      expected: 400
      actual: 400
    - case: status transition on nonexistent tenant
      expected: 404
      actual: 404
    - case: feature-flag evaluation with no tenantId
      expected: "safe default false, 200"
      actual: "safe default false, 200"
    - case: non-namespaced feature-flag key
      expected: 400
      actual: 400
    - case: feature-flag rollout percentage out of bounds
      expected: 400
      actual: 400
    - case: malformed JSON body
      expected: 400
      actual: 400
    - case: null byte in a string query parameter (found by DAST)
      expected: 400
      actual: 500 before fix, 400 after fix (TD-QA-005)
    - case: oversized string field value (found by DAST)
      expected: 400
      actual: 500 before fix, 400 after fix (TD-QA-005)
    - case: nonexistent assistedUserId on POST /api/auth/assistance (found by DAST)
      expected: 404
      actual: 500 before fix, 404 after fix (TD-QA-006)
  backup_restore_runbook_readiness:
    backup:
      command: docker exec hop-local-postgres pg_dump -U hop -d hop -F c -f /tmp/hop-backup-<ts>.dump
      result: success, 317157 bytes
      checksum_sha256: 76e4a7513fd4603eb93987c90387b3976eb7c6163c0b5e2772010b4913d6b080
      structural_verification: "pg_restore --list: 415 TOC entries, no corruption"
    restore_rehearsal:
      command: >-
        createdb hop_restore_verify; pg_restore -U hop -d hop_restore_verify --clean --if-exists
        <dump>; row-count comparison; dropdb hop_restore_verify
      result: success
      row_count_source: 40
      row_count_restored: 40
      match: true
    disposition: >-
      backup-runbook.yaml and restore-runbook.yaml both executable and correct today. Dump artifact
      not committed to the repository (317KB binary, matches the runbook's own "local filesystem,
      not durable object storage" framing); checksum and pg_restore --list output retained here as
      evidence.

