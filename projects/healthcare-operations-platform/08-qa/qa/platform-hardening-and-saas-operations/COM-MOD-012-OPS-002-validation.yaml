executability_verification:
  method: >-
    Every command referencing a currently-running local component (docker compose, actuator health,
    OTel Collector health endpoint, /api/audit/events, pg_dump/pg_restore/psql against the local
    PostgreSQL container) was cross-checked against 07-implementation/compose.local.yml,
    07-implementation/.env.example, backend/src/main/resources/application.yml and the existing
    AuditComplianceController mapping (/api/audit) rather than assumed.
  confirmed_executable_on_local:
    - Docker Compose service health checks (postgres, redis, otel-collector) against compose.local.yml.
    - Backend actuator health/info against application.yml management.endpoints.web.exposure.include=health,info.
    - OTel Collector health extension on port 13133 (HOP_OTEL_HEALTH_PORT default).
    - GET /api/audit/events against AuditComplianceController @RequestMapping("/api/audit").
    - pg_dump/pg_restore/psql/createdb/dropdb against container hop-local-postgres with HOP_POSTGRES_USER/HOP_POSTGRES_DB from .env.example.
  explicitly_documented_as_not_yet_executable:
    - Prometheus metrics scrape endpoint (no micrometer-registry-prometheus dependency in backend/pom.xml; management.endpoints.web.exposure.include is health,info only).
    - Distributed trace export from backend to OTel Collector (collector is reachable; no application-side exporter wired).
    - Kubernetes-compatible dev/qa/staging/prod observability, backup and rollback infrastructure (target posture only, per production-deployment-strategy.yaml target_runtime_topology).
  disposition: >-
    Each gap is recorded verbatim in its runbook's known_gaps_and_forward_pointers section with a
    forward pointer to COM-MOD-012-BE-001 or a named future backlog item, per the rule against
    silently marking an unexecutable step as passed.

technical_debt:
  reviewed_index: 08-qa/technical-debt/technical-debt-index.yaml
  debt_first_action:
    item: TD-DB-004
    disposition: materially_reduced
    reason: >
      tenant-impact-triage-runbook.yaml adds an executable, mandatory cross-tenant leakage check
      (grouped tenant_id row counts against a known-good baseline) as an operational
      defense-in-depth compensating control, run during every incident, restore and higher-risk
      deployment, escalating any anomaly to P1. TD-DB-004's own acceptance criteria (native
      PostgreSQL Row Level Security) remain open; its blocking dependency TD-IAM-001 is already
      closed, so RLS itself can now be scheduled as a future backend code-changing backlog item.
      No other open technical-debt item was a closer match to this backlog item's
      observability/backup/restore/incident scope.

