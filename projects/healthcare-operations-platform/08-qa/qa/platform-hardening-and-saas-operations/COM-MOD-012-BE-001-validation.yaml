technical_debt:
  materially_reduced:
    - id: TD-IAM-002
      title: Permission model is screen-level only; per-action/per-API-operation granularity unmodeled
      contribution: >-
        Added PermissionCode.SCREEN_PLATFORM_CONFIGURATION and two new EndpointPermissionRegistry
        entries (/api/platform/config, /api/platform/feature-flags), continuing the endpoint-level
        permission registry pattern rather than a coarser catch-all.
    - id: TD-DB-004
      title: Tenant scoping is enforced by application-level WHERE clauses, not native PostgreSQL RLS
      contribution: >-
        Tenant now persists an explicit isolationStrategy field (SCHEMA_PER_TENANT or
        DISCRIMINATOR_WITH_RLS, defaulting to the current DISCRIMINATOR_WITH_RLS reality) plus a
        real operational containment control (tenant suspend/archive via updateTenantStatus,
        documented as tenant-impact-triage-runbook.yaml TRIAGE-STEP-004B) alongside the existing
        cross-tenant leakage check compensating control. TD-DB-004's own acceptance criteria (native
        RLS) remain open.
  new:
    - id: TD-BE-016
      title: BCM-PLT-007 searchAuditEvents/exportAuditEvents openapi-source.yaml operations not
        fully compiled (export bundle generation missing; search path differs from the modeled
        /api/v1/platform/audit/events)
      status: open
      risk_level: low
      blocking: false
      affected_area: audit_trail_api_surface
      remediation_strategy: gradual_when_a_future_backlog_item_next_touches_auditcompliance
    - id: TD-BE-017
      title: BCM-PLT-009 Workflow Engine (listWorkflowExecutions/triggerWorkflow/rollbackWorkflow) not
        implemented; no backend module exists for operational workflow orchestration
      status: open
      risk_level: medium
      blocking: false
      affected_area: operational_workflow_orchestration
      remediation_strategy: gradual_dedicated_backlog_item_once_a_real_orchestration_target_exists
        (automated backup scheduling, restore rehearsal or rollback tracking per the OPS-002
        runbooks' remaining open gaps)
    - id: TD-IAM-003
      title: BCM-PLT-001 MFA, service-account credentials and the domain.resource.action.scope
        permission grammar modeled by COM-MOD-012-DEF are not implemented
      status: open
      risk_level: low
      blocking: false
      affected_area: identity_access_extensions
      remediation_strategy: gradual_when_a_future_backlog_item_next_touches_identityaccess

