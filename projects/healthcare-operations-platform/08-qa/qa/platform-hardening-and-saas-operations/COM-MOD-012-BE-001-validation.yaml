    scanners: [vuln, secret, misconfig]
    severities: [UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL]
    command: trivy fs --skip-dirs target --skip-dirs node_modules --skip-dirs .m2 --scanners
      vuln,secret,misconfig --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 --timeout 15m
      07-implementation/backend
    vulnerabilities: 0
    secrets: 0
    misconfigurations: 0
    note: an untracked, gitignored local .m2/repository cache (665MB) under
      07-implementation/backend/.m2 caused the first scan attempt to time out purely on filesystem
      walk; excluded via --skip-dirs .m2 for the successful re-run (no source content skipped).
  yaml_parse:
