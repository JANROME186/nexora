artifact:
  id: HOP-QA-COM-MOD-012-BE-001
  type: qa-validation-evidence
  name: COM-MOD-012-BE-001 Compile Tenant Operations, Feature Flags and Operational Controls Validation
  version: 1.0.0
  status: passed
  captured_on: 2026-07-23

backlog_item:
  id: COM-MOD-012-BE-001
  module: COM-MOD-012
  module_name: Platform Hardening and SaaS Operations
  status: closed
  scope: >-
    Compile the operations modeled by COM-MOD-012-DEF into real Spring Modulith code: BCM-ORG-001
    tenant provisioning/listing/status-transition operations, a new BCM-PLT-002 Platform
    Configuration and Feature Flags module, and BCM-PLT-006 observability extensions (Prometheus
    metrics endpoint, separate liveness/readiness health groups, tenant_id/user_id/trace_id MDC
    logging context). Closes or reduces the COM-MOD-012-OPS-002 runbook known_gaps_and_forward_pointers
    that named this backlog item as their forward pointer.

capabilities:
  - id: BCM-ORG-001
    surface_added: >-
      GET /api/platform/tenants (listTenants); PUT /api/platform/tenants/{tenantId}/status
      (updateTenantStatus). POST /api/platform/tenants (provisionTenant) already existed as
      createTenant; extended in place to the richer TenantRoot model (code, legalName, tradeName,
      taxId, status, tier, isolationStrategy) rather than adding a duplicate endpoint.
    domain_model: >-
      Tenant record extended with code (globally unique), legalName, tradeName, taxId, status
      (PENDING_PROVISIONING/ACTIVE/SUSPENDED/ARCHIVED), tier (STARTER/PROFESSIONAL/ENTERPRISE),
      isolationStrategy (SCHEMA_PER_TENANT/DISCRIMINATOR_WITH_RLS, default
      DISCRIMINATOR_WITH_RLS matching the current TD-DB-004 baseline).
    backward_compatibility: >-
      ProvisionTenantRequest keeps the pre-BE-001 bare "name" field as a fallback for legalName,
      and auto-derives a unique "code" (slug + random suffix) when the caller omits it, so the ~20
      pre-existing module test fixtures that bootstrap a tenant with {"name":"..."} keep working
      unchanged against the richer model.
    privileged_operation_audit: updateTenantStatus records a TenantStatusChanged audit event
      (previousStatus, newStatus, reason) via the existing BCM-PLT-007 AuditRecorder.
    reused_service: OrganizationManagementService (provisionTenant, listTenants, updateTenantStatus)
  - id: BCM-PLT-002
    surface_added: >-
      GET /api/platform/config (getPlatformConfig); GET /api/platform/feature-flags
      (evaluateFeatureFlags); POST /api/platform/feature-flags (updateFeatureFlag).
    domain_model: ConfigParameter (ConfigKeyRoot) and FeatureFlag entities per business-model.yaml.
    invariants_enforced:
      - business-model.yaml invariant "Config keys must follow standard namespace formatting";
        seeded config_parameters keys use the platform.<area>.<name> namespace; updateFeatureFlag
        rejects flagKey values that do not match the namespace regex.
      - business-model.yaml invariant "Feature flag evaluation must default to false if targeting
        rules fail"; evaluateFeatureFlags returns false whenever tenantId is blank or no
        targeting/rollout rule matches; never throws.
      - Encrypted config parameters (is_encrypted=true) are masked ("***") in getPlatformConfig
        responses.
    privileged_operation_audit: updateFeatureFlag records a FeatureFlagUpdated audit event via the
      existing BCM-PLT-007 AuditRecorder.
    reused_service: none (new module); wired through the existing AuditRecorder named interface only
  - id: BCM-PLT-006
    surface_added: GET /actuator/health/liveness, GET /actuator/health/readiness, GET
      /actuator/prometheus (all satisfied by Spring Boot Actuator + Micrometer configuration, not
      hand-written controllers, per "no crear CRUD manual repetitivo si puede derivarse de modelos").
    mdc_logging: >-
      New RequestObservabilityContextFilter populates SLF4J MDC (tenantId, userId, traceId) for
      every request ahead of HopAuthorizationInterceptor, so context is present even for
      401/403/unmapped requests; logging.pattern.console in application.yml renders all three on
      every log line. traceId reuses an inbound W3C traceparent trace-id segment when it matches the
      strict 32-lowercase-hex format, otherwise mints a new one; echoed back as X-Trace-Id.
  - id: BCM-PLT-007
    surface_reused: existing /api/audit/events (searchEvents) and AuditRecorder are the audit
      mechanism reused by the two new privileged operations above (TenantStatusChanged,
      FeatureFlagUpdated). No new BCM-PLT-007 endpoint was added; searchAuditEvents/exportAuditEvents
      from the capability's openapi-source.yaml remain future scope (registered as TD-BE-016 below).
  - id: BCM-PLT-001
    status: extension_deferred
    reason: >-
      MFA/service-account/action.scope-grammar extensions modeled by COM-MOD-012-DEF are not exposed
      by any operation this backlog item needed to compile; deferred to a future backlog item
      (see technical_debt below, TD-IAM-003).
  - id: BCM-PLT-005
    status: extension_deferred
    reason: Edge security headers (CORS/CSP/HSTS) modeled by COM-MOD-012-DEF have no dedicated
      operation in this backlog item's scope; existing rate-limit enforcement (COM-MOD-011-BE-001)
      is unchanged. Deferred to a future backlog item (TD-FE-005 already tracks this).
  - id: BCM-PLT-008
    status: extension_deferred
    reason: Retention/export extensions modeled by COM-MOD-012-DEF are not exposed by any operation
      this backlog item needed to compile; existing documentmanagement module is unchanged.
  - id: BCM-PLT-009
    status: not_implemented
    reason: >-
      Workflow Engine (listWorkflowExecutions/triggerWorkflow/rollbackWorkflow) requires new
      cross-module orchestration wiring (backup scheduling, restore rehearsal, rollback tracking)
      that is materially larger than a single operational-controls increment; implementing a
      workflow engine shell without real executions to orchestrate would be exactly the
      "CRUD manual repetitivo" this backlog forbids. Registered as TD-BE-017 (new debt) below.

modules:
  organizationmanagement:
    kind: extended_existing_spring_modulith_module
    package: com.nexora.hop.platformfoundation.organizationmanagement
    controllers:
      - com.nexora.hop.platformfoundation.organizationmanagement.adapter.in.web.OrganizationManagementController
        (provisionTenant, listTenants, getTenant, updateTenantStatus added/extended)
    error_envelope: "{status, code, messageKey, message, occurredAt}"
    i18n_keys_added: >-
      organizationmanagement.error.entity_not_found, organizationmanagement.error.organization_command_invalid,
      organizationmanagement.error.tenant_code_conflict (added to messages.properties,
      messages_es_MX.properties and messages_en_US.properties; TD-I18N-002 further reduced)
  platformconfiguration:
    kind: new_spring_modulith_module
    package: com.nexora.hop.platformfoundation.platformconfiguration
    allowed_dependencies:
      - auditcompliance
    controllers:
      - com.nexora.hop.platformfoundation.platformconfiguration.adapter.in.web.PlatformConfigurationController
    error_envelope: "{status, code, messageKey, message, occurredAt}"
    i18n_keys_added: >-
      platformconfiguration.error.command_invalid (added to messages.properties,
      messages_es_MX.properties and messages_en_US.properties)
  observability:
    kind: extended_existing_spring_modulith_module
    package: com.nexora.hop.platformfoundation.observability
    new_types:
      - com.nexora.hop.platformfoundation.observability.adapter.in.web.RequestObservabilityContextFilter
        (jakarta.servlet Filter bean, auto-registered by Spring Boot)
    dependency_added: io.micrometer:micrometer-registry-prometheus (runtime scope, no explicit
      version - managed by the spring-boot-starter-parent BOM)

domain_and_schema_extensions:
  bcm_org_001_tenant_root:
    kind: extend_existing_aggregate
    fields_added: [code, legalName, tradeName, taxId, tier, isolationStrategy]
    field_removed: name (superseded by legalName/tradeName; no other module read organization.tenants.name)
    schema_migration: >-
      organization.tenants DROP COLUMN name; ADD COLUMN code/legal_name/trade_name/tax_id (varchar,
      nullable initially, backfilled from tenant_id for pre-existing rows), tier (NOT NULL DEFAULT
      'STARTER'), isolation_strategy (NOT NULL DEFAULT 'DISCRIMINATOR_WITH_RLS'); code and
      legal_name set NOT NULL after backfill; unique index tenants_code_key added. Additive/backfill
      DDL executed in db/platform-foundation/schema.sql.
  bcm_plt_002_platform_configuration:
    kind: new_schema
    location: db/platform-hardening-and-saas-operations/schema.sql
    tables: [platform_configuration.config_parameters, platform_configuration.feature_flags]
    seed_data: >-
      platform.security.session_timeout_minutes (INTEGER, 30, tenant-overridable),
      platform.operations.maintenance_mode (BOOLEAN, false, platform-global)

