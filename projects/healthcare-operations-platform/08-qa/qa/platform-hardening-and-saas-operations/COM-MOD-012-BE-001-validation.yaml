    method: mvn org.owasp:dependency-check-maven:check -DautoUpdate=false against the local shared
      NVD data directory (framework requirement); dependency count rose from 108 to 115 due to
      micrometer-registry-prometheus and its transitives.
  trivy_filesystem_scan:
