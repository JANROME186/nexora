  pmd_and_cpd:
    tool: maven-pmd-plugin 3.27.0 / PMD 7.14.0
    command: mvn -Pquality pmd:pmd pmd:cpd
    findings_total: 480
    cpd_duplications: 2
    findings_in_new_files: 6
    disposition: >-
      All 6 findings in new/touched files mirror pre-existing accepted patterns already present in
      the original code before this backlog item (JdbcTemplate RowMapper's required-but-unused
      rowNumber parameter on mapTenant/mapLaboratory/mapBranch/mapConfigParameter/mapFeatureFlag;
      SimplifyBooleanReturns on tenantExists/branchExists/isBranchOperational, unchanged from before
      this item). No new violation class introduced.
  spotbugs_findsecbugs:
    tool: spotbugs-maven-plugin 4.9.3.0 + findsecbugs 1.14.0
    command: mvn -Pquality spotbugs:spotbugs
    findings_total: 35
    findings_in_new_files: 2
    finding_detail: >-
      SERVLET_HEADER (CWE-807, rank 15/low priority) on RequestObservabilityContextFilter for
      reading X-HOP-TENANT-ID/X-HOP-USER-ID/traceparent headers. This SpotBugs rule fires on any
      direct header read regardless of downstream handling (the same rule already fires on the
      pre-existing HopAuthenticationResolver). Mitigated in code: sanitizeForLogging() strips
      control characters and bounds length before any header value reaches a log line (prevents log
      injection/forging), and resolveTraceId() only reuses an inbound traceparent segment that
      matches the strict W3C 32-lowercase-hex format before ever reflecting it in the X-Trace-Id
      response header (prevents header-injection/reflection of an unvalidated client value). Covered
      by RequestObservabilityContextFilterTest.stripsControlCharactersFromTenantAndUserHeadersBeforeLogging
      and .rejectsMalformedTraceparentAndMintsANewTraceIdInstead.
  duplicate_finder:
