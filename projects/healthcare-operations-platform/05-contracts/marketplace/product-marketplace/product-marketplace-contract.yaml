artifact:
  id: HOP-MKT-001
  type: product-marketplace-contract
  name: HOP Product Marketplace and Entitlements Contract
  version: 1.0.0
  status: approved
  human_readable: product-marketplace-contract.md
  machine_readable: product-marketplace-contract.yaml
  owner: Nexora Product Architecture
  framework_standard: ../../../../nexora-framework/02-standards/standards/product-marketplace-standard.yaml

purpose: >
  Define how Healthcare Operations Platform exposes commercial marketplace
  packages so customers can buy, install, activate, consume and update
  optional functionality without custom product forks.

capability:
  id: BCM-PLT-011
  name: Product Marketplace and Entitlements
  roadmap: MVP2
  commercial_module: COM-MOD-017

package_types:
  - laboratory_capability_extension
  - imaging_package
  - ai_overlay_package
  - country_fiscal_pack
  - integration_adapter
  - report_template_pack
  - data_ingestion_adapter
  - workflow_template_pack

commercial_objects:
  marketplace_package:
    description: Versioned package published to the HOP marketplace catalog.
    required_fields:
      - package_id
      - package_type
      - publisher
      - version
      - status
      - capabilities
      - required_permissions
      - required_events
      - data_access_scopes
      - compatibility
      - support_owner
  commercial_offer:
    description: Customer-facing offer that can be purchased, bundled, trialed or privately assigned.
    required_fields:
      - offer_id
      - package_id
      - offer_type
      - pricing_model
      - trial_policy
      - billing_events
      - included_entitlements
  tenant_entitlement:
    description: Tenant-scoped permission to install or consume a package or capability.
    required_fields:
      - tenant_id
      - entitlement_id
      - source
      - package_id
      - capabilities
      - limits
      - starts_at
      - expires_at
      - status
  package_installation:
    description: Tenant-specific installed package instance and activation state.
    required_fields:
      - installation_id
      - tenant_id
      - package_id
      - version
      - status
      - configuration
      - installed_by
      - installed_at

lifecycle_operations:
  - publish_package
  - certify_package
  - purchase_offer
  - grant_entitlement
  - install_package
  - activate_package
  - suspend_package
  - upgrade_package
  - rollback_package
  - uninstall_package
  - retire_package

entitlement_scopes:
  - tenant
  - branch
  - capability
  - user_role
  - usage_quota
  - country
  - environment

guardrails:
  - Marketplace purchase does not grant role permissions by itself.
  - Tenant entitlement must be evaluated together with IAM authorization before capability execution.
  - Clinical validation, result release and financial audit controls cannot be weakened by a package.
  - Country fiscal packs must remain adapter-based and cannot mutate core billing state directly.
  - AI packages must follow HOP AI platform guardrails and human-control rules.
  - Data ingestion adapters must follow the Open Data Ingestion Standard and produce validation and reconciliation reports.
  - Package lifecycle operations must emit audit events and observability telemetry.

required_events:
  - MarketplacePackagePublished
  - CommercialOfferPublished
  - PackagePurchased
  - TenantEntitlementGranted
  - PackageInstalled
  - PackageActivated
  - PackageSuspended
  - PackageUpgraded
  - PackageRolledBack
  - PackageUninstalled
  - PackageRetired

implementation_boundaries:
  generated_from_models:
    - package catalog APIs
    - entitlement read models
    - installation workflow contracts
    - feature flag configuration surfaces
    - audit event declarations
    - compatibility validation tests
  custom_implementation:
    - billing provider adapters
    - country-specific fiscal adapters
    - external marketplace listing adapters
    - package-specific complex migration scripts
    - security-sensitive entitlement policy enforcement

definition_of_ready:
  - Nexora Product Marketplace Standard is loaded.
  - BCM-PLT-011 exists in BCM-001 and BCM-002.
  - COM-MOD-017 is present in the commercial backlog.
  - Marketplace package models exist for the target package.
  - Compatibility, entitlement, installation and rollback models are complete.

definition_of_done:
  - Published package can be discovered in the catalog.
  - Offer can be purchased or granted through a provider-agnostic boundary.
  - Tenant entitlement gates installation and runtime consumption.
  - Package can be activated, suspended, upgraded and retired with audit evidence.
  - Package behavior is observable and supportable.
