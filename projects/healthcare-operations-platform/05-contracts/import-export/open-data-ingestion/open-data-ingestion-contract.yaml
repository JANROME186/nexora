artifact:
  id: HOP-ODI-001
  type: import-export-contract
  name: HOP Open Data Ingestion Contract
  version: 1.0.0
  status: approved
  human_readable: open-data-ingestion-contract.md
  machine_readable: open-data-ingestion-contract.yaml
  owner: Nexora Product Architecture Team
  implements_framework_standard: ../../../../nexora-framework/02-standards/standards/open-data-ingestion-standard.yaml

purpose: Define simple, provider-deliverable ingestion formats and validation processes for migrating a diagnostic laboratory from another platform into HOP.

framework_standard:
  id: NXF-ODI-STD-001
  name: Open Data Ingestion Standard
  path: ../../../../nexora-framework/02-standards/standards/open-data-ingestion-standard.yaml

capability:
  id: BCM-PLT-010
  name: Open Data Ingestion and Migration
  roadmap: MVP1
  roadmap_group: MVP-MOD-008

principles:
  - Migration must never depend on proprietary vendor cooperation beyond exporting ordinary business data.
  - Any incumbent provider should be able to deliver the required information using simple open formats.
  - Imported data must be validated, normalized and reconciled before domain mutation.
  - Imports must pass through anti-corruption mappings and domain commands.
  - Failed validation blocks mutation and produces actionable correction reports.
  - Every import must be auditable, retryable and reversible where practical.

accepted_formats:
  - id: csv
    name: CSV
    required_encoding: UTF-8
    delimiter_policy: Comma preferred; semicolon accepted when declared in manifest.
    use_cases:
      - master_data
      - catalog
      - price_lists
      - orders
      - historical_results_index
  - id: xlsx
    name: Excel Workbook
    use_cases:
      - business_user_reviewable_extracts
      - small_or_medium_migrations
      - catalog_and_price_lists
  - id: json
    name: JSON
    use_cases:
      - structured_exports
      - nested_entities
      - migration_dry_run_results
  - id: ndjson
    name: Newline Delimited JSON
    use_cases:
      - large_datasets
      - streaming_validation
      - incremental_imports
  - id: zip_bundle
    name: ZIP Bundle
    use_cases:
      - multi_file_migration_package
      - data_plus_documents
      - data_plus_manifest

required_bundle_files:
  - file: manifest.yaml
    required: true
    purpose: Declares source system, export date, format, entity files, row counts, checksums and contact owner.
  - file: patients.*
    required: conditional
    condition: Patient data is in migration scope.
  - file: doctors.*
    required: conditional
    condition: Doctor data is in migration scope.
  - file: companies.*
    required: conditional
    condition: Companies or payer data is in migration scope.
  - file: agreements.*
    required: conditional
    condition: Agreements or special price rules are in migration scope.
  - file: diagnostic_services.*
    required: conditional
    condition: Catalog data is in migration scope.
  - file: tests.*
    required: conditional
    condition: Test catalog data is in migration scope.
  - file: panels.*
    required: conditional
    condition: Panel catalog data is in migration scope.
  - file: analytes.*
    required: conditional
    condition: Analyte data is in migration scope.
  - file: reference_ranges.*
    required: conditional
    condition: Reference ranges are in migration scope.
  - file: price_lists.*
    required: conditional
    condition: Prices are in migration scope.
  - file: orders.*
    required: conditional
    condition: Historical or open orders are in migration scope.
  - file: samples.*
    required: conditional
    condition: Sample history or open samples are in migration scope.
  - file: results.*
    required: conditional
    condition: Result history is in migration scope.
  - file: documents.*
    required: optional
    purpose: References to PDFs, images or external document files when available.

manifest_required_fields:
  - source_system_name
  - source_system_version
  - exporting_organization
  - export_datetime
  - export_timezone
  - exported_by
  - contact_email
  - files
  - entity_counts
  - checksum_algorithm
  - checksums
  - declared_encoding
  - declared_delimiter_when_csv

minimum_entity_groups:
  - id: organization
    entities:
      - laboratories
      - branches
      - departments
      - employees
  - id: people
    entities:
      - persons
      - patients
      - doctors
      - companies
      - agreements
  - id: diagnostic_catalog
    entities:
      - services
      - tests
      - panels
      - analytes
      - samples
      - containers
      - reference_ranges
      - preparations
      - price_lists
  - id: operations
    entities:
      - appointments
      - orders
      - order_items
      - samples
      - results
      - result_values
      - result_reports
  - id: revenue
    entities:
      - sales
      - payments
      - billing_requests
      - invoices_when_available
  - id: documents
    entities:
      - result_pdfs
      - attachments
      - document_index

ingestion_process:
  - step: receive_package
    description: Receive files through a controlled upload or secure transfer process.
  - step: verify_manifest
    description: Validate declared files, row counts, encoding, checksums and required metadata.
  - step: profile_data
    description: Detect columns, data types, null rates, duplicates and reference consistency.
  - step: map_to_canonical_model
    description: Map source fields to HOP canonical entities through an anti-corruption mapping.
  - step: dry_run_validation
    description: Validate without mutation and produce row-level errors, warnings and reconciliation totals.
  - step: business_approval
    description: Require customer approval of validation reports before mutation.
  - step: execute_import
    description: Import through domain commands only.
  - step: reconcile
    description: Produce imported, rejected, skipped and warning counts by entity and file.
  - step: audit_and_archive
    description: Store import evidence, manifest, checksums and reports for audit.

validation_categories:
  - structural_validation
  - required_field_validation
  - data_type_validation
  - referential_integrity_validation
  - duplicate_detection
  - business_rule_validation
  - privacy_and_consent_validation
  - catalog_consistency_validation
  - financial_reconciliation_validation
  - clinical_result_integrity_validation

provider_request_policy:
  minimum_request: Export the in-scope data in CSV, XLSX, JSON or NDJSON with a manifest and stable identifiers.
  unacceptable_excuses:
    - Data can only be exported through screenshots.
    - Data requires proprietary viewers without structured export.
    - Field meanings cannot be documented.
    - Row counts or checksums cannot be provided.
    - Patient, catalog, order or result identifiers cannot be included.
  acceptable_constraints:
    - Some historical fields may be unavailable if documented in the manifest.
    - Proprietary codes may be delivered when accompanied by a code dictionary.
    - Large exports may be split into multiple files when declared in the manifest.

required_outputs:
  - migration_profile_report
  - field_mapping_report
  - dry_run_validation_report
  - reconciliation_report
  - import_audit_record
  - rejected_rows_file
  - warning_rows_file
  - customer_approval_record
