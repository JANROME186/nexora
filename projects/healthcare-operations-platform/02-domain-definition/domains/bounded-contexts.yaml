id: DOMAIN-BOUNDED-CONTEXT-CATALOG-001
type: bounded-context-catalog
owner: Domain Architecture
status: approved
version: 0.34.0
source_of_truth: 02-domain-definition/domains/bounded-contexts.yaml
contexts:
- id: BC-CLINICAL
  name: Clinical Operations
  domain_type: core
  owner: Clinical Domain Team
  purpose: Gestionar el ciclo clínico diagnóstico desde paciente, orden, muestra,
    resultado e imagenología.
  capabilities:
  - CAP-001
  - CAP-006
  - CAP-007
  - CAP-011
  aggregates:
  - Patient
  - DiagnosticOrder
  - Sample
  - LaboratoryResult
  - ImagingStudy
  - DiagnosticReport
  published_language:
  - PatientRegistered
  - DiagnosticOrderCreated
  - SampleCollected
  - ResultValidated
  - ReportReleased
- id: BC-ORGANIZATION
  name: Organization & Tenant Management
  domain_type: core
  owner: Identity Domain Team
  purpose: Gestionar laboratorios, sucursales, organigramas, empleados y configuración
    tenant.
  capabilities:
  - CAP-002
  aggregates:
  - Laboratory
  - Branch
  - Department
  - Position
  - Employee
  published_language:
  - LaboratoryCreated
  - BranchActivated
  - EmployeeAssignedToBranch
- id: BC-IAM
  name: Identity & Access Management
  domain_type: supporting
  owner: Security Domain Team
  purpose: Gestionar usuarios, roles, permisos, sesiones, autenticación y autorización.
  capabilities:
  - CAP-003
  aggregates:
  - UserAccount
  - Role
  - PermissionSet
  - AccessPolicy
  - Session
  published_language:
