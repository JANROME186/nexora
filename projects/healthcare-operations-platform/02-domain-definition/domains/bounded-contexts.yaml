  - SaleCancelled
  - CashClosingApproved
  - InvoiceIssued
- id: BC-SUPPLY
  name: Supply & Inventory
  domain_type: supporting
  owner: Operations Domain Team
  purpose: Gestionar proveedores, inventario, lotes, compras, recepciones, consumos
