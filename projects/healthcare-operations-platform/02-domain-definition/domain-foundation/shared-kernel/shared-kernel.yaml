artifact:
  id: SHK-001
  type: shared-kernel
  name: Nexora Shared Kernel
  version: 1.0.0
  status: approved
  owner: Architecture Domain Team
  source_of_truth: 02-domain-definition/domain-foundation/shared-kernel/shared-kernel.yaml
  generated_artifacts:
  - 04-generated/markdown/domain/shared-kernel.md
  dependencies:
  - CTX-MAP-001
purpose: Define stable, minimal and reusable concepts shared by multiple bounded contexts.
principles:
- The Shared Kernel must remain small.
- Only stable concepts used by three or more bounded contexts may be promoted.
- Business behavior belongs to bounded contexts, not the Shared Kernel.
- Shared concepts must be versioned and backward compatible.
- Any change requires architecture review.
identifiers:
- id: VO-ID-001
  name: TenantId
  type: uuid
  description: Identifies a SaaS tenant.
- id: VO-ID-002
  name: LaboratoryId
  type: uuid
  description: Identifies a laboratory business unit.
- id: VO-ID-003
  name: BranchId
  type: uuid
  description: Identifies a branch or diagnostic center.
- id: VO-ID-004
  name: UserId
  type: uuid
  description: Identifies a platform user.
- id: VO-ID-005
  name: PatientId
  type: uuid
  description: Identifies a patient aggregate.
- id: VO-ID-006
  name: DoctorId
  type: uuid
  description: Identifies a physician or referring doctor.
- id: VO-ID-007
  name: OrderId
  type: uuid
  description: Identifies a diagnostic order.
- id: VO-ID-008
  name: SampleId
  type: uuid
  description: Identifies a collected sample.
- id: VO-ID-009
  name: ResultId
  type: uuid
  description: Identifies a result aggregate.
- id: VO-ID-010
  name: InvoiceId
  type: uuid
  description: Identifies a billing document.
value_objects:
- id: VO-001
  name: Money
  fields:
  - name: amount
    type: decimal
    required: true
  - name: currency
    type: ISO-4217
    required: true
  rules:
  - Amount must be represented without floating point precision loss.
  - Currency must be explicit.
- id: VO-002
  name: PersonName
  fields:
  - name: givenName
    type: string
    required: true
  - name: middleName
    type: string
    required: false
  - name: familyName
    type: string
    required: true
  - name: secondFamilyName
    type: string
    required: false
  rules:
  - Do not concatenate names for storage.
  - Display format is locale-dependent.
- id: VO-003
  name: EmailAddress
  fields:
  - name: value
    type: email
    required: true
  rules:
  - Email must be normalized for comparison.
- id: VO-004
  name: PhoneNumber
  fields:
  - name: countryCode
    type: string
    required: true
  - name: nationalNumber
    type: string
    required: true
  - name: extension
    type: string
    required: false
  rules:
  - Phone format validation must be country-aware.
- id: VO-005
  name: Address
  fields:
  - name: country
    type: ISO-3166-1
    required: true
  - name: state
    type: string
    required: false
  - name: city
    type: string
    required: false
  - name: municipality
    type: string
    required: false
  - name: postalCode
    type: string
    required: false
  - name: street
    type: string
    required: false
  - name: externalNumber
    type: string
    required: false
  - name: internalNumber
    type: string
    required: false
  rules:
  - Address validation must be country-pack aware.
- id: VO-006
  name: DateRange
  fields:
  - name: startDate
    type: date
    required: true
  - name: endDate
    type: date
    required: false
  rules:
  - End date must be greater than or equal to start date when present.
- id: VO-007
  name: AuditMetadata
  fields:
  - name: createdAt
    type: datetime
    required: true
  - name: createdBy
    type: UserId
    required: true
  - name: updatedAt
    type: datetime
    required: false
  - name: updatedBy
    type: UserId
    required: false
  - name: version
    type: integer
    required: true
  rules:
  - Audit metadata must be immutable for historical events.
- id: VO-008
  name: Locale
  fields:
  - name: language
    type: ISO-639-1
    required: true
  - name: country
    type: ISO-3166-1
    required: false
  rules:
  - Default locale must be configurable per tenant.
- id: VO-009
  name: TimeZone
  fields:
  - name: value
    type: IANA-time-zone
    required: true
  rules:
  - All persisted instants must be stored in UTC with display conversion.
- id: VO-010
  name: ExternalReference
  fields:
  - name: sourceSystem
    type: string
    required: true
  - name: externalId
    type: string
    required: true
  - name: sourceType
    type: string
    required: false
  rules:
  - External references are required for migration reconciliation and integration
    traceability.
not_allowed:
- Clinical validation rules
- Pricing rules
- Billing fiscal behavior
- Result interpretation behavior
- Workflow orchestration logic
- AI provider logic
- Persistence implementation details
