artifact:
  id: NXF-EXEC-001
  type: framework-execution-sequence
  name: Nexora Framework Execution Sequence
  version: 1.0.0
  status: approved
  human_readable: FRAMEWORK_EXECUTION_SEQUENCE.md
  machine_readable: FRAMEWORK_EXECUTION_SEQUENCE.yaml
  owner: Nexora Engineering

purpose: Define the logical loading and execution order of the Nexora Framework.

sequence:
  - step: "00"
    folder: 00-start-here
    responsibility: Load vision, strategic handoff and execution sequence.
    primary_files:
      - 00-start-here/FRAMEWORK_EXECUTION_SEQUENCE.yaml
      - 00-start-here/docs/vision/NEXORA_FINAL_VISION.yaml
      - 00-start-here/docs/vision/NEXORA_STRATEGIC_HANDOFF.yaml
  - step: "01"
    folder: 01-enterprise
    responsibility: Load Nexora company context and enterprise identity.
  - step: "02"
    folder: 02-standards
    responsibility: Load project folder, documentation, agent-agnostic, MDPE, capability package, ingestion, marketplace, business requirement versioning, open-source security quality, client stack market validation and technology debt standards.
    primary_files:
      - 02-standards/standards/project-folder-standard.yaml
      - 02-standards/standards/documentation-standard.yaml
      - 02-standards/standards/agent-agnostic-standard.yaml
      - 02-standards/standards/model-driven-product-engineering-standard.yaml
      - 02-standards/standards/capability-package-standard.yaml
      - 02-standards/standards/open-data-ingestion-standard.yaml
      - 02-standards/standards/product-marketplace-standard.yaml
      - 02-standards/standards/business-requirement-versioning-standard.yaml
      - 02-standards/standards/open-source-first-security-quality-standard.yaml
  - step: "03"
    folder: 03-orchestration
    responsibility: Decide whether a target project needs analysis, validation or development.
    primary_files:
      - 03-orchestration/project-orchestration/project-analysis-and-mvp-workflow.yaml
  - step: "04"
    folder: 04-recipes
    responsibility: Apply the Agent-to-MVP recipe when project definitions are incomplete.
    primary_files:
      - 04-recipes/recipes/agent-to-mvp-recipe.yaml
  - step: "05"
    folder: 05-prompts
    responsibility: Provide generic and auxiliary prompts for analysis, validation and development.
    primary_files:
      - 05-prompts/prompts/generic-project-lifecycle-prompts.yaml
      - 05-prompts/prompts/auxiliary-development-prompts.yaml
      - 05-prompts/prompts/business-requirement-impact-prompts.yaml
      - 05-prompts/prompts/security-quality-gate-prompts.yaml
  - step: "06"
    folder: 06-templates
    responsibility: Provide templates for creating or completing project artifacts.
    primary_files:
      - 06-templates/templates/project-template/
  - step: "07"
    folder: 07-governance
    responsibility: Provide ADRs, RFCs, roadmap and release governance.
  - step: "08"
    folder: 08-engineering
    responsibility: Provide engineering playbooks, agent roles, security, AI and DevOps guidance.
  - step: "09"
    folder: 09-specifications
    responsibility: Provide schemas, meta-models and specification assets.
  - step: "10"
    folder: 10-examples
    responsibility: Provide examples for reference only.

development_gate:
  required:
    - Target project BUSINESS_REQUIREMENT.md exists.
    - Target project PROJECT_STATE.yaml exists.
    - development_readiness.status is ready.
    - development_readiness.blocking_definition_gaps is empty.
    - Target module package exists.
    - Target module package required artifacts exist.
    - Open-source-first and security quality gates are defined for code-changing work.
    - Requester-proposed or existing stack has been validated against current stable or LTS open source market practice.
    - Stack-specific quality toolchain baseline is defined.
    - Technology evolution reviews and technical-debt backlog handling are defined for iterative work.

current_first_product:
  project: projects/healthcare-operations-platform/
  module: MVP-MOD-001
  module_name: Platform Foundation
