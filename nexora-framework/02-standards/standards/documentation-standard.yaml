artifact:
  id: NXF-STD-002
  type: documentation-standard
  name: Nexora Documentation Standard
  version: 1.0.0
  status: approved
  owner: Nexora Engineering

artifact_rules:
  dual_format:
    required: true
    machine_readable: yaml
    human_readable: markdown
  source_first:
    - YAML source artifacts are authoritative when automation is expected.
    - Markdown explains intent, tradeoffs and usage.
    - Generated artifacts must reference their source.
  agent_execution:
    - Agents must prefer YAML files when both YAML and Markdown versions exist.
    - Markdown files remain the human-readable companion for understanding, review and explanation.
    - BUSINESS_REQUIREMENT.md is requester-supplied; any BUSINESS_REQUIREMENT.yaml is a structured index derived from the requester input, not a replacement.
    - Agents must verify BUSINESS_REQUIREMENT.yaml is derived from the latest resolved BUSINESS_REQUIREMENT.md version.
  traceability:
    required_links:
      - project_brief
      - capability
      - actor
      - process
      - business_rule
      - contract
      - test

minimum_artifacts_to_reach_mvp_development:
  - business_requirement
  - project_brief
  - source_of_truth
  - project_state
  - capability_map
  - dependency_map
  - actor_catalog
  - reference_processes
  - business_rules_catalog
  - mvp_framework
  - first_business_capability_package_or_roadmap_group_package

agent_context_rules:
  - Agents load root Nexora framework first.
  - Agents scan projects/ using nexora-framework/03-orchestration/project-orchestration/project-analysis-and-mvp-workflow.yaml before implementation.
  - Agents load the target project SOURCE_OF_TRUTH second.
  - Agents resolve the latest business requirement version before consuming derived YAML or generated artifacts.
  - Agents must not infer requirements from chat if PROJECT_BRIEF is missing.
  - Agents must follow nexora-framework/02-standards/standards/agent-agnostic-standard.yaml.
  - Agents must update project state after meaningful iterations.
  - Agents must preserve project boundaries.
