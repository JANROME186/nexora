artifact:
  id: NXF-MDPE-STD-001
  type: framework-standard
  name: Model Driven Product Engineering Standard
  version: 1.0.0
  status: approved
  human_readable: model-driven-product-engineering-standard.md
  machine_readable: model-driven-product-engineering-standard.yaml
  owner: Nexora Engineering

purpose: Define Nexora as a Model Driven Product Engineering framework where editable models are the source of truth and platform artifacts are generated or derived from those models.

architecture:
  name: Nexora MDPE Architecture
  layers:
    - id: nexora_definition
      name: Nexora Definition
      responsibility: Contains editable product knowledge and business models.
      edit_policy: manually_editable
    - id: nexora_platform
      name: Nexora Platform
      responsibility: Contains generated, compiled, implemented or runtime product artifacts.
      edit_policy: generated_or_implementation_derived

source_of_truth_rule:
  statement: Models are the only durable editable source of truth.
  implications:
    - Business knowledge must be captured in versioned model artifacts.
    - Generated or repetitive implementation artifacts must not become the source of truth.
    - Platform code may contain custom rule implementations when explicitly marked as non-generatable.
    - Manual changes to generated artifacts are prohibited unless the artifact is promoted into a model.

nexora_definition_editable_models:
  - id: business_model
    name: Business Model
    examples:
      - Patient has many Orders.
      - Order has many Services.
      - Service has many Tests.
  - id: healthcare_operating_model
    name: Healthcare Operating Model
  - id: business_capability_map
    name: Business Capability Map
  - id: capability_packages
    name: Business Capability Packages
  - id: canonical_business_vocabulary
    name: Canonical Business Vocabulary
  - id: business_rules
    name: Business Rules
  - id: canonical_data_model
    name: Canonical Data Model
  - id: domain_driven_design
    name: DDD Model
  - id: openapi_sources
    name: OpenAPI Sources
  - id: ui_model
    name: UI Model
  - id: mobile_model
    name: Mobile Model
  - id: ai_model
    name: AI Model
  - id: deployment_model
    name: Deployment Model
  - id: observability_model
    name: Observability Model
  - id: test_model
    name: Test Model

nexora_platform_generated_or_derived_outputs:
  - backend
  - frontend
  - flutter_mobile
  - docker
  - terraform
  - tests
  - ci_cd
  - observability_assets
  - sdks
  - swagger_documentation
  - repetitive_documentation

manual_authoring_policy:
  do_not_write_manually:
    - CRUD scaffolding
    - DTOs
    - Controllers
    - Repositories
    - Swagger documentation
    - SDKs
    - Repetitive documentation
    - Duplicate models
    - Repetitive test cases
  write_manually:
    - Business models
    - Business rules
    - Business processes
    - Domain decisions
    - OpenAPI source contracts
    - Non-generatable custom rule implementation
    - Compiler templates and generators
    - Architecture decisions

mdpe_execution_flow:
  - step: model
    responsibility: Capture business capability knowledge, rules, processes, events, contracts and models.
  - step: compile
    responsibility: Generate repetitive platform artifacts from the model.
  - step: implement_rules
    responsibility: Implement only non-generatable business logic, integrations or policies.
  - step: validate
    responsibility: Validate generated and custom artifacts against source models.
  - step: release
    responsibility: Version the capability package and generated platform outputs.

capability_development_rule:
  statement: Nexora develops Business Capabilities, not standalone modules.
  implications:
    - Modules may group capabilities for roadmap planning, but capabilities are the primary development unit.
    - Each capability must be represented as a Capability Package.
    - A capability package must be independently versionable and traceable.
    - A capability package must include all models needed to generate or implement its platform outputs.

generation_boundary:
  generated_by_model:
    - CRUD behavior
    - DTOs
    - API controllers
    - Repository interfaces and baseline persistence adapters
    - SDKs
    - Swagger/OpenAPI rendered documentation
    - Repetitive tests
    - Repetitive human documentation
  implemented_by_engineer_or_specialized_agent:
    - Business rule edge cases
    - Non-trivial domain policies
    - External adapter behavior
    - Legacy migration mappings with ambiguous semantics
    - Performance-sensitive custom behavior
    - Security-sensitive custom controls

validation_rules:
  - Every platform artifact must trace back to a source model or explicit custom implementation decision.
  - Every capability package must declare generated outputs and custom implementation points.
  - Generated artifacts must include provenance metadata that identifies their source model.
  - Source registries must classify artifacts as editable_model, generated_output or custom_implementation.
  - Backlogs must prioritize modeling, compilation and rule implementation over manual CRUD tasks.
