artifact:
  id: NXF-EPF-001
  type: framework-standard
  name: Enterprise Product Foundation Standard
  version: 1.0.0
  status: approved
  human_readable: enterprise-product-foundation-standard.md
  machine_readable: enterprise-product-foundation-standard.yaml
  owner: Nexora Engineering

purpose: >
  Define the mandatory enterprise product foundations that every Nexora solution
  must establish before continuing commercial product development: localization,
  IAM-protected navigation and actions, session management, database baseline,
  UX/UI system, code documentation, persistence architecture, contract-first
  generation and controlled technical-debt burn-down.

scope:
  applies_to:
    - new_project_analysis
    - mvp_definition
    - backlog_implementation
    - module_closeout
    - release_readiness
    - commercial_general_availability
  product_layers:
    - backend
    - frontend_web
    - mobile_app
    - patient_portal
    - doctor_portal
    - employee_portal
    - database
    - api_contracts
    - design_system
    - iam

mandatory_foundations:
  localization_and_i18n:
    rule: >
      All user-visible labels, validation text, status labels, empty states,
      error prose, notification templates and application copy that do not come
      from the database must be resolved through stack-appropriate localization
      resources. Application code must not be tied to a single display language.
    required_base_locales:
      - es-MX
      - en-US
    default_locale: es-MX
    fallback_locale: en-US
    configuration_required:
      - tenant_default_locale
      - user_selected_locale
      - fallback_locale
    backend_required_patterns:
      - stable_error_codes_with_parameters
      - message_resource_bundles_or_equivalent_catalogs
      - notification_template_catalogs
      - tests_assert_codes_not_prose
    frontend_required_patterns:
      - locale_message_catalogs
      - no_hard_coded_visible_text_in_components
      - route_and_permission_constants
      - typed_message_keys_when_supported
    mobile_required_patterns:
      - platform_or_framework_localization_resources
      - no_hard_coded_visible_text_in_screens
      - shared_error_code_mapping
    closure_gate: >
      New or changed UI/app/backend visible text cannot close unless it is
      externalized in both es-MX and en-US or registered as blocking remediation
      in the active foundation backlog.

  iam_permission_model:
    rule: >
      Every feature, screen, menu item, API command, query, export, import,
      administrative action and sensitive workflow must map to a named permission.
      Menus and available actions must be generated dynamically from the logged-in
      user's roles, permissions, tenant, branch and feature entitlements.
    required_models:
      - permissions_catalog
      - role_permission_assignment
      - user_role_assignment
      - feature_to_permission_matrix
      - menu_to_permission_matrix
      - action_to_permission_matrix
      - entitlement_to_feature_matrix_when_marketplace_or_packages_apply
    required_runtime_behavior:
      - deny_by_default
      - least_privilege
      - server_side_authorization_for_every_protected_command_or_query
      - frontend_and_mobile_hide_or_disable_unauthorized_navigation_and_actions
      - audit_authorization_sensitive_decisions
    closure_gate: >
      A new feature cannot close without permission definitions, backend
      enforcement, UI/app menu/action filtering and tests for allowed and denied
      access paths.

  login_and_session_management:
    rule: >
      Authentication, logout, session expiration, token refresh or renewal,
      tenant context selection and permission loading must be implemented early
      enough that every protected feature can be validated under a realistic
      security context.
    required_capabilities:
      - login
      - logout
      - session_expiration
      - authenticated_user_context
      - tenant_and_branch_context
      - role_permission_loading
      - unauthorized_and_forbidden_error_handling
      - secure_storage_for_client_tokens_or_session_references
    closure_gate: >
      Role-based menus and protected workflows cannot close with a static,
      hard-coded or anonymous user context except in tests or documented local
      development fixtures.

  database_product_baseline:
    rule: >
      Database implementation is a product deliverable independent from runtime
      infrastructure. It must include normalized schemas, migrations, seed data,
      data dictionary, country/language/currency support and repeatable
      initialization scripts.
    required_outputs:
      - database_architecture.yaml
      - database_architecture.md
      - data_dictionary.yaml
      - data_dictionary.md
      - normalization_report.yaml
      - normalization_report.md
      - migration_strategy.yaml
      - migration_strategy.md
      - seed_data_catalog.yaml
      - seed_data_catalog.md
      - initialization_runbook.yaml
      - initialization_runbook.md
    minimum_database_requirements:
      - third_normal_form_or_documented_denormalization_with_reason
      - referential_integrity
      - audit_columns_or_audit_events_for_mutating_business_tables
      - tenant_partitioning_or_tenant_scoping_model
      - country_catalog_with_mexico_and_united_states
      - locale_catalog_with_es_MX_and_en_US
      - currency_catalog_with_MXN_and_USD
      - translatable_catalog_tables_for_business_catalogs
      - seed_data_for_initial_diagnostic_services_tests_and_studies_when_business_allows
    closure_gate: >
      Backend persistence work cannot close with only test scripts when product
      schemas, migrations, dictionary and initialization artifacts are missing.

  ux_ui_design_system:
    rule: >
      Web and app development must follow a documented UX/UI baseline, look and
      feel, component system and responsive behavior before screens accumulate as
      disconnected functional forms.
    required_outputs:
      - ux_ui_principles.yaml
      - ux_ui_principles.md
      - design_tokens.yaml
      - design_tokens.md
      - component_inventory.yaml
      - component_inventory.md
      - web_layout_system.yaml
      - web_layout_system.md
      - mobile_layout_system.yaml
      - mobile_layout_system.md
      - accessibility_baseline.yaml
      - accessibility_baseline.md
    closure_gate: >
      New screens cannot close unless they use the approved component system,
      design tokens, responsive layout rules and accessibility checks.

  code_documentation:
    rule: >
      Public APIs, domain services, aggregates, ports, adapters, security
      policies, generated extension points and non-obvious custom rules must be
      documented in code using the stack's standard documentation mechanism.
    java_expectations:
      - Javadoc on public classes and methods that form domain, application, adapter, controller, port or generated extension-point contracts.
      - Package-level documentation for bounded contexts and modules when useful.
      - Comments explain business intent or non-obvious tradeoffs, not trivial code.
    frontend_mobile_expectations:
      - Document exported public hooks, service clients, shared components, permission guards and non-obvious business mapping helpers.
      - Avoid excessive comments inside simple components.
    closure_gate: >
      Code-changing work touching public or shared contracts cannot close without
      stack-appropriate documentation or an explicit documented reason.

  persistence_architecture:
    rule: >
      Backend persistence must stay decoupled from business logic. Prefer ORM,
      repository ports and generated mappings where appropriate; raw SQL must be
      isolated in infrastructure adapters, named queries, migration scripts or
      documented performance-sensitive paths.
    java_required_review:
      - Evaluate JPA and Hibernate or another open source ORM/persistence mapping approach against the project architecture.
      - Do not place ad hoc SQL in domain or application services.
      - Keep repositories behind ports.
      - Use migrations for schema evolution.
      - Document accepted raw SQL use for complex queries, projections or performance-sensitive read models.
    closure_gate: >
      A backend backlog item cannot introduce new persistence coupling or
      unreviewed ad hoc SQL outside the persistence adapter boundary.

  contract_first_generation:
    rule: >
      Public and internal APIs must be OpenAPI-first or contract-first where
      applicable. Generated server/client artifacts must come from canonical
      contracts or capability-package models instead of duplicated manual DTO,
      controller, SDK or Swagger work.
    required_practices:
      - OpenAPI source contracts for REST APIs.
      - Contract validation in CI/local gates.
      - Generated clients for frontend/mobile where practical.
      - Generated DTOs/controllers/repositories only when the generator is the approved source path.
      - Manual custom logic only at explicit extension points.
      - Evaluate Lombok, MapStruct, OpenAPI Generator, SpringDoc and similar open source tools for Java stacks when they reduce boilerplate without hiding domain intent.
    closure_gate: >
      New API work cannot close without source contracts and without documenting
      whether generation was used, deferred or not applicable.

  stack_market_review:
    rule: >
      Agents must actively review the current backend, frontend, app, API and
      database stack against current stable open source practice during each
      code-changing backlog item. Missing obvious stack enablers must become
      backlog work or accepted technical debt with owner and target iteration.
    review_topics:
      - current_stable_or_lts_versions
      - open_source_alternatives
      - generation_tooling
      - orm_or_persistence_mapping
      - localization_tooling
      - iam_security_libraries
      - design_system_frameworks
      - test_and_quality_tooling
      - maintainability_and_hiring_risk

technical_debt_control:
  rule: >
    Technical debt must be actively burned down, not merely recorded. A code
    changing iteration cannot proceed to feature work before selecting and
    resolving or materially reducing debt relevant to the touched components.
  intensity_by_stage:
    early_mvp:
      minimum_relevant_items_per_iteration: 1
    operational_core_after_midpoint:
      minimum_relevant_items_per_iteration: 2
    commercial_beta_preparation:
      minimum_relevant_items_per_iteration: 3
    release_or_ga:
      required_open_debt: 0
  coverage_improvement_policy:
    target_line_coverage_percent: 80
    below_target_minimum_improvement_per_iteration_percentage_points: 3
    below_target_preferred_improvement_per_iteration_percentage_points: 5
    previous_iteration_coverage_is_hard_floor: true
    exception_rule: >
      If the changed slice cannot reasonably improve the stack by at least 3
      percentage points, the agent must document why, add the maximum meaningful
      tests in scope, preserve the previous baseline, and create or update an
      immediate coverage debt item assigned to the next relevant backlog. A
      symbolic 0.01 percentage point increase is not sufficient evidence of
      intentional quality improvement when the stack remains below 80 percent.

validation_and_evidence:
  required_for_enterprise_alignment_backlog:
    - repository_inventory_for_i18n_hardcoded_text
    - permissions_and_menu_inventory
    - auth_session_gap_analysis
    - database_schema_and_seed_inventory
    - data_dictionary_and_normalization_review
    - ux_ui_design_system_gap_analysis
    - code_documentation_inventory
    - persistence_architecture_review
    - openapi_generation_stack_review
    - technical_debt_burn_down_plan
    - coverage_gap_plan_with_3_to_5_point_targets_when_below_80
    - implementation_backlog_or_direct_fixes_for_blocking_gaps
  final_decision_states:
    - passed
    - failed
    - blocked_by_missing_foundation

agent_rules:
  - Load this standard before selecting or executing a code-changing backlog item.
  - Stop functional development when enterprise foundation gaps affect security, localization, database readiness, login/session, contract-first APIs or product-wide UX/UI consistency.
  - Keep foundation work agent agnostic and open-source first.
  - Prefer model-driven and contract-first corrections over scattered manual patches.
  - Record any framework learning as framework feedback for Nexora ownership.
