quality_gates:
  backlog_item_gate:
    required_for_every_code_backlog:
      - technical_debt_first_action
      - client_stack_market_validation_when_stack_or_dependencies_are_relevant
      - unit_tests
      - relevant_integration_or_contract_tests
      - dependency_vulnerability_scan
      - secrets_scan
      - sast_or_static_analysis_for_changed_stack
      - best_practices_and_standards_scan_for_changed_stack
      - duplicate_code_scan_for_changed_stack
      - complexity_scan_for_changed_stack
      - owasp_or_secure_code_scan_for_changed_stack
      - coverage_report_for_changed_stack
      - message_externalization_and_magic_string_review
      - technology_evolution_review
      - technical_debt_backlog_update_when_findings_exist
      - qa_evidence_yaml
      - qa_evidence_md_when_human_review_is_needed
    fail_conditions:
      - new_or_unresolved_vulnerability_of_any_severity_without_accepted_risk_and_immediate_remediation_plan
      - secret_detected
      - sast_or_secure_code_finding_without_disposition
      - tests_failing
      - coverage_decreases_below_previous_iteration_baseline
      - missing_duplicate_code_or_complexity_analysis_for_changed_stack
      - new_user_visible_text_error_message_or_magic_string_not_externalized_or_dispositioned
      - no_existing_technical_debt_item_resolved_or_materially_reduced_when_open_debt_exists
      - generated_artifacts_modified_without_source_model_change
      - proprietary_dependency_without_exception_adr
  module_closeout_gate:
    required:
      - stack_baseline_reviewed_against_current_market_and_official_versions
      - all_backlog_item_gates_passed
      - aggregate_coverage_report
      - dependency_and_container_scan_when_applicable
      - dast_baseline_when_web_api_or_ui_is_runnable
      - openapi_contract_validation_when_api_changed
      - threat_model_or_security_notes_for_security_sensitive_module
      - accepted_risk_register_updated
      - technical_debt_burndown_plan_updated
      - coverage_not_below_previous_iteration_baseline
  release_gate:
    required:
      - client_or_project_stack_validated_against_current_stable_versions
      - sast_passed
      - dast_passed_or_not_applicable_with_reason
      - dependency_scan_passed
      - container_scan_passed_when_containers_exist
      - sbom_generated
      - coverage_threshold_met
      - known_vulnerabilities_reviewed
      - license_review_passed
      - technology_debt_register_reviewed
      - no_open_technical_debt
      - security_quality_evidence_registered
    fail_conditions:
      - open_technical_debt_exists
      - aggregate_line_coverage_below_80_percent
      - any_stack_coverage_below_previous_iteration_baseline

technical_debt_backlog_policy:
  root_folder: 08-qa/technical-debt/
  index_file: 08-qa/technical-debt/technical-debt-index.yaml
  human_readable_index: 08-qa/technical-debt/README.md
  item_path_pattern: 08-qa/technical-debt/<debt-id>.yaml
  debt_id_pattern: TD-<component-or-area>-<sequence>
  required_when:
    - technology_review_finds_non_blocking_migration_or_upgrade
    - dependency_or_framework_is_outdated_but_not_immediate_blocker
    - security_or_quality_tooling_gap_needs_gradual_remediation
    - stack_migration_is_recommended_but_must_be_coordinated_with_touched_components
    - coverage_below_80_percent_or_below_stack_target
    - coverage_does_not_improve_when_below_80_percent
  debt_item_must_include:
    - id
    - title
    - source_backlog_item
    - detection_date
    - affected_components
    - current_state
    - recommended_target_state
    - reason
    - risk_level
    - urgency
    - estimated_effort
    - estimated_cost_impact
    - migration_strategy
    - incremental_remediation_triggers
    - dependencies_or_prerequisites
    - acceptance_criteria
    - owner_or_responsible_role
    - status
  statuses:
    - proposed
    - accepted
    - in_progress
    - partially_resolved
    - resolved
    - rejected_with_reason
  remediation_rules:
    - Do not rewrite stable components solely to chase novelty.
    - Prefer opportunistic remediation when the affected component is already being modified.
    - Break broad migrations into small backlog items with explicit test and rollback strategy.
    - Security-critical or unsupported runtime findings may be promoted to blocking backlog items.
    - Every resolved debt item must reference validation evidence and the backlog item that resolved it.
    - A project must not be marked finished, commercially complete or generally available while any technical-debt item remains open, accepted, in_progress or partially_resolved.
    - Every code-changing iteration must reduce at least one open technical-debt item before feature work when debt exists.
    - Debt remediation intensity must increase as the project advances: early MVP iterations may reduce one item, module closeout should reduce multiple relevant items when debt exists, and release/GA preparation must burn down all remaining debt.
    - Technical debt may be deferred only with an owner, target backlog, acceptance criteria and expiration; deferral does not permit final project closure.

default_thresholds:
  vulnerability_policy:
    critical: fail
    high: fail
    medium: fail_unless_fixed_or_immediate_accepted_risk_with_target_backlog
    low: fail_unless_fixed_or_immediate_accepted_risk_with_target_backlog
    informational: review_and_disposition_required
    unknown: fail_until_triaged
  sast_policy:
    critical: fail
    high: fail
    medium: fail_unless_dispositioned_by_module_risk
    low: review_and_disposition_required
  coverage_policy:
    minimum_line_coverage_target: 80
    mvp_minimum_line_coverage_target: 80
    commercial_ga_line_coverage_target: 80
    branch_coverage_target: project_defined
    changed_code_must_not_reduce_existing_coverage: true
    previous_iteration_coverage_is_hard_floor: true
    below_80_requires_improvement_each_iteration: true
    below_80_minimum_improvement_per_relevant_iteration_percentage_points: 3
    below_80_preferred_improvement_per_relevant_iteration_percentage_points: 5
    final_project_closure_requires_minimum_line_coverage: 80
    coverage_exception_allowed_for_iteration: true
    coverage_exception_allowed_for_final_project_closure: false
    rule: >
      Coverage below 80% does not automatically block an intermediate backlog item when debt is
      recorded and the previous iteration baseline is preserved or improved. Coverage must never
      decrease below the previous iteration baseline. Final project closure, release readiness and
      commercial GA require at least 80% line coverage for each applicable delivered stack, unless
      a stack is explicitly not applicable. When a relevant changed stack remains below 80%, the
      iteration must target a 3 to 5 percentage point line-coverage improvement. A smaller
      improvement requires explicit justification, maximum meaningful in-scope tests and an
      immediate coverage debt item assigned to the next relevant backlog; a symbolic 0.01 point
      increase is not sufficient quality progress by itself.
  license_policy:
    restricted_license_requires_review: true
    proprietary_dependency_requires_exception_adr: true

evidence_requirements:
  root_folder: 08-qa/security-quality/
  per_backlog_path_pattern: 08-qa/security-quality/<backlog-item-id>/
  required_files:
    - security-quality-evidence.yaml
    - security-quality-evidence.md
  evidence_yaml_must_include:
    - backlog_item_id
    - module_id
    - changed_components
    - open_source_first_assessment
    - client_stack_market_validation_when_applicable
    - stack_toolchain_baseline
    - technical_debt_first_action
    - tools_run
    - commands_or_equivalent_steps
    - results
    - coverage_summary
    - dependency_vulnerability_summary
    - sast_summary
    - dast_summary_when_applicable
    - secrets_scan_summary
    - duplicate_code_summary
    - complexity_summary
    - owasp_or_secure_code_summary
    - message_externalization_summary
    - license_summary
    - technology_evolution_review
    - technical_debt_items_created_or_updated
    - accepted_risks
    - blocking_findings
    - decision

agent_rules:
  - Agents must prefer open source libraries, frameworks, tools and standards unless the requester explicitly requires otherwise or an ADR approves an exception.
  - Agents must not introduce proprietary runtimes, hosted services, paid-only SDKs or closed-source dependencies as mandatory product dependencies without an exception ADR.
  - Agents must add or update quality-gate evidence for every backlog item that changes code, dependencies, runtime configuration, APIs or deployment assets.
  - Agents must validate requester-proposed stacks against current stable or LTS versions, official lifecycle information, security advisories, ecosystem health and required quality gates before accepting them as the implementation baseline.
  - Agents must define a stack-specific open source quality toolchain during architecture analysis and revisit it during backlog work, module closeout and release readiness.
  - Agents must run the security and quality gates that are applicable to the changed stack. If a mandatory executable gate cannot run because a tool, runtime, native binary, network endpoint or service is unavailable, the backlog item must remain blocked_by_environment or ready_for_external_validation; manual review is only a compensating control and must not be recorded as a passed gate.
  - Agents must include best-practice, coding-standard, duplicate-code, complexity, OWASP or equivalent secure-code checks for every changed technology stack and product layer.
  - Agents must scan dependency and vulnerability findings across all severities supported by the selected tool. Filtering only HIGH or CRITICAL is insufficient for backlog closure.
  - Agents must address at least one existing technical-debt item before feature implementation in every code-changing iteration, unless the project has no open technical debt.
  - Agents must increase technical-debt remediation as the project advances; late-stage iterations, module closeouts and release preparation must reduce more debt than early exploratory iterations when open debt remains.
  - Agents must not mark a project finished, release-ready for GA or commercially complete while any project technical debt remains open.
  - Agents must enforce 80% line coverage as the final project closure threshold for every applicable delivered stack.
  - Agents must use the previous iteration's measured coverage as the minimum allowed baseline whenever current coverage is below 80%; coverage may improve gradually but must never decrease.
  - Agents must externalize user-visible messages, validation copy, error prose, stable error codes and repeated magic values through stack-appropriate message catalogs, constants, configuration or policy providers.
  - Agents must not treat the initial project stack as permanently fixed. Each code-changing iteration must evaluate whether newer open source frameworks, libraries, runtimes or tools are materially safer, better maintained, more portable or more cost-effective.
  - Agents must create or update technical-debt backlog items for beneficial technology upgrades or migrations that are not safe or necessary to execute immediately.
  - Agents must recommend gradual remediation of technology debt when future backlog work touches the affected components.
  - Agents must fail the backlog item when vulnerability or secure-code findings of any severity are introduced without remediation, accepted-risk disposition and immediate target backlog.
  - Agents must not advance next_backlog_item, module closeout or release readiness when any mandatory executable gate is not_executed, blocked_by_missing_toolchain, blocked_by_network, blocked_by_unsupported_runtime, passed_with_execution_limitation or closed_with_execution_limitation.
  - Agents must keep quality tooling project-local, reproducible and agent agnostic.
  - Agents must keep generated security and quality evidence in YAML first, with Markdown as the human companion.

non_goals:
  - This standard does not require one specific CI/CD vendor.
  - This standard does not require proprietary security platforms.
  - This standard does not replace domain security, IAM, privacy or regulatory requirements.
  - This standard does not force every tool on every project; applicability depends on the stack and changed surface.
  - This standard does not require immediate migration to every new framework or version; it requires explicit detection, documentation, prioritization and gradual remediation.
