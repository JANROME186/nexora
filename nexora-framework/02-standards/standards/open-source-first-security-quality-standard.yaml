artifact:
  id: NXF-OSS-SEC-QUAL-001
  type: framework-standard
  name: Open Source First Security and Quality Standard
  version: 1.5.1
  status: approved
  human_readable: open-source-first-security-quality-standard.md
  machine_readable: open-source-first-security-quality-standard.yaml
  owner: Nexora Engineering

purpose: >
  Ensure Nexora solutions prefer open source technologies and continuously apply
  security, vulnerability, dependency, coverage and engineering quality gates as
  the product is built, reducing cost, lock-in and technical debt.

technology_evolution_policy:
  default_position: >
    Quality, vulnerability, dependency, framework and technology reviews are not
    permanently constrained by the technology stack selected at project inception.
    Agents must evaluate the current implementation against the best available
    open source, secure, maintainable and commercially viable options at the time
    each backlog item is executed.
  review_frequency:
    - every_code_changing_backlog_item
    - every_dependency_change
    - every_module_closeout
    - every_release_readiness_gate
    - whenever an unresolved vulnerability, unsupported runtime, deprecated framework or major ecosystem shift is detected
  agents_must_detect:
    - unsupported_or_end_of_life_runtime
    - deprecated_framework_or_library
    - safer_open_source_alternative
    - lower_cost_or_more_portable_open_source_alternative
    - security_relevant_major_upgrade
    - license_or_governance_change
    - ecosystem_shift_that_changes_maintainability_or_hiring_risk
    - platform_or_language_version_that_blocks_quality_tools
    - architectural_lock_in_that_can_be_reduced_by_adapters_or_migration
  decision_rule: >
    Do not force immediate migration during unrelated work unless the finding is
    blocking, critical or necessary to complete the current backlog safely. When
    migration is beneficial but not immediately required, create or update a
    technical-debt backlog item with impact, risk, effort, affected components,
    recommended target state and gradual remediation plan.
  source_stack_is_baseline_not_prison: true
  preferred_behavior: >
    Address technology debt incrementally when normal backlog work touches the
    affected component, dependency boundary or runtime surface.

client_stack_market_validation_policy:
  purpose: >
    Ensure any technology stack proposed by a requester, client, prior project
    or initial architecture is validated against current open source market
    practice before implementation and during iterative backlog execution.
  default_position: >
    A client-proposed stack is input, not an automatic mandate. Agents must
    preserve valid business constraints, but must evaluate whether the proposed
    runtime, framework, libraries, build tools and quality tooling remain
    secure, actively maintained, cost-effective and aligned with current
    ecosystem practice at execution time.
  required_when:
    - new_project_analysis
    - technology_architecture_definition
    - mvp_definition
    - every_code_changing_backlog_item
    - dependency_or_runtime_change
    - module_closeout
    - release_readiness
  agents_must_compare:
    - requester_proposed_stack
    - current_project_stack
    - current_stable_or_lts_versions_from_official_sources
    - current_open_source_alternatives_used_by_the_ecosystem
    - required_quality_gate_tooling_for_each_stack
    - licensing_and_total_cost_of_ownership
    - security_advisories_and_known_cves
    - maintenance_activity_and_release_cadence
    - compatibility_with_deployment_targets_and_team_skills
  evidence_must_include:
    - stack_inventory
    - official_sources_checked
    - current_stable_or_lts_version_decisions
    - risks_found
    - rejected_or_deferred_alternatives
    - selected_stack_baseline
    - quality_toolchain_baseline
    - immediate_changes_applied
    - technical_debt_items_created_or_updated
    - decision_rationale
  version_selection_rule: >
    Prefer current stable or LTS versions that are supported by official
    maintainers and compatible with required quality gates. Do not adopt a
    newer major version only because it exists; evaluate stability, ecosystem
    support, security posture, migration cost and compatibility.
  source_policy:
    preferred_sources:
      - official_project_documentation
      - official_release_notes
      - official_security_advisories
      - package_registry_metadata
      - foundation_or_vendor_lifecycle_pages
      - national_vulnerability_database_or_osv_sources
    avoid_as_authoritative:
      - unsourced_blog_posts
      - marketing_claims
      - outdated_tutorials
      - isolated_social_media_opinions
  decision_rule: >
    Apply immediately any update required to remove security findings that
    cannot be safely accepted, unsupported runtimes, incompatible quality gates
    or blocking build failures. For beneficial but non-blocking improvements, create or
    update technical-debt backlog items and plan gradual remediation when the
    affected components are touched.

scope:
  applies_to:
    - new_project_analysis
    - architecture_definition
    - capability_package_definition
    - backlog_implementation
    - module_closeout
    - release_readiness
    - commercial_general_availability
  project_types:
    - web
    - backend
    - mobile
    - api
    - data
    - ai
    - integration
    - deployment

quality_gate_execution_policy:
  purpose: >
    Prevent backlog, module or release closure when required executable quality
    gates were not actually run. Source review and manual traceability checks are
    useful compensating controls, but they do not replace tests, builds,
    coverage, dependency audits or vulnerability scans for runnable code.
  required_before_code_changing_closure:
    environment_probe:
      - Verify required runtime versions before validation (for example Java,
        Maven, Node, npm, Docker, Flutter or database services according to the
        stack baseline and local runbook).
      - Compare detected versions with the project runbook and stack toolchain
        baseline.
      - If a required runtime or build tool is missing, unsupported or too old,
        attempt project-local remediation first (for example documented wrapper,
        checked-in settings, package installation, containerized service or
        approved toolchain path).
      - If remediation needs network or elevated permissions, request approval
        instead of silently downgrading validation.
    mandatory_gate_results:
      allowed_to_close:
        - passed
        - not_applicable_with_reason
      not_allowed_to_close:
        - not_executed
        - blocked_by_missing_toolchain
        - blocked_by_network
        - blocked_by_unsupported_runtime
        - failed
        - passed_with_execution_limitation
        - closed_with_execution_limitation
    manual_review_rule: >
      Manual source review, contract cross-checking or code inspection may be
      recorded as a compensating control only. It cannot convert a mandatory
      executable gate to passed and cannot justify advancing the backlog pointer.
    closure_rule: >
      A code-changing backlog item, validation backlog item, module closeout or
      release gate must not be marked closed, passed or ready for next backlog
      when a mandatory executable gate did not run. Mark the work
      blocked_by_environment or ready_for_external_validation, keep the active
      backlog pointer on the current item, and record exact remediation steps.
    external_validation_rule: >
      If the current execution environment cannot satisfy the stack baseline,
      the agent must produce a precise external validation command list and stop.
      The next agent or CI runner may close the item only after executing the
      missing gates and updating the evidence from blocked/limited to passed.
  module_validation_and_closeout:
    - Module validation must re-run or verify successful execution evidence for
      every required backend, frontend, mobile, API, dependency and build gate
      touched by the module.
    - Module closeout must not rely on implementation backlog evidence that is
      itself passed_with_execution_limitation or closed_with_execution_limitation.
    - Any missing Maven, Java, Node, native package, audit endpoint, Docker or
      database dependency is a blocking environment issue until resolved in a
      compatible local or CI environment.
  evidence_requirements:
    - Record detected runtime/tool versions and command paths for executed gates.
    - Record exact commands executed, working directory, result and numeric
      summaries (tests, failures, errors, skipped, coverage and vulnerabilities).
    - For vulnerability tools that use a local advisory database, record the
      database freshness timestamp or the manually supplied update date.
    - Record not_applicable gates with a reason tied to changed surface.
    - Do not use passed_with_execution_limitation or closed_with_execution_limitation
      as final closure states.
    - Use blocked_by_environment or ready_for_external_validation for incomplete
      mandatory gates.
  local_vulnerability_database_policy:
    purpose: >
      Keep vulnerability scans reproducible and fast without making agents
      responsible for refreshing large advisory databases during each backlog
      execution.
    applies_to:
      - OWASP Dependency-Check
      - tools_using_local_nvd_osv_or_equivalent_vulnerability_databases
    daily_manual_refresh_required: true
    refresh_frequency: once_per_day_or_before_release_readiness
    responsible_party: project_operator_or_security_reviewer
    agent_responsibility:
      - Execute the configured vulnerability analysis against the local advisory
        database available at execution time.
      - Record the database location and freshness timestamp/date in QA and
        security-quality evidence.
      - Report stale or missing vulnerability data as an operational prerequisite
        for the human operator, not as a framework implementation task.
      - Do not spend backlog execution time downloading or refreshing large
        vulnerability databases unless the backlog explicitly assigns that
        operational task.
    agent_must_not:
      - Treat advisory database refresh as feature work.
      - Modify framework rules to bypass dependency vulnerability analysis.
      - Claim a scan passed without actually running the scanner against the
        currently available local database.
    closure_rule: >
      A dependency vulnerability gate may close when the scanner executes
      successfully against the locally available advisory database, reports
      zero unresolved findings or accepted-risk dispositions, and records the
      advisory database freshness. The freshness update itself is a manual
      operational responsibility and is not performed by the framework or by
      ordinary backlog agents.

verifiable_backlog_closure_policy:
  purpose: >
    Prevent agents from declaring backlog work finished when the repository,
    evidence, gates or backlog pointers still prove otherwise.
  closure_language_rule: >
    Agents must not use final language such as done, finished, completed,
    closed, ready for next backlog or equivalent unless every item in the
    closure checklist is satisfied and evidenced. If any item is missing,
    the correct final state is blocked_by_environment, ready_for_external_validation,
    failed_validation or incomplete, and the active backlog pointer must remain
    on the current item.
  mandatory_pre_closure_checklist:
    - Confirm selected backlog item id matches PROJECT_STATE.yaml, source of truth,
      backlog prompt file and capability traceability files.
    - Confirm all mandatory executable gates for every changed stack ran in the
      current execution or have prior non-limited evidence explicitly referenced.
    - Confirm every gate has final state passed or not_applicable_with_reason.
    - Confirm no required gate is not_executed, failed, blocked_by_missing_toolchain,
      blocked_by_network, blocked_by_unsupported_runtime, passed_with_execution_limitation
      or closed_with_execution_limitation.
    - Confirm coverage for every changed stack is measured and is not below the
      previous measured baseline.
    - Confirm all vulnerability, secret and secure-code findings across every
      supported severity are fixed or have accepted-risk or technical-debt
      disposition with owner, target backlog and acceptance criteria.
    - Confirm at least one relevant open technical-debt item was resolved or
      materially reduced before feature work, unless no open debt existed at
      iteration start.
    - Confirm QA evidence and security-quality evidence exist in both YAML and
      Markdown when applicable, and that their numbers match command output.
    - Confirm PROJECT_STATE.yaml, SOURCE_OF_TRUTH.yaml, security-quality index,
      technical-debt index, runbooks, prompt pointers and capability traceability
      files are synchronized.
    - Confirm generated YAML parses successfully outside dependency/build folders.
    - Confirm stale pointer search found no active/current/next references to the
      just-closed backlog item after advancing.
    - Confirm repository whitespace validation passes.
    - Confirm git status is clean after commit, unless the task explicitly forbids
      committing; if committing is forbidden, report the dirty files and do not
      claim repository-ready closure.
  mandatory_validation_commands:
    yaml_parse: >
      Parse every project YAML file outside generated dependency/build folders.
    stale_pointer_sweep: >
      Search active_backlog_item, current_backlog_item, next_backlog_item,
      current_active_backlog_item, ready_for_next_backlog_item and human prompt
      sections for stale current or previous backlog ids.
    evidence_state_sweep: >
      Search changed evidence and registry files for not_executed, failed,
      passed_with_execution_limitation, closed_with_execution_limitation,
      blocked_by_missing_toolchain, blocked_by_network and
      blocked_by_unsupported_runtime.
    whitespace_check: git diff --check
    repository_cleanliness: git status --short
    commit_confirmation: git log -1 --oneline
  evidence_required_fields:
    - selected_backlog_item
    - final_backlog_status
    - next_backlog_item
    - commands_executed
    - command_results
    - coverage_before
    - coverage_after
    - technical_debt_burn_down
    - residual_findings
    - accepted_risks_or_debt_items
    - stale_pointer_sweep_result
    - yaml_parse_result
    - git_diff_check_result
    - git_status_after_commit
    - commit_hash
  agent_handoff_rule: >
    A handoff summary that says work is complete but lacks executable command
    results, evidence paths, pointer synchronization result, clean git status and
    commit hash is not valid closure evidence. The next reviewer must treat it as
    unverified and run the closure checklist before accepting it.

enterprise_stack_quality_policy:
  purpose: >
    Ensure every technology stack and product layer is analyzed with enterprise
    quality, security and maintainability expectations before development
    continues.
  applies_to_layers:
    - backend
    - frontend_web
    - mobile_app
    - api_contracts
    - infrastructure
    - integration
    - generated_code
  required_analysis_categories_for_each_changed_stack:
    - best_practices
    - coding_standards_and_style
    - duplicate_code
    - cyclomatic_or_cognitive_complexity
    - owasp_top_10_or_stack_equivalent
    - secure_coding
    - dependency_vulnerabilities_all_severities
    - secrets
    - license_and_open_source_policy_when_dependencies_change
    - coverage
    - architecture_boundaries_when_architecture_rules_exist
    - message_externalization_and_i18n
  required_tool_categories:
    backend:
      - unit_and_integration_tests
      - style_or_lint
      - static_analysis
      - sast_secure_code
      - duplicate_code_detector
      - complexity_detector
      - dependency_vulnerability_scan_all_severities
      - secrets_scan
      - coverage
      - architecture_rules_when_available
      - i18n_or_message_catalog_validation
    frontend_web:
      - typecheck
      - lint_or_static_analysis
      - sast_secure_code
      - duplicate_code_detector
      - complexity_detector
      - dependency_vulnerability_scan_all_severities
      - secrets_scan
      - coverage
      - production_build
      - accessibility_when_ui_changes
      - i18n_literal_scan
    mobile_app:
      - analyzer_or_lint
      - unit_widget_or_component_tests
      - sast_secure_code
      - duplicate_code_detector
      - complexity_detector
      - dependency_vulnerability_scan_all_severities
      - secrets_scan
      - coverage
      - localization_resource_validation
    infrastructure:
      - infrastructure_static_analysis
      - container_scan_all_severities
      - secrets_scan
      - misconfiguration_scan
      - sbom_when_releasable
  vulnerability_policy:
    severity_scope: all
    required_scan_configuration: >
      Vulnerability and dependency scans must include all severities supported
      by the tool. Filtering only HIGH or CRITICAL is insufficient for backlog
      closure.
    closure_rule: >
      A backlog item must not close with unresolved known vulnerabilities of any
      severity introduced or exposed by the changed stack. If remediation is too
      large for the current slice, create an immediate technical-debt item, mark
      it as next-priority remediation, notify it in the handoff and do not hide
      the risk from module or release closeout.
    accepted_risk_required_for_any_unresolved_vulnerability: true
    accepted_risk_must_include:
      - vulnerability_id_or_tool_finding
      - affected_component
      - severity
      - exploitability_or_reachability
      - business_impact
      - reason_not_fixed_now
      - target_backlog_item
      - owner_or_responsible_role
      - expiration_date
  message_externalization_policy:
    purpose: >
      Keep business messages, UI labels, validation text, error descriptions,
      error codes and configurable values decoupled from implementation code so
      products are multilingual, modular and easier to evolve.
    applies_to:
      - user_visible_text
      - validation_messages
      - error_titles_and_descriptions
      - domain_error_codes
      - audit_or_notification_templates
      - status_labels
      - configurable_business_thresholds
      - repeated_magic_strings_or_numbers
    backend_expectations:
      - Use stable domain error codes and message/resource bundles or equivalent message catalogs.
      - Return API error codes and parameters; avoid asserting prose messages in tests.
      - Keep tenant-configurable values in configuration, rule models or policy providers.
      - Use constants, value objects or enums for repeated technical identifiers.
    frontend_web_expectations:
      - Use localization dictionaries or message catalogs for visible text and validation copy.
      - Keep API error mapping by stable codes, not hard-coded prose.
      - Avoid magic strings for routes, permissions, statuses, query keys and feature flags.
    mobile_app_expectations:
      - Use platform localization resources such as ARB, JSON, ICU messages or equivalent.
      - Keep shared status/error mappings aligned with canonical API error codes.
    closure_rule: >
      New or changed user-visible messages, validation text, error prose, status
      labels or repeated magic strings must be externalized or explicitly
      registered as immediate technical debt before the backlog can close.

technical_debt_first_execution_policy:
  purpose: >
    Prevent technical debt from accumulating as passive documentation while
    normal feature development continues.
  rule: >
    Before implementing any code-changing backlog item, the agent must inspect
    08-qa/technical-debt/technical-debt-index.yaml and select at least one open
    technical-debt item to resolve or materially reduce first.
  selection_order:
    - blocking_or_security_related_items
    - items_affecting_the_stack_or_component_touched_by_the_selected_backlog
    - highest_urgency_then_highest_risk
    - oldest_open_item
  no_open_debt_rule: >
    If no open technical-debt item exists, evidence must explicitly record that
    the index was reviewed and no debt-first action was required.
  evidence_must_include:
    - technical_debt_index_reviewed
    - selected_technical_debt_item
    - reason_selected
    - action_taken_before_feature_work
    - validation_evidence
    - resulting_status
  closure_rule: >
    A code-changing backlog item must not close unless at least one existing
    technical-debt item was resolved or materially reduced first, or the project
    had no open technical debt at iteration start.

open_source_first_policy:
  default_position: Prefer open source, self-hostable, standards-based technologies.
  accepted_license_families:
    - Apache-2.0
    - MIT
    - BSD-2-Clause
    - BSD-3-Clause
    - MPL-2.0
    - EPL-2.0
    - PostgreSQL
  restricted_license_families:
    - AGPL
    - SSPL
    - BUSL
    - Commons-Clause
    - custom-commercial-source-available
  proprietary_exception_required: true
  proprietary_exception_file: 07-governance/adr/<adr-id>-technology-exception.md
  proprietary_exception_must_include:
    - business_reason
    - open_source_alternatives_evaluated
    - total_cost_of_ownership_impact
    - lock_in_risk
    - migration_exit_strategy
    - security_and_compliance_impact
    - approval_decision
  selection_criteria:
    - mature_open_source_project
    - active_maintenance
    - clear_license
    - broad_community_or_foundation_backing
    - standards_based_interfaces
    - self_hostable_or_portable_runtime
    - automation_friendly
    - observable_and_testable
    - compatible_with_agent_agnostic_execution
  lock_in_controls:
    - Prefer open standards and replaceable adapters.
    - Keep provider-specific code behind ports, adapters or configuration boundaries.
    - Do not make a proprietary service the only way to run, test or develop the product unless approved by ADR.
    - Prefer portable Docker, OCI, OpenAPI, SQL, OAuth2/OIDC, OpenTelemetry, Prometheus and standard CI primitives.

quality_toolchain_evolution_policy:
  purpose: >
    Keep the framework's stack quality toolchains current as open source
    ecosystems evolve.
  rule: >
    During architecture analysis, backlog execution, module closeout and release
    readiness, agents must compare the framework toolchain baseline with the
    current market and official project status for the selected stack.
  agents_must_detect:
    - tools_that_are_deprecated_or_unmaintained
    - tools_that_have_safer_or_more_capable_replacements
    - tools_that_changed_license_or_hosting_model
    - tools_that_no_longer_support_the_project_runtime
    - new_open_source_tools_that_cover_required_gate_categories_better
    - overlapping_tools_that_should_be_consolidated
  update_required_when:
    - a baseline tool becomes unsupported_or_incompatible
    - a new tool materially improves security_quality_or_portability
    - a hosted_or_proprietary_tool_is_being_made_mandatory_without_exception
    - a stack_specific_gate_category_has_no_working_tool
  required_documentation:
    - affected_stack
    - current_baseline_tool
    - proposed_new_or_replacement_tool
    - reason_for_change
    - license_and_hosting_model
    - migration_impact
    - project_debt_items_to_update
    - framework_feedback_or_framework_backlog_item
  closure_rule: >
    If a baseline tool cannot run or should be replaced, the agent must document
    the finding, create project technical debt when it affects the current
    product, and create framework feedback so Nexora can update the central
    framework baseline.

recommended_open_source_toolchain:
  ide_feedback:
    java:
      - SonarLint
      - SonarQube Community Build when centralized analysis is needed
      - SonarCloud only when hosted SaaS use is approved and not mandatory for local development
  sast:
    generic:
      - Semgrep
      - Gitleaks
    java:
      - SpotBugs
      - Find Security Bugs
      - PMD
      - Checkstyle
      - Error Prone
      - Google Error Prone
      - Revapi
    javascript_typescript:
      - ESLint
      - TypeScript strict mode
      - eslint-plugin-security
      - eslint-plugin-sonarjs
      - Semgrep
    flutter_dart:
      - dart analyze
      - flutter analyze
  dast:
    web_api:
      - OWASP ZAP baseline scan
      - OWASP ZAP API scan
  dependency_and_supply_chain:
    dependency_vulnerability:
      - OSV-Scanner
      - OWASP Dependency-Check
      - npm audit when Node package managers are used
      - pip-audit when Python is used
    container_and_filesystem:
      - Trivy
      - Grype
    sbom:
      - Syft
      - CycloneDX Maven Plugin
      - CycloneDX npm tools
    build_rules:
      java:
        - Maven Enforcer
        - Maven Versions Plugin
        - Maven Surefire Plugin
        - Duplicate Finder Maven Plugin
    license_review:
      java:
        - License Maven Plugin
        - License Checker when compatible with the stack
      javascript_typescript:
        - license-checker-rseidelsohn or equivalent actively maintained license checker
  code_coverage:
    java:
      - JaCoCo
    javascript_typescript:
      - Vitest coverage
      - Istanbul
      - c8
    flutter_dart:
      - flutter test --coverage
      - lcov
  infrastructure_as_code:
    - Checkov
    - TFLint
    - Hadolint
  api_and_contract_quality:
    - Spectral
    - Schemathesis
  observability_quality:
    - OpenTelemetry
    - Prometheus compatible metrics
    - Grafana compatible dashboards
  architecture_quality:
    java:
      - ArchUnit
  mutation_testing:
    java:
      - PIT
      - Pitest
  refactor_and_modernization:
    java:
      - OpenRewrite
  duplication:
    java:
      - PMD CPD
      - Duplicate Finder Maven Plugin
    javascript_typescript:
      - jscpd
    flutter_dart:
      - jscpd when configured for Dart or an equivalent Dart duplication tool

stack_quality_toolchain_baselines:
  java_maven:
    description: Baseline open source quality toolchain for Java services built with Maven.
    required_or_recommended_tools:
      - category: IDE
        tool: SonarLint
        primary_use: Real-time developer feedback in common IDEs.
        gate_level: recommended_local
        default_status: recommended
      - category: Centralized quality analysis
        tool: SonarCloud
        primary_use: Hosted quality, maintainability and security hotspot analysis when the organization approves SaaS usage.
        gate_level: optional_with_hosted_service_approval
        default_status: candidate_not_mandatory
        note: Prefer SonarQube Community Build or local open source gates when self-hosting and portability are required.
      - category: Test execution
        tool: Maven Surefire Plugin
        primary_use: Unit test execution and test result reporting during Maven builds.
        gate_level: required_for_java_maven_projects
        default_status: required
      - category: Quality and bugs
        tool: SpotBugs
        primary_use: Bytecode bug analysis.
        gate_level: required_when_java_code_changes
        default_status: required
      - category: Code security
        tool: Find Security Bugs
        primary_use: SpotBugs plugin for SQL injection, weak cryptography, command injection and related Java security issues.
        gate_level: required_when_java_code_changes
        default_status: required
      - category: Style
        tool: Checkstyle
        primary_use: Team conventions, formatting and structural rules.
        gate_level: required_when_java_code_changes
        default_status: required
      - category: Formatting
        tool: Spotless
        primary_use: Reproducible formatting and import hygiene through Maven.
        gate_level: required_when_java_code_changes
        default_status: required
      - category: Static analysis
        tool: PMD
        primary_use: Bad practices, dead code and complexity.
        gate_level: required_when_java_code_changes
        default_status: required
      - category: Duplication
        tool: PMD CPD
        primary_use: Copy and paste detection for duplicated code.
        gate_level: required_when_java_code_changes
        default_status: required
      - category: Duplicate dependencies and classes
        tool: Duplicate Finder Maven Plugin
        primary_use: Detect duplicate classes and conflicting resources across dependency graphs.
        gate_level: required_when_dependencies_change
        default_status: required
      - category: Coverage
        tool: JaCoCo
        primary_use: Unit and integration test coverage.
        gate_level: required_when_java_code_changes
        default_status: required
      - category: Dependency vulnerabilities
        tool: OWASP Dependency-Check
        primary_use: CVE detection in Maven dependencies.
        gate_level: required_when_dependencies_change
        default_status: required
      - category: Containers, filesystem and secrets
        tool: Trivy
        primary_use: CVEs, SBOM, licenses, misconfigurations and secrets.
        gate_level: required_for_release_and_when_runtime_assets_change
        default_status: required
      - category: SBOM
        tool: CycloneDX Maven Plugin
        primary_use: Direct and transitive dependency inventory.
