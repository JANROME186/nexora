artifact:
  id: NXF-OSS-SEC-QUAL-001
  type: framework-standard
  name: Open Source First Security and Quality Standard
  version: 1.2.0
  status: approved
  human_readable: open-source-first-security-quality-standard.md
  machine_readable: open-source-first-security-quality-standard.yaml
  owner: Nexora Engineering

purpose: >
  Ensure Nexora solutions prefer open source technologies and continuously apply
  security, vulnerability, dependency, coverage and engineering quality gates as
  the product is built, reducing cost, lock-in and technical debt.

technology_evolution_policy:
  default_position: >
    Quality, vulnerability, dependency, framework and technology reviews are not
    permanently constrained by the technology stack selected at project inception.
    Agents must evaluate the current implementation against the best available
    open source, secure, maintainable and commercially viable options at the time
    each backlog item is executed.
  review_frequency:
    - every_code_changing_backlog_item
    - every_dependency_change
    - every_module_closeout
    - every_release_readiness_gate
    - whenever a critical/high vulnerability, unsupported runtime, deprecated framework or major ecosystem shift is detected
  agents_must_detect:
    - unsupported_or_end_of_life_runtime
    - deprecated_framework_or_library
    - safer_open_source_alternative
    - lower_cost_or_more_portable_open_source_alternative
    - security_relevant_major_upgrade
    - license_or_governance_change
    - ecosystem_shift_that_changes_maintainability_or_hiring_risk
    - platform_or_language_version_that_blocks_quality_tools
    - architectural_lock_in_that_can_be_reduced_by_adapters_or_migration
  decision_rule: >
    Do not force immediate migration during unrelated work unless the finding is
    blocking, critical or necessary to complete the current backlog safely. When
    migration is beneficial but not immediately required, create or update a
    technical-debt backlog item with impact, risk, effort, affected components,
    recommended target state and gradual remediation plan.
  source_stack_is_baseline_not_prison: true
  preferred_behavior: >
    Address technology debt incrementally when normal backlog work touches the
    affected component, dependency boundary or runtime surface.

client_stack_market_validation_policy:
  purpose: >
    Ensure any technology stack proposed by a requester, client, prior project
    or initial architecture is validated against current open source market
    practice before implementation and during iterative backlog execution.
  default_position: >
    A client-proposed stack is input, not an automatic mandate. Agents must
    preserve valid business constraints, but must evaluate whether the proposed
    runtime, framework, libraries, build tools and quality tooling remain
    secure, actively maintained, cost-effective and aligned with current
    ecosystem practice at execution time.
  required_when:
    - new_project_analysis
    - technology_architecture_definition
    - mvp_definition
    - every_code_changing_backlog_item
    - dependency_or_runtime_change
    - module_closeout
    - release_readiness
  agents_must_compare:
    - requester_proposed_stack
    - current_project_stack
    - current_stable_or_lts_versions_from_official_sources
    - current_open_source_alternatives_used_by_the_ecosystem
    - required_quality_gate_tooling_for_each_stack
    - licensing_and_total_cost_of_ownership
    - security_advisories_and_known_cves
    - maintenance_activity_and_release_cadence
    - compatibility_with_deployment_targets_and_team_skills
  evidence_must_include:
    - stack_inventory
    - official_sources_checked
    - current_stable_or_lts_version_decisions
    - risks_found
    - rejected_or_deferred_alternatives
    - selected_stack_baseline
    - quality_toolchain_baseline
    - immediate_changes_applied
    - technical_debt_items_created_or_updated
    - decision_rationale
  version_selection_rule: >
    Prefer current stable or LTS versions that are supported by official
    maintainers and compatible with required quality gates. Do not adopt a
    newer major version only because it exists; evaluate stability, ecosystem
    support, security posture, migration cost and compatibility.
  source_policy:
    preferred_sources:
      - official_project_documentation
      - official_release_notes
      - official_security_advisories
      - package_registry_metadata
      - foundation_or_vendor_lifecycle_pages
      - national_vulnerability_database_or_osv_sources
    avoid_as_authoritative:
      - unsourced_blog_posts
      - marketing_claims
      - outdated_tutorials
      - isolated_social_media_opinions
  decision_rule: >
    Apply immediately any update required to remove critical/high security
    findings, unsupported runtimes, incompatible quality gates or blocking
    build failures. For beneficial but non-blocking improvements, create or
    update technical-debt backlog items and plan gradual remediation when the
    affected components are touched.

scope:
  applies_to:
    - new_project_analysis
    - architecture_definition
    - capability_package_definition
    - backlog_implementation
    - module_closeout
    - release_readiness
    - commercial_general_availability
  project_types:
    - web
    - backend
    - mobile
    - api
    - data
    - ai
    - integration
    - deployment

quality_gate_execution_policy:
  purpose: >
    Prevent backlog, module or release closure when required executable quality
    gates were not actually run. Source review and manual traceability checks are
    useful compensating controls, but they do not replace tests, builds,
    coverage, dependency audits or vulnerability scans for runnable code.
  required_before_code_changing_closure:
    environment_probe:
      - Verify required runtime versions before validation (for example Java,
        Maven, Node, npm, Docker, Flutter or database services according to the
        stack baseline and local runbook).
      - Compare detected versions with the project runbook and stack toolchain
        baseline.
      - If a required runtime or build tool is missing, unsupported or too old,
        attempt project-local remediation first (for example documented wrapper,
        checked-in settings, package installation, containerized service or
        approved toolchain path).
      - If remediation needs network or elevated permissions, request approval
        instead of silently downgrading validation.
    mandatory_gate_results:
      allowed_to_close:
        - passed
        - not_applicable_with_reason
      not_allowed_to_close:
        - not_executed
        - blocked_by_missing_toolchain
        - blocked_by_network
        - blocked_by_unsupported_runtime
        - failed
        - passed_with_execution_limitation
        - closed_with_execution_limitation
    manual_review_rule: >
      Manual source review, contract cross-checking or code inspection may be
      recorded as a compensating control only. It cannot convert a mandatory
      executable gate to passed and cannot justify advancing the backlog pointer.
    closure_rule: >
      A code-changing backlog item, validation backlog item, module closeout or
      release gate must not be marked closed, passed or ready for next backlog
      when a mandatory executable gate did not run. Mark the work
      blocked_by_environment or ready_for_external_validation, keep the active
      backlog pointer on the current item, and record exact remediation steps.
    external_validation_rule: >
      If the current execution environment cannot satisfy the stack baseline,
      the agent must produce a precise external validation command list and stop.
      The next agent or CI runner may close the item only after executing the
      missing gates and updating the evidence from blocked/limited to passed.
  module_validation_and_closeout:
    - Module validation must re-run or verify successful execution evidence for
      every required backend, frontend, mobile, API, dependency and build gate
      touched by the module.
    - Module closeout must not rely on implementation backlog evidence that is
      itself passed_with_execution_limitation or closed_with_execution_limitation.
    - Any missing Maven, Java, Node, native package, audit endpoint, Docker or
      database dependency is a blocking environment issue until resolved in a
      compatible local or CI environment.
  evidence_requirements:
    - Record detected runtime/tool versions and command paths for executed gates.
    - Record exact commands executed, working directory, result and numeric
      summaries (tests, failures, errors, skipped, coverage and vulnerabilities).
    - Record not_applicable gates with a reason tied to changed surface.
    - Do not use passed_with_execution_limitation or closed_with_execution_limitation
      as final closure states.
    - Use blocked_by_environment or ready_for_external_validation for incomplete
      mandatory gates.

open_source_first_policy:
  default_position: Prefer open source, self-hostable, standards-based technologies.
  accepted_license_families:
    - Apache-2.0
    - MIT
    - BSD-2-Clause
    - BSD-3-Clause
    - MPL-2.0
    - EPL-2.0
    - PostgreSQL
  restricted_license_families:
    - AGPL
    - SSPL
    - BUSL
    - Commons-Clause
    - custom-commercial-source-available
  proprietary_exception_required: true
  proprietary_exception_file: 07-governance/adr/<adr-id>-technology-exception.md
  proprietary_exception_must_include:
    - business_reason
    - open_source_alternatives_evaluated
    - total_cost_of_ownership_impact
    - lock_in_risk
    - migration_exit_strategy
    - security_and_compliance_impact
    - approval_decision
  selection_criteria:
    - mature_open_source_project
    - active_maintenance
    - clear_license
    - broad_community_or_foundation_backing
    - standards_based_interfaces
    - self_hostable_or_portable_runtime
    - automation_friendly
    - observable_and_testable
    - compatible_with_agent_agnostic_execution
  lock_in_controls:
    - Prefer open standards and replaceable adapters.
    - Keep provider-specific code behind ports, adapters or configuration boundaries.
    - Do not make a proprietary service the only way to run, test or develop the product unless approved by ADR.
    - Prefer portable Docker, OCI, OpenAPI, SQL, OAuth2/OIDC, OpenTelemetry, Prometheus and standard CI primitives.

recommended_open_source_toolchain:
  ide_feedback:
    java:
      - SonarLint
  sast:
    generic:
      - Semgrep
      - Gitleaks
    java:
      - SpotBugs
      - Find Security Bugs
      - PMD
      - Checkstyle
      - Error Prone
    javascript_typescript:
      - ESLint
      - TypeScript strict mode
    flutter_dart:
      - dart analyze
      - flutter analyze
  dast:
    web_api:
      - OWASP ZAP baseline scan
      - OWASP ZAP API scan
  dependency_and_supply_chain:
    dependency_vulnerability:
      - OSV-Scanner
      - OWASP Dependency-Check
      - npm audit when Node package managers are used
      - pip-audit when Python is used
    container_and_filesystem:
      - Trivy
      - Grype
    sbom:
      - Syft
      - CycloneDX Maven Plugin
      - CycloneDX npm tools
    build_rules:
      java:
        - Maven Enforcer
    license_review:
      java:
        - License Maven Plugin
  code_coverage:
    java:
      - JaCoCo
    javascript_typescript:
      - Vitest coverage
      - Istanbul
      - c8
    flutter_dart:
      - flutter test --coverage
      - lcov
  infrastructure_as_code:
    - Checkov
    - TFLint
    - Hadolint
  api_and_contract_quality:
    - Spectral
    - Schemathesis
  observability_quality:
    - OpenTelemetry
    - Prometheus compatible metrics
    - Grafana compatible dashboards
  architecture_quality:
    java:
      - ArchUnit
  mutation_testing:
    java:
      - PIT
      - Pitest
  refactor_and_modernization:
    java:
      - OpenRewrite
  duplication:
    java:
      - PMD CPD

stack_quality_toolchain_baselines:
  java_maven:
    description: Baseline open source quality toolchain for Java services built with Maven.
    required_or_recommended_tools:
      - category: IDE
        tool: SonarLint
        primary_use: Real-time developer feedback in common IDEs.
        gate_level: recommended_local
      - category: Quality and bugs
        tool: SpotBugs
        primary_use: Bytecode bug analysis.
        gate_level: required_when_java_code_changes
      - category: Code security
        tool: Find Security Bugs
        primary_use: SpotBugs plugin for SQL injection, weak cryptography, command injection and related Java security issues.
        gate_level: required_when_java_code_changes
      - category: Style
        tool: Checkstyle
        primary_use: Team conventions, formatting and structural rules.
        gate_level: required_when_java_code_changes
      - category: Static analysis
        tool: PMD
        primary_use: Bad practices, dead code and complexity.
        gate_level: required_when_java_code_changes
      - category: Duplication
        tool: PMD CPD
        primary_use: Copy and paste detection for duplicated code.
        gate_level: recommended_for_module_closeout
      - category: Coverage
        tool: JaCoCo
        primary_use: Unit and integration test coverage.
        gate_level: required_when_java_code_changes
      - category: Dependency vulnerabilities
        tool: OWASP Dependency-Check
        primary_use: CVE detection in Maven dependencies.
        gate_level: required_when_dependencies_change
      - category: Containers, filesystem and secrets
        tool: Trivy
        primary_use: CVEs, SBOM, licenses, misconfigurations and secrets.
        gate_level: required_for_release_and_when_runtime_assets_change
      - category: SBOM
        tool: CycloneDX Maven Plugin
        primary_use: Direct and transitive dependency inventory.
        gate_level: required_for_release
      - category: Build rules
        tool: Maven Enforcer
        primary_use: Block unsupported Java/Maven versions, duplicate dependencies and disallowed dependencies.
        gate_level: required_for_java_maven_projects
      - category: Licenses
        tool: License Maven Plugin
        primary_use: Validate license headers and dependency license policy.
        gate_level: recommended_for_release
      - category: Advanced tests
        tool: PIT or Pitest
        primary_use: Mutation testing to measure test effectiveness.
        gate_level: recommended_for_core_domain_or_high_risk_modules
      - category: Architecture
        tool: ArchUnit
        primary_use: Validate architecture rules for layers, packages, DDD boundaries or hexagonal architecture.
        gate_level: required_when_architecture_rules_exist
      - category: Refactor and technical debt
        tool: OpenRewrite
        primary_use: Automate migrations and safe refactors through Maven.
        gate_level: recommended_for_modernization_debt
      - category: Additional SAST
        tool: Semgrep CE
        primary_use: Security and bug rules for Java in local or CI quality gates.
        gate_level: recommended_defense_in_depth
    minimum_evidence:
      - java_and_maven_versions_selected_from_current_supported_stable_or_lts_sources
      - maven_dependency_tree_or_equivalent_dependency_inventory
      - unit_or_integration_test_results
      - coverage_report
      - static_analysis_results
      - dependency_vulnerability_results
      - secrets_or_filesystem_scan_results
      - sbom_for_release_or_release_candidate
      - architecture_test_results_when_architecture_rules_exist
      - technical_debt_items_for_unavailable_or_deferred_tools
    adoption_rule: >
      Use the project-local build system where practical. If a tool cannot be
      added safely during the active backlog item, document the reason and
      register gradual technical debt unless the missing tool blocks release or
      hides critical/high risk.

quality_gates:
  backlog_item_gate:
    required_for_every_code_backlog:
      - client_stack_market_validation_when_stack_or_dependencies_are_relevant
      - unit_tests
      - relevant_integration_or_contract_tests
      - dependency_vulnerability_scan
      - secrets_scan
      - sast_or_static_analysis_for_changed_stack
      - coverage_report_for_changed_stack
      - technology_evolution_review
      - technical_debt_backlog_update_when_findings_exist
      - qa_evidence_yaml
      - qa_evidence_md_when_human_review_is_needed
    fail_conditions:
      - new_critical_or_high_vulnerability_without_accepted_risk
      - secret_detected
      - critical_or_high_sast_finding_without_accepted_risk
      - tests_failing
      - coverage_decreases_without_documented_reason
      - generated_artifacts_modified_without_source_model_change
      - proprietary_dependency_without_exception_adr
  module_closeout_gate:
    required:
      - stack_baseline_reviewed_against_current_market_and_official_versions
      - all_backlog_item_gates_passed
      - aggregate_coverage_report
      - dependency_and_container_scan_when_applicable
      - dast_baseline_when_web_api_or_ui_is_runnable
      - openapi_contract_validation_when_api_changed
      - threat_model_or_security_notes_for_security_sensitive_module
      - accepted_risk_register_updated
  release_gate:
    required:
      - client_or_project_stack_validated_against_current_stable_versions
      - sast_passed
      - dast_passed_or_not_applicable_with_reason
      - dependency_scan_passed
      - container_scan_passed_when_containers_exist
      - sbom_generated
      - coverage_threshold_met_or_exception_approved
      - known_vulnerabilities_reviewed
      - license_review_passed
      - technology_debt_register_reviewed
      - security_quality_evidence_registered

technical_debt_backlog_policy:
  root_folder: 08-qa/technical-debt/
  index_file: 08-qa/technical-debt/technical-debt-index.yaml
  human_readable_index: 08-qa/technical-debt/README.md
  item_path_pattern: 08-qa/technical-debt/<debt-id>.yaml
  debt_id_pattern: TD-<component-or-area>-<sequence>
  required_when:
    - technology_review_finds_non_blocking_migration_or_upgrade
    - dependency_or_framework_is_outdated_but_not_immediate_blocker
    - security_or_quality_tooling_gap_needs_gradual_remediation
    - stack_migration_is_recommended_but_must_be_coordinated_with_touched_components
  debt_item_must_include:
    - id
    - title
    - source_backlog_item
    - detection_date
    - affected_components
    - current_state
    - recommended_target_state
    - reason
    - risk_level
    - urgency
    - estimated_effort
    - estimated_cost_impact
    - migration_strategy
    - incremental_remediation_triggers
    - dependencies_or_prerequisites
    - acceptance_criteria
    - owner_or_responsible_role
    - status
  statuses:
    - proposed
    - accepted
    - in_progress
    - partially_resolved
    - resolved
    - rejected_with_reason
  remediation_rules:
    - Do not rewrite stable components solely to chase novelty.
    - Prefer opportunistic remediation when the affected component is already being modified.
    - Break broad migrations into small backlog items with explicit test and rollback strategy.
    - Security-critical or unsupported runtime findings may be promoted to blocking backlog items.
    - Every resolved debt item must reference validation evidence and the backlog item that resolved it.

default_thresholds:
  vulnerability_policy:
    critical: fail
    high: fail
    medium: warn_for_mvp_fail_for_ga_unless_accepted
    low: warn
  sast_policy:
    critical: fail
    high: fail
    medium: warn_or_fail_by_module_risk
    low: warn
  coverage_policy:
    mvp_minimum_line_coverage_target: 70
    commercial_ga_line_coverage_target: 80
    branch_coverage_target: project_defined
    changed_code_must_not_reduce_existing_coverage: true
  license_policy:
    restricted_license_requires_review: true
    proprietary_dependency_requires_exception_adr: true

evidence_requirements:
  root_folder: 08-qa/security-quality/
  per_backlog_path_pattern: 08-qa/security-quality/<backlog-item-id>/
  required_files:
    - security-quality-evidence.yaml
    - security-quality-evidence.md
  evidence_yaml_must_include:
    - backlog_item_id
    - module_id
    - changed_components
    - open_source_first_assessment
    - client_stack_market_validation_when_applicable
    - stack_toolchain_baseline
    - tools_run
    - commands_or_equivalent_steps
    - results
    - coverage_summary
    - dependency_vulnerability_summary
    - sast_summary
    - dast_summary_when_applicable
    - secrets_scan_summary
    - license_summary
    - technology_evolution_review
    - technical_debt_items_created_or_updated
    - accepted_risks
    - blocking_findings
    - decision

agent_rules:
  - Agents must prefer open source libraries, frameworks, tools and standards unless the requester explicitly requires otherwise or an ADR approves an exception.
  - Agents must not introduce proprietary runtimes, hosted services, paid-only SDKs or closed-source dependencies as mandatory product dependencies without an exception ADR.
  - Agents must add or update quality-gate evidence for every backlog item that changes code, dependencies, runtime configuration, APIs or deployment assets.
  - Agents must validate requester-proposed stacks against current stable or LTS versions, official lifecycle information, security advisories, ecosystem health and required quality gates before accepting them as the implementation baseline.
  - Agents must define a stack-specific open source quality toolchain during architecture analysis and revisit it during backlog work, module closeout and release readiness.
  - Agents must run the security and quality gates that are applicable to the changed stack. If a mandatory executable gate cannot run because a tool, runtime, native binary, network endpoint or service is unavailable, the backlog item must remain blocked_by_environment or ready_for_external_validation; manual review is only a compensating control and must not be recorded as a passed gate.
  - Agents must not treat the initial project stack as permanently fixed. Each code-changing iteration must evaluate whether newer open source frameworks, libraries, runtimes or tools are materially safer, better maintained, more portable or more cost-effective.
  - Agents must create or update technical-debt backlog items for beneficial technology upgrades or migrations that are not safe or necessary to execute immediately.
  - Agents must recommend gradual remediation of technology debt when future backlog work touches the affected components.
  - Agents must fail the backlog item when critical or high findings are introduced and no accepted risk exists.
  - Agents must not advance next_backlog_item, module closeout or release readiness when any mandatory executable gate is not_executed, blocked_by_missing_toolchain, blocked_by_network, blocked_by_unsupported_runtime, passed_with_execution_limitation or closed_with_execution_limitation.
  - Agents must keep quality tooling project-local, reproducible and agent agnostic.
  - Agents must keep generated security and quality evidence in YAML first, with Markdown as the human companion.

non_goals:
  - This standard does not require one specific CI/CD vendor.
  - This standard does not require proprietary security platforms.
  - This standard does not replace domain security, IAM, privacy or regulatory requirements.
  - This standard does not force every tool on every project; applicability depends on the stack and changed surface.
  - This standard does not require immediate migration to every new framework or version; it requires explicit detection, documentation, prioritization and gradual remediation.
