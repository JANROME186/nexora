artifact:
  id: NXF-LOCAL-TOOLCHAIN-001
  type: framework-standard
  name: Local Toolchain Inventory Standard
  version: 1.0.0
  status: approved
  human_readable: local-toolchain-inventory-standard.md
  machine_readable: local-toolchain-inventory-standard.yaml
  owner: Nexora Engineering

purpose: >
  Ensure every Nexora project maintains a stable, agent-readable inventory of
  local development tools, executable paths, versions and generic commands so
  backlog agents do not rediscover the same tool locations on every iteration.

scope:
  applies_to:
    - new_project_analysis
    - technology_architecture_definition
    - backlog_implementation
    - quality_gate_execution
    - local_solution_validation
    - module_closeout
  project_artifact_location: 03-architecture/technology-architecture/local-toolchain-inventory.yaml
  human_companion_location: 03-architecture/technology-architecture/local-toolchain-inventory.md

inventory_rules:
  project_must_define_inventory_after_stack_selection: true
  inventory_is_machine_specific: true
  inventory_is_agent_agnostic: true
  inventory_is_not_a_backlog_execution_log: true
  update_required_when:
    - selected_stack_changes
    - local_runtime_or_build_tool_path_changes
    - tool_version_changes_materially
    - new_required_quality_gate_tool_is_added
    - command_wrapper_or_settings_file_changes
    - local_solution_runbook_requires_a_new_tool
  agents_must:
    - Load the project local-toolchain-inventory.yaml before running build, test, quality, security or runtime commands.
    - Prefer inventory paths and command templates over rediscovering tools.
    - Verify listed tools exist before using them.
    - Update the inventory when a path or version is stale and the correct value is discovered.
    - Register technical debt when a required tool is missing and cannot be installed or configured in the current iteration.
    - Keep commands generic and reusable, not backlog-specific execution history.
  agents_must_not:
    - Store secrets, credentials, access tokens or machine-private sensitive values.
    - Add every command executed during development.
    - Add agent-specific runtime dependencies or named-agent instructions.
    - Replace the integrated local solution runbook with this inventory.
    - Assume another machine has the same absolute paths.

required_sections:
  - artifact
  - project
  - repository
  - operating_system
  - environment_variables
  - tools
  - command_templates
  - maintenance_policy
  - validation

tool_record_schema:
  required_fields:
    - id
    - category
    - executable_name
    - path
    - version
    - required_for
    - detection_command
    - version_command
    - generic_commands
    - status
  recommended_fields:
    - home_path
    - settings_files
    - notes
    - last_verified_date
    - owner_or_responsible_role

generic_command_policy:
  allowed:
    - tool_version_checks
    - build_commands
    - test_commands
    - quality_profile_commands
    - security_scan_commands
    - local_runtime_start_stop_commands
    - repository_status_commands
    - yaml_validation_commands
  not_allowed:
    - backlog_specific_commands
    - one_off_debug_commands
    - credentials_or_secret_values
    - commands_with_machine_private_tokens
    - generated_evidence_command_history

relationship_to_other_artifacts:
  stack_quality_toolchain_baseline: >
    Defines which tools are required or recommended by stack and quality category.
    The local toolchain inventory records where those tools are found on the
    machine used for development.
  integrated_local_solution_runbook: >
    Defines the ordered steps to start, validate and stop the full solution.
    It may reference the local toolchain inventory for executable paths and
    command prerequisites.
  technical_debt_index: >
    Missing required tools or stale toolchain entries that block mandatory gates
    must be registered as technical debt with owner, target backlog and acceptance
    criteria.

closure_gate:
  required_for_code_changing_backlog: true
  rule: >
    A code-changing backlog agent must load the inventory before execution and
    record whether required listed tools were available. If the inventory is
    missing, stale or incomplete for a required tool, the agent must update it or
    register technical debt before closure.

evidence_requirements:
  - local_toolchain_inventory_loaded
  - tools_required_for_changed_stack
  - tool_paths_used
  - version_checks_performed
  - stale_or_missing_tool_disposition
  - inventory_updates_if_any
