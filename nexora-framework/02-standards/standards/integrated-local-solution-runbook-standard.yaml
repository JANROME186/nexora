artifact:
  id: NXF-LOCAL-RUNBOOK-001
  type: framework-standard
  name: Integrated Local Solution Runbook Standard
  version: 1.0.0
  status: approved
  human_readable: integrated-local-solution-runbook-standard.md
  machine_readable: integrated-local-solution-runbook-standard.yaml
  owner: Nexora Engineering

purpose: >
  Ensure every Nexora project maintains a single integrated local runbook that
  lets a human reviewer start, validate and stop the complete solution without
  opening each component folder manually.

principles:
  - Component README files remain valid for component-specific detail.
  - The integrated runbook is the first human entry point for local review.
  - Every implementation iteration must update the integrated runbook when runtime components, dependencies, ports, startup order, validation steps or known limitations change.
  - The runbook must be agent agnostic, platform portable where practical and explicit about required local tools.
  - YAML is the machine-readable source; Markdown is the human-readable companion.
  - Gaps discovered while using the runbook may generate project feedback or framework feedback.

required_project_artifacts:
  root_folder: 09-operations/runbooks/
  human_readable: 09-operations/runbooks/local-solution-runbook.md
  machine_readable: 09-operations/runbooks/local-solution-runbook.yaml

required_when:
  - new_project_analysis_completes
  - first_runtime_component_is_created
  - infrastructure_or_compose_changes
  - backend_runtime_or_port_changes
  - frontend_or_webapp_runtime_or_port_changes
  - mobile_runtime_or_backend_dependency_changes
  - validation_command_changes
  - module_closeout_completes
  - release_readiness_completes

runbook_must_include:
  - project_name
  - intended_audience
  - supported_local_operating_system_notes
  - prerequisites
  - component_inventory
  - dependency_startup_order
  - environment_file_setup
  - infrastructure_start_steps
  - backend_start_steps
  - frontend_or_webapp_start_steps
  - mobile_start_or_validation_steps_when_applicable
  - health_check_steps
  - smoke_validation_steps
  - quality_validation_steps
  - stop_steps
  - reset_steps
  - troubleshooting
  - known_limitations
  - related_component_readmes
  - feedback_capture_instructions

component_inventory_required_fields:
  - id
  - name
  - type
  - path
  - depends_on
  - port_or_url
  - start_command
  - health_check
  - stop_command_or_process_note
  - owner_area

dependency_order_policy:
  order_must_be_explicit: true
  typical_order:
    - local_environment_file
    - infrastructure_services
    - database_or_messaging_migrations
    - backend_api
    - frontend_or_webapp
    - mobile_or_client_validation
    - integrated_smoke_validation
  agents_must_update_when:
    - a component adds a dependency
    - a component changes a port or URL
    - a new infrastructure service is added
    - a validation command changes
    - a component becomes optional or mandatory

human_review_policy:
  goal: >
    A reviewer should be able to follow one document from a clean checkout to
    a running local solution and basic validation evidence.
  runbook_must_not_require:
    - opening_component_readmes_for_basic_startup
    - reading previous chat context
    - knowing hidden startup order
    - guessing ports
    - guessing required environment variables
  component_readmes_are_for:
    - deeper implementation detail
    - component-specific tests
    - internal architecture notes
    - advanced troubleshooting

quality_gate_integration:
  code_changing_backlog_item:
    required_check: Update or confirm integrated local runbook accuracy.
    evidence_location: 08-qa/security-quality/<backlog-item-id>/security-quality-evidence.yaml
  module_closeout:
    required_check: Execute or dry-run review the integrated runbook and document result.
    evidence_location: 08-qa/qa/<module-or-capability>/<closeout-id>.yaml
  release_readiness:
    required_check: Integrated runbook must be executable by a human reviewer or explicitly blocked with remediation backlog.

feedback_rules:
  project_feedback_path: 08-qa/framework-feedback/
  framework_feedback_path: nexora-framework/07-governance/framework-improvement-backlog/
  agents_must_capture_feedback_when:
    - the runbook is ambiguous
    - startup order is incomplete
    - manual component steps are still required for basic startup
    - validation requires hidden knowledge
    - local tooling is missing from prerequisites
    - repeated runbook changes suggest a reusable framework improvement

agent_rules:
  - Agents must update the integrated local runbook whenever they add or change infrastructure, backend, frontend, webapp, mobile, ports, environment variables or validation commands.
  - Agents must not rely only on component README files for human local review.
  - Agents must list all commands from the project root or clearly state the working directory for each command.
  - Agents must keep destructive reset steps separate from normal stop steps.
  - Agents must document unavailable or deferred integrated validation as project technical debt or framework feedback when appropriate.
  - Agents must keep the runbook synchronized with SOURCE_OF_TRUTH.yaml and PROJECT_STATE.yaml.

non_goals:
  - This standard does not replace component README files.
  - This standard does not require a single automation script when documentation is sufficient.
  - This standard does not require all optional future channels to be runnable before their module is implemented.
