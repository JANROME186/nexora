artifact:
  id: NXF-SQ-PROMPTS-001
  type: prompt-playbook
  name: Security and Quality Gate Prompts
  version: 1.3.0
  status: approved
  human_readable: security-quality-gate-prompts.md
  machine_readable: security-quality-gate-prompts.yaml
  owner: Nexora Engineering

purpose: Provide reusable agent-agnostic prompts for open-source-first technology selection and security quality gate validation.

required_context:
  - nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml
  - nexora-framework/02-standards/standards/agent-agnostic-standard.yaml
  - target_project/SOURCE_OF_TRUTH.yaml
  - target_project/PROJECT_STATE.yaml
  - target_project/08-qa/

prompts:
  - id: PROMPT-OSS-000
    name: Client proposed stack market validation
    intent: Validate a requester-proposed or existing project stack against current open source market practice before accepting it as the implementation baseline.
    expected_output:
      - stack_inventory
      - official_sources_checked
      - current_stable_or_lts_version_decisions
      - market_practice_comparison
      - required_quality_toolchain_by_stack
      - required_quality_toolchain_by_layer
      - risks_and_gaps
      - immediate_changes_to_apply
      - technical_debt_items_to_create_or_update
      - selected_stack_baseline
    prompt: |
      Load the Open Source First Security and Quality Standard.
      Identify the requester-proposed stack, the current project stack and every runtime, framework, package manager, build tool, database, deployment technology and quality tool that materially affects development.
      Validate each stack element against current stable or LTS versions using official documentation, release notes, lifecycle pages, official security advisories and trusted vulnerability sources. Treat blogs, tutorials and marketing claims as supporting context only, not authority.
      Compare the proposed stack with current open source ecosystem practice for security, maintainability, portability, cost, maturity, hiring risk, deployment fit and available quality gates.
      Define the minimum open source quality toolchain required by each stack and layer. The toolchain must cover best practices, coding standards, duplicated code, complexity, OWASP or stack-equivalent secure coding, dependency vulnerabilities across all severities, secrets, coverage, architecture rules when applicable and message externalization/i18n. For Java/Maven, consider SonarLint, SpotBugs, Find Security Bugs, Checkstyle, PMD, PMD CPD, JaCoCo, OWASP Dependency-Check, Trivy, CycloneDX Maven Plugin, Maven Enforcer, License Maven Plugin, PIT/Pitest, ArchUnit, OpenRewrite and Semgrep CE according to applicability.
      Apply immediately any upgrade or replacement required to remove security findings that cannot be safely accepted, unsupported runtimes, incompatible quality gates or blocking build failures.
      For beneficial but non-blocking upgrades, migrations or tooling gaps, create or update technical-debt items under 08-qa/technical-debt/ with risk, effort, cost, affected components and gradual remediation triggers.
      Produce a selected_stack_baseline and stack_toolchain_baseline for architecture or backlog evidence.

  - id: PROMPT-OSS-001
    name: Open-source-first technology assessment
    intent: Confirm that new or changed technology choices prefer open source, portable and standards-based options.
    expected_output:
      - selected_technologies
      - open_source_assessment
      - technology_evolution_review
      - license_summary
      - proprietary_exceptions_required
      - lock_in_risks
      - technical_debt_items_to_create_or_update
      - recommendation
    prompt: |
      Load the Open Source First Security and Quality Standard.
      Review the changed architecture, dependencies, runtime tools and implementation choices.
      If the requester or existing project proposes a stack, first run the client proposed stack market validation prompt and use its selected_stack_baseline as input.
      Prefer open source, self-hostable, standards-based technologies.
      Do not limit the review to the technology stack chosen at project inception. Treat the original stack as the current baseline and evaluate whether newer open source frameworks, runtimes, libraries or quality tools materially improve security, maintainability, portability, cost or ecosystem health.
      If a proprietary or paid-only dependency is introduced as mandatory, stop unless an ADR exception exists or is created.
      If a beneficial upgrade or migration is identified but is not required to safely finish the current backlog item, create or update a technical-debt backlog item under 08-qa/technical-debt/ with impact, risk, effort, estimated cost, affected components and incremental remediation triggers.
      Produce the open_source_first_assessment section for the backlog security-quality evidence.

  - id: PROMPT-SQ-001
    name: Backlog security and quality gate
    intent: Run or document all security and quality checks required for a code-changing backlog item.
    expected_output:
      - security-quality-evidence.yaml
      - security-quality-evidence.md
      - pass_fail_decision
      - blocking_findings
      - accepted_risks
      - technical_debt_first_action
      - duplicate_code_summary
      - complexity_summary
      - owasp_or_secure_code_summary
      - message_externalization_summary
      - technical_debt_backlog_updates
    prompt: |
      For the selected backlog item, identify changed backend, web, mobile, API, dependency, container and deployment surfaces.
      Before implementing feature code, load 08-qa/technical-debt/technical-debt-index.yaml. If open debt exists, select at least one item by the standard's selection order and resolve or materially reduce it before feature work. If no open debt exists, record that explicitly in evidence.
      Probe the required toolchain first (runtime versions, build tools, package managers, native build binaries, Docker/database services and command paths) and compare it with the project runbook and stack baseline.
      Run applicable open source checks for tests, best practices, coding standards, duplicate code, complexity, SAST/static analysis, OWASP or equivalent secure-code rules, dependency vulnerabilities across all severities, secrets, coverage, contract quality and DAST when a runnable surface exists.
      If a mandatory executable gate cannot run because Maven, Java, Node, npm, a native package, Docker, database service, network endpoint or equivalent toolchain dependency is missing, unsupported or blocked, attempt documented remediation or request approval for the required install/network access. Do not replace the gate with manual source review.
      Confirm the stack-specific quality toolchain is complete for the changed surface. For Java/Maven changes, evaluate the Java baseline tools from the standard and run, add, document as not applicable or register technical debt for each relevant category.
      Review new or changed user-visible messages, validation copy, error prose, status labels, domain error codes and repeated magic strings or values. Externalize them through the stack's message catalog, constants, configuration or policy provider, or register immediate technical debt with owner and target backlog.
      Run a technology evolution review even when the backlog item does not introduce a new stack. Compare the touched components and dependencies against current open source, security, maintenance and ecosystem signals.
      Do not ignore low, medium, informational or unknown vulnerability findings. Fix them or provide accepted-risk disposition with an immediate target backlog according to the standard.
      Do not block normal delivery for non-security modernization findings that are not required to safely complete the current slice. Instead, register them as gradual technical debt under 08-qa/technical-debt/ and link them to future backlog work that touches the affected components.
      Use the project's existing toolchain first. Add lightweight open source tools only when they fit the stack and can run reproducibly without vendor lock-in.
      Write evidence under 08-qa/security-quality/<backlog-item-id>/.
      Do not close the backlog item when vulnerabilities of any severity, secure-code findings, secrets, failing tests, missing duplicate/complexity/OWASP analysis, undocumented coverage regressions, unresolved hard-coded messages/magic strings, missing debt-first action or unexecuted mandatory gates remain unresolved.
      Do not use passed_with_execution_limitation or closed_with_execution_limitation as final states. Use blocked_by_environment or ready_for_external_validation, keep next_backlog_item unchanged, and write exact remediation commands when required gates cannot run in the current environment.

  - id: PROMPT-SQ-002
    name: Module closeout security and quality gate
    intent: Validate aggregate module quality before moving to the next module.
    expected_output:
      - aggregate_security_quality_report
      - module_closeout_decision
      - release_blockers
      - unresolved_technology_debt_summary
      - debt_first_execution_summary
    prompt: |
      Before closing a module, aggregate all backlog security-quality evidence for the module.
      Confirm SAST/static analysis, best-practice and standards checks, duplicate-code checks, complexity checks, OWASP or secure-code checks, dependency scans across all severities, coverage, DAST where applicable, tests, contract checks, SBOM, license review, stack market validation, message externalization/i18n review and technology evolution reviews are present or explicitly not applicable with reasons.
      Confirm each code-changing iteration addressed at least one existing technical-debt item before feature work, unless no open debt existed at that iteration start.
      Re-run required executable gates or verify that each has already passed in non-limited evidence. Do not accept passed_with_execution_limitation, closed_with_execution_limitation, not_executed, blocked_by_missing_toolchain, blocked_by_network or blocked_by_unsupported_runtime as closure evidence.
      Review 08-qa/technical-debt/ and confirm all technology debt discovered during the module is accepted, prioritized, resolved or explicitly scheduled for immediate or gradual remediation according to risk.
      Update module closeout QA evidence and PROJECT_STATE.yaml.
      Do not recommend the next module when unresolved vulnerabilities of any severity lack disposition, when secure-code findings remain open, when debt-first execution is missing, or when any required executable gate has not actually run.

  - id: PROMPT-SQ-003
    name: Technology debt backlog update
    intent: Convert non-blocking modernization, migration or quality-tooling findings into gradual technical debt backlog items.
    expected_output:
      - technical-debt-index.yaml
      - technical_debt_item_yaml
      - remediation_triggers
      - backlog_recommendation
    prompt: |
      Load the Open Source First Security and Quality Standard and the target project technical debt index.
      For each non-blocking finding related to outdated dependencies, deprecated frameworks, unsupported runtimes, quality tooling gaps, lock-in risk or recommended open source migration, create or update a debt item under 08-qa/technical-debt/.
      Include affected components, current state, recommended target state, reason, risk, urgency, estimated effort, estimated cost impact, migration strategy, incremental remediation triggers, dependencies and acceptance criteria.
      Prefer gradual remediation tied to normal backlog work that already touches the affected components.
      Promote the debt item to blocking when the finding has no accepted-risk disposition, prevents required quality gates from running, or involves an unsupported runtime that makes continued development unsafe.
