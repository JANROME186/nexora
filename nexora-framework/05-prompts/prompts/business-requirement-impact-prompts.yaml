artifact:
  id: NXF-PROMPTS-BR-IMPACT-001
  type: prompt-playbook
  name: Business Requirement Version and Impact Prompts
  version: 1.0.0
  status: approved
  human_readable: business-requirement-impact-prompts.md
  machine_readable: business-requirement-impact-prompts.yaml
  owner: Nexora Product Architecture

purpose: Provide agent-agnostic prompts for resolving the latest business requirement version and estimating impact, effort, timeline and cost after requirement changes.

prompts:
  resolve_latest_business_requirement:
    id: PROMPT-BR-RESOLVE-001
    name: Resolve latest business requirement version
    prompt: |
      Resolve the latest BUSINESS_REQUIREMENT version for the target project.

      Target project:
      projects/<project-slug>/

      Load:
      - nexora-framework/02-standards/standards/business-requirement-versioning-standard.yaml
      - projects/<project-slug>/SOURCE_OF_TRUTH.yaml if present
      - projects/<project-slug>/00-intake/business-requirements/BUSINESS_REQUIREMENT_INDEX.yaml if present
      - projects/<project-slug>/BUSINESS_REQUIREMENT.md
      - projects/<project-slug>/BUSINESS_REQUIREMENT.yaml if present

      Rules:
      - Use BUSINESS_REQUIREMENT_INDEX.yaml current.version and current.file when the index exists.
      - If the index is missing, use projects/<project-slug>/BUSINESS_REQUIREMENT.md as current source.
      - If the latest version is ambiguous, stop and ask the requester to confirm the active version.
      - Validate whether BUSINESS_REQUIREMENT.yaml reflects the current Markdown source.
      - Do not invent requirements.

      Output:
      - Current business requirement version.
      - Current business requirement file.
      - Previous comparable version when known.
      - Whether YAML regeneration is required.
      - Whether impact assessment is required.

  estimate_business_requirement_change_impact:
    id: PROMPT-BR-IMPACT-001
    name: Estimate business requirement change impact
    prompt: |
      Analyze the impact of the latest BUSINESS_REQUIREMENT change for the target project.

      Target project:
      projects/<project-slug>/

      Load:
      - nexora-framework/02-standards/standards/business-requirement-versioning-standard.yaml
      - projects/<project-slug>/00-intake/business-requirements/BUSINESS_REQUIREMENT_INDEX.yaml
      - current BUSINESS_REQUIREMENT.md
      - previous comparable BUSINESS_REQUIREMENT.md when available
      - projects/<project-slug>/BUSINESS_REQUIREMENT.yaml
      - projects/<project-slug>/SOURCE_OF_TRUTH.yaml
      - projects/<project-slug>/PROJECT_STATE.yaml
      - current capability map, dependency map, requirements catalog, contracts, delivery backlog and implementation state when available.

      Required work:
      - Compare current requirement against previous comparable version.
      - Classify detected changes.
      - Identify impacted business capabilities.
      - Identify impacted requirements, domain components, architecture components, contracts, UI/mobile surfaces, data migration, marketplace model, tests, QA and operations.
      - Estimate effort in person-days and t-shirt size.
      - Estimate timeline in calendar days with confidence level.
      - Estimate cost only if a rate card exists; otherwise mark cost as requires_rate_card.
      - Document assumptions, risks, decisions and recommendation.

      Required outputs:
      - projects/<project-slug>/00-intake/business-requirements/impact-assessments/<version>/business-requirement-impact-assessment.yaml
      - projects/<project-slug>/00-intake/business-requirements/impact-assessments/<version>/business-requirement-impact-assessment.md

      Before finishing:
      - Validate YAML parsing.
      - Update SOURCE_OF_TRUTH.yaml with the new impact assessment files.
      - Update PROJECT_STATE.yaml with the analyzed business requirement version and impact status.
      - Do not modify implementation code unless explicitly instructed after impact acceptance.

minimal_user_prompts:
  resolve_latest: "Resolve the latest BUSINESS_REQUIREMENT version for projects/<project-slug>/ and report whether derived YAML or impact assessment is required."
  estimate_impact: "Analyze the impact of the latest BUSINESS_REQUIREMENT change for projects/<project-slug>/ and estimate impacted components, effort, time and cost."
