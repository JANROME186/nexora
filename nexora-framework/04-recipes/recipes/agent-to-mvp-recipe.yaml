artifact:
  id: NXF-REC-001
  type: agent-recipe
  name: Nexora Agent-to-MVP Recipe
  version: 1.0.0
  status: approved
  owner: Nexora Engineering

inputs:
  required:
    - projects/<project-slug>/BUSINESS_REQUIREMENT.md
    - projects/<project-slug>/PROJECT_BRIEF.md
    - projects/<project-slug>/PROJECT_BRIEF.yaml
    - nexora-framework/02-standards/standards/project-folder-standard.yaml
    - nexora-framework/02-standards/standards/documentation-standard.yaml
    - nexora-framework/02-standards/standards/open-source-first-security-quality-standard.yaml
  optional:
    - existing_source_material
    - reference_systems
    - regulatory_constraints
    - design_preferences

phases:
  - id: PHASE-001
    name: Intake normalization
    goal: Validate requester-supplied business requirement and convert it into structured project context.
    outputs:
      - PROJECT_BRIEF.md
      - PROJECT_BRIEF.yaml
      - 00-intake/user-needs.yaml
      - 00-intake/assumptions.md

  - id: PHASE-002
    name: Product definition
    goal: Define product scope, personas, capabilities and MVP boundary.
    outputs:
      - 01-product-definition/product.yaml
      - 01-product-definition/capability-map.yaml
      - 01-product-definition/capability-dependency-map.yaml

  - id: PHASE-003
    name: Domain foundation
    goal: Define bounded contexts, aggregates, vocabulary, actors, processes and rules.
    outputs:
      - 02-domain-definition/context-map.yaml
      - 02-domain-definition/aggregate-catalog.yaml
      - 02-domain-definition/actor-catalog.yaml
      - 02-domain-definition/reference-processes.yaml
      - 02-domain-definition/business-rules-catalog.yaml

  - id: PHASE-004
    name: Architecture baseline
    goal: Define application, technology, data, security, integration, AI, deployment, client stack market validation and open-source-first quality architecture.
    outputs:
      - 03-architecture/application-architecture.yaml
      - 03-architecture/technology-architecture.yaml
      - 03-architecture/client-stack-market-validation.yaml
      - 03-architecture/stack-quality-toolchain-baseline.yaml
      - 03-architecture/security-architecture.yaml
      - 03-architecture/integration-architecture.yaml
      - 03-architecture/open-source-first-technology-baseline.yaml
      - 03-architecture/security-quality-gates.yaml
      - 08-qa/technical-debt/README.md
      - 08-qa/technical-debt/technical-debt-index.yaml

  - id: PHASE-005
    name: MVP delivery framework
    goal: Convert definition into executable implementation modules.
    outputs:
      - 06-delivery/mvp-framework.yaml
      - 06-delivery/modules/<module-id>/module-definition.yaml
      - 06-delivery/modules/<module-id>/api-contract.openapi.yaml
      - 06-delivery/modules/<module-id>/test-plan.md
      - 06-delivery/modules/<module-id>/test-plan.yaml
      - 06-delivery/modules/<module-id>/domain-model.md
      - 06-delivery/modules/<module-id>/domain-model.yaml
      - 06-delivery/modules/<module-id>/database-migration-plan.md
      - 06-delivery/modules/<module-id>/database-migration-plan.yaml
      - 06-delivery/modules/<module-id>/ui-screen-map.md
      - 06-delivery/modules/<module-id>/ui-screen-map.yaml
      - 06-delivery/modules/<module-id>/security-and-audit-rules.md
      - 06-delivery/modules/<module-id>/security-and-audit-rules.yaml
      - 06-delivery/modules/<module-id>/traceability.yaml

  - id: PHASE-006
    name: Development readiness gate
    goal: Decide whether coding may start.
    outputs:
      - PROJECT_STATE.yaml
      - SOURCE_OF_TRUTH.yaml
    readiness_condition:
      status: ready
      blocking_definition_gaps: []

rules:
  - Never start analysis without BUSINESS_REQUIREMENT.md.
  - BUSINESS_REQUIREMENT.md is supplied by the requester and must not be generated by an agent.
  - If BUSINESS_REQUIREMENT.md is missing, stop and request it before creating project definitions.
  - Never start implementation without PROJECT_BRIEF.md and PROJECT_BRIEF.yaml.
  - Agent-executable artifacts must have YAML machine-readable files and Markdown human-readable companions when applicable.
  - Never place project-specific artifacts outside the project folder.
  - Never skip actor, process, rule and contract traceability.
  - Do not introduce provider lock-in unless the project brief explicitly requires it.
  - Prefer open source, self-hostable and standards-based technologies unless an ADR approves an exception.
  - Validate any requester-proposed or existing stack against current stable or LTS versions, official lifecycle sources, security advisories, ecosystem health and required quality gates before accepting it as the implementation baseline.
  - Define a stack-specific quality toolchain baseline during architecture analysis; for Java/Maven, evaluate SonarLint, SpotBugs, Find Security Bugs, Checkstyle, PMD, PMD CPD, JaCoCo, OWASP Dependency-Check, Trivy, CycloneDX Maven Plugin, Maven Enforcer, License Maven Plugin, PIT/Pitest, ArchUnit, OpenRewrite and Semgrep CE according to applicability.
  - Define security quality gates for SAST/static analysis, DAST when applicable, dependency vulnerability checks, secrets scan and coverage before implementation starts.
  - Treat the initial technology stack as a baseline, not a permanent constraint; every code-changing backlog item must review whether safer, better maintained or more cost-effective open source technology options now exist.
  - Create or update technology debt backlog items for non-blocking upgrades, migrations or tooling gaps, and remediate them gradually when affected components are touched.
  - Implementation starts with the first module definition package, not with an empty app scaffold.
