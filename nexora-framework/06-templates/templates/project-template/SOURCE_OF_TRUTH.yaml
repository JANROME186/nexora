artifact:
  id: PROJECT-SOT
  type: source-of-truth-registry
  version: 0.1.0
  status: draft
sources:
  business_requirement: BUSINESS_REQUIREMENT.md
  project_brief: PROJECT_BRIEF.md
  project_brief_yaml: PROJECT_BRIEF.yaml
  project_state: PROJECT_STATE.yaml
  client_stack_market_validation: 03-architecture/client-stack-market-validation.yaml
  stack_quality_toolchain_baseline: 03-architecture/stack-quality-toolchain-baseline.yaml
  local_solution_runbook: 09-operations/runbooks/local-solution-runbook.md
  local_solution_runbook_yaml: 09-operations/runbooks/local-solution-runbook.yaml
  technical_debt_index: 08-qa/technical-debt/technical-debt-index.yaml
  technical_debt_readme: 08-qa/technical-debt/README.md
  framework_feedback_index: 08-qa/framework-feedback/framework-feedback-index.yaml
  framework_feedback_readme: 08-qa/framework-feedback/README.md
rules:
  - This project folder is the boundary for project-specific artifacts.
  - Agent-executable artifacts must have YAML machine-readable files and Markdown human-readable companions when applicable.
  - BUSINESS_REQUIREMENT.md is requester-supplied and must not be generated by an agent.
  - Requester-proposed or existing stack must be validated against current stable or LTS open source market practice before implementation.
  - Stack-specific quality toolchain baseline must be defined and revisited during backlog execution, module closeout and release readiness.
  - Missing mandatory validation tooling for an existing touched stack must be registered as technical debt before closure; "if configured", "if scripts exist" or undocumented not-applicable dispositions are not valid closure evidence.
  - Integrated local solution runbook must be maintained whenever runtime components, ports, environment variables, startup order or validation commands change.
  - Technology debt must be registered under 08-qa/technical-debt/ when quality, vulnerability, dependency, framework or technology reviews identify non-blocking modernization work.
  - Framework feedback must be registered under 08-qa/framework-feedback/ when execution reveals reusable improvements to the Nexora framework.
  - Agents may propose framework improvement backlog items but must not implement them unless Nexora explicitly assigns the work.
  - Generated artifacts must not be edited manually.
