    documentation: nexora-framework/02-standards/standards/documentation-standard.yaml
    agent_agnostic: nexora-framework/02-standards/standards/agent-agnostic-standard.yaml
    model_driven_product_engineering: nexora-framework/02-standards/standards/model-driven-product-engineering-standard.yaml
