    agent_agnostic: nexora-framework/02-standards/standards/agent-agnostic-standard.yaml
  recipe:
    agent_to_mvp: nexora-framework/04-recipes/recipes/agent-to-mvp-recipe.yaml
  prompts:
    generic_project_lifecycle: nexora-framework/05-prompts/prompts/generic-project-lifecycle-prompts.yaml
    auxiliary_development: nexora-framework/05-prompts/prompts/auxiliary-development-prompts.yaml
  orchestration:
    project_analysis_to_mvp: nexora-framework/03-orchestration/project-orchestration/project-analysis-and-mvp-workflow.yaml
  template:
    new_project: nexora-framework/06-templates/templates/project-template/

projects:
  healthcare_operations_platform:
    path: projects/healthcare-operations-platform/
    status: mvp_implementation_in_progress
    business_requirement: projects/healthcare-operations-platform/BUSINESS_REQUIREMENT.md
