repository:
  id: nexora
  name: Nexora
  type: multi-project-agent-ready-definition-repository
  version: 0.44.0
  status: ready

company:
  name: Nexora
  focus:
    - software_development
    - artificial_intelligence
    - ai_assisted_engineering
    - business_automation
    - saas_platforms
    - deployable_enterprise_software

framework:
  path: nexora-framework/
  purpose: Defines how Nexora documents and prepares AI-agent-assisted software solutions.
  standards:
    project_folder: nexora-framework/standards/project-folder-standard.yaml
    documentation: nexora-framework/standards/documentation-standard.yaml
    agent_agnostic: nexora-framework/standards/agent-agnostic-standard.yaml
  recipe:
    agent_to_mvp: nexora-framework/recipes/agent-to-mvp-recipe.yaml
  template:
    new_project: nexora-framework/templates/project-template/

projects:
  healthcare_operations_platform:
    path: projects/healthcare-operations-platform/
    status: ready_for_mvp_development
    project_brief: projects/healthcare-operations-platform/PROJECT_BRIEF.md
    ordered_development_guide: projects/healthcare-operations-platform/ORDERED_DEVELOPMENT_GUIDE.md
    source_of_truth: projects/healthcare-operations-platform/SOURCE_OF_TRUTH.yaml
    ready_to_start_module: MVP-MOD-001

agent_policy:
  agent_agnostic: true
  repository_loading_order:
    - AGENT_BOOTSTRAP.md
    - SOURCE_OF_TRUTH.yaml
    - nexora-framework/README.md
    - nexora-framework/standards/agent-agnostic-standard.md
    - nexora-framework/recipes/agent-to-mvp-recipe.md
    - target_project/SOURCE_OF_TRUTH.yaml
    - target_project/PROJECT_BRIEF.md
