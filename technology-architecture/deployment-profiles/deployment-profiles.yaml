id: TECH-DEPLOY-001
artifact_type: deployment_profiles
version: 0.18.0
profiles:
  local:
    orchestrator: docker_compose
    requires_cloud: false
    target: developer_laptop
    required_services: [api, web, postgresql, redis, object_storage, mail_catcher]
  team:
    orchestrator: docker_compose_or_swarm
    requires_cloud: false
    target: shared_server
    required_services: [api, web, workers, postgresql, redis, object_storage, reverse_proxy]
  on_premise:
    orchestrator: docker_swarm_or_kubernetes
    requires_cloud: false
    target: customer_datacenter
    required_services: [api, web, workers, postgresql, redis, object_storage, messaging, observability]
  enterprise_kubernetes:
    orchestrator: kubernetes
    requires_cloud: false
    target: enterprise_cluster
    required_services: [api, web, workers, postgresql, redis, object_storage, messaging, observability, ingress]
  saas_cloud:
    orchestrator: kubernetes_or_equivalent
    requires_cloud: optional
    target: managed_saas
    required_services: [api, web, workers, managed_database, managed_cache, managed_object_storage, observability]
portability_rule: environment_differences_must_be_configuration_or_infrastructure_only
